를 손댔거나, 사진 색감이 다르거나, 템플릿을 다시 골랐거나."}, {"title": "🔎 더 깊이", "md": "- 여기서 만든 템플릿은 <a class=\"xref\" href=\"#10\">Stage 10<\/a>에서 계속 씁니다. 매번 새로 만들지 않습니다.\n- 그림 안 글자의 대체 텍스트는 이 스테이지 7절 「접근성 3종」과 이어집니다.\n- 검색해 볼 말 — `carousel post design`, `1080x1350`, `save rate social`\n- 캔바 유료 기능(브랜드 킷)이 필요해지는 시점의 판단은 <a class=\"xref\" href=\"#부록\">부록<\/a>에."}]}, {"file": "09-캐릭터.md", "id": "s4-9", "no": "9", "title": "캐릭터 일관성 — 생성이 아니라 편집으로", "through": "매번 새로 만들면 얼굴이 바뀐다. 한 장을 잘 만들고 그것을 편집한다.", "time": "70분", "need": ["어도비 계정", "5절의 무드보드"], "head": "", "secs": [{"title": "왜 이걸 하나", "md": "브랜드 캐릭터를 하나 만들어서 여러 장면에 쓰고 싶은 상황을 생각해 봅시다.\n카드뉴스 여덟 장, 소개 페이지, 프로필 그림.\n\nAI에게 \"같은 캐릭터를 책상 앞에, 걸어가는 모습으로, 웃는 얼굴로\" 시켜 보면\n**전부 다른 사람이 나옵니다.** 머리 모양이 바뀌고 나이가 바뀌고 옷이 바뀝니다.\n프롬프트를 아무리 자세하게 써도 마찬가지입니다.\n\n여기서 대부분 포기하거나, 전용 도구를 찾아 헤매게 됩니다.\n**그럴 필요가 없습니다. 방향을 뒤집으면 됩니다.**\n\n이 절은 이 스테이지에서 가장 중요한 절입니다.\n여기서 익히는 사고방식 — **\"생성으로 안 되면 편집으로\"** — 은 캐릭터 말고도 계속 쓰입니다."}, {"title": "왜 안 되는지부터", "md": "AI 그림 도구는 **매번 처음부터 새로 그립니다.**\n\"검은 단발머리 30대 여성\"이라고 말하면 그 조건에 맞는 사람을 **새로 상상해서** 그립니다.\n조건에 맞는 얼굴은 수천만 개가 있고, 매번 다른 하나가 나옵니다.\n\n즉 **글자만으로 같은 얼굴을 매번 새로 만드는 것은 실패합니다.**\n이건 프롬프트를 못 써서가 아니라 **방식 자체가 그렇게 되어 있어서**입니다.\n\n포기해야 할 기대는 이것 하나입니다.\n**\"프롬프트를 더 정교하게 쓰면 얼굴이 고정될 것이다.\"** — 안 됩니다."}, {"title": "★ 방향을 뒤집습니다 — 한 장을 잘 만들고 그것을 편집한다", "md": "| 안 되는 길 | 되는 길 |\n|---|---|\n| 장면마다 프롬프트로 **새로 생성** → 얼굴이 매번 바뀐다 | **한 장을 잘 만들고 그 장을 편집** → 얼굴이 안 바뀐다 |\n\n편집은 **이미 있는 그림의 픽셀을 건드리는 일**입니다.\n얼굴을 안 건드리면 얼굴은 그대로입니다. 당연한 이야기인데, 이게 답입니다.\n\n### 다섯 단계\n\n**① 기준 컷 한 장을 공들여 만듭니다**\n\n이 한 장에 시간을 다 씁니다. 스무 번을 다시 만들어도 됩니다.\n정면 또는 살짝 비스듬한 각도, 표정은 무난하게, 배경은 단순하게.\n**이 한 장이 앞으로 모든 그림의 원본이 됩니다.**\n\n**② 생성형 확장으로 배경을 넓힙니다**\n\n기준 컷이 가로로 짧으면 카드뉴스나 배너에 못 씁니다.\n그림의 가장자리를 바깥으로 늘려 주는 기능을 씁니다. **캐릭터는 그대로 두고 주변만 생겨납니다.**\n세로 그림 하나로 가로 배너를 만들 수 있습니다.\n\n**③ 영역 채우기로 배경과 소품만 바꿉니다**\n\n\"이 부분을 이렇게 바꿔라\"고 지정해서 그 부분만 다시 그리게 하는 기능입니다.\n배경을 사무실에서 카페로, 손에 든 물건을 컵에서 노트로.\n**얼굴 영역만 안 건드리면 얼굴은 절대 안 바뀝니다.**\n\n여기에 **프롬프트로 영역을 지정하는 기능**을 쓰면 더 쉽습니다.\n\"배경\"이라고 말하면 배경만 골라 줍니다. 손으로 칠할 필요가 없습니다.\n\n**④ 배경을 제거해서 다른 장면에 얹습니다**\n\n캐릭터만 오려 냅니다. 그러면 어떤 배경에도 얹을 수 있습니다.\n카드뉴스 여덟 장에 같은 캐릭터를 놓는 가장 확실한 방법입니다. **오려 낸 것은 절대 안 변합니다.**\n\n**⑤ 벡터화해서 크기를 자유롭게 만듭니다**\n\n그림을 선과 면의 정보로 바꾸는 것입니다.\n그러면 **아무리 키워도 안 깨집니다.** 명함 크기부터 현수막까지 같은 그림을 씁니다.\n단순한 그림체일수록 잘 됩니다.\n\n### 순서를 그림으로\n\n```\n기준 컷 1장 (공들여)\n   ↓\n배경 넓히기 → 비율이 필요한 만큼\n   ↓\n영역 채우기 → 배경·소품·옷 바꾸기 (얼굴은 손대지 않음)\n   ↓\n배경 제거 → 캐릭터만 오려내기\n   ↓\n벡터화 → 크기 자유\n   ↓\n장면마다 얹어서 쓰기\n```"}, {"title": "참조 3~5장은 여전히 유효합니다", "md": "편집으로 간다고 참조가 필요 없어지는 건 아닙니다.\n새 그림을 만들 때 **얼굴 참조를 함께 주는 것**은 그대로 효과가 있습니다.\n\n- **정면** 1장\n- **3/4 각도**(살짝 옆으로) 1~2장\n- **측면** 1장\n\n이 셋에서 다섯 장을 만들어 두고, **5절에서 만든 보드에 모아 둡니다.**\n매번 찾아 헤매지 않게, 한 자리에 있어야 합니다.\n안정성이 더 필요하면 각도를 여덟 개까지 늘립니다. 다만 **참조가 많다고 무조건 좋아지진 않습니다.**"}, {"title": "캐릭터 바이블 — 다섯 칸", "md": "캐릭터를 계속 쓸 거라면 **문서로 적어 둡니다.** 머릿속에 있으면 다음 달에 달라집니다.\n\n| 칸 | 무엇 |\n|---|---|\n| **턴어라운드** | 같은 캐릭터의 정면·3/4·측면·뒷모습 그림 |\n| **색 팔레트** | 피부·머리·옷의 색 값. **규칙표처럼 숫자로** 적습니다 |\n| **표정 세트** | 기본 · 웃음 · 곤란함 정도 셋이면 시작으로 충분 |\n| **포즈** | 자주 쓸 자세 두세 개 (서 있기, 앉아서 작업, 가리키기) |\n| **금지 사항** | 하지 말아야 할 것. **이게 가장 중요합니다** |\n\n금지 사항 예 — \"안경을 씌우지 않는다\" \"머리 길이를 바꾸지 않는다\" \"옷 색은 팔레트 밖으로 나가지 않는다\".\n**금지 목록이 있으면 AI가 덜 헤맵니다.** 4절 「하지 말 것」과 같은 원리입니다."}, {"title": "새로 생성해야 할 때 — 프롬프트 4단", "md": "편집으로 안 되고 꼭 새로 만들어야 할 때가 있습니다. 그때는 순서를 지킵니다.\n\n```\n[1. 정체성 앵커]\n검은 단발머리, 둥근 안경, 겨자색 니트를 입은 30대 여성.\n얼굴형은 둥글고 눈은 크지 않음. 참조 이미지의 인물과 동일 인물.\n\n[2. 대상과 행동]\n책상 앞에 앉아 노트북 화면을 보며 메모하고 있다.\n\n[3. 구도]\n상반신, 살짝 비스듬한 각도(3/4), 왼쪽에 인물 오른쪽에 여백.\n\n[4. 금지]\n얼굴을 바꾸지 마. 머리 길이·안경 모양·니트 색을 바꾸지 마.\n나이를 바꾸지 마. 참조 이미지의 얼굴을 그대로 유지해.\n```\n\n**4단이 가장 중요합니다.** 금지를 안 쓰면 AI가 \"더 예쁘게\" 바꿔 놓습니다.\n그리고 **참조 이미지를 반드시 함께 올립니다.** 글만으로는 안 됩니다.\n\n이렇게 해도 얼굴이 바뀌면 — **세 번에서 멈춥니다**(5절 「세 번 규칙」).\n네 번째 프롬프트 대신 **편집으로 돌아갑니다.**"}, {"title": "📘 말 풀이", "md": "**생성형 확장(generative expand)**\n그림의 바깥쪽을 AI가 이어 그려서 화면을 넓히는 것. 세로 그림을 가로로 만들 때 씁니다. 원래 있던 부분은 안 건드립니다.\n\n**영역 채우기(generative fill)**\n그림의 일부만 골라서 그 부분만 다시 그리게 하는 것. 배경이나 소품을 바꿀 때 씁니다. 고르지 않은 부분은 그대로 남습니다.\n\n**벡터화(vectorize)**\n점으로 된 그림을 선과 면의 정보로 바꾸는 것. 크기를 키워도 안 깨집니다."}, {"title": "⚠️ 자주 걸리는 함정", "md": "- **기준 컷을 대충 만듭니다.** 여기가 원본입니다. **여기에 시간을 다 씁니다.** 나중에 백 장이 이 한 장에서 나옵니다.\n- **프롬프트를 계속 정교하게 씁니다.** 방식의 한계라 안 됩니다. 세 번에서 멈추고 편집으로 갑니다.\n- **영역 채우기로 얼굴을 건드립니다.** 얼굴이 포함되는 순간 다른 사람이 됩니다. **얼굴 밖만** 고칩니다.\n- **참조를 매번 새로 찾습니다.** 보드에 모아 두지 않으면 매번 다른 참조를 쓰게 되고, 그럼 결과도 매번 달라집니다.\n- **금지 사항을 안 적습니다.** AI는 \"개선\"을 하려 합니다. 막지 않으면 안경을 씌우고 머리를 기르게 합니다.\n- **사람 얼굴로 실존 인물을 닮게 만듭니다.** 실제 인물을 닮은 얼굴을 만들거나 쓰지 않습니다. 캐릭터는 실존 인물과 구분되게 만듭니다."}, {"title": "⚡ 이렇게 하세요", "md": "1. 5절의 보드에 **캐릭터 칸**을 만듭니다.\n2. 기준 컷 한 장을 만듭니다. **마음에 들 때까지 다시 만듭니다.** 이 단계에서 시간을 아끼지 않습니다.\n3. 그 한 장에서 **정면 · 3/4 · 측면**을 만들어 참조 3~5장을 갖춥니다. 보드에 넣습니다.\n4. 캐릭터 바이블 다섯 칸을 문서로 적습니다. **금지 사항 세 줄은 반드시.**\n5. 이제 장면을 만듭니다. **편집으로만** 갑니다.\n\n```\n아래 순서로 이 캐릭터를 다른 장면에 넣어줘. 얼굴은 어떤 단계에서도 건드리지 마.\n\n1) 배경을 넓혀서 가로로 긴 비율로 만들어줘. 인물 위치는 왼쪽에 두고 오른쪽에 여백을 만들어줘\n2) 배경만 골라서 카페 실내로 바꿔줘. 인물과 옷은 그대로 둬\n3) 인물만 남기고 배경을 제거해줘\n4) 결과를 크기 조절해도 안 깨지는 형태로 바꿔줘\n\n각 단계마다 결과를 보여주고, 얼굴이 바뀌었는지 내가 확인할 수 있게 원본과 나란히 보여줘.\n```\n\n6. 각 단계마다 **원본 얼굴과 나란히 놓고 봅니다.** 바뀌었으면 그 단계를 다시 합니다."}, {"title": "✅ 됐는지 확인", "md": "- [ ] **기준 컷 한 장**이 있고, 그 파일이 어디 있는지 아나\n- [ ] 참조 3~5장(정면·3/4·측면)이 **한 자리에 모여** 있나\n- [ ] 캐릭터 바이블 다섯 칸을 **문서로** 적었나\n- [ ] **금지 사항이 세 줄 이상** 있나\n- [ ] 편집으로 만든 그림 셋을 나란히 놓았을 때 **같은 인물로 보이나**\n- [ ] 배경만 바꾼 그림에서 **얼굴이 원본과 똑같은가** (눈·코 위치를 나란히 비교해 봤나)\n\n「같은 인물로 보이나」가 «아니오»면 대개 **어딘가에서 새로 생성했기 때문**입니다. 편집만 썼는지 되짚어 봅니다."}, {"title": "🔎 더 깊이", "md": "- 여기서 만든 캐릭터는 8절 카드뉴스와 <a class=\"xref\" href=\"#10\">Stage 10<\/a>에서 계속 씁니다.\n- 도구별로 어느 단계를 어디서 하는지는 다음 절 「도구 셋의 자리」에 표로 있습니다.\n- 검색해 볼 말 — `character sheet turnaround`, `generative fill`, `character consistency reference images`\n- AI로 만든 사람 그림을 상업적으로 쓸 때의 표시와 권리 문제는 <a class=\"xref\" href=\"#10\">Stage 10<\/a>에서 다룹니다."}]}, {"file": "10-도구순서.md", "id": "s4-10", "no": "10", "title": "도구 셋의 자리와 이동 순서", "through": "도구를 늘리지 않는다. 각자 자리를 정하고 순서대로 지나간다.", "time": "45분", "need": ["피그마 계정", "캔바 계정", "어도비 계정"], "head": "", "secs": [{"title": "왜 이걸 하나", "md": "여기까지 오면 도구가 셋입니다. 피그마, 캔바, 어도비.\n셋이 하는 일이 겹쳐 보이기 때문에 **매번 \"이건 어디서 하지?\"에서 멈춥니다.**\n그 망설임이 쌓이면 작업이 안 굴러갑니다.\n\n이 절에서 **각 도구의 자리를 못 박고, 지나가는 순서를 정합니다.**\n정하고 나면 다시 고민하지 않습니다. 그게 목적입니다."}, {"title": "도구 셋의 자리", "md": "| 도구 | **무엇에 쓰나** | **안 쓰는 곳** |\n|---|---|---|\n| **피그마** | **규칙 저장소.** 색·간격·글꼴을 변수로 등록하고, 화면 뼈대를 그립니다 | **발행물을 대량으로 찍어내는 일.** 카드뉴스 여덟 장을 여기서 만들지 않습니다 |\n| **캔바** | **발행물.** 카드뉴스·배너·문서. 템플릿 하나를 고정해서 텍스트만 갈아 끼웁니다 | **웹 화면 설계와 코드.** 여기서 만든 것은 코드가 되지 않습니다 |\n| **어도비** | **편집과 마무리.** 배경 제거 · 색과 노출 보정 · 블러와 그레인 · 영역 지정과 채우기 · 배경 넓히기 · 벡터화 · 참조를 모으는 보드 · 영상 편집 | **처음부터 새로 생성하는 일.** 여기는 이미 있는 것을 손보는 자리입니다 |\n\n한 줄로 외웁니다.\n**피그마는 규칙, 캔바는 발행, 어도비는 마무리.**\n\n### 짚어 둘 것 둘\n\n**캔바는 무료 플랜입니다.** 브랜드 킷을 만들 수 없습니다.\n그래서 일관성은 **템플릿 고정 → 텍스트만 교체**로 잡습니다(8절). 이게 무료에서 되는 유일한 길입니다.\n\n**어도비는 편집 도구로 씁니다.** 생성 쪽이 아니라 **손보는 쪽이 강한 자리**입니다.\n9절에서 캐릭터를 \"생성이 아니라 편집으로\" 푼 것이 이 성질을 그대로 쓴 것입니다."}, {"title": "실제 이동 순서 — 여덟 걸음", "md": "앞 절들이 이 순서대로 놓여 있습니다. 위에서부터 그대로 지나갑니다.\n\n| 걸음 | 무엇을 | 어디서 | 어느 절 |\n|---|---|---|---|\n| **1** | 참조를 모은다 (색감·질감·여백·이건 아니다) | **어도비 보드** | 5절 |\n| **2** | 규칙 3종을 확정한다 (색·간격·글자) | **피그마 변수** | 1·2·3절 |\n| **3** | 그 규칙을 **지침 파일에 적는다** | 지침 파일 (Stage 3) | 3절 |\n| **4** | 랜딩 화면을 **코드로 만든다** | 코드 생성 | 6절 |\n| **5** | 그림·소재를 만든다 (기준 컷 포함) | 그림 생성 도구 | 9절 |\n| **6** | 만든 소재를 **편집하고 마무리한다** | **어도비** | 9절 |\n| **7** | 발행물을 찍는다 (카드뉴스·배너) | **캔바, 템플릿 고정** | 8절 |\n| **8** | **접근성 3종을 점검한다** | 화면에서 직접 | 7절 |\n\n세 걸음이 특히 자주 어긋납니다.\n\n- **3번을 건너뜁니다.** 피그마에만 규칙이 있으면 AI는 못 읽습니다. **파일에 적힌 것만 지켜집니다.**\n- **4번과 5번을 바꿉니다.** 그림을 먼저 잔뜩 만들고 화면을 짜면 그림이 안 맞아 다시 만들게 됩니다. **틀이 먼저, 소재가 나중.**\n- **8번을 나중으로 미룹니다.** 점검을 마지막으로 미루면 고칠 곳이 백 군데가 됩니다. 걸음마다 조금씩 봐 두는 게 낫습니다."}, {"title": "한글 글꼴 실무 — 무거운 게 문제입니다", "md": "한글 화면에서 반드시 걸리는 문제 하나를 짚습니다.\n\n**Pretendard가 사실상 표준**입니다. 무료로 쓸 수 있고 화면에서 잘 읽히고, 굵기가 여러 단계 있습니다.\n고민할 일이 있으면 여기서 시작하면 됩니다.\n\n문제는 **무게**입니다.\n\n영문 글꼴은 글자가 수십 개라 파일이 가볍습니다.\n한글은 **글자 수가 만 개가 넘습니다.** 그래서 **한글 웹폰트 파일은 수백 KB에서 수 MB**까지 갑니다.\n아무 처리 없이 그대로 불러오면 **첫 화면이 눈에 띄게 느려집니다.**\n글자가 늦게 나타나거나, 처음엔 다른 글꼴로 보이다가 갑자기 바뀝니다.\n\n처리 방법은 두 가지고, 둘 다 AI에게 시킬 수 있습니다.\n\n- **필요한 글자만 잘라 쓰기(서브셋)** — 실제로 쓰는 글자만 남겨 파일을 줄입니다\n- **글꼴이 늦게 와도 글을 먼저 보여 주기** — 글꼴을 기다리느라 화면이 비어 있지 않게 합니다\n\n**⚠️ 실측(2026-09-09)** — **어도비의 글꼴 검색은 한글 서체를 하나도 찾지 못합니다.**\n그래서 한글 글꼴은 **어도비에서 고르지 않습니다.** 이름을 정해서 웹에서 직접 가져다 씁니다."}, {"title": "도구를 늘리지 않습니다", "md": "새 도구가 눈에 띄면 늘리고 싶어집니다. **늘리지 않습니다.**\n<a class=\"xref\" href=\"#0\">Stage 0<\/a>에서 정한 원칙과 같습니다 — 도구를 늘릴수록 빨라지는 게 아니라 **흐름이 끊깁니다.**\n\n셋으로 못 하는 게 생기면 먼저 물어봅니다.\n**\"이건 정말 도구가 없어서 안 되는 건가, 아니면 순서를 안 지켜서 안 되는 건가?\"**\n대부분 뒤쪽입니다. 9절이 그 예입니다 — 전용 도구가 없어도 **편집으로 풀렸습니다.**"}, {"title": "📘 말 풀이", "md": "**웹폰트(web font)**\n사이트에 접속한 사람의 컴퓨터에 그 글꼴이 없어도 보이도록, 글꼴 파일을 같이 내려보내는 방식. 한글은 파일이 커서 처리가 필요합니다.\n\n**서브셋(subset)**\n글꼴 파일에서 실제로 쓰는 글자만 잘라 내 가볍게 만드는 것. 한글에서는 거의 필수입니다."}, {"title": "⚠️ 자주 걸리는 함정", "md": "- **도구마다 색을 눈으로 다시 고릅니다.** 세 도구에서 각각 고르면 세 가지 색이 됩니다. **규칙표의 값을 직접 입력합니다.**\n- **캔바에서 웹 화면을 설계합니다.** 예쁘게 나와도 코드로 못 넘어갑니다. 화면은 피그마와 코드에서 합니다.\n- **피그마에서 카드뉴스 여덟 장을 만듭니다.** 됩니다. 다만 느립니다. 발행물은 캔바입니다.\n- **어도비에서 처음부터 그림을 만들려 합니다.** 여기는 손보는 자리입니다. 만드는 것과 손보는 것을 섞지 않습니다.\n- **한글 글꼴을 그대로 불러옵니다.** 첫 화면이 느려집니다. 잘라 쓰기와 늦게 와도 글부터 보여 주기, 둘 다 겁니다.\n- **어도비에서 한글 글꼴을 찾습니다.** 안 나옵니다. 시간 낭비입니다."}, {"title": "⚡ 이렇게 하세요", "md": "1. 위 「도구 셋의 자리」 표를 **지침 파일에 그대로 붙입니다.** 다음에 헷갈리면 여기를 봅니다.\n2. **여덟 걸음을 종이에 적고** 지금 내가 몇 번째에 있는지 표시합니다.\n3. 세 도구를 각각 열어 **규칙표의 색 값을 직접 입력**해 봅니다. 눈으로 고르지 않습니다.\n4. 한글 글꼴을 코드에 넣을 때 AI에게 아래를 시킵니다.\n\n```\n이 화면에 한글 웹폰트 Pretendard를 넣어줘. 조건은 이래.\n\n- 한글 웹폰트는 파일이 커서 첫 화면이 느려질 수 있어. 그걸 막는 처리를 같이 해줘\n  · 실제로 쓰는 글자만 남기는 방법이 있으면 적용해줘\n  · 글꼴이 늦게 와도 글자가 먼저 보이게 해줘\n- 굵기는 보통과 굵게 두 가지만 불러와줘. 나머지는 불러오지 마\n- 글꼴이 아직 안 왔을 때 대신 보여줄 글꼴을 지정해줘\n\n적용한 뒤에 파일 크기가 대략 얼마나 되는지, 첫 화면에 어떤 영향이 있는지 알려줘.\n추측이면 추측이라고 표시해줘.\n```\n\n5. 마지막으로 **8번 걸음(접근성 3종)**을 돕니다. 7절의 점검 프롬프트를 그대로 씁니다.\n\n### 이렇게 해 봤습니다 — 2026-09-09 · Code Connect는 안 됩니다\n\n앞에서 「피그마 시안과 코드를 잇는 장치(Code Connect)」를 언급했는데, **실제로 불러 보니 막혔습니다.**\n\n> *\"Code Connect를 쓰려면 **Organization 또는 Enterprise 플랜**의 Dev 또는 Full 시트가 필요합니다.\"*\n\n계정은 **Pro 팀 · Full 시트**였습니다. **시트는 되는데 플랜 등급이 모자랍니다.**\n즉 1인이나 소규모 팀이 흔히 쓰는 요금제에서는 이 기능을 못 씁니다.\n\n**그래서 이 커리큘럼은 Code Connect 없이 갑니다.** 대신 앞 3절의 **규칙표(변수)** 가 그 자리를 대신합니다.\n변수는 Pro에서 됩니다 — 시안에서 묶어 두면 코드로 받을 때 이름이 그대로 따라옵니다. 그거면 1인에게는 충분합니다."}, {"title": "✅ 됐는지 확인", "md": "- [ ] **\"피그마는 규칙, 캔바는 발행, 어도비는 마무리\"**를 보지 않고 말할 수 있나\n- [ ] 여덟 걸음 중 **지금 내가 몇 번째인지** 말할 수 있나\n- [ ] 규칙표의 색 값이 **세 도구에 똑같이** 들어가 있나 (눈으로 고른 색이 섞이지 않았나)\n- [ ] 한글 글꼴을 넣은 뒤 **첫 화면에서 글자가 늦게 뜨거나 갑자기 바뀌지 않나**\n- [ ] 도구를 **셋에서 늘리지 않았나**"}, {"title": "🔎 더 깊이", "md": "- 이 여덟 걸음의 결과물(규칙표·랜딩 코드·카드뉴스 템플릿·캐릭터 참조)이 <a class=\"xref\" href=\"#5\">Stage 5<\/a>와 <a class=\"xref\" href=\"#10\">Stage 10<\/a>의 재료입니다.\n- 만든 것을 되돌릴 수 있게 저장하는 법은 <a class=\"xref\" href=\"#4.5\">Stage 4.5<\/a>에서.\n- 검색해 볼 말 — `Pretendard`, `한글 웹폰트 서브셋`, `font-display swap`\n- 도구별 요금·플랜 차이는 본문에 두지 않습니다 → <a class=\"xref\" href=\"#부록\">부록<\/a>의 「버전과 값」"}]}]}, {"folder": "045-버전관리", "key": "4.5", "name": "버전 관리", "color": "#B0533A", "sub": "되돌릴 수 있게 만든다", "goal": "되돌릴 수 있게 만든다. 그래야 과감히 시킨다", "makes": "저장소 · 커밋 규칙 · 되돌리기 연습", "time": "2시간", "need": ["GitHub 계정"], "head": "혼자인데 왜 버전 관리를 하냐면 — **AI에게 크게 시키기 위해서**입니다.\n되돌릴 수 있으면 과감해지고, 없으면 매번 조심스러워집니다.", "metasecs": [{"title": "✅ 자가 체크", "md": "- [ ] **일부러 망치고 되돌려** 봤나 (읽기만 하고 넘어가면 안 됩니다)\n- [ ] 커밋하기 전에 **비밀값이 섞였는지 확인**하는 습관이 생겼나\n- [ ] 「아직 커밋 안 함 / 커밋했는데 안 밀었음 / 이미 밀었음」 셋의 처리가 다르다는 걸 아나\n- [ ] 날린 것 같을 때 **먼저 볼 곳**을 아나"}, {"title": "다음으로", "md": "여기서 만든 저장소가 Stage 7의 PR과 검사가 걸리는 자리가 됩니다."}], "sections": [{"file": "1-왜혼자서.md", "id": "s4_5-1", "no": "1", "title": "혼자인데 왜 버전 관리를 하나", "through": "되돌릴 수 있어야 과감하게 시킬 수 있다.", "time": "15분", "need": ["GitHub 계정"], "head": "", "secs": [{"title": "왜 이걸 하나", "md": "버전 관리는 **여러 명이 같이 일할 때 쓰는 것**이라고 알려져 있습니다.\n그래서 혼자 만드는 사람은 대개 건너뜁니다.\n\n혼자인데도 해야 하는 이유는 딱 하나입니다.\n**AI에게 크게 시키기 위해서**입니다.\n\n이 절을 건너뛰면 뒤의 모든 장에서 **AI에게 작게밖에 못 시킵니다.**"}, {"title": "안전망이 없으면 조심스러워집니다", "md": "AI에게 \"이 폴더 전체를 정리해줘\"라고 시켜 본 적이 있다면 알 겁니다.\n시키는 순간 **가슴이 철렁**합니다. 잘못되면 되돌릴 방법이 없으니까요.\n\n그래서 이렇게 됩니다.\n\n| 안전망이 없을 때 | 안전망이 있을 때 |\n|---|---|\n| \"이 파일 한 줄만 고쳐줘\" | \"이 기능 전체를 다시 짜줘\" |\n| 시키고 나서 결과를 **손으로** 검사 | 마음에 안 들면 **한 줄로 되감기** |\n| 잘못될까 봐 미리 파일을 복사해 둠 | 복사해 둘 필요가 없음 |\n| 큰 실험을 안 하게 됨 | 실험이 공짜가 됨 |\n\n**조심스러우면 AI를 제대로 못 씁니다.** 손으로 하는 것보다 조금 빠른 정도로 끝납니다.\n되돌릴 수 있으면 시키는 크기가 달라집니다. 그게 이 장의 전부입니다."}, {"title": "폴더 복사로는 안 되는 이유", "md": "많은 분이 이미 나름의 버전 관리를 하고 있습니다.\n\n```\n기획서.docx\n기획서_최종.docx\n기획서_최종_진짜최종.docx\n기획서_최종_진짜최종_수정본.docx\n```\n\n이 방식에는 세 가지 구멍이 있습니다.\n\n1. **무엇이 바뀌었는지 모릅니다.** 두 파일을 나란히 놓고 눈으로 찾아야 합니다.\n2. **왜 바꿨는지 모릅니다.** 3개월 뒤의 나는 남이고, **AI는 기억이 아예 없습니다.**\n3. **일부만 되돌릴 수 없습니다.** 세 가지를 고친 뒤 그중 하나만 무르고 싶어도 방법이 없습니다.\n\n버전 관리는 이 셋을 한꺼번에 해결합니다.\n**무엇이 · 왜 · 언제** 바뀌었는지가 파일과 함께 보관되고, 원하는 지점 하나만 골라 되돌릴 수 있습니다."}, {"title": "사진첩이 아니라 되감기 되는 영상", "md": "저장소를 \"백업 폴더\"로 이해하면 절반만 맞습니다.\n\n- **사진첩** — 특정 순간의 사진 여러 장. 사진 사이에 무슨 일이 있었는지는 없습니다.\n- **되감기 되는 영상** — 처음부터 지금까지가 **끊기지 않고** 들어 있습니다. 아무 지점으로나 되감을 수 있고, 그 지점부터 다시 갈 수도 있습니다.\n\n저장소는 뒤쪽입니다.\n파일의 **현재 모습**만이 아니라 **그 파일이 지나온 모든 순간**을 같이 들고 있습니다."}, {"title": "이 장에서 손에 남는 것", "md": "| 만드는 것 | 어디에 쓰이나 |\n|---|---|\n| 내 저장소 하나 | 앞으로 만드는 코드가 전부 여기에 쌓입니다 |\n| `.gitignore` 파일 | 비밀값이 실수로 새어 나가는 걸 막습니다 |\n| 커밋 규칙 한 줄 | AI가 대신 지켜 줍니다 |\n| **되돌리기 연습 1회** | 진짜로 망했을 때 손이 먼저 움직입니다 |\n\n> **THE CHAIN** — 여기서 만드는 **저장소가 <a class=\"xref\" href=\"#7\">Stage 7<\/a>에서 PR과 자동 검사가 걸리는 자리**가 됩니다.\n> 지금 만든 이 폴더 하나에 나중에 「테스트 통과 못 하면 병합 불가」 같은 문이 세워집니다. 저장소가 없으면 Stage 7이 통째로 막힙니다."}, {"title": "📘 말 풀이", "md": "**저장소(repository, 줄여서 repo)**\n파일과 **그 파일이 지나온 모든 순간**을 함께 보관하는 폴더. 겉보기엔 그냥 폴더인데, 그 안에 숨은 기록 창고가 하나 더 들어 있습니다. 사진첩이 아니라 **되감기 되는 영상**에 가깝습니다.\n\n**Git과 GitHub — 다른 것입니다**\n**Git**은 내 컴퓨터에서 도는 프로그램입니다. 순간을 기록하고 되감는 일을 합니다. **GitHub**은 그 기록을 인터넷에 올려 두는 남의 창고입니다. Git만 있어도 되돌리기는 전부 됩니다. GitHub은 「내 컴퓨터가 고장 나도 남아 있게」와 「나중에 자동 검사를 걸게」를 위해 씁니다.\n\n**커밋(commit)**\n지금 상태를 이름 붙여 저장하는 것. 영상으로 치면 **되감기 표시를 하나 꽂는 일**입니다. 자세한 건 4절에서 다룹니다."}, {"title": "⚠️ 자주 걸리는 함정", "md": "- **\"코드가 없으면 필요 없다\"고 생각합니다.** 아닙니다. 기획서·설계문서·설정 파일도 전부 대상입니다. 오히려 글이 더 자주 뒤집힙니다.\n- **\"나중에 붙이면 되지\"라고 미룹니다.** 버전 관리는 **망하기 전에** 있어야 의미가 있습니다. 망한 뒤에 시작하면 되돌릴 과거가 없습니다.\n- **완벽하게 이해한 뒤에 시작하려 합니다.** Git에는 명령이 백 개 넘게 있지만 **혼자 쓰는 데 필요한 건 열 개 안쪽**입니다. 나머지는 여러 명이 얽힐 때 쓰는 것입니다.\n- **AI가 알아서 해 줄 거라 믿습니다.** AI는 시키면 커밋해 줍니다. 하지만 **무엇을 되돌릴지 정하는 건 사람**입니다. 판단이 내 몫이라 최소한은 알아야 합니다."}, {"title": "⚡ 이렇게 하세요", "md": "지금 쓰는 AI 도구 대화창에 아래를 그대로 붙여넣습니다.\n설치 여부부터 확인하는 것이 첫 걸음입니다.\n\n```\n내 맥에 git이 깔려 있는지 확인해줘.\n`git --version`을 실행하고, 안 깔려 있으면 어떻게 까는지 알려줘.\n깔려 있으면 버전만 한 줄로 보고해줘.\n```\n\n이어서, 내가 이미 뭘 갖고 있는지 봅니다.\n\n```\n내 홈 폴더 아래에서 이미 git 저장소인 폴더가 있는지 찾아줘.\n있으면 폴더 이름과 마지막으로 저장된 날짜를 표로 보여줘. 내용은 건드리지 마.\n```\n\n**아무것도 없어도 정상입니다.** 다음 절에서 처음부터 하나 만듭니다."}, {"title": "✅ 됐는지 확인", "md": "- [ ] `git --version`을 실행했을 때 **글자와 숫자가 한 줄 나오나** (에러 메시지가 아니라)\n- [ ] \"저장소는 파일의 **지금 모습만이 아니라 지나온 과정**을 같이 갖고 있다\"를 남에게 한 문장으로 말할 수 있나\n- [ ] 「Git은 내 컴퓨터, GitHub은 인터넷 창고」 **둘이 다른 것**이라는 걸 아나\n- [ ] 버전 관리를 하는 이유가 **\"AI에게 크게 시키기 위해서\"**라는 걸 아나"}, {"title": "🔎 더 깊이", "md": "- 실제로 저장소를 만드는 건 다음 절입니다 → 2절 「깃허브 계정과 저장소 만들기」\n- 이 저장소가 검사와 PR의 자리가 되는 건 <a class=\"xref\" href=\"#7\">Stage 7<\/a>입니다.\n- 검색해 볼 말 — `git 공식 문서 한국어`, `GitHub Docs 시작하기`, `what is version control`"}]}, {"file": "2-계정과저장소.md", "id": "s4_5-2", "no": "2", "title": "깃허브 계정과 저장소 만들기 — 처음부터", "through": "여기서 가장 많이 멈춘다. 막히는 자리는 거의 항상 「로그인」이다.", "time": "30분", "need": ["GitHub 계정"], "head": "", "secs": [{"title": "왜 이걸 하나", "md": "**초보자가 이 장 전체에서 가장 많이 멈추는 자리가 여기입니다.**\n\n멈추는 지점은 신기할 만큼 똑같습니다. 저장소까지는 잘 만들어 놓고,\n**내 컴퓨터의 파일을 인터넷 창고로 올리는 순간** 이런 게 뜹니다.\n\n```\nremote: Support for password authentication was removed.\nfatal: Authentication failed\n```\n\n한국어로 옮기면 **\"비밀번호로는 안 받습니다\"**입니다.\nGitHub은 몇 해 전부터 웹사이트 로그인 비밀번호로 파일을 올리는 걸 막았습니다.\n**아이디와 비밀번호를 아무리 정확히 쳐도 실패합니다.** 별도의 로그인 절차가 따로 필요합니다.\n\n이 절을 끝내면 저장소 하나와 **막히지 않는 로그인**이 손에 남습니다."}, {"title": "전체 그림 — 세 걸음", "md": "| 걸음 | 어디서 | 무엇을 |\n|---|---|---|\n| ① 계정 만들기 | 웹브라우저 | GitHub에 가입 |\n| ② 저장소 만들기 | 웹브라우저 | 인터넷 쪽 창고를 하나 판다 |\n| ③ 내 컴퓨터와 연결 | 터미널 | 로그인 → 내 폴더를 창고에 연결 |\n\n**③이 함정입니다.** ①②는 웹사이트에서 버튼만 누르면 되는데, ③은 터미널에서 별도 로그인이 필요합니다."}, {"title": "① 계정 만들기", "md": "1. 브라우저에서 **github.com** 에 들어갑니다.\n2. **Sign up**을 누릅니다.\n3. 이메일 · 비밀번호 · 사용자 이름(username)을 넣습니다.\n4. 이메일로 온 숫자를 넣어 인증합니다.\n\n**사용자 이름은 나중에 주소가 됩니다.** `github.com/사용자이름/저장소이름` 형태로 남에게 보이는 이름이니, 회사 이름이나 앞으로 쓸 활동명으로 정하는 편이 낫습니다. 나중에 바꿀 수는 있지만 예전 주소가 전부 깨집니다.\n\n가입 직후 **2단계 인증(2FA)을 켜라**고 나옵니다. **켜세요.** GitHub은 코드를 올리는 곳이라 계정을 뺏기면 피해가 큽니다. 휴대폰 인증 앱으로 30초면 끝납니다."}, {"title": "② 저장소 만들기 — 공개할까 비공개할까", "md": "오른쪽 위 **+** → **New repository**를 누릅니다. 채울 칸은 넷입니다.\n\n| 칸 | 무엇을 넣나 |\n|---|---|\n| **Repository name** | 영어 소문자와 하이픈으로. 띄어쓰기·한글은 피합니다 (`my-service`) |\n| **Description** | 한 줄 설명. 비워도 됩니다 |\n| **Public / Private** | 아래 표를 보고 고릅니다 |\n| **Add a README file** | **체크합니다.** 빈 저장소는 연결이 한 단계 더 번거롭습니다 |\n\n**공개(Public)와 비공개(Private) 고르는 기준**\n\n| | 공개(Public) | 비공개(Private) |\n|---|---|---|\n| 누가 보나 | 주소만 알면 **누구나** | 나와 내가 초대한 사람만 |\n| 좋은 점 | 자동 검사·보안 스캔 도구가 **제약 없이** 붙습니다. 남에게 보여 주기 쉽습니다 | 아무도 못 봅니다 |\n| 나쁜 점 | 실수로 올린 비밀값을 **전 세계가 봅니다.** 자동으로 훑어가는 프로그램이 실제로 돌아다닙니다 | 일부 무료 검사 도구가 제한됩니다 |\n\n**추천 — 처음 만드는 것은 비공개(Private)로 시작합니다.**\n아직 3절의 비밀값 다루기가 손에 안 붙었기 때문입니다. 손에 붙은 뒤에 공개로 바꾸는 건 설정에서 한 번에 됩니다. 반대는 안 됩니다 — **한 번 공개된 것은 이미 복사됐다고 봐야 합니다.**\n\n**대안** — 처음부터 남에게 보여 줄 목적이거나, 비밀값이 하나도 안 들어가는 글·문서만 담을 폴더라면 공개로 시작해도 됩니다. 자동 검사가 더 넉넉하게 붙습니다."}, {"title": "③ 내 컴퓨터와 연결하기 — 여기가 진짜", "md": "### 먼저 로그인 도구를 깝니다\n\n터미널에서 GitHub에 로그인하려면 **GitHub CLI**라는 공식 명령줄 도구를 씁니다.\n이름 그대로 「명령줄에서 쓰는 깃허브」입니다. 이걸 쓰면 비밀번호 문제가 통째로 사라집니다.\n\n```bash\nbrew install gh\n```\n> 맥에서 GitHub CLI를 깝니다. `brew`는 맥용 프로그램 설치 도구입니다. `brew` 자체가 없다고 나오면 AI에게 「Homebrew 깔아줘」라고 시키면 됩니다.\n\n### 로그인합니다\n\n```bash\ngh auth login\n```\n> GitHub에 로그인합니다. 화면에서 몇 가지를 물어봅니다.\n\n물어보는 순서와 **고를 답**은 이렇습니다.\n\n| 질문 | 고를 것 |\n|---|---|\n| Where do you use GitHub? | **GitHub.com** |\n| Preferred protocol? | **HTTPS** |\n| Authenticate Git with your GitHub credentials? | **Yes** |\n| How would you like to authenticate? | **Login with a web browser** |\n\n마지막을 고르면 화면에 **여덟 글자 코드**(예: `A1B2-C3D4`)가 뜨고 `Enter`를 누르면 브라우저가 열립니다.\n그 코드를 브라우저에 붙여넣고 **Authorize**를 누르면 끝입니다.\n\n**이게 아까 그 「별도 로그인」입니다.** 비밀번호를 치는 곳이 아예 없다는 점을 눈여겨보세요.\n\n### 내 폴더를 창고에 연결합니다\n\n이제 실제로 작업할 폴더로 갑니다.\n\n```bash\ncd ~/projects/my-service\n```\n> 내가 작업할 폴더로 이동합니다. 경로는 본인 폴더에 맞게 바꿉니다.\n\n```bash\ngit init\n```\n> 이 폴더를 저장소로 만듭니다. 숨은 기록 창고가 이때 생깁니다.\n\n```bash\ngh repo create\n```\n> GitHub에 저장소를 만들고 이 폴더와 연결합니다. ②를 웹에서 이미 했다면 아래를 대신 씁니다.\n\n```bash\ngit remote add origin https://github.com/사용자이름/저장소이름.git\n```\n> 이미 웹에서 만든 저장소를 「이 폴더가 올라갈 곳」으로 지정합니다. `사용자이름`과 `저장소이름`은 본인 것으로 바꿉니다.\n\n연결이 됐는지 봅니다.\n\n```bash\ngit remote -v\n```\n> 이 폴더가 어디로 올라가는지 보여 줍니다. 주소 두 줄이 나오면 성공입니다."}, {"title": "📘 말 풀이", "md": "**원격 저장소(remote)와 로컬 저장소(local)**\n**로컬**은 내 컴퓨터 안의 저장소, **원격**은 GitHub에 있는 같은 저장소입니다. 둘은 자동으로 같아지지 않습니다. 내가 **밀어야(push)** 올라가고 **당겨야(pull)** 내려옵니다. `origin`은 「내가 주로 쓰는 원격 저장소」에 붙는 관행적인 별명입니다.\n\n**푸시(push)와 클론(clone)**\n**푸시**는 내 컴퓨터의 기록을 GitHub으로 올리는 것, **클론**은 GitHub의 저장소를 통째로 내 컴퓨터에 내려받는 것입니다. 새 컴퓨터에서 일을 이어 하려면 클론부터 합니다.\n\n**인증(authentication)**\n\"이 사람이 진짜 그 사람인가\"를 확인하는 절차. GitHub은 터미널에서 **웹사이트 비밀번호를 받지 않습니다.** GitHub CLI로 로그인하면 컴퓨터 안에 안전한 열쇠가 저장되고, 이후로는 묻지 않습니다."}, {"title": "⚠️ 자주 걸리는 함정", "md": "- **`Authentication failed`가 계속 뜹니다.** 비밀번호를 아무리 정확히 쳐도 안 됩니다. `gh auth login`을 먼저 해야 합니다. 이게 이 절의 핵심입니다.\n- **예전에 실패한 로그인 정보가 남아 방해합니다.** 맥의 **키체인 접근(Keychain Access)** 앱을 열고 `github.com`을 검색해 낡은 항목을 지운 뒤 다시 `gh auth login` 하면 풀립니다.\n- **저장소 이름에 한글이나 띄어쓰기를 넣습니다.** 주소가 깨집니다. 영어 소문자와 하이픈만 씁니다.\n- **README 체크를 안 해서 빈 저장소가 됩니다.** 빈 저장소는 첫 연결 때 단계가 하나 더 늘어납니다. 체크해 두면 편합니다.\n- **회사 계정과 개인 계정을 한 컴퓨터에서 섞어 씁니다.** 어느 계정으로 올라갔는지 헷갈립니다. `gh auth status`로 지금 누구로 로그인돼 있는지 항상 확인할 수 있습니다.\n- **폴더를 잘못 잡고 `git init`을 합니다.** 홈 폴더(`~`)에서 실행하면 컴퓨터 전체가 저장소가 됩니다. 반드시 **작업할 폴더 안에서** 실행합니다."}, {"title": "⚡ 이렇게 하세요", "md": "순서대로 합니다. **한 줄씩 실행하고 결과를 보고 다음으로 갑니다.**\n\n1. 브라우저에서 github.com 가입 → 2단계 인증 켜기\n2. **+ → New repository** → 이름 짓기 → **Private** 고르기 → **Add a README** 체크 → **Create repository**\n3. 터미널을 열고 아래를 차례로 실행합니다.\n\n```bash\nbrew install gh\ngh auth login\n```\n> GitHub CLI를 깔고 로그인합니다. 위 표대로 답하면 브라우저가 열립니다.\n\n```bash\ngh auth status\n```\n> 지금 누구로 로그인돼 있는지 보여 줍니다. 내 사용자 이름이 나오면 성공입니다.\n\n4. 작업 폴더에서 연결합니다.\n\n```bash\ncd ~/projects/내폴더이름\ngit init\ngit remote add origin https://github.com/내사용자이름/내저장소이름.git\ngit remote -v\n```\n> 폴더로 이동 → 저장소로 만들기 → 올라갈 곳 지정 → 확인.\n\n5. 막히면 AI에게 화면에 뜬 글자를 **요약하지 말고 그대로** 붙여넣고 물어봅니다.\n\n```\n아래는 터미널에 뜬 내용 그대로야. 무슨 뜻인지 알려주고,\n지금 내가 쳐야 할 명령 한 줄만 알려줘. 여러 개 말고 한 줄만.\n\n(여기에 화면 내용을 그대로 붙여넣기)\n```"}, {"title": "✅ 됐는지 확인", "md": "- [ ] github.com에 로그인해서 **내 저장소 페이지가 열리나**\n- [ ] 그 저장소 이름 옆에 **Private**(또는 Public) 표시가 보이나\n- [ ] 터미널에서 `gh auth status`를 쳤을 때 **내 사용자 이름이 나오나**\n- [ ] `git remote -v`를 쳤을 때 **주소 두 줄이 나오나** (아무것도 안 나오면 연결이 안 된 것)\n- [ ] 「비밀번호로는 안 되고 **별도 로그인이 필요하다**」는 걸 아나\n\n하나라도 «아니오»면 다음 절로 넘어가지 않습니다. 여기서 막힌 채로 가면 뒤가 전부 막힙니다."}, {"title": "🔎 더 깊이", "md": "- 올리면 안 되는 것을 거르는 건 바로 다음 절입니다 → 3절 「올리면 안 되는 것」\n- 이 저장소에 자동 검사와 PR을 거는 건 <a class=\"xref\" href=\"#7\">Stage 7<\/a>입니다.\n- 검색해 볼 말 — `GitHub CLI gh auth login`, `GitHub Docs 저장소 만들기`, `git remote add origin`"}]}, {"file": "3-올리면안되는것.md", "id": "s4_5-3", "no": "3", "title": "올리면 안 되는 것 — .gitignore와 비밀값", "through": "실수로 올린 비밀값은 지우는 게 아니라 새로 발급받는 것이다.", "time": "25분", "need": ["GitHub 계정"], "head": "", "secs": [{"title": "왜 이걸 하나", "md": "**이 장에서 가장 위험한 자리입니다.**\n\n앞 절들에서 잘못하면 **안 됩니다**. 여기서 잘못하면 **일이 벌어집니다.**\n남의 카드로 결제가 되거나, 남이 내 데이터베이스를 지우거나, 내 계정으로 돈이 나갑니다.\n\n버전 관리의 성질 때문입니다. 저장소는 **지나온 모든 순간**을 보관합니다.\n그러니까 **한 번 올린 것은 나중에 지워도 기록에는 남습니다.**\n\n이 절을 건너뛰면 <a class=\"xref\" href=\"#6\">Stage 6<\/a>에서 결제 열쇠를 다루는 순간 사고가 납니다."}, {"title": "지워도 남는다 — 이게 핵심입니다", "md": "보통의 파일은 이렇게 생각합니다.\n\n> 올렸다가 잘못됐네 → 지운다 → 없어진다\n\n**저장소에서는 안 그렇습니다.**\n\n> 올렸다 → 지운다 → **지웠다는 사실이 새로 기록될 뿐** → 올렸던 순간은 그대로 남아 있음\n\n되감기 되는 영상이라 그렇습니다. 영상 중간의 한 장면을 도려내도, 그 앞뒤 영상은 그 장면을 지나왔습니다.\n누구든 그 지점으로 되감으면 **비밀값이 그대로 보입니다.**\n\n그래서 답이 정해져 있습니다.\n\n> ## 실수로 올렸으면 **지우는 게 아니라 새로 발급받습니다.**\n\n발급처(예: 결제 서비스, AI 서비스, 데이터베이스)에 들어가서 **그 열쇠를 폐기하고 새 열쇠를 만듭니다.**\n새 열쇠를 만드는 순간 올라간 옛 열쇠는 **쓸모없는 글자 줄**이 됩니다. 그제야 안전해집니다.\n\n**저장소를 비공개로 해 뒀어도 마찬가지입니다.** 협업자, 나중에 공개로 바꿀 가능성, 내 계정이 뚫릴 가능성이 전부 남아 있습니다. 공개 저장소는 더 급합니다 — 인터넷을 훑으며 새어 나온 열쇠를 자동으로 주워 가는 프로그램이 **실제로 돌아다닙니다.** 몇 분 단위입니다."}, {"title": "무엇이 비밀값인가", "md": "이름이 달라도 **성질이 같으면 전부 비밀값**입니다.\n\n| 부르는 이름 | 무엇 |\n|---|---|\n| **API 키(API key)** | 바깥 서비스를 쓸 때 \"나 맞습니다\"를 증명하는 긴 글자 줄 |\n| **토큰(token)** | 같은 역할. 기한이 있는 경우가 많습니다 |\n| **비밀번호(password)** | 데이터베이스·서버 접속용 |\n| **접속 문자열(connection string)** | 주소와 비밀번호가 한 줄에 붙어 있는 것 |\n| **인증서 파일**(`.pem`, `.key`) | 서버 접속용 열쇠 파일 |\n| **서비스 계정 파일**(`.json`) | 구글 등에서 내려받는 자격증명 파일 |\n\n판단 기준 한 줄 — **\"이걸 남이 보면 내 이름으로 뭔가 할 수 있나?\"** 그렇다면 비밀값입니다."}, {"title": "`.gitignore` — 애초에 안 올라가게 막는 문지기", "md": "`.gitignore`는 저장소 맨 위에 두는 **평범한 텍스트 파일**입니다.\n여기 적힌 이름의 파일은 Git이 아예 못 본 척합니다. 실수할 기회 자체가 사라집니다.\n\n저장소 맨 위 폴더에 `.gitignore` 파일을 만들고 아래를 넣습니다.\n\n```\n# 비밀값 — 절대 올리지 않는다\n.env\n.env.*\n*.key\n*.pem\nsecrets.json\ncredentials.json\n\n# 프로그램이 자동으로 만드는 것 — 올릴 이유가 없다\nnode_modules/\n.next/\ndist/\nbuild/\n__pycache__/\n*.log\n\n# 맥이 몰래 만드는 것\n.DS_Store\n```\n\n**줄마다 무슨 뜻인지**\n\n| 적는 법 | 뜻 |\n|---|---|\n| `.env` | 정확히 이 이름의 파일 |\n| `.env.*` | `.env.`로 시작하는 모든 파일 (`.env.local` 등) |\n| `*.key` | 확장자가 `.key`인 모든 파일 |\n| `node_modules/` | 이 이름의 폴더 통째로 |\n| `# 로 시작하는 줄` | 사람이 읽는 메모. Git은 무시합니다 |\n\n**`.env` 파일이란** — 비밀값을 코드 밖으로 빼서 따로 모아 두는 파일입니다. 코드에는 \"이 이름의 값을 가져다 써\"라고만 적고, 실제 값은 `.env`에 둡니다. **코드는 올리고 `.env`는 안 올리는** 구조가 여기서 나옵니다."}, {"title": "⚠️ 자주 걸리는 함정", "md": "- **`.gitignore`에 적었는데도 계속 올라갑니다.** `.gitignore`는 **아직 한 번도 저장한 적 없는 파일**에만 듣습니다. 이미 한 번 커밋된 파일은 계속 따라갑니다. `git rm --cached .env`로 추적을 끊어 줘야 합니다(아래 ⚡에 있습니다).\n- **`.env.example`까지 막아 버립니다.** `.env.example`은 **값이 비어 있는 견본**이라 올려야 합니다. 나중에 다른 컴퓨터에서 무엇을 채워야 하는지 알려 주는 지도입니다. `.env.*`가 이것까지 막으니 `!.env.example` 한 줄을 더해 예외로 둡니다.\n- **AI 대화창에 열쇠를 그대로 붙여넣습니다.** 파일에 안 올려도 **대화 기록에 남습니다.** AI에게는 \"`.env`의 `STRIPE_KEY` 값을 읽어서 써\"라고 시킵니다. 값 자체를 채팅에 쓰지 않습니다.\n- **스크린샷에 열쇠가 찍힙니다.** 터미널 화면이나 설정 화면을 캡처해 올릴 때 자주 샙니다.\n- **\"비공개니까 괜찮다\"고 생각합니다.** 비공개는 유예이지 안전이 아닙니다. 규칙은 공개·비공개 상관없이 같습니다.\n- **AI가 알아서 걸러 줄 거라 믿습니다.** AI는 시키면 커밋합니다. **`.env`를 커밋 목록에 넣어도 대개 그냥 넣습니다.** 확인은 사람 몫입니다."}, {"title": "⚡ 이렇게 하세요", "md": "### 1. `.gitignore`부터 만듭니다 — 첫 커밋보다 먼저\n\n```bash\ncd ~/projects/내폴더이름\n```\n> 작업 폴더로 이동합니다.\n\nAI 도구 대화창에 붙여넣습니다.\n\n```\n이 폴더 맨 위에 .gitignore 파일을 만들어줘.\n.env, .env.*, *.key, *.pem, secrets.json, credentials.json,\nnode_modules/, dist/, build/, __pycache__/, *.log, .DS_Store 를 넣고,\n.env.example 은 예외로 올라가게 해줘.\n만들고 나서 파일 내용을 그대로 보여줘.\n```\n\n### 2. **커밋 전에 확인하는 명령 한 줄** — 이걸 습관으로 만듭니다\n\n저장하기 직전에 **딱 한 줄** 칩니다.\n\n```bash\ngit diff --cached --name-only | grep -iE \"\\.env$|token|secret|credential|\\.key$|\\.pem$\"\n```\n> 지금 저장하려고 올려 둔 파일 이름 중에 `env`·`token`·`secret`·`credential`·`key`·`pem`이 들어간 게 있는지 거릅니다.\n\n**읽는 법이 거꾸로라 헷갈립니다. 외워 두세요.**\n\n| 결과 | 뜻 |\n|---|---|\n| **아무것도 안 나옴** | ✅ 안전. 그대로 커밋합니다 |\n| **파일 이름이 나옴** | 🚨 **멈춥니다.** 그 파일을 빼고 `.gitignore`에 넣습니다 |\n\n파일 이름이 나왔을 때 빼는 법.\n\n```bash\ngit restore --staged .env\n```\n> 그 파일을 「저장할 목록」에서 뺍니다. 파일 자체는 그대로 있습니다.\n\n### 3. 이미 한 번 올라간 파일의 추적을 끊습니다\n\n```bash\ngit rm --cached .env\n```\n> `.env`를 저장소 추적 대상에서만 뺍니다. **내 컴퓨터의 파일은 지워지지 않습니다.** (`--cached`가 그 뜻입니다)\n\n이 뒤에 커밋하면 앞으로는 안 따라옵니다. **단, 이미 올라간 과거 기록에는 남아 있습니다 — 위에 쓴 대로 열쇠를 새로 발급받으세요.**\n\n### 4. 이 확인을 AI에게 맡깁니다 — 매번 손으로 치기 싫으면\n\n```\n앞으로 이 프로젝트에서 커밋하기 전에 항상 아래를 먼저 실행하고,\n결과가 한 줄이라도 나오면 커밋을 멈추고 나에게 물어봐.\n\ngit diff --cached --name-only | grep -iE \"\\.env$|token|secret|credential|\\.key$|\\.pem$\"\n\n이 규칙을 이 프로젝트의 CLAUDE.md 에 적어줘.\n```\n\n이렇게 해 두면 **<a class=\"xref\" href=\"#3\">Stage 3<\/a>에서 만든 규칙 파일이 문지기 역할**을 합니다.\n\n### 5. 이미 새어 나갔다면 — 순서대로\n\n1. **발급처에 들어가 그 열쇠를 폐기하고 새로 만듭니다.** (가장 먼저)\n2. 새 값을 `.env`에 넣습니다.\n3. `.gitignore`에 넣고 `git rm --cached`로 추적을 끊습니다.\n4. 그 열쇠로 그동안 무슨 일이 있었는지 발급처의 사용 기록을 확인합니다.\n\n**기록에서 지우려고 하지 마세요.** 과거를 뜯어고치는 명령이 있긴 하지만, 초보자가 쓰면 저장소를 통째로 망가뜨리기 쉽고 **이미 남이 복사해 갔으면 소용도 없습니다.** 새로 발급받는 게 확실하고 빠릅니다."}, {"title": "📘 말 풀이", "md": "**비밀값(secret)**\n남이 알면 내 이름으로 무언가 할 수 있게 되는 값. API 키·토큰·비밀번호·인증서 파일이 전부 여기 들어갑니다. 이름이 뭐든 성질이 같으면 같게 다룹니다.\n\n**`.gitignore`**\n저장소 맨 위에 두는 텍스트 파일. 여기 적힌 이름의 파일을 Git이 못 본 척합니다. **이미 저장된 적 있는 파일에는 듣지 않는다**는 게 가장 자주 걸리는 성질입니다.\n\n**추적(tracked) / 추적 안 함(untracked)**\nGit이 지켜보고 있는 파일이 **추적 중**, 폴더 안에 있어도 Git이 신경 쓰지 않는 파일이 **추적 안 함**입니다. `.gitignore`는 추적 안 하는 파일을 계속 그 상태로 두는 장치입니다."}, {"title": "✅ 됐는지 확인", "md": "- [ ] 저장소 맨 위에 **`.gitignore` 파일이 있나**\n- [ ] 그 안에 **`.env`가 들어 있나**\n- [ ] `git status`를 쳤을 때 목록에 **`.env`가 안 보이나** (보이면 아직 안 막힌 것)\n- [ ] **커밋 전에 비밀값을 확인하는 습관이 생겼나** — 위의 한 줄 명령을 실제로 한 번 이상 쳐 봤나\n- [ ] 그 명령의 결과를 **거꾸로 읽는 법**을 아나 (아무것도 안 나와야 안전)\n- [ ] 실수로 올렸을 때 **지우는 게 아니라 새로 발급받는다**는 걸 아나"}, {"title": "🔎 더 깊이", "md": "- 실제로 결제·인증 열쇠를 다루는 건 <a class=\"xref\" href=\"#6\">Stage 6<\/a>입니다. 여기서 만든 습관이 거기서 쓰입니다.\n- 자동 시크릿 스캔을 문 앞에 세우는 건 <a class=\"xref\" href=\"#7\">Stage 7<\/a>입니다. 사람이 놓쳐도 기계가 잡습니다.\n- 검색해 볼 말 — `gitignore 템플릿`, `GitHub secret scanning`, `git rm --cached`, `revoke API key`"}]}, {"file": "4-커밋.md", "id": "s4_5-4", "no": "4", "title": "커밋 — 언제 나누나", "through": "한 커밋 = 한 가지. 세 가지를 한꺼번에 저장하면 그중 하나만 되돌릴 수 없다.", "time": "25분", "need": ["GitHub 계정"], "head": "", "secs": [{"title": "왜 이걸 하나", "md": "되돌리기는 **되돌아갈 지점이 있을 때만** 됩니다. 그 지점을 만드는 게 커밋입니다.\n\n문제는 **어떻게 나누느냐**입니다. 여기서 갈립니다.\n\n> 오늘 로그인 화면을 고치고, 색을 바꾸고, 오타를 잡았습니다.\n> 이걸 **한 번에** 저장했습니다.\n> 다음 날 색이 마음에 안 들어 되돌리려 합니다.\n> **→ 색만 되돌릴 방법이 없습니다.** 로그인 수정과 오타 수정까지 같이 날아갑니다.\n\n이 절을 대충 하면 5절의 되돌리기가 **반쯤만 작동합니다.** 되돌릴 수는 있는데, 되돌리고 싶지 않은 것까지 같이 되돌아갑니다."}, {"title": "한 커밋 = 한 가지", "md": "규칙은 한 줄입니다. **하나의 커밋은 하나의 이유로 묶입니다.**\n\n| 나쁜 예 | 좋은 예 |\n|---|---|\n| 「오늘 작업」 (다섯 가지가 섞임) | 「로그인 화면 여백 정리」 |\n| 「수정」 | 「가입 이메일 중복 검사 추가」 |\n| 「이것저것」 | 「README 오타 수정」 |\n\n**나누는 기준을 정하는 질문 하나** — *\"이걸 나중에 통째로 무를 일이 생길까?\"*\n답이 갈리는 지점이 커밋의 경계입니다. 로그인 수정은 무를 수 있고 오타 수정은 그럴 일이 없다면, 둘은 다른 커밋입니다.\n\n**얼마나 자주 하나** — 「한 가지가 끝나고 돌아가는 걸 확인했을 때」입니다. 시간이 아니라 **일의 단위**입니다. 하루에 열 번도 정상이고, 큰 것 하나에 한 번도 정상입니다.\n\n**AI에게 시킬 때는 더 중요합니다.** AI는 시키면 파일 열 개를 한 번에 고칩니다. 시키기 **전에** 커밋해 두면, 결과가 마음에 안 들 때 그 지점으로 통째로 되감으면 됩니다. **AI에게 크게 시키기 전에 커밋을 하나 찍어 두는 것** — 이게 이 장 전체의 실전 요령입니다."}, {"title": "저장하는 세 걸음", "md": "Git의 저장은 한 번에 끝나지 않고 **두 단계**입니다. 처음엔 번거롭게 느껴지지만, 이 구조 덕분에 「바꾼 것 중 일부만 저장」이 됩니다.\n\n```bash\ngit status\n```\n> 지금 무엇이 바뀌었는지 보여 줍니다. **항상 여기서 시작합니다.**\n\n```bash\ngit add 파일이름\n```\n> 그 파일을 「이번에 저장할 목록」에 올립니다. 전부 올리려면 `git add .` 을 씁니다.\n\n```bash\ngit commit -m \"가입 이메일 중복 검사 추가\"\n```\n> 목록에 올린 것을 이름 붙여 저장합니다. `-m` 뒤의 따옴표 안이 그 이름(메시지)입니다.\n\n```bash\ngit push\n```\n> 저장한 것을 GitHub으로 올립니다. 커밋은 **내 컴퓨터 안의 일**이고, 푸시를 해야 인터넷 창고로 갑니다.\n\n**중요** — `git commit`과 `git push`는 다른 일입니다. 이 둘의 차이가 5절 되돌리기에서 **①②③을 가르는 기준**이 됩니다."}, {"title": "메시지 — 무엇을 왜 바꿨나", "md": "메시지를 나중의 나와 AI가 읽습니다. 그래서 **한 일의 목록**이 아니라 **이유**를 적습니다.\n\n| ❌ 무엇을 했는지 나열 | ✅ 무엇을 왜 바꿨는지 |\n|---|---|\n| 「login.js, auth.js, db.js 수정」 | 「같은 이메일로 두 번 가입되던 문제 막음」 |\n| 「함수 3개 추가」 | 「결제 실패했을 때 사용자에게 이유를 보여 주도록」 |\n| 「스타일 변경」 | 「휴대폰에서 버튼이 잘려 크기를 키움」 |\n\n왼쪽은 **파일을 열어 보면 어차피 아는 것**입니다. 오른쪽은 **파일을 열어도 알 수 없는 것**입니다.\n기록해야 할 건 후자입니다."}, {"title": "메시지를 AI에게 쓰게 하는 법", "md": "메시지 쓰기가 귀찮아서 「수정」만 반복하게 됩니다. **AI에게 맡깁니다.**\n요령은 하나 — **바뀐 것을 실제로 보여 주고 요약시킵니다.** 안 보여 주면 지어냅니다.\n\n```bash\ngit diff --cached\n```\n> 지금 저장하려는 것이 **정확히 무엇이 바뀌었는지** 줄 단위로 보여 줍니다.\n\nAI 대화창에 붙여넣습니다.\n\n```\n지금 저장할 변경사항을 `git diff --cached` 로 직접 읽어보고,\n커밋 메시지를 한 줄로 지어줘. 조건 셋:\n\n1. 파일 이름이나 함수 이름을 나열하지 말고, 「무엇을 왜 바꿨는지」를 써줘\n2. 한글로, 50자 안쪽으로\n3. 이 변경이 사실은 두 가지 이상 섞여 있으면,\n   메시지를 짓지 말고 「커밋을 몇 개로 나눠야 하는지」를 먼저 알려줘\n\n메시지만 보여주고, 커밋은 내가 확인한 다음에 해.\n```\n\n**조건 3이 진짜입니다.** AI가 \"이건 세 가지가 섞였습니다\"라고 말해 주면, 그때 나눕니다.\n**사람은 자기가 섞은 걸 못 알아봅니다. AI는 알아봅니다.**"}, {"title": "📘 말 풀이", "md": "**커밋(commit)**\n지금 상태를 이름 붙여 저장하는 것. 되감기 표시를 하나 꽂는 일입니다. 커밋마다 긴 글자·숫자 줄(예: `a3f9c21…`)이 자동으로 붙는데, 이게 그 지점의 **주소**입니다. 5절에서 이 주소를 씁니다.\n\n**스테이지(staging area) — `git add`가 하는 일**\n「이번에 저장할 것」을 담아 두는 **장바구니**입니다. 바꾼 파일 다섯 개 중 셋만 담아 저장할 수 있습니다. 이 장바구니가 있어서 「한 커밋 = 한 가지」가 가능합니다.\n\n**diff**\n두 시점 사이에 **정확히 어느 줄이 바뀌었는지** 보여 주는 것. 더해진 줄 앞에 `+`, 지워진 줄 앞에 `-`가 붙습니다. AI에게 요약시킬 때 먹이는 재료가 이것입니다."}, {"title": "⚠️ 자주 걸리는 함정", "md": "- **`git add .` 을 습관적으로 씁니다.** 폴더 안의 모든 걸 담습니다. **`.env`가 딸려 들어가는 사고가 여기서 납니다.** 담은 뒤 3절의 확인 명령을 반드시 칩니다.\n- **커밋만 하고 푸시를 안 합니다.** 내 컴퓨터에만 있습니다. 컴퓨터가 고장 나면 그대로 사라집니다. `git status`에 「밀지 않은 커밋이 N개 있다」는 뜻의 안내가 나옵니다.\n- **하루 끝에 몰아서 한 번 커밋합니다.** 되돌릴 수 있는 단위가 「하루 통째로」가 됩니다. 되돌리기의 쓸모가 사라집니다.\n- **메시지에 `수정`, `업데이트`, `ㅇㅇ`만 씁니다.** 3개월 뒤에 아무 정보도 아닙니다. 게다가 AI가 이 기록을 읽어 프로젝트를 파악하므로, 부실한 메시지는 AI의 판단도 흐립니다.\n- **AI에게 diff를 안 보여 주고 메시지를 시킵니다.** 그럴듯한데 사실이 아닌 메시지가 나옵니다. 반드시 **바뀐 것을 먼저 읽히세요.**\n- **커밋을 「완성했을 때만」 하는 것으로 오해합니다.** 커밋은 발표가 아니라 **되돌아올 지점 만들기**입니다. 어중간해도 돌아가면 찍어 둡니다."}, {"title": "⚡ 이렇게 하세요", "md": "파일 하나를 아무렇게나 고친 뒤 아래를 순서대로 합니다.\n\n```bash\ngit status\n```\n> 무엇이 바뀌었는지 봅니다.\n\n```bash\ngit add 파일이름\n```\n> 저장할 것을 장바구니에 담습니다. 한 가지씩만 담습니다.\n\n```bash\ngit diff --cached --name-only | grep -iE \"\\.env$|token|secret|credential|\\.key$|\\.pem$\"\n```\n> **3절의 확인.** 아무것도 안 나와야 다음으로 갑니다.\n\n```bash\ngit diff --cached\n```\n> 무엇이 바뀌는지 눈으로 봅니다.\n\n```bash\ngit commit -m \"무엇을 왜 바꿨는지 한 줄\"\n```\n> 이름 붙여 저장합니다.\n\n```bash\ngit push\n```\n> GitHub으로 올립니다.\n\n**그다음, 커밋 규칙을 프로젝트에 박아 둡니다.**\n\n```\n이 프로젝트의 CLAUDE.md 에 커밋 규칙을 적어줘. 내용은 이 셋:\n\n1. 한 커밋 = 한 가지. 성격이 다른 변경은 절대 한 커밋에 섞지 않는다\n2. 커밋 메시지는 한글로, 「무엇을 왜 바꿨는지」를 쓴다. 파일·함수 나열 금지\n3. 커밋 전에 반드시 아래를 실행하고, 한 줄이라도 나오면 멈추고 물어본다\n   git diff --cached --name-only | grep -iE \"\\.env$|token|secret|credential|\\.key$|\\.pem$\"\n```\n\n이제 AI에게 「커밋해줘」라고만 해도 이 셋을 지킵니다."}, {"title": "✅ 됐는지 확인", "md": "- [ ] `git status`를 쳤을 때 **바뀐 파일 목록이 보이나**\n- [ ] 커밋을 한 번 하고 `git log --oneline`을 쳤을 때 **내가 쓴 메시지가 보이나**\n- [ ] 그 메시지가 **「무엇을 왜」로 읽히나** (「수정」이 아니라)\n- [ ] GitHub 저장소 웹페이지를 새로고침했을 때 **방금 올린 것이 보이나**\n- [ ] **커밋과 푸시가 다른 일**이라는 걸 아나\n- [ ] AI에게 `git diff --cached`를 읽히고 메시지를 받아 본 적이 있나"}, {"title": "🔎 더 깊이", "md": "- 이제 되돌립니다 → 5절 「되돌리기 3단」. 여기서 나눈 커밋이 그대로 되돌리기 단위가 됩니다.\n- 커밋 메시지 규칙을 팀 표준처럼 쓰고 싶다면 검색해 볼 말 — `Conventional Commits`\n- 검색해 볼 말 — `git add 스테이징 영역`, `git commit 메시지 잘 쓰는 법`, `git log --oneline`"}]}, {"file": "5-되돌리기3단.md", "id": "s4_5-5", "no": "5", "title": "되돌리기 3단 ⭐", "through": "어디까지 갔느냐에 따라 되돌리는 법이 다르다. 그리고 날린 것 같을 때 먼저 볼 곳이 있다.", "time": "40분", "need": ["GitHub 계정"], "head": "", "secs": [{"title": "왜 이걸 하나", "md": "**이 장 전체가 이 절을 위해 있습니다.**\n\n앞의 네 절은 전부 준비였습니다. 저장소를 만들고, 비밀값을 막고, 커밋을 나눈 이유는\n**망했을 때 되돌리기 위해서**입니다.\n\n그런데 되돌리는 법이 **하나가 아닙니다.** 여기가 초보자가 가장 헷갈리는 자리입니다.\n인터넷에서 아무 명령이나 찾아 치다가 **멀쩡한 것까지 날립니다.**\n\n기준은 딱 하나 — **얼마나 멀리 갔느냐**입니다."}, {"title": "되돌리기 3단 + 1", "md": "| # | 상황 | 무엇을 하나 | 명령 |\n|---|---|---|---|\n| **①** | **아직 저장(커밋) 안 함** | 바뀐 것을 **버린다** | `git restore` |\n| **②** | **저장은 했는데 안 올렸음** | 내 컴퓨터에서만 **되감는다** | `git reset` |\n| **③** | **이미 올렸음** | 역사를 지우지 말고 **되돌린다** | `git revert` |\n| **④** | **날린 것 같을 때** | **먼저 여기부터 본다** | `git reflog` |\n\n**어느 단계인지 모르겠으면 `git status`를 칩니다.** 지금 어디쯤인지 알려 줍니다.\n\n---"}, {"title": "① 아직 저장(커밋) 안 함 → 바뀐 것 버리기", "md": "**언제** — AI에게 시켰는데 결과가 엉망입니다. 아직 커밋은 안 했습니다.\n가장 흔하고, 가장 안전한 경우입니다. 커밋된 상태로 **되돌아가기만** 하면 됩니다.\n\n```bash\ngit restore 파일이름\n```\n> 그 파일을 마지막 커밋 상태로 되돌립니다. 바꾼 내용은 사라집니다.\n\n```bash\ngit restore .\n```\n> 바꾼 것 **전부**를 마지막 커밋 상태로 되돌립니다.\n\n`git add`로 장바구니에 이미 담았다면 두 걸음입니다.\n\n```bash\ngit restore --staged 파일이름\ngit restore 파일이름\n```\n> 먼저 장바구니에서 빼고, 그다음 내용을 되돌립니다.\n\n> **⚠️ 이건 진짜로 사라집니다.** 커밋 안 한 변경은 Git이 기록한 적이 없어서 ④의 `reflog`로도 못 찾습니다. **버리기 전에 한 번 더 봅니다.**\n\n**버리기 아까울 때 — 잠깐 치워 두기**\n\n```bash\ngit stash\n```\n> 지금 바꾼 것을 서랍에 넣어 두고 깨끗한 상태로 되돌립니다. 사라지지 않습니다.\n\n```bash\ngit stash pop\n```\n> 서랍에 넣어 둔 것을 다시 꺼냅니다.\n\n「이게 맞나 싶은데 버리긴 아깝다」 싶으면 `restore` 대신 `stash`를 씁니다. **초보자에게는 이쪽이 더 안전합니다.**\n\n---"}, {"title": "② 저장은 했는데 안 올렸음 → 로컬에서 되감기", "md": "**언제** — 커밋까지 했는데 아직 `git push`는 안 했습니다.\n아직 **내 컴퓨터 밖으로 안 나갔으니** 마음대로 되감아도 됩니다. 아무도 못 봤습니다.\n\n```bash\ngit log --oneline\n```\n> 최근 커밋 목록을 한 줄씩 보여 줍니다. **되감기 전에 항상 여기서 확인합니다.**\n\n```bash\ngit reset --soft HEAD~1\n```\n> **가장 안전한 되감기.** 마지막 커밋 하나를 취소하되, **바꾼 내용은 그대로 둡니다.** 메시지를 잘못 썼거나 커밋을 나누고 싶을 때 씁니다. (`HEAD~1`은 「지금에서 한 칸 뒤」라는 뜻입니다)\n\n```bash\ngit reset --mixed HEAD~1\n```\n> 커밋을 취소하고 장바구니에서도 뺍니다. 내용은 파일에 남아 있습니다.\n\n```bash\ngit reset --hard HEAD~1\n```\n> **바꾼 내용까지 통째로 버립니다.** 진짜로 그 시점으로 되돌아갑니다.\n\n> **⚠️ `--hard`는 조심합니다.** 되돌린 뒤에 「아 그건 살릴걸」 해도 파일에 안 남습니다. 다만 **커밋된 것은 ④의 `reflog`로 대개 찾습니다.** 커밋 안 한 변경만 진짜로 사라집니다.\n> **초보자에게 권하는 순서 — 먼저 `--soft`를 씁니다.** 그걸로 안 되면 그때 `--hard`를 생각합니다.\n\n---"}, {"title": "③ 이미 올렸음 → 역사를 지우지 말고 되돌리기", "md": "**언제** — `git push`까지 했습니다. **GitHub에 올라가 있습니다.**\n\n여기서 규칙이 바뀝니다.\n\n> ## 이미 올린 것은 **지우지 않습니다. 덮어씁니다.**\n\n이유는 간단합니다. **남들이 이미 받아 갔을 수 있습니다.**\n협업자도 그렇고, 자동 검사 도구도, 배포 서버도 그 기록을 이미 봤습니다.\n올라간 역사를 뜯어고치면 그걸 받아 간 모든 곳이 **어긋납니다.**\n\n그래서 「없던 일로」가 아니라 **「그 반대를 하는 새 커밋을 하나 더 얹습니다.」**\n\n```bash\ngit log --oneline\n```\n> 되돌릴 커밋의 주소(앞 일곱 글자면 충분합니다)를 찾습니다.\n\n```bash\ngit revert a3f9c21\n```\n> 그 커밋이 한 일을 **정확히 반대로 하는 새 커밋**을 만듭니다. 기록은 그대로 남고, 결과만 되돌아갑니다.\n\n```bash\ngit push\n```\n> 되돌린 것을 올립니다.\n\n**결과가 이렇게 남습니다.**\n\n```\na3f9c21  결제 화면 새로 만듦        ← 남아 있음\nb7d1e88  결제 화면 새로 만든 것 되돌림  ← 새로 얹힘\n```\n\n지저분해 보이지만 **이게 맞습니다.** 「무엇을 했다가 왜 물렀는지」가 기록으로 남는 게 오히려 자산입니다.\n\n> ### ⚠️ 절대 하지 말 것 — 강제로 밀어내기\n>\n> 인터넷에서 이런 걸 봅니다.\n>\n> ```\n> git push --force\n> ```\n>\n> **초보자는 쓰지 마세요.** 「내 컴퓨터 상태로 인터넷 창고를 통째로 덮어써라」는 뜻입니다.\n> 남이 올려 둔 작업이 **소리 없이 사라집니다.** 되돌릴 방법이 없는 경우도 있습니다.\n> 이미 올린 것을 되돌릴 때는 **`revert` 하나면 됩니다.** 강제로 밀어야 할 일은 혼자 작업하는 동안 거의 없습니다.\n>\n> 마찬가지로 **「역사를 다시 쓰는」 명령**(과거 커밋을 합치거나 지우는 것)도 **이미 올린 것에는 쓰지 않습니다.** 안 올린 ②단계에서만 씁니다.\n\n---"}, {"title": "④ 날린 것 같을 때 → 먼저 `reflog`부터", "md": "**포기하기 전에 여기부터 봅니다. 대부분 여기서 찾습니다.**\n\nGit은 **내가 지운 것도 한동안 몰래 들고 있습니다.** 커밋을 되감았든, 브랜치를 지웠든,\n「지금까지 내 저장소가 지나온 자리」를 따로 적어 둡니다. 그 목록이 `reflog`입니다.\n**보관 기간은 대략 30일**입니다.\n\n```bash\ngit reflog\n```\n> 내 저장소가 지나온 모든 자리를 최근 순으로 보여 줍니다.\n\n이런 게 나옵니다.\n\n```\na3f9c21 HEAD@{0}: reset: moving to HEAD~1\nb7d1e88 HEAD@{1}: commit: 결제 화면 새로 만듦     ← 날린 줄 알았던 그것\nc2e4f77 HEAD@{2}: commit: 로그인 여백 정리\n```\n\n**읽는 법** — 맨 왼쪽이 그 시점의 **주소**, 오른쪽이 그때 무슨 일을 했는지입니다.\n날리기 **직전** 줄을 찾으면 됩니다.\n\n찾았으면 **바로 되돌리지 말고, 옆에 가지를 하나 내서 확인합니다.**\n\n```bash\ngit switch -c 복구 b7d1e88\n```\n> 그 시점의 상태로 **새 가지**를 하나 만들어 그리로 옮겨 갑니다. 지금 상태는 그대로 남습니다.\n\n거기서 파일을 열어 **찾던 게 맞는지 눈으로 확인**한 뒤, 맞으면 그 가지에서 계속 일하거나 `main`에 합칩니다.\n\n> **왜 `git reset --hard`로 바로 안 가나** — 잘못 짚었을 때 또 되돌려야 하기 때문입니다. **가지를 내는 건 아무것도 망가뜨리지 않습니다.** 초보자에게는 이 길이 훨씬 안전합니다.\n\n**AI에게 맡기는 법**\n\n```\n방금 git reset을 잘못 써서 커밋 하나를 날린 것 같아.\ngit reflog 를 읽어서 날리기 직전 상태가 어느 줄인지 찾아줘.\n찾으면 그 시점으로 새 브랜치를 만드는 명령만 알려줘.\n지금 상태는 절대 건드리지 마.\n```\n\n**마지막 줄이 중요합니다.** 「건드리지 마」를 빼면 AI가 알아서 되돌려 버릴 수 있습니다.\n\n---"}, {"title": "📘 말 풀이", "md": "**`reset` — 되감기**\n「없던 일로」 만듭니다. 커밋 자체가 사라집니다. **아직 안 올린 것에만** 씁니다. `--soft`(커밋만 취소, 내용 유지) / `--hard`(내용까지 버림) 두 가지를 구분해서 기억하세요.\n\n**`revert` — 반대로 하기**\n「반대되는 일을 새로 합니다.」 원래 커밋은 그대로 남고 그것을 무르는 커밋이 하나 더 얹힙니다. **이미 올린 것에는 이것만** 씁니다.\n\n**`reflog` — 지나온 자리 기록**\n내 저장소가 거쳐 간 모든 지점의 목록. 커밋 목록(`log`)과 달리 **되감아서 사라진 것까지** 남아 있습니다. 약 30일 보관. **날린 것 같으면 무조건 여기부터.**"}, {"title": "⚠️ 자주 걸리는 함정", "md": "- **인터넷에서 찾은 명령을 상황 확인 없이 칩니다.** 대부분의 사고가 여기서 납니다. **`git status`와 `git log --oneline`을 먼저** 치고, 지금이 ①②③ 중 어디인지 정한 다음에 명령을 고릅니다.\n- **이미 올린 것에 `reset`을 씁니다.** 내 컴퓨터와 GitHub이 어긋납니다. 그다음 `push`가 거부되고, 당황해서 `--force`를 치면 진짜 사고가 됩니다. **올린 것은 `revert`입니다.**\n- **`--hard`를 먼저 시도합니다.** 대부분은 `--soft`로 충분합니다. 순서를 지킵니다.\n- **날렸다고 판단하고 처음부터 다시 만듭니다.** `reflog`를 안 봐서 그렇습니다. **30일 안이면 대개 살아 있습니다.**\n- **커밋 안 한 변경도 `reflog`로 찾을 수 있다고 믿습니다.** 못 찾습니다. Git이 기록한 적이 없기 때문입니다. **커밋을 자주 하는 이유가 이것입니다.**\n- **되돌린 다음 `push`를 안 합니다.** 내 컴퓨터만 되돌아가고 GitHub은 그대로입니다."}, {"title": "⚡ 이렇게 하세요 — 일부러 망치고 되돌리는 연습", "md": "**읽기만 하면 정작 필요할 때 손이 안 움직입니다. 지금 15분 써서 세 번 망가뜨립니다.**\n연습용 폴더를 하나 새로 만들어서 합니다. 진짜 프로젝트에서 하지 마세요.\n\n### 준비 — 연습장 만들기\n\n```bash\nmkdir ~/git-연습 && cd ~/git-연습\ngit init\necho \"첫 줄입니다\" > 연습.txt\ngit add 연습.txt\ngit commit -m \"첫 커밋\"\n```\n> 폴더를 만들고 → 저장소로 만들고 → 파일 하나 만들고 → 담아서 → 저장합니다.\n\n### 연습 ① 아직 커밋 안 한 것 버리기\n\n```bash\necho \"엉망으로 고침\" >> 연습.txt\ncat 연습.txt\n```\n> 파일을 망가뜨리고 → 망가진 걸 눈으로 봅니다.\n\n```bash\ngit restore 연습.txt\ncat 연습.txt\n```\n> 되돌리고 → **「첫 줄입니다」만 남았는지 확인합니다.** 남았으면 ① 성공입니다.\n\n### 연습 ② 커밋했는데 안 올린 것 되감기\n\n```bash\necho \"잘못된 두 번째 줄\" >> 연습.txt\ngit add . && git commit -m \"잘못된 커밋\"\ngit log --oneline\n```\n> 망가뜨려서 커밋까지 하고 → 목록에 **두 줄**이 보이는 걸 확인합니다.\n\n```bash\ngit reset --hard HEAD~1\ngit log --oneline\ncat 연습.txt\n```\n> 한 칸 되감고 → 목록이 **한 줄로 줄었는지**, 파일이 원래대로인지 확인합니다. 줄었으면 ② 성공입니다.\n\n### 연습 ③ 날린 것 찾아내기 — **가장 중요합니다**\n\n방금 ②에서 날린 커밋을 **다시 살립니다.**\n\n```bash\ngit reflog\n```\n> 지나온 자리 목록을 봅니다. **「잘못된 커밋」이라는 글자가 아직 보입니다.** 그 줄 맨 앞 주소를 복사합니다.\n\n```bash\ngit switch -c 복구연습 여기에복사한주소\ncat 연습.txt\n```\n> 그 시점으로 새 가지를 내고 → 파일에 **「잘못된 두 번째 줄」이 돌아왔는지** 확인합니다. 돌아왔으면 ③ 성공입니다.\n\n**이 순간을 기억하세요.** 진짜로 날렸을 때 손이 여기로 갑니다.\n\n```bash\ngit switch -\n```\n> 원래 가지로 돌아옵니다.\n\n### 연습 ④ 이미 올린 것 되돌리기 (선택)\n\n2절에서 만든 진짜 저장소에서 해 봅니다. 사소한 변경 하나를 커밋하고 `push`한 뒤,\n\n```bash\ngit log --oneline\ngit revert 방금커밋주소\ngit push\n```\n> 커밋 주소를 찾고 → 반대로 하는 커밋을 만들고 → 올립니다.\n\nGitHub 웹페이지에서 **커밋이 두 개(원래 것 + 되돌린 것) 다 보이는지** 확인합니다. 이게 「역사를 지우지 않고 되돌린다」의 모습입니다.\n\n### 연습장 치우기\n\n```bash\nrm -rf ~/git-연습\n```\n> 연습 폴더를 지웁니다. **`rm -rf`는 되돌릴 수 없는 명령입니다.** 경로가 `~/git-연습`이 맞는지 눈으로 한 번 더 확인하고 치세요.\n\n### 이렇게 해 봤습니다 — 2026-09-09 · 네 가지를 실제로 돌려 봤습니다\n\n연습용 저장소를 하나 만들어 **일부러 망가뜨리고 네 가지 방법으로 되살려** 봤습니다. 결과입니다.\n\n| 상황 | 한 일 | 결과 |\n|---|---|---|\n| 아직 저장 안 함 | 파일을 엉뚱한 내용으로 덮어씀 → `restore` | **원래 내용으로 돌아옴** |\n| 저장했는데 안 올림 | 잘못된 커밋을 만듦(3개) → `reset` | **커밋 2개로 줄고 파일도 돌아옴** |\n| 이미 올림 | `revert` | **커밋이 3개 → 4개로 «늘었습니다».** 지운 게 아니라 «되돌리는 커밋»이 하나 더 쌓입니다 |\n| 날린 것 같을 때 | 두 개를 날린 뒤 `reflog` | **날린 커밋이 목록에 그대로 남아 있었고**, 그 번호로 되살렸습니다 |\n\n**세 번째 줄이 가장 헷갈리는 자리입니다.** 되돌렸는데 커밋 수가 늘어나서 *\"안 된 건가?\"* 싶습니다.\n**그게 맞게 된 것입니다.** 남들이 이미 받아 간 역사를 지우면 그쪽이 깨지니까, 지우는 대신 **「이걸 취소합니다」라는 기록을 새로 남기는** 것입니다.\n\n**네 번째가 이 절에서 제일 중요합니다.** 날렸다고 생각한 것이 실제로는 남아 있었습니다.\n**당황해서 다시 만들기 전에 `reflog`부터 봅니다.**"}, {"title": "✅ 됐는지 확인", "md": "- [ ] **일부러 망치고 되돌려 봤나** — 읽기만 한 게 아니라 위의 연습 ①②③을 실제로 손으로 쳐 봤나\n- [ ] 연습 ③에서 **날린 커밋을 `reflog`로 다시 찾아냈나**\n- [ ] 「아직 커밋 안 함 / 커밋했는데 안 올림 / 이미 올림」 **셋의 처리가 다르다**는 걸 아나\n- [ ] 날린 것 같을 때 **가장 먼저 칠 명령**이 `git reflog`라는 걸 아나\n- [ ] **이미 올린 것에는 `reset`이 아니라 `revert`**를 쓴다는 걸 아나\n- [ ] `git push --force`가 **왜 위험한지** 한 문장으로 말할 수 있나\n- [ ] 지금 어느 단계인지 모를 때 **먼저 칠 명령**(`git status`)을 아나\n\n하나라도 «아니오»면 연습으로 돌아갑니다. **이 절만은 읽고 넘어가면 안 됩니다.**"}, {"title": "🔎 더 깊이", "md": "- 밖으로 나간 것(배포된 서비스)을 되돌리는 건 다른 문제입니다 → <a class=\"xref\" href=\"#7\">Stage 7<\/a>. 이 절은 **내 컴퓨터 안**의 되돌리기입니다.\n- 되돌릴 일 자체를 줄이는 방법이 다음 절입니다 → 6절 「가지(브랜치)」. 본줄기를 안 건드리고 옆에서 해 보면 되돌릴 일이 줄어듭니다.\n- 검색해 볼 말 — `git reset soft mixed hard 차이`, `git revert vs reset`, `git reflog 복구`"}]}, {"file": "6-가지.md", "id": "s4_5-6", "no": "6", "title": "가지(브랜치) — 1인에게 맞는 방식", "through": "main 하나 + 작업마다 짧은 가지 하나. 그 이상은 여러 명이 있을 때 쓰는 것이다.", "time": "25분", "need": ["GitHub 계정"], "head": "", "secs": [{"title": "왜 이걸 하나", "md": "5절에서 배운 건 **망한 뒤에 되돌리는 법**입니다.\n이 절은 **애초에 본줄기가 안 망하게 하는 법**입니다.\n\n가지를 쓰면 이렇게 됩니다.\n\n> 새 기능을 시도합니다 → 마음에 안 듭니다 → **가지를 지웁니다** → 끝.\n> 되돌릴 것도 없습니다. **본줄기는 처음부터 안 건드렸으니까요.**\n\n그리고 하나 더 — **여기서 만든 가지가 <a class=\"xref\" href=\"#7\">Stage 7<\/a>에서 그대로 PR이 됩니다.**\n가지 없이는 PR이 없고, PR이 없으면 자동 검사를 걸 문이 없습니다. **THE CHAIN이 여기를 지납니다.**"}, {"title": "가지가 뭔가", "md": "`main`이라는 **본줄기**가 하나 있습니다. 지금까지 커밋한 게 전부 여기 쌓였습니다.\n\n가지를 만든다는 건 **그 지점에서 옆으로 길을 하나 내는 것**입니다.\n\n```\nmain:   ●───●───●───────────●   ← 본줄기는 그대로\n                 \\         /\n가지:              ●───●─┘      ← 옆에서 따로 해 보고, 됐으면 합침\n```\n\n옆 길에서 무슨 짓을 해도 **본줄기는 멀쩡합니다.**\n잘되면 합치고(merge), 안 되면 가지를 버립니다. **버리는 게 공짜라는 게 핵심입니다.**\n\n**AI에게 큰 걸 시킬 때 특히 그렇습니다.** 「이 기능 전체를 다시 짜줘」를 가지에서 시키면,\n결과가 엉망이어도 **가지를 지우면 아무 일도 없던 게 됩니다.**"}, {"title": "1인에게 맞는 방식 — 딱 이것만", "md": "인터넷에서 브랜치 전략을 찾아보면 이름 붙은 방식이 여럿 나옵니다. **전부 여러 명을 전제로 만든 것입니다.**\n릴리스 담당, 리뷰어, 배포 승인자가 따로 있는 조직에서 **역할 사이의 경계**를 그으려고 만든 규칙입니다.\n혼자면 그 경계가 전부 나 하나입니다. 규칙만 남고 이유가 없어집니다.\n\n**혼자는 이거면 충분합니다.**\n\n> ## `main` 하나 + 작업마다 짧은 가지 하나\n\n| 항목 | 규칙 |\n|---|---|\n| 본줄기 | **`main` 하나.** 항상 돌아가는 상태를 유지합니다 |\n| 가지 이름 | 무슨 일인지 알아볼 수 있게. `login-fix`, `payment-ui` |\n| 가지 수명 | **짧게.** 하루이틀, 길어도 며칠. 오래 두면 합칠 때 아픕니다 |\n| 합친 뒤 | **지웁니다.** 안 지우면 목록이 쓰레기통이 됩니다 |\n\n**「짧게」가 왜 중요한가** — 가지를 오래 두면 그동안 `main`도 앞으로 갑니다. 둘이 벌어질수록 합칠 때 충돌이 늘어납니다. **작게 나눠서 자주 합치는 게 덜 아픕니다.**"}, {"title": "한 바퀴 — 만들고, 일하고, 합치고, 지운다", "md": "### ① 가지를 만들고 그리로 옮겨 갑니다\n\n```bash\ngit switch -c login-fix\n```\n> `login-fix`라는 가지를 만들고 그리로 이동합니다. (`-c`가 「만들면서」라는 뜻입니다)\n\n```bash\ngit branch\n```\n> 가지 목록을 보여 줍니다. 지금 있는 가지 앞에 `*`가 붙습니다.\n\n### ② 거기서 일하고 커밋합니다\n\n평소대로 합니다. 파일을 고치고, `git add`하고, `git commit`합니다.\n**이 커밋들은 `main`에 안 보입니다.** 옆 길에만 쌓입니다.\n\n```bash\ngit push -u origin login-fix\n```\n> 이 가지를 GitHub에도 올립니다. 처음 한 번만 `-u origin 가지이름`을 붙이고, 다음부터는 `git push`만 하면 됩니다.\n\n### ③ 본줄기로 돌아와 합칩니다\n\n```bash\ngit switch main\n```\n> 본줄기로 돌아옵니다. **파일 내용이 통째로 바뀝니다.** 가지에서 만든 게 안 보이는 게 정상입니다.\n\n```bash\ngit merge login-fix\n```\n> 가지에서 한 일을 본줄기에 합칩니다.\n\n```bash\ngit push\n```\n> 합친 결과를 GitHub에 올립니다.\n\n### ④ 다 쓴 가지를 지웁니다\n\n```bash\ngit branch -d login-fix\n```\n> 내 컴퓨터에서 그 가지를 지웁니다. (`-d`는 「합쳐진 것만 지운다」라 안전합니다. 안 합쳐졌으면 거부합니다)\n\n```bash\ngit push origin --delete login-fix\n```\n> GitHub에서도 그 가지를 지웁니다.\n\n**합치지 않고 버릴 때**\n\n```bash\ngit switch main\ngit branch -D login-fix\n```\n> 본줄기로 돌아가서 → 가지를 **강제로** 지웁니다. (`-D` 대문자는 「안 합쳐졌어도 지운다」입니다) 시도해 봤는데 아니었을 때 이렇게 버립니다. **본줄기는 아무 영향 없습니다.**"}, {"title": "충돌이 났을 때", "md": "합칠 때 **같은 줄을 양쪽에서 다르게 고쳤으면** Git이 판단을 미룹니다. 이런 게 파일에 들어옵니다.\n\n```\n<<<<<<< HEAD\n본줄기 쪽 내용\n=======\n가지 쪽 내용\n>>>>>>> login-fix\n```\n\n**에러가 아닙니다.** 「둘 중 뭘 남길지 네가 정해라」는 뜻입니다.\n`<<<<<<<`, `=======`, `>>>>>>>` 줄까지 다 지우고 남길 내용만 남기면 됩니다.\n\n혼자 작업하면 충돌은 드뭅니다. 나더라도 AI에게 맡기면 됩니다.\n\n```\nmerge 하다가 충돌이 났어. 충돌 난 파일을 열어서 양쪽이 각각 무슨 의도였는지 설명해주고,\n어느 쪽을 남기는 게 맞는지 추천해줘. 내가 고르면 그때 정리해줘.\n```\n\n**「내가 고르면」이 중요합니다.** 충돌은 판단이 필요한 자리라 AI에게 결정까지 맡기지 않습니다."}, {"title": "📘 말 풀이", "md": "**브랜치(branch, 가지)**\n본줄기를 건드리지 않고 옆에서 따로 해 보는 길. 만드는 것도 지우는 것도 순식간이고, 지워도 본줄기에 아무 흔적이 없습니다. **`main`**은 관례적으로 붙는 본줄기의 이름입니다.\n\n**병합(merge, 합치기)**\n가지에서 한 일을 본줄기로 가져오는 것. 합치고 나면 가지의 커밋들이 본줄기 기록에도 들어옵니다.\n\n**충돌(conflict)**\n같은 파일의 같은 줄을 양쪽에서 다르게 고쳐서, Git이 어느 쪽이 맞는지 못 정하는 상태. 고장이 아니라 **사람에게 넘긴 질문**입니다."}, {"title": "⚠️ 자주 걸리는 함정", "md": "- **가지에서 일하는 걸 잊고 `main`에서 그냥 작업합니다.** 가장 흔합니다. 작업 시작 전에 `git branch`로 지금 어디인지 확인하는 걸 습관으로 만드세요.\n- **가지를 만들기 전에 커밋을 안 합니다.** 안 커밋한 변경은 가지를 옮겨도 따라옵니다. 헷갈립니다. **옮기기 전에 커밋하거나 `git stash`로 치워 둡니다.**\n- **가지를 몇 주씩 둡니다.** 본줄기와 멀어져서 합칠 때 충돌 범벅이 됩니다. **짧게, 자주.**\n- **합친 뒤에 안 지웁니다.** 몇 달 뒤 가지가 스무 개 쌓여 뭐가 살아 있는 건지 모르게 됩니다.\n- **`git switch main`을 했는데 파일이 사라졌다고 놀랍니다.** 사라진 게 아니라 **가지에 그대로 있습니다.** 다시 `git switch 가지이름`을 치면 돌아옵니다.\n- **복잡한 브랜치 전략을 따라 하려 합니다.** 개발 가지·릴리스 가지·핫픽스 가지를 혼자 운영하면 **일보다 규칙 지키기에 시간이 더 듭니다.** 협업자가 생기면 그때 늘립니다."}, {"title": "⚡ 이렇게 하세요", "md": "진짜 저장소에서 한 바퀴를 **끝까지** 돌아 봅니다. 사소한 변경 하나로 충분합니다.\n\n```bash\ngit switch -c 연습가지\ngit branch\n```\n> 가지를 만들고 → `* 연습가지`에 별표가 붙었는지 확인합니다.\n\n```bash\necho \"가지에서 쓴 줄\" >> README.md\ngit add README.md && git commit -m \"README에 한 줄 추가\"\ngit push -u origin 연습가지\n```\n> 고치고 → 커밋하고 → GitHub에 올립니다.\n\nGitHub 웹페이지에 가면 **「연습가지」가 목록에 보입니다.** 여기서 잠깐 멈춥니다 —\n화면에 **Compare & pull request** 버튼이 떠 있을 겁니다. **지금은 누르지 않습니다.** <a class=\"xref\" href=\"#7\">Stage 7<\/a>에서 그 버튼을 씁니다.\n\n```bash\ngit switch main\ngit merge 연습가지\ngit push\n```\n> 본줄기로 돌아와 → 합치고 → 올립니다.\n\n```bash\ngit branch -d 연습가지\ngit push origin --delete 연습가지\n```\n> 내 컴퓨터와 GitHub 양쪽에서 가지를 지웁니다.\n\n**가지 쓰는 습관을 AI에게 박아 둡니다.**\n\n```\n이 프로젝트의 CLAUDE.md 에 브랜치 규칙을 적어줘. 내용은 이 셋:\n\n1. main에서 직접 작업하지 않는다. 작업마다 짧은 브랜치를 하나 만든다\n2. 브랜치 이름은 무슨 일인지 알아볼 수 있게 영어 소문자와 하이픈으로 짓는다\n3. 큰 변경을 시작하기 전에는 반드시 지금 어느 브랜치인지 확인하고,\n   main이면 브랜치를 먼저 만들자고 나에게 말한다\n```"}, {"title": "✅ 됐는지 확인", "md": "- [ ] `git branch`를 쳤을 때 **지금 어느 가지에 있는지 별표로 보이나**\n- [ ] 가지를 만들어 커밋하고 **`main`으로 돌아갔을 때 그 변경이 안 보이나** (안 보여야 정상)\n- [ ] 합친 뒤 `main`에서 **그 변경이 보이나**\n- [ ] GitHub 웹페이지의 가지 목록에서 **연습 가지가 지워졌나**\n- [ ] 「본줄기를 안 건드리고 옆에서 해 본다」가 **왜 AI에게 크게 시키는 데 유리한지** 말할 수 있나\n- [ ] 복잡한 가지 전략이 **여러 명일 때 쓰는 것**이라는 걸 아나"}, {"title": "🔎 더 깊이", "md": "- 이 가지가 PR이 되고, 그 PR에 자동 검사가 걸립니다 → <a class=\"xref\" href=\"#7\">Stage 7<\/a>. **`main`에 직접 못 밀게 문을 잠그는 설정**도 거기서 합니다.\n- 다음은 「여기까지가 한 판」을 표시하는 법입니다 → 7절 「태그와 릴리스」\n- 검색해 볼 말 — `GitHub Flow`, `git switch 브랜치`, `git merge 충돌 해결`"}]}, {"file": "7-태그와릴리스.md", "id": "s4_5-7", "no": "7", "title": "태그와 릴리스 — 여기까지가 1.0", "through": "되돌아갈 지점 중 특별한 것에 이름을 붙인다. 릴리스 노트는 버튼 하나로 나온다.", "time": "20분", "need": ["GitHub 계정"], "head": "", "secs": [{"title": "왜 이걸 하나", "md": "커밋이 백 개쯤 쌓이면 문제가 생깁니다. **어디가 \"제대로 돌아가던 그때\"인지 모릅니다.**\n\n```\na3f9c21  로그인 여백 정리\nb7d1e88  결제 오류 메시지 수정\nc2e4f77  카드 크기 조정\n... (아흔일곱 개 더)\n```\n\n이 중에 **「손님한테 처음 보여 준 그 상태」**가 어디인지 알 수 있나요? 못 찾습니다.\n\n태그는 그 지점에 **깃발을 꽂는 일**입니다.\n그리고 릴리스는 그 깃발에 **「이번에 뭐가 달라졌는지」 설명을 붙이는 일**입니다."}, {"title": "버전 번호 읽는 법", "md": "`1.4.2` 처럼 점으로 나뉜 세 자리를 씁니다. **자리마다 뜻이 다릅니다.**\n\n| 자리 | 이름 | 언제 올리나 | 쉽게 말하면 |\n|---|---|---|---|\n| **첫 자리** (`1`.4.2) | 큰 자리 | **쓰던 방식이 깨질 때** | \"예전처럼 쓰면 안 됩니다\" |\n| **가운데** (1.`4`.2) | 기능 자리 | **기능이 늘었을 때** (기존 건 그대로) | \"새로 생긴 게 있습니다\" |\n| **마지막** (1.4.`2`) | 고침 자리 | **버그를 고쳤을 때** | \"고장 난 걸 고쳤습니다\" |\n\n**읽는 사람 입장에서의 뜻**\n\n| 무엇에서 무엇으로 | 받는 사람이 해야 할 일 |\n|---|---|\n| `1.4.2` → `1.4.3` | 없음. 그냥 받으면 됩니다 |\n| `1.4.2` → `1.5.0` | 없음. 새 기능이 생겼을 뿐입니다 |\n| `1.4.2` → `2.0.0` | **뭔가 바뀌었으니 확인해야 합니다** |\n\n**앞자리가 `0`이면** (`0.3.1` 등) 「아직 정식 전」이라는 뜻입니다. 마음대로 바꿔도 되는 시기입니다.\n**`1.0.0`을 붙이는 순간이 「이제 이 약속을 지키겠다」는 선언**입니다. 남에게 처음 제대로 내놓을 때 붙입니다."}, {"title": "언제 버전을 올리나 — 혼자일 때", "md": "혼자 만들 때는 이렇게 단순화합니다.\n\n| 상황 | 어떻게 |\n|---|---|\n| 만드는 중, 아직 남에게 안 보여 줌 | **태그 안 붙여도 됩니다.** 커밋만 쌓습니다 |\n| 남에게 처음 보여 주는 상태 | **`v0.1.0`** |\n| 손님이 실제로 쓰기 시작함 | **`v1.0.0`** |\n| 그 뒤 기능 하나 추가 | 가운데 올림 (`v1.1.0`) |\n| 그 뒤 버그 하나 고침 | 마지막 올림 (`v1.1.1`) |\n\n**붙이는 기준 한 줄** — *\"이 상태로 되돌아올 일이 생길까?\"* 그렇다면 태그를 붙입니다.\n문제가 터졌을 때 **\"일단 지난 태그로 되돌리자\"**가 가장 빠른 복구입니다.\n\n> 태그 이름 앞에 `v`를 붙이는 건 관례입니다. 안 붙여도 되지만, 붙이면 목록에서 한눈에 구분됩니다."}, {"title": "태그 붙이기", "md": "```bash\ngit tag -a v1.0.0 -m \"처음 정식으로 내놓음\"\n```\n> 지금 지점에 `v1.0.0`이라는 깃발을 꽂습니다. 따옴표 안이 그 깃발의 설명입니다.\n\n```bash\ngit push origin v1.0.0\n```\n> 그 깃발을 GitHub에도 올립니다. **태그는 `git push`만으로는 안 올라갑니다. 따로 올려야 합니다.**\n\n```bash\ngit tag\n```\n> 지금까지 붙인 태그 목록을 봅니다.\n\n지난 상태로 돌아가 확인하고 싶을 때.\n\n```bash\ngit switch -c 확인용 v1.0.0\n```\n> 그 태그 시점의 상태로 새 가지를 내서 들어갑니다. **지금 상태는 그대로 남습니다.**"}, {"title": "릴리스 노트 — 버튼 하나로 나옵니다", "md": "GitHub에는 **합쳐진 작업 목록을 읽어서 릴리스 노트를 자동으로 만들어 주는 버튼**이 있습니다.\n직접 쓰지 않아도 됩니다.\n\n1. GitHub 저장소 페이지 오른쪽의 **Releases** → **Draft a new release**\n2. **Choose a tag**에서 방금 올린 태그를 고릅니다\n3. **Generate release notes** 버튼을 누릅니다\n4. 지난 태그 이후로 합쳐진 작업들이 **목록으로 자동으로 채워집니다**\n5. 맨 위에 사람이 읽을 한두 줄을 얹고 **Publish release**\n\n**여기서 6절과 4절이 값을 합니다.** 자동 생성되는 목록은 **합쳐진 가지의 이름과 커밋 메시지**로 만들어집니다.\n그동안 메시지를 「수정」「업데이트」로만 써 왔다면 **릴리스 노트도 「수정」「업데이트」가 됩니다.**\n「무엇을 왜 바꿨는지」를 써 온 사람은 **여기서 공짜로 문서를 얻습니다.**\n\n**AI에게 사람 말로 다듬게 하기**\n\n```\n아래는 GitHub이 자동 생성한 릴리스 노트야.\n이걸 개발자가 아닌 사용자가 읽을 수 있게 다시 써줘.\n\n- 맨 위에 「이번에 달라진 것」 3줄 요약\n- 기술 용어는 풀어서\n- 자동 생성된 원래 목록은 아래에 그대로 남겨 둬\n\n(여기에 붙여넣기)\n```"}, {"title": "⚠️ 지금 넣지 않는 것 — worktree", "md": "여러 작업 폴더를 동시에 띄워 놓고 **에이전트를 둘 이상 나란히 돌리는** 격리 방식이 있습니다. `worktree`라고 부릅니다.\n\n**지금은 넣지 않습니다.**\n\n- **한 번에 하나씩 하면 필요가 없습니다.** 가지만 있으면 충분합니다.\n- **지금 배우면 헷갈리기만 합니다.** 폴더가 여러 개로 늘어나서, 방금 익힌 「지금 어느 가지에 있나」가 「지금 어느 폴더의 어느 가지에 있나」로 복잡해집니다.\n- 필요해지는 조건이 분명합니다 — **AI를 둘 이상 동시에 돌려서 서로 파일을 밟기 시작할 때**입니다. 그때 배우면 30분이면 됩니다.\n\n**먼저 되돌리기와 가지가 손에 붙는 게 우선입니다.** 그다음에 늘립니다."}, {"title": "📘 말 풀이", "md": "**태그(tag)**\n특정 커밋에 붙이는 이름표. 커밋 주소(`a3f9c21…`)는 사람이 못 외우니까 `v1.0.0` 같은 이름을 대신 붙입니다. **깃발**이라고 생각하면 됩니다. 붙인 뒤에는 움직이지 않습니다.\n\n**릴리스(release)**\nGitHub이 태그 위에 얹어 주는 **발표 페이지**. 「이번 판에서 뭐가 달라졌는지」 설명과, 필요하면 내려받을 파일이 함께 놓입니다. 태그는 Git의 기능이고 릴리스는 GitHub의 기능입니다.\n\n**버전 번호 체계(Semantic Versioning, 줄여서 SemVer)**\n「첫 자리는 깨질 때, 가운데는 기능이 늘 때, 마지막은 고칠 때」라는 **널리 쓰이는 약속**. 강제는 아니지만 이걸 따르면 남이 숫자만 보고 판단할 수 있습니다."}, {"title": "⚠️ 자주 걸리는 함정", "md": "- **태그를 만들고 `git push`만 합니다.** 안 올라갑니다. **`git push origin 태그이름`**을 따로 쳐야 합니다.\n- **처음부터 `v1.0.0`을 붙입니다.** 아직 바뀔 게 많은 시기에 `1`을 붙이면 곧 `2.0.0`, `3.0.0`이 됩니다. **`v0.x`로 시작하는 게 편합니다.**\n- **커밋 하나마다 태그를 붙입니다.** 깃발이 백 개면 깃발이 아닙니다. **되돌아올 만한 지점에만** 붙입니다.\n- **태그 이름을 재활용합니다.** 이미 붙인 태그를 다른 커밋으로 옮기면, 그걸 받아 간 곳과 어긋납니다. **새 번호를 붙입니다.**\n- **릴리스 노트를 손으로 다 씁니다.** 자동 생성 버튼을 먼저 누르고 위에 요약만 얹습니다.\n- **worktree부터 배우려 합니다.** 순서가 거꾸로입니다. 되돌리기와 가지가 먼저입니다."}, {"title": "⚡ 이렇게 하세요", "md": "지금 저장소에 첫 깃발을 꽂습니다.\n\n```bash\ngit switch main\ngit pull\n```\n> 본줄기로 가서 → 최신 상태를 받아 옵니다. **태그는 최신 상태에 붙여야 합니다.**\n\n```bash\ngit tag -a v0.1.0 -m \"처음 만든 상태\"\ngit push origin v0.1.0\n```\n> 깃발을 꽂고 → GitHub에 올립니다.\n\n```bash\ngit tag\n```\n> 목록에 `v0.1.0`이 보이면 성공입니다.\n\n이어서 GitHub 웹페이지에서.\n\n1. 저장소 페이지 오른쪽 **Releases** → **Draft a new release**\n2. **Choose a tag** → `v0.1.0`\n3. **Generate release notes** 클릭 — 목록이 자동으로 채워집니다\n4. 맨 위에 한 줄 얹고 **Publish release**\n\n마지막으로 **태그를 붙이는 기준을 프로젝트에 적어 둡니다.**\n\n```\n이 프로젝트의 CLAUDE.md 에 버전 규칙을 적어줘. 내용은 이 셋:\n\n1. 되돌아올 만한 지점에만 태그를 붙인다. 커밋마다 붙이지 않는다\n2. 첫 자리는 쓰던 방식이 깨질 때, 가운데는 기능이 늘 때, 마지막은 고쳤을 때 올린다\n3. 태그를 만들면 git push origin <태그이름> 으로 따로 올려야 한다는 걸 잊지 말고 알려준다\n```"}, {"title": "✅ 됐는지 확인", "md": "- [ ] `git tag`를 쳤을 때 **내가 붙인 태그 이름이 나오나**\n- [ ] GitHub 저장소 페이지 오른쪽에 **Releases 항목에 숫자 1이 보이나**\n- [ ] 릴리스 페이지에 **자동 생성된 변경 목록이 채워져 있나**\n- [ ] 「첫 자리 / 가운데 / 마지막」이 각각 **언제 올라가는지** 말할 수 있나\n- [ ] 태그를 만든 뒤 **`git push origin 태그이름`을 따로 쳐야 한다**는 걸 아나\n- [ ] worktree를 **지금은 안 배운다**는 걸 알고, 언제 필요해지는지 아나"}, {"title": "🔎 더 깊이", "md": "- **THE CHAIN — 여기서 만든 저장소·가지·태그가 <a class=\"xref\" href=\"#7\">Stage 7<\/a>에서 그대로 쓰입니다.** 가지는 PR이 되고, PR에는 자동 검사가 걸리고, 태그는 배포한 판을 가리키는 이름이 됩니다. 문제가 나면 **지난 태그로 되돌리는 것**이 가장 빠른 복구가 됩니다.\n- 이 장에서 만든 커밋 규칙은 <a class=\"xref\" href=\"#5\">Stage 5<\/a>에서 AI에게 크게 시킬 때 안전망으로 쓰입니다.\n- 검색해 볼 말 — `Semantic Versioning 한국어`, `GitHub automatically generated release notes`, `git tag push`"}]}]}, {"folder": "05-구현", "key": "5", "name": "구현", "color": "#7A3E9D", "sub": "바이브 코딩과 오류 해결", "goal": "시키고, 검증하고, 막히면 푼다", "makes": "기능 하나 + 커밋 · 테스트", "time": "6시간", "need": ["Stage 3의 지침", "Stage 4.5의 저장소"], "head": "여기서 처음으로 **돌아가는 것**이 나옵니다.\n그리고 처음으로 **막힙니다.** 막히는 게 정상이고, 푸는 순서가 있습니다.", "metasecs": [{"title": "✅ 자가 체크", "md": "- [ ] **계획을 먼저 읽고** 나서 실행시켰나 (바로 시키지 않았나)\n- [ ] 테스트가 하나라도 도나\n- [ ] 에러를 **요약하지 말고 그대로** 붙여 봤나\n- [ ] 같은 에러가 세 번 반복됐을 때 **무엇을 바꿔야 하는지** 아나"}, {"title": "다음으로", "md": "여기서 만든 기능이 Stage 6에서 **진짜 데이터베이스**에 붙습니다."}], "sections": [{"file": "1-계획먼저.md", "id": "s5-1", "no": "1", "title": "시키기 전에 계획을 읽는다", "through": "바로 \"만들어 줘\"라고 하지 않는다. 계획을 먼저 읽고 고친 다음 시킨다.", "time": "50분", "need": ["Stage 3의 지침", "Stage 4.5의 저장소"], "head": "여기서 처음으로 **돌아가는 것**이 나옵니다.\n그리고 대부분의 사람이 바로 여기서 처음 크게 망칩니다. 이유는 하나입니다 —\n**\"만들어 줘\"라고 바로 시켜서.**", "secs": [{"title": "왜 이걸 하나", "md": "AI에게 \"만들어 줘\"라고 하면 진짜로 만듭니다. 5분 만에 파일 열두 개가 바뀌어 있습니다.\n문제는 그 열두 개 중에 **내가 시키지 않은 것이 섞여 있다는 것**입니다.\n\nAI는 모르는 것이 있어도 손을 들지 않습니다. **그냥 정합니다.**\n\"구독자 목록은 어디에 저장하지?\" → 혼자 정합니다.\n\"메일은 몇 시에 보내지?\" → 혼자 정합니다.\n\"이미 있는 파일을 지워도 되나?\" → 혼자 정합니다.\n\n이 절을 건너뛰면 그 '혼자 정한 것'을 **코드가 다 만들어진 뒤에** 알게 됩니다.\n그때는 되돌리는 것 말고 방법이 없습니다.\n\n계획을 먼저 읽게 하는 이 한 단계가 **결과를 가장 크게 바꿉니다.**\n이 절 하나만 지켜도 Stage 5의 절반은 성공입니다."}, {"title": "네 걸음 — 살펴보기 → 계획 → 만들기 → 확인", "md": "부엌을 고친다고 생각해 보세요.\n좋은 목수는 오자마자 벽을 뜯지 않습니다. **먼저 둘러보고, 그림을 그려 보여주고, 내가 좋다고 하면 그때 뜯습니다.**\n\n| 걸음 | 무엇을 시키나 | AI가 하는 일 | 내가 하는 일 |\n|---|---|---|---|\n| ① **살펴보기** | \"고치지 말고, 지금 어떻게 되어 있는지만 알려 줘\" | 폴더와 파일을 읽고 요약 | 읽는다 |\n| ② **계획** | \"무엇을 만들고 무엇을 고칠지 계획만 써 줘\" | 계획을 **글로** 내놓음 | ⭐ **읽고 고친다** |\n| ③ **만들기** | \"이 계획대로 해 줘\" | 계획대로만 코드 작성 | 지켜본다 |\n| ④ **확인** | \"됐는지 내가 눈으로 볼 방법을 알려 줘\" | 확인 방법 안내 | ⭐ **직접 눈으로 본다** |\n\n**②와 ④가 사람의 자리입니다.** ①③은 AI가 훨씬 잘합니다.\n1인 사업에서 사람의 병목은 만드는 쪽이 아니라 **보는 쪽**입니다."}, {"title": "계획을 읽는 게 왜 그렇게 큰가", "md": "우리는 코드를 못 읽습니다. 그건 사실입니다.\n**그런데 계획은 읽을 수 있습니다.** 한국어로 쓰인 글이니까요.\n\n계획 문서는 AI가 **혼자 정한 것이 글로 드러나는 유일한 자리**입니다.\n코드가 되고 나면 안 보입니다. 계획일 때는 보입니다.\n그래서 계획 단계가 비개발자에게는 **유일하게 남은 운전대**입니다."}, {"title": "계획을 읽을 때 볼 곳 넷", "md": "코드를 몰라도 이 넷은 볼 수 있습니다.\n\n**① 손대는 파일이 몇 개인가**\n셋을 넘으면 일단 멈춥니다. \"더 작게 쪼개 줘\"라고 말합니다.\n파일 열 개짜리 계획은 성공해도 검증을 못 합니다.\n\n**② 내가 말한 적 없는 것을 혼자 정하지 않았나**\n계획 안에 처음 보는 이름·규칙·화면이 있으면 그건 AI가 지어낸 것입니다.\n\"이건 제가 말한 적 없는데요, 왜 이렇게 정했나요?\"라고 물으면 됩니다.\n\n**③ 되돌릴 수 있나**\n데이터를 지우거나, 메일을 실제로 보내거나, 밖으로 나가는 일이 계획에 있으면\n그 부분만 **따로 떼어서 나중에** 합니다.\n\n**④ 다 됐다는 걸 무엇으로 확인하나**\n계획에 \"확인하는 법\"이 없으면 그 계획은 미완성입니다. 확인 방법을 계획에 넣어 달라고 하세요."}, {"title": "계획 모드는 언제 켜나", "md": "| 상황 | 계획 먼저? |\n|---|---|\n| 처음 만드는 기능 | ⭕ 반드시 |\n| 파일 세 개 이상이 바뀔 것 같을 때 | ⭕ 반드시 |\n| 남이 만든 코드를 건드릴 때 | ⭕ 반드시 |\n| 돈·개인정보가 걸린 곳 | ⭕ 반드시 |\n| 글자 하나 고치기, 색 바꾸기 | ❌ 그냥 시켜도 됨 |\n| 무엇이 어디 있는지 물어보기만 | ❌ 계획 모드로 물어보면 편함 |\n\n**계획 모드에서는 AI가 파일을 못 고칩니다.** 읽기만 합니다.\n그래서 겁 없이 이것저것 물어봐도 됩니다. 망칠 수가 없으니까요.\n처음 며칠은 계획 모드로만 놀아 보는 것을 권합니다."}, {"title": "계획이 부실하면 — 인터뷰를 시킨다", "md": "계획이 두루뭉술하게 나왔다면 AI가 정보가 부족한 것입니다.\n이럴 때 만병통치약에 가까운 한 줄이 있습니다.\n\n> **\"계획 세우기 전에, 나한테 질문 다섯 개 먼저 해 줘.\"**\n\n이 한 줄이 빠뜨리는 것의 대부분을 막습니다. 큰 작업일수록 효과가 큽니다."}, {"title": "📘 말 풀이", "md": "- **계획 모드** — AI가 **읽기만 하고 고치지는 못하는** 상태. 둘러보기와 계획 세우기 전용입니다. 망칠 수 없으니 마음 편히 씁니다.\n- **세션** — AI와의 대화 한 판. 한 세션에 여러 작업을 섞으면 AI가 전부 어중간해집니다. **한 작업 = 한 세션.**\n- **컨텍스트** — AI가 지금 머리에 담고 있는 내용. 작업대 위 그릇이라고 생각하세요. 그릇이 차면 새 재료를 못 올려서 답이 갑자기 멍청해집니다. 그때는 대화를 정리하거나 새로 엽니다."}, {"title": "⚠️ 자주 걸리는 함정", "md": "- **\"계획 세워 줘\" 하고 안 읽는다** — 가장 흔합니다. 계획을 안 읽으면 계획을 안 세운 것과 같습니다. 스크롤만 내리지 말고 위 네 곳을 보세요.\n- **한 세션에 여러 일을 던진다** — \"기획서도 봐 주고, 발송 기능도 만들고, 디자인도 손봐 줘.\" 그릇이 넘쳐서 전부 어중간해집니다.\n- **계획이 마음에 안 드는데 그냥 진행시킨다** — 계획 단계에서 고치는 값은 1, 코드가 된 뒤에 고치는 값은 10입니다.\n- **AI가 \"완료했습니다\"라고 하면 믿는다** — 그건 증거가 아니라 **주장**입니다. 확인은 절 4·6에서 다룹니다.\n- **엉뚱한 폴더에서 시작한다** — 프로젝트 폴더가 아닌 곳에서 시키면 AI가 남의 파일을 고칩니다. **한 작업 = 한 폴더 = 한 세션.**"}, {"title": "⚡ 이렇게 하세요", "md": "**① 살펴보기 — 아직 아무것도 고치지 않게**\n\n```\n계획 모드로 시작해 줘. 아무것도 고치지 마.\n\n이 프로젝트를 처음 보는 사람이라고 생각하고 다음을 알려 줘.\n1. 이 프로젝트가 무엇을 하는 것인지 한 줄로\n2. 폴더가 어떻게 나뉘어 있는지, 각 폴더가 무슨 일을 하는지\n3. 내가 만들려는 기능과 관련 있어 보이는 파일 목록\n4. 지금 상태에서 이미 돌아가는 것과, 아직 안 되는 것\n\n나는 코드를 못 읽으니 전부 한국어로, 짧은 문장으로.\n```\n\n**② 계획 — 코드는 아직 쓰지 않게**\n\n```\n만들 기능: (여기에 한 줄로 씁니다. 예 — 방문자가 이메일을 넣으면 구독자로 저장되는 가입 화면)\n\n바로 만들지 말고, 계획만 글로 써 줘. 형식은 이렇게.\n\n1. 이 기능이 다 되면 사용자가 화면에서 무엇을 할 수 있나 (한 줄)\n2. 새로 만들 파일 목록\n3. 고칠 파일 목록 — 각각 무엇을 왜 고치는지 한 줄씩\n4. 내가 알려주지 않아서 네가 혼자 정한 것 — 전부 솔직하게 나열\n5. 되돌리기 어려운 일이 들어 있나 (데이터 삭제, 실제 메일 발송, 외부로 나가는 것)\n6. 다 됐는지 내가 눈으로 확인할 방법\n\n조건:\n- 고치는 파일이 3개를 넘으면, 3개 이하가 되도록 더 작게 쪼개서 다시 제안해 줘.\n- 코드는 한 줄도 쓰지 마. 계획만.\n```\n\n**③ 계획이 부실할 때 — 인터뷰 시키기**\n\n```\n계획을 세우기 전에, 나한테 질문 5개를 먼저 해 줘.\n네가 지금 몰라서 혼자 정하게 될 것들만 물어봐.\n내가 답하면 그 답을 반영해서 계획을 다시 써 줘.\n```\n\n**④ 계획을 고쳐서 실행시키기**\n\n```\n계획 중에서 이 부분을 고쳐 줘.\n- (고칠 것 1)\n- (고칠 것 2)\n\n고친 계획을 다시 보여 주고, 내가 \"진행\"이라고 하면 그때부터 만들어 줘.\n계획에 없는 파일은 절대 건드리지 마. 계획에 없는 걸 하고 싶으면 먼저 물어봐.\n```"}, {"title": "✅ 됐는지 확인", "md": "- [ ] **계획을 먼저 읽고** 나서 실행시켰나 (바로 \"만들어 줘\"라고 하지 않았나)\n- [ ] 계획에 **새로 만들 파일**과 **고칠 파일** 목록이 눈에 보이나\n- [ ] 계획에 **\"AI가 혼자 정한 것\"** 항목이 있고, 내가 그걸 읽었나\n- [ ] 고칠 파일이 **셋 이하**인가 (넘었다면 쪼개 달라고 했나)\n- [ ] 계획 중 **최소 한 곳**을 내가 고쳐서 다시 받았나\n- [ ] 계획에 **\"내가 눈으로 확인하는 방법\"**이 적혀 있나"}, {"title": "🔎 더 깊이", "md": "- 이 네 걸음은 Claude Code 공식 문서에서 **Explore → Plan → Code → Verify**라는 이름으로 소개하는 흐름과 같습니다. 영어 문서를 볼 때 이 단어로 찾으세요.\n- 계획 모드는 도구에 따라 **plan mode**라고 불립니다. 앱 안에서 `/help`를 치면 지금 쓰는 도구의 이름과 켜는 법이 나옵니다.\n- 이 절에서 만든 계획은 버리지 마세요. 절 3의 **새 기능 흐름**에서 문서로 남기고, 절 7의 7일 로드맵 3일차에서 그대로 씁니다.\n\n> **다음으로 이어지는 것** — 여기서 세운 계획으로 만든 기능은 지금은 내 컴퓨터 안에서만 돕니다.\n> 이 기능이 **Stage 6에서 진짜 데이터베이스에 붙습니다.** 그래서 지금 계획에 \"구독자를 어디에 저장하나\"를 적어 두면, Stage 6에서 그 줄만 바꾸면 됩니다."}]}, {"file": "2-터미널없이.md", "id": "s5-2", "no": "2", "title": "터미널 없이 쓰는 법", "through": "하루의 90%는 데스크톱 앱에서 끝난다. 검은 화면은 배우지 않아도 된다.", "time": "40분", "need": ["Stage 3의 지침", "Stage 4.5의 저장소"], "head": "비개발자가 AI 코딩을 포기하는 첫 번째 이유는 실력이 아닙니다.\n**검은 화면**입니다.", "secs": [{"title": "왜 이걸 하나", "md": "\"AI로 개발한다\"는 말을 들으면 대부분 글자만 가득한 검은 화면을 떠올립니다.\n그리고 첫날 그 화면을 보고 조용히 닫습니다.\n\n그런데 지금은 **데스크톱 앱**이 있습니다. 창을 열고 한국어로 말하면 됩니다.\n파일을 붙이는 것도, 중단하는 것도, 권한을 조절하는 것도 전부 앱 안에서 됩니다.\n\n이 절을 건너뛰면 두 가지가 생깁니다.\n첫째, 매번 \"어떻게 파일을 보여주지?\" 하며 내용을 복사·붙여넣기 하다가 지칩니다.\n둘째, **자동 수락을 잘못 켜 두고** 밖으로 나가는 일까지 AI에게 맡깁니다. 그건 사고입니다."}, {"title": "하루의 90%는 앱 하나에서 끝난다", "md": "| 무엇을 | 어디서 | 얼마나 |\n|---|---|---|\n| 계획 세우기·만들기·고치기 | **데스크톱 앱** | 하루의 90% |\n| 커밋·되돌리기 | 앱 안에서 말로 (Stage 4.5) | 나머지 |\n| 두 번째 눈으로 리뷰 | 다른 도구 하나 (Stage 7) | 밀기 직전 한 번 |\n\n**도구는 둘이면 됩니다. 메인 하나, 백업 하나.**\n메인은 앱으로 쓰고, 백업은 메인이 멈췄을 때만 켭니다.\n셋 이상 깔면 배우는 시간만 늘고 안전은 오히려 나빠집니다."}, {"title": "앱에서 손에 익힐 것 넷", "md": "### ① `@` — 파일을 대화에 붙인다\n\n입력창에 **`@`** 를 치면 폴더 안 파일 목록이 뜹니다. 골라서 넣으면 그 파일이 대화로 들어갑니다.\n\n```\n@src/subscribe.tsx 이 화면에서 이메일 형식이 틀렸을 때 어떻게 되는지 알려 줘\n```\n\n내용을 복사해서 붙일 필요가 없습니다. **`@`가 훨씬 정확합니다** — 복사하면 줄이 잘리거나 일부만 들어갑니다.\n폴더도 붙일 수 있습니다. 다만 폴더를 통째로 붙이면 그릇이 금방 찹니다. **필요한 파일만.**\n\n### ② `!` — 명령 결과를 대화에 붙인다\n\n입력창에서 **`!`** 로 시작하면 그 뒤의 명령을 실행해서 **결과만** 대화에 넣습니다.\n검은 화면을 따로 열 필요가 없다는 뜻입니다.\n\n```\n!npm test\n```\n\n에러가 났을 때 이게 특히 중요합니다. 절 5에서 다시 나옵니다 — **에러는 요약하지 말고 그대로 넣습니다.**\n\n### ③ 중단 — `Esc`\n\nAI가 엉뚱한 방향으로 달리기 시작하면 **`Esc`** 한 번으로 즉시 멈춥니다.\n멈추는 게 미안한 일이 아닙니다. **끝까지 가게 두는 게 더 비쌉니다.**\n잘 안 멈추면 `Ctrl` + `C`가 비상 정지입니다.\n\n멈춘 다음에는 이렇게 말합니다.\n\n```\n지금 하던 것 멈추고, 방금까지 무엇을 바꿨는지만 알려 줘. 더 고치지 마.\n```\n\n### ④ 자동 수락 — 켜고 끄기\n\n**자동 수락**은 \"하나하나 물어보지 말고 알아서 해\"라는 스위치입니다.\n켜면 빠릅니다. 그리고 켜 둔 채로 잘못된 일을 시키면 **아주 빠르게 망합니다.**\n\n기본은 **꺼 둡니다.** 그리고 아래 기준으로만 켭니다."}, {"title": "⭐ 언제 켜고 언제 끄나 — 기준은 하나", "md": "> **되돌릴 수 있으면 켠다. 밖으로 나가면 끈다.**\n\n| 하는 일 | 되돌릴 수 있나 | 자동 수락 |\n|---|---|---|\n| 내 컴퓨터 안 파일 고치기 (커밋해 뒀다면) | ⭕ | **켠다** |\n| 화면 모양·문구 다듬기 | ⭕ | **켠다** |\n| 테스트 돌리기 | ⭕ | **켠다** |\n| 새 도구·부품 설치하기 | 🔺 되돌릴 수 있지만 지저분해짐 | 꺼 둔다 |\n| 데이터베이스 내용 지우기 | ❌ | **끈다** |\n| 실제로 메일·문자 보내기 | ❌ 이미 받은 사람에게서 못 뺏음 | **끈다** |\n| 결제·환불 건드리기 | ❌ | **끈다** |\n| 인터넷에 올리기(배포)·저장소에 밀기 | 🔺 되돌리기가 남 눈에 보임 | **끈다** |\n| 남의 컴퓨터·남의 서비스에 닿는 일 | ❌ | **끈다** |\n\n**자동 수락을 켜기 전 조건이 하나 더 있습니다 — 지금 상태가 커밋되어 있어야 합니다.**\nStage 4.5에서 만든 저장소가 여기서 안전벨트가 됩니다. 커밋이 없으면 자동 수락은 안전망 없는 외줄타기입니다."}, {"title": "⚠️ 자주 걸리는 함정", "md": "- **\"전부 자동\" 같은 가장 센 설정을 첫날 켠다** — 첫 며칠은 하나하나 물어보는 상태로 씁니다. 무엇을 승인하는지 배우는 시간입니다.\n- **커밋 안 한 상태에서 자동 수락을 켠다** — 되돌릴 데가 없습니다. 켜기 전에 커밋.\n- **`.env` 파일을 `@`로 붙인다** — 비밀번호·열쇠가 들어 있는 파일입니다. 대화에 붙이지 않습니다. 값이 필요하면 \"여기에 열쇠 이름만 넣어 둬\"라고 말합니다.\n- **폴더를 통째로 붙인다** — 그릇이 금방 차서 답이 나빠집니다. 파일 단위로.\n- **밖으로 나가는 일을 켜 둔 채 자리를 뜬다** — 실제로 있었던 사고입니다. \"운영 데이터 건드리지 마\"라고 **지침 파일에만 적어 두고** 실행을 막는 장치는 없었던 경우, 에이전트가 운영 데이터베이스를 지웠습니다. **말로 적은 규칙은 대체로 지켜지지만 100%는 아닙니다.** 절대 안 되는 것은 자동 수락을 끄는 것으로 막습니다."}, {"title": "📘 말 풀이", "md": "- **터미널** — 글자만 입력해서 컴퓨터에 명령하는 검은 화면. 지금은 대부분 앱 안에서 `!`로 대신할 수 있어서, 비개발자는 따로 배우지 않아도 됩니다.\n- **자동 수락** — AI가 하려는 일을 하나하나 묻지 않고 알아서 진행하게 하는 스위치. **되돌릴 수 있는 일에만** 켭니다.\n- **배포** — 내 컴퓨터 안에서만 돌던 것을 인터넷에 올려서 남이 볼 수 있게 하는 일. 밖으로 나가는 일이므로 자동 수락을 끕니다. 본격적인 것은 Stage 7입니다."}, {"title": "⚡ 이렇게 하세요", "md": "**① 앱에서 첫 대화 — 지금 무엇을 쓸 수 있는지 확인**\n\n```\n지금 이 폴더에서 시작할게.\n1. 이 폴더에 CLAUDE.md 같은 지침 파일이 있나? 있으면 무슨 내용인지 세 줄로\n2. 지금 커밋 안 된 변경이 있나?\n3. 아직 아무것도 고치지 마. 위 두 가지만 알려 줘.\n```\n\n**② 파일을 붙여서 물어보기**\n\n```\n@(파일 경로를 @로 골라서 넣습니다)\n\n이 파일이 무슨 일을 하는지 비개발자가 알아듣게 다섯 줄로 설명해 줘.\n그리고 이 파일에서 잘못되면 사용자가 바로 알아채는 부분이 어디인지 알려 줘.\n```\n\n**③ 자동 수락을 켜기 전에 스스로에게 묻기 — 이 세 줄을 붙여 두세요**\n\n```\n지금부터 하려는 일 중에 아래에 해당하는 게 하나라도 있으면 먼저 나에게 물어봐.\n- 데이터를 지우거나 덮어쓴다\n- 메일·문자·알림을 실제로 밖으로 보낸다\n- 결제나 돈에 관련된 것을 건드린다\n- 인터넷에 올리거나 저장소에 밀어 올린다\n- .env 같은 비밀 값이 든 파일을 읽거나 고친다\n\n나머지(내 컴퓨터 안 파일 고치기, 테스트 돌리기)는 물어보지 말고 진행해도 돼.\n```\n\n**④ 잘못 달리고 있을 때 — Esc 누르고 이 한 줄**\n\n```\n멈춰. 지금까지 바꾼 파일 목록만 보여 줘. 더 고치지 마.\n그중에서 되돌려야 할 것이 있으면 어떤 것인지 알려 줘. 되돌리기는 내가 시킬 때만 해.\n```"}, {"title": "✅ 됐는지 확인", "md": "- [ ] 검은 화면을 열지 않고 **앱 안에서만** 한 바퀴를 돌았나\n- [ ] **`@`로 파일을 붙여** 질문해 봤나 (복사·붙여넣기 말고)\n- [ ] **`!`로 명령 결과를 붙여** 봤나\n- [ ] `Esc`로 AI를 **한 번 멈춰** 봤나\n- [ ] 자동 수락을 켜기 전에 **커밋**을 했나\n- [ ] \"밖으로 나가는 일에는 자동 수락을 끈다\"를 **말로 설명할 수 있나**"}, {"title": "🔎 더 깊이", "md": "- 앱 안에서 `/help`를 치면 지금 쓰는 도구가 가진 명령과 단축키 전체가 나옵니다. **외우지 말고 필요할 때 여기서 찾으세요.**\n- 권한을 어디까지 열지, 어떤 명령을 아예 막을지는 설정 파일로 한 번에 정해 둘 수 있습니다. Stage 3에서 만든 지침·설정이 여기서 작동합니다.\n- 자동 수락으로도 못 막는 것(예: \"운영 데이터는 절대 못 건드리게\")을 **기계적으로 강제**하는 방법은 Stage 8에서 다룹니다.\n- 검은 화면을 아예 안 쓰고 싶다면, 편집기 안에서 곁창으로 쓰는 방법도 있습니다. 다만 **하루의 90%는 데스크톱 앱 하나로 충분합니다.** 두 개를 동시에 익히려 하지 마세요."}]}, {"file": "3-실전흐름3종.md", "id": "s5-3", "no": "3", "title": "실전 흐름 3종 — 새 기능 · 버그 · 마무리", "through": "매번 새로 생각하지 않는다. 세 가지 길만 외워서 반복한다.", "time": "60분", "need": ["Stage 3의 지침", "Stage 4.5의 저장소"], "head": "일하다 보면 결국 세 가지밖에 없습니다.\n**새로 만들거나, 망가진 걸 고치거나, 오늘 한 일을 정리하거나.**", "secs": [{"title": "왜 이걸 하나", "md": "처음 몇 주 동안 가장 지치는 것은 코딩이 아닙니다.\n**\"이번엔 뭐라고 시키지?\"**를 매번 처음부터 생각하는 일입니다.\n\n그래서 길을 세 개만 정해 두고 그대로 반복합니다.\n길이 정해져 있으면 머리를 안 써도 되고, 머리를 안 쓰면 **검증에 쓸 힘이 남습니다.**\n1인 사업에서 병목은 만드는 쪽이 아니라 보는 쪽이니까요.\n\n이 절을 건너뛰면 매번 다른 방식으로 시키게 되고, 그러면 **왜 잘 됐는지도 왜 망했는지도 모르게 됩니다.**"}, {"title": "흐름 ① 새 기능 — 계획 → 문서 → 테스트 먼저 → 구현 → 리뷰 → 검증", "md": "| 순서 | 하는 일 | 왜 여기에 있나 |\n|---|---|---|\n| 1 **계획** | 무엇을 만들지 글로 (절 1) | AI가 혼자 정한 것을 드러내려고 |\n| 2 **문서** | 계획을 파일로 남긴다 | 대화가 사라져도 남고, 다음 세션이 이어받는다 |\n| 3 **테스트 먼저** | \"이게 되면 성공\"을 먼저 정한다 | ⭐ 합격선을 AI가 정하지 못하게 |\n| 4 **구현** | 그제야 만든다 | 앞의 셋이 있으면 여기서 헤매지 않는다 |\n| 5 **리뷰** | 새 대화에게 트집을 잡게 한다 | 방금 짠 세션은 자기 선택을 옹호한다 |\n| 6 **검증** | 내가 눈으로 본다 | \"통과\"는 \"됐다\"가 아니다 |\n\n**3번이 자리를 옮기면 안 됩니다.** 만든 뒤에 테스트를 만들면 AI는 **이미 만든 것에 맞춰서** 테스트를 씁니다.\n그건 시험 문제를 답 보고 만드는 것과 같습니다. 자세한 이유는 절 4에서.\n\n**5번 리뷰는 반드시 새 대화에서.** 같은 대화에서 \"검토해 줘\"라고 하면 대체로 \"잘 됐습니다\"가 나옵니다.\n사람도 자기가 쓴 글의 오타를 못 봅니다. **처음 보는 눈**이 필요합니다."}, {"title": "흐름 ② 버그 — 증상 → 분석 → 근본 원인 → 재현 테스트 → 검증", "md": "무언가 안 될 때 사람들이 가장 많이 하는 말은 이겁니다. **\"이거 왜 안 되지? 고쳐 줘.\"**\n그러면 AI는 **눈에 보이는 증상만** 가립니다. 사흘 뒤 같은 문제가 다른 얼굴로 돌아옵니다.\n\n| 순서 | 하는 일 | 한 줄 요령 |\n|---|---|---|\n| 1 **증상 설명** | 무엇을 했더니 무엇이 나왔나 | 원인을 추측해서 말하지 않는다 |\n| 2 **분석** | AI가 관련 파일과 흐름을 훑는다 | 아직 고치지 못하게 한다 |\n| 3 **근본 원인** | \"왜 그렇게 됐나\"를 한 문장으로 | ⭐ 원인을 말 못 하면 아직 모르는 것 |\n| 4 **재현 테스트** | 그 버그를 잡아내는 시험을 먼저 만든다 | 지금은 실패해야 정상 |\n| 5 **고치고 검증** | 고친 뒤 그 시험이 통과하나 본다 | 통과하면 다시 안 생긴다 |\n\n**\"고쳐 줘\"보다 \"왜 그런지부터 알려 줘\"가 훨씬 빠릅니다.**\n그리고 4번을 하면 그 버그는 **다시는 조용히 돌아오지 못합니다.** 시험지가 지키고 있으니까요.\n\n증상을 설명할 때 지켜야 할 것 하나 — **에러는 요약하지 말고 그대로 붙입니다.** 절 5에서 자세히."}, {"title": "흐름 ③ 마무리 — 문서 갱신 → 반복된 패턴을 스킬로", "md": "일이 끝났는데 그냥 창을 닫으면, 오늘 배운 것이 **오늘로 끝납니다.**\n내일의 나는 남입니다. 그리고 **AI는 기억이 아예 없습니다.**\n\n| 순서 | 하는 일 |\n|---|---|\n| 1 **문서 갱신** | 오늘 정한 것·바뀐 것을 지침 파일과 문서에 반영 |\n| 2 **패턴 추출** | 오늘 세 번 이상 반복한 지시가 있으면 **스킬**로 만든다 |\n| 3 **커밋** | 코드와 문서를 같이 커밋 (Stage 4.5) |\n| 4 **다음 줄 메모** | \"내일은 여기서부터\" 한 줄 |\n\n**기준은 3번입니다.** 같은 말을 세 번 반복했으면 그건 규칙이지 우연이 아닙니다. 그때만 스킬로 만듭니다.\n한 번 겪은 일은 그냥 넘어갑니다. 규칙이 100개가 되면 아무도 관리하지 않고, 규칙끼리 싸우다가 썩습니다.\n**규칙은 적고 날카롭게.**"}, {"title": "📘 말 풀이", "md": "- **리뷰** — 만든 것을 다른 눈으로 다시 훑어보고 문제를 찾는 일. 여기서 말하는 리뷰는 **새 대화**에게 시키는 것입니다.\n- **근본 원인** — 겉으로 보이는 증상 말고, 진짜로 그렇게 만든 이유. \"화면이 하얗게 뜬다\"는 증상이고, \"구독자 목록이 비었을 때를 생각 안 했다\"가 근본 원인입니다.\n- **스킬** — 자주 쓰는 지시를 파일 하나로 만들어 두고 이름으로 부르는 것. 매번 같은 설명을 다시 쓰지 않게 해 줍니다. 만드는 법은 Stage 3에서 다뤘습니다."}, {"title": "⚠️ 자주 걸리는 함정", "md": "- **만든 뒤에 테스트를 만든다** — 이미 만든 것에 맞춘 시험지가 나옵니다. 순서를 바꾸지 마세요.\n- **짠 대화에게 리뷰를 시킨다** — \"잘 짰습니다\"가 나옵니다. 새 대화에서, \"처음 보는 코드\"라고 못 박고 시킵니다.\n- **원인을 내가 추측해서 알려 준다** — \"아마 데이터베이스 문제 같아\"라고 하면 AI는 그쪽만 팝니다. **증상만** 말하세요.\n- **잘 되면 마무리를 건너뛴다** — 잘 될 때 남긴 기록이 가장 값이 큽니다. 망했을 때는 기록할 정신이 없습니다.\n- **스킬을 욕심내서 열 개씩 만든다** — 세 번 반복된 것만. 나머지는 그때그때."}, {"title": "⚡ 이렇게 하세요", "md": "**① 새 기능 — 여섯 걸음을 한 번에 지시**\n\n```\n새 기능을 만들 거야. 아래 여섯 걸음을 순서대로 하되, 각 걸음이 끝날 때마다 멈추고 내 확인을 받아.\n\n만들 기능: (한 줄로)\n\n1. 계획 — 새로 만들 파일, 고칠 파일, 네가 혼자 정한 것을 글로만 써 줘. 코드 금지.\n2. 문서 — 내가 계획에 OK 하면, 그 계획을 docs/ 아래 파일로 저장해 줘.\n3. 테스트 먼저 — 이 기능이 \"됐다\"고 말할 수 있는 조건 3개를 테스트로 먼저 만들어 줘.\n   지금은 당연히 실패해야 해. 실패하는 걸 나에게 보여 줘.\n4. 구현 — 이제 그 테스트가 통과하도록 만들어 줘. 계획에 없는 파일은 건드리지 마.\n5. 리뷰 — 바뀐 파일 목록과 각 파일에서 무엇이 바뀌었는지 한국어로 요약해 줘.\n6. 검증 — 내가 브라우저나 화면에서 눈으로 확인할 목록 3개를 줘.\n   각 항목은 ○/× 로 답할 수 있게. \"잘 되는 것 같다\" 같은 말 금지.\n```\n\n**② 버그 — 증상만 말하고 원인부터 캐기**\n\n```\n문제가 생겼어. 아직 고치지 마. 원인부터 찾아 줘.\n\n내가 한 일: (예 — 가입 화면에서 이메일을 넣고 '구독' 버튼을 눌렀다)\n내가 기대한 것: (예 — \"구독 완료\" 문구가 뜬다)\n실제로 일어난 것: (예 — 화면이 하얗게 변하고 아무것도 안 나온다)\n화면에 나온 글자 그대로:\n(에러 메시지를 요약하지 말고 통째로 붙입니다. 없으면 \"없음\")\n\n순서:\n1. 관련 있어 보이는 파일과 흐름을 훑어 줘\n2. 근본 원인을 한 문장으로 말해 줘 — 확실하지 않으면 \"확실하지 않다\"고 말해\n3. 그 원인이 맞는지 확인할 방법을 알려 줘\n아직 코드는 고치지 마.\n```\n\n**③ 버그 — 원인이 확인된 뒤 (재현 테스트부터)**\n\n```\n원인이 맞는 걸 확인했어. 이제 이 순서로 해 줘.\n\n1. 이 버그를 잡아내는 테스트를 먼저 만들어 줘. 지금은 실패해야 정상이야. 실패하는 걸 보여 줘.\n2. 그 다음에 고쳐 줘. 고치는 범위는 최소한으로.\n3. 테스트가 통과하는 걸 보여 줘.\n4. 이번 일로 알게 된 것을 한 줄로 정리해 줘 — 지침 파일에 넣을 문장으로.\n```\n\n**④ 마무리 — 하루를 닫는 한 판**\n\n```\n오늘 작업을 마무리할게.\n\n1. 오늘 바뀐 것 중에서 문서나 지침 파일에 반영해야 할 내용을 찾아서 고쳐 줘\n2. 오늘 내가 세 번 이상 반복해서 말한 지시가 있나? 있으면 그것만 스킬로 만들자고 제안해 줘.\n   두 번 이하는 제안하지 마.\n3. 커밋 메시지를 한국어로 한 줄 써 줘 — 무엇을 왜 바꿨는지\n4. \"내일은 여기서부터\" 한 줄을 메모로 남겨 줘\n```\n\n**⑤ 리뷰 — 반드시 새 대화를 열고**\n\n```\n너는 이 코드를 처음 보는 사람이야. 누가 짰는지 모르고, 칭찬할 이유도 없어.\n최근에 바뀐 부분만 보고 아래 관점에서 문제만 짚어 줘.\n\n1. 실패했을 때 어떻게 되나 — 사용자에게 무엇이 보이나\n2. 빈 값·아주 긴 값·두 번 연속 누르기 같은 경우를 빠뜨리지 않았나\n3. 비밀번호나 열쇠 같은 값이 밖으로 새는 곳이 있나\n4. 여섯 달 뒤에 봐도 무슨 뜻인지 알 수 있나\n\n\"잘 짰다\"는 평가는 쓰지 마. 문제 없으면 \"OK\" 한 마디만.\n문제가 있으면 어느 파일 어느 부분인지와 고칠 방법을 한 줄씩.\n마지막에 가장 위험한 하나를 골라 줘.\n```"}, {"title": "✅ 됐는지 확인", "md": "- [ ] 새 기능 흐름에서 **테스트를 만들기 전에** 만들지 않았나 (순서를 지켰나)\n- [ ] 계획이 **파일로 남아** 있나 (대화에만 있지 않나)\n- [ ] 버그를 고치기 전에 **근본 원인을 한 문장으로** 들었나\n- [ ] 그 버그를 잡는 **재현 테스트**가 지금 저장소에 남아 있나\n- [ ] 리뷰를 **새 대화**에서 시켰나\n- [ ] 오늘 마무리로 **문서 갱신 + 커밋**을 했나"}, {"title": "🔎 더 깊이", "md": "- 이 세 흐름은 원래 개발팀이 쓰던 절차를 1인용으로 줄인 것입니다. 영어 자료에서는 **plan → docs → TDD → implement → review → verify**로 부릅니다.\n- 도구에 따라 이 걸음마다 짧은 명령이 준비되어 있습니다. 앱에서 `/`를 치면 지금 쓸 수 있는 목록이 나옵니다. **없으면 위 프롬프트를 그대로 스킬로 만들면 됩니다.**\n- 리뷰를 **다른 회사의 도구**에게 한 번 더 시키는 방식이 개발자들 사이에 흔합니다. 다만 그게 실제로 얼마나 이득인지는 **측정된 적이 없습니다.** 흔하다는 것과 효과가 증명됐다는 것은 다릅니다. 이 이야기는 Stage 7에서 정직하게 다룹니다.\n\n> **다음으로 이어지는 것** — 이 세 흐름을 그대로 들고 Stage 6으로 갑니다.\n> Stage 6에서 **진짜 데이터베이스**를 붙일 때도 흐름 ①을 그대로 씁니다. 다만 그때는 \"되돌릴 수 없는 일\"이 훨씬 많아지므로, 절 2의 자동 수락 기준이 더 중요해집니다."}]}, {"file": "4-테스트.md", "id": "s5-4", "no": "4", "title": "테스트 — 왜 비개발자에게도 필요한가", "through": "AI는 증폭기다. 테스트가 없으면 증폭되는 것은 혼돈이다.", "time": "50분", "need": ["Stage 3의 지침", "Stage 4.5의 저장소"], "head": "\"테스트는 개발자가 하는 거 아닌가요?\"\n아닙니다. **코드를 못 읽는 사람일수록 더 필요합니다.**", "secs": [{"title": "왜 이걸 하나", "md": "우리는 코드를 못 읽습니다. 그래서 AI가 \"다 됐습니다\"라고 하면 확인할 방법이 없습니다.\n매번 브라우저를 열어서 하나하나 눌러 볼 수도 있습니다. 처음 며칠은 그렇게 합니다.\n그런데 기능이 다섯 개, 열 개가 되면 **매번 열 군데를 눌러 볼 수 없습니다.**\n\n테스트는 그 확인을 **기계가 대신하게 만드는 것**입니다.\n\n이 절을 건너뛰면 이런 일이 생깁니다.\n새 기능을 넣었더니 **어제까지 잘 되던 가입 화면이 조용히 죽습니다.**\nAI는 그걸 모릅니다. 나도 모릅니다. 손님이 압니다."}, {"title": "AI가 속도를 올리면 불안정성도 같이 오른다", "md": "이게 이 절의 핵심 문장입니다.\n\nAI는 **증폭기**입니다. 잘 정리된 곳에서는 좋은 것을 크게 만들고,\n어수선한 곳에서는 **어수선함을 크게 만듭니다.**\n\n예전에는 하루에 파일 두 개를 고쳤습니다. 뭐가 깨졌는지 감으로 알았습니다.\n지금은 한 시간에 파일 열 개가 바뀝니다. **감으로는 못 따라갑니다.**\n\n그래서 속도가 올라간 만큼 **자동으로 확인해 주는 장치**가 있어야 합니다.\n없으면 증폭되는 것은 생산성이 아니라 혼돈입니다.\n\n> 참고로, AI 도구의 이득은 처음부터 곧장 오르지 않습니다.\n> **처음에는 오히려 떨어졌다가 나중에 오릅니다.** 배우는 값과 어수선함을 치우는 값이 먼저 나가기 때문입니다.\n> 첫 주에 \"이거 더 느린데?\"라고 느끼는 건 정상입니다. 그 구간을 테스트로 건너갑니다."}, {"title": "📘 말 풀이", "md": "- **테스트** — 이게 여전히 잘 도는지 **기계가 대신 확인해 주는 것**. 사람이 매번 손으로 눌러 보는 대신, 명령 한 줄로 전부 확인합니다. 통과하면 초록, 깨지면 빨강.\n- **핵심 흐름** — 손님이 돈을 내거나 서비스를 쓰기 위해 반드시 지나가는 길. 예를 들어 \"가입 → 메일 받기 → 수신 거부\"가 하나의 핵심 흐름입니다.\n- **실패하는 테스트 먼저** — 만들기 전에 시험지를 먼저 쓰는 방식. 시험지는 처음엔 당연히 빨간불입니다. 그 빨간불이 초록이 되면 다 된 것입니다."}, {"title": "전부 덮으려 하지 마세요 — 핵심 흐름 3~5개면 충분합니다", "md": "여기서 대부분이 두 번째로 망합니다. **\"제대로 하려면 다 덮어야지\"**라고 생각하다가 시작도 못 합니다.\n\n1인이 지킬 수 있는 선은 이 정도입니다.\n\n| 개수 | 무엇을 거나 | 예시 (뉴스레터 서비스) |\n|---|---|---|\n| 1 | 손님이 **들어오는** 길 | 이메일을 넣고 구독 버튼을 누르면 구독자로 저장된다 |\n| 2 | 손님이 **값을 받는** 길 | 발송을 누르면 구독자에게 메일이 나간다 |\n| 3 | 손님이 **나가는** 길 | 수신 거부를 누르면 다음부터 안 온다 |\n| 4 (있으면) | **돈이 오가는** 길 | 결제하면 유료 구독자가 된다 |\n| 5 (있으면) | **잘못 눌렀을 때** | 이메일 형식이 틀리면 친절한 안내가 뜬다 |\n\n이 다섯이 초록이면 서비스는 살아 있는 것입니다. 나머지가 깨져도 손님은 대체로 모릅니다.\n**커버리지 90% 같은 목표는 1인에게 과합니다.** 회사에서도 그건 팀이 있어야 지킵니다."}, {"title": "실패하는 테스트를 먼저 쓰는 게 왜 AI에게 특히 잘 맞나", "md": "이유는 세 가지입니다.\n\n**① 합격선을 AI가 정하지 못하게 됩니다.**\n만든 뒤에 테스트를 만들라고 하면 AI는 **이미 만든 것에 맞춰서** 시험지를 씁니다.\n답을 보고 문제를 내는 것과 같습니다. 100점은 나오지만 아무 의미가 없습니다.\n\n**② AI에게 \"끝\"을 알려 줄 수 있습니다.**\nAI는 \"이 정도면 됐다\"를 스스로 판단하면 대체로 너무 일찍 멈추거나 너무 멀리 갑니다.\n빨간불이 초록으로 바뀌는 순간이 **다툴 여지 없는 끝**입니다.\n\n**③ 코드를 못 읽어도 대화할 수 있습니다.**\n\"3번 테스트가 아직 빨간불이야\"라고만 말하면 AI가 알아서 그 부분을 팝니다.\n코드 이야기를 한 마디도 안 하고 방향을 잡을 수 있습니다. 비개발자에게 이게 가장 큽니다.\n\n**한 가지 주의** — 테스트가 초록이라고 \"됐다\"는 뜻은 아닙니다.\n초록불은 **\"안 터졌다\"**만 말합니다. **\"손님에게 메일이 갔다\"**는 말해 주지 않습니다.\n그래서 절 6에서 **내 눈으로 보는 확인**을 한 겹 더 얹습니다."}, {"title": "⚠️ 자주 걸리는 함정", "md": "- **전부 덮으려다 하나도 못 만든다** — 3개로 시작합니다. 사고가 날 때마다 하나씩 늘립니다. 그러면 시험지가 **내가 실제로 겪은 실패의 역사**가 됩니다.\n- **만든 다음에 테스트를 만든다** — 순서가 뒤집히면 시험지가 아니라 도장이 됩니다.\n- **실패하는 걸 안 보고 넘어간다** — 처음에 빨간불을 **눈으로 확인**해야 합니다. 안 그러면 아무것도 확인하지 않는 가짜 테스트가 통과하고 있는 걸 모릅니다.\n- **\"잘 되는지\" 같은 애매한 기준을 쓴다** — ○/×로 답할 수 있어야 테스트입니다.\n- **깨진 테스트를 지워서 초록으로 만든다** — 가장 위험한 습관입니다. 깨진 테스트는 **고쳐야 할 것을 알려 주는 알람**입니다. 알람을 끄지 마세요.\n- **실제 메일이 진짜로 나가는 테스트를 만든다** — 테스트는 하루에 수십 번 돕니다. 실제 발송·실제 결제는 **가짜로 바꿔서** 테스트합니다. AI에게 \"실제로 보내지 말고 흉내만 내게 해 줘\"라고 말하면 됩니다."}, {"title": "⚡ 이렇게 하세요", "md": "**① 핵심 흐름 3개 고르기 — 코드 이야기 없이**\n\n```\n나는 코드를 못 읽어. 지금 만들고 있는 서비스에서\n\"이게 깨지면 손님이 바로 알아채는\" 핵심 흐름 3개를 골라 줘.\n\n조건:\n- 손님 입장에서 쓴다. \"가입 → 메일 받기 → 수신 거부\" 같은 식으로.\n- 각 흐름마다 \"무엇을 하면 무엇이 나와야 하는가\"를 한 줄씩.\n- 기준은 ○/× 로 답할 수 있게. \"잘 된다\" 같은 표현 금지.\n- 3개를 넘기지 마. 지금은 적게 시작하는 게 맞아.\n```\n\n**② 실패하는 테스트를 먼저 만들게 하기**\n\n```\n방금 고른 핵심 흐름 3개를 테스트로 만들어 줘. 아직 기능은 만들지 마.\n\n조건:\n- 지금은 3개 다 실패해야 정상이야. 실패하는 걸 나에게 직접 보여 줘.\n- 실제로 메일을 보내거나 결제를 하지 마. 흉내만 내게 만들어 줘.\n- 테스트 이름은 한국어로, 무엇을 재는지 읽으면 알 수 있게.\n- 마지막에 \"테스트 돌리는 명령 한 줄\"을 알려 줘. 그걸 내가 외울 거야.\n```\n\n**③ 초록으로 만들기**\n\n```\n이제 이 테스트 3개가 통과하도록 만들어 줘.\n\n- 테스트를 고쳐서 통과시키지 마. 기능을 만들어서 통과시켜.\n- 하나씩 해. 1번이 초록이 되면 멈추고 나에게 보여 줘. 그 다음에 2번.\n- 다 끝나면 테스트 결과 화면을 그대로 보여 줘.\n```\n\n**④ 사고가 날 때마다 한 개씩 늘리기**\n\n```\n방금 이런 문제를 겪었어: (무슨 일이 있었는지 한 줄)\n\n이 문제가 다시 생기면 바로 빨간불이 뜨도록 테스트를 하나만 추가해 줘.\n- 기존 테스트는 건드리지 마\n- 이 테스트가 원래 문제 상황에서 실패하는지 먼저 확인시켜 줘\n```\n\n**⑤ 매번 돌리는 습관 만들기 — 하루 두 번**\n\n```\n아침에 작업 시작할 때, 그리고 커밋하기 직전에 테스트를 돌려 줘.\n빨간불이 하나라도 있으면 새 작업을 시작하지 말고 나에게 먼저 알려 줘.\n```"}, {"title": "✅ 됐는지 확인", "md": "- [ ] **테스트가 하나라도 도나** (명령 한 줄로 실행되나)\n- [ ] 그 테스트를 **만들기 전에** 만들었나 (순서를 지켰나)\n- [ ] 처음에 **빨간불을 눈으로** 봤나\n- [ ] 지금 화면에 **초록불**이 보이나\n- [ ] 테스트가 **핵심 흐름 3~5개**에 걸려 있나 (전부 덮으려 하지 않았나)\n- [ ] 테스트가 **실제로 메일을 보내거나 결제를 하지는** 않나\n- [ ] 테스트 돌리는 명령을 **내가 외우고 있나**"}, {"title": "🔎 더 깊이", "md": "- 실패하는 테스트를 먼저 쓰는 방식은 영어로 **TDD (test-driven development)**라고 부릅니다. 이 단어로 찾으면 자료가 아주 많습니다.\n- 손님이 실제로 화면을 누르는 것까지 흉내 내는 테스트는 **E2E (end-to-end) 테스트**라고 합니다. 핵심 흐름 3~5개는 여기에 거는 것이 가장 값이 큽니다.\n- \"AI가 속도를 올리면 불안정성도 같이 오른다\"는 것은 매년 나오는 개발 현장 조사에서 반복해서 관찰되는 내용입니다. 검색할 말 — **DORA** 보고서.\n- 커밋할 때마다 테스트를 자동으로 돌리게 만들 수 있습니다. 그건 Stage 7(배포)에서 다룹니다. 지금은 **손으로 돌리는 것으로 충분합니다.**\n\n> **다음으로 이어지는 것** — 지금 만든 테스트는 지금은 가짜 데이터로 돕니다.\n> **Stage 6에서 진짜 데이터베이스를 붙이면**, 이 테스트가 그대로 \"데이터베이스 연결이 살아 있나\"를 지키는 파수꾼이 됩니다. 그때 새로 만들지 않아도 되게, 지금 이름을 잘 지어 두세요."}]}, {"file": "5-막혔을때.md", "id": "s5-5", "no": "5", "title": "막혔을 때 — 오류를 푸는 순서", "through": "같은 에러가 세 번 반복되면 네 번째도 실패한다. 방식을 바꾼다.", "time": "50분", "need": ["Stage 3의 지침", "Stage 4.5의 저장소"], "head": "막히는 것은 실력 문제가 아닙니다. **정상입니다.**\n다만 푸는 데는 순서가 있습니다. 순서를 모르면 두 시간이 이틀이 됩니다.", "secs": [{"title": "왜 이걸 하나", "md": "막혔을 때 사람들이 하는 일은 대체로 똑같습니다.\n같은 말을 조금씩 바꿔 가며 **다섯 번, 열 번 다시 시킵니다.**\n그리고 두 시간 뒤에 처음보다 더 망가진 상태가 됩니다.\n\n이유는 하나입니다. **막혔을 때 무엇을 바꿔야 하는지 모르기 때문입니다.**\n프롬프트를 바꿔야 할 때가 있고, 대화를 바꿔야 할 때가 있고, 아예 되돌려야 할 때가 있고,\n사람에게 물어야 할 때가 있습니다. 이 절은 그 갈림길을 알려 줍니다."}, {"title": "순서 — 위에서부터 차례로", "md": "| 순서 | 하는 일 | 걸리는 시간 |\n|---|---|---|\n| 1 | **에러를 그대로 붙인다** (요약 금지) | 1분 |\n| 2 | **로그를 먼저 붙인다** | 3분 |\n| 3 | 원인부터 묻는다 — 고치지 못하게 한다 | 5분 |\n| 4 | ⭐ **같은 에러 세 번이면 방식을 바꾼다** | — |\n| 5 | **되돌린다** — 종종 가장 빠른 복구 | 2분 |\n| 6 | **사람에게 묻는다** | — |"}, {"title": "① 에러를 요약하지 말고 그대로 붙입니다", "md": "가장 흔한 실수입니다. 그리고 가장 값이 비쌉니다.\n\n**\"뭔가 파일 못 찾겠다는 에러가 떠\"** ← 이렇게 말하면 AI는 **다른 걸 고칩니다.**\n빨간 글자 안에는 파일 이름, 줄 번호, 어디서 시작해서 어디로 흘렀는지가 전부 들어 있습니다.\n그게 **범인의 주소**입니다. 요약하면 주소가 지워집니다.\n\n무섭게 생겼다고 줄이지 마세요. 길수록 좋습니다. **통째로 붙입니다.**\n앱 안에서 `!`로 명령을 돌리면 결과가 그대로 들어갑니다(절 2). 그게 가장 정확합니다.\n\n> 붙일 때 딱 하나만 봅니다 — **비밀번호나 열쇠 같은 값이 섞여 있지 않은지.**\n> 그런 값만 `***`로 바꾸고 나머지는 그대로 둡니다."}, {"title": "② 로그를 먼저 붙입니다", "md": "에러 메시지가 아예 안 뜨는 경우도 많습니다. 화면이 하얗거나, 눌러도 아무 반응이 없거나.\n이럴 때는 **로그**를 봅니다.\n\n- 브라우저 화면이 이상하면 → **브라우저 콘솔**\n- 서버 쪽이 이상하면 → **터미널이나 앱에 찍히는 글**\n\n\"에러가 안 뜨는데요\"라고 말하기 전에 **로그부터 붙입니다.**\nAI가 추측으로 시작하느냐, 증거로 시작하느냐가 여기서 갈립니다."}, {"title": "③ 원인부터 묻습니다 — 아직 고치지 못하게", "md": "\"고쳐 줘\"라고 하면 AI는 **증상만** 가립니다. 화면은 정상으로 보이고 원인은 그대로 남습니다.\n사흘 뒤 다른 얼굴로 돌아옵니다.\n\n**\"왜 그런지부터 알려 줘. 아직 고치지 마.\"**\n이 한 줄이 오히려 더 빠릅니다.\n\n그리고 AI가 원인을 한 문장으로 말하지 못하면 **아직 모르는 것입니다.**\n모르는 채로 고치게 두면 여기저기 쑤시다가 멀쩡한 곳까지 망칩니다."}, {"title": "⭐ ④ 같은 에러가 세 번 반복되면 — 방식을 바꿉니다", "md": "이 절에서 가장 중요한 문장입니다.\n\n> **같은 방식으로 네 번째를 시키면, 네 번째도 실패합니다.**\n\n세 번 실패했다는 것은 **AI가 잘못 알고 있는 것이 있다는 뜻**입니다.\n그리고 그 잘못된 생각은 지금 대화 안에 계속 남아 있습니다. 그래서 계속 같은 데로 돌아옵니다.\n\n세 번째 실패를 세면, 시키던 것을 멈추고 아래 셋 중 하나로 **바꿉니다.**\n\n| 바꾸는 법 | 언제 | 무엇을 하나 |\n|---|---|---|\n| **새 대화를 연다** | 대화가 길어졌을 때 (가장 흔함) | 대화를 닫고 새로 엽니다. **에러와 파일만** 새로 붙입니다. 앞의 실패한 시도는 가져가지 않습니다 |\n| **더 작게 쪼갠다** | 한 번에 여러 개를 시키고 있었을 때 | \"이 중에서 첫 번째 한 개만 해 줘\"로 줄입니다 |\n| **아예 다른 접근을 시킨다** | 방향 자체가 틀린 것 같을 때 | \"지금 방식은 세 번 실패했어. **완전히 다른 방법 두 가지**를 제안해 줘\"라고 시킵니다 |\n\n**새 대화가 가장 자주 정답입니다.** 대화가 길어지면 AI의 그릇이 차서 판단이 흐려지고,\n게다가 앞에서 실패한 시도들이 그대로 남아 계속 그쪽으로 끌어당깁니다.\n**대화를 버리는 것은 지는 게 아닙니다.** 가장 싼 복구입니다."}, {"title": "⑤ 되돌리기가 가장 빠른 복구일 때가 많습니다", "md": "30분 동안 고치다가 더 망가졌다면, **고치려 하지 말고 되돌립니다.**\n\nStage 4.5에서 만든 저장소가 여기서 값을 합니다.\n커밋해 둔 지점으로 돌아가면 **30분 전의 멀쩡한 상태**가 그대로 돌아옵니다.\n그리고 이번엔 더 작게 쪼개서 다시 시킵니다.\n\n30분 넘게 같은 데서 헤매고 있다면 이걸 먼저 떠올리세요.\n**\"되돌리면 얼마나 잃지?\"** — 대부분 답은 \"30분\"입니다. 그런데 계속 고치면 세 시간을 잃습니다.\n\n되돌리는 세 가지 방법(아직 커밋 안 함 / 커밋했는데 안 밀었음 / 이미 밀었음)은 Stage 4.5에 있습니다.\n**날린 것 같을 때도 대개 살릴 수 있습니다.** 지레 포기하지 마세요."}, {"title": "⑥ 사람에게 물어야 하는 순간", "md": "AI에게 계속 물어봐야 소용없는 자리가 있습니다. 이 셋입니다.\n\n| 이런 신호가 오면 | 왜 AI로 안 되나 | 어디로 |\n|---|---|---|\n| **내 계정·내 결제·내 승인**이 막혔다 (가입 거절, 심사 반려, 카드 등록 실패) | AI는 내 계정 안을 못 봅니다. 그 회사만 압니다 | 그 서비스의 고객센터 |\n| **돈·계약·법**이 걸렸다 (환불 규정, 개인정보 처리, 세금) | AI 답은 참고용입니다. 틀리면 **내가 책임집니다** | 해당 전문가 |\n| **똑같은 증상이 남에게도 있나**가 궁금하다 | 최근에 생긴 문제는 AI가 모를 수 있습니다 | 에러 메시지를 그대로 검색 · 그 도구의 공식 문서·이슈 목록 |\n\n**세 번 반복 + 새 대화 + 쪼개기까지 다 해 봤는데도 안 되면**, 그때는 사람 쪽입니다.\n그 상태로 다섯 번을 더 시켜도 결과는 같습니다."}, {"title": "📘 말 풀이", "md": "- **에러 메시지** — 무언가 잘못됐을 때 화면에 뜨는 빨간 글자. 안에 **파일 이름과 줄 번호**가 들어 있어서, 이게 곧 범인의 주소입니다. **요약하면 주소가 사라집니다.**\n- **로그** — 프로그램이 도는 동안 자기가 무엇을 했는지 계속 적어 두는 일기. 에러가 안 떠도 로그에는 남아 있는 경우가 많습니다.\n- **되돌리기** — 저장해 둔 지점으로 코드를 통째로 돌리는 것. Stage 4.5에서 만든 저장소가 있어야 됩니다. **가장 빠른 복구입니다.**"}, {"title": "⚠️ 자주 걸리는 함정", "md": "- **에러를 내 말로 바꿔서 전한다** — AI가 다른 걸 고칩니다. 그대로 붙이세요.\n- **네 번째, 다섯 번째를 같은 대화에서 계속 시킨다** — 세 번에서 끊습니다.\n- **원인을 내가 추측해서 알려 준다** — \"아마 데이터베이스 문제 같아\"라고 하면 AI는 그쪽만 팝니다. **증상과 에러만** 주세요.\n- **되돌리기를 실패라고 생각한다** — 되돌리기는 안전벨트입니다. 안전벨트를 맸다고 운전을 못하는 게 아닙니다.\n- **막힌 채로 자동 수락을 켠다** — 가장 위험합니다. 막혔을 때 AI는 이것저것 쑤셔 봅니다. 그걸 자동으로 승인하면 멀쩡한 곳까지 망가집니다. **막혔을 때는 오히려 끕니다.**\n- **에러 메시지에 든 비밀 값을 그대로 어딘가에 붙여 넣는다** — 열쇠·비밀번호가 섞였는지 한 번만 훑고 `***`로 가립니다."}, {"title": "⚡ 이렇게 하세요", "md": "**① 에러가 떴을 때 — 이 틀 그대로**\n\n```\n에러가 났어. 아직 고치지 마.\n\n내가 한 일: (예 — 구독 버튼을 눌렀다)\n기대한 것: (예 — \"구독 완료\"가 떠야 한다)\n실제로 일어난 것: (예 — 화면이 하얗게 됐다)\n\n에러 메시지 (요약 안 하고 그대로 붙임):\n--- 여기서부터 ---\n(빨간 글자를 통째로 붙여 넣습니다. 줄이지 말고 전부.)\n--- 여기까지 ---\n\n먼저 이것만 해 줘:\n1. 이 에러가 무슨 뜻인지 비개발자 말로 두 줄\n2. 범인일 가능성이 가장 높은 파일과 그 이유\n3. 그게 맞는지 확인할 방법 한 가지\n아직 코드는 고치지 마.\n```\n\n**② 에러가 안 뜰 때 — 로그부터**\n\n```\n에러 메시지는 안 뜨는데 동작이 이상해.\n\n증상: (무엇을 눌렀더니 무엇이 안 되는지)\n\n먼저 어디를 봐야 로그가 나오는지 알려 줘.\n- 브라우저에서 볼 것\n- 앱이나 터미널에서 볼 것\n각각 어떻게 여는지 클릭 순서로 알려 줘. 나는 개발자가 아니야.\n로그를 가져오면 그때 원인을 찾자.\n```\n\n**③ 세 번 실패했을 때 — 새 대화에 이걸 붙입니다**\n\n```\n지금부터 새로 시작할게. 앞의 대화는 없다고 생각해.\n\n문제: (한 줄)\n지금까지 세 번 시도했고 다 실패했어. 시도한 방법은 이랬어:\n1. (첫 번째 시도)\n2. (두 번째 시도)\n3. (세 번째 시도)\n\n에러 메시지 (그대로):\n--- 여기서부터 ---\n(붙여 넣기)\n--- 여기까지 ---\n\n부탁:\n- 위 세 가지와는 **다른 방향**의 원인 후보 2개를 먼저 말해 줘\n- 그중 확인이 더 쉬운 것부터 확인 방법을 알려 줘\n- 아직 고치지 마. 방향부터 정하자.\n```\n\n**④ 더 작게 쪼개기**\n\n```\n지금 시킨 게 너무 컸던 것 같아.\n이 작업을 3개 이하로 쪼개 줘. 각각 따로 확인할 수 있는 단위로.\n그리고 첫 번째 것만 해 줘. 나머지는 손대지 마.\n```\n\n**⑤ 되돌리기 — 30분 넘게 헤맬 때**\n\n```\n30분 넘게 같은 데서 막혔어. 되돌리는 걸 검토하자.\n\n1. 마지막으로 잘 돌아가던 커밋이 언제인지 알려 줘\n2. 그때로 돌아가면 내가 잃는 게 정확히 무엇인지 목록으로\n3. 되돌리는 명령을 알려 줘. 실행은 내가 확인한 다음에 해.\n```"}, {"title": "✅ 됐는지 확인", "md": "- [ ] 에러를 **요약하지 말고 그대로** 붙여 봤나\n- [ ] 에러가 안 뜰 때 **로그를 먼저** 붙였나\n- [ ] \"고쳐 줘\"보다 **\"왜 그런지부터 알려 줘\"**를 먼저 써 봤나\n- [ ] 같은 에러가 **세 번** 반복됐을 때 **무엇을 바꿔야 하는지** 아나 (새 대화 / 쪼개기 / 다른 접근)\n- [ ] **새 대화를 열어** 다시 시작해 봤나\n- [ ] 30분 넘게 막혔을 때 **되돌리기를 떠올렸나**\n- [ ] 막혀 있는 동안 **자동 수락이 꺼져** 있나"}, {"title": "🔎 더 깊이", "md": "- 같은 실패를 계속 반복하지 않고 방식을 바꾸는 장치를 영어로 **circuit breaker**라고 부릅니다. 사람에게도 그대로 적용됩니다.\n- 문제를 감으로 찍지 않고 순서대로 좁혀 가는 방법은 **systematic debugging**으로 찾으면 자료가 많습니다.\n- 되돌리기 세 가지 방법과, 날린 줄 알았던 것을 되찾는 방법은 **Stage 4.5**에 있습니다. 막히기 전에 한 번 읽어 두면 막혔을 때 손이 먼저 움직입니다.\n- 자주 겪는 에러는 원인이 정해져 있는 경우가 많습니다. 세 번 이상 만난 에러는 **지침 파일에 한 줄로 적어 두세요.** 다음부터 AI가 알아서 피합니다."}]}, {"file": "6-검증.md", "id": "s5-6", "no": "6", "title": "AI가 쓴 것을 검증한다", "through": "AI가 초안을 쓰고, 사람이 수락한다. 수락한 사람이 책임진다.", "time": "50분", "need": ["Stage 3의 지침", "Stage 4.5의 저장소"], "head": "세계의 회사들이 AI 코딩을 몇 년 굴려 본 뒤, 서로 다른 말로 같은 곳에 닿았습니다.\n결국 한 문장으로 모입니다.\n\n> ### **\"AI가 초안을 쓰고, 사람이 수락한다. 수락한 사람이 책임진다.\"**", "secs": [{"title": "왜 이걸 하나", "md": "AI에게 시키는 순간, 우리는 **글쓴이에서 편집자로** 자리를 옮깁니다.\n편집자는 글을 직접 쓰지 않지만, 신문에 나간 글이 틀리면 **편집자가 책임집니다.**\n\n이건 겁주려는 말이 아니라 **자리를 정확히 알려주는 말**입니다.\n\"AI가 그렇게 했는데요\"는 손님 앞에서도, 법 앞에서도 통하지 않습니다.\n\n이 절을 건너뛰면 두 가지가 생깁니다.\n하나는 안 되는 걸 됐다고 믿는 것. 다른 하나는 **비밀번호가 밖으로 새는 것.**\n둘 다 손님이 먼저 압니다."}, {"title": "\"통과했습니다\"는 \"됐습니다\"가 아닙니다 — 증거는 두 겹", "md": "| 겹 | 무엇이 확인되나 | 누가 확인하나 | 신호 세기 |\n|---|---|---|---|\n| **1겹** | **안 터졌다** | 테스트·검사 도구 (절 4) | 약함 — AI가 짠 것을 AI가 채점 |\n| **2겹** | **맞게 됐다** | ⭐ **내 눈** | 강함 — 밖에서 온 증거 |\n\n초록불은 \"코드가 안 터졌다\"만 말합니다. **\"구독자에게 메일이 갔다\"는 말해 주지 않습니다.**\n둘은 완전히 다른 말인데, 화면에는 똑같이 초록으로 뜹니다.\n\n우리는 코드를 못 읽습니다. 그래서 **밖에서 온 증거가 유일한 신뢰 근거**입니다.\n내 받은편지함을 직접 엽니다. 메일이 왔나, 제목이 안 깨졌나, 링크를 눌러 보니 진짜 열리나, 수신 거부가 되나.\n\n**AI의 \"완료했습니다\"는 증거가 아니라 주장입니다.**"}, {"tit
