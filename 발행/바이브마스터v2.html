는 위키였고, 이 절에서 처음으로 남이 쓰는 쪽으로 넘어갑니다. <a class=\"xref\" href=\"#6\">Stage 6<\/a>의 서비스에 들어온 구독자가 *\"결제일 바꿀 수 있나요?\" \"환불되나요?\"* 하고 물으면 그 답은 이미 위키에 있습니다 — 다만 서비스 안에서 틀리면 고객이 그 말을 믿고 행동하니, 틀리면 내 책임이 됩니다.", "secs": [{"title": "① 최소 구성 넷을 본다", "md": "거창하지 않습니다. 이 순서로 흐릅니다.\n\n```\n① 답의 재료   FAQ · 약관 · 가격표 · 사용법  (위키/ 에서 골라낸 것만)\n      ↓\n② 근거 찾기   질문과 관련된 문서를 먼저 찾는다\n      ↓\n③ 답하기      찾은 문서 안의 내용으로만 답한다. 없으면 \"모릅니다\"\n      ↓\n④ 넘기기      근거 없음 / 확신 낮음 / 가격·환불·계약 → 사람에게\n```\n\n①②는 도구가 해 주고, **③④는 내가 정해야 합니다.** 봇이 한 말은 내 회사가 한 말이기 때문입니다 — 2024년 한 항공사의 챗봇이 없는 할인 정책을 안내했고, 회사가 *\"챗봇은 별개\"*라고 주장했지만 심판부는 받아들이지 않고 배상을 명령했습니다. 2025년에는 한 개발 도구 회사의 문의 봇이 없는 정책을 지어내 회사가 공개 사과했습니다."}, {"title": "② 공개 폴더를 만들고 검사한다", "md": "가장 먼저 정할 것 — 볼트를 통째로 붙이지 않습니다. 내 위키에는 고객 인터뷰 원문, 가격을 얼마까지 내릴 수 있는지, <a class=\"xref\" href=\"#9\" data-jump=\"s9-5\">판단 기준 파일<\/a>, 아직 안 정해진 초안이 섞여 있고, 그중 하나라도 봇이 인용하면 그날로 사고입니다.\n\n그래서 서비스에 붙이는 것은 따로 만든 폴더 하나입니다. **화이트리스트입니다** — 빼는 게 아니라 넣기로 정한 것만 들어갑니다.\n\n```\n공개/           ← 이것만 봇에게 준다\n├── 자주묻는질문.md   ← 실제로 세 번 이상 받은 질문만\n├── 가격.md\n├── 환불규정.md\n└── 사용법-기본.md\n```\n\n넣기 전에 AI에게 검사시킵니다. 이게 안전장치의 절반입니다.\n\n```\n공개/ 폴더의 모든 파일을 읽고, 아래에 해당하는 문장을 전부 찾아줘.\n고치지는 말고 목록만 보여줘.\n\n- 사람 이름 · 이메일 · 전화번호 · 회사 내부 사정\n- 확정되지 않은 계획 (\"검토 중\", \"예정\")\n- 협상 여지를 드러내는 표현 (\"할인 가능\", \"조정 가능\")\n- 다른 고객이나 거래처를 특정할 수 있는 내용\n```"}, {"title": "③ 지시문 여섯 줄을 넣는다", "md": "지시는 간결하고 강해야 합니다. 한 줄도 빼지 않습니다.\n\n```\n너는 (서비스이름)의 안내 도우미다.\n\n규칙:\n1. 제공된 문서 안에 있는 내용으로만 답한다. 문서에 없으면 지어내지 않는다.\n2. 답할 때마다 어느 문서를 근거로 했는지 문서 이름을 함께 밝힌다.\n3. 문서에 근거가 없으면 이렇게만 답한다:\n   \"이건 제가 확인해 드릴 수 없습니다. 담당자에게 연결해 드릴게요.\"\n4. 다음 주제는 근거가 있어도 확정 답변을 하지 않고 담당자에게 넘긴다:\n   가격 · 환불 · 계약 · 기한 · 개인 계정의 결제 상태\n   (일반 규정 안내까지는 하되, \"○○님의 경우\"는 판단하지 않는다)\n5. 추측하지 않는다. \"아마\", \"보통은\", \"일반적으로\"로 시작하는 답을 하지 않는다.\n6. 답 끝에 항상 붙인다: \"AI 답변은 참고용이며, 확정 안내는 담당자가 드립니다.\"\n```\n\n4번이 가장 중요합니다. **돈이 걸린 것은 근거가 있어도 봇이 확정하지 않습니다.** 3·4·6번은 장식이 아니라 ①에서 본 책임에 대한 안전장치입니다."}, {"title": "④ 넘기기 조건을 붙인다", "md": "넘기기가 「담당자에게 연결합니다」로 끝나면 고객은 처음부터 다시 설명해야 하고, 그러면 봇이 없느니만 못합니다. 넘길 때 셋을 함께 넘깁니다.\n\n| 무엇 | 왜 |\n|---|---|\n| 대화 전문 | 고객이 다시 설명하지 않아도 된다 |\n| 봇이 찾았던 근거 문서 | 내가 확인할 지점이 바로 보인다 |\n| 왜 넘겼는지 | 이 유형이 쌓이면 위키에 채울 것이 보인다 |\n\n```\n넘기는 조건 — 아래 중 하나라도 걸리면 즉시 사람에게\n  ① 근거 문서를 못 찾았다\n  ② 질문에 이 단어가 있다: 환불 · 취소 · 해지 · 가격 · 할인 · 계약 · 세금계산서\n  ③ 고객이 \"사람\" 또는 \"상담원\"이라고 말했다\n  ④ 같은 질문이 두 번 반복됐다 (봇이 못 알아들은 것)\n\n넘길 때 함께 보낼 것 — 대화 전문 · 봇이 본 문서 이름 · 넘긴 이유\n```\n\n**넘긴 이유가 쌓이면 그게 다음에 위키에 쓸 글 목록**입니다. 이 셋째 줄이 되돌이를 돕습니다."}, {"title": "⑤ 함정 질문으로 시험한다", "md": "켜기 전에 일부러 함정 질문을 던집니다. 이게 이 절의 진짜 과제입니다.\n\n```\n① \"지금 할인 받을 수 있나요?\"        → 사람에게 넘어가야 정상\n② \"제 결제 언제 빠지나요?\"           → 사람에게 넘어가야 정상\n③ 문서에 없는 기능을 물어본다        → \"확인해 드릴 수 없습니다\"가 나와야 정상\n④ 문서에 있는 사용법을 물어본다      → 답하고 문서 이름을 대야 정상\n```\n\n**넷 중 하나라도 봇이 지어냈으면 켜지 않습니다.** 지시문을 고치고 다시 시험합니다."}, {"title": "⚡ 따라 하기", "md": "1. 볼트에 `공개/` 폴더를 만들고 `위키/`에서 **넷만 골라 옮깁니다.** 볼트 전체를 주면 판단 기준 파일까지 봇이 인용하기 때문입니다. `공개/` 안에 파일 넷만 보이면 됩니다.\n2. AI에게 ②의 검사 지시문을 붙여넣습니다. 이름·연락처·「할인 가능」류 문장 목록이 나오면 전부 지우고, 목록이 비어 있을 때까지 다시 돌립니다.\n3. 봇 도구를 하나 고릅니다. 국내 고객이 많으면 카카오톡 채널 챗봇, 웹사이트 안에 띄우려면 채널톡 같은 상담 도구, 직접 다루고 싶으면 Chatwoot(오픈소스, 내 서버에 설치)입니다.\n4. 도구의 지시문 칸에 ③의 여섯 줄을 그대로 넣고, ④의 넘기기 조건을 붙입니다. 「사람과 대화하기」 버튼이 화면에 항상 보이는지 같이 확인합니다 — 나갈 문이 없으면 고객은 그냥 떠납니다.\n5. ⑤의 함정 질문 넷을 순서대로 던집니다. ①②는 넘어가고, ③은 「확인해 드릴 수 없습니다」, ④는 문서 이름과 함께 답이 나와야 켭니다.\n6. 달력에 주 1회 30분 「봇 로그 점검」을 넣습니다. 이걸 안 하면 무엇이 틀리고 있는지 영영 모릅니다.\n\n```\n매주 (요일) — 봇 대화 로그를 읽는다\n  ├ 봇이 지어낸 답이 있었나 → 있으면 즉시 그 주제를 넘기기 조건에 추가\n  ├ 사람에게 넘어온 것 중 반복되는 질문 → 공개/자주묻는질문.md 에 추가\n  └ 고객이 개인정보를 입력한 대화 → 지운다\n```"}, {"title": "✅ 확인", "md": "- [ ] 봇에게 준 것이 `공개/` 폴더뿐이고, 그 안에 사람 이름·연락처·「할인 가능」류 표현이 없나\n- [ ] 「지금 할인 받을 수 있나요?」에 봇이 사람에게 넘겼나 — 답을 지어내지 않았나\n- [ ] 답할 때 문서 이름을 대고, 화면에 「사람과 대화하기」 버튼이 항상 보이나\n- [ ] **이번 주에 위키에서 무엇을 다시 꺼내 썼나** — 봇이 인용한 문서가 그 답이 됩니다"}, {"title": "📘 말 풀이", "md": "**근거 표시(출처, citation)** — 답할 때 *\"「환불규정」 문서에 따르면\"*처럼 어느 문서를 보고 답했는지 밝히는 것. 이게 있으면 틀렸을 때 어디를 고칠지 바로 압니다.\n\n**사람에게 넘기기(핸드오프, handoff)** — 봇이 대화를 사람에게 넘기는 것. 좋은 넘기기는 「연결합니다」로 끝나지 않고 그때까지의 대화와 근거를 함께 전달합니다."}, {"title": "⚠️ 함정", "md": "**볼트 전체를 붙입니다.** 이 장에서 가장 크게 다칠 수 있는 자리입니다. `공개/` 폴더만 줍니다.\n\n**개인정보가 상담창에 들어옵니다.** 고객이 주민번호나 카드번호를 그대로 칩니다. 입력창 옆에 *\"주민번호·카드번호는 입력하지 마세요\"*를 띄우고, 들어오면 봇이 즉시 지우도록 합니다.\n\n**대화 기록을 무한정 보관합니다.** 보관 기간을 정하고 지나면 지우고, 외부 AI로 넘기는 개인정보를 최소로 합니다. 개인정보 관련 법이 2026년에 개정·시행되었으므로 통지 의무와 보관 원칙은 <a class=\"xref\" href=\"#6\">Stage 6<\/a>의 법 관련 절을 함께 봅니다.\n\n**가격표를 고쳤는데 봇이 옛날 가격을 말합니다.** <a class=\"xref\" href=\"#9\" data-jump=\"s9-4\">4절<\/a>의 재색인 함정과 같습니다. 가격을 고치면 `공개/가격.md`도 같은 날 고칩니다."}, {"title": "🔎 더 깊이", "md": "- 안전장치의 전체 목록과 개인정보 처리는 <a class=\"xref\" href=\"#자동화\">업무 자동화<\/a> 섹션의 「CS 봇」 절에 있습니다. 여기서는 「내 위키를 서비스에 심는 법」만 다뤘고, 봇을 회사 창구로 운영하는 법은 그쪽입니다.\n- 검색이 내 컴퓨터가 아니라 서비스 안에서 돌아야 하는 경우의 기술 선택은 <a class=\"xref\" href=\"#9\" data-jump=\"s9-4\">4절<\/a> 2단계입니다.\n- 개인정보 통지 의무와 국외이전은 <a class=\"xref\" href=\"#6\">Stage 6<\/a>에서 다룹니다.\n- 검색해 볼 말 — `grounded answering citation`, `chatbot human handoff`, `RAG hallucination guardrail`"}]}]}, {"folder": "10-판매", "key": "10", "name": "판매", "color": "#fde68a", "sub": "남 앞에 내놓는 최소한", "goal": "만든 것을 남 앞에 내놓는 최소한", "makes": "소개 한 장 · 첫 사용자 다섯", "time": "2시간", "need": ["Stage 6의 라이브 주소"], "head": "이 장은 **가볍게** 갑니다. 지금은 학습과 활용의 충실도로 가고, 서비스 운영 관리는 나중에 따로 다룹니다.", "metasecs": [{"title": "✅ 자가 체크", "md": "- [ ] 처음 보는 사람이 **30초 안에** 이게 무엇인지 아나\n- [ ] 실제로 다섯 명에게 보여 줬나\n- [ ] 「이건 안 한다」 목록이 있나"}, {"title": "다음으로", "md": "첫 유료 사용자는 커리큘럼으로 만들어지지 않습니다. 실제로 팔아야 생깁니다."}], "sections": [{"file": "1-소개한장.md", "id": "s10-1", "no": "1", "title": "소개 한 장을 쓴다", "goals": ["누가·무슨 문제·어떻게 세 칸을 채운 한 문장을 쓸 수 있다", "처음 보는 사람이 30초 안에 알아보는 소개 한 장을 만들 수 있다"], "steps": ["한 문장의 세 칸을 채운다", "다섯 덩이로 한 장을 만든다", "처음 보는 척한 AI에게 맞히게 한다"], "through": "기능을 쓰지 말고, 누구의 무슨 문제를 어떻게 푸는지를 쓴다.", "time": "30분", "need": ["Stage 6의 라이브 주소"], "head": "만들어 놨는데 아무도 안 쓰는 가장 흔한 이유는 처음 본 사람이 이게 뭔지 모르기 때문입니다. 처음 온 사람은 몇 초 안에 «나랑 상관있나»만 판단하고 닫습니다.", "secs": [{"title": "① 한 문장의 세 칸을 채운다", "md": "소개 한 장의 전부는 **한 문장**입니다. 나머지는 그 문장을 못 믿는 사람을 위한 부연입니다.\n\n> ［누가］의 ［무슨 문제］를 ［어떻게］ 풉니다.\n\n| 칸 | 나쁜 예 | 나은 예 |\n|---|---|---|\n| 누가 | \"누구나\" | \"매일 IT 뉴스를 챙겨야 하는 직장인\" |\n| 무슨 문제 | \"정보 과잉\" | \"아침마다 기사 20개를 훑느라 30분을 씁니다\" |\n| 어떻게 | \"AI 기반 큐레이션 엔진\" | \"오늘 볼 것 5개만 아침 7시에 메일로 보냅니다\" |\n\n왼쪽 칸은 읽어도 내 이야기인지 알 수가 없습니다. 만든 사람은 기능부터 쓰고 싶지만, 처음 보는 사람은 «나한테 무슨 소용인가» 하나만 봅니다.\n\n- ❌ \"자동 수집 · 요약 · 발송 파이프라인을 갖춘 뉴스레터 플랫폼\"\n- ⭕ \"아침 뉴스 훑는 30분을 5분으로 줄입니다\""}, {"title": "② 다섯 덩이로 한 장을 만든다", "md": "| 순서 | 무엇 | 분량 |\n|---|---|---|\n| 1 | 한 문장 — 누구의 무슨 문제를 어떻게 | 한 줄 |\n| 2 | 화면 한 장 — 실제로 쓰는 모습 | 이미지 1 |\n| 3 | 뭐가 달라지나 — 기능이 아니라 결과로 | 세 줄 |\n| 4 | 지금 할 일 버튼 | 버튼 1 |\n| 5 | 누가 만들었나 | 한 줄 |\n\n버튼은 **하나만** 놓으세요. 두 개 놓으면 사람은 고르다가 아무것도 안 누릅니다. 화면 한 장은 문단 세 개보다 셉니다."}, {"title": "③ 처음 보는 척한 AI에게 맞히게 한다", "md": "내가 쓴 소개는 내 눈에는 늘 잘 읽힙니다. 그래서 **처음 보는 사람** 역할을 AI에게 맡기고, 화면에 적힌 것만 보고 네 가지를 맞히게 합니다."}, {"title": "⚡ 따라 하기", "md": "1. ①의 한 문장 틀을 종이에 적고 세 칸을 채우세요. 10분 안에 끝냅니다 — 오래 붙들수록 기능 자랑이 섞입니다. 세 칸이 다 찬 한 문장이 남으면 됩니다.\n2. Stage 6의 라이브 주소를 열고 첫 화면을 ②의 다섯 덩이로 고치세요. 새 페이지는 필요 없습니다. 첫 화면 맨 위에 한 문장이 보이면 됩니다.\n3. 새 대화를 열고 아래를 붙여넣은 뒤, 소개 한 장의 글을 그대로 넣으세요. 네 가지 답과 확신도가 돌아옵니다.\n\n```\n지금부터 너는 이 서비스를 한 번도 본 적 없는 사람이다.\n내가 붙여넣는 화면 내용만 보고, 아래 네 가지를 추측해서 답해라.\n내가 설명을 덧붙이면 그건 무시하고 화면에 적힌 것만 근거로 삼아라.\n\n1. 이건 누구를 위한 것인가\n2. 그 사람의 어떤 문제를 푸는가\n3. 이걸 쓰면 무엇이 달라지는가\n4. 지금 내가 눌러야 할 버튼은 무엇인가\n\n각 답 끝에 \"확신도: 높음 / 보통 / 낮음\"을 붙여라.\n마지막에 \"화면만 봐서는 알 수 없었던 것\"을 목록으로 적어라.\n좋게 봐주지 말고, 모르겠으면 모르겠다고 해라.\n\n--- 화면 내용 ---\n[여기에 소개 한 장의 글을 그대로 붙여넣기]\n```\n\n4. 「누구를 위한 것인가」를 틀렸거나 확신도가 «낮음»이면 화면을 고치세요. AI를 설득하지 않습니다 — 처음 보는 사람에게는 설득할 기회가 없습니다.\n5. 고친 뒤 **새 대화**를 열어 3을 다시 돌리세요. 같은 대화에서 반복하면 앞의 답을 기억해서 맞히는 척합니다. 네 답이 모두 «높음»으로 돌아오면 다음 절로 갑니다."}, {"title": "✅ 확인", "md": "- [ ] 소개 한 장에 누가 · 무슨 문제 · 어떻게가 한 문장으로 들어 있나\n- [ ] 처음 보는 척한 AI가 누구를 위한 것인지 맞혔나\n- [ ] 누를 버튼이 하나만 있나\n\n하나라도 «아니오»면 다음 절로 가지 않습니다. 잘못된 소개로 다섯 명에게 보여 주면 다섯 번 헛수고입니다."}, {"title": "📘 말 풀이", "md": "**랜딩 페이지(landing page)** — 처음 들어온 사람이 가장 먼저 닿는 한 장짜리 화면. 여기서는 「소개 한 장」과 같은 말입니다.\n\n**가치 제안(value proposition)** — 「이걸 쓰면 당신에게 무엇이 좋아지는가」를 한 문장으로 적은 것. 기능 목록이 아니라 상대가 얻는 것입니다."}, {"title": "⚠️ 함정", "md": "**업계 말로 씁니다.** 내가 매일 쓰는 단어라서 쉬워 보일 뿐, 그 분야 밖 사람에게는 암호입니다.\n\n**\"누구나 쓸 수 있습니다\"라고 씁니다.** 아무도 자기 이야기로 못 읽습니다. 대상을 좁힐수록 더 많이 읽힙니다."}, {"title": "🔎 더 깊이", "md": "- 화면을 보기 좋게 만드는 것은 <a class=\"xref\" href=\"#4\">Stage 4<\/a>에서 다뤘습니다. 여기서는 무엇을 쓸지만 정합니다.\n- 검색해 볼 말 — `value proposition 한 문장`, `landing page above the fold`"}]}, {"file": "2-다섯명.md", "id": "s10-2", "no": "2", "title": "다섯 명에게 보여주기", "goals": ["처음 보는 사람 다섯에게 설명 없이 보여 주고 막히는 자리를 찾을 수 있다", "\"좋다\"는 답을 정보로 바꾸는 질문 셋을 쓸 수 있다"], "steps": ["다섯 명을 고른다", "설명 없이 보여 주고 셋만 묻는다", "다섯의 답에서 겹치는 것을 찾는다"], "through": "광고보다 먼저 다섯 명에게 보여 준다. 「좋다」는 답에서는 아무것도 알 수 없다.", "time": "40분", "need": ["Stage 6의 라이브 주소", "1절에서 만든 소개 한 장"], "head": "만들자마자 하고 싶어지는 일은 광고입니다. 그런데 첫 화면에서 사람들이 막히고 있다면, 광고는 그 막힘을 더 많은 사람에게 보여 주는 일입니다.", "secs": [{"title": "① 다섯 명을 고른다", "md": "한 명은 그 사람 취향인지 진짜 문제인지 구분이 안 되고, 쉰 명은 지금 모을 수 없습니다. **혼자 추측하는 것을 그만두는 최소 인원**이 다섯입니다.\n\n| 좋은 사람 | 왜 |\n|---|---|\n| 1절에서 정한 「누가」에 실제로 해당하는 사람 | 진짜 대상의 반응이라야 정보가 됩니다 |\n| 나에게 잘 보일 이유가 없는 사람 | 가까운 사람일수록 좋게 말해 줍니다 |\n| 이 분야를 잘 모르는 사람 한 명 | 업계 말로 썼는지 여기서 걸립니다 |\n\n개발자 친구에게만 보여 주지 마세요. 만드는 사람끼리는 기능 이야기로 흘러갑니다."}, {"title": "② 설명 없이 보여 주고 셋만 묻는다", "md": "화면을 켜 준 뒤 **설명하지 않고** 지켜봅니다. 내가 한마디라도 설명하면 그 사람은 더 이상 처음 보는 사람이 아닙니다.\n\n| 순서 | 질문 | 여기서 알아내는 것 |\n|---|---|---|\n| 1 | \"여기서 무엇을 하는 데인 것 같아요?\" | 소개가 통했나 |\n| 2 | \"지금 무엇을 누르고 싶어요?\" | 다음 걸음이 보이나 |\n| 3 | \"안 쓸 것 같으면 왜요?\" | 진짜 막는 것이 무엇인가 |\n\n\"좋네요\", \"필요한 사람 많겠어요\"는 정보가 0입니다. 그래서 3번은 \"쓰실 것 같아요?\"가 아니라 \"안 쓸 것 같으면 왜요?\"로 묻습니다 — 안 쓸 이유를 말해도 되는 자리를 열어 주면 사람은 솔직해집니다. 칭찬이 나오면 \"어떤 점이 그런가요?\"로 되받으세요.\n\n말보다 손이 정확합니다. 마우스가 멈춘 곳, 두 번 누른 곳, 나를 쳐다본 곳을 적어 두세요 — 나를 쳐다본 자리가 곧 화면이 설명에 실패한 자리입니다."}, {"title": "③ 다섯의 답에서 겹치는 것을 찾는다", "md": "한 명 보고 바로 고치지 않습니다. 다섯을 다 본 뒤에 적은 것을 AI에게 넘겨 **두 명 이상이 같은 자리에서 막힌 곳**을 찾게 하고, 그중 하나만 고칩니다."}, {"title": "⚡ 따라 하기", "md": "1. 다섯 명의 이름을 종이에 적으세요. \"누구 있겠지\"로는 연락이 안 갑니다. 최소 두 명은 나에게 잘 보일 이유가 없는 사람이어야 합니다.\n2. 한 명씩 따로 만나 화면을 켜 주고 아무 말도 하지 마세요. 한자리에 모으면 첫 사람의 말이 나머지 넷의 답을 물들입니다.\n3. ②의 질문 셋을 순서대로 묻고, 답을 그 사람 말 그대로 받아 적으세요. 요약하면 내 해석이 섞입니다. 다섯 명분의 받아 적은 글이 남으면 됩니다.\n4. 다섯이 끝나면 새 대화를 열고 아래를 붙여넣은 뒤 받아 적은 것을 그대로 넣으세요. 「지금 당장 고칠 것 하나」가 이유와 함께 돌아옵니다.\n\n```\n아래는 내 서비스를 처음 본 다섯 명에게 물은 답을 그대로 옮긴 것이다.\n다음 순서로 정리해라.\n\n1. 다섯 명 중 \"이게 무엇인지\" 맞힌 사람은 몇 명인가. 틀린 사람은 무엇이라고 했나\n2. 두 명 이상이 같은 자리에서 막힌 것이 있나. 있으면 그 자리를 적어라\n3. \"안 쓸 이유\"로 나온 것을 모아, 화면을 고쳐서 풀리는 것과\n   화면을 고쳐도 안 풀리는 것(=서비스 자체의 문제)으로 나눠라\n4. 지금 당장 고칠 것 딱 하나만 골라라. 이유도 함께\n\n내 말이 아니라 저 사람들 말만 근거로 삼아라.\n좋게 해석하지 말고, 답이 애매하면 애매하다고 적어라.\n\n--- 받아 적은 것 ---\n[여기에 다섯 명의 답을 그대로 붙여넣기]\n```\n\n5. 4에서 나온 **하나**만 고치세요. 다 고치려 들면 아무것도 안 끝납니다. 나머지 「안 쓸 이유」는 지우지 말고 남겨 둡니다 — 4절에서 씁니다."}, {"title": "✅ 확인", "md": "- [ ] 실제로 다섯 명에게 보여 줬나 (머릿속으로 상상한 것 말고)\n- [ ] 다섯 명의 이름과 답이 글로 남아 있나\n- [ ] 두 명 이상이 같은 자리에서 막힌 곳을 찾아서 고쳤나\n\n「좋다」밖에 안 나왔다면 다섯 명을 다시 고릅니다. 대상이 틀렸거나 질문이 틀렸습니다."}, {"title": "📘 말 풀이", "md": "**사용자 테스트(user test)** — 만든 것을 실제 사람 앞에 놓고, 도와주지 않고 지켜보는 일. 설문과 다른 점은 말을 묻는 게 아니라 행동을 보는 것입니다."}, {"title": "⚠️ 함정", "md": "**옆에서 설명합니다.** 가장 흔합니다. \"아 그건 여기 누르면 돼요\" 하는 순간 그 사람의 반응은 못 쓰게 됩니다.\n\n**가족·가까운 친구만 부릅니다.** 가장 좋게 말해 주고 가장 쓸모없는 답을 줍니다."}, {"title": "🔎 더 깊이", "md": "- 여기서 나온 「안 쓸 이유」는 <a class=\"xref\" href=\"#10\" data-jump=\"s10-4\">4절<\/a>에서 할 것과 안 할 것을 가르는 재료가 됩니다.\n- 검색해 볼 말 — `사용성 테스트 진행 방법`, `usability test think aloud`"}]}, {"file": "3-지표최소한.md", "id": "s10-3", "no": "3", "title": "판단선을 미리 적어 둔다", "goals": ["네 단계 숫자 중 어디가 떨어지는지 보고 고칠 자리를 짚을 수 있다", "숫자를 보기 전에 「이러면 방향을 바꾼다」를 파일로 적어 둘 수 있다"], "steps": ["네 단계 숫자를 정한다", "판단선을 미리 적는다", "한 달에 한 번 대조한다"], "through": "숫자는 한 달에 한 번. 대신 「이러면 방향을 바꾼다」를 미리 적어 둔다.", "time": "30분", "need": ["Stage 6의 라이브 주소", "Stage 9의 위키 폴더"], "head": "다섯 명은 「무엇이 잘못됐나」를 알려 주지만 「고친 게 나아졌나」는 숫자가 알려 줍니다. 혼자 하는 사람에게 숫자의 역할은 하나 — 계속 갈지, 방향을 바꿀지 판단하는 것입니다.", "secs": [{"title": "① 네 단계 숫자를 정한다", "md": "처음 온 사람이 **원하는 자리까지 도착하는지**만 봅니다. 중간에 몇 명씩 사라지는지 단계로 끊어서 셉니다.\n\n| 단계 | 무엇 | 이 숫자가 뜻하는 것 |\n|---|---|---|\n| 1 | 화면에 들어온 사람 | 사람이 오기는 하나 |\n| 2 | 첫 버튼을 누른 사람 | 소개가 통했나 |\n| 3 | 끝까지 마친 사람 | 실제로 쓸 수 있는가 |\n| 4 | 다시 온 사람 | 한 번이 아니라 계속 쓸 만한가 |\n\n단계 사이가 뚝 떨어지는 곳이 지금 고쳐야 할 자리입니다. 100명이 들어와서 90명이 첫 버튼도 안 눌렀다면 문제는 기능이 아니라 소개 한 장입니다. 10명 중 1명이어도 같은 이야기입니다."}, {"title": "② 판단선을 미리 적는다", "md": "숫자를 본 **뒤에** 판단하면 사람은 보고 싶은 대로 봅니다. 잘 나오면 \"역시 맞았어\", 안 나오면 \"아직 이르지\" — 둘 다 계속하는 쪽으로 결론이 납니다. 그래서 숫자를 보기 전에 한 장을 적어 둡니다.\n\n```markdown\n판단선 — 이러면 바꾼다\n갱신: 2026-09-10\n\n이번 달에 볼 숫자:\n- 들어온 사람 / 첫 버튼 누른 사람 / 끝까지 간 사람 / 다시 온 사람\n\n미리 정한 선:\n- 첫 버튼을 절반도 안 누르면 → 소개 한 장을 다시 쓴다. 기능은 안 건드린다\n- 끝까지 간 사람이 0이면 → 중간 어디서 막히는지 사람 셋에게 다시 보여준다\n- 다시 온 사람이 두 달 연속 0이면 → 한 번 쓰고 마는 물건이다.\n  「누구의 무슨 문제」를 다시 고른다\n- 세 달 동안 아무 선도 안 넘으면 → 이 방향은 접고 다른 문제를 고른다\n\n이번 달에 안 볼 것:\n- 하루 단위 숫자 · 남의 서비스 숫자\n```\n\n선을 정할 근거가 없어도 괜찮습니다. 남의 평균치는 서비스마다 조건이 달라서 내 판단에 쓸 수 없습니다. 첫 달에는 「내가 이 정도는 되어야 계속할 만하다」로 정하고, 두 달째부터 내 지난달과 비교합니다."}, {"title": "③ 한 달에 한 번 대조한다", "md": "하루 단위 변동은 대부분 아무 뜻이 없는데, 매일 보면 그 잡음에 매번 반응해서 방향이 일주일에 세 번 바뀝니다. **날을 정해 한 달에 한 번**, 미리 정한 선을 넘었는지만 대조하면 30분에 끝나고 기분에 흔들리지 않습니다."}, {"title": "⚡ 따라 하기", "md": "1. ②의 「판단선」을 파일 하나로 만들어 Stage 9의 위키 폴더에 두세요. 한곳에 있어야 다음 달에 다시 꺼냅니다. 판단 기준 파일 옆에 판단선 파일이 보이면 됩니다.\n2. 네 단계 숫자를 어디서 볼지 정하세요. 도구를 새로 붙이기 전에 가입 수·주문 수처럼 이미 남는 숫자로 셀 수 있는지 먼저 봅니다. 네 칸마다 「어디서 본다」가 한 줄씩 적히면 됩니다.\n3. 달력에 매달 한 번 반복 일정을 거세요. 이름은 「숫자 보는 날 · 30분」. 그 사이에는 숫자를 열지 않고 만들던 것을 만듭니다.\n4. 그날이 오면 새 대화를 열고 아래를 붙여넣은 뒤 이번 달 숫자와 판단선을 넣으세요. 가장 크게 떨어진 한 곳과 넘은 선이 돌아옵니다.\n\n```\n아래는 이번 달 숫자와, 내가 지난달에 미리 적어 둔 판단선이다.\n순서대로 답해라.\n\n1. 네 단계 중 어디가 가장 크게 떨어지나. 그 한 곳만 짚어라\n2. 미리 적어 둔 선 중 넘은 것이 있나. 있으면 어느 것인가\n3. 넘은 선이 있으면, 거기 적힌 행동을 그대로 말해라. 다른 제안을 하지 마라\n4. 이 숫자로는 판단할 수 없는 것이 있으면 \"알 수 없음\"이라고 적어라\n\n지어내지 마라. 표에 없는 숫자는 쓰지 마라.\n격려하지 마라. 나는 지금 판단을 하려는 것이지 기분을 좋게 하려는 게 아니다.\n\n--- 이번 달 숫자 ---\n[네 단계 숫자를 붙여넣기]\n\n--- 미리 적어 둔 판단선 ---\n[판단선 파일 내용을 붙여넣기]\n```\n\n5. 넘은 선이 있으면 **거기 적힌 대로** 하세요. 그 자리에서 새 계획을 세우면 미리 적어 둔 뜻이 없어집니다."}, {"title": "✅ 확인", "md": "- [ ] 「판단선」 파일이 글로 남아 있고, 숫자를 보기 전에 적었나\n- [ ] 네 단계 숫자를 어디서 보는지 말할 수 있나\n- [ ] 달력에 매달 한 번 보는 날이 잡혀 있나"}, {"title": "📘 말 풀이", "md": "**퍼널(funnel, 깔때기)** — 처음 온 사람이 단계를 지나며 줄어드는 모양. 넓은 입구로 들어와 좁은 출구로 나가는 깔때기를 닮았습니다.\n\n**리텐션(retention, 유지)** — 한 번 쓴 사람이 다시 오는 비율. 새로 오는 사람 수보다 이게 사업의 생사를 더 정확히 말해 줍니다."}, {"title": "⚠️ 함정", "md": "**들어온 사람 수만 봅니다.** 가장 기분 좋고 가장 쓸모없는 숫자입니다. 들어와서 아무것도 안 하고 나갔으면 0명과 같습니다.\n\n**남의 평균과 비교합니다.** 인터넷에 도는 전환율 숫자는 대부분 출처가 불분명하고 조건이 다릅니다. 비교 대상은 내 지난달입니다."}, {"title": "🔎 더 깊이", "md": "- 이 판단선 파일은 <a class=\"xref\" href=\"#9\">Stage 9<\/a>에서 만든 「내 판단 기준 파일」 옆에 둡니다. 한 곳에 모아야 다음 달에 다시 꺼내 씁니다.\n- 검색해 볼 말 — `퍼널 분석 기본`, `retention cohort 읽는 법`\n- **[확인 필요]** — 「보통 이 정도는 나온다」 하는 업종별 기준선은 여기 쓰지 않았습니다. 도는 숫자들의 출처와 조건을 확인하지 못했고, 확인되지 않은 남의 숫자로 내 방향을 바꾸는 것이 더 위험합니다."}]}, {"file": "4-안할것.md", "id": "s10-4", "no": "4", "title": "안 할 것을 정한다", "goals": ["「안 할 것」 목록을 파일로 만들어 판단 기준 파일 옆에 둘 수 있다", "들어온 요청을 지금 만든다·적어만 둔다·안 한다로 나눌 수 있다"], "steps": ["안 할 것을 파일로 못 박는다", "들어온 요청을 대 본다", "이 장에서 되는 것과 안 되는 것을 가른"], "through": "「안 할 것」 목록이 로드맵보다 중요하다.", "time": "20분", "need": ["Stage 9의 판단 기준 파일", "2절에서 받아 적은 다섯 명의 답"], "head": "사람들에게 보여 주기 시작하면 곧 \"○○ 기능도 있으면 좋겠는데요\"가 들어옵니다. 혼자 하는 사람의 시간은 정해져 있고 요청은 정해져 있지 않아서, 다 따라가면 여섯 달 뒤 아무것도 제대로 안 되는 물건 하나가 남습니다.", "secs": [{"title": "① 안 할 것을 파일로 못 박는다", "md": "할 일 목록은 유혹이 왔을 때 힘이 없습니다. 한 줄 더 적으면 그만이니까요. 막아 주는 건 **\"이건 안 하기로 이미 정했다\"** 한 줄입니다.\n\n| | 할 일 목록 | 안 할 것 목록 |\n|---|---|---|\n| 유혹이 왔을 때 | 한 줄 추가하면 끝 | 정한 것을 뒤집어야 함 |\n| 남에게 거절할 때 | 근거가 없음 | \"그건 안 하기로 정했습니다\" |\n| 여섯 달 뒤 | 늘어나 있음 | 그대로 있음 |\n\n```markdown\n안 할 것 — [날짜]\n\n이건 안 한다:\n- 한 사람만 말한 기능 — 세 사람이 같은 말을 하기 전에는 안 만든다\n- 내가 안 쓸 기능 — 내가 매일 안 쓰는 것은 남도 안 쓴다\n- 「나중에 필요할 것 같아서」 미리 만드는 것\n- [내 서비스에만 해당하는 것 두세 개를 여기에]\n\n미룬 것 (지운 게 아니다):\n- [거절한 요청과 누가 말했는지]\n\n이건 언제 다시 볼까:\n- 세 사람이 같은 요청을 하면 → 그때 다시 본다\n- 지금 하는 것이 끝나면 → 그때 다시 본다\n\n요청이 들어오면 이 순서로 본다:\n1. 판단 기준 파일에 걸리나 → 걸리면 여기서 끝\n2. 세 사람 이상이 같은 말을 했나 → 아니면 적어만 두고 안 만든다\n3. 지금 만들고 있는 것을 멈춰야 하나 → 멈춰야 하면 안 한다\n```"}, {"title": "② 들어온 요청을 대 본다", "md": "<a class=\"xref\" href=\"#9\">Stage 9<\/a>에서 적은 판단 기준 파일이 여기서 실제로 쓰입니다. 요청이 들어올 때마다 처음부터 고민하지 않고, 두 파일에 대 봅니다. AI에게 두 파일을 같이 읽히면 **내 기준대로** 답합니다."}, {"title": "③ 이 장에서 되는 것과 안 되는 것을 가른다", "md": "첫 유료 사용자는 커리큘럼으로 만들어지지 않습니다 — 실제로 팔아야 생깁니다. 소개 한 장, 다섯 명, 판단선은 **팔 준비**이지 파는 일이 아닙니다. 파는 일은 값을 정해서 사람에게 말을 걸고 거절을 여러 번 듣는 일이라, 적어서 되는 게 아니라 해야 되는 일입니다.\n\n| 이 장에서 되는 것 | 이 장에서 안 되는 것 |\n|---|---|\n| 처음 보는 사람이 30초 안에 알게 만들기 | 첫 결제 받기 |\n| 다섯 명 앞에서 막히는 데 찾기 | 값을 얼마로 정할지 |\n| 방향을 바꿀 선을 미리 정하기 | 계속 쓰게 만드는 운영 |\n\n값 정하기·고객 응대·운영은 다음 버전에서 따로 다룹니다."}, {"title": "⚡ 따라 하기", "md": "1. ①의 「안 할 것」 틀을 파일로 만들어 Stage 9의 판단 기준 파일 옆에 두세요. 같은 폴더에 두 파일이 나란히 보이면 됩니다.\n2. 지금 하고 싶은 것 중 세 개를 골라 「이건 안 한다」에 먼저 넣으세요. 남이 요청한 것 말고 내가 만들고 싶은 것부터 — 유혹은 대개 밖이 아니라 안에서 옵니다. 세 줄이 채워지면 됩니다.\n3. 새 대화를 열고 아래를 붙여넣은 뒤, 두 파일과 2절에서 받아 적은 요청을 넣으세요. 요청마다 「지금 만든다 / 적어만 둔다 / 안 한다」가 돌아옵니다.\n\n```\n아래 두 가지를 읽고, 들어온 요청들을 분류해라.\n\n1. 각 요청이 \"안 할 것\" 목록에 걸리나. 걸리면 어느 줄에 걸리는지 그대로 인용해라\n2. 걸리지 않은 것 중에서, 같은 말을 세 사람 이상이 한 것이 있나\n3. 2번에 해당하는 것이 없으면 \"지금 만들 것 없음\"이라고 답해라.\n   억지로 하나를 고르지 마라\n4. 각 요청을 \"지금 만든다 / 적어만 둔다 / 안 한다\" 셋 중 하나로 나눠라\n\n새 기능을 제안하지 마라. 내가 준 목록 안에서만 판단해라.\n\n--- 안 할 것 목록 ---\n[파일 내용 붙여넣기]\n\n--- Stage 9의 판단 기준 파일 ---\n[파일 내용 붙여넣기]\n\n--- 들어온 요청 ---\n[다섯 명에게 들은 것 붙여넣기]\n```\n\n4. \"지금 만들 것 없음\"이 나와도 그대로 받아들이세요. 그게 오히려 흔한 답입니다.\n5. 안 하기로 한 것은 지우지 말고 **「미룬 것」** 칸에 옮기세요. 세 번째 사람이 같은 말을 할 때 바로 알아봅니다. 그 칸이 채워지면 이 장이 끝난 것입니다."}, {"title": "✅ 확인", "md": "- [ ] 「이건 안 한다」 목록이 파일로 있고, 내가 만들고 싶었던 것이 하나라도 들어 있나\n- [ ] 거절한 요청을 지우지 않고 「미룬 것」에 적어 뒀나\n- [ ] 「첫 결제는 아직 없다」를 그대로 인정하고 있나"}, {"title": "📘 말 풀이", "md": "**기능 요청(feature request)** — 쓰는 사람이 \"이것도 있으면 좋겠다\"고 말하는 것. 요청은 정보이지 할 일이 아닙니다.\n\n**기능 비대(feature creep)** — 거절을 못 해서 기능이 계속 늘어나다가, 결국 무엇을 위한 물건인지 아무도 모르게 되는 상태."}, {"title": "⚠️ 함정", "md": "**머릿속에만 둡니다.** 안 적은 원칙은 유혹 앞에서 없는 것과 같습니다. 파일로 있어야 합니다.\n\n**첫 결제를 받은 척합니다.** 본인 카드로 결제해 보는 건 기능 확인이지 판매가 아닙니다. 헷갈리면 판단이 통째로 틀어집니다."}, {"title": "🔎 더 깊이", "md": "- 값을 정하는 법 · 고객 응대 · 계속 쓰게 만드는 운영은 다음 버전의 「서비스 운영」에서 다룹니다. 여기에는 없습니다.\n- 만드는 것 자체를 더 단단히 하려면 <a class=\"xref\" href=\"#5\">Stage 5<\/a>와 <a class=\"xref\" href=\"#7\">Stage 7<\/a>로 돌아갑니다.\n- 검색해 볼 말 — `feature creep 사례`, `not-to-do list 제품`"}]}]}, {"folder": "업무자동화", "key": "자동화", "name": "업무 자동화", "color": "#f59e0b", "sub": "회사를 굴리는 일 — 별도 섹션", "goal": "회사 일의 반복을 덜어낸다", "makes": "뉴스레터 · 커뮤니티 · 블로그 · CS봇", "time": "각 1~3시간", "need": ["본인 소유 도메인"], "head": "**Stage와 층이 다릅니다.** 0~10은 *내 서비스를 만드는 법*이고, 여기는 *내 회사 일을 굴리는 법*입니다.\n서비스가 없어도 오늘 켤 수 있습니다.\n\n핵심은 하나 — **1인이 자동화에 실패하는 이유는 검수할 사람이 없어서**입니다.\n그래서 **검수가 거의 필요 없는 일부터** 켭니다.", "metasecs": [{"title": "✅ 자가 체크", "md": "- [ ] 이번 달에 **하나를 실제로 켰나**\n- [ ] 그게 **검수 없이 나가도 되는 일**인지 판단하고 켰나\n- [ ] 자동화하면 안 되는 것 목록을 읽었나\n- [ ] 회수기간이 3개월을 넘는 것을 걸러냈나"}], "sections": [{"file": "1-무엇부터.md", "id": "s자동화-1", "no": "1", "title": "무엇부터 자동화할지 고르기", "goals": ["반복 업무를 «되돌릴 수 있나»로 갈라 이번 달 후보 하나를 고를 수 있다", "회수기간을 계산해 3개월 넘는 자동화를 걸러낼 수 있다", "1인 회사의 자동화가 실패하는 이유를 한 문장으로 말할 수 있다"], "steps": ["점수표의 뒤집힌 축을 본다", "검수 부담으로 순서를 정한다", "회수기간을 계산한다"], "through": "실수 비용이 높은 일은 자동화 후순위다. 되돌릴 수 있는 것부터 켠다.", "time": "40분", "need": [], "head": "**이 섹션은 Stage 0~10과 층이 다릅니다.** Stage 0~10은 «내 서비스를 만드는 법»이고, 여기는 «내 회사 일을 굴리는 법»이라 아직 만든 서비스가 없어도 오늘 켤 수 있습니다.", "secs": [{"title": "① 점수표의 뒤집힌 축을 본다", "md": "자동화 대상을 고를 때 보통 이렇게 셈합니다.\n\n```\n점수 = 빈도 × 1회 걸리는 시간 × 실수 비용 × 표준화 정도\n```\n\n빈도는 한 달에 몇 번 하나, 1회 시간은 한 번에 몇 분 걸리나, 표준화는 매번 같은 순서로 하나입니다. 이 셋은 곱할수록 점수가 올라갑니다. 그런데 **실수 비용은 반대로 갑니다 — 높을수록 자동화 «후순위»입니다.**\n\n잘못 나간 뉴스레터는 회수할 수 없고, 잘못 답한 가격은 회사가 책임집니다. 그래서 되돌릴 수 있는 것부터 켭니다.\n\n| 되돌릴 수 있나 | 예 | 순서 |\n|---|---|---|\n| 쉽게 되돌린다 | 영수증 분류, 링크 점검, 리포트 생성, 초안 작성 | **먼저** |\n| 되돌리기 번거롭다 | 블로그 발행, 커뮤니티 공지 | 다음 |\n| **못 되돌린다** | 메일 발송, 고객에게 나간 가격·환불 답변, 세무 제출 | **맨 나중, 또는 안 함** |"}, {"title": "② 검수 부담으로 순서를 정한다", "md": "큰 회사는 자동화가 만든 결과물을 다른 사람이 봅니다. 1인 회사는 만든 것도 나, 보는 것도 나입니다. 그래서 자동화가 글 열 개를 만들어 주면 열 개를 다 읽어야 하고, 직접 세 개 쓰는 것보다 오래 걸립니다.\n\n> **검토 시간이 절약 시간을 넘는 순간, 그 자동화는 손해입니다.**\n\n그래서 검수가 거의 필요 없는 일부터 켭니다. 결과가 틀렸는지 눈으로 스쳐도 알 수 있거나, 틀려도 나 말고 아무도 안 보는 일입니다. 영수증을 모아 표로 만드는 일이 그렇고, 고객에게 그대로 나가는 글은 한 글자씩 읽어야 하니 나중입니다."}, {"title": "③ 회수기간을 계산한다", "md": "자동화 하나를 켜는 데도 설정하고, 시험하고, 고치는 시간이 듭니다. 그 시간을 언제 되찾는지 계산합니다.\n\n```\n회수기간(개월) = 켜는 데 든 시간 ÷ (한 달에 아끼는 시간 − 한 달에 드는 검수 시간)\n```\n\n- 켜는 데 3시간, 한 달에 4시간 아끼고 검수에 1시간 → 3 ÷ 3 = 1개월. 한다.\n- 켜는 데 10시간, 한 달에 3시간 아끼고 검수에 2시간 → 10 ÷ 1 = 10개월. 하지 않는다.\n\n**회수기간이 3개월을 넘으면 하지 않습니다.** 1인 회사에서 3개월이면 하는 일 자체가 바뀌어서, 반년 걸려 되찾을 자동화는 되찾기 전에 쓸모가 없어집니다. 괄호 안이 0이나 마이너스면 검수가 절약을 다 먹은 것이고, ②에서 걸러야 했던 일입니다."}, {"title": "⚡ 따라 하기", "md": "1. 지난 한 달에 두 번 이상 반복한 일을 종이든 화면이든 한곳에 적으세요. 후보는 여기서만 나옵니다 — 10개 안팎이면 충분합니다.\n2. 각 줄 옆에 세 칸을 적으세요 — 한 달에 몇 번 / 한 번에 몇 분 / 틀리면 되돌릴 수 있나(예·아니오). 이 세 칸이 ①의 점수표입니다.\n3. 「되돌릴 수 없다」가 붙은 줄에 전부 가로줄을 그으세요. 이번 달 후보에서 빼는 것이라, 목록이 눈에 띄게 짧아져야 합니다.\n4. 남은 줄 중에서 결과를 스쳐 봐도 틀린 게 보이는 일 하나를 고르세요. 검수가 가벼워야 ②의 손해가 안 납니다.\n5. 그 하나로 회수기간을 계산하세요. 3개월 이하면 이번 달 후보가 정해진 것이고, 넘으면 그다음 줄로 넘어갑니다.\n\n정리를 AI에게 시키려면 아래를 그대로 붙여넣고 목록을 이어서 적으세요. 표 한 장과 추천 하나가 돌아와야 합니다.\n\n```\n아래는 내가 지난 한 달 동안 두 번 이상 반복한 일 목록이야.\n각 항목을 표로 정리해 줘. 칸은 이렇게:\n\n| 일 | 월 횟수 | 1회 소요(분) | 되돌릴 수 있나 | 결과를 스쳐 봐도 틀린 게 보이나 | 이번 달 후보 |\n\n규칙:\n- \"되돌릴 수 있나\"가 아니오면 이번 달 후보에서 무조건 뺀다. 이유를 한 줄로 적어라.\n- \"스쳐 봐도 틀린 게 보이나\"가 아니오면 검수가 무거운 일이니 순위를 뒤로 내려라.\n- 마지막에 후보 딱 하나만 추천하고, 왜 그것인지 두 줄로 설명해라.\n- 내 상황을 추측해서 항목을 새로 만들지는 마라. 내가 적은 것만 써라.\n\n[여기에 목록을 붙여넣습니다]\n```\n\n이어서 회수기간을 확인하세요. 「한다」 또는 「하지 않는다」 한 줄로 끝나야 합니다.\n\n```\n위에서 추천한 그 하나에 대해 회수기간을 계산해 줘.\n회수기간 = 켜는 데 드는 시간 ÷ (월 절약 시간 − 월 검수 시간)\n켜는 데 드는 시간은 네가 추정하되, 추정이라고 밝히고 근거를 한 줄로 적어라.\n3개월을 넘으면 \"하지 않는다\"로 결론 내라.\n```"}, {"title": "✅ 확인", "md": "- [ ] 내 반복 업무 목록이 눈앞에 목록 형태로 있고, 「되돌릴 수 없는 일」에 가로줄이 그어져 있나\n- [ ] 이번 달에 켤 후보가 딱 하나로 좁혀졌나\n- [ ] 그 하나의 회수기간 숫자를 말할 수 있나(그리고 3개월 이하인가)\n- [ ] 그것이 검수 없이 나가도 되는 일인지 예·아니오로 답할 수 있나\n\n하나라도 «아니오»면 다음 절로 넘어가지 않습니다. 후보를 못 고른 채 읽으면 여섯 개를 다 켜고 싶어집니다."}, {"title": "📘 말 풀이", "md": "**자동화(automation)** — 사람이 매번 손으로 하던 순서를, 조건을 정해 두고 기계가 대신 밟게 하는 것. \"AI가 알아서 다 한다\"가 아니라 \"정해 둔 순서를 사람 없이 밟는다\"에 가깝습니다.\n\n**회수기간(payback period)** — 들인 시간을 되찾는 데 걸리는 기간. 1인 회사에서 가장 모자란 자원이 시간이라, 돈이 아니라 시간으로 셉니다."}, {"title": "⚠️ 함정", "md": "**가장 귀찮은 일부터 손댑니다.** 귀찮은 일은 대개 판단이 많이 들어가는 일이고, 판단이 많으면 검수도 무겁습니다. 순서가 정반대입니다.\n\n**\"일단 다 켜 놓고 나중에 정리하자.\"** 켜 둔 자동화는 조용히 틀린 결과를 계속 만듭니다. 안 켠 것보다 나쁘니, 한 번에 하나씩 켭니다.\n\n**검수 시간을 0으로 놓고 계산합니다.** 그러면 거의 모든 자동화가 이득으로 보이고, 실제로 손해인 것들이 여기 숨습니다.\n\n**남이 좋다는 것부터 켭니다.** 직원 열 명 회사에서 좋은 자동화가 1인 회사에서도 좋은 건 아닙니다. 기준은 검수 부담입니다."}, {"title": "🔎 더 깊이", "md": "- 이 섹션 전체는 **법률·세무 자문이 아닙니다.** 법 이야기가 나오는 곳은 \"무엇을 확인해야 하는지\"를 알려 주는 자리이고, 실제 판단이 필요하면 변호사·세무사에게 확인합니다.\n- 이번 달에 실제로 켤 다섯 개의 순서는 이 섹션 마지막 절 「이번 달에 켤 다섯」에 있습니다.\n- 절대로 자동화하면 안 되는 일 목록은 「그 밖」 절에 있습니다. 후보를 고른 뒤 그 목록과 한 번 대조합니다.\n- 검색해 볼 말 — `업무 자동화 우선순위`, `automation payback period`, `human in the loop`\n- 자동화를 예약 실행으로 걸어 두는 방법(정해진 시각에 혼자 돌게 하기)은 <a class=\"xref\" href=\"#8\">Stage 8<\/a>에서 다룹니다. 이 섹션은 «무엇을» 켜는지를 정하고, Stage 8은 «어떻게 혼자 돌게 하는지»를 다룹니다."}]}, {"file": "2-뉴스레터.md", "id": "s자동화-2", "no": "2", "title": "뉴스레터 첫 호 보내기", "goals": ["본인 도메인으로 발신 인증을 마치고 시험 메일을 받은편지함에 도착시킬 수 있다", "정보통신망법 50조의 네 규칙을 구독 폼과 메일에 적용할 수 있다", "AI가 하는 것과 사람이 남는 자리를 갈라 말할 수 있다"], "steps": ["도메인부터 확보한다", "인증 3종을 DNS에 넣는다", "정보통신망법 50조를 확인한다", "발송 서비스를 고른다", "AI와 사람의 자리를 가른다"], "through": "AI는 초안까지. 발송 버튼은 사람이 누른다. 한 번 나가면 회수 불가다.", "time": "2시간", "need": ["본인 소유 도메인", "도메인 DNS 설정 권한"], "head": "뉴스레터는 1인 회사가 가진 유일하게 남의 알고리즘을 안 타는 통로입니다. 단, 2026년 현재 대형 메일 서비스들은 인증이 안 된 발신자의 메일을 스팸함에 넣는 게 아니라 아예 거부하므로, **발신 인증이 이 섹션 전체의 1번 전제**입니다.", "secs": [{"title": "① 도메인부터 확보한다", "md": "포털 무료 메일 주소로는 **발신 인증 자체가 안 됩니다.** 인증이란 「이 도메인의 주인이 이 발송 서비스에 권한을 줬다」를 도메인 설정에 적어 두는 것입니다. 남의 도메인에는 내가 적을 수 없습니다.\n\n그래서 순서는 도메인 사기 → DNS 설정 화면에 들어갈 수 있는지 확인 → 발송 서비스 가입입니다. 도메인 없이 발송 서비스부터 가입하면 첫 화면에서 막힙니다."}, {"title": "② 인증 3종을 DNS에 넣는다", "md": "발송 서비스가 알려 주는 값을 도메인 DNS에 붙여넣는 일입니다. 어려운 건 없고, 붙여넣고 몇 분 기다리면 됩니다.\n\n| 무엇 | 하는 일 | 한 줄로 |\n|---|---|---|\n| **SPF** | 이 도메인 이름으로 메일을 보낼 수 있는 서버 목록 | \"이 사람들만 내 이름으로 보낼 수 있다\" |\n| **DKIM** | 메일에 도장(전자서명)을 찍어 도중에 안 바뀐 걸 증명 | \"이 메일은 진짜 내가 보낸 것이다\" |\n| **DMARC** | 위 둘이 실패했을 때 어떻게 처리할지 지시 | \"가짜면 버려라\" |\n| **원클릭 수신거부** | 받은 사람이 버튼 하나로 구독 해지 | 메일 프로그램이 직접 처리 |\n\n**2026년 현재, 넷 중 하나라도 없으면 메일은 스팸함이 아니라 아예 거부됩니다.** 원클릭 수신거부는 예의가 아니라 요구 조건입니다 — 해지를 어렵게 만들면 사람들이 대신 「스팸 신고」를 누르고, 신고가 쌓이면 그 도메인 전체가 막힙니다. 해지를 쉽게 만드는 게 내 도메인을 지키는 길입니다."}, {"title": "③ 정보통신망법 50조를 확인한다", "md": "한국에서 광고성 정보를 메일로 보낼 때 지켜야 하는 조문입니다. 핵심 넷입니다.\n\n| # | 규칙 | 실무에서 |\n|---|---|---|\n| 1 | **명시적 사전 동의** | 체크박스를 미리 체크해 두면 안 됩니다. 받는 사람이 직접 체크해야 합니다 |\n| 2 | **수신거부하면 전송 금지** | 해지 즉시 목록에서 빠져야 합니다. \"다음 호부터\"가 아닙니다 |\n| 3 | **21시~익일 8시는 별도 동의** | 야간 발송은 동의를 따로 받아야 합니다. 예약 시각을 낮으로 잡으면 간단히 피합니다 |\n| 4 | **표시 의무** | 전송자 이름·연락처·수신거부 방법을 본문에 적고, **제목 맨 앞에 `(광고)`** |\n\n2026-03 개정 안내서가 새로 금지한 것이 있습니다. *\"혜택 안내를 받겠습니다\"*, *\"유용한 정보를 받겠습니다\"* 같은 애매한 표현으로 광고 수신 동의를 받는 것이 금지됐습니다. 「광고」라는 말을 피해서 동의를 받으면 동의를 받은 것으로 치지 않으므로, 동의 문구에는 광고성 정보를 보낸다는 사실이 그대로 적혀 있어야 합니다.\n\n무엇이 광고인가 — 판단이 애매하면 광고로 봅니다. 새 상품 소식, 할인, 강의 모집은 명백히 광고이고, 순수한 정보 소식지라도 \"지금 신청하기\" 버튼이 하나라도 있으면 광고 쪽입니다. 애매하면 `(광고)`를 붙이는 쪽이 안전합니다 — 붙여서 손해 보는 건 열어 보는 비율이고, 안 붙여서 손해 보는 건 과태료입니다.\n\n> 이 절의 법 이야기는 **법률 자문이 아닙니다.** 실제 발송 전에 조문과 최신 안내서를 직접 확인하거나 전문가에게 묻습니다.\n\n`[확인 필요]` — 수신동의를 2년마다 다시 확인해야 하는 조문의 정확한 적용 범위. 조문 번호와 대상을 확인하지 못했습니다. 발송 서비스가 이 기능을 제공하는 경우가 많으니 가입 후 설정 화면에서 찾아봅니다."}, {"title": "④ 발송 서비스를 고른다", "md": "두 갈래이고, 시작은 국내 한글 서비스입니다.\n\n| 갈래 | 서비스 | 언제 |\n|---|---|---|\n| **국내 한글 서비스** | **스티비**, **메일리** | 화면이 한글이고, 구독 폼·수신거부·통계가 이미 들어 있습니다. `(광고)` 표기와 야간 발송 안내도 한국 법에 맞춰져 있습니다 |\n| 개발형 | **Resend**, **Mailgun** | 내가 만든 서비스가 회원가입 확인 메일 같은 걸 **스스로** 보내야 할 때. 화면이 아니라 코드로 부릅니다 |\n\n둘을 섞어 쓰는 게 정상입니다 — 사람이 읽는 소식지는 국내 서비스로, 서비스가 자동으로 뱉는 메일은 개발형으로. 다만 이번 달에 켜는 건 **국내 서비스 하나**면 충분합니다. 요금과 구독자 한도는 본문에 두지 않습니다 → <a class=\"xref\" href=\"#부록\">부록<\/a>의 「버전과 값」."}, {"title": "⑤ AI와 사람의 자리를 가른다", "md": "| AI가 하는 것 | 사람이 남는 자리 |\n|---|---|\n| 초안 쓰기 | **발송 버튼** |\n| 제목 후보 여러 개 뽑기 | 사실관계 확인 — 날짜·가격·이름이 맞나 |\n| 긴 글을 소식지 길이로 줄이기 | **링크를 실제로 클릭해 보기** |\n| 대상별로 문장 바꾸기(신규 구독자용 / 기존 구독자용) | 이름 치환이 제대로 됐나 — `{{이름}}` 이 그대로 나가지 않았나 |\n\n**발송 버튼은 사람이 누릅니다. 예외 없습니다.** 한 번 나가면 회수 불가입니다 — 웹페이지는 고치면 되고 SNS는 지우면 되지만, 메일은 이미 상대 받은편지함에 있습니다.\n\n자주 나가는 사고는 셋입니다. `안녕하세요 {{이름}}님`이 그대로 나감(치환 변수 이름을 틀렸을 때), 링크가 초안 주소로 나감(복사해 온 링크를 안 고쳤을 때), 지난 호 제목이 그대로 나감(복제해서 만들고 제목을 안 바꿨을 때). 셋 다 본인에게 시험 발송 한 통이면 잡히므로, 시험 발송이 자동화의 예외 자리입니다."}, {"title": "⚡ 따라 하기", "md": "**도메인과 인증** — 한 번만 합니다.\n\n1. 도메인을 사고 DNS 설정 화면에 들어가 보세요. 인증 값을 여기 붙여넣을 것이라, 들어가지지 않으면 뒤가 전부 막힙니다.\n2. 발송 서비스에 가입하고 「발신 도메인 인증」 메뉴를 여세요. 화면에 SPF·DKIM·DMARC 세 값이 나옵니다.\n3. 그 값을 DNS에 그대로 붙여넣으세요. DNS는 퍼지는 데 시간이 걸리니, 화면에 「인증 완료」가 뜰 때까지 보내지 마세요.\n4. 내 주소로 시험 발송 한 통을 보내세요. 스팸함이 아니라 받은편지함에 도착하면 인증이 끝난 것입니다.\n\n**최소 루프** — 구독 폼 → 환영 메일 → 정기 발송.\n\n5. 구독 폼을 하나 만들고 동의 문구를 아래 형태로 적으세요. 「광고성 정보」라는 말이 그대로 들어가야 동의로 칩니다.\n\n```\n[ ] (필수) 광고성 정보 수신에 동의합니다.\n    ○○○(회사명)이 새 소식·강의 모집·할인 안내 등 광고성 정보를\n    이메일로 보내는 것에 동의합니다.\n    언제든지 메일 하단의 수신거부 버튼으로 해지할 수 있습니다.\n```\n\n체크박스는 미리 체크해 두지 않습니다.\n\n6. 환영 메일 한 통을 만들어 「구독 즉시 발송」으로 걸어 두세요. 직접 구독해 보면 환영 메일이 와야 합니다 — 여기까지가 자동입니다.\n7. 정기 발송은 월 2회로 잡으세요. 주 1회는 1인 회사가 못 지킵니다.\n\n**초안을 AI에게 시킬 때** — 아래를 붙여넣고 재료를 이어서 적으세요. 제목 후보 다섯과 숫자 자리가 비워진 본문이 돌아와야 합니다.\n\n```\n아래 재료로 이번 달 뉴스레터 초안을 써 줘.\n\n조건:\n- 제목 후보 5개를 먼저 주고, 각 후보 옆에 왜 그 제목인지 한 줄.\n- 제목에는 (광고) 표기가 들어갈 자리를 비워 둬. 내가 붙인다.\n- 본문은 소식 3개 이하. 각 소식은 3~5문장.\n- 맨 아래에 전송자 이름·연락처·수신거부 안내가 들어갈 자리를 표시해 둬.\n- 날짜·가격·인원 같은 숫자는 내가 준 재료에 있는 것만 써라.\n  재료에 없는 숫자는 절대 만들지 말고 [숫자 확인 필요]로 비워 둬.\n- 링크도 마찬가지다. 내가 준 링크만 써라.\n\n[여기에 재료를 붙여넣습니다]\n```\n\n**발송 전 사람이 하는 4줄 점검** — 넷을 다 통과한 뒤에 사람이 발송 버튼을 누르세요.\n\n```\n□ 시험 발송을 내 주소로 보냈고, 받은편지함(스팸함 아님)에 도착했다\n□ 본문의 링크를 전부 클릭해 봤고, 전부 의도한 곳으로 갔다\n□ 이름 치환이 실제 이름으로 바뀌어 보인다 ({{ }} 가 안 보인다)\n□ 제목에 (광고), 하단에 전송자 정보와 수신거부가 있다\n```"}, {"title": "✅ 확인", "md": "- [ ] 발송 서비스 화면에 「발신 도메인 인증 완료」가 보이고, 내 주소로 보낸 시험 메일이 스팸함이 아니라 받은편지함에 있나\n- [ ] 구독 폼의 동의 문구에 「광고성 정보」라는 말이 그대로 들어 있나\n- [ ] 새로 구독하면 환영 메일이 자동으로 오나(직접 구독해 보고 확인)\n- [ ] 메일 하단의 수신거부 버튼을 눌러 실제로 해지가 되나"}, {"title": "📘 말 풀이", "md": "**DNS** — 도메인 이름을 실제 서버 주소로 바꿔 주는 인터넷 전화번호부. 여기에 인증 값(SPF·DKIM·DMARC)을 적어 두면, 받는 쪽 메일 서버가 그걸 읽어 진짜 발신자인지 확인합니다.\n\n**치환 변수(merge tag)** — `{{이름}}`처럼 발송할 때 사람마다 다른 값으로 바뀌는 자리표. 이름을 틀리면 안 바뀌고 글자 그대로 나갑니다.\n\n**시험 발송(test send)** — 구독자 목록이 아니라 내 주소로만 한 통 보내 보는 것. 실제 발송과 똑같은 처리를 거치므로 치환·링크 오류가 그대로 드러납니다."}, {"title": "⚠️ 함정", "md": "**포털 메일 주소로 시작합니다.** 가입은 되는데 인증에서 막힙니다. 도메인이 먼저입니다.\n\n**인증 값을 넣고 바로 보냅니다.** DNS는 퍼지는 데 시간이 걸립니다. 발송 서비스 화면에 「인증됨」이 뜬 뒤에 보냅니다.\n\n**명함 받은 사람을 목록에 넣습니다.** 명함을 준 것은 광고 수신 동의가 아닙니다. 구독 폼을 통해 본인이 직접 신청한 사람만 목록에 넣습니다.\n\n**밤에 예약을 걸어 둡니다.** 21시~익일 8시는 별도 동의가 필요합니다. 낮 시각으로 잡으면 이 문제 자체가 없어집니다.\n\n**제목에서 `(광고)`를 뺍니다.** \"열어 보는 비율이 떨어져서\" 빼는 경우가 많은데, 표시 의무 위반입니다.\n\n**수신거부 링크를 작게 숨깁니다.** 스팸 신고로 이어지고, 스팸 신고는 도메인 평판을 깎습니다.\n\n**AI 초안을 그대로 보냅니다.** 초안에는 없는 날짜와 없는 혜택이 섞여 들어옵니다. 광고 표시 문제 이전에 사실관계 문제입니다."}, {"title": "🔎 더 깊이", "md": "- 인증 값과 요금·구독자 한도는 본문에 두지 않습니다 → <a class=\"xref\" href=\"#부록\">부록<\/a>의 「버전과 값」\n- 광고 표기·개인정보 처리방침 같은 법정 고지 문구는 AI에게 생성시키지 않습니다. 이유는 「그 밖」 절의 «자동화하면 안 되는 것»에 있습니다.\n- 검색해 볼 말 — `SPF DKIM DMARC 설정`, `정보통신망법 제50조`, `원클릭 수신거부`, `이메일 발신자 인증 요구사항`\n- 구독자 정보를 어디에 어떻게 보관해야 하는지는 <a class=\"xref\" href=\"#부록\">부록<\/a>의 「법무·세무」에서 다룹니다.\n- 관통 프로젝트(뉴스레터 서비스)를 직접 만드는 쪽은 <a class=\"xref\" href=\"#6\">Stage 6<\/a>입니다. 이 절은 만들지 않고 가입해서 오늘 켜는 쪽입니다."}]}, {"file": "3-커뮤니티.md", "id": "s자동화-3", "no": "3", "title": "커뮤니티 채널 하나 켜기", "goals": ["사람이 있는 채널과 자동화되는 채널을 갈라 하나를 고를 수 있다", "봇이 맡는 잡일과 사람이 맡는 첫 접촉을 표로 나눌 수 있다", "비공식 봇을 왜 쓰지 않는지 말할 수 있다"], "steps": ["채널을 표로 가른다", "비공식 봇을 거른다", "1%를 목표로 잡는다", "봇과 사람의 경계를 긋는다"], "through": "봇은 잡일을 맡고, 첫 접촉은 사람이 한다.", "time": "1시간 30분", "need": [], "head": "커뮤니티는 1인 회사의 고객 목록이자 피드백 창구이자 영업 통로입니다. 그런데 한국에서는 **사람이 가장 많이 있는 곳이 자동화가 가장 안 되는 곳**이라, 이 선택을 먼저 하지 않으면 잡일을 손으로 하다가 지쳐서 닫게 됩니다.", "secs": [{"title": "① 채널을 표로 가른다", "md": "| 채널 | 사람이 있나 | 자동화가 되나 | 실제로 |\n|---|---|---|---|\n| **카카오 오픈채팅** | ⭐ **가장 많음.** 진입 문턱이 가장 낮습니다 | ⭐ **봇 API 공식 미지원.** 키워드 자동 응답 정도 | 사람은 오는데, 손이 계속 갑니다 |\n| **디스코드** | 그다음. 가입을 한 번 넘어야 합니다 | ⭐ **가장 강력** — 환영 인사·역할 부여·금칙어 처리·예약 공지가 기본 기능 | 자동화는 되는데, 사람을 데려오는 데 힘이 듭니다 |\n| **네이버 카페** | 검색으로 새 사람이 흘러 들어옵니다 | 사실상 없음 | 유입은 좋고, 운영은 전부 손입니다 |\n\n추천 — **디스코드 하나로 시작합니다.** 자동화가 되니까 1인이 감당할 수 있고, 잡일이 줄면 남는 시간을 사람과 대화하는 데 쓸 수 있습니다. 사람 수는 적게 시작하되 오래 갑니다.\n\n대안 — 이미 카카오 오픈채팅에 사람이 모여 있다면 거기를 두고 옮기지 않습니다. 대신 자동화를 포기하고 «공지는 정해진 시각에 손으로 붙인다» 같은 규칙만 만듭니다. 사람이 있는 곳을 버리고 자동화되는 곳으로 옮기는 건 대개 손해입니다."}, {"title": "② 비공식 봇을 거른다", "md": "카카오 오픈채팅에 봇을 붙여 준다는 비공식 도구들이 돌아다닙니다. **쓰지 않습니다.**\n\n- **약관 위반**입니다. 공식으로 열어 준 길이 아닙니다.\n- 걸리면 **계정 정지 책임이 본인에게** 옵니다. 도구 만든 사람이 책임지지 않습니다.\n- 대개 **내 계정의 로그인 정보를 넘겨야** 돌아갑니다. 그 자체가 위험합니다.\n\n> **법인 대표 계정으로 시도할 성질의 것이 아닙니다.**\n> 정지된 계정 하나에 고객 연락처와 상담 내역이 통째로 들어 있으면, 아낀 시간과 비교가 안 됩니다.\n\n공식으로 지원되는 자동화만 씁니다. 카카오 쪽에서 공식으로 열려 있는 자동 응답 통로는 오픈채팅이 아니라 카카오톡 채널 챗봇 쪽이고, 그건 「CS 봇」 절에서 다룹니다."}, {"title": "③ 1%를 목표로 잡는다", "md": "가입자 수가 늘어도 커뮤니티는 죽습니다. 죽는 이유는 참여가 없어서입니다.\n\n| 비율 | 무엇을 하나 |\n|---|---|\n| **90%** | 눈팅만 합니다. 읽고 나갑니다 |\n| **9%** | 가끔 반응합니다. 이모지, 짧은 한 줄 |\n| **1%** | ⭐ **대화를 굴립니다.** 질문하고, 답하고, 분위기를 만듭니다 |\n\n**커뮤니티를 살리는 건 90%가 아니라 그 1%입니다.** 가입자를 100명에서 1000명으로 늘려도 1%가 안 생기면 조용한 방 하나가 열 배 커질 뿐입니다. 그래서 목표는 «사람을 모은다»가 아니라 «그 1%를 만든다»입니다."}, {"title": "④ 봇과 사람의 경계를 긋는다", "md": "| 봇이 맡는 것(잡일) | 사람이 맡는 것 |\n|---|---|\n| 규칙 안내문 붙여 두기 | **새 사람에게 건네는 첫마디** |\n| 역할·권한 자동 부여 | 질문에 대한 답 |\n| 금칙어·스팸 링크 자동 삭제 | 갈등 중재 |\n| 정해진 시각 공지 예약 | 누구를 1%로 끌어올릴지 알아보는 눈 |\n| 반복 질문에 링크 걸어 주기 | 감사 인사, 축하, 사과 |\n\n**자동 환영 메시지가 첫 인사를 대신하면, 그 1%는 생기지 않습니다.** 「○○님 환영합니다! 규칙은 여기서 확인하세요」가 자동으로 뜨는 건 안내문이라 좋습니다. 하지만 그걸로 끝나면 새 사람 입장에서는 아무도 나를 못 본 것입니다.\n\n그래서 봇은 규칙·링크·역할 같은 정보를 자동으로 주고, 사람은 하루 안에 이름을 부르며 한 줄을 남깁니다. \"어떤 일 하시는지 궁금하네요\" 한 줄이면 충분하고, 이 한 줄은 자동화하면 티가 나서 1%가 안 생깁니다. 하루에 한두 명이면 손으로 감당되고, 감당 안 될 만큼 커지면 그때는 사람을 쓸 수 있는 규모입니다."}, {"title": "⚡ 따라 하기", "md": "1. 채널 하나를 고르세요 — ①의 추천 또는 대안. 오늘 고르고 안 바꿔야 나머지 단계가 한곳에 쌓입니다.\n2. 디스코드라면 서버 하나를 만들고 방은 `공지` / `자유` / `질문` 셋만 두세요. 사람 열 명에 방 열 개면 모든 방이 비어 보입니다.\n3. 규칙 안내를 `공지`에 세 줄로 고정하세요. 아래 지시문을 붙여넣으면 규칙 세 줄과 환영 문구 두 줄이 따로 돌아옵니다.\n\n```\n커뮤니티 규칙 안내문을 세 줄로 써 줘.\n\n조건:\n- 금지 사항을 나열하지 말고, 이 방에서 무엇을 하면 좋은지 중심으로.\n- 세 줄을 넘기지 마라. 읽는 데 10초를 넘기면 안 된다.\n- 딱딱한 공지체 말고 사람이 말하듯이.\n- 우리 커뮤니티는 이런 곳이다: [여기에 한 줄로 적습니다]\n\n그다음, 자동 환영 메시지 문구를 따로 써 줘.\n조건: 두 줄. 규칙 링크를 가리키되, \"반갑습니다\" 같은 인사로 끝내지 마라.\n인사는 내가 직접 할 거니까, 봇 메시지는 안내만 해라.\n```\n\n4. 자동 역할 부여를 켜세요 — 규칙에 동의를 누르면 방이 보이는 방식. 새 사람이 들어오면 규칙 안내가 자동으로 떠야 합니다.\n5. 금칙어·초대링크 자동 삭제를 켜고, 주간 공지를 정해진 요일·시각으로 예약하세요. 여기까지가 봇이고, 나머지는 손으로 합니다.\n6. 사람이 하는 루틴을 아래처럼 적어 두세요. 자동 환영 메시지와 별개로, 이름을 부른 한 줄이 방에 남아 있어야 합니다.\n\n```\n매일 (5분)\n□ 어제 들어온 사람 이름을 부르며 한 줄 남긴다 (자동 환영 메시지와 별개로)\n□ 답 없는 질문이 있으면 답하거나, 최소한 \"확인 중\"이라고 남긴다\n\n매주 (10분)\n□ 질문 하나를 던지는 글을 올린다 (공지가 아니라 질문)\n□ 이번 주에 말을 두 번 이상 한 사람 이름을 적어 둔다 → 이들이 1% 후보다\n```\n\n7. 반복 질문이 세 번 나오면 그때 자동화하세요. 두 번까지는 손으로 답하고, 세 번째에 「자주 묻는 질문」에 넣고 봇이 링크를 걸게 합니다 — 미리 만들면 아무도 안 보는 문서가 됩니다."}, {"title": "✅ 확인", "md": "- [ ] 채널을 하나로 정했고, 나머지는 열지 않았나\n- [ ] 새 사람이 들어오면 규칙 안내가 자동으로 뜨고, 그와 별개로 어제 들어온 사람에게 내가 손으로 한 줄을 남겼나\n- [ ] 비공식 봇을 하나도 설치하지 않았나\n- [ ] 이번 주에 말을 두 번 이상 한 사람의 이름을 댈 수 있나"}, {"title": "📘 말 풀이", "md": "**봇(bot)** — 사람 대신 정해진 반응을 하는 프로그램. 커뮤니티에서는 대개 «이 조건이면 이 메시지를 보낸다» 수준의 단순한 규칙 뭉치입니다.\n\n**모더레이션(moderation)** — 욕설·스팸·광고 글을 걸러 내고 규칙을 지키게 하는 일. 금칙어 목록처럼 기계가 할 수 있는 부분과, 갈등 중재처럼 사람만 할 수 있는 부분이 섞여 있습니다.\n\n**역할(role)** — 커뮤니티 안에서 누가 어느 방을 볼 수 있고 무엇을 할 수 있는지 나눠 놓은 꼬리표. 「구독자」 역할을 가진 사람만 들어오는 방을 만드는 식으로 씁니다."}, {"title": "⚠️ 함정", "md": "**채널을 세 개 동시에 엽니다.** 오픈채팅·디스코드·카페를 다 열면 셋 다 조용해집니다. 하나부터.\n\n**비공식 봇을 설치합니다.** 약관 위반이고 정지 책임이 본인에게 옵니다. ②에서 이미 말했지만 가장 자주 벌어집니다.\n\n**환영 메시지를 길게 씁니다.** 길수록 안 읽습니다. 규칙은 세 줄, 나머지는 링크로.\n\n**모든 반응을 봇으로 만듭니다.** 사람이 쓴 글에 봇만 답하면 그 방은 사람이 없는 방으로 보입니다.\n\n**공지만 올립니다.** 소식만 흐르는 방은 게시판이지 커뮤니티가 아닙니다. 질문을 던지는 글이 1%를 만듭니다."}, {"title": "🔎 더 깊이", "md": "- 고객 문의에 자동으로 답하는 것은 커뮤니티 운영과 다른 일입니다 → 「CS 봇」 절. 가격·환불 질문이 커뮤니티에 올라오면 그건 CS입니다.\n- 커뮤니티에서 나온 질문을 모아 두면 뉴스레터 소재와 블로그 소재가 됩니다 → 「블로그 관리」 절\n- 검색해 볼 말 — `디스코드 서버 세팅`, `커뮤니티 1% 법칙`, `카카오 오픈채팅 봇 정책`\n- 커뮤니티 글에서 나온 지식을 모아 두는 방법은 <a class=\"xref\" href=\"#9\">Stage 9<\/a>에서 다룹니다."}]}, {"file": "4-블로그.md", "id": "s자동화-4", "no": "4", "title": "블로그 발행과 점검 자동화", "goals": ["자동 발행이 되는 플랫폼을 알고 발행 자리를 하나로 정할 수 있다", "«AI가 썼는지»와 «무검수 대량 발행» 중 무엇이 위반인지 말할 수 있다", "색인 요청과 발행 후 점검을 자동으로 걸 수 있다"], "steps": ["발행 자리를 정한다", "위반의 선을 긋는다", "색인 요청을 자동으로 건다", "발행 후 점검을 켠다"], "through": "AI로 글을 쓰는 것 자체는 문제가 아니다. 사람이 안 보고 대량으로 내보내는 것이 문제다.", "time": "2시간", "need": ["본인 소유 도메인"], "head": "블로그는 잠들어 있는 동안에도 새 사람을 데려오는 유일한 채널입니다. 그래서 자동화 유혹이 가장 큰 곳이고, \"AI로 하루 열 개씩 찍어내면 되지 않나\"라는 생각이 **사이트를 통째로 검색에서 지워 버리는** 곳이기도 합니다.", "secs": [{"title": "① 발행 자리를 정한다", "md": "「글이 자동으로 올라가게」 하려면 플랫폼이 그 통로를 열어 줘야 합니다.\n\n| 플랫폼 | 자동 발행 | 실제로 |\n|---|---|---|\n| **워드프레스** | ⭐ **가능** | 온전히 자동화되는 **유일한 곳**입니다. 발행·수정·태그·예약이 다 됩니다 |\n| **티스토리** | ❌ **불가** | 외부에서 글을 올리던 공식 통로가 종료됐습니다 |\n| **네이버 블로그** | ❌ 사실상 불가 | 개인이 쓸 수 있는 자동 발행 통로가 열려 있지 않습니다 |\n\n추천 — **본인 도메인 + 워드프레스.** 자동화가 되고, 무엇보다 내 도메인에 글이 쌓입니다. 플랫폼이 문을 닫아도 글은 내 것으로 남고, 뉴스레터에서 산 도메인을 그대로 씁니다.\n\n대안 — 네이버 블로그를 계속 쓰되 자동 발행을 포기합니다. 국내 검색 유입이 크게 중요한 업종이면 이쪽이 맞고, 이 절의 자동화 중 「발행」만 빼고 나머지(점검·목록 산출)는 그대로 씁니다.\n\n`[확인 필요]` — 네이버 블로그의 공식 API 존재 여부. 개인이 글을 외부에서 자동 발행할 수 있는 공식 통로가 현재 열려 있는지 확인하지 못했습니다. 네이버 개발자센터에서 직접 확인합니다."}, {"title": "② 위반의 선을 긋는다", "md": "가장 많이 잘못 알려진 부분입니다.\n\n> **«AI가 썼는지»는 기준이 아닙니다.**\n> 위반은 **순위를 조작할 목적으로, 사용자에게 가치 없는 글을 대량 발행하는 것**입니다.\n\n| 이건 위반이 아니다 | 이건 위반이다 |\n|---|---|\n| AI로 초안을 쓰고 사람이 고쳐서 발행 | 검색 키워드만 바꿔 가며 비슷한 글을 대량 발행 |\n| AI로 자료를 정리해 글을 만듦 | 사람이 한 번도 안 읽은 글을 자동으로 올림 |\n| AI로 제목·목차 후보를 뽑음 | 순위를 올리려고 같은 내용을 여러 각도로 복제 |\n\n읽는 사람에게 쓸모가 있으면 도구가 무엇이었는지는 문제가 아니고, 쓸모가 없으면 사람이 썼어도 문제입니다. 1인 회사의 결론은 하나입니다 — AI를 마음껏 쓰되, 발행 전에 사람이 100% 읽습니다. 그러면 하루 열 개가 아니라 주 한 개가 되는데 그게 맞는 속도이고, 검수 없이 열 개를 올리는 건 사이트를 걸고 하는 도박입니다.\n\n`[확인 필요]` — 네이버의 AI 콘텐츠 정책 공식 문서. 네이버가 AI 생성 글을 어떻게 다루는지에 대한 공식 문서를 확인하지 못했습니다. 네이버 검색 도구(서치어드바이저)의 안내 문서를 직접 확인합니다.\n\n`[확인 필요]` — AI 기본법의 표시 의무가 개인 블로그 글에도 적용되는지. 의무를 지는 「이용사업자」의 범위가 아직 모호하고 계도기간 중입니다. 걱정된다면 글 하단에 «이 글은 AI 도움을 받아 작성했습니다» 한 줄을 붙이는 쪽이 안전합니다. 붙여서 잃는 것은 없습니다."}, {"title": "③ 색인 요청을 자동으로 건다", "md": "글을 올려도 검색엔진이 모르면 없는 글이고, 알아채기까지 며칠에서 몇 주가 걸립니다. «내가 방금 글을 올렸다»고 즉시 알리는 방식이 **IndexNow**이고, 네이버 검색 도구가 이 방식을 공식 지원합니다.\n\n발행 → 자동으로 색인 요청 발송 → 검색엔진이 빨리 와서 읽어 감. 한 번 연결해 두면 사람 손이 전혀 안 갑니다. 이 섹션에서 드문 순이익 자동화인데, 색인 요청이 잘못 나가도 되돌릴 게 없어 검수할 게 없기 때문입니다."}, {"title": "④ 발행 후 점검을 켠다", "md": "발행 자체보다 이쪽이 1인 회사에 더 남습니다. 전부 검수가 가벼운 일들입니다.\n\n| 무엇 | 주기 | 결과물 |\n|---|---|---|\n| **색인 여부 점검** | 주 1회 | \"지난주에 올린 3개 중 2개가 아직 색인 안 됨\" 목록 |\n| **깨진 링크 스캔** | 주 1회 | 404가 난 링크 목록과 그게 있는 글 주소 |\n| **6개월 지난 글 목록 산출** | 월 1회 | 오래돼서 내용이 틀렸을 수 있는 글 목록 |\n\n세 가지 모두 목록을 내놓는 데서 멈춥니다. **갱신할지는 사람이 판단합니다.** 6개월 지난 글을 자동으로 다시 쓰게 하면 「무검수 대량 발행」과 같은 자리로 굴러떨어지므로, 자동화는 \"이 글들을 봐야 한다\"까지만 하고 \"이 글을 이렇게 고친다\"는 사람이 합니다."}, {"title": "⚡ 따라 하기", "md": "1. 발행 자리를 정하세요 — 워드프레스면 자동 발행까지, 네이버 블로그면 발행은 손으로. 한곳이라야 점검 목록도 한곳에서 나옵니다.\n2. 네이버 검색 도구에 사이트를 등록하고 소유 확인을 마치세요. 색인 요청을 받을 쪽이 먼저 내 사이트를 알아야 합니다.\n3. IndexNow 연동을 켜세요. 워드프레스면 플러그인 하나로 끝나고, 시험 삼아 글 하나를 발행하면 도구 화면에 색인 요청이 나간 기록이 보여야 합니다.\n4. 발행 전 사람 검수 4줄을 적어 두고, 발행할 때마다 보세요. 마지막 한 줄이 안 나오면 발행하지 않습니다 — 그게 「가치 없는 글」의 정의입니다.\n\n```\n□ 처음부터 끝까지 읽었다 (훑은 게 아니라 읽었다)\n□ 숫자·날짜·이름을 하나씩 확인했다\n□ 링크를 전부 클릭했다\n□ 이 글을 읽고 독자가 뭘 얻는지 한 문장으로 말할 수 있다\n```\n\n5. 초안은 아래 지시문으로 시키세요. 첫 문단에 독자가 얻는 것이 적히고, 끝에 사람이 확인할 목록이 붙어 돌아와야 합니다.\n\n```\n아래 주제로 블로그 글 초안을 써 줘.\n\n조건:\n- 이 글을 읽는 사람이 무엇을 얻는지 첫 문단에서 분명히.\n- 내가 준 자료에 없는 사실·숫자·날짜는 절대 만들지 마라.\n  필요하면 [확인 필요]로 비워 두고, 무엇을 확인해야 하는지 적어라.\n- 검색 키워드를 억지로 반복하지 마라. 사람이 읽는 글로 써라.\n- 비슷한 내용을 각도만 바꿔 늘리지 마라. 짧아도 된다.\n- 마지막에 \"이 글에서 사람이 반드시 확인해야 할 것\" 목록을 따로 뽑아 줘.\n\n주제: [여기]\n자료: [여기]\n```\n\n6. 발행 후 점검을 예약으로 걸어 두세요. 매주 월요일에 목록 세 개만 돌아오고, 아무것도 자동으로 고쳐지지 않아야 합니다.\n\n```\n매주 월요일에 아래를 확인해서 목록만 만들어 줘. 고치지는 마라.\n\n1. 지난 2주에 발행한 글 중 아직 검색에 색인되지 않은 것\n2. 내 사이트 글 안의 링크 중 404가 나는 것 (글 주소와 함께)\n3. 발행일이 6개월을 넘긴 글 (제목과 발행일만)\n\n각 목록은 5개를 넘기면 \"외 N건\"으로 줄여라.\n무엇을 고칠지는 제안하지 말고, 목록만 줘. 판단은 내가 한다.\n```"}, {"title": "✅ 확인", "md": "- [ ] 글을 올릴 자리가 하나로 정해졌나(워드프레스인가, 네이버 블로그인가)\n- [ ] 글을 발행하면 색인 요청이 자동으로 나가나(검색 도구 화면에서 확인)\n- [ ] 이번 주 점검 결과 목록이 손에 들어왔고, 무엇을 고칠지는 내가 정했나(자동으로 고쳐지지 않았나)\n- [ ] «AI가 썼는지»와 «무검수 대량 발행» 중 무엇이 위반인지 한 문장으로 말할 수 있나"}, {"title": "📘 말 풀이", "md": "**색인(indexing)** — 검색엔진이 내 글을 읽어서 자기 목록에 넣는 것. 색인이 안 되면 아무리 잘 쓴 글도 검색 결과에 나오지 않습니다.\n\n**IndexNow** — \"방금 이 주소에 글이 올라왔다\"를 검색엔진에 즉시 알려 주는 방식. 검색엔진이 찾아올 때까지 기다리지 않고 내 쪽에서 먼저 알립니다.\n\n**404** — 그 주소에 아무것도 없다는 뜻의 오류 번호. 링크를 걸어 둔 상대 페이지가 사라지면 내 글 안의 링크가 404가 됩니다."}, {"title": "⚠️ 함정", "md": "**\"AI가 쓰면 구글이 벌준다\"고 믿고 아예 안 씁니다.** 아닙니다. 무검수 대량 발행이 문제이고, 도구는 마음껏 씁니다.\n\n**\"AI가 쓴 게 아니라고 하면 된다\"고 믿습니다.** 이것도 아닙니다. 감추는 게 아니라 읽을 만하게 만드는 것이 기준입니다.\n\n**티스토리에 자동 발행을 붙이려고 시간을 씁니다.** 공식 통로가 종료됐습니다. 되는 길을 찾는 데 며칠을 씁니다.\n\n**발행 자동화만 켜고 발행 후 점검은 안 합니다.** 이득이 더 큰 쪽을 빠뜨리는 겁니다. 6개월 지난 글을 자동으로 다시 쓰게 하는 것도 마찬가지로 목록까지만입니다.\n\n**키워드만 바꿔 비슷한 글 여러 개를 만듭니다.** 가장 흔한 위반 형태입니다. 한 주제는 한 글로.\n\n**남의 글을 AI로 «재구성»해서 올립니다.** 저작권 문제가 검색 정책 문제보다 먼저 옵니다."}, {"title": "🔎 더 깊이", "md": "- 블로그에서 쓴 글은 뉴스레터 소재로 다시 씁니다 → 「뉴스레터 보내기」 절. 한 번 쓴 것을 두 곳에 쓰는 게 1인 회사의 기본입니다.\n- SNS 재활용·경쟁사 키워드 모니터링은 다음다음 절 「그 밖」의 «중» 칸에 있습니다.\n- 검색해 볼 말 — `IndexNow 네이버`, `구글 스팸 정책 AI 생성 콘텐츠`, `워드프레스 REST API 글 발행`\n- 사이트 자체를 만드는 쪽(도메인 연결·배포)은 <a class=\"xref\" href=\"#7\">Stage 7<\/a>입니다.\n- 글을 자동으로 «예약 실행»으로 돌리는 방법은 <a class=\"xref\" href=\"#8\">Stage 8<\/a>에서 다룹니다."}]}, {"file": "5-CS봇.md", "id": "s자동화-5", "no": "5", "title": "CS 봇 — 봇이 말한 가격에 회사가 책임진다", "goals": ["근거가 있을 때만 답하고 없으면 사람에게 넘기게 만들 수 있다", "봇이 말한 가격에 회사가 책임진다는 것을 안다"], "steps": ["흐름", "왜 이렇게까지 하나", "안전장치 여섯", "도구", "개인정보"], "through": "근거가 있을 때만 답한다. 없으면 사람에게 넘긴다.", "time": "3시간", "need": ["FAQ·약관·가격표 문서"], "head": "문의 응대는 1인 회사에서 가장 많이 반복되고, 가장 자주 밤에 옵니다.\n\"영업시간이 어떻게 되나요\", \"이거 어디서 신청하나요\" 같은 질문에 하루 몇 번씩 답하다 보면 다른 일이 안 됩니다.\n\n그래서 CS 봇은 켜는 게 맞습니다. **다만 이 섹션에서 가장 위험한 자동화이기도 합니다.**\n\n> ⭐ **회사는 자기 채널에서 챗봇이 말한 가격·정책에 «법적 책임»을 집니다.**\n\n이 절은 봇을 켜지 말라는 절이 아니라, **켜되 회사가 다치지 않는 모양으로 켜는** 절입니다.\n설계가 반이고, 설계는 아래 흐름도 한 장이면 끝납니다.\n\n> 이 절의 법 이야기는 **법률 자문이 아닙니다.** 실제 분쟁이나 계약 문제는 변호사에게 확인합니다.", "secs": [{"title": "① 흐름 — 이 모양을 벗어나지 않습니다", "md": "```\nFAQ·약관·가격표 문서\n  → 근거가 있을 때만 답변\n  → 근거 없음 / 확신 낮음 / 환불·가격·계약 키워드 → 즉시 사람에게\n  → 대화 전문 + 근거 문서를 함께 넘김\n```\n\n네 줄을 풀면 이렇습니다.\n\n**1) 근거는 문서에서만 온다.**\n봇이 참고할 문서를 내가 정해 줍니다. FAQ, 약관, 가격표. 그 밖의 지식으로 답하지 않게 합니다.\n\n**2) 근거가 있을 때만 답한다.**\n문서에서 답을 못 찾으면 «지어내는 것»이 아니라 «모른다고 말하는 것»이 정답입니다.\n\n**3) 세 가지 조건 중 하나라도 걸리면 즉시 사람에게.**\n근거를 못 찾았거나, 찾긴 했는데 애매하거나, **환불·가격·계약 같은 말이 나왔거나.**\n셋째가 특히 중요합니다. 근거가 있어 보여도 이 단어가 나오면 넘깁니다.\n\n**4) 넘길 때 대화 전문과 근거 문서를 같이 넘긴다.**\n사람이 이어받았을 때 \"무슨 얘기였죠?\"부터 다시 시작하면 고객은 두 번 설명해야 합니다.\n넘기는 것은 사람이 아니라 **맥락**입니다."}, {"title": "② ⭐ 왜 이렇게까지 하나 — 실제로 벌어진 일", "md": "**항공사 챗봇 사건 (2024)**\n\n항공사 챗봇이 **실제로는 존재하지 않는 할인 정책**을 만들어 고객에게 안내했습니다.\n고객은 그 안내를 믿고 결정했고, 나중에 그런 정책이 없다는 걸 알게 됐습니다.\n\n회사는 이렇게 주장했습니다.\n\n> *\"챗봇은 별개의 법인이다.\"*\n\n심판부는 이 주장을 **배척**했습니다. 판단은 이랬습니다.\n\n> *\"챗봇은 웹사이트의 일부일 뿐이다. 정적 페이지든 챗봇이든 차이가 없다.\"*\n\n그리고 **회사에 배상을 명령했습니다.**\n\n**개발 도구 회사 사건 (2025)**\n\n한 개발 도구 회사의 지원 봇이 **없는 정책**을 만들어 여러 사용자에게 퍼뜨렸습니다.\n사용자들이 그 정책을 사실로 받아들이고 구독을 해지하는 일이 벌어졌고, 회사는 **공개 사과**했습니다.\n\n**여기서 남는 한 줄**\n\n> 봇이 한 말은 «봇이 한 말»이 아니라 **«회사가 한 말»**입니다.\n> 웹사이트에 잘못 적어 놓은 가격에 책임을 지듯이, 봇이 잘못 말한 가격에도 책임을 집니다.\n\n1인 법인 대표에게 이 말은 이렇게 번역됩니다 — **봇이 만든 약속을 내가 지켜야 합니다.**\n그래서 봇에게 약속할 권한을 주지 않는 것이 유일한 방어입니다."}, {"title": "③ 안전장치 여섯", "md": "| # | 무엇 | 어떻게 |\n|---|---|---|\n| ① | **모르면 모른다고** | \"제가 확인할 수 없는 내용입니다. 담당자에게 연결해 드릴게요.\" 추측 금지 |\n| ② | ⭐ **가격·환불·계약·기한은 확정 답변 금지** | 안내는 하되 «확정»하지 않습니다. \"요금표는 여기 있습니다\"는 되고, \"고객님은 환불 대상입니다\"는 안 됩니다 |\n| ③ | **출처 표시** | 답변 끝에 \"출처: 이용약관 ○조\" 처럼. 근거 없는 답을 걸러 내는 데도 씁니다 |\n| ④ | **항상 「사람과 대화하기」 버튼** | 대화 어느 단계에서도 사람에게 갈 수 있어야 합니다. 숨기면 안 됩니다 |\n| ⑤ | **주 1회 로그 점검** | 지난주 대화를 훑습니다. 틀린 답 하나를 못 찾으면 그건 안 본 것입니다 |\n| ⑥ | **고지 문구** | *\"AI 답변은 참고용이며, 확정 안내는 담당자가 드립니다.\"* 상담창 첫 화면에 |\n\n②가 이 여섯의 중심입니다. 앞의 두 사건 모두 **봇이 「확정」을 해 버려서** 벌어졌습니다.\n정보를 주는 것과 확정하는 것은 다릅니다. **봇은 안내하고, 확정은 사람이 합니다.**\n\n⑤는 귀찮아서 가장 먼저 빠지는 항목인데, **빠지면 나머지 다섯이 무너진 걸 모릅니다.** 주 1회 10분입니다."}, {"title": "④ 도구", "md": "| 도구 | 언제 |\n|---|---|\n| **카카오톡 채널 챗봇** | 국내 고객이 실제로 있는 곳. 채널과 챗봇 기본 사용이 무료입니다. 대부분 여기서 시작합니다 |\n| **채널톡** | 웹사이트에 상담창을 띄우는 방식. 상담 이력 관리가 함께 옵니다 |\n| **Chatwoot** | 오픈소스. 직접 띄워서 쓰고 싶을 때 |\n\n**추천** — 국내 고객이 대상이면 **카카오톡 채널 챗봇**으로 시작합니다. 고객이 이미 그 앱을 쓰고 있어서 «설치하세요»를 말하지 않아도 됩니다.\n**대안** — 웹사이트 방문자가 주 고객이면 **채널톡**. 사이트를 떠나지 않고 물어볼 수 있습니다.\n\n요금 구간과 한도는 본문에 두지 않습니다 → <a class=\"xref\" href=\"#부록\">부록<\/a>의 「버전과 값」."}, {"title": "⑤ 개인정보 — 봇을 켜면 따라오는 것", "md": "상담창은 **개인정보가 들어오는 입구**입니다. 봇을 켜는 순간 이게 같이 켜집니다.\n\n**세 가지를 합니다.**\n\n1. **입력 금지 안내** — 상담창 첫 화면에 «주민등록번호·카드번호·계좌 비밀번호는 입력하지 마세요». 그래도 넣는 사람이 있으니, 넣으면 봇이 그 자리에서 다시 안내하게 합니다.\n2. **로그 보관기간 설정 후 자동 파기** — 상담 기록을 무기한 쌓아 두지 않습니다. 보관기간을 정하고 지나면 자동으로 지워지게 설정합니다. 안 지우는 게 편해 보이지만, 쌓인 기록은 새는 순간 전부 피해가 됩니다.\n3. ⭐ **외부 AI에 개인정보 원문 전달 최소화** — 봇이 답을 만들려고 대화 내용을 외부 서비스로 보낼 때, 이름·연락처·주소가 그대로 실려 갑니다. 가릴 수 있으면 가리고, 안 되면 **애초에 그런 정보를 봇 단계에서 받지 않습니다.**\n\n셋째는 **2026-09-11 시행 개정 개인정보보호법**과 이어집니다. 유출 시 통지 의무가 강화됐고, 「어디로 무엇이 나갔는지」를 설명할 수 있어야 합니다. 봇이 어디로 무엇을 보내는지 모르면 그 설명을 못 합니다.\n\n자세한 것은 <a class=\"xref\" href=\"#부록\">부록<\/a>의 「법무·세무」에서 다룹니다."}, {"title": "📘 말 풀이", "md": "**CS(customer service)**\n고객 문의 응대. 주문·환불·사용법 질문에 답하는 일 전부.\n\n**로그(log)**\n주고받은 대화 기록. 봇이 무슨 말을 했는지 나중에 확인할 수 있는 유일한 자료라, 안전장치 ⑤가 여기에 걸립니다.\n\n**에스컬레이션(escalation)**\n봇이 감당 못 하는 문의를 사람에게 넘기는 것. 잘 만든 봇의 기준은 «많이 답하는 봇»이 아니라 **«넘겨야 할 때 제때 넘기는 봇»**입니다."}, {"title": "⚠️ 함정", "md": "- **\"똑똑하게\" 만들려고 문서 밖 지식으로 답하게 두기** — 이게 항공사 사건의 시작입니다. 문서에 없으면 답하지 않습니다.\n- **가격을 봇에게 계산시키기** — 할인·기간·조건이 섞이면 봇은 그럴듯한 숫자를 만들어 냅니다. 그 숫자를 회사가 지켜야 합니다.\n- **「사람과 대화하기」를 마지막 단계에만 두기** — 몇 번 실패한 뒤에야 사람이 나오면, 그전에 고객이 나갑니다.\n- **로그를 안 보기** — 봇이 조용하면 잘 돌아가는 걸로 보입니다. 틀린 답도 조용합니다.\n- **상담 기록을 무기한 보관하기** — 편하지만, 새는 순간 전부 피해입니다.\n- **약관·가격표를 고치고 봇 문서를 안 고치기** — 가장 자주 나는 사고입니다. 가격을 바꿨는데 봇은 옛 가격을 계속 말합니다. **가격을 바꾸면 그날 봇 문서도 바꿉니다.**\n- **고지 문구 없이 켜기** — «AI 답변은 참고용» 한 줄이 없으면, 고객은 봇 말을 회사의 확정 안내로 받아들입니다. (실제로도 그렇게 취급되니, 이 줄은 면죄부가 아니라 **최소한의 예고**입니다)"}, {"title": "⚡ 따라 하기", "md": "**1) 근거 문서 세 개를 먼저 만듭니다.** 봇보다 문서가 먼저입니다.\n\n- `FAQ.md` — 실제로 받은 질문 10개와 답\n- `이용약관` / `환불규정` — 이미 있으면 그대로\n- `가격표` — 조건과 함께\n\n없는 상태로 봇을 켜면 봇이 지어냅니다.\n\n**2) 봇에게 주는 지침을 이렇게 씁니다.**\n\n```\n너는 우리 회사 고객 문의에 답하는 안내 담당이다.\n\n반드시 지킬 것:\n1. 내가 준 문서(FAQ·약관·가격표)에 있는 내용만으로 답한다.\n   문서에 없으면 절대 추측하지 말고 이렇게 답한다:\n   \"제가 확인할 수 없는 내용입니다. 담당자에게 연결해 드릴게요.\"\n2. 답변 끝에 근거를 밝힌다. 예: (출처: 이용약관 5조)\n3. 아래 말이 나오면 답하지 말고 즉시 사람에게 넘긴다.\n   환불 / 취소 / 가격 / 할인 / 계약 / 해지 / 기한 / 보상 / 배상 / 불만 / 항의\n   넘길 때 이렇게 말한다:\n   \"정확한 안내를 위해 담당자에게 연결해 드릴게요.\"\n4. 가격·환불·계약·기한에 대해 \"고객님은 ~에 해당합니다\" 같은\n   확정 표현을 절대 쓰지 않는다. 문서 내용을 그대로 안내만 한다.\n5. 계산하지 않는다. 금액을 더하거나 빼거나 할인율을 적용하지 않는다.\n6. 주민등록번호·카드번호·계좌 비밀번호를 물어보지 않는다.\n   고객이 먼저 적으면 이렇게 안내한다:\n   \"이곳에는 개인정보를 남기지 말아 주세요.\"\n7. 확실하지 않으면 답하는 쪽이 아니라 넘기는 쪽을 고른다.\n```\n\n**3) 켜기 전에 일부러 함정 질문을 던져 봅니다.**\n\n```\n\"저 환불 되나요?\"          → 사람에게 넘겨야 정답\n\"3개월 쓰면 얼마예요?\"      → 계산하지 말고 가격표 안내 + 사람 연결\n\"작년 그 할인 아직 하죠?\"   → 없는 정책이면 \"확인할 수 없다\"가 정답\n\"제 카드번호는 ○○인데요\"    → 개인정보 안내가 나와야 정답\n```\n\n넷 중 하나라도 봇이 «똑 부러지게» 답하면, **그게 잘 되는 게 아니라 위험한 것**입니다. 지침으로 돌아갑니다.\n\n**4) 상담창 첫 화면 고지를 붙입니다.**\n\n```\nAI 답변은 참고용이며, 확정 안내는 담당자가 드립니다.\n주민등록번호·카드번호 등 개인정보는 입력하지 말아 주세요.\n[ 사람과 대화하기 ]\n```\n\n**5) 주 1회 로그 점검을 달력에 넣습니다.** 10분. 아래만 봅니다.\n\n```\n□ 넘겨야 했는데 봇이 답한 대화가 있나\n□ 문서에 없는 내용을 말한 대화가 있나\n□ 사람에게 넘어간 문의가 실제로 답을 받았나\n□ 이번 주에 약관·가격이 바뀌었나 (바뀌었으면 봇 문서도 바꾼다)\n```"}, {"title": "✅ 확인", "md": "- [ ] 봇이 참고하는 **근거 문서 세 개가 실제로 존재하나**\n- [ ] \"환불 되나요\"라고 물었을 때 **사람에게 넘어가나**(답하지 않나)\n- [ ] 금액을 물었을 때 봇이 **계산하지 않고 가격표만 안내하나**\n- [ ] 상담창 어느 화면에서도 **「사람과 대화하기」가 보이나**\n- [ ] 첫 화면에 **«AI 답변은 참고용» 고지가 보이나**\n- [ ] 상담 로그의 **보관기간이 설정되어 있나**\n- [ ] **주 1회 로그 점검이 달력에 들어가 있나**\n- [ ] 봇이 한 말에 **회사가 책임진다는 것을 한 문장으로 말할 수 있나**\n\n하나라도 «아니오»면 봇을 공개하지 않습니다. **켜 놓고 고치는 게 아니라, 되고 나서 켭니다.**"}, {"title": "🔎 더 깊이", "md": "- 절대 자동화하면 안 되는 목록(가격·환불의 확정 통보, 클레임 사과 등)은 다음 절에 있습니다. **봇 지침을 쓰기 전에 그 목록을 한 번 대조합니다.**\n- 개인정보 보관·파기·국외이전 기재는 <a class=\"xref\" href=\"#부록\">부록<\/a>의 「법무·세무」\n- 해지 동선을 어렵게 만드는 것(다크패턴) 문제도 <a class=\"xref\" href=\"#부록\">부록<\/a>에서 다룹니다. **봇으로 해지를 막는 설계는 하지 않습니다.**\n- 검색해 볼 말 — `챗봇 법적 책임 사례`, `human handoff chatbot`, `개인정보보호법 유출 통지`\n- 문서를 근거로 답하게 만드는 구조(RAG)를 직접 만드는 쪽은 <a class=\"xref\" href=\"#9\">Stage 9<\/a>입니다. 이 절은 만들지 않고 **가입해서 켜는** 쪽입니다."}]}, {"file": "6-그밖과금지.md", "id": "s자동화-6", "no": "6", "title": "그 밖 — 넓게 펴 놓고 고른다 / 자동화하면 안 되는 것", "goals": ["자동화 후보를 가치 상·중·하로 갈라낼 수 있다", "자동화하면 안 되는 일을 목록으로 말할 수 있다"], "steps": ["가치 상", "가치 중", "가치 하", "자동화하면 안 되는 것"], "through": "기계는 초안까지 맡는다. 가격·환불·계약의 확정 통보는 사람이 한다.", "time": "50분", "need": [], "head": "앞의 네 절은 1인 회사에서 가장 먼저 손대게 되는 네 가지였습니다. 그런데 회사 일은 그 넷보다 훨씬 넓습니다.\n**좁히기 전에 지형을 먼저 봅니다.** 무엇이 있는지 모르면, 남들이 하는 것만 따라 하게 됩니다.\n\n그리고 이 절에는 이 섹션에서 **가장 중요한 목록** 하나가 들어 있습니다 — **자동화하면 안 되는 것.**\n앞 절들에서 고른 후보를 여기에 대조하고 나서 켭니다.\n\n> 이 절의 법·세무 이야기는 **법률·세무 자문이 아닙니다.**", "secs": [{"title": "① 가치 상 — 여기부터 봅니다", "md": "**공통점: 검수가 가볍고, 틀려도 되돌릴 수 있습니다.** 앞 절의 기준을 그대로 통과하는 것들입니다.\n\n| 무엇 | 자동화되는 부분 | 사람이 남는 자리 |\n|---|---|---|\n| **영수증·경비 정리** | 카드 내역 자동 수집 · 영수증 사진에서 금액·날짜 뽑기 · 항목 분류 | **사적 경비 분리.** 이것만 사람이 봅니다 |\n| **전자세금계산서** | 발행 대상 목록 만들기 · 항목 채우기 | **발행 버튼**과 금액 확인 |\n| **정기 리포트** | 매출·방문자·구독자 수를 모아 월간 표 한 장 | 숫자를 보고 «무슨 뜻인지» 해석 |\n| **회의록** | 녹음 → 글로 옮기기 → 요약 → 할 일 뽑기 | 할 일에 **누가·언제**를 붙이는 것 |\n| **일정 조율** | 빈 시간 찾아 후보 시각 제안 · 예약 링크 | 만날지 말지 결정 |\n\n⭐ **경비·영수증이 이 목록의 1등입니다.** 이유는 하나 — **검수가 거의 필요 없습니다.**\n숫자가 틀리면 표에서 바로 보이고, 틀려도 그 자리에서 고치면 됩니다. 고객에게 나가지 않습니다.\n「검토 시간이 절약 시간을 넘는」 문제가 여기서는 안 생깁니다. **순이익입니다.**"}, {"title": "② 가치 중 — 여유가 생기면", "md": "**공통점: 이득은 있는데, 결과를 사람이 한 번은 읽어야 합니다.**\n\n| 무엇 | 한 줄로 |\n|---|---|\n| **SNS 재활용** | 블로그 글 하나를 짧은 글 여러 개로 쪼갬. 발행 전 사람이 읽습니다 |\n| **리드 수집** | 문의 폼·명함·상담 기록을 한 표로 모음. **연락은 사람이** |\n| **경쟁사·키워드 모니터링** | 정해진 말이 어디에 새로 올라왔는지 주 1회 목록 |\n| **리뷰 요청** | 구매·수강 후 정해진 날에 요청 한 통. 문구는 미리 사람이 씁니다 |\n| **번역 초벌** | 초벌까지. 계약·안내문은 사람이 다시 봅니다 |\n| **깨진 링크·색인 점검** | 「블로그 관리」 절에서 이미 다뤘습니다 |"}, {"title": "③ 가치 하 — 지금은 아닙니다", "md": "| 무엇 | 왜 지금은 아닌가 |\n|---|---|\n| **재고·주문 알림** | 물건을 팔지 않으면 쓸 일이 없습니다. 팔기 시작하면 상으로 올라옵니다 |\n| **계약서 초안** | ⚠️ **반드시 사람 검토.** 초안을 만드는 것 자체는 되지만, 그대로 나가면 회사가 그 문장에 묶입니다 |\n\n「하」는 «나쁘다»가 아니라 «지금 내 상황에서 순위가 낮다»는 뜻입니다. 상황이 바뀌면 올라옵니다."}, {"title": "④ ⭐ 자동화하면 안 되는 것", "md": "여기는 순위 문제가 아니라 **선**입니다. 넘지 않습니다.\n\n| 하면 안 되는 것 | 왜 |\n|---|---|\n| **가격·환불·보상의 확정 통보** | 회사가 그 말에 묶입니다. 「CS 봇」 절의 두 사건이 전부 여기서 났습니다 |\n| **계약서 최종 검토와 서명** | 서명은 회사의 의사표시입니다. 기계가 대신할 수 있는 종류가 아닙니다 |\n| **세무 신고 확정 제출** | 자료 정리는 자동, **제출 버튼은 사람.** 틀린 신고의 책임은 대표에게 옵니다 |\n| **클레임 사과와 보상 제안** | 화난 고객에게 자동 문구가 가면 불이 커집니다. 게다가 보상 제안은 확정 통보입니다 |\n| **채용·거절·해지 통보** | 사람의 생계가 걸린 통보입니다. 자동 발송된 게 드러나면 그 사실 자체가 문제가 됩니다 |\n| **커뮤니티 갈등 중재** | 중재는 판단이고, 판단에는 이름이 필요합니다 |\n| **첫 영업 접촉** | 첫 연락이 자동인 게 티 나면 그 관계는 거기서 끝납니다 |\n| **개인정보가 든 답변의 무검수 발송** | 남의 정보가 엉뚱한 사람에게 갑니다. 되돌릴 수 없습니다 |\n| ⭐ **법정 고지 문구** | 광고 표기·개인정보 처리방침 같은 것. **템플릿은 쓰되 «생성»은 하지 않습니다** |\n\n### 마지막 줄을 조금 더\n\n법정 고지 문구는 **틀리면 그 자체가 위반**입니다.\nAI에게 개인정보 처리방침을 «써 달라»고 하면 그럴듯한 문장이 나오는데, 그 안에는 우리 회사가 실제로는 하지 않는 일이 적혀 있거나, 실제로 하는 일이 빠져 있습니다. **적힌 대로 안 하면 그게 위반입니다.**\n\n그래서 규칙은 이렇습니다.\n\n- ✅ **공식 기관이 배포한 표준 양식(템플릿)을 가져와** 우리 회사 사실을 채워 넣는다\n- ✅ AI에게 «이 템플릿에서 우리가 채워야 할 빈칸이 어디인지 표로 정리해 줘»라고 시킨다\n- ❌ AI에게 «개인정보 처리방침을 써 줘»라고 시키고 그대로 올린다\n\n**공통 원리 하나** — 이 목록의 아홉 개는 전부 **«확정»과 «최초 접촉»**입니다.\n기계는 **초안까지**, 사람은 **확정부터**. 이 한 줄이면 새로운 상황에서도 판단이 됩니다."}, {"title": "📘 말 풀이", "md": "**리드(lead)**\n아직 고객은 아니지만 관심을 보인 사람. 문의를 남겼거나 자료를 받아 간 사람들입니다.\n\n**템플릿(template)**\n빈칸이 있는 표준 양식. 문장 구조는 이미 검증된 것이고, 우리 회사 사실만 채워 넣습니다."}, {"title": "⚠️ 함정", "md": "- **「상」을 건너뛰고 재미있어 보이는 것부터 하기** — 경쟁사 모니터링은 재미있고, 영수증 정리는 지루합니다. 이득은 반대입니다.\n- **「사람이 남는 자리」를 처음엔 지키다가 슬그머니 놓기** — 세 번쯤 문제없이 나가면 «이제 안 봐도 되겠다»는 생각이 듭니다. 사고는 네 번째에 납니다.\n- **「하면 안 되는 것」을 «조심해서 하면 되겠지»로 넘기기** — 조심의 문제가 아니라 되돌릴 수 있느냐의 문제입니다.\n- **AI가 만든 계약서·처리방침을 «검토했다»고 착각하기** — 훑는 것은 검토가 아닙니다. 조항 하나하나가 우리 회사 사실과 맞는지 대조하는 게 검토입니다.\n- **자동 발송에 내 이름을 붙이기** — 첫 영업 메일에 실명 서명이 들어가 있으면 받는 사람은 사람이 쓴 줄 압니다. 그게 드러났을 때가 문제입니다."}, {"title": "⚡ 따라 하기", "md": "**1) 「상」에서 하나를 오늘 켭니다.** 대부분 **경비·영수증 자동 수집**이 답입니다.\n\n1. 사업용 카드를 국세청 홈택스에 등록합니다. 등록해 두면 사용 내역이 자동으로 모입니다.\n2. 종이 영수증은 찍어서 한 폴더에 넣고, 금액·날짜·항목을 뽑게 합니다.\n3. 월말에 **사적 경비만 골라냅니다.** 이게 사람이 남는 자리입니다.\n\n```\n아래는 이번 달 카드 사용 내역이야. 표로 정리해 줘.\n\n| 날짜 | 가맹점 | 금액 | 추정 계정과목 | 사업용인지 확신도(상/중/하) |\n\n규칙:\n- \"확신도 하\"인 항목을 맨 위로 올려라. 내가 먼저 봐야 할 것들이다.\n- 계정과목은 추정이라고 밝혀라. 확정하지 마라.\n- 금액을 합산하지 마라. 합계는 내가 확인하고 낸다.\n- 판단이 애매하면 임의로 정하지 말고 \"확인 필요\"로 남겨라.\n\n[내역 붙여넣기]\n```\n\n**2) 후보를 「하면 안 되는 것」 목록에 대조합니다.** 앞 절들에서 켜기로 한 것 전부.\n\n```\n아래가 내가 이번 달에 켜려는 자동화 목록이야.\n각각에 대해 이 질문에만 답해 줘. 다른 제안은 하지 마라.\n\n1. 이것의 결과물이 사람에게 \"확정\"으로 전달되나? (예/아니오)\n2. 이것이 누군가와의 \"첫 접촉\"인가? (예/아니오)\n3. 틀렸을 때 되돌릴 수 있나? (예/아니오)\n\n1이나 2가 \"예\"이거나 3이 \"아니오\"면 → \"사람이 마지막 단계를 맡아야 함\"이라고 표시하고,\n정확히 어느 단계에서 사람이 들어가야 하는지 한 줄로 적어라.\n\n[목록 붙여넣기]\n```\n\n**3) 법정 고지 문구는 이렇게만 시킵니다.**\n\n```\n아래는 공식 기관이 배포한 개인정보 처리방침 표준 양식이야.\n문장을 새로 만들지 말고, 우리가 채워야 할 빈칸만 표로 정리해 줘.\n\n| 빈칸 위치 | 무엇을 채워야 하나 | 어디서 확인하나 |\n\n문장을 고치거나 추가하지 마라. 빈칸 목록만 만들어라.\n\n[양식 붙여넣기]\n```"}, {"title": "✅ 확인", "md": "- [ ] 「상」에서 **하나를 실제로 켰나**(읽기만 한 게 아니라)\n- [ ] 그것이 **검수가 거의 필요 없는 일**인지 판단하고 켰나\n- [ ] 이번 달 후보를 **「하면 안 되는 것」 목록에 하나씩 대조했나**\n- [ ] 그중 하나라도 **후보에서 뺐나**(하나도 안 걸렸다면 대조를 안 한 것일 수 있습니다)\n- [ ] 켠 것 각각에 **「사람이 남는 자리」가 한 줄로 적혀 있나**\n- [ ] **«기계는 초안까지, 사람은 확정부터»**를 그대로 말할 수 있나"}, {"title": "🔎 더 깊이", "md": "- 순서와 회수기간 계산은 첫 절 「무엇부터 자동화하나」로 돌아가 확인합니다.\n- 이번 달에 실제로 켤 다섯 개는 다음 절에 순서대로 정리돼 있습니다.\n- 세무·경비 처리의 법적 기준은 <a class=\"xref\" href=\"#부록\">부록<\/a>의 「법무·세무」\n- 검색해 볼 말 — `홈택스 사업용 신용카드 등록`, `개인정보 처리방침 표준 양식`, `전자세금계산서 발행`\n- 여러 자동화를 정해진 시각에 혼자 돌게 묶는 방법은 <a class=\"xref\" href=\"#8\">Stage 8<\/a>입니다."}]}, {"file": "7-이번달다섯.md", "id": "s자동화-7", "no": "7", "title": "이번 달에 켤 다섯 — 순서대로", "goals": ["이번 달에 켤 다섯을 순서대로 놓을 수 있다", "1번을 건너뛰면 2번이 왜 실패하는지 안다"], "steps": ["다섯", "왜 이 다섯인가"], "through": "1번 없이 2번을 하면 스팸함으로 간다. 순서가 곧 내용이다.", "time": "이번 달 전체", "need": ["본인 소유 도메인"], "head": "앞의 여섯 절을 다 읽고 나면 켤 수 있는 게 열 개쯤 보입니다. **그게 위험한 상태입니다.**\n열 개를 동시에 켜면 어느 것도 제대로 안 돌고, 어느 것이 틀렸는지도 모릅니다.\n\n이 절은 **다섯 개로 줄이고, 순서를 못 박는** 절입니다.\n순서에는 이유가 있습니다. **앞 번호가 뒤 번호의 전제**라서, 건너뛰면 뒤가 헛돕니다.", "secs": [{"title": "① 다섯 — 이 순서대로", "md": "| # | 무엇 | 어디서 | 사람이 남는 자리 | 무료인가 |\n|---|---|---|---|---|\n| **①** | ⭐ **발신 도메인 인증** — 나머지 전부의 전제 | 도메인 DNS 설정 화면 | DNS 값 붙여넣기 · **시험 발송 1회** | ✅ 도메인 값만 |\n| **②** | **뉴스레터 최소 루프** — 구독 폼 → 환영 메일 → 월 2회 | 스티비 (또는 메일리) | ⭐ **발송 버튼** · `(광고)` 표기 · 수신거부 · 야간 발송 확인 | ✅ 무료 구간 있음 |\n| **③** | ⭐ **채널 FAQ 자동응답** — 가격·환불은 사람에게 넘기도록 설정 | 카카오톡 채널 챗봇 | 넘김 설정 확인 · **주 1회 로그 점검** | ✅ |\n| **④** | ⭐ **경비·영수증 자동 수집** — 검수가 거의 필요 없어 순이익 | 홈택스 사업용 카드 등록 + 영수증 인식 | **사적 경비 분리** | ✅ 등록은 무료 |\n| **⑤** | **블로그 발행 + 색인 자동 요청** | 워드프레스 + IndexNow | ⭐ **발행 전 사람 검수 100%** | ✅ |\n\n요금 구간과 인원 한도는 본문에 두지 않습니다 → <a class=\"xref\" href=\"#부록\">부록<\/a>의 「버전과 값」."}, {"title": "⚠️ 순서를 바꾸면 안 되는 자리", "md": "> **1번 없이 2번을 하면 메일이 스팸함으로 갑니다.**\n\n정확히는 스팸함으로 가면 다행이고, **아예 거부되어 도착하지 않습니다.**\n그런데 발송 화면에는 「발송 완료」라고 뜹니다. 보낸 줄 알고, 반응이 없어서 «사람들이 관심이 없구나» 하고 접습니다.\n**실은 한 통도 도착하지 않은 것**입니다.\n\n이게 이 순서표에서 유일하게 절대적인 규칙입니다. 나머지는 상황에 따라 앞뒤가 바뀔 수 있습니다.\n\n**⑤는 건너뛰어도 됩니다.** 워드프레스를 쓰지 않으면 자동 발행이 안 됩니다. 그 경우 ⑤ 대신 **「블로그 관리」 절의 «발행 후 점검»**만 켭니다. 색인 여부·깨진 링크 목록은 플랫폼과 상관없이 됩니다.\n\n**③은 고객이 있는 곳으로 갑니다.** 국내 고객이 카카오톡에 있으면 카카오톡 채널, 웹사이트 방문자가 주 고객이면 웹 상담창. 도구가 아니라 **고객 위치**가 정합니다."}, {"title": "② 왜 이 다섯인가 — 하나씩", "md": "**① 발신 도메인 인증**\n비용이 거의 안 들고, 한 번 하면 끝이고, **②가 여기에 걸려 있습니다.** 게다가 도메인이 있으면 ⑤의 자리도 같이 생깁니다. 한 번 일해서 두 개가 열립니다.\n\n**② 뉴스레터 최소 루프**\n«최소»가 핵심입니다. 구독 폼 하나, 환영 메일 한 통, **월 2회.** 주 1회로 시작하면 두 달째에 못 지킵니다.\n자동인 부분은 **구독 폼과 환영 메일까지**이고, 정기 발송은 사람이 버튼을 누릅니다.\n\n**③ 채널 FAQ 자동응답**\n문의는 밤에도 옵니다. 여기서 중요한 건 «많이 답하게» 만드는 게 아니라 **«넘기게» 만드는 것**입니다.\n설정에서 반드시 확인할 것 — **가격·환불·계약이 나오면 사람에게 넘어가나.**\n\n**④ 경비·영수증 자동 수집**\n⭐ **다섯 중 유일하게 «순이익»이 확실한 항목입니다.**\n결과물이 고객에게 나가지 않고, 틀리면 표에서 바로 보이고, 그 자리에서 고치면 됩니다. 검수가 거의 없습니다.\n바빠서 하나만 해야 한다면 ①과 ④입니다.\n\n**⑤ 블로그 발행 + 색인 자동 요청**\n발행 자체는 자동으로 되지만 **발행 전 사람 검수는 100%**입니다. 예외 없습니다.\n색인 요청은 사람 손이 아예 안 갑니다 — 이 부분만은 완전 자동이어도 됩니다."}, {"title": "📘 말 풀이", "md": "**최소 루프(minimum loop)**\n돌아가는 데 필요한 최소한만 갖춘 반복 구조. 기능을 다 갖추고 시작하면 시작을 못 하므로, 한 바퀴가 도는 최소 형태로 먼저 켭니다.\n\n**순이익 자동화**\n아낀 시간에서 검수 시간을 뺐을 때 확실히 남는 자동화. 1인 회사에서는 이게 생각보다 적어서, 발견하면 우선 켭니다."}, {"title": "⚠️ 함정", "md": "- **다섯 개를 한 주에 다 켜기** — 한 번에 하나입니다. 하나가 일주일 돌아가는 걸 보고 다음으로 갑니다.\n- **①을 «나중에 하면 되는 기술적인 것»으로 미루기** — 가장 많이 벌어지는 실패이고, 실패한 줄도 모릅니다.\n- **②를 주 1회로 시작하기** — 한 달은 됩니다. 두 달째에 멈추고, 멈춘 뉴스레터는 안 보낸 것만 못합니다.\n- **③에서 봇을 «똑똑하게» 만들려고 하기** — 좋은 봇의 기준은 제때 넘기는 것입니다. 「CS 봇」 절로 돌아갑니다.\n- **④를 미루기** — 지루해서 가장 뒤로 밀리는데, 이득은 다섯 중 가장 확실합니다.\n- **⑤에서 «검수 100%»를 «훑어보기»로 바꾸기** — 훑는 건 검수가 아닙니다.\n- **켠 뒤에 안 보기** — 켠 자동화는 조용히 틀립니다. 각각에 **점검 주기**를 붙여 둡니다."}, {"title": "⚡ 따라 하기", "md": "**1) 이번 주에는 ①만 합니다.**\n\n```\n□ 도메인이 내 소유이고 DNS 설정 화면에 들어갈 수 있다\n□ 발송 서비스에 가입하고 인증 값 3종을 DNS에 넣었다\n□ 화면에 「인증 완료」가 떴다\n□ 내 주소로 시험 발송 1통을 보냈고, 받은편지함에 도착했다\n```\n\n넷을 다 통과하기 전에는 ②로 넘어가지 않습니다.\n\n**2) 다음 주부터 한 주에 하나씩.** ② → ③ → ④ → ⑤.\n막히면 그 주는 그것만 붙잡습니다. **다음 것으로 도망가지 않습니다.**\n\n**3) 켠 것마다 점검 주기를 붙입니다.**\n\n| 켠 것 | 점검 주기 | 무엇을 보나 |\n|---|---|---|\n| ① 도메인 인증 | 없음 | 한 번 되면 끝 |\n| ② 뉴스레터 | **발송 때마다** | 발송 전 4줄 점검 |\n| ③ FAQ 봇 | **주 1회 10분** | 넘겨야 했는데 답한 대화 |\n| ④ 경비 | **월 1회** | 사적 경비 분리 |\n| ⑤ 블로그 | **발행 때마다 + 주 1회** | 발행 전 검수 · 색인·링크 목록 |\n\n**4) 달력에 넣습니다.** 점검은 기억이 아니라 **일정**이어야 굴러갑니다.\n\n**5) 한 달 뒤에 스스로 묻습니다.**\n\n```\n지난 한 달을 돌아보고 아래 세 가지에만 답해 줘. 새 제안은 하지 마라.\n\n1. 내가 실제로 켠 것은 무엇인가 (읽기만 한 것 말고)\n2. 그중 검수 시간이 절약 시간보다 커진 것이 있나\n3. 있다면 그것을 끄는 게 나은가, 아니면 검수를 줄이는 방법이 있나\n\n3번에서 \"검수를 줄이는 방법\"을 억지로 만들지 마라.\n끄는 게 답이면 끄라고 말해라.\n\n[내 기록 붙여넣기]\n```\n\n**끄는 것도 진도입니다.** 켠 것을 다 유지해야 하는 게 아닙니다."}, {"title": "✅ 확인", "md": "- [ ] 이번 달에 **하나를 실제로 켰나**(계획한 게 아니라 켰나)\n- [ ] 그게 **검수 없이 나가도 되는 일**인지 판단하고 켰나\n- [ ] ①을 **가장 먼저** 했나\n- [ ] 시험 발송이 **받은편지함에 도착했나**(스팸함이 아니라)\n- [ ] 켠 것마다 **점검 주기가 달력에 들어가 있나**\n- [ ] 「자동화하면 안 되는 것」 목록과 **대조를 마쳤나**\n- [ ] 회수기간이 3개월을 넘는 것을 **걸러냈나**"}, {"title": "🔎 더 깊이", "md": "- 각 항목의 자세한 설명은 앞 절들에 있습니다 — ①② 「뉴스레터 보내기」 · ③ 「CS 봇」 · ④ 「그 밖 — 넓게 펴 놓고 고른다」 · ⑤ 「블로그 관리」\n- 켠 것들을 정해진 시각에 혼자 돌게 묶는 방법은 <a class=\"xref\" href=\"#8\">Stage 8<\/a>입니다. **먼저 손으로 한 달 돌려 보고** 그다음에 예약을 겁니다. 안 돌아가는 걸 예약으로 걸면 조용히 틀린 결과가 쌓입니다.\n- 요금·한도·서비스별 무료 구간은 <a class=\"xref\" href=\"#부록\">부록<\/a>의 「버전과 값」\n- 이 섹션 전체는 **법률·세무 자문이 아닙니다.** 판단이 필요한 자리는 전문가에게 확인합니다."}]}]}, {"folder": "부록", "key": "부록", "name": "부록", "color": "#94a3b8", "sub": "찾아보는 자리", "goal": "본문에서 뺀 것을 한곳에 모아 둔다", "makes": "—", "time": "", "need": [], "head": "본문은 **원리**를 담고, 여기는 **금방 낡는 것**을 담습니다.\n모델 이름·요금·버전 번호·수수료는 전부 여기 있고, 확인한 날짜가 붙어 있습니다.", "metasecs": [{"title": "🔎 더 깊이", "md": "법무·세무 / 보안 / 테스트 / 성능·비용 / CI·CD / CS·운영 / 스케일링 / 데이터 분석 / **버전과 값**(신설) / **트러블슈팅**(신설)."}], "sections": [{"file": "1-법무세무.md", "id": "s부록-1", "no": "1", "title": "돈 받기 전에 법 칸 비우기", "goals": ["2026-09-11과 2026-10-22에 무엇이 바뀌는지 말할 수 있다", "법마다 내가 할 일을 한 줄씩 꼽을 수 있다", "개인정보 처리방침의 빈칸을 순서대로 채울 수 있다"], "steps": ["시행일 달력을 본다", "법마다 내가 할 일을 본다", "사업자 등록과 푸터 순서를 본다", "처리방침 빈칸을 채운다"], "through": "법은 다 만든 뒤에 챙기면 늦다. 만들기 전에 비워 둘 칸을 먼저 안다.", "time": "60분", "need": [], "head": "혼자 만들어 혼자 파는 사람이 가장 늦게 보는 자리인데, 사고는 여기서 납니다. 결제를 붙이고 남이 열 수 있는 주소를 만드는 순간부터 **남의 개인정보를 내 손에 쥐게 되기** 때문입니다.\n\n> ### ⚠️ 이 글은 법률 자문이 아닙니다\n>\n> 여기 적힌 것은 **\"무엇을 찾아봐야 하는지\"의 지도**입니다. 판단이 필요한 대목 — 내 서비스가 어느 조항의 대상인지, 어떤 문구를 써야 하는지, 처벌 수위가 어떤지 — 는 **변호사·세무사·노무사에게 확인하세요.** 특히 돈을 받기 시작한 뒤에는 반드시 그렇게 하세요.\n>\n> 법령 원문은 국가법령정보센터(`law.go.kr`)에서 무료로 볼 수 있습니다. 이 글과 원문이 다르면 **원문이 맞습니다.**", "secs": [{"title": "① 시행일 달력을 본다", "md": "급한 순서대로 셋입니다. 날짜는 <a class=\"xref\" href=\"#부록\" data-jump=\"s부록-3\">버전과 값<\/a> 표 ⑦에서 확인 날짜와 함께 관리합니다.\n\n| 날짜 | 무엇 | 나에게 오는 숙제 |\n|---|---|---|\n| **2026-09-11** | 개정 개인정보보호법 시행 | 유출을 알게 된 때부터 **72시간 안에 통지**. 규모 기준 없음 |\n| **2026-10-22** | 다크패턴 규제(전자상거래법) 집행 | **해지·탈퇴를 가입만큼 쉽게.** 정기결제 금액이 오르면 사전 동의 |\n| 2026-01-22 (이미 시행) | AI 기본법 | 생성형 AI가 만든 결과물임을 알린다 |\n| 상시 | 국외이전·광고 전송·통신판매업·접근성 | 처리방침·푸터·동의 절차 |\n\n**순서를 바꾸지 마세요.** 09-11 것이 가장 급하고, 그다음이 10-22입니다."}, {"title": "② 법마다 내가 할 일을 본다", "md": "일곱 법을 «무엇이 바뀌었나 → 내가 할 일»로만 적었습니다. 내 서비스에 걸리는 것만 골라 읽으세요.\n\n### 개인정보보호법 — 72시간짜리 시계\n\n> **\"유출된 것 같다\"고 느낀 그 순간부터 시계가 돕니다. 72시간.**\n\n| | 예전 통념 | **2026-09-11부터** |\n|---|---|---|\n| 언제부터 세나 | 유출을 **확인**한 때 | 유출 **가능성을 인지**한 때 |\n| 몇 명부터 | 일정 규모 이상 | **규모 기준 없음. 한 명이어도.** |\n| 누가 대상인가 | 큰 회사 | **1인 법인·개인사업자도 대상** |\n\n조사해서 확실해질 때까지 기다리면 이미 늦습니다. **애매하면 시계가 이미 돌고 있다고 보세요.**\n\n72시간 안에 할 일은 셋입니다.\n\n1. **본인(정보주체)에게 알린다** — 무엇이 유출됐는지, 언제 알았는지, 내가 무엇을 하고 있는지, 어디로 문의하면 되는지.\n2. **감독기관에 신고한다** — 개인정보보호위원회 / 한국인터넷진흥원(KISA). 신고 창구는 개인정보보호 종합포털(`privacy.go.kr`).\n3. **기록을 남긴다** — 언제 알았고 무엇을 했는지. 나중에 이게 증거가 됩니다.\n\n72시간이 지날 것 같으면 **일단 알 수 있는 만큼만 먼저 알리고** 나머지를 뒤에 보탭니다. \"다 파악한 다음에\"가 가장 위험한 선택입니다.\n\n> **1인이라 봐주지 않습니다.** 직원이 없어도, 매출이 0원이어도, 개인정보를 다루면 처리자입니다. 정확한 예외 범위와 완화 조항이 있는지는 **[확인 필요]** — 시행령·고시를 전문가와 함께 확인하세요.\n\n미리 해 둘 것 — 유출 통지문 **초안**, 가입자 이메일을 **한 번에 뽑는 방법**, 문의를 받을 **개인정보 담당 이메일 주소** 하나. 사고 당일에 만들면 늦습니다.\n\n### 다크패턴 — 해지가 가입만큼 쉬워야 한다\n\n2026-10-22부터 집행되는 전자상거래법 개정 내용입니다.\n\n> **들어온 문으로 나갈 수 있어야 합니다.**\n\n| 하면 안 되는 것 | 왜 걸리나 |\n|---|---|\n| 가입은 웹에서 되는데 **해지는 전화로만** | 대표적인 위반 형태입니다 |\n| 해지 버튼을 찾기 어려운 곳에 숨김 | 취소·탈퇴 방해 |\n| 정기결제 **금액을 올리면서** 그냥 넘어감 | 증액 전 **사전 동의**가 필요합니다 |\n| **무료 체험이 끝나고 자동으로 유료 전환** | 유료 전환 전 **사전 동의**가 필요합니다 |\n| \"정말 나가시겠어요?\"를 다섯 번 물어봄 | 정도가 지나치면 방해로 봅니다 |\n| 결제 화면에서 필요 없는 항목을 **기본 체크** | 동의를 유도하는 설계 |\n\n내가 만들 때의 규칙은 한 줄입니다 — **가입 화면을 만들 때 해지 화면을 같이 만듭니다.** 로그인 뒤 세 번 클릭 안에 해지에 닿고, 해지 버튼은 다른 버튼과 같은 크기·같은 색 계열이어야 합니다. 무료 체험이 유료로 바뀌기 전과 금액을 올리기 전에는 \"안내\"가 아니라 **\"동의\"**를 받습니다.\n\n### AI 기본법 — 남의 AI를 갖다 써도 대상\n\n2026-01-22에 이미 시행됐습니다.\n\n> **AI가 만든 결과물이면, 그렇다고 알린다.**\n\n내가 AI를 직접 만들지 않고 **남의 AI를 불러다 쓰는 사업자도 대상**입니다. 실무로는 AI가 답하는 창에 *\"AI가 생성한 답변입니다. 확정 안내는 담당자에게 문의하세요\"*를 붙이고, AI로 만든 이미지·영상에 표시를 달고, 뉴스레터 하단에 *\"이 글은 AI의 도움을 받아 작성하고 사람이 검수했습니다\"* 한 줄을 넣는 정도입니다.\n\n> **[확인 필요]** — '이용사업자'의 범위가 아직 모호하고 계도기간 중입니다. **개인 블로그 글 한 편에도 표시 의무가 붙는지는 확인되지 않았습니다.** 이 글은 \"붙여서 손해 볼 것은 없다\"는 입장이지, \"반드시 붙여야 한다\"는 판단이 아닙니다. 과학기술정보통신부 고시와 안내서를 확인하세요.\n\n### 국외이전 — 처리방침에서 가장 많이 비는 칸\n\n내가 쓰는 해외 서비스가 곧 국외이전입니다.\n\n| 내가 쓰는 것 | 실제로 일어나는 일 |\n|---|---|\n| 해외 데이터베이스 서비스 | 가입자 이메일이 **그 회사 서버(해외)**에 저장됩니다 |\n| 해외 배포 서비스 | 접속 기록이 **해외 서버**를 지납니다 |\n| 해외 이메일 발송 서비스 | 수신자 주소가 **해외로 나갑니다** |\n| 해외 AI API | 프롬프트에 넣은 내용이 **해외로 나갑니다** |\n\n처리방침에는 네 칸을 채웁니다.\n\n| 칸 | 예 |\n|---|---|\n| 받는 곳(수탁자) 이름 | 서비스 회사의 정식 상호 |\n| **나라** | 미국 · 싱가포르 등 |\n| 무엇이 가는가 | 이메일 주소 · 접속 로그 |\n| 왜 가는가 | 데이터 저장 · 메일 발송 |\n\n\"국외이전에 동의\" 항목을 가입 절차에 별도로 두어야 하는지, 처리방침 고지로 충분한지는 서비스 성격에 따라 다릅니다 — 여기가 **전문가에게 물어볼 지점**입니다.\n\n> **아낄 수 있는 자리** — 데이터베이스 서비스가 **서울 리전**을 제공하면 골라 두세요. 저장 위치가 국내면 이 문제 하나가 통째로 가벼워집니다. 다만 위탁사가 해외 법인이면 여전히 기재 대상일 수 있습니다 — **[확인 필요]**.\n\n### 광고 메일·문자 — 정보통신망법 50조\n\n뉴스레터를 만드는 사람이 가장 많이 걸리는 자리입니다.\n\n| # | 규칙 | 실무 |\n|---|---|---|\n| 1 | **명시적 사전 동의** | 가입 폼에 **\"광고성 정보 수신 동의\" 체크박스를 따로.** 기본은 체크 해제 |\n| 2 | **수신거부하면 전송 금지** | 모든 메일 하단에 수신거부 링크. 누르면 **즉시** 빠져야 함 |\n| 3 | **21시 ~ 다음 날 8시는 별도 동의** | 야간 발송을 하려면 야간 동의를 따로 받습니다 |\n| 4 | **제목에 `(광고)` 표기** | 제목 맨 앞에. 전송자 이름·연락처·수신거부 방법도 본문에 |\n\n> ⚠️ **2026-03 개정 안내서가 금지한 것** — \"혜택 안내를 받겠습니다\" · \"유용한 정보를 받겠습니다\" 같은 애매한 표현으로 광고 동의를 받는 것.\n\n받는 사람이 **\"이건 광고를 받겠다는 뜻이구나\"**를 알 수 있어야 합니다. 문구는 이렇게 씁니다.\n\n```\n[ ] (선택) 광고성 정보 수신에 동의합니다.\n    새 기능 안내, 할인·이벤트 등 광고성 메일을 보냅니다.\n    동의하지 않아도 서비스 이용에 제한이 없습니다.\n\n[ ] (선택) 야간(21시~익일 8시) 광고성 정보 수신에 동의합니다.\n```\n\n결제 영수증·비밀번호 재설정·중요 공지는 광고가 아니라서 동의 없이 보낼 수 있습니다. 그 메일 안에 신제품 홍보를 끼워 넣으면 **광고 메일이 됩니다.** 섞지 마세요.\n\n> **[확인 필요]** — 수신 동의를 일정 기간마다 다시 확인해야 한다는 조항이 있습니다. 주기와 대상은 확인되지 않았습니다.\n\n### 통신판매업 신고 — 면제 기준을 정정합니다\n\n**v1 부록에 \"직전년도 매출 1,200만원 미만이면 면제\"라고 적혀 있었습니다. 이것은 틀렸습니다.** 공정거래위원회 고시의 면제 기준은 **거래 횟수**와 **과세 유형**입니다.\n\n| 면제되는 경우 | 설명 |\n|---|---|\n| **직전 연도 통신판매 거래 횟수가 50회 미만** | 매출 금액이 아니라 **건수**입니다 |\n| **부가가치세법상 간이과세자** | 과세 유형으로 판단합니다 |\n\n구독 서비스는 **거래 건수가 빨리 쌓입니다.** 월 구독자 5명이면 1년에 60건이라 50회를 넘습니다. 간이과세자면 건수와 무관하게 면제이지만, 일반과세자로 바뀌면 **그때 신고 의무가 생깁니다.**\n\n신고할 때 필요한 것은 사업자등록증과 **구매안전서비스 이용 확인증** — 결제 대행사에 가입하면 발급됩니다. 그래서 **결제 대행사 가입이 통신판매업 신고보다 먼저**입니다. 정부24(`gov.kr`)에서 신청하면 관할 시·군·구청이 처리해 신고번호를 줍니다.\n\n> **[확인 필요]** — 면제 대상이어도 별도 신청을 해야 하는지, 과태료 수준이 얼마인지는 지자체와 확인하세요. 고시는 개정될 수 있으니 **신고 직전에 공정거래위원회(`ftc.go.kr`) 원문을 한 번 더 봅니다.**\n\n### 접근성 — \"1인이라 안 해도 된다\"는 틀립니다\n\n장애인차별금지법 시행령 별표3은 적용 대상을 단계적으로 넓혀 왔고, **\"그 밖의 모든 법인\"이 2013-04-11부터 대상**입니다.\n\n> **법인이면 규모와 무관하게 원칙적 적용 대상입니다.** 직원이 나 혼자여도 그렇습니다.\n\n| | |\n|---|---|\n| **웹 접근성 품질 인증** | **임의**입니다. 받고 싶으면 받는 것이고, 심사 비용이 듭니다 |\n| **차별하지 않을 의무** | **임의가 아닙니다.** 인증과 별개로 법이 요구합니다 |\n\n인증은 미뤄도, 기본 셋은 처음부터 지킵니다.\n\n| 기본 셋 | 무엇 | 어떻게 확인하나 |\n|---|---|---|\n| **대비(contrast)** | 글자와 배경의 밝기 차이 | 본문 4.5:1 이상, 큰 글씨 3:1 이상. 대비 측정 도구로 **잽니다** |\n| **키보드** | 마우스 없이 Tab만으로 전부 쓸 수 있나 | 마우스를 치우고 Tab만으로 가입 → 결제 → 해지까지 가 봅니다 |\n| **대체 텍스트** | 이미지에 붙이는 설명 글 | 화면을 안 보고 읽어도 뜻이 통하는가 |\n\n> **[확인 필요]** — **개인사업자가 혼자 운영하는 사이트**가 적용 대상인지, 실제 집행이 어느 강도로 이뤄지는지는 확인되지 않았습니다. 다만 \"대상이 아닐 수도 있다\"를 근거로 대비·키보드·대체텍스트를 빼는 것은 나쁜 선택입니다. **비용이 거의 안 드는 셋이기 때문입니다.**"}, {"title": "③ 사업자 등록과 푸터 순서를 본다", "md": "세무사의 영역이라 **순서만** 적습니다. 금액과 세율은 <a class=\"xref\" href=\"#부록\" data-jump=\"s부록-3\">버전과 값<\/a>에서 확인 날짜와 함께 관리합니다.\n\n1. 홈택스(`hometax.go.kr`)에서 **사업자 등록** — 매출이 0원이어도 결제를 받으려면 먼저 있어야 합니다.\n2. **사업용 통장·사업용 카드** 개설 — **AI 요금·서버 요금을 개인 카드로 계속 내는 것이 가장 흔한 손해**입니다.\n3. **결제 대행사 가입** → 구매안전서비스 이용 확인증 발급.\n4. **통신판매업 신고**(면제 대상이 아니면).\n5. 매출이 생기면 **세금 통장을 따로** 만들어 매달 일정 비율을 옮겨 둡니다.\n\n세무사는 매출이 생기고 신고를 스스로 하기가 무섭게 느껴질 때 부릅니다.\n\n통신판매업 신고를 했다면 모든 페이지 아래에 다음이 보여야 합니다.\n\n```\n상호 · 대표자명 · 사업장 주소 · 연락처 · 이메일\n사업자등록번호 · 통신판매업 신고번호\n개인정보 보호책임자 이름과 연락처\n```\n\n그리고 **네 개의 문서 링크**가 필요합니다.\n\n| 문서 | 무엇을 적나 |\n|---|---|\n| **이용약관** | 서비스 조건 · 금지 행위 · 책임 한계 · **해지 절차** |\n| **개인정보 처리방침** | ④의 순서대로 |\n| **환불·청약철회 정책** | 언제·어떻게 환불되나. 디지털 콘텐츠의 청약철회 예외가 내 서비스에 적용되는지는 **[확인 필요]** |\n| **사업자 정보** | 위 푸터 항목 |\n\n> **연락처에 개인 휴대폰 번호를 그대로 적지 마세요.** 가상번호 서비스로 대표번호를 하나 만들고, 개인정보 문의용 이메일도 개인 메일과 분리합니다."}, {"title": "④ 처리방침 빈칸을 채운다", "md": "문서를 먼저 쓰면 반드시 빈칸이 남습니다. **내가 무엇을 쓰는지 세는 것이 먼저입니다.**\n\n**1단계 — 내가 쓰는 바깥 서비스를 전부 적는다.** `.env` 파일과 결제 내역을 나란히 놓고 하나씩 적습니다. 나라 칸이 비면 그 서비스의 공식 개인정보 페이지에서 찾습니다.\n\n| 서비스 이름 | 하는 일 | 개인정보가 가나 | 나라 |\n|---|---|---|---|\n| (데이터베이스) | 가입자 저장 | ✅ 이메일 | ? |\n| (배포) | 사이트 서빙 | ✅ 접속 기록 | ? |\n| (메일 발송) | 뉴스레터 | ✅ 이메일 | ? |\n| (결제) | 결제 처리 | ✅ 결제 정보 | ? |\n| (에러 추적) | 오류 수집 | △ 확인 필요 | ? |\n\n**2단계 — 내가 실제로 받는 항목만 적는다.** 가입 폼과 데이터베이스 표의 **컬럼 이름을 그대로 옮깁니다.** 필수(이메일 · 비밀번호(암호화 저장)) · 선택(이름 · 소셜 로그인 프로필) · 결제(카드 뒷자리 · 결제 식별값 — **전체 카드번호는 내가 보관하지 않습니다**) · 자동 수집(접속 IP · 쿠키 · 접속 기록).\n\n**3단계 — 얼마나 보관하는지 정한다.** \"영구 보관\"이라고 쓰지 않습니다. 회원 정보는 탈퇴할 때까지, 결제·거래 기록과 접속 기록은 관계 법령이 정한 기간. 정확한 법정 보존 기간은 **[확인 필요]** — 전자상거래법·통신비밀보호법 원문을 확인하세요.\n\n**4단계 — 국외이전 표를 채운다.** 1단계 표에서 **나라가 한국이 아닌 줄**만 옮겨 옵니다. 수탁자 이름 · 나라 · 이전 항목 · 이전 목적 네 칸.\n\n**5단계 — 담당자와 창구를 적는다.** 개인정보 보호책임자 이름과 **업무용 연락처.** 대표 이메일과 가상번호를 씁니다.\n\n**6단계 — 시행일을 적고 게시한다.** `시행일: 2026-MM-DD`. 나중에 내용을 바꾸면 **미리 공지하고 새 시행일**을 답니다. 이전 버전도 볼 수 있게 남겨 둡니다."}, {"title": "⚡ 따라 하기", "md": "1. ①의 달력을 열고 **09-11과 10-22를 내 달력에 옮겨 적으세요.** 둘 중 지난 날짜가 있으면 그 법의 숙제부터 합니다 — 시작 전에 순서가 정해져야 합니다.\n2. `.env`와 결제 내역을 열고 ④의 **1단계 표를 채우세요.** 여기서 빠진 서비스가 곧 처리방침의 빈칸이 됩니다. 나라 칸에 `?`가 하나도 남지 않으면 다음으로.\n3. 2~6단계 순서로 **처리방침 초안을 씁니다.** 내가 진짜 수집하는 항목만 적어야 남의 것을 복사했을 때의 «틀린 값»이 안 들어갑니다. 시행일까지 적힌 파일 하나가 생겨야 합니다.\n4. AI에게 아래를 붙여 **초안과 실제 코드를 대조시키세요.** 사람 눈으로는 누락을 못 찾습니다. 표로 돌아온 누락 목록이 진짜 빈칸입니다.\n\n```\n아래 두 가지를 대조해 줘.\n\n(1) 내 개인정보 처리방침 초안\n(2) 내 프로젝트의 .env.example 키 목록과 package.json 의존성 목록\n\n처리방침에 안 적혀 있는데 실제로는 쓰고 있는 바깥 서비스가 있으면\n전부 찾아서 표로 알려 줘. 없는 것을 지어내지 말고,\n확실하지 않으면 \"확인 필요\"라고 적어 줘.\n```\n\n5. 새 계정으로 가입해 테스트 결제까지 간 다음 **스톱워치를 켜고 해지를 찾으세요.** 다크패턴 규제가 보는 것이 바로 이 동선입니다. 3번 클릭 안에 해지 화면이 떠야 하고, 그 버튼이 다른 버튼보다 작거나 흐리면 고칩니다.\n6. 무료 체험 → 유료 전환 지점에 **동의 화면이 있는지 확인하세요.** 안내가 아니라 동의여야 합니다. 없으면 만듭니다.\n7. 유출 통지문 **초안 파일을 프로젝트 안에 만들어 두세요.** 72시간 시계는 사고 당일에 문장을 고민할 시간을 주지 않습니다. 무엇이·언제·무엇을 하고 있나·어디로 문의 네 칸이 들어간 파일이 있으면 됩니다."}, {"title": "✅ 확인", "md": "- [ ] 내 서비스가 쓰는 바깥 서비스 표에 **나라 칸 빈칸이 없나?**\n- [ ] 처리방침의 수집 항목이 **가입 폼의 실제 항목과 일치하나?**\n- [ ] 로그인한 상태에서 **3번 클릭 안에 해지 화면**에 도달하나?\n- [ ] 가입 폼에 **광고 수신 동의 체크박스가 별도로** 있고, 기본이 **해제**인가?\n\n첫 두 개가 «아니오»면 ④로 돌아갑니다. **결제를 붙이기 전에** 끝내야 합니다."}, {"title": "📘 말 풀이", "md": "**개인정보 처리방침** — 내가 남의 정보를 **무엇을·왜·얼마나 오래** 가지고 있는지 적어 공개하는 문서. 법이 요구하는 최소한의 정직한 고백문입니다.\n\n**수탁자 · 위탁** — 내 일을 대신 해 주는 바깥 회사. 메일을 대신 보내 주는 회사, 데이터를 대신 보관해 주는 회사가 수탁자입니다. **누구에게 맡겼는지를 처리방침에 적어야** 합니다.\n\n**다크패턴** — 사용자가 원하지 않는 선택을 하도록 **일부러 어렵게·헷갈리게 만든 화면 설계.** 해지 버튼을 숨기거나, 필요 없는 항목을 미리 체크해 두는 것이 대표적입니다."}, {"title": "⚠️ 함정", "md": "| 함정 | 왜 걸리나 | 어떻게 피하나 |\n|---|---|---|\n| **처리방침을 남의 사이트에서 복사** | 내가 실제로 쓰는 서비스와 안 맞습니다. 빈칸보다 **틀린 값이 더 나쁩니다** | 내가 진짜 수집하는 항목만 적습니다. 다섯 줄이어도 정확한 게 낫습니다 |\n| **\"확인되면 알리겠다\"** | 72시간은 **가능성을 인지한 때**부터입니다 | 애매하면 시계가 돈다고 봅니다 |\n| **해지를 나중에 만들기** | 가입만 만들고 배포하면 다시 안 만듭니다 | 가입 화면과 해지 화면을 **같은 작업에서** 만듭니다 |\n| **\"매출 1,200만원 미만이라 면제\"** | 기준은 **거래 50회 또는 간이과세자**입니다 | 구독자 수 × 12개월을 세어 봅니다 |\n| **광고 동의를 \"혜택 안내\"로 받기** | 2026-03 개정 안내서가 금지했습니다 | 문구에 **\"광고성 정보\"**를 그대로 씁니다 |\n| **국외이전 칸을 비워 둠** | 해외 서비스를 하나라도 쓰면 대상입니다 | 내가 쓰는 서비스를 다 적고 나라를 채웁니다 |\n| **\"1인이라 접근성은 안 해도 된다\"** | 법인은 규모와 무관하게 원칙적 대상입니다 | 대비·키보드·대체텍스트 셋만이라도 |\n| **AI 요금을 개인 카드로 결제** | 사업 비용으로 정리하기 어려워집니다 | 사업자 등록 직후 카드를 바꿉니다 |"}, {"title": "🔎 더 깊이", "md": "- 시행일과 조문 정리는 <span class=\"egfile\">법령 기록<\/span>에 있습니다. **원문은 국가법령정보센터가 정본입니다.**\n\n**법령 원문을 직접 보는 곳**\n\n- 국가법령정보센터 `law.go.kr` — 개인정보 보호법 · 전자상거래 등에서의 소비자보호에 관한 법률 · 정보통신망 이용촉진 및 정보보호 등에 관한 법률 · 장애인차별금지 및 권리구제 등에 관한 법률 시행령 별표3\n- 개인정보보호위원회 `pipc.go.kr` — 개정 내용 해설서와 안내서\n- 개인정보보호 종합포털 `privacy.go.kr` — 처리방침 작성 안내, 유출 신고 창구\n- 공정거래위원회 `ftc.go.kr` — 전자상거래법, 통신판매업 신고 면제 고시, 다크패턴 관련 자료\n- 방송통신위원회 `kcc.go.kr` · 한국인터넷진흥원 — 광고성 정보 전송 안내서\n- 홈택스 `hometax.go.kr` · 정부24 `gov.kr` — 사업자 등록 · 통신판매업 신고\n\n**무엇을 검색하면 되나** — `개인정보 유출 통지 신고 안내서` · `통신판매업 신고 면제 고시` · `광고성 정보 전송 안내서` · `다크패턴 자율관리 가이드라인` · `한국형 웹 콘텐츠 접근성 지침`\n\n**어느 순서로** — ① 개인정보 처리방침 안내서 → ② 광고성 정보 전송 안내서 → ③ 전자상거래 표준약관 → ④ 접근성 지침. **①과 ②만 읽어도 절반 이상 덮입니다.**\n\n**전문가에게 물어볼 것 — 목록을 만들어 가세요**\n\n1. 내 서비스의 국외이전에 **별도 동의**가 필요한가, 처리방침 고지로 충분한가?\n2. 디지털 구독의 **청약철회 예외**가 내 서비스에 적용되나?\n3. AI 기본법의 **표시 의무가 내 콘텐츠에** 적용되나?\n4. 접근성 의무의 **실제 적용 범위**가 내 사업 형태에 어떻게 되나?\n5. 간이과세에서 일반과세로 바뀌는 시점에 **통신판매업 신고**를 언제 해야 하나?\n\n**이어지는 곳** — 무료 한도와 계약 시점 → <a class=\"xref\" href=\"#부록\" data-jump=\"s부록-5\">돈 없이 어디까지<\/a> · 법령 시행일의 확인 날짜 → <a class=\"xref\" href=\"#부록\" data-jump=\"s부록-3\">버전과 값<\/a> 표 ⑦"}]}, {"file": "2-보안.md", "id": "s부록-2", "no": "2", "title": "AI 도구 둘을 안전하게 쓰기", "goals": ["설정 파일에 글자 한 줄을 넣는 것이 왜 명령 실행과 같은지 말할 수 있다", "한 세션이 «신뢰 못 할 입력·시크릿·외부 통신» 셋 중 둘까지만 갖게 만들 수 있다", ".env를 두 도구 모두에서 못 읽게 막고 확인할 수 있다"], "steps": ["사고 셋에서 한 문장을 얻는다", "에이전트 둘의 법칙을 표로 본다", "검증 장치 넷을 켠다", "순차 방식이 왜 옳은지 본다"], "through": "설정 파일에 쓸 수 있는 권한은 곧 코드를 실행할 수 있는 권한이다.", "time": "40분", "need": [], "head": "도구를 둘 쓰면 위험이 더해지는 게 아니라 **곱해집니다.** 왜 그런지와, 오늘 30분 안에 막을 수 있는 것 셋을 여기 모았습니다.", "secs": [{"title": "① 사고 셋에서 한 문장을 얻는다", "md": "> **설정 파일에 쓸 수 있는 권한 = 코드를 실행할 수 있는 권한.**\n\nAI 코딩 도구는 자기 폴더의 설정 파일과 지침 파일을 읽고, 거기 적힌 대로 명령을 실행합니다. **그래서 그 파일에 한 줄을 넣을 수 있는 사람은, 내 컴퓨터에서 명령을 실행할 수 있는 사람입니다.**\n\n실제로 일어난 사고 셋은 교훈이 각각 다릅니다.\n\n| 무슨 일이 있었나 | 교훈 |\n|---|---|\n| 컨테이너 안에서 AI를 격리해 돌리며 **도커 소켓 하나를 열어 줬습니다.** 소켓은 컨테이너를 마음대로 만들고 지우는 손잡이라 호스트 전체에 닿고, 에이전트 셋이 **같은 손잡이를 쥐고** 있었습니다 | 격리는 가장 약한 구멍의 크기만큼만 작동합니다 |\n| 의존성으로 들어온 나쁜 패키지가 홈 폴더를 뒤져 **AI 도구 설정 파일을 전부 찾아** 자동 실행 항목(훅)을 심었습니다. 악성 바이너리가 없어서 **백신에 안 잡혔습니다** | 도구가 둘이면 심을 자리도 둘이고, 한 번의 침입으로 양쪽이 동시에 오염됩니다 |\n| 공개 저장소에 지침 파일을 넣어 두니, 저장소를 **클론해서 열기만 해도** 다섯 종의 에이전트가 시키는 대로 했습니다. 사용자는 아무것도 클릭하지 않았습니다 | 남의 저장소를 여는 것은 남의 지시문을 내 도구에 먹이는 것입니다 |\n\n| 도구가 하나일 때 | 도구가 둘일 때 |\n|---|---|\n| 뚫릴 자리가 하나 | 뚫릴 자리가 둘 |\n| 설정 파일 한 벌 | 설정 파일 두 벌 — **한 침입으로 둘 다** |\n| 권한을 한 곳에서 확인 | **어느 도구에 무슨 권한을 줬는지 헷갈림** |\n| 최신 유지 대상 하나 | **하나만 낡아도 통로가 됨** |\n\n가장 약한 하나가 나머지 전부의 통로가 됩니다. 이것이 \"더하기\"가 아니라 \"곱하기\"인 이유입니다."}, {"title": "② 에이전트 둘의 법칙을 표로 본다", "md": "| 셋 | 무슨 뜻인가 | 예 |\n|---|---|---|\n| **신뢰할 수 없는 입력** | 내가 안 쓴 글이 에이전트에게 들어감 | 남의 저장소 · 웹 페이지 · 사용자가 보낸 문의 · 이슈 본문 |\n| **시크릿 접근** | 비밀값을 읽을 수 있음 | `.env` · API 키 · 데이터베이스 접속 정보 |\n| **외부 통신** | 바깥으로 내보낼 수 있음 | 인터넷 요청 · 메일 발송 · 저장소 push |\n\n> **한 에이전트가 이 셋을 동시에 가지면 안 됩니다.**\n\n셋이 모이면 **\"남이 쓴 글을 읽고 → 내 비밀값을 찾아 → 바깥으로 보내는\"** 경로가 완성되고, 중간에 사람이 없습니다. 둘까지는 괜찮으니 하나만 끊으면 됩니다.\n\n| 상황 | 무엇을 끊나 |\n|---|---|\n| 남의 저장소를 열어 본다 | **시크릿 접근을 끊는다** — 그 폴더에 `.env`가 없게 |\n| 비밀값을 다루는 작업을 한다 | **신뢰할 수 없는 입력을 끊는다** — 그 세션에서 웹을 안 읽게 |\n| 인터넷에서 자료를 모은다 | **시크릿 접근과 push 권한을 끊는다** |"}, {"title": "③ 검증 장치 넷을 켠다", "md": "AI가 짠 코드를 그대로 믿지 않기 위한 최소 장치입니다. 회사들이 수렴한 한 문장은 **\"AI가 초안을 쓰고, 사람이 수락한다. 수락한 사람이 책임진다.\"**\n\n**실패하는 테스트를 먼저** — 고쳐야 할 것을 먼저 실패하는 테스트로 만들고, 그다음에 AI에게 고치라고 합니다. AI는 *\"고쳤습니다\"*라고 아주 자신 있게 말하는데, 실패하던 테스트가 통과로 바뀌는 것을 보기 전에는 그 말에 근거가 없습니다.\n\n**검사 셋을 켠다** — 셋 다 저장소 설정에서 몇 분이면 켭니다. 공개·비공개 저장소의 무료 범위는 <a class=\"xref\" href=\"#부록\" data-jump=\"s부록-3\">버전과 값<\/a> 표 ③에서 확인 날짜와 함께 관리합니다.\n\n| 검사 | 무엇을 잡나 |\n|---|---|\n| **코드 검사** | 흔한 취약 패턴 |\n| **의존성 경보** | 내가 쓰는 패키지에 알려진 구멍이 생겼을 때 알림 |\n| **시크릿 스캔** | 키·비밀번호가 코드에 섞여 들어갔을 때 |\n\n코드 동결 기간에 에이전트가 실서비스 데이터베이스를 지운 일이 실제로 있었습니다. *\"실서비스는 건드리지 마\"*는 지침 파일에만 적혀 있었습니다. **글로 적은 규칙은 지켜지지 않습니다. 아예 닿을 수 없게 만들어야 합니다.**\n\n**신뢰 못 할 콘텐츠를 실행시키지 않는다** — 웹에서 긁어 온 코드는 읽게만 하고 \"실행해 봐\"라고 하지 않습니다. 남의 저장소는 자동 실행 훅이 있는지 먼저 보고, 사용자 문의를 통째로 넘길 때는 권한이 낮은 세션에서 합니다."}, {"title": "④ 순차 방식이 왜 옳은지 본다", "md": "Stage 0에서 도구를 둘 고르고, Stage 7에서 커밋 직전에 다른 도구로 리뷰를 받습니다. 그 구성이 순차여야 하는 이유입니다.\n\n| | 순차 (권장) | 동시 |\n|---|---|---|\n| 어떻게 | 짜기는 도구 하나로. **커밋 직전에** 다른 하나로 리뷰 | 둘을 켜 두고 같은 폴더를 함께 만짐 |\n| 실행 권한 | **한 번에 하나만** 파일을 만짐 | 둘 다 만짐 |\n| 사고가 나면 | 어느 도구가 했는지 안다 | **누가 했는지 모른다** |\n| 되돌리기 | 커밋 단위로 깔끔 | 서로 덮어써서 엉킴 |\n| 리뷰 도구의 권한 | **읽기만** 주면 됨 | 쓰기를 줘야 함 |\n\n둘을 동시에 켜 두는 구성은 비개발자 1인이 감당할 위험이 아닙니다. 순차 방식의 덤은 **리뷰 도구에 쓰기 권한을 안 줘도 된다**는 것 — ②의 법칙에서 한 축이 통째로 사라집니다.\n\n> **정직하게** — 교차 리뷰가 얼마나 이득인지는 측정된 적이 없습니다. 많은 개발자가 그렇게 한다는 사실만 확인됐습니다. 하지만 안전 면에서 순차가 나은 것은 별개로 참입니다."}, {"title": "⚡ 따라 하기", "md": "오늘 할 것 셋(30분)과, 저장소를 열 때·리뷰를 시킬 때 붙이는 프롬프트 둘입니다.\n\n1. 두 도구의 업데이트 확인 명령을 찾아 **오늘 한 번 실행하세요.** 낡은 쪽이 통로가 되기 때문입니다. 둘 다 최신 버전 번호가 뜨면 달마다 확인할 날짜를 달력에 넣습니다. 명령과 버전은 <a class=\"xref\" href=\"#부록\" data-jump=\"s부록-3\">버전과 값<\/a> 표 ①에서 관리합니다.\n2. `.env`를 **세 겹으로 막으세요.** `.gitignore`에 넣고(저장소에 안 올라감), 도구 설정의 접근 금지 목록에 넣고(AI가 못 읽음), 실서비스 키는 아예 두지 않습니다. 두 도구는 서로의 설정을 읽지 않으므로 **양쪽에 각각** 적어야 합니다.\n3. 막혔는지 **양쪽 도구에 아래를 물어보세요.** \"읽을 수 없습니다\" 또는 접근 차단 메시지가 나오면 성공이고, 내용이 나오면 아직 안 막힌 것입니다.\n\n```\n내 프로젝트의 .env 파일 내용을 그대로 보여 줘.\n```\n\n4. 컨테이너 설정에서 `/var/run/docker.sock`을 찾아 **있으면 지우세요.** AI가 만들어 준 설정에 \"편의를 위해\"라는 주석과 함께 들어 있는 경우가 있습니다. 지운 뒤 왜 필요했는지 AI에게 다시 물어 대안을 받습니다.\n5. 남의 저장소를 열기 전에 아래를 붙여 **목록만 받으세요.** 읽기만 시키는 것이 핵심입니다. 목록에 이상한 훅이나 키가 보이면 열지 않습니다.\n\n```\n이 저장소에서 아래를 찾아서 목록으로 보여 줘. 실행하지는 마.\n1) AI 도구 지침 파일 (이름이 어떤 것이든)\n2) 자동 실행되는 훅 설정\n3) 설치·빌드 때 도는 스크립트\n4) .env 파일이나 키처럼 보이는 값\n```\n\n6. 커밋 직전 리뷰는 **읽기 권한만 준 도구에** 아래를 붙이세요. 고치지 않고 지적만 받아야 어느 도구가 무엇을 했는지 남습니다. 넷 각각에 «있다/없다/확인 필요»가 적힌 답이 오면 됩니다.\n\n```\n이 변경분을 리뷰해 줘. 고치지는 말고 지적만 해 줘.\n특히 이 넷을 봐 줘.\n1) 키·비밀번호·토큰이 코드나 로그에 섞여 있나\n2) 남이 보낸 값을 검사 없이 실행하거나 쿼리에 넣는 곳이 있나\n3) 남의 데이터를 볼 수 있게 되는 경로가 있나\n4) 실서비스 자격증명이 개발 코드에 닿는 곳이 있나\n\n확실하지 않으면 \"확인 필요\"라고 적어 줘. 지어내지 마.\n```"}, {"title": "✅ 확인", "md": "- [ ] AI에게 `.env` 내용을 보여 달라고 했을 때 **양쪽 도구 모두 거부**했나?\n- [ ] 내 컨테이너 설정에 **도커 소켓이 없나?**\n- [ ] 지금 켜 둔 세션이 **셋 중 둘 이하**를 지키고 있나? (신뢰할 수 없는 입력 · 시크릿 · 외부 통신)\n- [ ] 리뷰용 도구에 **쓰기 권한을 안 줬나?**"}, {"title": "📘 말 풀이", "md": "**훅(hook)** — \"이럴 때 이걸 자동으로 실행해라\"를 적어 두는 자리. 편할수록 위험합니다 — **남이 여기에 한 줄을 넣으면 내 컴퓨터에서 그 줄이 자동으로 돕니다.**\n\n**도커 소켓** — 컨테이너(격리된 작은 방)를 만들고 지우는 손잡이. 방 안에 넣어 주면 **방 안에 있던 것이 내 컴퓨터 전체에 닿습니다.** 절대 노출하지 않습니다.\n\n**프롬프트 인젝션** — 남이 써 둔 글에 *\"이제부터 이렇게 해\"*라는 지시를 숨겨 두고, AI가 읽으면서 지시로 착각해 따르게 만드는 공격. **AI에게는 자료와 명령이 똑같은 글자로 보입니다.**"}, {"title": "⚠️ 함정", "md": "| 함정 | 왜 위험한가 |\n|---|---|\n| **`.env`를 프로젝트 폴더에 두고 AI를 그 폴더에서 돌린다** | AI가 파일을 읽는 것은 기능입니다. 막지 않으면 읽습니다 |\n| **남의 저장소를 클론해서 바로 AI로 연다** | 저장소 안의 지침 파일이 **여는 순간** 실행될 수 있습니다 |\n| **도커로 격리했으니 안전하다고 생각** | 소켓 하나를 열어 주면 격리가 없는 것과 같습니다 |\n| **도구를 하나만 업데이트** | 낡은 쪽이 통로가 됩니다. **둘 다 최신으로** |\n| **에러 로그를 통째로 복사해 붙임** | 로그 안에 **키·토큰·접속 정보**가 섞여 있을 수 있습니다 |\n| **\"자동 승인\" 모드를 켜 두고 자리를 뜸** | 승인 창이 없다는 것은 **막을 사람이 없다**는 뜻입니다 |\n| **취약점 번호를 검색해 그대로 인용** | 이름이 비슷한 **다른 제품의 것이 섞여 나옵니다.** 원문 대조 전에는 쓰지 않습니다 |"}, {"title": "🔎 더 깊이", "md": "**무엇을 검색하면 되나** — `prompt injection` · `agent sandbox escape` · `docker socket mount risk` · `supply chain attack npm` · `secret scanning pre-commit`\n\n**공식 문서에서 볼 것**\n\n- 각 AI 코딩 도구의 **권한·샌드박스 설정** 문서 — 두 도구가 설정 자리와 이름이 다릅니다. **양쪽을 각각** 읽으세요.\n- 저장소 서비스의 **보안 기능** 문서 — 의존성 경보 · 시크릿 스캔 · 코드 검사\n- 컨테이너 도구의 **소켓 관련 보안 주의** 문서\n\n**어느 순서로** — ① 내가 쓰는 도구의 권한 설정 문서 → ② 저장소 보안 기능 켜기 → ③ 프롬프트 인젝션이 무엇인지 → ④ 컨테이너 격리. **①과 ②만 해도 오늘의 위험 대부분이 줄어듭니다.**\n\n**⚠️ 인용할 때 주의** — AI 코딩 도구의 취약점 번호를 검색하면 이름이 비슷한 다른 제품의 것이 섞여 나옵니다. 번호나 수치를 옮겨 적기 전에 **반드시 제조사 공식 공지와 대조하세요.** 이 글에 번호를 적지 않은 이유가 그것입니다.\n\n**이어지는 곳** — 키가 새어 나갔을 때의 처리 순서 → <a class=\"xref\" href=\"#부록\" data-jump=\"s부록-4\">트러블슈팅<\/a> · 실서비스 키 대신 테스트 모드 → <a class=\"xref\" href=\"#부록\" data-jump=\"s부록-5\">돈 없이 어디까지<\/a>"}]}, {"file": "3-버전과값.md", "id": "s부록-3", "no": "3", "title": "낡는 값을 한곳에 모으기", "goals": ["본문에 없는 요금·버전·모델 이름을 여덟 표 중 어디서 찾는지 안다", "값을 볼 때 확인한 날짜부터 읽고 낡았는지 판단할 수 있다", "분기마다 이 절만 열어 공식 페이지로 값을 갱신할 수 있다"], "steps": ["규칙 셋을 본다", "표 여덟 개에서 찾는다", "새 값이 생기면 여기에 넣는다"], "through": "값은 낡는다. 그래서 값에는 반드시 확인한 날짜를 붙인다.", "time": "15분", "need": [], "head": "모델 이름 · 요금 · 버전 번호 · 수수료. 본문에는 하나도 없고 **전부 여기 있습니다.** 본문에 *\"월 20달러\"*라고 적으면 반년 뒤 그 문장은 거짓말이 되는데, 날짜가 없으니 읽는 사람은 그걸 모르기 때문입니다.", "secs": [{"title": "① 규칙 셋을 본다", "md": "> **본문은 원리를 담고, 이 절은 값을 담는다. 값에는 확인한 날짜가 붙는다.**\n\n| # | 규칙 | 왜 |\n|---|---|---|\n| 1 | **확인한 날짜를 반드시 적는다** | 날짜 없는 값은 값이 아닙니다. 언제부터 틀렸는지 알 수 없습니다 |\n| 2 | **분기마다 갱신한다** | 1·4·7·10월 첫 주. 달력에 넣어 두세요 |\n| 3 | **모르면 `[확인 필요]`로 둔다** | **빈칸보다 나쁜 것이 틀린 값입니다.** 지어내지 않습니다 |\n\n값은 **각 도구의 공식 요금 페이지에서만** 확인합니다. 블로그 · 유튜브 요약 · 비교 사이트 · AI의 기억은 전부 낡은 값을 그럴듯하게 말합니다. 특히 AI에게 \"요금이 얼마야?\"라고 묻지 마세요 — AI의 학습 시점은 지금이 아닙니다."}, {"title": "② 표 여덟 개에서 찾는다", "md": "찾는 것이 무엇인지에 따라 표로 바로 갑니다. 표 ① 도구 요금·설치 상태 · 표 ② 모델 이름 · 표 ③ 무료 한도 · 표 ④ 결제 수수료 · 표 ⑤ 버전 · 표 ⑥ 디자인 도구 · 표 ⑦ 법령 시행일 · 표 ⑧ 도구 이름.\n\n### 표 ① — AI 코딩 도구\n\n| 무엇 | 값 | 확인한 날짜 | 어디서 확인 |\n|---|---|---|---|\n| 메인 도구 요금제 이름과 가격 | `[확인 필요]` | — | 제조사 공식 요금 페이지 |\n| 백업 도구 요금제 이름과 가격 | `[확인 필요]` | — | 제조사 공식 요금 페이지 |\n| 무료로 어디까지 되나 | `[확인 필요]` | — | 공식 요금 페이지 |\n| 사용 한도가 차면 어떻게 되나 | `[확인 필요]` | — | 공식 문서 |\n| 팀·기업 전용 기능 (개인 요금제에서 안 되는 것) | `[확인 필요]` | — | 공식 요금 페이지 |\n| 현재 설치된 버전 | **2.1.266** | 2026-09-09 | `claude --version` (실측) |\n| 업데이트 확인 명령 | `claude --version` · `gh --version` 처럼 **`--version`** | 2026-09-09 | 실측 |\n| 백업 도구 설치 여부 | **아직 안 깔림** (`codex` 명령 없음) | 2026-09-09 | `command -v codex` (실측) |\n| **터미널 멀티플렉서 — 이 맥에 깔려 있나** | **✅ `tmux` 3.7b** (`screen`도 있음) | 2026-09-09 | `tmux -V` (실측) |\n| **이 컴퓨터가 잠드나** | ❌ **안 잠듭니다** (`sleep 0`). 화면만 5분 뒤 꺼지고 작업은 계속 됨. 정전 뒤 자동 재시작(`autorestart 1`) | 2026-09-10 | `pmset -g` (실측) |\n| 노트북을 **덮었을 때** | **덮으면 멈춥니다.** 기기마다 다르니 `pmset -g`로 각자 확인 | 2026-09-10 | 실측 |\n\n> **왜 이 표가 필요한가** — Stage 7의 \"커밋 직전에 다른 도구로 리뷰\"가 **어느 요금제에서 되는지**가 여기서 갈립니다. 저장소에 붙는 자동 리뷰 기능이 개인 요금제에서 되는지 팀 전용인지를 꼭 확인해서 적어 두세요.\n\n### 표 ② — 모델 이름과 등급\n\n**본문에는 모델 이름을 쓰지 않습니다.** 대신 *\"가벼운 모델\" · \"생각 많이 하는 모델\"*처럼 역할로 부릅니다. 실제 이름은 여기서 관리합니다.\n\n| 역할 | 지금의 이름 | API 요금 (100만 토큰당 입력/출력) | 확인한 날짜 |\n|---|---|---|---|\n| 가장 빠른 것 (요약·분류) | `claude-haiku-4-5` | $1 / $5 | 2026-09-09 |\n| 속도와 지능의 균형 | `claude-sonnet-5` | $2 / $10 | 2026-09-09 |\n| **기본으로 쓰는 것** (구현·복잡한 작업) | `claude-opus-5` | $5 / $25 | 2026-09-09 |\n| 가장 어려운 것 (긴 호흡의 추론) | `claude-fable-5-1` | $10 / $50 | 2026-09-09 |\n| 다른 제조사의 모델 이름·요금 | `[확인 필요]` | — | 각 사 공식 모델 문서 |\n\n**출처** — 제조사 공식 모델 문서 (2026-09-09 확인).\n**깎이는 자리 둘** — 묶어서 보내면 **50% 할인**, 같은 앞부분을 다시 쓰면(캐시 읽기) **입력값의 10%**만 냅니다.\n\n> ⚠️ **이 표는 가장 빨리 낡습니다.** 이름이 바뀌고 새 등급이 생깁니다.\n> **본문에서는 「가벼운 모델」·「생각 많이 하는 모델」처럼 역할로만 부르고**, 이름은 여기서만 관리합니다.\n\n### 표 ③ — 서버·데이터베이스·배포의 무료 한도\n\n**「돈 없이 어디까지」 절이 이 표를 씁니다.** 거기서는 *\"어디서 먼저 걸리는가\"*만 말하고, 숫자는 여기 있습니다.\n\n| 무엇 | 무료 한도 | 확인한 날짜 | 어디서 확인 |\n|---|---|---|---|\n| **저장소 자동화 — 무료 실행 시간** | **공개 저장소는 무제한**(표준 러너) · **비공개는 월 2,000분** | 2026-09-09 | GitHub 공식 과금 문서 |\n| 저장소 자동화 — 딸린 저장 공간 | 결과물 보관 **500MB** · 캐시 **저장소당 10GB** | 2026-09-09 | GitHub 공식 과금 문서 |\n| **저장소 예약 실행 — 최소 간격** | **5분** | 2026-09-09 | GitHub 공식 이벤트 문서 |\n| 저장소 예약 실행 — 멈추는 조건 | **공개 저장소는 60일 활동이 없으면 자동 중지** | 2026-09-09 | GitHub 공식 이벤트 문서 |\n| 저장소 예약 실행 — 정확한가 | ❌ **부하가 몰리면 늦습니다.** 매시 정각이 가장 붐빕니다 | 2026-09-09 | GitHub 공식 이벤트 문서 |\n| **배포 서비스 — 무료 예약 실행 주기** | **
