<title>바이브마스터 버전2</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#FBFAF8;--fg:#1C1B19;--dim:#6B675F;--line:#E3DFD7;--card:#FFFFFF;--accent:#1F7A5C;--mark:#FFF3C4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161513;--fg:#EDEAE3;--dim:#9C978C;--line:#2E2C28;--card:#1E1D1A;--mark:#4A3F18}}
:root[data-theme="dark"]{--bg:#161513;--fg:#EDEAE3;--dim:#9C978C;--line:#2E2C28;--card:#1E1D1A;--mark:#4A3F18}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.75 'Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;-webkit-text-size-adjust:100%}
code,pre{font-family:'IBM Plex Mono',ui-monospace,monospace}
.wrap{display:grid;grid-template-columns:250px minmax(0,1fr);gap:0;max-width:1180px;margin:0 auto}
@media(max-width:820px){.wrap{grid-template-columns:1fr}}
/* 사이드 */
aside{border-right:1px solid var(--line);padding:20px 14px 60px;position:sticky;top:0;height:100vh;overflow-y:auto}
@media(max-width:820px){aside{position:static;height:auto;border-right:none;border-bottom:1px solid var(--line)}}
aside h1{font-size:16px;margin:0 0 2px;letter-spacing:-.02em}
aside .ver{font-size:12px;color:var(--dim);margin-bottom:14px}
#q{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);font:14px 'Noto Sans KR',sans-serif}
#q:focus{outline:2px solid var(--accent);outline-offset:1px}
.navlist{margin-top:14px;display:flex;flex-direction:column;gap:1px}
.navitem{display:flex;gap:9px;align-items:baseline;padding:7px 9px;border-radius:7px;cursor:pointer;font-size:14px;border:none;background:none;color:var(--fg);text-align:left;width:100%;font-family:inherit}
.navitem:hover{background:var(--card)}
.navitem[aria-current="true"]{background:var(--card);font-weight:700;box-shadow:inset 3px 0 0 var(--sc,var(--accent))}
.navitem .k{font-size:11px;color:var(--dim);min-width:26px;font-family:'IBM Plex Mono',monospace}
.navitem .done{margin-left:auto;font-size:11px;color:var(--dim)}
/* 본문 */
main{padding:34px 30px 120px;min-width:0}
@media(max-width:820px){main{padding:24px 16px 90px}}
.chip{display:inline-block;font-size:11px;letter-spacing:.08em;padding:3px 9px;border-radius:999px;background:var(--sc);color:#fff;font-weight:700}
h2.st{font-size:27px;margin:12px 0 4px;letter-spacing:-.02em;line-height:1.3}
.sub{color:var(--dim);font-size:15px;margin-bottom:18px}
.goal{border-left:3px solid var(--sc);padding:10px 0 10px 15px;margin:18px 0;font-size:16px}
.goal b{display:block;font-size:11px;letter-spacing:.09em;color:var(--dim);margin-bottom:3px;font-weight:700}
.meta{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0 22px}
.meta span{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:4px 9px;color:var(--dim);background:var(--card)}
.sec{border:1px solid var(--line);border-radius:11px;background:var(--card);padding:18px 20px;margin:14px 0}
@media(max-width:820px){.sec{padding:15px 14px}}
.sec>h3{margin:0 0 3px;font-size:19px;letter-spacing:-.01em;line-height:1.4}
.sec .through{margin:6px 0 14px;padding:9px 13px;background:var(--bg);border-radius:8px;font-size:15px;font-weight:500;border-left:3px solid var(--sc)}
.sec h4{margin:20px 0 6px;font-size:15px;letter-spacing:-.01em}
.sec h4:first-of-type{margin-top:12px}
.body p{margin:9px 0}.body ul,.body ol{margin:9px 0;padding-left:22px}.body li{margin:4px 0}
.body a{color:var(--accent)}
.body table{border-collapse:collapse;width:100%;font-size:14px;margin:11px 0;display:block;overflow-x:auto}
.body th,.body td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
.body th{background:var(--bg);font-weight:700;white-space:nowrap}
.body code{background:var(--bg);padding:1px 5px;border-radius:4px;font-size:.9em;word-break:break-all}
.body pre{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px 14px;overflow-x:auto;position:relative}
.body pre code{background:none;padding:0;font-size:13px;word-break:normal}
.body blockquote{margin:11px 0;padding:2px 0 2px 14px;border-left:3px solid var(--line);color:var(--dim)}
.copy{position:absolute;top:7px;right:7px;font-size:11px;padding:3px 8px;border:1px solid var(--line);border-radius:5px;background:var(--card);color:var(--dim);cursor:pointer;font-family:inherit}
.copy:hover{color:var(--fg)}
/* 특수 칸 */
.k-say{background:#F2F7FF;border-color:#C9DCF5}.k-trap{background:#FFF6F3;border-color:#F2CFC3}
.k-deep{background:#F5F2FA;border-color:#DCD2EA}.k-zap{background:#F3FAF6;border-color:#C7E5D6}
.k-ok{background:#FFFBEE;border-color:#EDDFB0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .k-say{background:#141B26;border-color:#26374F}
:root:not([data-theme="light"]) .k-trap{background:#241715;border-color:#4A2A22}
:root:not([data-theme="light"]) .k-deep{background:#1B1622;border-color:#352A44}
:root:not([data-theme="light"]) .k-zap{background:#12201A;border-color:#234436}
:root:not([data-theme="light"]) .k-ok{background:#211D10;border-color:#43391C}}
.kbox{border:1px solid var(--line);border-radius:9px;padding:13px 16px;margin:14px 0}
.kbox>b{display:block;font-size:13px;margin-bottom:5px;letter-spacing:-.01em}
/* 진도 */
.readbtn{margin-top:15px;font-size:13px;padding:7px 14px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--dim);cursor:pointer;font-family:inherit}
.readbtn[data-on="1"]{background:var(--sc);border-color:var(--sc);color:#fff;font-weight:700}
.progress{height:4px;background:var(--line);border-radius:99px;overflow:hidden;margin:16px 0 4px}
.progress i{display:block;height:100%;background:var(--sc);transition:width .25s}
.ptext{font-size:12px;color:var(--dim)}
mark{background:var(--mark);color:inherit;padding:0 2px;border-radius:3px}
.empty{color:var(--dim);border:1px dashed var(--line);border-radius:11px;padding:26px;text-align:center;font-size:14px}
.toctbl{width:100%;border-collapse:collapse;font-size:14px;margin:16px 0;display:block;overflow-x:auto}
.toctbl th,.toctbl td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.toctbl th{background:var(--card);font-weight:700;white-space:nowrap}
.toctbl td:first-child{white-space:nowrap;font-weight:700}
.hitstage{font-size:11px;color:var(--dim);letter-spacing:.06em}
.xref{color:var(--accent);text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.egfile{color:var(--dim);font-family:'IBM Plex Mono',monospace;font-size:.92em}
</style>

<script type="application/json" id="data">{"stages": [{"folder": "00-환경", "key": "0", "name": "환경", "color": "#1F7A5C", "sub": "일하는 환경을 먼저 세운다", "goal": "AI가 내 자료를 읽고 내 도구를 쓰게 하는 자리를 만든다", "makes": "볼트 폴더 · 커넥터 연결 · 지침 파일 초안", "time": "2~3시간", "need": ["Claude 계정", "노트북 또는 맥"], "head": "도구를 까는 장이 아닙니다. **무엇이 어디에 놓이는가**를 정하는 장입니다.\n여기가 비면 뒤의 모든 장에서 \"그건 어디에 두나요\"가 계속 나옵니다.", "metasecs": [{"title": "✅ 자가 체크", "md": "- [ ] 지침 파일이 **두 층**(글로벌·프로젝트)으로 있고, 각각 무엇을 적는 자리인지 말할 수 있나\n- [ ] 커넥터를 하나 연결해서 **실제로 결과를 받아** 봤나\n- [ ] 터미널을 닫아도 **사는 것과 죽는 것**을 구분할 수 있나\n- [ ] 내 자료가 들어 있는 폴더 하나를 정했고, 그 안에서 AI를 돌려 봤나\n\n하나라도 «아니오»면 그 절로 돌아갑니다."}, {"title": "다음으로", "md": "여기서 만든 **볼트 폴더**가 Stage 1의 시장 조사 결과가 쌓이는 곳이 되고,\n**지침 파일 초안**이 Stage 2·3에서 완성됩니다."}], "sections": [{"file": "1-도구지도.md", "id": "s0-1", "no": "1", "title": "도구 지도 — 몇 개를 쓰나", "through": "도구는 둘이면 된다. 메인 하나, 백업 하나.", "time": "20분", "need": ["Claude 계정"], "head": "", "secs": [{"title": "왜 이걸 하나", "md": "시작하는 사람이 가장 많이 잃는 시간은 **도구를 고르는 시간**입니다.\n새 이름이 뜰 때마다 갈아타면 어느 것도 손에 붙지 않습니다.\n여기서 **몇 개를 쓸지** 정해 두지 않으면, 뒤의 모든 장에서 \"그건 어느 도구로 하나요\"가 반복됩니다."}, {"title": "지금 남아 있는 다섯", "md": "코드를 대신 써 주는 도구는 많았지만, 2026년 9월 기준 실제로 쓰이는 건 다섯입니다.\n\n| 이름 | 한 줄로 |\n|---|---|\n| **Claude Code** | 대화하면서 파일을 직접 고치고 실행까지 한다. 한국어 공식 문서가 있다 |\n| **Codex** | ChatGPT 쪽 도구. 무료로 들어가는 길이 있고, GitHub에서 코드 검사를 해 준다 |\n| **Cursor** | 편집기 안에 AI가 들어간 형태. 코드를 눈으로 보며 고치는 사람에게 맞는다 |\n| **Antigravity** | 구글 쪽 도구. 무료 |\n| **Copilot** | GitHub에 붙어 있는 도구. 회사에서 이미 쓰고 있다면 이미 손에 있다 |"}, {"title": "답은 둘이다 — 메인 하나 + 백업 하나", "md": "**하나만 쓰면 안 되나요?** — 도구가 하나만 있으면 그 하나가 멈출 때 내 일도 멈춥니다.\n**셋 넘게 쓰면 안 되나요?** — 도구를 늘릴수록 일이 빨라지지 않고 **흐름이 끊깁니다.** 어디에 무엇을 시켰는지 내가 못 따라갑니다.\n\n그래서 **둘**입니다. 하루의 대부분을 맡는 메인 하나, 메인이 멈췄을 때 들어가는 백업 하나.\n\n### 백업이 왜 꼭 필요한가 — 지난 12개월 사망 목록\n\n이건 겁주려는 말이 아니라 실제로 일어난 일입니다.\n\n- **Windsurf** — 이름이 사라졌습니다.\n- **Roo Code** — 문을 닫았습니다.\n- **Gemini CLI** — 개인 무료를 끊었습니다.\n- **Cursor** — 주인이 바뀌었습니다.\n\n1년 안에 넷입니다. **내가 쓰는 도구가 내년에도 있으리라는 보장은 없습니다.**\n그래서 백업은 \"혹시\"가 아니라 기본 구성입니다."}, {"title": "비개발자 한 사람의 현실적인 구성", "md": "| 무엇 | 언제 쓰나 | 어디서 |\n|---|---|---|\n| **Claude Code** | 계획·만들기·고치기 — **하루의 90%** | 데스크톱 앱. **터미널을 안 열어도 됩니다** |\n| 앱 안의 코드 리뷰 명령 | 남에게 보이기 전 1차 자체 점검 | 앱 안에서 한 줄 |\n| **Codex** | **커밋(저장) 직전 딱 한 번** | ChatGPT 앱 또는 GitHub |\n\n**대안** — Claude Code 하나로 끝내고, 백업은 **무료인 Antigravity**로 계정만 만들어 둡니다.\n둘로 서로 검사시키는 방식이 얼마나 이득인지는 **측정된 적이 없습니다.** 하나를 제대로 익히는 게 먼저인 시점이라면 이쪽이 정직합니다.\n\n### 둘을 동시에 켜 두지 않습니다\n\n같은 폴더에 두 도구를 동시에 붙여 두면 서로 같은 파일을 고쳐 충돌이 납니다.\n**순서대로 씁니다** — 만드는 건 메인 하나, 검사는 마지막에 백업 하나. 이게 안전에서도 옳습니다."}, {"title": "📘 말 풀이", "md": "**커밋(commit)**\n지금까지 고친 것을 \"여기까지 확정\" 하고 도장 찍어 저장하는 것. 되돌아올 수 있는 지점이 생깁니다.\n\n**터미널(terminal)**\n글자만 나오는 검은 창. 컴퓨터에 글로 명령하는 곳입니다. Claude Code는 데스크톱 앱으로도 쓸 수 있어서, 처음에는 안 열어도 됩니다."}, {"title": "⚠️ 자주 걸리는 함정", "md": "- **\"더 좋아 보여서\" 갈아타기** — 새 도구가 뜰 때마다 옮기면 익숙해질 틈이 없습니다. 메인은 최소한 이 커리큘럼을 끝낼 때까지 바꾸지 않습니다.\n- **둘 다 유료로 결제하기** — 이미 ChatGPT를 쓰고 있는 게 아니라면 백업은 무료로 시작합니다. 백업의 역할은 \"메인이 멈췄을 때 대피\"지 성능이 아닙니다.\n- **동시에 켜 두기** — 같은 폴더를 두 도구가 동시에 만지면 서로 덮어씁니다."}, {"title": "⚡ 이렇게 하세요", "md": "1. 메인을 **Claude Code**로 정하고 데스크톱 앱을 내려받습니다.\n2. 백업 하나를 정합니다 — 이미 ChatGPT를 쓰고 있으면 **Codex**, 아니면 무료인 **Antigravity**.\n3. 백업은 **계정만 만들어 두고 오늘은 쓰지 않습니다.**\n4. 메인 앱을 열고 아래를 그대로 붙여넣어 봅니다.\n\n```\n지금 이 도구가 내 컴퓨터에서 무엇을 할 수 있는지 세 줄로 알려줘.\n파일을 읽을 수 있는지, 고칠 수 있는지, 명령을 실행할 수 있는지 각각 예/아니오로.\n```"}, {"title": "✅ 됐는지 확인", "md": "- [ ] 메인 도구의 앱이 열리고, 내가 쓴 말에 **답이 돌아오나**\n- [ ] 백업 도구의 로그인 화면을 지나 **내 계정 이름이 화면에 보이나**\n- [ ] \"지금 만드는 건 어느 도구, 검사는 어느 도구\"를 **한 문장으로 말할 수 있나**\n\n하나라도 «아니오»면 이 절을 다시 봅니다."}, {"title": "🔎 더 깊이", "md": "- 도구별 최신 요금·모델 이름·버전은 본문에 두지 않습니다 → <a class=\"xref\" href=\"#부록\">부록<\/a>의 「버전과 값」\n- 검색해 볼 말 — `AI coding tool comparison 2026`, `AGENTS.md vs CLAUDE.md`\n- 두 도구가 서로의 지침 파일을 읽지 않는 문제는 <a class=\"xref\" href=\"#3\">Stage 3<\/a>에서 다룹니다."}]}, {"file": "2-깔기.md", "id": "s0-2", "no": "2", "title": "깔기 — 가장 쉬운 길", "through": "압축을 풀지 말고, 앱에게 통째로 던진다.", "time": "40분", "need": ["Claude 계정", "설정 팩 zip 파일"], "head": "", "secs": [{"title": "왜 이걸 하나", "md": "기본 상태의 AI 도구는 **아무것도 모르는 신입**입니다.\n설정을 얹어 두면 매번 설명하지 않아도 같은 방식으로 일합니다.\n이 절을 건너뛰면 뒤의 모든 장에서 \"그건 어떻게 시키나요\"를 매번 처음부터 설명하게 됩니다."}, {"title": "가장 쉬운 길 — 압축을 풀지 않는다", "md": "설치라고 하면 보통 압축을 풀고, 폴더를 찾아 들어가고, 명령어를 칩니다.\n**그걸 다 건너뛸 수 있습니다.**\n\n1. 앱을 엽니다.\n2. zip 파일을 **압축 풀지 말고 그대로** 대화창에 끌어다 놓습니다.\n3. 아래 문장을 함께 붙여넣습니다.\n\n```\n이 zip 파일에 들어있는 설정을 내 ~/.claude/ 에 적용해줘.\nzip 안의 install.sh를 실행하고, 실행 결과를 보여줘.\n그 다음 안내에 나오는 플러그인들을 설치해줘.\n```\n\n도구가 압축을 풀고, 설치 스크립트를 돌리고, 결과를 보여 줍니다.\n**내가 할 일은 파일을 던지고 문장을 붙여넣는 것 둘뿐입니다.**\n\n### 이미 설정이 있어도 괜찮습니다\n\n기존 설정이 있으면 **자동으로 백업 폴더에 복사된 뒤** 새 설정이 들어갑니다.\n문제가 생기면 그 백업 폴더를 되돌리면 원래대로 돌아옵니다. 지워지지 않습니다."}, {"title": "설정이 놓이는 자리 — 두 층", "md": "설정은 두 곳에 나뉘어 놓입니다. **둘은 자동으로 합쳐집니다.**\n\n| 어디 | 무엇을 적나 |\n|---|---|\n| **글로벌** (내 컴퓨터 전체) | 일을 **어떻게** 할 것인가 — 모든 프로젝트에 똑같이 적용 |\n| **프로젝트** (그 폴더 안) | 이 프로젝트가 **어떻게 돌아가는가** — 이 폴더에서만 적용 |\n\n지금은 자리만 기억해 둡니다. 여기에 무엇을 적을지는 <a class=\"xref\" href=\"#3\">Stage 3<\/a>에서 채웁니다."}, {"title": "네 부품 — 이것만 알면 됩니다", "md": "설정 안에 들어 있는 것은 결국 네 가지입니다.\n\n| 부품 | 무엇인가 |\n|---|---|\n| **스킬(Skill)** | **레시피북.** \"이 작업은 이런 순서로 해라\"를 적어 둔 것. 관련 말이 나오면 알아서 펼쳐집니다 |\n| **에이전트(Agent)** | **전문가 분신.** 따로 떨어져 나가 일하고 결과만 가져옵니다. 그래서 **메인 대화가 깨끗하게 유지됩니다** |\n| **슬래시 명령(/명령)** | **원클릭 워크플로.** 여러 단계를 한 줄로 실행합니다 |\n| **훅(Hook)** | **자동 실행 장치.** 어떤 일이 일어나면(세션 시작, 파일 편집 후 등) 알아서 돕니다. 설정만 해 두면 신경 쓸 필요 없습니다 |\n\n> **에이전트가 왜 중요한가** — 큰 조사를 메인 대화에서 시키면 결과 더미가 대화창을 가득 채워 정작 중요한 지시가 밀려납니다. 에이전트에게 맡기면 **결론만** 돌아옵니다."}, {"title": "손이 편해지는 키보드 단축키", "md": "터미널이 무서운 건 대부분 \"뭘 눌러야 할지 몰라서\"입니다. 아홉 개면 충분합니다.\n\n| 누르는 것 | 하는 일 |\n|---|---|\n| `Return` | 줄바꿈 (**전송이 아닙니다**) |\n| `Option` + `Return` | 메시지 보내기 |\n| `Esc` | 지금 하는 걸 **중단** |\n| `Option` + `Up` | 아까 쓴 프롬프트 다시 불러오기 |\n| `Option` + `X` | 자동 수락 켜기·끄기 (매번 승인 누르기 싫을 때) |\n| `@` | 파일이나 폴더를 **대화에 붙이기** |\n| `!` | 명령을 실행하고 그 **결과를 붙이기** |\n| `#` | 파일 내용을 **프롬프트 안에 끼워 넣기** |\n| `/compact` | 대화가 길어졌을 때 **접어서 자리 만들기** |\n| `/cost` | 지금까지 얼마나 썼는지 보기 |\n\n**가장 먼저 익힐 셋** — `Esc`(멈추기) · `@`(파일 붙이기) · `/compact`(자리 만들기)."}, {"title": "📘 말 풀이", "md": "**플러그인(plugin)**\n도구에 나중에 끼워 넣는 추가 기능 묶음. 스킬·에이전트·명령이 한 봉지로 들어옵니다.\n\n**API 키(API key)**\n바깥 서비스를 쓸 때 \"나 맞습니다\"를 증명하는 긴 글자 줄. 비밀번호와 같습니다. 그 서비스 사이트에 로그인 → 키 만들기 → 만들어진 글자 줄을 복사 → 설정 파일에 붙여넣기, 이 네 단계입니다."}, {"title": "⚠️ 자주 걸리는 함정", "md": "- **압축을 먼저 풀어 버립니다.** 그러면 던지기 방식이 안 됩니다. **풀지 말고 그대로** 던집니다.\n- **API 키를 대화창에 그대로 붙여넣습니다.** 키는 설정 파일에만 넣습니다. 대화 기록에 남으면 안 됩니다.\n- **`Return`을 눌렀는데 안 보내집니다.** 전송은 `Option` + `Return`입니다. `Return`은 줄바꿈입니다.\n- **설정 팩에 개발 언어별 스킬이 잔뜩 보여 겁먹습니다.** 안 쓰는 건 그냥 잠들어 있습니다. 있어도 방해하지 않습니다."}, {"title": "⚡ 이렇게 하세요", "md": "1. 앱을 열고 zip을 **압축 풀지 말고** 끌어다 놓은 뒤, 위의 설치 문장을 붙여넣습니다.\n2. 설치가 끝나면 백업 폴더 이름이 화면에 뜹니다 — **적어 둡니다.**\n3. 아래를 붙여넣어 설정이 실제로 들어갔는지 확인합니다.\n\n```\n지금 내 글로벌 설정에 스킬, 에이전트, 슬래시 명령, 훅이 각각 몇 개 들어 있는지 세어서 알려줘.\n그리고 비개발자인 내가 당장 쓸 만한 것 열 개만 골라서 한 줄씩 설명해줘.\n```\n\n4. `Esc` · `@` · `/compact` 셋을 한 번씩 눌러 봅니다."}, {"title": "✅ 됐는지 확인", "md": "- [ ] 설치 결과 메시지에 **\"백업\"이라는 말과 폴더 이름이 보이나**\n- [ ] 위 프롬프트에 **개수(숫자)와 열 개 목록이 답으로 돌아왔나**\n- [ ] `@`를 눌렀을 때 **파일 이름 목록이 떠오르나**\n- [ ] `Esc`를 눌렀을 때 **답하던 것이 멈추나**\n\n하나라도 «아니오»면 설치 단계로 돌아갑니다."}, {"title": "🔎 더 깊이", "md": "- 스킬·에이전트·명령의 **전체 목록**은 본문에 넣지 않습니다 → <a class=\"xref\" href=\"#부록\">부록<\/a>\n- 훅으로 무엇을 자동화할 수 있는지는 <a class=\"xref\" href=\"#3\">Stage 3<\/a>에서 실물로 봅니다.\n- 검색해 볼 말 — `Claude Code settings`, `slash commands`, `keyboard shortcuts`"}]}, {"file": "3-지식저장고.md", "id": "s0-3", "no": "3", "title": "지식 저장고 — 옵시디언", "through": "볼트는 특별한 게 아니라 그냥 폴더다. 그 안에서 AI를 돌린다.", "time": "30분", "need": ["옵시디언", "이미 자료가 들어 있는 폴더 하나"], "head": "", "secs": [{"title": "왜 이걸 하나", "md": "AI에게 매번 \"우리 회사는 이렇고, 저번에 이렇게 정했고…\"를 다시 설명하고 있다면, **자료가 놓일 집이 없기 때문**입니다.\n\n이 장에서 정하는 폴더 하나가 앞으로 계속 쓰입니다.\n<a class=\"xref\" href=\"#1\">Stage 1<\/a>의 시장 조사 결과가 여기 쌓이고, <a class=\"xref\" href=\"#9\">Stage 9<\/a>에서 이게 검색 가능한 위키가 됩니다.\n**여기가 비면 뒤에서 \"그건 어디에 두나요\"가 끝없이 나옵니다.**"}, {"title": "볼트는 특별한 것이 아닙니다", "md": "옵시디언을 열면 \"금고(vault)를 만드세요\"라고 합니다. 무슨 특수한 파일 형식 같지만, 아닙니다.\n\n> **볼트 = 마크다운 파일이 들어 있는 평범한 폴더.**\n\n- 옵시디언을 지워도 파일은 그대로 남습니다.\n- 메모장으로 열어도 읽힙니다.\n- 파일을 다른 폴더로 옮겨도 아무 일도 일어나지 않습니다.\n\n옵시디언이 하는 일은 그 폴더를 **보기 좋게 열어 주고, 글끼리 연결해 주고, 검색해 주는 것**뿐입니다.\n그래서 **잠기지 않습니다.** 이게 이 도구를 고르는 가장 큰 이유입니다."}, {"title": "실무 정답 — 그 폴더 안에서 AI를 돌린다", "md": "옵시디언 안에는 AI 대화창이 없습니다. 그건 빠진 게 아니라 **선택입니다.**\n옵시디언은 자체 AI 기능을 내놓는 대신, 바깥 도구가 폴더를 직접 읽고 쓰게 하는 쪽을 택했습니다.\n\n그러니 쓰는 방법은 이렇게 됩니다.\n\n1. 자료는 **옵시디언으로 보고 씁니다.**\n2. AI는 **그 폴더를 열어 놓고 돌립니다.**\n\n같은 폴더를 사람은 옵시디언으로 보고, AI는 파일로 읽습니다. **하나의 폴더, 두 개의 창구.**\n자료를 복사해서 대화창에 붙여넣을 일이 사라집니다. \"3월 회의록 읽고 정리해줘\"라고 말하면 됩니다."}, {"title": "폴더 하나만 정합니다", "md": "지금 새 체계를 설계하지 않습니다. **이미 자료가 들어 있는 폴더 하나**를 고릅니다.\n비어 있는 폴더로 시작하면 아무것도 못 물어봅니다. 물어볼 게 있어야 이 구조의 값을 느낍니다."}, {"title": "📘 말 풀이", "md": "**마크다운(Markdown)**\n글자 몇 개로 서식을 표시하는 글쓰기 방식. `#`은 제목, `-`는 목록. 그냥 글자라서 어떤 프로그램으로도 열립니다.\n\n**볼트(vault, 금고)**\n옵시디언이 지금 열어 놓은 폴더를 부르는 이름. 폴더 그 자체이고, 그 이상은 아닙니다."}, {"title": "⚠️ 자주 걸리는 함정", "md": "### 「새 금고 만들기」를 누르면 빈 폴더가 생깁니다\n\n가장 많이 걸리는 자리입니다. 첫 화면에는 버튼이 나란히 있습니다.\n\n| 누르면 | 무슨 일이 일어나나 |\n|---|---|\n| **새 금고 만들기** | **아무것도 없는 새 폴더가 새로 만들어집니다.** 내 자료는 여기 없습니다 |\n| **폴더를 금고로 열기** | **이미 있는 내 폴더를** 그대로 엽니다. 자료가 바로 보입니다 |\n\n이미 자료가 있는 폴더를 쓰려면 반드시 **「폴더를 금고로 열기」**입니다.\n\n> 2026-09-09에 실제로 이 함정에 걸려 **빈 금고 두 개가 만들어졌습니다.** 화면이 텅 비어 보이면 자료가 사라진 게 아니라, **다른 폴더를 열어 놓은 것**입니다.\n\n### 빈 금고가 이미 생겼다면\n\n당황하지 않습니다. 그냥 빈 폴더 하나가 생긴 것뿐이고 원래 자료는 안전합니다.\n왼쪽 아래 금고 전환 버튼을 눌러 **「폴더를 금고로 열기」**로 다시 엽니다. 잘못 만든 빈 폴더는 나중에 지우면 됩니다.\n\n### 그 밖\n\n- **폴더 구조부터 완벽하게 짜려 합니다.** 지금은 폴더 하나면 됩니다. 구조는 자료가 쌓인 뒤에 만듭니다.\n- **클라우드 동기화 폴더에 두고 AI를 돌립니다.** 동기화 중에 AI가 같은 파일을 고치면 충돌본이 생깁니다. 큰 작업은 동기화를 잠깐 멈추고 합니다."}, {"title": "⚡ 이렇게 하세요", "md": "1. 옵시디언을 설치하고 엽니다.\n2. **「폴더를 금고로 열기」**를 눌러, 자료가 이미 들어 있는 폴더를 고릅니다.\n3. 왼쪽 목록에 **내 파일 이름들이 보이는지** 확인합니다. 비어 있으면 잘못 연 것입니다.\n4. AI 도구를 **그 폴더에서** 열고, 아래를 붙여넣습니다.\n\n```\n지금 이 폴더에 어떤 파일들이 있는지 훑어보고,\n무슨 주제의 자료가 모여 있는지 다섯 줄로 정리해줘.\n그리고 서로 겹치거나 중복된 파일이 있으면 알려줘.\n```\n\n5. 답이 **내 자료 이야기**를 하고 있으면 성공입니다."}, {"title": "✅ 됐는지 확인", "md": "- [ ] 옵시디언 왼쪽 목록에 **내가 예전에 쓴 파일 이름이 보이나**\n- [ ] AI의 답에 **내 파일 이름이 실제로 등장하나**\n- [ ] 그 폴더의 위치(경로)를 **말할 수 있나**\n\n세 개가 다 «예»여야 <a class=\"xref\" href=\"#1\">Stage 1<\/a>의 조사 결과를 여기 쌓을 수 있습니다."}, {"title": "🔎 더 깊이", "md": "- 이 폴더가 **검색되는 위키**가 되는 방법은 <a class=\"xref\" href=\"#9\">Stage 9<\/a>에서 다룹니다.\n- 검색해 볼 말 — `Obsidian open folder as vault`, `Obsidian markdown plain text`\n- 옵시디언 공식 도움말에서 「Vaults」 항목을 찾아 읽으면 폴더 개념이 한 번에 정리됩니다."}]}, {"file": "4-커넥터.md", "id": "s0-4", "no": "4", "title": "커넥터 — AI에게 손을 달아 준다", "through": "플러그를 꽂는 만큼 손이 늘어난다. 아무 데나 꽂지는 않는다.", "time": "40분", "need": ["노션 또는 구글 계정 하나"], "head": "", "secs": [{"title": "왜 이걸 하나", "md": "여기까지 AI는 **말만 할 수 있습니다.** 내 노션을 못 보고, 내 일정을 못 보고, 메시지를 못 보냅니다.\n커넥터를 하나 붙이는 순간 AI에게 **손이 생깁니다.**\n\n이 절을 건너뛰면 <a class=\"xref\" href=\"#8\">Stage 8<\/a>의 \"내가 없어도 돌아가는\" 구조가 아예 성립하지 않습니다. 손이 없으면 혼자 아무것도 못 합니다."}, {"title": "MCP는 플러그다", "md": "AI에게 바깥 서비스를 연결하는 규격을 **MCP**라고 부릅니다. 어렵게 생각할 필요 없습니다.\n\n> **콘센트 규격이 하나로 통일된 것.**\n> 노션·구글 달력·메일·브라우저가 각각 다른 모양의 플러그였는데, **같은 모양으로 맞춰 놓은 것**입니다.\n\n그래서 하나 꽂는 법을 배우면 나머지도 똑같이 꽂힙니다."}, {"title": "무엇이 연결되면 무엇이 되나", "md": "| 꽂으면 | 이런 말이 통합니다 |\n|---|---|\n| **노션** | \"지난달 회의 페이지 찾아서 결정된 것만 뽑아줘\" |\n| **구글 달력** | \"다음 주에 두 시간 비는 날 찾아서 작업 시간으로 잡아줘\" |\n| **메일** | \"이번 주 안 읽은 문의 메일을 주제별로 묶어줘\" |\n| **브라우저** | \"이 사이트 열어서 화면 찍고, 안 되는 버튼이 있는지 봐줘\" |\n\n**중요한 것** — 커넥터는 **각자의 계정과 열쇠(API 키)가 필요합니다.** 설정 팩에 딸려 오지 않습니다. 하나씩 내 손으로 꽂습니다."}, {"title": "노션을 붙일 때 걸리는 셋", "md": "가장 많이 붙이는 게 노션이라 함정도 여기 몰려 있습니다.\n\n### ① 초당 세 번 한도\n\n노션은 **1초에 세 번**까지만 요청을 받습니다.\n\"페이지 200개 다 읽어서 표로 만들어줘\" 같은 지시는 중간에 막힙니다.\n**나눠서 시킵니다** — 한 번에 폴더 하나, 또는 최근 것부터.\n\n### ② 게스트 계정은 API가 완전히 막힙니다\n\n남의 워크스페이스에 **게스트로 초대받은 상태**라면, 화면으로는 잘 보여도 **연결은 아예 되지 않습니다.**\n설정을 아무리 고쳐도 안 됩니다. **정식 멤버여야 합니다.**\n연결이 계속 실패하면 설정을 의심하기 전에 **내 계정 등급부터** 봅니다.\n\n### ③ 연결을 지우면 예약 실행이 즉시 죽습니다\n\n\"매일 아침 정리해서 노션에 써 두기\" 같은 걸 걸어 두었다면, **연결을 끊는 순간 그것도 같이 멈춥니다.** 경고 없이 조용히 멈춥니다.\n연결을 정리할 때는 **그 연결에 매달린 자동 작업이 무엇인지 먼저 확인**합니다."}, {"title": "디스코드·텔레그램 — 새 세션이 아니라 밀어 넣기", "md": "메신저를 붙이면 흔히 이렇게 오해합니다. *\"휴대폰에서 말을 걸면 AI가 새로 켜지는구나.\"*\n\n**아닙니다.**\n\n> 메신저로 보낸 말은 **새 대화를 켜는 게 아니라, 이미 켜져 있는 내 대화 안으로 밀려 들어갑니다.**\n\n그래서 컴퓨터 앞에 없어도 진행 중인 일에 끼어들 수 있습니다.\n*\"그건 그렇게 하지 마\"*를 지하철에서 보낼 수 있다는 뜻입니다.\n**뒤집어 말하면 — 내 대화가 켜져 있지 않으면 아무 일도 일어나지 않습니다.**"}, {"title": "📘 말 풀이", "md": "**커넥터(connector)**\nAI와 바깥 서비스를 잇는 연결선. 하나 붙일 때마다 AI가 할 수 있는 일이 하나 늘어납니다.\n\n**allowlist(허용 목록)**\n\"이 사람들은 들어와도 된다\"를 적어 두는 명단. 여기 없는 사람은 말을 걸어도 아무 일이 일어나지 않습니다."}, {"title": "⚠️ 자주 걸리는 함정", "md": "### allowlist에 넣은 사람은 내 대신 승인할 수 있습니다\n\n메신저 연결에는 **누가 말을 걸 수 있는지 적는 목록(allowlist)**이 있습니다.\n여기 이름을 넣는 것은 \"대화에 참여시킨다\"가 아닙니다.\n\n> **그 사람은 내 AI가 무언가를 실행하려 할 때 대신 「승인」을 누를 수 있습니다.**\n\n파일을 지우는 것도, 배포하는 것도, 메일을 보내는 것도 포함입니다.\n**아무나 넣으면 안 됩니다.** 처음에는 **나 혼자만** 넣습니다.\n\n### 그 밖\n\n- **한 번에 다섯 개를 꽂습니다.** 하나가 안 될 때 어디가 문제인지 못 찾습니다. **하나씩** 꽂고 하나씩 확인합니다.\n- **API 키를 대화창에 붙여넣습니다.** 키는 설정 파일에만 넣습니다. 대화 기록에 남으면 안 됩니다.\n- **권한을 전부 켜 줍니다.** 처음에는 **읽기만** 켭니다. 쓰기는 읽기가 잘 되는 걸 본 다음에 켭니다."}, {"title": "⚡ 이렇게 하세요", "md": "1. 커넥터를 **하나만** 고릅니다. 지금 매일 쓰는 것으로 — 노션이든 구글 달력이든.\n2. 그 서비스 사이트에 로그인 → 키 만들기 → 만들어진 글자 줄을 복사합니다.\n3. AI 앱에 붙여 넣어 연결합니다.\n4. 연결됐는지 **실제 결과를 받아서** 확인합니다.\n\n```\n방금 연결한 커넥터로 실제 내 데이터를 하나만 가져와줘.\n가져온 것의 제목과 날짜를 그대로 보여줘. 요약하지 말고 원문 그대로.\n```\n\n5. 읽기가 잘 되면 그때 쓰기 권한을 켭니다."}, {"title": "✅ 됐는지 확인", "md": "- [ ] 커넥터 목록에서 그 이름 옆에 **「연결됨」 표시가 보이나**\n- [ ] 위 프롬프트의 답에 **내가 아는 실제 제목·날짜가 나오나** (지어낸 예시가 아니라)\n- [ ] 메신저를 붙였다면, allowlist에 **나 말고 다른 사람이 없는지** 눈으로 확인했나\n\n두 번째가 «아니오»면 아직 연결된 게 아닙니다. AI가 그럴듯하게 지어낸 것일 수 있습니다."}, {"title": "🔎 더 깊이", "md": "- 커넥터로 **예약 실행**을 거는 법은 <a class=\"xref\" href=\"#8\">Stage 8<\/a>에서 다룹니다.\n- 검색해 볼 말 — `MCP server`, `Notion API rate limit`, `Notion guest API`\n- 어떤 커넥터가 있는지 궁금하면 AI에게 물어봅니다 — *\"○○ 관련 MCP 서버가 있는지 찾아줘.\"*"}]}, {"file": "5-터미널을닫는것.md", "id": "s0-5", "no": "5", "title": "터미널을 닫는 것 ≠ 컴퓨터를 끄는 것", "through": "모니터를 꺼도 영상은 계속 재생된다.", "time": "30분", "need": ["터미널 앱"], "head": "", "secs": [{"title": "왜 이걸 하나", "md": "AI에게 일을 시켜 놓고 창을 닫았습니다. 다시 열었더니 **아무것도 없습니다.**\n20분 걸릴 일이었는데 처음부터 다시 해야 합니다.\n\n이걸 모르면 **자리를 뜰 수가 없습니다.** 컴퓨터 앞에 붙어 앉아 끝날 때까지 지켜보게 됩니다.\n<a class=\"xref\" href=\"#8\">Stage 8<\/a>의 \"내가 없어도 돌아간다\"는 여기서부터 시작합니다."}, {"title": "3층 구조 — 모니터 · 컴퓨터 · 영상", "md": "한 번 이해하면 다시는 헷갈리지 않는 비유입니다.\n\n| 층 | 무엇에 해당하나 | 끄면 |\n|---|---|---|\n| **터미널 앱** (내가 보는 검은 창) | **모니터** | 눈앞에서 사라질 뿐 |\n| **멀티플렉서 서버** (뒤에서 도는 것) | **컴퓨터** | 이게 꺼져야 진짜 끝 |\n| **AI 작업** (돌고 있는 일) | **재생 중인 영상** | 모니터를 꺼도 **계속 재생됩니다** |\n\n유튜브를 틀어 놓고 모니터를 껐다고 영상이 멈추지 않습니다. 뒤에서 계속 돕니다. 모니터를 다시 켜면 이어서 보입니다.\n\n> **터미널 창을 닫는 것 ≠ 컴퓨터를 끄는 것.**\n\n**그냥 터미널만 쓰면** 창을 닫는 순간 하던 일이 죽습니다. 모니터와 컴퓨터가 붙어 있는 상태라서 그렇습니다.\n**멀티플렉서를 끼우면** 일을 쥐고 있는 주체가 창이 아니라 뒤의 서버로 바뀝니다. 창은 그냥 들여다보는 구멍이 됩니다."}, {"title": "무엇을 깔면 되나 — tmux", "md": "이 역할을 하는 도구 이름은 **tmux**입니다. 맥에 이미 들어 있는 **screen**으로도 됩니다.\n\n- **tmux** — 지금 가장 많이 쓰입니다. 2007년에 나온 오래된 도구인데, AI 에이전트 때문에 다시 뜨고 있습니다.\n- **screen** — 맥에 기본으로 있어서 설치가 필요 없습니다. tmux보다 투박하지만 \"창을 닫아도 안 죽는다\"는 똑같이 됩니다.\n\n**추천** — tmux 하나를 깝니다. 자료와 도움말이 압도적으로 많습니다.\n**대안** — 아무것도 깔기 싫으면 screen으로 원리만 먼저 겪어 봅니다."}, {"title": "왜 하필 지금 이게 되살아났나", "md": "원래 이건 서버 관리자들이 쓰던 물건이었습니다. 일반 개발자도 잘 안 썼습니다. **20년 된 도구가 갑자기 왜 뜰까요.**\n\n**예전** — 사람 하나가 굴리는 작업은 **내가 타이핑하는 동안만** 돌았습니다. 손을 떼면 아무것도 안 돌아갑니다. 창을 닫아도 잃을 게 없었습니다.\n\n**지금** — 지시 한 번에 AI가 **10분, 20분, 30분을 혼자 돕니다.** 그 사이에 두 번째 지시를 내리면 그것도 따로 돕니다. 세 번째도 마찬가지입니다.\n**내 손과 상관없이 도는 일이 여러 개 쌓입니다.**\n\n그래서 셋이 필요해졌습니다.\n\n| 필요한 것 | 무슨 뜻인가 |\n|---|---|\n| **지속성** | 창을 닫아도, 연결이 끊겨도 일이 계속된다 |\n| **병렬 시야** | 여러 개가 도는 걸 한 화면에서 본다 |\n| **원격** | 다른 곳에서 접속해 이어서 본다 |\n\n이 셋이 정확히 멀티플렉서가 하는 일입니다.\n\n**이렇게 쓰게 됩니다** — 자기 전에 돌려놓고 잡니다. 아침에 결과가 몇 개 만들어져 있습니다. 출근 전에 또 몇 개 걸어 놓고, 지하철에서 딴짓하다가 도착하면 끝나 있습니다."}, {"title": "노트북을 덮으면 어떻게 되나", "md": "**[확인 필요]** — 맥을 **덮었을 때도** 계속 도는지는 그 맥의 **절전 설정에 달려 있습니다.**\n덮으면 잠드는 설정이면 뒤의 작업도 같이 잠깰 때까지 멈춥니다. 창을 닫는 것과 덮는 것은 다른 이야기입니다.\n내 맥에서 실제로 되는지는 **직접 한 번 재 봐야** 압니다. 아래 ⚡에서 확인합니다."}, {"title": "📘 말 풀이", "md": "**멀티플렉서(multiplexer)**\n창 하나를 여러 칸으로 쪼개고, 그 묶음을 **창과 따로 살려 두는** 프로그램. 이름은 어렵지만 하는 일은 \"창을 닫아도 안 죽게 하는 것\" 하나입니다.\n\n**세션(session)**\n멀티플렉서가 묶어 놓은 작업 한 덩어리. 이름을 붙여 두면 나중에 그 이름으로 다시 붙습니다."}, {"title": "⚠️ 자주 걸리는 함정", "md": "- **창을 닫는 것과 컴퓨터를 끄는 것을 같다고 생각합니다.** 창은 모니터입니다. 컴퓨터를 끄거나 재부팅하면 그때는 진짜 다 죽습니다.\n- **멀티플렉서 안에서 실행하지 않고 그냥 실행합니다.** 먼저 세션을 켜고 **그 안에서** AI를 돌려야 합니다. 순서가 반대면 아무 효과가 없습니다.\n- **세션 이름을 안 붙입니다.** 나중에 어디로 돌아가야 할지 못 찾습니다. 처음에는 이름 하나만 정해 계속 씁니다.\n- **덮어도 되겠지 하고 그냥 덮습니다.** 절전 설정에 따라 다릅니다. 중요한 작업은 먼저 한 번 재 보고 판단합니다."}, {"title": "⚡ 이렇게 하세요", "md": "1. 터미널을 열고 tmux를 깝니다. 아래를 AI에게 붙여넣으면 알아서 설치해 줍니다.\n\n```\n내 맥에 tmux를 설치해줘.\n설치가 끝나면 tmux 버전을 출력해서 정말 깔렸는지 보여줘.\n그리고 세션을 만들고 / 빠져나오고 / 다시 붙는 명령 세 줄만 알려줘.\n```\n\n2. 세션 하나를 이름 붙여 만들고, 그 안에서 **10분쯤 걸리는 일**을 AI에게 시킵니다.\n3. **터미널 창을 그냥 닫습니다.** 5분 뒤 다시 열어 그 세션에 붙습니다.\n4. 하던 일이 **그대로 진행 중이면 성공**입니다.\n5. 이제 **덮어서** 재 봅니다. 같은 실험을 하되 창을 닫는 대신 노트북을 덮고, 10분 뒤 열어서 확인합니다. **내 맥에서 되는지 안 되는지 여기서 답이 나옵니다.** 결과를 한 줄로 적어 둡니다.\n\n### 이렇게 해 봤습니다 — 2026-09-09\n\n이 맥에 **tmux가 이미 깔려 있었습니다.** 그래서 바로 재 봤습니다.\n\n세션 하나를 만들어 **1초에 한 줄씩 기록을 남기는 긴 작업**을 걸어 두고, 3초 뒤에 확인하니 **3줄**이었습니다.\n그리고 **그 터미널을 완전히 끝냈습니다.**\n\n잠시 뒤 **새 터미널에서 다시 붙어 보니** — 세션이 그대로 있었고, 기록은 **11줄**이 되어 있었습니다.\n**아무도 보고 있지 않은 동안에도 계속 돌고 있었습니다.**\n\n> 모니터를 껐다고 컴퓨터가 꺼지는 게 아닙니다. 정확히 그 일이 일어난 것입니다.\n\n**아직 확인 못 한 것 하나** — 노트북을 **덮었을 때**도 이렇게 도는지는 절전 설정에 달려 있어서 `[확인 필요]`입니다.\n맥을 쓰신다면 **긴 작업을 걸어 두고 덮은 뒤, 10분 있다가 열어서 기록이 늘었는지 보세요.** 그게 답입니다."}, {"title": "✅ 됐는지 확인", "md": "- [ ] 창을 닫았다 다시 붙었을 때 **아까 하던 글자들이 그대로 보이나**\n- [ ] 그 사이에도 **작업이 진행된 흔적(새로 늘어난 줄)이 보이나**\n- [ ] 노트북을 덮었다 열었을 때 **어떻게 되는지 내 눈으로 확인했나** (되든 안 되든 답을 안다)\n- [ ] 세션 이름을 하나 정해서 **그 이름으로 다시 붙을 수 있나**\n\n첫 번째가 «아니오»면 멀티플렉서 **안에서** 실행하지 않은 것입니다. 3번으로 돌아갑니다."}, {"title": "🔎 더 깊이", "md": "- 여러 개가 동시에 도는 걸 **색으로 구분해서 보는 법**, 막힌 것만 골라 보는 법은 <a class=\"xref\" href=\"#8\">Stage 8<\/a>에서 다룹니다.\n- 이 자리를 노리는 새 도구들이 계속 나옵니다. 이름은 <a class=\"xref\" href=\"#부록\">부록<\/a>에 두고, 본문에는 **원리**만 둡니다. 원리는 안 바뀝니다.\n- 검색해 볼 말 — `tmux 기초`, `tmux attach detach`, `mac 절전 설정 caffeinate`"}]}, {"file": "6-실리콘밸리일곱.md", "id": "s0-6", "no": "6", "title": "실리콘밸리에서 훔쳐 올 일곱 가지", "through": "에이전트를 많이 돌릴수록 병목은 결국 나다.", "time": "25분", "need": [], "head": "", "secs": [{"title": "왜 이걸 하나", "md": "앞으로 열 개가 넘는 장을 지나갑니다. 그 안에 흩어져 나올 습관들이 있는데, **왜 그걸 하는지**를 모르면 그냥 귀찮은 절차로 보입니다.\n\n여기서 **지도를 먼저 한 장** 봅니다. 일곱 개가 각각 뒤의 어느 장에서 나오는지도 함께 적어 둡니다.\n지금 다 할 필요는 없습니다. **\"아, 이게 그거구나\" 하고 알아보는 것**이 이 절의 목적입니다."}, {"title": "관통 문장 — 병목은 나다", "md": "동시에 열한 개의 AI를 돌리던 사람의 말입니다.\n\n> **\"에이전트를 많이 돌릴수록 병목은 결국 나라는 게 뼈저리게 느껴지더라고요.\"**\n\n만드는 속도는 이미 충분히 빨라졌습니다. 그런데 **어느 것이 막혀서 나를 기다리는지 몰라서** 20~30분씩 그냥 서 있었습니다.\n\n**사람의 역할이 바뀌었습니다.** 만드는 쪽이 아니라 **보는 쪽**입니다.\n아래 일곱 가지는 전부 이 한 문장에서 나옵니다. **검증을 싸게 만드는 방법들**입니다."}, {"title": "일곱 가지", "md": "| # | 무엇 | 왜 |\n|---|---|---|\n| ① | **배포와 공개를 분리한다** | 만든 걸 올리는 것과 사람들에게 보이는 것을 **따로** 둡니다. 스위치 하나로 껐다 켭니다. 이게 있으면 매일 올려도 안 무섭습니다 |\n| ② | **결정을 6줄로 남긴다** | 3개월 뒤의 나는 남입니다. **AI는 기억이 아예 없습니다.** 안 적어 두면 AI가 옛 결정을 모르고 뒤집습니다 |\n| ③ | **코드 전에 설계문서, 그리고 AI에게 비판시키기** | 서류가 아니라 **생각하는 도구**입니다. 글로 먼저 쓰고 \"이 계획의 약점을 찾아줘\"를 시킵니다 |\n| ④ | **합치기 전 둘 — AI에게 diff 리뷰 + 하루 묵히기** | 남이 봐 주는 게 없으니 둘로 대신합니다. 다른 AI에게 바뀐 부분만 보이고, 급하지 않으면 하루 재웁니다 |\n| ⑤ | **알림 기준은 딱 하나 — \"지금 사용자에게 보이는 문제인가\"** | 알림이 많으면 전부 안 보게 됩니다. **과잉 알림이 부족한 알림보다 나쁩니다** |\n| ⑥ | **핵심 흐름 3~5개에 자동 검사** | 가입·로그인·결제처럼 **망가지면 끝인 길**만. 만드는 속도가 오르면 **망가지는 속도도 같이 오릅니다** |\n| ⑦ | **장애 후 3줄 부검 + 5단계 런북** | 혼낼 사람이 없어도 씁니다. 목적은 처벌이 아니라 **다음에 같은 일을 안 겪는 것** |"}, {"title": "어느 장에서 나오나", "md": "| # | 나오는 곳 |\n|---|---|\n| ② 결정 6줄 · ③ 설계문서 | <a class=\"xref\" href=\"#2\">Stage 2 명세<\/a> |\n| ① 배포와 공개 분리 · ④ 합치기 전 둘 · ⑥ 자동 검사 | <a class=\"xref\" href=\"#7\">Stage 7 배포·PR<\/a> |\n| ⑤ 알림 기준 · ⑦ 부검과 런북 | <a class=\"xref\" href=\"#8\">Stage 8 자율 운영<\/a> |"}, {"title": "한 사람에게는 과한 것 — 안 해도 됩니다", "md": "큰 회사 이야기를 읽다 보면 \"이걸 다 해야 하나\" 싶어집니다. **아닙니다.**\n아래는 **사람이 여럿일 때만 값을 하는 것들**입니다. 혼자라면 하지 않습니다.\n\n| 과한 것 | 왜 혼자에겐 필요 없나 |\n|---|---|\n| **카나리 배포** | 일부 사용자에게만 먼저 보이는 방식. 사용자가 그만큼 없으면 의미가 없습니다 |\n| **블루그린 배포** | 서버를 두 벌 띄워 갈아 끼우는 방식. 비용이 두 배인데 얻는 게 없습니다 |\n| **머지 큐** | 여러 사람의 작업이 줄 서서 합쳐지는 장치. 줄 설 사람이 없습니다 |\n| **온콜 로테이션** | 당번을 정해 돌아가며 대기하는 것. 돌아가며 할 사람이 없습니다 |\n| **커버리지 90%** | 코드의 90%를 자동 검사로 덮는 목표. 혼자서는 검사 유지에 시간을 다 씁니다. **핵심 3~5개면 충분합니다** |\n\n**안 하는 것도 결정입니다.** 여기 적힌 다섯은 \"나중에 할 일\"이 아니라 **지금 안 할 일**입니다."}, {"title": "📘 말 풀이", "md": "**diff (차이)**\n고치기 전과 후에서 **달라진 줄만** 뽑아 놓은 것. 전체를 다시 읽지 않고 바뀐 데만 봅니다.\n\n**런북(runbook)**\n문제가 생겼을 때 **위에서부터 그대로 따라 하면 되는 단계 목록.** 당황했을 때 판단하지 않기 위해 미리 적어 둡니다."}, {"title": "⚡ 이렇게 하세요", "md": "지금 할 일은 하나뿐입니다. **일곱 개를 내 말로 옮겨 적어 두는 것.**\n\n1. <a class=\"xref\" href=\"#0\" data-jump=\"s0-3\">3절 지식 저장고<\/a>에서 정한 폴더에 `실리콘밸리-일곱.md` 파일을 만듭니다.\n2. AI에게 아래를 시킵니다.\n\n```\n아래 일곱 가지를 내 상황에 맞춰 다시 써줘.\n나는 혼자 웹서비스를 만드는 비개발자다.\n\n① 배포와 공개를 분리한다\n② 결정을 6줄로 남긴다\n③ 코드 전에 설계문서, AI에게 비판시키기\n④ 합치기 전 AI에게 diff 리뷰 + 하루 묵히기\n⑤ 알림 기준은 \"지금 사용자에게 보이는 문제인가\" 하나\n⑥ 핵심 흐름 3~5개에 자동 검사\n⑦ 장애 후 3줄 부검 + 5단계 런북\n\n각각에 대해 두 줄만 써줘.\n첫 줄은 \"이게 뭔가\", 둘째 줄은 \"내가 이걸 안 하면 무슨 일이 생기나\".\n어려운 말은 쓰지 말고, 지금 당장 못 하는 것도 그대로 둬.\n```\n\n3. 나온 글을 그 파일에 저장합니다. **뒤의 장에서 이 파일로 돌아옵니다.**"}, {"title": "✅ 됐는지 확인", "md": "- [ ] 내 폴더에 **`실리콘밸리-일곱.md` 파일이 보이나**\n- [ ] 그 안에 **일곱 개가 다 있고, 각각 두 줄이 적혀 있나**\n- [ ] \"지금 안 할 것 다섯\"을 보고 **마음이 놓이나** — 이건 안 해도 된다는 걸 알겠나\n- [ ] *\"병목은 결국 나다\"*가 **무슨 뜻인지 한 문장으로 말할 수 있나**"}, {"title": "🔎 더 깊이", "md": "- 일곱 개는 각각의 장에서 **실물로** 다시 나옵니다. 지금은 이름만 알면 충분합니다.\n- 검색해 볼 말 — `feature flag`, `ADR architecture decision record`, `blameless postmortem`, `SRE alerting symptom based`\n- 여기서 만든 파일은 <a class=\"xref\" href=\"#9\">Stage 9<\/a>에서 내 판단 기준 문서의 재료가 됩니다."}]}, {"file": "7-안티그래비티.md", "id": "s0-7", "no": "7", "title": "안티그래비티 — 백업 도구는 무엇으로 하나", "through": "백업은 성능이 아니라 대피로다. 켜 두지 않고, 막혔을 때 연다.", "time": "30분", "need": ["구글 계정"], "head": "", "secs": [{"title": "왜 이걸 하나", "md": "<a class=\"xref\" href=\"#0\" data-jump=\"s0-1\">1절<\/a>에서 **\"도구는 둘 — 메인 하나, 백업 하나\"**로 정했습니다.\n메인은 정했는데 **백업을 안 정하면 그 결정이 반쪽**입니다.\n메인이 멈춘 날(한도가 차거나, 서비스가 잠깐 죽거나) 하루가 통째로 날아갑니다.\n\n이 절에서 백업 하나를 **무료로** 세워 둡니다. 오늘 쓰지는 않습니다. 열리는 것만 확인합니다."}, {"title": "무엇인가 — 편집기가 아니라 관제센터", "md": "안티그래비티는 구글이 낸 도구입니다. 겉모습은 흔한 코드 편집기인데, **가운데에 놓인 것이 다릅니다.**\n\n| 보통의 편집기 | 안티그래비티 |\n|---|---|\n| 사람이 코드를 한 줄씩 쓴다 | **AI가 계획 → 작성 → 실행 → 확인까지 한다** |\n| AI는 옆에서 거들 뿐 | 사람은 **시키고, 계획을 승인하고, 결과를 검수한다** |\n| 화면의 주인공 = 코드 | 화면의 주인공 = **누가 뭘 하고 있나 보는 현황판** |\n\n**비개발자에게 이게 왜 좋은가** — 코드를 못 읽어도 검수할 수 있게 되어 있습니다.\nAI가 일하면서 **계획서·작업 목록·화면 캡처**를 남깁니다. 코드 대신 그 증거물을 보고 판단합니다.\n\n**화면이 두 개**입니다. 하나는 익숙한 편집기 화면, 다른 하나는 여러 AI가 도는 걸 한눈에 보는 현황판입니다.\n<a class=\"xref\" href=\"#0\" data-jump=\"s0-5\">5절<\/a>에서 말한 **병렬 시야**가 여기서는 화면으로 만들어져 있습니다."}, {"title": "언제 쓰나 — 셋", "md": "1. **메인이 막혔을 때.** 한도가 차거나 서비스가 잠깐 안 될 때. 이게 첫 번째 이유입니다.\n2. **다른 눈이 필요할 때.** 만든 걸 커밋하기 전에 다른 도구에게 한 번 보여 봅니다.\n3. **돈을 더 안 쓰고 싶을 때.** 무료로 들어갈 수 있습니다."}, {"title": "언제 쓰지 않나", "md": "**메인이 잘 돌고 있을 때는 안 씁니다.** 손에 익는 도구를 하나로 유지하는 게 먼저입니다.\n<a class=\"xref\" href=\"#0\" data-jump=\"s0-1\">1절<\/a>에서 본 대로, 도구를 늘려서 좋아진다는 근거는 없습니다."}, {"title": "처음 켤 때 만져야 하는 것 셋", "md": "설정이 세 군데로 나뉘어 있어서 처음에 가장 헷갈립니다. **외우는 문장 하나로 정리됩니다.**\n\n> **보이는 건 전체 설정, 안전은 프로젝트 설정, 두뇌는 대화창 아래.**\n\n| 어디 | 무엇을 정하나 |\n|---|---|\n| **전체 설정** | 테마·글자 크기 같은 겉모습 |\n| **프로젝트 설정** | **안전 등급** — 위험한 명령 전에 물어보게 할지 |\n| **대화창 아래** | 어떤 방식으로 일할지 — **계획을 먼저 세우게 할지** |\n\n### 처음 2주는 이 조합으로 고정합니다\n\n- **계획을 먼저 세우게 하는 모드** — 시작 전에 \"이렇게 하겠습니다\" 문서를 내밉니다. **방향이 틀렸으면 시작하기 전에 잡는 게 가장 쌉니다.**\n- **실행 전에 물어보게 하는 설정** — 느리지만, AI가 무엇을 하는지 배우는 가장 좋은 방법입니다.\n\n익숙해진 뒤에 자잘한 일부터 풀어 줍니다."}, {"title": "📘 말 풀이", "md": "**아티팩트(Artifact, 증거물)**\nAI가 일하면서 남기는 계획서·작업 목록·화면 캡처. **코드를 못 읽어도 검수할 수 있게 해 주는 장치**입니다.\n\n**구현 계획서(Implementation Plan)**\n일을 시작하기 전에 AI가 내미는 \"이렇게 하겠습니다\" 문서. 승인 버튼을 눌러야 실행됩니다."}, {"title": "⚠️ 자주 걸리는 함정", "md": "### 백업을 메인과 동시에 켜 두지 않습니다\n\n가장 중요한 규칙입니다.\n\n> **백업은 \"같이 쓰는 도구\"가 아니라 \"막혔을 때 여는 문\"입니다.**\n\n같은 폴더를 두 도구가 동시에 만지면 **서로 덮어씁니다.** 어느 쪽이 무엇을 고쳤는지 못 따라갑니다.\n그리고 도구를 하나 더 켜 두는 것은 **위험이 더해지는 게 아니라 곱해집니다.** 둘 중 약한 쪽이 나머지 전부의 통로가 됩니다.\n\n**쓰는 순서는 이렇습니다** — 메인으로 만든다 → 메인을 닫는다 → 필요하면 백업을 연다.\n\n### 그 밖\n\n- **에이전트를 처음부터 여러 개 돌립니다.** 동시에 여러 개를 굴릴 수 있게 되어 있지만, **처음엔 하나부터**입니다. 하나도 못 보는데 다섯을 볼 수 없습니다.\n- **안전 설정을 풀어 놓고 시작합니다.** 처음에는 위험한 명령 전에 물어보게 두는 쪽입니다.\n- **화면 이름이 안 맞습니다.** 참고한 안내서는 2026년 7월 기준이라 **버튼 이름이 바뀌었을 수 있습니다** — **[확인 필요]**. 이름이 다르면 만능 검색창(`⌘⇧P`)을 열고 영어로 쳐서 찾습니다."}, {"title": "⚡ 이렇게 하세요", "md": "1. 안티그래비티를 설치하고 구글 계정으로 로그인합니다.\n2. **연습용 빈 폴더 하나**를 만듭니다. 진짜 작업 폴더를 쓰지 않습니다.\n3. 그 폴더를 프로젝트로 연결합니다.\n4. 프로젝트 설정에서 **안전 등급이 \"물어보는 쪽\"인지** 확인합니다.\n5. 대화창에 아래를 붙여넣습니다.\n\n```\n이 프로젝트 폴더의 구조를 설명해줘.\n그리고 지금 네가 내 컴퓨터에서 할 수 있는 일과 할 수 없는 일을\n각각 세 줄로 알려줘.\n```\n\n6. 답이 오면 **거기까지입니다. 닫습니다.**\n   오늘 할 일은 \"막혔을 때 열 문이 있다\"를 확인하는 것뿐입니다."}, {"title": "✅ 됐는지 확인", "md": "- [ ] 로그인 뒤 **내 계정 이름이 화면에 보이나**\n- [ ] 연습용 폴더가 **프로젝트 목록에 이름으로 보이나**\n- [ ] 위 프롬프트에 **답이 돌아왔나**\n- [ ] 안전 등급이 **\"물어보는 쪽\"으로 되어 있는 것을 눈으로 봤나**\n- [ ] 확인 뒤 **닫았나** (메인과 같이 켜 두지 않았나)\n\n마지막 항목이 «아니오»면 지금 닫습니다."}, {"title": "🔎 더 깊이", "md": "- 직접 정리해 둔 안내서가 있다면 그걸 먼저 봅니다. 도구 화면은 자주 바뀌므로 **안내서의 기준일을 확인**하고, 화면 이름이 다르면 공식 문서를 따릅니다.\n- 검색해 볼 말 — `Antigravity agent manager`, `Antigravity security preset`\n- 두 도구가 **서로의 지침 파일을 읽지 않는** 문제는 <a class=\"xref\" href=\"#3\">Stage 3<\/a>에서 다룹니다."}]}, {"file": "8-어디서든.md", "id": "s0-8", "no": "8", "title": "어디서든 — 밖에서 내 작업을 이어받기", "through": "남의 서버에서 도는 것과, 내 컴퓨터를 멀리서 켜는 것은 다르다.", "time": "30분", "need": ["스마트폰", "GitHub 계정"], "head": "", "secs": [{"title": "왜 이걸 하나", "md": "<a class=\"xref\" href=\"#0\" data-jump=\"s0-5\">5절<\/a>에서 **창을 닫아도 일이 계속 도는 것**까지 왔습니다.\n그런데 아직 **컴퓨터 앞을 떠나면 볼 수가 없습니다.** 돌고 있는지, 막혀서 나를 기다리는지 모릅니다.\n\n여기서 **밖에서 들여다보고 이어받는 세 가지 길**을 구분합니다.\n이름이 서로 비슷해서 **초보자가 가장 많이 헷갈리는 자리**입니다. 셋을 섞으면 \"왜 내 파일이 안 보이지\"에서 몇 시간을 씁니다."}, {"title": "셋을 한 표로", "md": "| | ① 클라우드에서 돌리기 | ② 내 컴퓨터를 원격 조종 | ③ 세션을 내 쪽으로 끌어오기 |\n|---|---|---|---|\n| **어디서 도나** | 남의 서버 | **내 컴퓨터** | 남의 서버에서 시작 → **내 컴퓨터로 옮김** |\n| **내 컴퓨터가 켜져 있어야 하나** | **아니오** | **예** — 꺼지면 끝 | 끌어온 뒤부터는 **예** |\n| **내 파일에 닿나** | **아니오** — 저장소에 올린 것만 | **예** — 전부 | 끌어온 뒤부터는 **예** |\n| **내 설정·커넥터를 쓰나** | 아니오 | 예 | 끌어온 뒤부터는 예 |\n| **GitHub가 필요한가** | **예** | 아니오 | 예 |\n| **연결이 끊기면** | 계속 돈다 | 내 컴퓨터가 살아 있는 동안 돈다 | — |\n\n### 한 줄로 외우기\n\n> **① 은 빈 작업장을 빌리는 것, ② 는 내 방을 창밖에서 들여다보는 것, ③ 은 빌린 작업장의 일감을 내 방으로 들고 오는 것.**"}, {"title": "① 클라우드에서 돌리기 — 빈 작업장을 빌린다", "md": "내 컴퓨터가 아니라 **바깥 서버에서** 일이 돕니다.\n\n- **내 컴퓨터를 꺼도 됩니다.** 브라우저를 닫아도 계속 돕니다.\n- 대신 **내 것이 아무것도 안 따라옵니다.** 내 설정, 내 폴더, 내가 붙인 커넥터 전부 없습니다.\n- 따라오는 것은 **저장소에 올려 둔 것뿐**입니다. 그래서 GitHub가 필요합니다.\n\n**언제 쓰나** — 내 컴퓨터를 오래 켜 둘 수 없을 때, 또는 내 컴퓨터에 없는 저장소를 손볼 때.\n**언제 안 쓰나** — 내 옵시디언 폴더나 내 커넥터가 필요한 일. **거기엔 그게 없습니다.**"}, {"title": "② 내 컴퓨터를 원격 조종 — 내 방을 창밖에서 본다", "md": "일은 **내 컴퓨터에서** 그대로 돕니다. 나는 휴대폰이나 다른 브라우저로 **들여다보고 지시만** 넣습니다.\n\n- **내 파일, 내 설정, 내 커넥터가 전부 그대로** 있습니다. 이게 가장 큰 장점입니다.\n- 대신 **내 컴퓨터가 켜져 있어야 합니다.** 꺼지면 같이 끝납니다.\n- 그리고 **그 작업 창이 살아 있어야 합니다.** ← 여기서 <a class=\"xref\" href=\"#0\" data-jump=\"s0-5\">5절<\/a>과 이어집니다. 멀티플렉서로 살려 둔 세션이라야 안심하고 자리를 뜰 수 있습니다.\n\n**언제 쓰나** — 내 자료를 쓰는 일을 걸어 놓고 나갈 때. 지하철에서 \"그건 그렇게 하지 마\"를 넣을 때."}, {"title": "③ 세션을 내 쪽으로 끌어오기", "md": "바깥에서 시작한 일을 **내 컴퓨터로 옮겨 이어받는 것**입니다.\n밖에서 대충 밑그림을 그려 놓고, 자리에 앉아 내 자료를 붙여 마무리할 때 씁니다.\n\n**옮기는 순간부터** 내 파일과 내 설정이 붙습니다. 그 전까지는 ①과 같습니다."}, {"title": "📘 말 풀이", "md": "**세션(session)**\n지금 진행 중인 대화 한 덩어리. 이름을 붙여 두면 나중에 그 이름으로 찾아 이어갑니다.\n\n**저장소(repository)**\n내 파일을 인터넷에 올려 두고 이력을 관리하는 곳. 클라우드에서 돌리려면 **여기에 올라간 것만** 따라갑니다."}, {"title": "⚠️ 자주 걸리는 함정", "md": "### 이름이 거의 같은 두 명령을 헷갈립니다\n\n가장 많이 걸리는 자리입니다. 한 글자 차이인데 **하는 일이 정반대**입니다.\n\n| 비슷한 이름 | 실제로 하는 일 |\n|---|---|\n| **원격(remote)** | **바깥 서버에서** 새로 시작 — 내 것은 안 따라옴 |\n| **원격 조종(remote control)** | **내 컴퓨터의** 작업을 밖에서 봄 — 내 것이 전부 있음 |\n\n**\"내 파일이 안 보인다\"의 원인은 거의 항상 이 둘을 바꿔 쓴 것입니다.**\n\n### 그 밖\n\n- **클라우드에서 돌려 놓고 내 커넥터를 기대합니다.** 거기엔 없습니다. 노션도 달력도 안 붙어 있습니다.\n- **저장소에 커밋하지 않은 파일을 클라우드가 볼 거라고 생각합니다.** 안 올린 건 안 따라갑니다.\n- **원격 조종을 켜 놓고 컴퓨터를 재웁니다.** 잠들면 같이 멈춥니다. <a class=\"xref\" href=\"#0\" data-jump=\"s0-5\">5절<\/a>에서 재 본 절전 설정 결과가 여기서 그대로 적용됩니다.\n- **원격에서는 못 쓰는 것이 있습니다.** 화면에서 목록을 골라야 하는 종류의 명령은 밖에서 안 됩니다. 글자로 답이 나오는 것만 됩니다.\n- **밖에서 위험한 작업을 승인합니다.** 작은 화면에서 내용을 다 못 읽고 누르게 됩니다. **배포·삭제는 자리에 앉아서** 합니다."}, {"title": "⚡ 이렇게 하세요", "md": "세 가지를 다 하지 않습니다. **오늘은 ②만** 합니다. 내 자료를 쓰는 게 이 커리큘럼의 방식이기 때문입니다.\n\n1. <a class=\"xref\" href=\"#0\" data-jump=\"s0-5\">5절<\/a>에서 만든 멀티플렉서 세션 안에서 AI를 켭니다.\n2. **원격 조종을 켭니다.** 도구 안에서 원격 관련 명령을 찾으면 됩니다. 모르면 이렇게 물어봅니다.\n\n```\n지금 이 세션을 내 폰이나 브라우저에서 이어서 볼 수 있게 켜줘.\n켜는 명령과 접속하는 방법을 순서대로 알려줘.\n그리고 원격에서 할 수 있는 것과 할 수 없는 것을 각각 세 줄로 알려줘.\n```\n\n3. 10분쯤 걸리는 일을 시켜 놓고 **컴퓨터에서 손을 뗍니다.**\n4. **휴대폰으로** 접속해서 진행 상황을 봅니다.\n5. 휴대폰에서 짧은 지시를 하나 넣어 봅니다 — 예: *\"지금 어디까지 했는지 세 줄로 알려줘.\"*"}, {"title": "✅ 됐는지 확인", "md": "- [ ] 휴대폰 화면에 **내 세션 이름이 보이나**\n- [ ] 컴퓨터에서 보던 것과 **같은 내용이 폰에 보이나**\n- [ ] 폰에서 넣은 지시에 **답이 돌아왔나**\n- [ ] ①②③ 셋 중 **어느 것이 내 파일에 닿는지** 표를 안 보고 말할 수 있나\n- [ ] \"원격\"과 \"원격 조종\"의 **차이를 한 문장으로 말할 수 있나**\n\n넷째·다섯째가 «아니오»면 위의 표로 돌아갑니다. **이 구분을 못 하면 Stage 8에서 계속 막힙니다.**"}, {"title": "🔎 더 깊이", "md": "- 이 절은 **<a class=\"xref\" href=\"#8\">Stage 8 자율 운영<\/a>의 예고편**입니다. 거기서는 한 걸음 더 갑니다 — 내가 보러 가지 않아도 **문제가 생겼을 때 나를 부르는** 구조, 그리고 정해진 시각에 알아서 도는 구조.\n- 지금은 \"밖에서 볼 수 있다\"까지면 충분합니다. \"안 봐도 된다\"는 Stage 8입니다.\n- 셋의 차이는 공식 문서의 「원격·클라우드」 절에 정리돼 있습니다. **이름이 비슷해 헷갈리니 표로 옮겨 적어 두세요.**\n- 검색해 볼 말 — `remote control session`, `cloud session repo only`"}]}]}, {"folder": "01-시장", "key": "1", "name": "시장", "color": "#2C5FA8", "sub": "수요와 니즈를 읽는다", "goal": "만들기 전에 팔릴지 숫자로 답한다", "makes": "사업 한 장 · 고객 둘 · 시장 조사 결과", "time": "3~4시간", "need": ["Stage 0의 볼트 폴더"], "head": "만드는 것이 재미있어서 시장을 건너뛰면, 다 만들고 나서 살 사람이 없다는 걸 알게 됩니다.\n이 장은 **안 만들 이유를 먼저 찾는** 장입니다.", "metasecs": [{"title": "✅ 자가 체크", "md": "- [ ] 내 사업을 **한 장**으로 적었나 (문제 · 고객 · 해법 · 돈 버는 법)\n- [ ] 고객 둘에 **이름과 하루 일과**를 붙였나\n- [ ] AI가 준 숫자 중 하나를 **원문까지 열어서** 확인해 봤나\n- [ ] 「이러면 안 만든다」는 조건을 하나 적었나"}, {"title": "다음으로", "md": "여기서 나온 **사업 한 장**이 Stage 2에서 요구사항 문서의 첫 쪽이 됩니다."}], "sections": [{"file": "1-바이브코딩.md", "id": "s1-1", "no": "1", "title": "바이브 코딩과 에이전틱 엔지니어링", "through": "바이브 코딩은 바닥을 올리고, 에이전틱 엔지니어링은 천장을 지킨다.", "time": "25분", "need": [], "head": "", "secs": [{"title": "왜 이걸 하나", "md": "이 학습웹의 이름이 「바이브마스터」인데, 정작 **바이브 코딩이 무엇인지** 한 번도 말하지 않고 지나갈 뻔했습니다.\n이 말을 모르면 뒤의 장들이 왜 점점 까다로워지는지 이해할 수 없습니다.\n\"그냥 AI한테 시키면 되는 거 아닌가요?\"에서 멈춘 채로 Stage 3의 지침 파일, Stage 7의 검사 장치를 만나면\n**쓸데없이 복잡해 보입니다.** 그런데 그건 복잡한 게 아니라 **다음 단계**입니다.\n\n여기서 지도 한 장을 먼저 봅니다. 지금 내가 어디에 서 있고, 이 커리큘럼이 나를 어디로 데려가는지."}, {"title": "바이브 코딩 — 느낌대로 시킨다", "md": "바이브 코딩은 **코드를 읽지 않고 만드는 방식**입니다.\n\n- 하고 싶은 것을 말로 시킨다\n- AI가 만들어 준다\n- 돌려 본다. 이상하면 \"이상해, 고쳐줘\"라고 말한다\n- 코드가 어떻게 생겼는지는 보지 않는다\n\n들으면 무책임해 보이지만, **이게 문을 열었습니다.**\n평생 코드 한 줄 못 짜던 사람이 주말에 작동하는 화면 하나를 만들어 냅니다.\n\"프로그래밍을 배워야 만들 수 있다\"는 오래된 조건이 사라진 겁니다.\n\n이걸 한 문장으로 하면 — **바이브 코딩은 바닥을 올립니다.** 못 하던 사람이 하게 됩니다."}, {"title": "그런데 말을 만든 사람이 방향을 바꿨다", "md": "「바이브 코딩」이라는 말을 처음 쓴 사람은 안드레이 카파시(Andrej Karpathy)입니다.\n그리고 **2026년 4월 30일, 본인이 방향을 바꿨습니다.** 이제 그가 쓰는 말은 **에이전틱 엔지니어링**입니다.\n\n왜 바꿨을까요. 바이브 코딩으로 만든 것들이 **작동은 하는데 오래 못 갔기 때문**입니다.\n\n- 화면은 나오는데, 다음 주에 기능 하나를 더 붙이려니 전부 무너진다\n- 어디가 왜 그런지 아무도 모른다 — 만든 사람도 모른다\n- 결제나 로그인처럼 **틀리면 안 되는 것**에 닿는 순간 손을 뗄 수가 없다\n\n에이전틱 엔지니어링은 그 반대편입니다.\n**AI에게 무엇을 읽히고, 어떤 순서로 돌리고, 무엇을 통과해야 넘어가게 할지를 사람이 설계하는 것.**\n코드를 한 줄씩 쓰는 게 아니라, **AI가 일하는 조건을 만드는 일**입니다.\n\n이걸 한 문장으로 하면 — **에이전틱 엔지니어링은 천장을 지킵니다.** 잘하던 사람이 더 크게 합니다."}, {"title": "바닥과 천장 — 같은 도구, 다른 자리", "md": "| | 바이브 코딩 | 에이전틱 엔지니어링 |\n|---|---|---|\n| 무엇을 올리나 | **바닥** — 못 하던 사람이 하게 됨 | **천장** — 하던 사람이 더 크게 함 |\n| 코드를 보나 | 안 본다 | 다 안 봐도 되지만, **무엇을 검사할지는 정한다** |\n| AI에게 주는 것 | 그때그때 말 | 문서 · 규칙 · 검사 장치 |\n| 잘 맞는 일 | 시제품, 혼자 쓰는 것, 하루짜리 실험 | 남이 돈 내고 쓰는 것, 다음 달에도 고쳐야 하는 것 |\n| 실패하는 자리 | 두 번째 기능을 붙일 때 | 첫 화면을 못 띄우고 준비만 하다 끝날 때 |\n\n**둘 중 하나를 고르는 문제가 아닙니다.** 순서의 문제입니다."}, {"title": "비개발자는 바닥에서 시작해 천장 쪽으로 걷는다", "md": "당신은 지금 바닥 쪽에 서 있습니다. 그건 나쁜 자리가 아니라 **출발선**입니다.\n이 커리큘럼 전체가 그 걸음입니다.\n\n| 어디쯤 | 무슨 장 | 무엇이 바뀌나 |\n|---|---|---|\n| 바닥 | Stage 0~1 | 시켜 보고, 만들 것을 정한다 |\n| ↓ | Stage 2~3 | AI가 **매번 읽는 문서**가 생긴다 — 말을 반복하지 않게 된다 |\n| ↓ | Stage 4~5 | 감각이 아니라 **규칙**으로 만들고, 결과를 검증하기 시작한다 |\n| ↓ | Stage 6~7 | 남이 쓰는 주소가 생기고, **문 앞에 검사**를 세운다 |\n| 천장 쪽 | Stage 8~10 | 내가 없어도 돌고, 한 일이 다음의 재료가 된다 |\n\nStage 10에 도착했을 때 당신이 하는 일은 코드 쓰기가 아닙니다.\n**AI가 일할 조건을 만드는 일** — 그게 에이전틱 엔지니어링입니다."}, {"title": "그런데 왜 첫 장이 「시장」인가", "md": "바이브 코딩이 바닥을 내려 준 결과, **만드는 것 자체는 더 이상 어려운 일이 아니게 됐습니다.**\n그래서 어려운 일이 옮겨 갔습니다 — **무엇을 만들 것인가**로.\n\n주말에 만들 수 있는 사람이 수만 명이면, 만들 수 있다는 건 강점이 아닙니다.\n**살 사람이 있는 것을 골랐는가**가 강점입니다. 그래서 이 장이 첫 장입니다."}, {"title": "📘 말 풀이", "md": "**바이브 코딩 (vibe coding)**\n코드를 읽지 않고 말로 시켜서 만드는 방식. 만드는 속도는 빠르지만, 만든 것을 오래 유지하기는 어렵습니다.\n\n**에이전틱 엔지니어링 (agentic engineering)**\nAI에게 무엇을 읽히고 어떤 순서로 돌릴지를 사람이 설계하는 방식. 코드를 쓰는 대신 **AI가 일하는 조건**을 만듭니다.\n\n**에이전트 (agent)**\n한 번 묻고 한 번 답하는 게 아니라, 스스로 여러 단계를 밟아 일을 끝까지 해내는 AI. 찾아보고, 고치고, 다시 확인합니다."}, {"title": "⚠️ 자주 걸리는 함정", "md": "- **바이브 코딩만으로 끝까지 가려는 것** — 혼자 쓸 것이면 괜찮습니다. 그런데 남에게 돈을 받는 순간, \"왜 그런지 모른다\"는 그대로 사고가 됩니다.\n- **\"코드를 안 본다 = 확인도 안 한다\"로 읽는 것** — 코드를 안 봐도 됩니다. 하지만 **결과가 맞는지는 반드시 봐야 합니다.** 무엇을 확인할지 정하는 게 사람 몫입니다.\n- **천장부터 시작하려는 것** — 첫날부터 문서와 규칙과 검사 장치를 다 갖추려다 **아무것도 못 만들고 지칩니다.** 먼저 하나를 만들어 보고, 아플 때 그 자리에 장치를 답니다.\n- **도구를 바꾸면 해결될 거라 믿는 것** — 바닥에서 천장까지의 거리는 도구가 아니라 **방식**이 줄입니다."}, {"title": "⚡ 이렇게 하세요", "md": "1. 만들고 싶은 것을 **한 문장**으로 적습니다. 지금은 거칠어도 됩니다. (예: \"○○하는 사람이 △△를 쉽게 하게 해 주는 웹서비스\")\n2. Stage 0에서 만든 볼트 폴더 안에 `docs/` 폴더를 만들고, 그 한 문장을 `docs/한줄.md`로 저장합니다.\n3. 쓰는 AI 도구를 열고 아래를 붙여넣습니다. **내 위치를 스스로 진단하는 프롬프트**입니다.\n\n```\n나는 코드를 못 쓰는 직장인이고, 웹서비스 하나를 만들어 팔아 보려고 한다.\n만들고 싶은 것: [여기에 내 한 문장]\n\n두 가지 방식이 있다고 들었다.\n- 바이브 코딩: 코드를 안 보고 말로 시켜서 빠르게 만드는 방식\n- 에이전틱 엔지니어링: AI가 읽을 문서와 규칙, 검사 장치를 먼저 만들어 두는 방식\n\n내가 만들려는 것을 기준으로 답해줘.\n1. 처음 2주는 어느 방식이 맞나. 이유 한 줄.\n2. 어느 시점부터 두 번째 방식이 필요해지나. 그 신호를 3개만.\n3. 지금 내가 절대 바이브 코딩으로 하면 안 되는 부분이 있나. 있으면 이유까지.\n\n전문 용어는 쓰지 말고, 중학생에게 설명하듯 써줘.\n```\n\n4. 답에서 **\"이 부분은 바이브 코딩으로 하면 안 된다\"**고 나온 항목을 `docs/한줄.md` 아래에 옮겨 적어 둡니다. Stage 2에서 「안 만들 것」을 정할 때 씁니다."}, {"title": "✅ 됐는지 확인", "md": "- [ ] 바이브 코딩과 에이전틱 엔지니어링의 차이를 **\"바닥\"과 \"천장\"이라는 말로** 한 문장씩 말할 수 있나\n- [ ] `docs/한줄.md` 파일이 볼트 폴더 안에 **실제로 만들어져 있나**\n- [ ] 그 파일에 내가 만들려는 것이 **한 문장**으로 적혀 있나\n- [ ] AI가 짚어 준 \"바이브 코딩으로 하면 안 되는 부분\"이 **최소 하나** 적혀 있나\n\n하나라도 «아니오»면 이 절을 다시 봅니다."}, {"title": "🔎 더 깊이", "md": "- 검색해 볼 말 — `vibe coding`, `agentic engineering`, `Karpathy vibe coding`\n- 카파시가 방향을 바꾼 정확한 발언 원문과 맥락은 **[확인 필요]** — 본인 계정의 2026-04-30 글을 직접 찾아 읽어 보세요. 남이 요약한 것 말고 원문을.\n- 「AI가 일할 조건을 만든다」가 실제로 무엇인지는 <a class=\"xref\" href=\"#3\">Stage 3<\/a>에서 손으로 만듭니다.\n- 도구를 몇 개 쓸지 아직 안 정했다면 <a class=\"xref\" href=\"#0\">Stage 0<\/a>의 「도구 지도」로 먼저 돌아갑니다."}]}, {"file": "2-린캔버스.md", "id": "s1-2", "no": "2", "title": "사업을 한 장으로 — 린 캔버스", "through": "한 장을 못 채우면 아직 모르는 것이다.", "time": "40분", "need": ["Stage 0의 볼트 폴더", "1절의 docs/한줄.md"], "head": "", "secs": [{"title": "왜 이걸 하나", "md": "머릿속에 있을 때 사업 아이디어는 항상 그럴듯합니다. **적어 놓으면 안 그렇습니다.**\n\n한 장으로 적어 보면 세 가지가 드러납니다 — 아직 안 정한 것, 정했다고 착각한 것, 근거가 없는 것.\n이걸 만들기 전에 알면 **하루면 고칩니다.** 다 만들고 알면 몇 달을 버립니다.\n\n그리고 실무적인 이유가 하나 더 있습니다. **이 한 장이 다음 장의 첫 쪽입니다.**\nStage 2에서 요구사항 문서를 쓸 때, 이 종이가 없으면 문서의 첫 문단부터 막힙니다."}, {"title": "다섯 질문부터 — 한 장의 뼈대", "md": "정식 이름은 「린 캔버스」이고 아홉 칸입니다. 그런데 처음에는 **다섯 개만** 채워도 됩니다.\n나머지는 이 다섯이 정해지면 따라옵니다.\n\n| # | 질문 | 답을 쓰는 법 |\n|---|---|---|\n| 1 | **누구의 무슨 문제인가** | 사람 + 상황 + 불편. \"바쁜 사람이 불편하다\"는 답이 아닙니다 |\n| 2 | **그 사람은 지금 어떻게 하고 있나** | 지금 이미 무언가로 해결 중입니다. 그게 진짜 경쟁자입니다 |\n| 3 | **내 해법은 무엇인가** | 세 줄 안. 길어지면 아직 안 좁혀진 겁니다 |\n| 4 | **돈은 어디서 나오나** | 누가 · 얼마를 · 얼마나 자주 |\n| 5 | **안 할 것은 무엇인가** | 이게 없으면 끝없이 커집니다 |\n\n**2번 「지금 어떻게 하고 있나」가 가장 자주 비어 있습니다.**\n아무도 아무 방법 없이 참고만 있지 않습니다. 엑셀로, 카톡으로, 아르바이트를 써서, 아니면 그냥 포기하고.\n그 방법보다 내 것이 나아야 바꿉니다. **\"아무것도 없다\"는 답이 나오면 시장이 없는 겁니다.**"}, {"title": "나머지 네 칸", "md": "다섯이 채워졌으면 이어서 씁니다.\n\n| 칸 | 무엇 |\n|---|---|\n| **한 줄 가치 제안** | 처음 보는 사람이 10초 안에 이해하는 한 문장. 형용사 말고 결과로 |\n| **어디서 만나나** | 이 사람들이 실제로 있는 곳. \"SNS\"는 답이 아니고 \"○○ 커뮤니티\"가 답입니다 |\n| **드는 돈** | 매달 나가는 것과 한 번 나가는 것을 나눠 적습니다 |\n| **무엇이 오르면 잘되는 건가** | 딱 하나. 이건 6절에서 자세히 정합니다 |\n| **따라 하기 어려운 이유** | 없으면 «없음»이라고 적습니다. 지어내면 안 됩니다 |"}, {"title": "빈칸이 정보다", "md": "여기가 핵심입니다. **빈칸을 부끄러워하면 이 작업은 실패합니다.**\n\n한 장을 채우는 목적은 종이를 예쁘게 만드는 게 아니라, **내가 무엇을 모르는지 눈으로 보는 것**입니다.\n그래서 이 절의 프롬프트는 두 개입니다 — 하나는 채우게 하고, **하나는 빈칸을 지적하게 합니다.**\n두 번째가 더 중요합니다.\n\nAI에게 채우라고만 시키면 **아홉 칸을 전부 그럴듯하게 채워 줍니다.** 빈칸이 사라집니다.\n그게 가장 위험한 결과물입니다. 모르는 걸 모른 채로 다음 장에 들고 가게 되니까요."}, {"title": "📘 말 풀이", "md": "**린 캔버스 (Lean Canvas)**\n사업 하나를 아홉 칸짜리 종이 한 장에 적는 양식. 사업계획서 40쪽 대신 한 장으로 보고, 틀리면 그 자리에서 고칩니다.\n\n**가치 제안 (UVP, Unique Value Proposition)**\n\"왜 다른 것 말고 이걸 써야 하나\"에 대한 한 문장 답. 기능 설명이 아니라 **고객이 얻는 결과**로 씁니다.\n\n**따라 하기 어려운 이유 (Unfair Advantage)**\n남이 돈과 시간을 들여도 쉽게 복제 못 하는 것. 기술은 대개 여기 해당하지 않습니다. 관계·데이터·오래 쌓은 신뢰가 여기 옵니다."}, {"title": "⚠️ 자주 걸리는 함정", "md": "- **해법부터 쓰는 것** — 대부분 여기서 시작합니다. \"이런 걸 만들면 좋겠다\"에서 출발하면 문제를 해법에 맞춰 지어내게 됩니다. **1번 칸을 먼저 채우고, 그 뒤에 3번을 봅니다.**\n- **고객을 \"모두\"로 두는 것** — \"직장인 전부\"는 고객이 아닙니다. 모두를 위한 서비스는 아무에게도 안 팔립니다.\n- **AI가 채워 준 캔버스를 그대로 저장하는 것** — 빈칸이 없는 캔버스는 완성된 게 아니라 **덮인** 겁니다.\n- **「안 할 것」을 비워 두는 것** — 비워 두면 만드는 도중에 기능이 계속 늘어납니다. 끝나지 않는 프로젝트의 시작점이 여기입니다.\n- **처음부터 완벽하게 쓰려는 것** — 이 종이는 앞으로 여러 번 고칩니다. 오늘 것은 «1차»입니다."}, {"title": "⚡ 이렇게 하세요", "md": "**① 손으로 먼저 5분.** AI를 켜기 전에 다섯 질문에 내 말로 답해 봅니다. 막히는 칸이 어디인지 알아야 AI 답을 판단할 수 있습니다.\n\n**② 채우게 합니다.**\n\n```\n나는 코드를 못 쓰는 직장인이고, 웹서비스 하나를 만들려고 한다.\n\n내가 지금 아는 것:\n- 만들려는 것 한 줄: [여기]\n- 도와주려는 사람: [여기]\n- 그 사람의 불편: [여기]\n- 지금 그 사람이 쓰는 방법: [모르면 \"모름\"이라고 씀]\n- 돈 받는 방식 생각: [모르면 \"모름\"]\n\n이걸로 린 캔버스 아홉 칸을 채워줘. 규칙 셋을 꼭 지켜줘.\n1. 내가 말하지 않은 것을 지어내지 마. 근거가 없으면 그 칸에 \"비어 있음\"이라고 쓰고 왜 비었는지 한 줄로 적어줘.\n2. 각 칸은 3줄을 넘기지 마.\n3. 한국 시장 기준으로 쓰고, 시장 규모 숫자는 지금 넣지 마.\n\n마지막에 \"이 캔버스에서 틀리면 전부 무너지는 가정 1개\"를 골라줘.\n```\n\n**③ 빈칸을 지적하게 합니다. 이게 진짜입니다.**\n\n```\n방금 만든 린 캔버스를 이번엔 반대편에서 봐줘. 너는 이 사업에 투자하지 않기로\n이미 마음먹은 심사역이야.\n\n1. 아홉 칸 중 \"근거 없이 그럴듯하게만 쓰인 칸\"을 전부 골라줘. 칸 이름과 이유 한 줄씩.\n2. 내가 확인하지 않고 사실처럼 쓴 문장을 그대로 인용해서 짚어줘.\n3. 이 캔버스만 보고 \"이건 안 되겠다\"고 말할 근거를 3개 대줘.\n4. 마지막에, 그 3개 중 내가 이번 주 안에 확인할 수 있는 것 1개를 골라주고\n   어떻게 확인하면 되는지 구체적으로 알려줘.\n\n칭찬은 하지 마.\n```\n\n**④ 저장합니다.** `docs/lean-canvas.md`로 볼트 폴더 안에 저장합니다. **빈칸은 빈칸인 채로 둡니다.**\n파일 맨 아래에 「아직 모르는 것」 목록을 만들고 ③에서 나온 지적을 옮겨 적습니다."}, {"title": "✅ 됐는지 확인", "md": "- [ ] `docs/lean-canvas.md` 파일이 볼트 폴더 안에 **실제로 있나**\n- [ ] 「누구의 무슨 문제인가」 칸에 **사람 + 상황 + 불편**이 다 들어 있나\n- [ ] 「지금 그 사람은 어떻게 하고 있나」에 **구체적인 방법 하나**가 적혀 있나 («아무것도 안 한다»는 «아니오»입니다)\n- [ ] 「안 할 것」 칸에 **최소 하나**가 적혀 있나\n- [ ] 파일 아래에 **「아직 모르는 것」 목록**이 있고, 거기 적힌 게 하나 이상인가\n- [ ] AI가 지적한 것 중 **한 군데라도 실제로 고쳤나**\n\n하나라도 «아니오»면 이 절을 다시 봅니다. 특히 마지막 두 개."}, {"title": "🔎 더 깊이", "md": "- 검색해 볼 말 — `Lean Canvas 작성법`, `Running Lean`, `problem interview`\n- 아홉 칸 원본 양식과 그 배경은 애시 모리아(Ash Maurya)의 책 『Running Lean』에 있습니다.\n- 여기 「고객」 칸은 다음 절에서 **이름 있는 사람 둘**로 구체화합니다 → <a class=\"xref\" href=\"#1\" data-jump=\"s1-3\">고객 둘에 이름을 붙인다<\/a>\n- 「무엇이 오르면 잘되는 건가」 칸은 6절에서 정합니다 → <a class=\"xref\" href=\"#1\" data-jump=\"s1-6\">안 만들 이유를 먼저 찾는다<\/a>"}]}, {"file": "3-고객둘.md", "id": "s1-3", "no": "3", "title": "고객 둘에 이름을 붙인다", "through": "AI는 넓게, 사람은 깊게.", "time": "40분", "need": ["docs/lean-canvas.md"], "head": "", "secs": [{"title": "왜 이걸 하나", "md": "\"고객이 누구세요?\"에 **\"30대 직장인이요\"**라고 답하면, 그건 고객이 아니라 통계 구간입니다.\n통계 구간을 위해 만들면 화면 하나를 정할 때마다 막힙니다. 버튼을 크게 할지 작게 할지, 설명을 넣을지 뺄지 — **기준이 없으니까요.**\n\n**딱 두 사람을 선명하게 그려 놓으면 그 결정들이 저절로 풀립니다.**\n\"준호 씨는 출근길 지하철에서 이걸 봅니다\" 한 문장이 있으면, 글씨 크기와 화면 폭이 그 자리에서 정해집니다.\n\n그리고 이 두 사람이 뒤 장에서 계속 불려 나옵니다. Stage 2의 요구사항, Stage 4의 화면, Stage 10의 소개 문구까지."}, {"title": "상상으로 만들면 안 되는 이유", "md": "페르소나를 혼자 앉아서 지어내면, 결국 **나 자신**이 나옵니다.\n내가 불편했던 것, 내가 쓸 만한 가격, 내가 쓰는 도구. 그리고 나는 내 서비스의 고객이 아닐 확률이 높습니다.\n\n그래서 순서를 이렇게 잡습니다.\n\n1. **AI로 넓게** — 있을 법한 고객 유형을 여러 개 만들어 본다 (합성 고객)\n2. **AI로 걸러낸다** — 말이 안 되는 유형을 지운다. 여기까지가 AI의 자리입니다\n3. **사람에게 깊게** — 남은 유형과 비슷한 **진짜 사람 3명**에게 묻는다\n4. **둘로 확정** — 실제로 들은 말로 두 사람을 고칩니다"}, {"title": "합성 고객 — 어디까지만 믿나", "md": "**합성 고객**은 AI가 만들어 낸 가상의 응답자입니다. \"35세 워킹맘이라면 이 상황에서 어떻게 할까\"를 AI가 대신 답합니다.\n싸고 빠릅니다. 하루에 스무 명도 만들 수 있습니다.\n\n그런데 **한계가 분명합니다.**\n\n- **소수 의견이 사라집니다.** AI는 평균적인 답을 냅니다. 그런데 초기 서비스를 실제로 쓰는 사람은 평균이 아니라 **가장 아쉬운 사람**입니다.\n- **예외 상황이 안 나옵니다.** \"회사 보안 정책 때문에 그 사이트가 안 열려요\" 같은 답은 진짜 사람에게서만 나옵니다.\n- **거절 이유를 부드럽게 말합니다.** 진짜 사람은 그냥 안 씁니다. 이유도 안 알려 줍니다.\n\n그래서 규칙은 하나입니다. **합성 고객은 1차 스크리닝까지만.**\n어느 방향을 더 파 볼지 고르는 데까지 씁니다. **\"그래서 이걸 만들자\"는 판단은 사람에게 물어보고 합니다.**\n\n> **AI는 넓게, 사람은 깊게.**"}, {"title": "진짜로 묻는 법 — 세 가지 규칙", "md": "세 명이면 충분합니다. 다만 이렇게 물어야 합니다.\n\n**① 아이디어를 설명하지 않습니다.**\n설명하는 순간 상대는 평가자가 되고, 대부분 예의상 칭찬합니다. **\"좋은데요\"는 정보가 아닙니다.**\n\n**② 미래가 아니라 과거를 묻습니다.**\n\"이런 게 있으면 쓰시겠어요?\" (×) → 미래 의향은 거의 다 «네»입니다.\n\"마지막으로 그 일 때문에 곤란했던 게 언제였어요? 그때 어떻게 하셨어요?\" (○)\n\n**③ 말이 아니라 행동을 받습니다.**\n칭찬은 공짜입니다. 다음 중 하나를 받아야 «진짜 약속»입니다.\n\n| 가짜 약속 | 진짜 약속 |\n|---|---|\n| \"좋아요, 나오면 알려주세요\" | 대기 명단에 **이메일을 직접 적는다** |\n| \"그 정도면 살 만하죠\" | **선결제**하거나 계약 의사를 밝힌다 |\n| \"한번 봐드릴게요\" | 시간을 내서 **30분 통화 약속을 잡는다** |\n| \"우리 회사도 필요할 텐데요\" | **결정권자를 소개해 준다** |"}, {"title": "JTBD — 사람들은 무엇을 시키려고 이걸 쓰나", "md": "사람은 제품을 사는 게 아니라 **일을 시키려고 고용합니다.**\n드릴을 사는 사람은 드릴이 갖고 싶은 게 아니라 **벽에 구멍**이 필요합니다.\n\n이걸 문장 하나로 적습니다.\n\n> **[언제·어떤 상황]에서 [무엇]을 하고 싶은데, [무엇] 때문에 막힌다. [어떤 결과]가 되면 좋겠다.**\n\n이 문장이 왜 중요하냐면 — **경쟁자가 여기서 드러납니다.**\n같은 일을 시키는 다른 방법이 전부 경쟁자입니다. 엑셀도, 아르바이트도, \"그냥 포기하기\"도."}, {"title": "📘 말 풀이", "md": "**페르소나 (persona)**\n내 고객을 대표하는 **이름 있는 한 사람**. 나이·직업·하루 일과·불편·예산까지 적습니다. 여러 명을 한 명으로 압축한 것이지 통계 구간이 아닙니다.\n\n**합성 고객 (synthetic customer)**\nAI가 만들어 낸 가상의 응답자. 넓게 훑어보는 데는 쓸 만하지만, 소수 의견과 예외 상황을 실제보다 적게 보여 줍니다. **1차 스크리닝까지만.**\n\n**JTBD (Jobs to be Done, 할 일 이론)**\n고객은 제품을 사는 게 아니라 **어떤 일을 해내려고 제품을 고용한다**는 관점. 이렇게 보면 진짜 경쟁자가 보입니다."}, {"title": "⚠️ 자주 걸리는 함정", "md": "- **지인에게 묻는 것** — 가족과 친구는 상처 주기 싫어서 다 좋다고 합니다. **가장 비싼 실패가 여기서 시작됩니다.**\n- **합성 고객의 답을 인터뷰 결과로 저장하는 것** — 파일에 섞이면 몇 주 뒤에 어느 게 사람 말이었는지 구분이 안 됩니다. **출처를 반드시 적어 둡니다.**\n- **\"쓰시겠어요?\"라고 묻는 것** — 미래 의향은 거의 전부 «네»로 돌아옵니다. 아무 정보가 없습니다.\n- **페르소나를 넷 이상 만드는 것** — 셋을 넘으면 결정에 못 씁니다. **둘이면 충분합니다.**\n- **예산 칸을 비워 두는 것** — 얼마까지 낼 수 있는지 모르면 6절의 손익분기 계산을 못 합니다."}, {"title": "⚡ 이렇게 하세요", "md": "**① 넓게 — 합성 고객으로 후보 뽑기**\n\n```\n내 서비스의 고객 후보를 넓게 훑어보고 싶다.\n\n서비스: [한 줄]\n해결하려는 불편: [한 줄]\n\n있을 법한 고객 유형 6개를 만들어줘. 유형마다:\n- 어떤 상황의 사람인지 (직업·환경·하루 중 언제 이 불편을 겪나)\n- 지금 이 문제를 어떤 방법으로 버티고 있나\n- 돈을 낼 이유가 있나 / 없나 — 있으면 왜, 없으면 왜\n\n그 다음 이렇게 해줘.\n1. 6개 중 \"돈을 낼 이유가 약한\" 유형을 골라내고 이유를 말해줘.\n2. 남은 유형 중 서로 가장 다른 2개를 추천해줘.\n3. 마지막에 경고를 붙여줘 — 이 답변은 네가 지어낸 가상 응답이고,\n   실제 사람에게 확인하기 전까지는 가설이라는 것을.\n```\n\n**② 좁게 — 진짜 사람에게 물을 질문 만들기**\n\n```\n위에서 고른 고객 유형 2개에게 실제로 물어볼 질문 5개를 만들어줘.\n\n지켜야 할 규칙:\n- 내 아이디어를 설명하지 않는 질문일 것\n- 미래 의향(\"쓰시겠어요?\")을 묻지 말 것. 전부 과거 행동을 묻는 질문으로\n- 예/아니오로 끝나지 않는 질문으로\n- 마지막 질문은 \"행동\"을 요청하는 것으로 (연락처, 다음 통화 약속, 소개)\n\n질문마다 \"이 질문으로 알아내려는 것\"을 한 줄로 붙여줘.\n```\n\n**③ 세 명에게 묻습니다.** 지인 말고. 관련 커뮤니티·모임·업무로 아는 사람 중에서. **30분이면 됩니다.**\n\n**④ 둘로 확정하고 저장합니다.** `docs/personas.md`에 두 사람을 씁니다. 각각 이 항목으로.\n\n- 이름(가명) · 나이대 · 하는 일 · **하루 중 이 불편을 겪는 시각**\n- 지금 쓰는 방법\n- 가장 큰 불편 — **인터뷰에서 실제로 들은 말 그대로 한 문장 인용**\n- 낼 수 있는 돈\n- JTBD 한 문장\n- **출처 표시** — `[사람 인터뷰 · 2026-09-○○]` 또는 `[합성 고객 · 미검증]`"}, {"title": "✅ 됐는지 확인", "md": "- [ ] `docs/personas.md`에 사람이 **둘** 있나 (셋 이상이면 줄입니다)\n- [ ] 각 페르소나에 **하루 중 언제 이 불편을 겪는지**가 시각으로 적혀 있나\n- [ ] 각 항목에 **[사람 인터뷰] / [합성 고객]** 출처 표시가 붙어 있나\n- [ ] 진짜 사람 **세 명**과 이야기했나\n- [ ] 인터뷰에서 들은 말 중 **그대로 인용한 문장**이 최소 하나 있나\n- [ ] 「가짜 약속 / 진짜 약속」 표에서 **진짜 약속을 하나라도 받았나** — 못 받았으면 «아니오»라고 적어 둡니다. 이건 6절에서 씁니다"}, {"title": "🔎 더 깊이", "md": "- 검색해 볼 말 — `mom test 인터뷰`, `jobs to be done 예시`, `customer discovery interview`\n- 묻는 법 하나만 더 읽는다면 롭 피츠패트릭(Rob Fitzpatrick)의 『The Mom Test』. **\"엄마한테 물어봐도 진실이 나오는 질문\"**을 만드는 법입니다.\n- 합성 고객이 소수 의견을 얼마나 놓치는지에 대한 정량 근거는 **[확인 필요]** — 지금은 \"1차 스크리닝까지만\"이라는 운영 원칙으로만 씁니다.\n- 여기서 만든 두 사람이 <a class=\"xref\" href=\"#2\">Stage 2<\/a> 요구사항 문서의 「누가 쓰나」 절이 됩니다."}]}, {"file": "4-시장크기.md", "id": "s1-4", "no": "4", "title": "시장을 재는 법 — 얼마나 큰가", "through": "아래에서 위로 잰 숫자만 믿는다.", "time": "35분", "need": ["docs/lean-canvas.md", "docs/personas.md"], "head": "", "secs": [{"title": "왜 이걸 하나", "md": "\"이 시장 10조원이래요\"는 아무 결정도 도와주지 않습니다.\n내가 알아야 하는 건 **내가 1년 안에 몇 명에게 닿을 수 있고, 그 사람들이 얼마를 내는가**입니다.\n\n이 숫자를 안 재고 만들기 시작하면, 다 만든 뒤에 \"월 3만원 나오는 사업이었네\"를 알게 됩니다.\n**만들기 전에 곱셈 한 줄이면 알 수 있는 것**입니다."}, {"title": "세 개의 원 — 급식실 비유", "md": "시장 크기는 세 겹입니다. 학교 급식실로 바꿔 보겠습니다.\n\n| 이름 | 뜻 | 급식실로 | 누가 쓰나 |\n|---|---|---|---|\n| **TAM** | 이 분야 전체 | **전교생 전부** | 투자자에게 설명할 때 |\n| **SAM** | 그중 내가 서비스할 수 있는 범위 | 우리 급식실에 **올 수 있는 학년** | 방향을 정할 때 |\n| **SOM** | 1년 안에 실제로 닿을 수 있는 곳 | **오늘 점심에 실제로 온 사람** | **내가 결정할 때** |\n\n**혼자 시작하는 사람에게는 SOM이 전부입니다.** 나머지 둘은 설명용입니다."}, {"title": "재는 방법이 두 가지다 — 그리고 하나만 믿습니다", "md": "### 위에서 아래로 (top-down)\n\n큰 숫자에서 시작해 비율로 깎아 내려옵니다.\n\n> 국내 이 분야 시장이 1조원 → 그중 우리 같은 형태가 10% → 그중 1%를 가져오면 → **10억원**\n\n빠르고, 크게 나오고, **거의 항상 틀립니다.**\n문제는 \"1%\"입니다. 그 1%를 **무슨 수로** 가져오는지가 어디에도 없습니다.\n1%는 계산이 아니라 희망입니다.\n\n### 아래에서 위로 (bottom-up)\n\n**내가 실제로 할 수 있는 행동**에서 시작해 곱해 올라갑니다.\n\n> 내가 글을 올리는 커뮤니티에 사람이 3,000명 있다 →\n> 한 달에 그중 5%가 내 소개를 본다 = 150명 →\n> 그중 4%가 결제한다 = **6명** →\n> 6명 × 월 1만원 × 12개월 = **연 72만원**\n\n숫자가 작아서 기분이 나쁩니다. 그런데 **이게 진짜입니다.**\n그리고 이 방식에는 결정적인 장점이 있습니다 — **각 단계를 내가 손댈 수 있습니다.**\n커뮤니티를 늘릴지, 노출을 늘릴지, 전환을 올릴지, 가격을 올릴지가 곱셈에 그대로 보입니다.\n\n> ⚠️ **아래에서 위로 잰 숫자만 믿으세요.** 위에서 아래로 잰 큰 숫자는 투자 설명 자료에나 쓰입니다.\n\n### 둘 다 재는 이유\n\n그럼 위에서 아래로는 왜 재느냐 — **차이를 보려고** 잽니다.\n두 숫자가 **10배 이상 벌어지면** 둘 중 하나가 틀린 겁니다. 어느 쪽이 틀렸는지 찾는 것이 이 절의 진짜 작업입니다.\n\n대개 이렇습니다. 위쪽이 크게 나오면 \"1%\"가 근거 없는 것이고,\n아래쪽이 크게 나오면 **전환율을 너무 후하게 잡은 것**입니다."}, {"title": "곱셈 한 줄로 적는다", "md": "내 SOM은 반드시 이 모양이어야 합니다.\n\n```\n닿을 수 있는 사람 수 × 그중 실제로 사는 비율 × 가격 × 기간 = 얼마\n```\n\n각 항목마다 **\"이 숫자를 어디서 가져왔나\"**를 한 줄로 붙입니다.\n\"보통 이 정도라고 함\"은 근거가 아닙니다. 근거가 없으면 그 자리에 **[확인 필요]**라고 적습니다."}, {"title": "📘 말 풀이", "md": "**TAM (Total Addressable Market, 전체 시장)**\n이 분야에서 돈이 오가는 전체 크기. 지리·언어·법 제약을 다 무시했을 때의 최대치입니다. 결정에는 거의 안 씁니다.\n\n**SAM (Serviceable Available Market, 서비스 가능 시장)**\n그중 내가 실제로 서비스할 수 있는 범위. 한국어만 되면 한국만, 카드 결제만 되면 카드 쓰는 사람만입니다.\n\n**SOM (Serviceable Obtainable Market, 획득 가능 시장)**\n1년 안에 내 채널과 내 시간으로 실제로 닿을 수 있는 크기. **혼자 시작하는 사람이 볼 유일한 숫자**입니다."}, {"title": "⚠️ 자주 걸리는 함정", "md": "- **\"1%만 가져와도\" 화법** — 시장이 클수록 1%는 더 어렵습니다. 큰 시장에는 이미 큰 회사가 있습니다. **1%를 어떻게 가져오는지 못 적으면 그 숫자는 없는 겁니다.**\n- **전환율을 후하게 잡는 것** — 본 사람의 몇 %가 결제하는지를 10%, 20%로 잡는 경우가 많습니다. 대부분 그보다 훨씬 낮습니다. **모르면 낮게 잡고 [확인 필요]를 붙입니다.**\n- **닿을 수 있는 사람 수에 \"인구\"를 넣는 것** — 내가 실제로 글을 올리고 말을 걸 수 있는 곳의 사람 수여야 합니다. 대한민국 인구 5천만은 내 채널이 아닙니다.\n- **AI가 준 시장 규모를 그대로 쓰는 것** — 다음 절 전체가 이 이야기입니다. 지금은 이것만 — **출처를 못 연 숫자는 숫자가 아닙니다.**\n- **오래된 숫자** — 시장 자료는 몇 년 전 것이 계속 인용됩니다. **자료의 기준 연도를 반드시 확인합니다.**"}, {"title": "⚡ 이렇게 하세요", "md": "**① 아래에서 위로, 내 손으로 먼저.** AI 없이 곱셈 한 줄을 씁니다. 5분이면 됩니다.\n모르는 칸에는 «모름»이라고 씁니다. 지금은 그게 정답입니다.\n\n**② AI에게 두 방식으로 재게 하고 차이를 설명하게 합니다.**\n\n```\n내 서비스의 시장 크기를 재고 싶다.\n\n서비스: [한 줄]\n고객: [페르소나 두 사람을 한 줄씩]\n가격 생각: [월 얼마 / 건당 얼마]\n내가 사람을 만날 수 있는 곳: [커뮤니티·모임·회사 인맥 등 실제로 있는 것만]\n\n두 가지 방식으로 각각 계산해줘.\n\nA. 위에서 아래로 — 큰 시장 규모에서 비율로 깎아 내려오는 방식\n   숫자를 쓸 때마다 출처 이름과 그 자료의 기준 연도를 함께 써줘.\n   출처를 모르면 숫자를 쓰지 말고 \"출처 없음\"이라고 써줘.\n\nB. 아래에서 위로 — 내가 실제로 닿을 수 있는 사람 수에서 곱해 올라가는 방식\n   곱하는 단계를 전부 보여줘. 각 단계의 비율에 근거가 없으면 \"가정\"이라고 표시해줘.\n\n마지막에:\n1. A와 B의 결과가 몇 배 차이 나는지\n2. 왜 차이가 나는지 — 어느 쪽 가정이 약한지\n3. B의 숫자 중 내가 이번 주에 직접 확인할 수 있는 것 하나\n\n큰 숫자로 나를 설득하려 하지 마.\n```\n\n**③ B(아래에서 위로)의 곱셈만 골라 파일에 적습니다.** `docs/lean-canvas.md` 아래에 「시장 크기」 항목을 만들고 이렇게.\n\n```\nSOM(1년) = 닿을 수 있는 사람 [숫자] × 결제 비율 [숫자] × 가격 [숫자] × 12개월 = [금액]\n  - 닿을 수 있는 사람: 근거 [어디서 왔나]\n  - 결제 비율: 근거 [어디서 왔나 / 없으면 확인 필요]\n  - 가격: 근거 [페르소나가 낼 수 있다고 말한 금액]\nTAM/SAM: [숫자] — 출처 [이름 · 기준 연도] / 없으면 확인 필요\n두 방식 차이: [몇] 배 — 약한 가정은 [무엇]\n```"}, {"title": "✅ 됐는지 확인", "md": "- [ ] 내 SOM이 **곱셈 한 줄**로 적혀 있나 (한 개의 큰 숫자만 있으면 «아니오»입니다)\n- [ ] 곱셈의 **각 항목마다 근거 또는 [확인 필요]**가 붙어 있나\n- [ ] 「닿을 수 있는 사람 수」가 **내가 실제로 글을 올릴 수 있는 곳**의 사람 수인가 (인구·가입자 총수면 «아니오»)\n- [ ] 두 방식의 결과가 **몇 배 차이 나는지** 적어 놨나\n- [ ] 그 차이가 10배를 넘는다면, **어느 가정이 약한지** 한 줄로 적었나\n- [ ] SOM 금액을 보고도 **계속할 마음이 있나** — «아니오»면 6절로 바로 갑니다"}, {"title": "🔎 더 깊이", "md": "- 검색해 볼 말 — `TAM SAM SOM bottom-up`, `시장규모 추정 방법`, `전환율 벤치마크`\n- 국내 시장 숫자를 찾을 때 1차 출처가 되는 곳 — 통계청 국가통계포털, 각 부처 백서, 상장사 사업보고서. **보도자료보다 원자료를 봅니다.**\n- 업종별 결제 전환율의 신뢰할 만한 국내 기준값은 **[확인 필요]** — 찾더라도 내 채널의 실제 숫자로 바꿔야 합니다.\n- 이 숫자를 어떻게 검증하는지가 다음 절입니다 → <a class=\"xref\" href=\"#1\" data-jump=\"s1-5\">조사를 AI에게 시키는 법 — 그리고 검증<\/a>"}]}, {"file": "5-조사와검증.md", "id": "s1-5", "no": "5", "title": "조사를 AI에게 시키는 법 — 그리고 검증", "through": "원문을 열어 보기 전까지 그것은 숫자가 아니다.", "time": "50분", "need": ["docs/lean-canvas.md", "인터넷"], "head": "", "secs": [{"title": "왜 이걸 하나", "md": "앞 절에서 시장 크기를 쟀습니다. 그 숫자들이 **어디서 왔는지**를 지금 확인하지 않으면,\nStage 2의 요구사항 문서, Stage 4의 화면, Stage 10의 소개 문구까지 **틀린 숫자 위에 세워집니다.**\n\n그리고 하나 더 — 조사를 시키는 방식 자체가 바뀌었습니다.\n예전에는 한 번 묻고 한 번 답을 받았습니다. 이제는 **AI가 스스로 여러 단계를 돌면서 찾고, 확인하고, 종합합니다.**\n사람이 할 일은 답을 받아 적는 게 아니라 **방향을 주고 결과를 검증하는 것**입니다."}, {"title": "한 번 묻기 → 여러 단계로 스스로 찾아보게 하기", "md": "| | 예전 방식 | 지금 방식 |\n|---|---|---|\n| 사람이 하는 것 | 질문을 잘 쓴다 | **조사 범위와 판단 기준**을 준다 |\n| AI가 하는 것 | 한 번 답한다 | 검색 → 읽기 → 모자란 것 찾기 → 다시 검색 → 종합 |\n| 걸리는 시간 | 몇 초 | 몇 분~수십 분 |\n| 결과물 | 문단 하나 | 출처가 붙은 보고서 |\n| 사람이 그다음 하는 것 | 복사한다 | **출처를 연다** |\n\n이걸 「딥 리서치」라고 부릅니다. 도구마다 이름이 다르지만 하는 일은 같습니다.\n\n**중요한 건 이겁니다.** 여러 단계를 돌게 하면 결과가 길고 그럴듯해집니다.\n**길고 그럴듯한 것이 정확한 것은 아닙니다.** 오히려 틀린 숫자가 숨기 좋아집니다."}, {"title": "조사 브리프 — 질문 대신 이걸 줍니다", "md": "좋은 조사는 좋은 질문이 아니라 **좋은 브리프**에서 나옵니다. 다섯 줄이면 됩니다.\n\n| 줄 | 무엇을 적나 |\n|---|---|\n| **목적** | 이 조사로 어떤 **결정**을 하려는가. \"알아보고 싶다\"는 목적이 아닙니다 |\n| **범위** | 나라 · 기간 · 업종. 넓히면 정확도가 떨어집니다 |\n| **출처 규칙** | 무엇을 쓰고 무엇을 쓰지 말라 — **회사 보도자료·홍보 수치 금지** |\n| **형식** | 표로 · 항목마다 링크와 기준 연도 · 모르면 «모름» |\n| **금지** | 추측을 사실처럼 쓰지 말 것. 근거 없으면 그 칸을 비워 둘 것 |"}, {"title": "⚠️⚠️ 이 장에서 가장 중요한 한 문장", "md": "> **AI가 준 숫자는, 원문을 열어 확인하기 전까지 숫자가 아닙니다.**\n\nAI는 그럴듯한 숫자를 만들어 냅니다. 링크까지 같이 만들어 냅니다.\n그리고 그 링크는 **진짜로 열리기도 합니다.** 다만 열어 보면 그 페이지에 그 숫자가 없습니다.\n\n실제로 자주 일어나는 네 가지입니다.\n\n1. **없는 자료** — 그럴듯한 보고서 이름과 연도가 붙어 있는데, 그런 보고서가 없습니다.\n2. **있는데 다른 숫자** — 링크는 진짜인데, 그 페이지의 숫자는 다른 값입니다.\n3. **맞는데 옛날 것** — 숫자는 맞지만 몇 년 전 기준입니다. 그 사이에 시장이 반토막 났을 수도 있습니다.\n4. **회사가 자기 자랑으로 낸 수치** — \"우리 조사 결과 시장이 이만큼 큽니다\"는 그 회사가 파는 것을 크게 보이게 하려고 만든 숫자입니다.\n\n**그래서 규칙은 하나.** 조사 결과를 파일에 저장하기 전에, **숫자 하나를 골라 링크를 직접 눌러 봅니다.**\n전부 확인하라는 게 아닙니다. **하나면 됩니다.** 하나를 열어 보는 습관이 나머지를 의심하게 만듭니다."}, {"title": "보고서 말고 실제 행동으로 재는 법 — 검색과 입찰", "md": "조사 보고서보다 **훨씬 믿을 만한 것**이 있습니다. **사람들이 실제로 한 행동**입니다.\n\n**① 검색량 추이.** 사람들이 무엇을 얼마나 찾는지는 검색어에 남습니다.\n네이버 데이터랩의 검색어 트렌드, 구글 트렌드로 **내 문제를 가리키는 말**의 추이를 봅니다.\n\n- 볼 것은 절대 숫자가 아니라 **방향**입니다. 오르고 있나, 내려가고 있나, 계절을 타나.\n- 내 서비스 이름 말고 **문제를 표현하는 말**로 검색합니다. 사람들은 해법 이름을 모릅니다.\n- 검색어가 아예 없으면 두 가지 중 하나입니다 — 시장이 없거나, **사람들이 그 문제를 다른 말로 부르거나.**\n\n**② 공공 입찰 정보.** B2B나 기관 대상이면 이게 가장 정직합니다.\n조달청 나라장터에 올라온 입찰 공고와 낙찰 결과에는 **누가 · 무엇에 · 얼마를 실제로 썼는지**가 있습니다.\n\"이 분야에 예산이 있나\"를 추정하지 않고 **확인**할 수 있습니다.\n\n**③ 이미 파는 곳의 가격표.** 경쟁 서비스의 요금 페이지는 그 회사가 **시장에서 검증한 가격**입니다.\n남의 가격표는 시장 조사 보고서보다 정확합니다."}, {"title": "1회성 조사 → 상시로 돌리기", "md": "시장은 한 번 재고 끝나는 게 아닙니다. 만드는 동안에도 바뀝니다.\n그래서 **한 달에 한 번, 같은 질문을 다시 돌립니다.**\n\n- 같은 프롬프트를 `docs/모니터링.md`에 저장해 둡니다\n- 결과를 날짜별로 아래에 이어 붙입니다\n- 보는 것은 값이 아니라 **바뀐 것**입니다 — 새 경쟁자, 사라진 서비스, 바뀐 가격, 새 규제\n\nStage 8에서 이걸 자동으로 돌리게 만듭니다. 지금은 손으로 합니다."}, {"title": "📘 말 풀이", "md": "**딥 리서치 (deep research)**\nAI가 한 번 답하고 끝내는 대신, 검색하고 읽고 모자란 부분을 다시 찾기를 여러 번 반복해 보고서를 만드는 방식. 사람은 방향과 판단 기준만 줍니다.\n\n**환각 (hallucination)**\nAI가 없는 사실을 **자신 있게** 지어내는 것. 숫자·출처·통계에서 가장 자주 나오고, 틀린 티가 안 나는 게 특징입니다.\n\n**1차 출처 (primary source)**\n숫자를 **직접 만든 곳**. 통계기관의 원자료, 회사의 공시 자료, 법령 원문. 그것을 인용한 기사나 블로그는 2차 출처입니다."}, {"title": "⚠️ 자주 걸리는 함정", "md": "- **길고 정돈된 답을 정확한 답으로 착각하는 것** — 표와 소제목이 붙으면 신뢰가 올라갑니다. 형식은 근거가 아닙니다.\n- **링크가 있으니 확인했다고 여기는 것** — 링크의 존재와 내용의 일치는 별개입니다. **눌러야 확인입니다.**\n- **회사 홍보 수치를 시장 규모로 쓰는 것** — 파는 사람이 낸 숫자는 크게 나옵니다. 이 학습웹 본문에서도 이런 수치는 쓰지 않습니다.\n- **기준 연도를 안 보는 것** — \"최근 조사에 따르면\"의 «최근»이 몇 년 전인 경우가 흔합니다.\n- **검색어를 내 서비스 이름으로 잡는 것** — 아직 아무도 모르는 이름입니다. **문제를 표현하는 말**로 봐야 합니다.\n- **조사만 계속하는 것** — 조사는 결정을 위한 것입니다. 이번 주 안에 끝내고 다음으로 갑니다."}, {"title": "⚡ 이렇게 하세요", "md": "**① 조사 브리프를 줍니다.**\n\n```\n시장 조사를 해줘. 결과로 내가 \"이걸 만들지 말지\"를 결정할 거야.\n\n[목적] 다음을 결정한다 — [예: 이 분야에 돈 내는 사람이 실제로 있는가]\n[범위] 한국 / 최근 2년 / [업종·분야]\n[조사할 것]\n  1. 지금 이 문제를 파는 서비스 5개 — 이름, 가격, 대상, 시작한 시기\n  2. 최근 2년 안에 문 닫은 비슷한 서비스가 있나. 있으면 알려진 이유\n  3. 이 분야에 적용되는 한국 법·규제 중 개인이 걸릴 만한 것\n  4. 사람들이 이 문제를 뭐라고 부르는지 — 실제로 쓰는 말 5개\n\n[출처 규칙]\n  - 항목마다 링크와 자료의 기준 연도를 반드시 붙일 것\n  - 회사가 자기 홍보로 낸 수치는 쓰지 말 것. 썼다면 \"홍보 수치\"라고 표시할 것\n  - 못 찾은 항목은 지어내지 말고 \"못 찾음\"이라고 쓸 것\n\n[형식] 표로. 마지막에 \"내가 직접 확인해야 할 항목 3개\"를 골라줄 것\n```\n\n**② 검증합니다. 이 단계를 건너뛰면 앞의 전부가 무효입니다.**\n\n```\n방금 준 결과에서 숫자와 출처만 다시 보자.\n\n1. 네가 쓴 모든 숫자를 목록으로 뽑아줘. 각각에 대해:\n   - 어느 링크의 어느 문장에서 나온 숫자인지\n   - 그 자료의 기준 연도\n   - 1차 출처인지 2차 출처인지\n2. 이 중 네가 \"직접 확인하지 않고 일반적인 지식으로 쓴 것\"이 있으면 전부 표시해줘.\n3. 가장 중요한데 근거가 가장 약한 숫자 하나를 골라줘.\n\n솔직하게. 모르면 모른다고.\n```\n\n**③ 링크 하나를 직접 누릅니다.** ②의 3번에서 고른 숫자의 링크를 브라우저로 엽니다.\n\n- 그 페이지에 **그 숫자가 실제로 있나**\n- **기준 연도**가 AI가 말한 것과 같나\n- 누가 만든 자료인가 — **파는 회사인가, 통계기관인가**\n\n셋 중 하나라도 어긋나면 그 숫자를 파일에서 지우고 **[확인 필요]**로 바꿉니다.\n\n**④ 실제 행동으로 재 봅니다.** 검색어 트렌드 도구에서 ①의 4번에서 받은 **사람들이 실제로 쓰는 말 5개**를 넣고 2년 추이를 봅니다.\n기관·기업 대상이면 나라장터에서 관련 키워드로 최근 입찰 공고를 찾아봅니다.\n\n**⑤ 저장하고, 다음 달 것을 예약해 둡니다.** 결과는 `docs/시장조사.md`, ①의 프롬프트는 `docs/모니터링.md`에 날짜와 함께 저장합니다."}, {"title": "✅ 됐는지 확인", "md": "- [ ] **AI가 준 숫자 하나를 원문 링크까지 열어서 확인했나** — 이게 «아니오»면 이 절은 안 끝난 겁니다\n- [ ] 열어 본 결과, 그 페이지에 **그 숫자가 실제로 있었나**\n- [ ] 확인 안 된 숫자에 **[확인 필요]** 표시를 붙였나\n- [ ] `docs/시장조사.md`의 모든 숫자에 **링크와 기준 연도**가 붙어 있나\n- [ ] 「홍보 수치」로 표시된 항목을 **결정 근거에서 빼놨나**\n- [ ] 검색어 추이를 **직접 눈으로 봤나** — 오르는지 내리는지 한 줄로 적었나\n- [ ] `docs/모니터링.md`에 다음 달에 다시 돌릴 프롬프트가 **저장돼 있나**"}, {"title": "🔎 더 깊이", "md": "- 검색해 볼 말 — `deep research 사용법`, `primary source vs secondary source`, `네이버 데이터랩 검색어 트렌드`, `나라장터 입찰공고 검색`\n- 1차 출처를 찾을 곳 — 통계청 국가통계포털(KOSIS), 금융감독원 전자공시(DART), 국가법령정보센터, 조달청 나라장터.\n- 커넥터를 붙여 두면 이 조사를 **대화 안에서** 바로 돌릴 수 있습니다 → <a class=\"xref\" href=\"#0\">Stage 0<\/a>의 커넥터 절\n- 매달 손으로 돌리는 이 조사를 **예약해서 자동으로** 돌리는 법은 <a class=\"xref\" href=\"#8\">Stage 8<\/a>에서 만듭니다."}]}, {"file": "6-안만들이유.md", "id": "s1-6", "no": "6", "title": "안 만들 이유를 먼저 찾는다", "through": "몇 명이 얼마를 내야 본전인가. 그 답이 비현실적이면 안 만든다.", "time": "40분", "need": ["docs/lean-canvas.md", "docs/personas.md", "docs/시장조사.md"], "head": "", "secs": [{"title": "왜 이걸 하나", "md": "지금까지 다섯 절은 **\"만들 수 있나\"**를 봤습니다. 이 절만 **\"만들지 말아야 하나\"**를 봅니다.\n\n이 질문을 먼저 하는 사람이 적습니다. 재미없으니까요.\n그런데 만들기 시작한 뒤에는 **이 질문을 할 수 없게 됩니다.** 이미 쓴 시간이 아까워서 판단이 흐려집니다.\n그래서 **아직 아무것도 안 만든 지금**이 유일하게 정직하게 답할 수 있는 때입니다.\n\n그리고 이 절의 결과물은 나중에 **미련 없이 방향을 트는 근거**가 됩니다.\n6개월 뒤의 나는 지금의 나보다 훨씬 미련이 많습니다. 지금 적어 두세요."}, {"title": "질문 하나 — 몇 명이 얼마를 내야 본전인가", "md": "계산은 초등학교 산수입니다.\n\n```\n매달 나가는 돈 ÷ (한 사람이 매달 내는 돈 − 한 사람 때문에 매달 더 나가는 돈) = 필요한 사람 수\n```\n\n- **매달 나가는 돈** — 서버·도구 값, 고정으로 나가는 것 전부. **그리고 내 시간.**\n- **한 사람이 매달 내는 돈** — 가격입니다.\n- **한 사람 때문에 더 나가는 돈** — 그 사람이 늘어나서 추가로 드는 비용. AI 호출 값, 결제 수수료, 메일 발송비.\n\n숫자를 넣어 봅니다. 매달 나가는 돈 30만원, 가격 1만원, 한 사람당 추가 비용 2천원이면\n\n> 300,000 ÷ (10,000 − 2,000) = **37.5 → 38명**\n\n**38명.** 이게 본전입니다. 이제 진짜 질문이 나옵니다.\n\n> **4절에서 잰 「1년 안에 닿을 수 있는 사람 수」로, 38명을 만들 수 있나?**\n\n만들 수 있으면 계속합니다. **못 만들면 만들지 않습니다.**\n여기서 흔히 하는 실수는 \"그럼 가격을 올리면 되지\"입니다.\n올려도 됩니다. 다만 **3절의 페르소나가 그 돈을 낼 수 있다고 말했는지** 확인하고 올려야 합니다.\n\n### 내 시간을 0원으로 놓지 않습니다\n\n매달 나가는 돈에 **내 시간**을 반드시 넣습니다.\n주말마다 8시간씩, 한 달 32시간. 그 시간의 값을 얼마로 놓든 0원은 아닙니다.\n\n내 시간을 0으로 놓으면 거의 모든 사업이 본전을 넘습니다. **그래서 아무것도 걸러지지 않습니다.**"}, {"title": "질문 둘 — 한 명 데려오는 데 얼마가 드나", "md": "본전 계산이 통과해도 하나가 남습니다. **그 38명을 공짜로 데려올 수 있는 게 아닙니다.**\n\n한 명을 데려오는 데 드는 것 — 광고비, 콘텐츠 만드는 시간, 답장하는 시간.\n그리고 **한 명이 떠날 때까지 내는 돈의 합**. 둘을 비교합니다.\n\n| 비교 | 뜻 |\n|---|---|\n| 데려오는 데 든 돈 **>** 그 사람이 평생 내는 돈 | **팔수록 손해입니다.** 이 상태로 규모를 키우면 더 빨리 망합니다 |\n| 비슷함 | 위태롭습니다. 한 달만 삐끗해도 마이너스 |\n| 그 사람이 내는 돈이 **3배 이상** | 해 볼 만합니다 |\n\n**아직 고객이 0명이라 계산할 수 없다고요?** 맞습니다. 그래서 **가정으로 적고 표시해 둡니다.**\n\"한 명 데려오는 데 2만원 들 것으로 가정 [확인 필요]\" — 이렇게요.\nStage 10에서 실제 숫자가 들어오면 이 칸을 채웁니다. **가정인 줄 알고 쓰는 것과 모르고 쓰는 것은 다릅니다.**"}, {"title": "무엇이 오르면 계속하나 — 북극성 지표 하나", "md": "볼 숫자를 딱 **하나** 정합니다. 이걸 북극성 지표라고 부릅니다.\n\n좋은 것의 조건 셋입니다.\n\n1. **고객이 실제로 가치를 받았다는 신호일 것** — 가입자 수는 아닙니다. 가입만 하고 안 쓰는 사람이 대부분이니까요.\n2. **이게 오르면 돈이 따라올 것**\n3. **내가 손댈 수 있을 것** — 내 행동으로 바꿀 수 있어야 지표입니다\n\n> **매출은 북극성 지표가 아닙니다.** 매출은 결과입니다. 결과 말고, 결과가 나오기 직전의 것을 봅니다.\n> 예를 들면 «이번 주에 그 기능을 끝까지 써 본 사람 수» 같은 것."}, {"title": "그리고 「이러면 접는다」를 지금 적는다", "md": "가장 중요한 세 줄입니다. 형식은 이렇습니다.\n\n> **[언제까지] [무엇]이 [얼마]에 못 미치면, 나는 [무엇을] 한다.**\n\n예를 들어\n\n- **8주 안에** 돈 내는 사람이 **5명**을 못 넘으면, 만드는 걸 멈추고 고객 인터뷰로 돌아간다\n- **12주 안에** 북극성 지표가 **한 번도** 오르지 않으면, 대상 고객을 바꾼다\n- **6개월 안에** 매달 나가는 돈을 못 넘기면, 이 서비스를 닫고 다른 문제로 옮긴다\n\n세 줄에 반드시 들어가야 할 것 — **날짜 · 숫자 · 내가 할 행동.**\n\"잘 안 되면 접는다\"는 조건이 아닙니다. **«잘 안 되면»은 영원히 안 옵니다.**\n\n**접는다가 곧 실패는 아닙니다.** 접는 조건이 있는 사람은 8주에 방향을 틉니다.\n없는 사람은 2년을 씁니다. **그 차이가 두 번째 시도를 할 수 있느냐를 정합니다.**"}, {"title": "📘 말 풀이", "md": "**손익분기점 (break-even point)**\n버는 돈과 나가는 돈이 같아지는 지점. 「몇 명이 얼마를 내야 본전인가」의 그 숫자입니다.\n\n**고객 획득 비용 (CAC, Customer Acquisition Cost)**\n고객 한 명을 데려오는 데 드는 돈. 광고비만이 아니라 **거기 쓴 내 시간**도 포함합니다.\n\n**북극성 지표 (NSM, North Star Metric)**\n수많은 숫자 중 **이것 하나가 오르면 사업이 잘되고 있는 것**이라고 정한 지표. 하나여야 의미가 있습니다."}, {"title": "⚠️ 자주 걸리는 함정", "md": "- **내 시간을 비용에서 빼는 것** — 가장 흔합니다. 이러면 어떤 사업도 걸러지지 않습니다.\n- **매출을 북극성 지표로 놓는 것** — 매출은 결과라서, 떨어졌을 때 **무엇을 고쳐야 할지 알려 주지 않습니다.**\n- **접는 조건을 나중에 정하겠다고 미루는 것** — 나중의 나는 이미 시간을 많이 쓴 사람입니다. **그때는 못 정합니다.**\n- **접는 조건에 날짜나 숫자를 안 넣는 것** — \"반응이 없으면\"은 조건이 아닙니다.\n- **본전 숫자가 안 나오자 가격만 올리는 것** — 페르소나가 그 돈을 낼 수 있다고 말한 적 없으면 그건 계산이 아니라 희망입니다.\n- **지표를 다섯 개 정하는 것** — 다섯이면 매주 다른 걸 보게 됩니다. **하나입니다.**"}, {"title": "⚡ 이렇게 하세요", "md": "**① 손으로 나눗셈 한 번.** AI 없이 위의 식에 내 숫자를 넣어 봅니다. 모르는 칸은 «모름».\n\n**② AI에게 검산과 반론을 시킵니다.**\n\n```\n내가 만들려는 서비스를 \"안 만들 이유\"부터 찾아줘. 너는 나를 말리는 쪽이야.\n\n내 자료:\n- 사업 한 장: [docs/lean-canvas.md 내용 붙여넣기]\n- 고객 둘: [docs/personas.md 내용 붙여넣기]\n- 1년 안에 닿을 수 있는 사람 수와 가격: [4절의 곱셈 한 줄]\n- 매달 나가는 돈: [서버·도구 값 + 내 시간을 시급으로 환산한 값]\n- 한 사람당 추가로 드는 돈: [모르면 \"모름\"]\n\n1. 손익분기점을 계산해줘 — 몇 명이 있어야 본전인가. 계산 과정을 다 보여줘.\n   내 시간을 비용에서 빼지 마. 뺐다면 그렇게 말해줘.\n2. 그 인원을 1년 안에 확보할 수 있는지, 내가 준 \"닿을 수 있는 사람 수\"와 비교해서 판단해줘.\n3. 고객 한 명을 데려오는 비용을 추정해줘. 추정이면 \"가정\"이라고 반드시 표시해줘.\n4. 이 사업을 지금 시작하면 안 되는 이유 3가지를 대줘. 가장 아픈 것부터.\n5. 마지막에, 그 3가지 중 무엇이 해결되면 시작해도 되는지 조건으로 써줘.\n\n격려하지 마. 내가 듣고 싶은 말을 하지 마.\n```\n\n**③ 북극성 지표를 하나 고릅니다.**\n\n```\n내 서비스의 북극성 지표를 정하고 싶다. 후보 5개를 제안해줘.\n\n서비스: [한 줄]\n고객이 이걸 쓰고 얻는 것: [한 줄]\n\n후보마다:\n- 이 숫자가 오르면 고객이 실제로 가치를 받은 것인지\n- 이 숫자가 오르면 돈이 따라오는지\n- 내가 혼자서 이 숫자를 움직일 수 있는지\n셋 다 ○/×로 표시해줘.\n\n매출이나 가입자 수를 후보에 넣었다면 왜 그게 북극성 지표로 부족한지도 설명해줘.\n마지막에 1개를 추천하고, 그걸 세려면 무엇을 기록해 둬야 하는지 알려줘.\n```\n\n**④ 「이러면 접는다」 세 줄을 씁니다.** AI에게 시키지 않습니다. **내가 씁니다.**\n`docs/lean-canvas.md` 맨 아래에 이렇게 붙입니다.\n\n```\n[이러면 접는다]  작성 2026-09-○○\n1. [날짜]까지 [무엇]이 [숫자]에 못 미치면 → [내가 할 행동]\n2. [날짜]까지 [무엇]이 [숫자]에 못 미치면 → [내가 할 행동]\n3. [날짜]까지 [무엇]이 [숫자]에 못 미치면 → [내가 할 행동]\n\n[손익분기]\n매달 나가는 돈 [금액] ÷ (가격 [금액] − 1인당 추가비용 [금액]) = [숫자]명\n1년 안에 닿을 수 있는 사람 수: [숫자]명 → 가능/불가능\n[북극성 지표]\n[하나] — 이걸 세려면 [무엇]을 기록한다\n```"}, {"title": "✅ 됐는지 확인", "md": "- [ ] 「몇 명이 있어야 본전인가」가 **숫자 하나**로 적혀 있나\n- [ ] 그 계산의 「매달 나가는 돈」에 **내 시간이 들어가 있나**\n- [ ] 그 인원을 1년 안에 만들 수 있는지에 **가능/불가능으로 답했나**\n- [ ] 북극성 지표가 **딱 하나**인가 (둘 이상이면 «아니오»)\n- [ ] 그 지표가 **매출이 아닌가**\n- [ ] 「이러면 접는다」가 **세 줄** 있고, 각 줄에 **날짜 · 숫자 · 내 행동**이 다 들어 있나\n- [ ] 3절에서 **진짜 약속**을 하나라도 받았나 — 못 받았다면, 그걸 접는 조건 1번에 넣었나\n- [ ] AI가 댄 「시작하면 안 되는 이유 3가지」를 파일에 **그대로 옮겨 적었나**\n\n여기까지 «예»면 Stage 1이 끝났습니다. **불가능이 나왔다면 그게 이 장의 성공입니다.**\n아이디어를 바꾸고 2절로 돌아갑니다. 며칠 만에 방향을 튼 것이지, 몇 달을 버린 게 아닙니다."}, {"title": "🔎 더 깊이", "md": "- 검색해 볼 말 — `break even point 계산`, `CAC LTV ratio`, `north star metric 예시`, `kill criteria startup`\n- 「접는 조건」을 미리 정하는 방식은 애니 듀크(Annie Duke)의 『Quit』에 정리돼 있습니다. **그만두는 것이 판단력의 일부**라는 관점입니다.\n- 국내 업종별 고객 획득 비용의 신뢰할 만한 기준값은 **[확인 필요]** — 내 채널의 실제 숫자가 나올 때까지는 전부 가정입니다.\n- 여기서 정한 북극성 지표를 실제로 세는 장치는 <a class=\"xref\" href=\"#6\">Stage 6<\/a>에서 붙이고, 그 숫자로 판단하는 법은 <a class=\"xref\" href=\"#10\">Stage 10<\/a>에서 다룹니다.\n\n---"}, {"title": "🔗 다음 장으로 — THE CHAIN", "md": "이 장에서 손에 남은 파일은 넷입니다.\n\n| 파일 | 어디서 쓰이나 |\n|---|---|\n| `docs/lean-canvas.md` — **사업 한 장** | **<a class=\"xref\" href=\"#2\">Stage 2<\/a> 요구사항 문서의 첫 쪽이 그대로 됩니다.** 문제·고객·해법·「안 할 것」이 그 문서의 첫 네 절입니다 |\n| `docs/personas.md` — 고객 둘 | Stage 2의 「누가 쓰나」, Stage 4의 화면 결정 기준 |\n| `docs/시장조사.md` | Stage 2의 「왜 이걸 만드나」 근거, Stage 10의 소개 문구 |\n| `docs/모니터링.md` | Stage 8에서 자동으로 돌게 만듭니다 |\n\n**「사업 한 장」이 없으면 Stage 2의 첫 문단부터 막힙니다.**\n넷 중 하나라도 파일로 저장돼 있지 않으면, 다음 장으로 넘어가지 않습니다."}]}]}, {"folder": "02-명세", "key": "2", "name": "명세", "color": "#2C5FA8", "sub": "살아 있는 문서", "goal": "만들 것을 글로 먼저 정하고 AI가 매번 읽게 한다", "makes": "요구사항 · 구조 · 결정 기록", "time": "3시간", "need": ["Stage 1의 사업 한 장"], "head": "문서는 서류가 아니라 **사고 도구**이고, 동시에 **AI가 매번 읽는 재료**입니다.\nAI는 기억이 없습니다. 적어 두지 않으면 지난주에 정한 것을 오늘 뒤집습니다.", "metasecs": [{"title": "✅ 자가 체크", "md": "- [ ] 문서에 **「안 만들 것」**이 적혀 있나\n- [ ] 결정 하나를 **6줄**로 남겼나 (무엇을 · 왜 · 무엇을 버렸나)\n- [ ] AI에게 그 문서를 **비판시켜** 봤나 — 그리고 한 군데라도 고쳤나\n- [ ] 새 대화를 열어 문서만 주고 \"무엇을 만드는 거야?\"를 물었을 때 제대로 답하나"}, {"title": "다음으로", "md": "여기서 나온 문서들이 Stage 3에서 **하네스의 1층**이 됩니다."}], "sections": [{"file": "1-왜글이먼저.md", "id": "s2-1", "no": "1", "title": "왜 코드보다 글이 먼저인가", "through": "글로 먼저 정하면 시키는 시간이 줄고 결과가 맞다.", "time": "20분", "need": ["Stage 1의 사업 한 장"], "head": "", "secs": [{"title": "왜 이걸 하나", "md": "여기서 글을 안 쓰고 넘어가면, 앞으로 만드는 내내 **같은 설명을 매번 다시 하게 됩니다.**\n\nAI는 어제 우리가 나눈 대화를 기억하지 않습니다.\n새 대화를 열면 나를 처음 보는 사람입니다. 그런데 나는 이미 세 번 설명했다고 생각합니다.\n이 어긋남이 \"AI가 자꾸 딴소리를 한다\"의 진짜 원인입니다.\n\n그리고 더 중요한 게 있습니다. **글로 쓰다 보면 내가 아직 안 정한 것이 드러납니다.**\n머릿속에서는 다 정해진 것 같지만, 한 문장으로 적으려는 순간 \"어? 이건 어떻게 하기로 했지?\"가 나옵니다."}, {"title": "두 곳에서 같은 답이 나왔다", "md": "한쪽은 오래된 회사 문화, 다른 쪽은 요즘 AI로 만드는 방식인데 답이 같습니다.\n\n**구글에는 오래된 습관이 하나 있습니다.** 코드를 짜기 전에 몇 쪽짜리 글을 먼저 씁니다.\n무엇을 만들 건지, 왜 이 방법인지, 다른 방법은 왜 버렸는지.\n그 글을 동료들이 읽고 찔러 봅니다. 여기서 잡힌 문제는 고치는 데 며칠이 안 걸립니다.\n다 만든 뒤에 같은 문제가 나오면 몇 주가 걸립니다.\n\n**요즘 AI로 만드는 방식도 같은 자리를 가리킵니다.** 사람이 코드를 직접 안 짜게 되면서,\n사람이 쥐고 있어야 하는 것이 코드가 아니라 **\"무엇을 만들 것인가\"라는 글**이 됐습니다.\n코드는 다시 만들면 됩니다. 하지만 무엇을 만들지가 흐릿하면 다시 만들어도 흐릿합니다.\n\n> 코드는 AI가 씁니다. **글은 사람이 씁니다.**\n> 그래서 글이 부실하면 코드도 같이 부실해집니다."}, {"title": "글 없이 시키면 무슨 일이 벌어지나", "md": "같은 부탁을 세 번 하면 세 번 다른 게 나옵니다. AI가 이상해서가 아니라 **빈칸을 매번 새로 상상하기 때문**입니다.\n\n| 내가 한 말 | AI가 채운 빈칸 |\n|---|---|\n| \"가입 화면 만들어줘\" | 이메일로 받을지, 소셜 로그인일지, 비밀번호 규칙은 뭔지 — 매번 다르게 |\n| \"예쁘게 해줘\" | 색·간격·글자 크기를 매번 다르게 |\n| \"결제 붙여줘\" | 한 번 결제인지 매달 결제인지 — 매번 다르게 |\n\n빈칸이 열 개면 조합은 수백 가지입니다. 그중 하나가 우연히 내 머릿속과 맞기를 기다리는 셈입니다."}, {"title": "글을 쓰면 시간이 더 걸리지 않나", "md": "**아닙니다. 총 시간이 줄어듭니다.** 늘어나는 건 앞부분이고, 줄어드는 건 뒷부분입니다.\n\n| | 글 없이 | 글 먼저 |\n|---|---|---|\n| 준비 | 0분 | 1~2시간 |\n| 시키기 | 짧다 | 짧다 |\n| **다시 시키기** | **여러 번** | 적다 |\n| 다 만든 뒤 갈아엎기 | 자주 | 드묾 |\n\n앞에서 아낀 두 시간은 뒤에서 몇 배로 되돌아옵니다.\n그리고 그 글은 **한 번 쓰고 버리는 게 아니라 만드는 내내 계속 쓰입니다.**"}, {"title": "이 장에서 손에 남는 것 셋", "md": "| 무엇 | 한 줄로 | 파일 이름 |\n|---|---|---|\n| 요구사항 문서 | 무엇을 · 누구를 위해 · **무엇을 안 만드나** | `docs/PRD.md` |\n| 구조 문서 | 무엇이 어디에 있고 어떻게 이어지나 | `docs/ARCHITECTURE.md` |\n| 결정 기록 | 왜 그렇게 정했나 — 결정 하나에 파일 하나 | `docs/adr/` 폴더 |\n\n한꺼번에 다 쓰려고 하면 무너집니다. **이 장에서는 이 셋만** 씁니다.\n화면 디자인 규칙은 Stage 4에서, 그 밖의 것은 나오는 대로 붙입니다."}, {"title": "📘 말 풀이", "md": "**명세(spec, 스펙)**\n\"무엇을 만들 것인가\"를 빠짐없이 적어 둔 글. 설계도의 글자 버전이라고 보면 됩니다.\n집을 지을 때 도면 없이 벽돌부터 쌓지 않는 것과 같습니다.\n\n**설계문서(design doc)**\n코드를 짜기 전에 \"이렇게 만들 생각인데 어떤가\"를 적어서 남에게 읽히는 글.\n구글에서 오래 쓰던 방식이고, 지금은 그 \"남\"의 자리에 AI를 앉힐 수 있습니다."}, {"title": "⚠️ 자주 걸리는 함정", "md": "- **\"머릿속에 다 있어요\"** — 있는 것 같지만 없습니다. 적어 보면 30분 안에 빈칸이 서너 개 나옵니다. 그 빈칸이 나중에 다시 만들게 되는 자리입니다.\n- **문서를 예쁘게 쓰려고 함** — 이 글은 남에게 보여 줄 보고서가 아닙니다. 나와 AI만 읽습니다. 맞춤법·문장력은 아무 상관이 없습니다. **정해졌나 아닌가**만 중요합니다.\n- **한 번에 완성하려고 함** — 처음부터 완벽할 수 없습니다. 60%만 적고 시작한 뒤, 정해질 때마다 그 자리에서 채웁니다.\n- **AI에게 처음부터 다 쓰게 함** — AI가 초안을 쓰는 건 좋지만, **무엇을 안 만들지는 사람이 정해야** 합니다. AI는 \"다 만들자\"는 쪽으로 씁니다."}, {"title": "⚡ 이렇게 하세요", "md": "1. 프로젝트 폴더 안에 `docs` 라는 폴더를 하나 만듭니다.\n2. Stage 1에서 만든 **사업 한 장**을 그 폴더 옆에 둡니다.\n3. 다음 절부터 파일을 하나씩 채웁니다. 오늘은 순서만 확인합니다.\n4. 시작 전에 아래를 AI에게 붙여넣어, **내 머릿속이 얼마나 비어 있는지** 먼저 봅니다.\n\n```\n지금부터 웹서비스를 하나 만들려고 한다. 코드는 아직 짜지 마라.\n\n내 계획: (여기에 Stage 1의 사업 한 장을 그대로 붙여넣는다)\n\n이 계획만 보고 실제로 만들기 시작한다고 할 때,\n네가 마음대로 정해야 하는 것 — 즉 내가 아직 안 정한 것을\n질문 목록으로 만들어라. 중요한 순서로 10개.\n\n답을 대신 지어내지 마라. 질문만 하라.\n```\n\n돌아온 질문 10개가 곧 **이 장에서 채워야 할 빈칸 목록**입니다. 지우지 말고 저장해 둡니다."}, {"title": "✅ 됐는지 확인", "md": "- [ ] 프로젝트 폴더 안에 **`docs` 폴더가 보이나**\n- [ ] Stage 1의 **사업 한 장 파일이 손에 있나**\n- [ ] AI가 준 **질문 10개를 저장했나**\n- [ ] 그 질문 중 **내가 답을 못 하는 것이 셋 이상 있었나** (있는 게 정상입니다)\n\n하나라도 «아니오»면 이 절을 다시 봅니다."}, {"title": "🔎 더 깊이", "md": "- 검색해 볼 말 — `design doc culture`, `spec driven development`, `PRD 작성법`\n- 여기서 만든 문서 셋이 Stage 3에서 **하네스의 1층**이 됩니다. 폴더에 두는 것과 AI가 읽는 것은 다르고, 그 차이를 6절에서 먼저 다룹니다."}]}, {"file": "2-요구사항.md", "id": "s2-2", "no": "2", "title": "요구사항 문서 — 만들 것과 안 만들 것", "through": "「안 만들 것」 칸이 「만들 것」 칸보다 중요하다.", "time": "40분", "need": ["Stage 1의 사업 한 장"], "head": "", "secs": [{"title": "왜 이걸 하나", "md": "이 문서가 없으면 **끝이 안 납니다.**\n\n만들다 보면 좋은 생각이 계속 떠오릅니다. \"이것도 있으면 좋겠다.\"\n하나씩 붙일 때마다 완성은 하루씩 밀립니다. 그리고 밀린 하루는 되돌아오지 않습니다.\n서비스를 내놓지 못하는 사람들의 가장 흔한 이유가 **실력이 아니라 끝을 안 정한 것**입니다.\n\n그리고 AI에게도 같은 문제가 생깁니다. 안 만들 것을 안 적어 두면\nAI는 친절하게도 **시키지 않은 것까지 만들어 줍니다.** 그걸 지우는 것도 내 일이 됩니다."}, {"title": "요구사항 문서는 기획서가 아니다", "md": "기획서는 사람이 읽고 사람이 해석합니다. 애매해도 회의로 메꿉니다.\n**요구사항 문서는 AI가 읽고 그대로 코드가 됩니다.** 애매하면 AI가 알아서 정합니다.\n\n| | 이렇게 쓰면 안 되고 | 이렇게 씁니다 |\n|---|---|---|\n| 목표 | \"사용자가 편하게 뉴스를 본다\" | \"매일 아침 7시에 고른 분야 기사 5개를 이메일로 받는다\" |\n| 기능 | \"결제 기능\" | \"매달 자동으로 결제되고, 마이페이지에서 한 번 눌러 해지할 수 있다\" |\n| 성공 | \"많이 쓴다\" | \"가입한 사람 중 다음 달에도 남아 있는 사람이 절반을 넘는다\" |\n\n기준은 하나입니다. **읽고 나서 \"그래서 화면에 뭐가 보이는데?\"라는 질문이 남으면 아직 덜 쓴 것입니다.**"}, {"title": "네 칸이면 됩니다", "md": "거창한 양식이 필요 없습니다. 네 칸만 채우면 요구사항 문서입니다.\n\n| 칸 | 무엇을 적나 | 분량 |\n|---|---|---|\n| **① 무엇을** | 이 서비스가 하는 일 한 문단 | 3~5줄 |\n| **② 누구를 위해** | Stage 1에서 만든 고객 둘을 그대로 옮긴다 | 각 3줄 |\n| **③ 무엇이 되면 성공인가** | 눈으로 셀 수 있는 숫자 하나 + 보조 둘 | 3줄 |\n| **④ 안 만드는 것** | 이번엔 안 할 것 **다섯 개 이상**, 각각 한 줄 이유 | 5~7줄 |\n\n②는 새로 쓰지 않습니다. **Stage 1의 사업 한 장이 그대로 재료입니다.**\n문제와 해법은 ①로, 고객은 ②로, 지표는 ③으로 옮깁니다. 여기까지는 AI가 대신 옮겨 줍니다."}, {"title": "④가 가장 중요합니다", "md": "만들 것을 적는 건 쉽습니다. 다들 씁니다. **안 만들 것을 적는 사람이 드뭅니다.**\n\n「하루 5분 뉴스 요약을 이메일로 보내는 구독 서비스」로 예를 들면 이렇습니다.\n\n**만들 것 — 셋만**\n\n1. 이메일로 가입하고 관심 분야를 하나 고른다\n2. 매일 아침 정해진 시간에 기사 다섯 개를 요약해 이메일로 보낸다\n3. 매달 자동 결제되고, 마이페이지에서 해지할 수 있다\n\n**안 만들 것 — 다섯 이상**\n\n| 안 만드는 것 | 왜 |\n|---|---|\n| 휴대폰 앱 | 웹으로 먼저 확인한다. 앱은 만드는 일이 통째로 하나 더 늘어난다 |\n| 메신저로 보내기 | 이메일 하나가 되는지부터 본다 |\n| 댓글·게시판 | 사람이 늘기 전에는 빈 화면만 늘어난다 |\n| 어두운 화면 모드 | 화면 손볼 곳이 두 배가 된다 |\n| 취향 추천 | 쌓인 기록이 없으면 추천할 것도 없다 |\n| 다른 나라 말 | 한국어로 팔릴지부터 본다 |\n\n**\"영원히 안 만든다\"가 아닙니다.** \"이번에는 안 만든다\"입니다.\n나중에 만들 것은 지우지 말고 이 칸에 그대로 남겨 둡니다. 이 목록 자체가 다음에 할 일의 후보가 됩니다.\n\n### 셋을 넘기지 않는 이유\n\n만들 것을 다섯, 여섯 개로 늘리면 각각이 반쯤 된 상태로 멈춥니다.\n반쯤 된 기능 여섯 개는 **팔 수 없습니다.** 다 된 기능 셋은 팔 수 있습니다."}, {"title": "이 문서는 언제 다시 쓰나", "md": "**끝나는 문서가 아닙니다.** 만들면서 계속 고칩니다.\n\n- 새 기능을 넣고 싶어질 때 → 먼저 이 문서의 ④를 봅니다. 거기 적혀 있으면 이번엔 안 합니다.\n- 정말 넣어야겠다면 → ④에서 지우고 ①에 옮겨 적습니다. **그리고 대신 뺄 것을 하나 고릅니다.**\n- 안 만들기로 새로 정한 게 생기면 → 그 자리에서 ④에 한 줄 추가합니다."}, {"title": "📘 말 풀이", "md": "**PRD(Product Requirements Document, 제품 요구사항 문서)**\n\"무엇을, 누구를 위해, 왜 만드는가\"를 적어 둔 문서. 이 장에서 만드는 첫 번째 파일이고\n파일 이름은 보통 `PRD.md`로 씁니다. 이름이 어려울 뿐 내용은 위의 네 칸이 전부입니다.\n\n**MVP(Minimum Viable Product, 최소로 팔 수 있는 것)**\n\"팔 수 있는 가장 작은 덩어리\". 이것저것 다 붙인 완성품이 아니라,\n**돈을 받을 수 있는 최소한**입니다. 위의 「만들 것 셋」이 곧 이것입니다."}, {"title": "⚠️ 자주 걸리는 함정", "md": "- **④를 비워 두기** — 가장 흔합니다. ④가 비어 있으면 이 문서는 아무 일도 하지 않습니다. **다섯 줄이 안 나오면 아직 안 정해진 것**입니다.\n- **④에 \"나중에 할 것\"이라고만 쓰기** — 이유를 안 적으면 다음 주에 내가 다시 흔들립니다. 한 줄이라도 이유를 붙입니다.\n- **AI에게 ④까지 맡기기** — AI에게 시키면 ①②③은 잘 씁니다. ④는 눈치를 봐서 \"필요하면 넣으세요\" 식으로 씁니다. **④는 사람이 정합니다.**\n- **③에 셀 수 없는 말 쓰기** — \"만족도가 높다\"는 셀 수 없습니다. \"다음 달에도 남아 있는 사람 수\"는 셀 수 있습니다.\n- **만들 것을 계속 늘리기** — 하나 넣으면 하나 뺍니다. 이 규칙을 문서 맨 위에 적어 둡니다."}, {"title": "⚡ 이렇게 하세요", "md": "1. `docs/PRD.md` 파일을 만듭니다.\n2. 아래를 AI에게 붙여넣어 ①②③ 초안을 받습니다. **Stage 1의 사업 한 장 파일을 같이 줍니다.**\n\n```\n첨부한 사업 한 장과 고객 정리를 읽고 PRD.md 초안을 써라.\n코드는 짜지 마라. 마크다운으로 파일 하나만 만들어라.\n\n구조는 네 칸으로 고정한다.\n① 무엇을 — 이 서비스가 하는 일 한 문단\n② 누구를 위해 — 고객 둘, 각각 하루 일과와 지금 겪는 불편 3줄\n③ 무엇이 되면 성공인가 — 셀 수 있는 숫자 하나 + 보조 지표 둘\n④ 안 만드는 것 — 비워 둬라. 이건 내가 직접 채운다.\n\n③의 숫자는 \"화면이나 표에서 실제로 셀 수 있는 것\"만 써라.\n셀 수 없는 말(만족도, 편리함)은 쓰지 마라.\n```\n\n3. **④는 손으로 채웁니다.** 다섯 개가 안 떠오르면 아래를 붙여넣습니다.\n\n```\n첨부한 PRD.md를 읽어라.\n\n이 서비스를 만들 때 \"있으면 좋겠다\"고 사람들이 흔히 붙이는 기능을 15개 나열해라.\n각각 옆에 \"이번에 안 만들면 서비스가 성립하지 않는가\"를 예/아니오로 표시해라.\n\n칭찬하거나 권하지 마라. 목록만 내라.\n```\n\n돌아온 15개 중 「아니오」인 것들이 곧 ④ 후보입니다. 여기서 **다섯 개 이상**을 골라 이유를 한 줄씩 붙입니다.\n\n4. 마지막으로 문서 맨 위에 이 한 줄을 적습니다.\n\n```\n규칙: 만들 것에 하나를 더하려면, 반드시 하나를 뺀다.\n```"}, {"title": "✅ 됐는지 확인", "md": "- [ ] `docs/PRD.md` 파일이 **폴더에 보이나**\n- [ ] 문서에 **「안 만들 것」이 적혀 있나** — 그리고 **다섯 줄 이상인가**\n- [ ] 「안 만들 것」 각 줄에 **이유가 한 줄씩 붙어 있나**\n- [ ] 「만들 것」이 **셋 이하인가**\n- [ ] ③의 성공 기준을 **숫자로 소리 내어 말할 수 있나**\n- [ ] ②의 고객이 Stage 1에서 만든 그 사람과 **같은 사람인가**\n\n하나라도 «아니오»면 이 절을 다시 봅니다. 특히 두 번째가 «아니오»면 다음 절로 넘어가지 않습니다."}, {"title": "🔎 더 깊이", "md": "- 검색해 볼 말 — `PRD template`, `MoSCoW must should could wont`, `scope creep`\n- 「안 만들 것」을 정하는 판단 근거(시장·고객)는 Stage 1에서 다뤘습니다. 근거가 흔들리면 여기가 아니라 거기로 돌아갑니다.\n- 이 파일은 Stage 3에서 **하네스의 1층 첫 번째 문서**가 됩니다. 매 대화마다 AI가 읽게 만드는 법은 6절에서."}]}, {"file": "3-구조문서.md", "id": "s2-3", "no": "3", "title": "구조 문서 — 무엇이 어디에 있나", "through": "네모와 화살표면 된다.", "time": "30분", "need": ["2절의 요구사항 문서"], "head": "", "secs": [{"title": "왜 이걸 하나", "md": "요구사항 문서는 **무엇을** 만들지를 적은 것입니다.\n구조 문서는 **그게 어디에 놓이고 어떻게 이어지는지**를 적은 것입니다.\n\n이게 없으면 AI가 같은 일을 하는 코드를 **여러 군데에 만듭니다.**\n회원 정보를 저장하는 곳이 두 군데 생기고, 이메일을 보내는 코드가 세 군데 생깁니다.\n그러면 하나를 고쳐도 다른 하나는 그대로 남아서, \"고쳤는데 안 고쳐졌다\"가 됩니다.\n\n그리고 나중에 **\"이거 어디를 고쳐야 하죠?\"라고 물을 수 있게 됩니다.**\n지금 그 질문에 답할 수 있는 사람은 나뿐인데, 지도가 없으면 나도 모릅니다."}, {"title": "비개발자도 그릴 수 있습니다", "md": "기술 문서라고 하면 겁이 나지만, 실제로 필요한 건 **네모와 화살표**뿐입니다.\n\n- **네모** = 무언가가 놓여 있는 자리 (화면 하나, 저장소 하나, 바깥 서비스 하나)\n- **화살표** = 무엇이 어디로 가는가 (사람이 누른다, 정보가 저장된다, 메일이 나간다)\n\n그림 도구가 없어도 됩니다. **글로 써도 똑같이 작동합니다.**\nAI는 그림을 못 읽지만 글은 정확히 읽습니다. 그래서 오히려 글이 낫습니다."}, {"title": "네모는 세 종류뿐입니다", "md": "| 종류 | 무엇 | 예 |\n|---|---|---|\n| **보이는 것** | 사람이 눈으로 보고 누르는 화면 | 가입 화면 · 마이페이지 · 결제 화면 |\n| **쌓이는 것** | 사라지면 안 되는 정보가 남는 곳 | 회원 명단 · 구독 상태 · 보낸 기록 |\n| **빌려 쓰는 것** | 내가 안 만들고 남의 것을 쓰는 자리 | 이메일 보내는 서비스 · 결제 · 글 요약 |\n\n**세 번째가 중요합니다.** 내가 안 만드는 것을 적어 두지 않으면\nAI가 그걸 직접 만들려고 듭니다. 결제를 직접 만들면 안 됩니다. 빌려 씁니다."}, {"title": "한 장으로 쓰면 이렇게 됩니다", "md": "「하루 5분 뉴스 요약을 이메일로 보내는 구독 서비스」의 구조 문서 본문입니다.\n\n**① 화면 — 사람이 보는 것 넷**\n\n| 화면 | 여기서 하는 일 |\n|---|---|\n| 첫 화면 | 뭘 해 주는 서비스인지 보고, 가입 버튼을 누른다 |\n| 가입 화면 | 이메일을 넣고 관심 분야를 하나 고른다 |\n| 마이페이지 | 분야를 바꾸거나, 결제를 해지한다 |\n| 결제 화면 | 카드 정보를 넣는다 — **우리가 만들지 않는다. 빌려 온 화면을 띄운다** |\n\n**② 쌓이는 것 — 표 셋**\n\n| 표 | 무엇이 한 줄씩 쌓이나 |\n|---|---|\n| 회원 | 이메일 · 고른 분야 · 가입한 날 |\n| 구독 | 누가 · 언제부터 · 지금 살아 있나 죽었나 |\n| 발송 기록 | 언제 · 누구에게 · 성공했나 실패했나 |\n\n**③ 빌려 쓰는 것 — 넷**\n\n| 무엇 | 어디에 쓰나 | 못 쓰게 되면 |\n|---|---|---|\n| 회원 저장소 | 위의 표 셋을 담는 곳 | 서비스 전체가 멈춘다 |\n| 이메일 발송 | 아침에 메일을 실제로 쏘는 곳 | 메일이 안 나간다 |\n| 결제 | 매달 돈을 받는 곳 | 새 가입만 막히고 기존은 돈다 |\n| 글 요약 | 기사를 다섯 줄로 줄이는 곳 | 요약이 빈 채로 나간다 |\n\n**④ 하루의 흐름 — 화살표 한 줄**\n\n```\n사람이 가입 → 회원 표에 한 줄 추가 → 결제가 되면 구독 표에 살아 있음 표시\n매일 아침 정해진 시간 → 살아 있는 구독자를 훑는다 → 기사를 모은다\n→ 글 요약에 맡긴다 → 이메일 발송에 넘긴다 → 발송 기록에 한 줄 남긴다\n```\n\n이게 전부입니다. **A4 한 장을 넘기지 않습니다.**\n넘어간다면 아직 안 만들 것을 너무 많이 넣은 것입니다. 2절의 ④로 돌아갑니다."}, {"title": "「못 쓰게 되면」 칸을 꼭 채웁니다", "md": "빌려 쓰는 것은 언젠가 멈춥니다. 값이 오르거나, 문을 닫거나, 우리 나라에서 못 쓰게 됩니다.\n그때 **무엇이 같이 멈추는지**를 지금 한 줄로 적어 두면, 나중에 갈아탈 때 무엇을 손대야 할지 바로 압니다.\n\n이 칸이 뒤 Stage에서 그대로 쓰입니다. 서버·결제를 붙일 때, 그리고 문제가 났을 때 원인을 좁힐 때."}, {"title": "📘 말 풀이", "md": "**아키텍처(architecture, 구조)**\n건물로 치면 \"어느 방이 어디에 있고 복도가 어떻게 이어지나\"에 해당하는 그림.\n코드로 치면 **화면·저장소·바깥 서비스가 어떻게 연결돼 있나**입니다. 파일 이름은 보통 `ARCHITECTURE.md`.\n\n**데이터베이스(database, 저장소)**\n사라지면 안 되는 정보를 줄 단위로 쌓아 두는 곳. 엑셀 표를 아주 많이, 아주 빠르게 다루는 것이라고\n생각하면 크게 틀리지 않습니다. 위의 「쌓이는 것」이 여기 들어갑니다."}, {"title": "⚠️ 자주 걸리는 함정", "md": "- **그림 도구부터 찾기** — 그림을 예쁘게 그리는 데 두 시간을 씁니다. **AI는 그림을 못 읽습니다.** 글로 씁니다.\n- **어려운 말로 쓰려고 함** — \"인증 레이어\", \"비동기 큐\" 같은 말을 흉내 내면 나중에 내가 못 읽습니다. **내가 아는 말로 씁니다.** 어려운 이름이 필요하면 AI가 코드에서 알아서 붙입니다.\n- **빌려 쓰는 것을 안 적기** — 안 적으면 AI가 직접 만들려 듭니다. 특히 결제와 로그인은 **절대 직접 만들지 않습니다.**\n- **처음부터 다 그리기** — 아직 안 정한 것은 `[아직 안 정함]`이라고 적어 둡니다. 빈칸을 감추면 AI가 채웁니다.\n- **문서와 실제가 어긋난 채로 두기** — 만들다가 구조가 바뀌면 **그 자리에서** 이 문서를 고칩니다. 어긋난 지도는 없는 지도보다 나쁩니다."}, {"title": "⚡ 이렇게 하세요", "md": "1. `docs/ARCHITECTURE.md` 파일을 만듭니다.\n2. AI에게 **그림 대신 글로 설명하게** 시킵니다. 요구사항 문서를 같이 줍니다.\n\n```\n첨부한 PRD.md를 읽어라. 코드는 짜지 마라. 문서 하나만 만들어라.\n\n이 서비스의 구조를 ARCHITECTURE.md로 정리해라.\n그림·다이어그램을 쓰지 말고 전부 글과 표로 써라.\n비개발자가 읽을 것이니 전문 용어를 쓰면 괄호 안에 쉬운 말로 풀어라.\n\n구조는 네 칸으로 고정한다.\n① 화면 — 사람이 보는 화면 목록과 각 화면에서 하는 일\n② 쌓이는 것 — 사라지면 안 되는
