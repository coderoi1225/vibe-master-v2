은 값을 담는다. 값에는 확인한 날짜가 붙는다.**\n\n이 절이 없으면 이렇게 막힙니다 — 어느 장을 고쳐야 요금이 최신이 되는지 몰라서 **아무 데도 못 고칩니다.** 값이 열두 군데 흩어져 있기 때문입니다. 한곳에 모으면 **분기에 한 번, 이 절만** 보면 됩니다.\n\n### 이 절의 세 가지 규칙\n\n| # | 규칙 | 왜 |\n|---|---|---|\n| 1 | **확인한 날짜를 반드시 적는다** | 날짜 없는 값은 값이 아닙니다. 언제부터 틀렸는지 알 수 없습니다 |\n| 2 | **분기마다 갱신한다** | 1·4·7·10월 첫 주. 달력에 넣어 두세요 |\n| 3 | **모르면 `[확인 필요]`로 둔다** | **빈칸보다 나쁜 것이 틀린 값입니다.** 지어내지 않습니다 |\n\n### 어디서 확인하나 — 원칙\n\n> **각 도구의 공식 요금 페이지에서만 확인합니다.**\n\n블로그 · 유튜브 요약 · 비교 사이트 · AI의 기억에서 가져오지 않습니다. 이 셋은 전부 **낡은 값을 그럴듯하게 말합니다.** 특히 AI에게 \"요금이 얼마야?\"라고 묻지 마세요 — AI의 학습 시점은 지금이 아닙니다."}, {"title": "표 ① — AI 코딩 도구", "md": "| 무엇 | 값 | 확인한 날짜 | 어디서 확인 |\n|---|---|---|---|\n| 메인 도구 요금제 이름과 가격 | `[확인 필요]` | — | 제조사 공식 요금 페이지 |\n| 백업 도구 요금제 이름과 가격 | `[확인 필요]` | — | 제조사 공식 요금 페이지 |\n| 무료로 어디까지 되나 | `[확인 필요]` | — | 공식 요금 페이지 |\n| 사용 한도가 차면 어떻게 되나 | `[확인 필요]` | — | 공식 문서 |\n| 팀·기업 전용 기능 (개인 요금제에서 안 되는 것) | `[확인 필요]` | — | 공식 요금 페이지 |\n| 현재 설치된 버전 | `[확인 필요]` | — | 도구의 버전 확인 명령 |\n| 업데이트 확인 명령 | `[확인 필요]` | — | 공식 설치 문서 |\n| **터미널 멀티플렉서 — 이 맥에 깔려 있나** | **✅ `tmux` 3.7b** (`screen`도 있음) | 2026-09-09 | `tmux -V` (실측) |\n| 노트북을 **덮었을 때** 예약이 도나 | `[확인 필요]` | — | 절전 설정에 달림. 각자 재 봐야 함 |\n\n> **왜 이 표가 필요한가** — Stage 7의 \"커밋 직전에 다른 도구로 리뷰\"가 **어느 요금제에서 되는지**가 여기서 갈립니다. 저장소에 붙는 자동 리뷰 기능이 개인 요금제에서 되는지 팀 전용인지를 꼭 확인해서 적어 두세요."}, {"title": "표 ② — 모델 이름과 등급", "md": "**본문에는 모델 이름을 쓰지 않습니다.** 대신 *\"가벼운 모델\" · \"생각 많이 하는 모델\"*처럼 역할로 부릅니다. 실제 이름은 여기서 관리합니다.\n\n| 역할 | 지금의 이름 | 확인한 날짜 | 어디서 확인 |\n|---|---|---|---|\n| 가볍고 빠른 것 (요약·분류) | `[확인 필요]` | — | 제조사 공식 모델 문서 |\n| 기본으로 쓰는 것 (구현) | `[확인 필요]` | — | 제조사 공식 모델 문서 |\n| 어려운 것 (설계·리뷰) | `[확인 필요]` | — | 제조사 공식 모델 문서 |\n| API 요금 (입력 / 출력) | `[확인 필요]` | — | 제조사 공식 요금 페이지 |"}, {"title": "표 ③ — 서버·데이터베이스·배포의 무료 한도", "md": "**「돈 없이 어디까지」 절이 이 표를 씁니다.** 거기서는 *\"어디서 먼저 걸리는가\"*만 말하고, 숫자는 여기 있습니다.\n\n| 무엇 | 무료 한도 | 확인한 날짜 | 어디서 확인 |\n|---|---|---|---|\n| 배포 서비스 — 무료 대역폭·빌드 시간 | `[확인 필요]` | — | 공식 요금 페이지 |\n| 배포 서비스 — 무료로 되는 예약 실행 주기 | `[확인 필요]` | — | 공식 문서 |\n| 데이터베이스 — 무료 용량·프로젝트 수 | `[확인 필요]` | — | 공식 요금 페이지 |\n| 데이터베이스 — 쉬면 멈추는 조건 | `[확인 필요]` | — | 공식 문서 |\n| 데이터베이스 — 서울 리전 제공 여부 | `[확인 필요]` | — | 공식 문서 |\n| 에러 추적 — 무료 이벤트 수·보관 기간 | `[확인 필요]` | — | 공식 요금 페이지 |\n| 메일 발송 — 무료 발송 건수 | `[확인 필요]` | — | 공식 요금 페이지 |\n| 저장소 자동화 — 공개/비공개 무료 실행 시간 | `[확인 필요]` | — | 공식 요금 페이지 |\n| 시크릿 스캔·코드 검사 — 무료 범위 | `[확인 필요]` | — | 공식 보안 기능 문서 |\n| 의존성 경보 — 무료 범위 | `[확인 필요]` | — | 공식 보안 기능 문서 |"}, {"title": "표 ④ — 결제와 수수료", "md": "**Stage 6이 이 표를 씁니다.** 여기가 실제로 돈이 나가는 자리라 **가장 자주 확인해야 하는 표**입니다.\n\n| 무엇 | 값 | 확인한 날짜 | 어디서 확인 |\n|---|---|---|---|\n| 결제 대행 — 가입비 | `[확인 필요]` | — | 각 사 공식 요금 페이지 |\n| 결제 대행 — 연회비·유지비 | `[확인 필요]` | — | 각 사 공식 요금 페이지 |\n| 결제 대행 — 카드 결제 수수료율 | `[확인 필요]` | — | 각 사 공식 요금 페이지 |\n| 결제 대행 — 간편결제 수수료율 | `[확인 필요]` | — | 각 사 공식 요금 페이지 |\n| 정기결제(빌링) 지원 여부 | `[확인 필요]` | — | 각 사 공식 문서 |\n| 국내 간편결제의 **정기결제** 가능 여부 | `[확인 필요]` | — | 각 사 공식 문서 |\n| 통합 결제 서비스 — 무료 구간 조건 | `[확인 필요]` | — | 공식 요금 페이지 |\n| 해외 결제 서비스 — **한국 판매자 가입 가능 여부** | `[확인 필요]` | — | 공식 지원 국가 페이지 |\n| 대안 판매 대행(MoR) — 수수료·한국 판매자 지원 | `[확인 필요]` | — | 각 사 공식 페이지 |\n| 테스트 모드로 어디까지 되나 | `[확인 필요]` | — | 각 사 개발자 문서 |\n\n> ⚠️ **여기는 특히 낡습니다.** 결제 수수료와 가입 조건은 자주 바뀌고, **직계약이냐 대행사를 통하느냐에 따라 되는 것이 달라집니다.** 가입 직전에 반드시 공식 페이지를 다시 보세요."}, {"title": "표 ⑤ — 프레임워크와 라이브러리", "md": "| 무엇 | 값 | 확인한 날짜 | 어디서 확인 |\n|---|---|---|---|\n| 웹 프레임워크 최신 안정 버전 | `[확인 필요]` | — | 공식 릴리스 페이지 |\n| 내 프로젝트가 쓰는 버전 | `[확인 필요]` | — | 프로젝트의 의존성 파일 |\n| 보안 패치가 나온 최근 이력 | `[확인 필요]` | — | 공식 보안 공지 |\n| 인증 라이브러리 버전과 주의사항 | `[확인 필요]` | — | 공식 문서 |\n| 한글 웹폰트 이름과 용량 | `[확인 필요]` | — | 폰트 배포처 공식 페이지 |\n\n> **버전 번호를 본문에 쓰지 않는 이유** — *\"없는 버전\"*을 적는 사고가 실제로 흔합니다. AI가 아직 나오지 않은 버전 번호를 자신 있게 말하기 때문입니다. **릴리스 페이지에서 눈으로 본 것만** 적습니다."}, {"title": "표 ⑥ — 디자인 도구", "md": "| 무엇 | 값 | 확인한 날짜 | 어디서 확인 |\n|---|---|---|---|\n| 화면 설계 도구 — 지금 쓰는 요금제 | **Pro 팀 · Full 시트** | 2026-09-09 | 도구가 직접 답한 계정 정보 (실측) |\n| 화면 설계 도구 — **변수(규칙표)가 되나** | **✅ 됩니다.** 코드로 받을 때 이름이 그대로 따라옵니다 | 2026-09-09 | 직접 만들고 코드로 받아 봄 (실측) |\n| 화면 설계 도구 — **시안·코드 잇기(Code Connect)가 되나** | **❌ 안 됩니다.** Organization 또는 Enterprise 플랜이 필요합니다. **Full 시트인데도 플랜 등급이 모자랍니다** | 2026-09-09 | 호출하니 그렇게 거절당함 (실측) |\n| 발행물 도구 — 지금 쓰는 요금제 | **무료** | 2026-09-09 | 계정 설정에서 확인 |\n| 발행물 도구 — **브랜드 킷이 되나** | **❌ 안 됩니다** (0개). 대신 **템플릿 고정 → 글자만 교체** | 2026-09-09 | 목록을 불러 보니 비어 있음 (실측) |\n| 발행물 도구 — 카드뉴스 기본 크기 | **1080×1350** (4:5) | 2026-09-09 | 실제로 만들어 확인 (실측) |\n| 발행물 도구 — **AI 생성이 한글을 제대로 넣나** | **❌ 못 넣습니다.** 뜻 없는 조각이 들어갑니다 | 2026-09-09 | 실제로 만들어 확인 (실측) |\n| 이미지 편집 도구 — 요금제 | `[확인 필요]` | — | 공식 요금 페이지 |\n| 이미지 편집 도구 — 한글 서체 검색 | **❌ 0건** | 2026-09-09 | 검색해 봄 (실측) |"}, {"title": "표 ⑦ — 법령 시행일", "md": "**「법무·세무」 절이 이 표를 씁니다.** 날짜는 값이라 여기서 관리하지만, **원문은 국가법령정보센터에서 확인합니다.**\n\n| 무엇 | 날짜 | 확인한 날짜 | 어디서 확인 |\n|---|---|---|---|\n| 개정 개인정보보호법 시행 | 2026-09-11 | 2026-09-09 | `law.go.kr` · `pipc.go.kr` |\n| 다크패턴 규제(전자상거래법) 집행 | 2026-10-22 | 2026-09-09 | `law.go.kr` · `ftc.go.kr` |\n| AI 기본법 시행 | 2026-01-22 | 2026-09-09 | `law.go.kr` |\n| 장애인차별금지법 시행령 별표3 — 그 밖의 모든 법인 적용 | 2013-04-11 | 2026-09-09 | `law.go.kr` |\n| 광고성 정보 전송 안내서 개정 | 2026-03 | 2026-09-09 | `kcc.go.kr` |\n| 통신판매업 신고 면제 고시 — 거래 50회 미만 또는 간이과세자 | 상시 | 2026-09-09 | `ftc.go.kr` |\n| AI 기본법 계도기간 종료일 | `[확인 필요]` | — | 소관 부처 공고 |\n| 개인정보 관련 법정 보존 기간 | `[확인 필요]` | — | `law.go.kr` |"}, {"title": "표 ⑧ — 도구 이름 자체가 낡는 자리", "md": "**본문에는 원리만 적고, 도구 이름은 여기 둡니다.** 이름이 바뀌거나 서비스가 문을 닫아도 **본문을 고칠 필요가 없게** 하기 위해서입니다.\n\n| 원리 (본문에 있는 것) | 지금 쓰는 도구 이름 | 확인한 날짜 |\n|---|---|---|\n| 터미널을 닫아도 계속 도는 자리 (멀티플렉서) | `[확인 필요]` | — |\n| 에이전트 여러 개의 상태를 한눈에 보는 도구 | `[확인 필요]` | — |\n| 자동 코드 리뷰를 붙이는 도구 | `[확인 필요]` | — |\n| 시크릿 스캔 도구 (비공개 저장소용 무료 대체) | `[확인 필요]` | — |\n| 국내 메일 발송 서비스 | `[확인 필요]` | — |\n| 사이트 살아 있나 감시 도구 | `[확인 필요]` | — |\n\n> **왜 이름을 본문에서 뺐나** — 최근 12개월 사이에 이름이 사라진 도구, 문을 닫은 도구, 개인 무료를 끊은 도구, 주인이 바뀐 도구가 각각 있었습니다. **본문에 이름을 박으면 그때마다 본문을 고쳐야 합니다.**\n> 다만 **설치가 필요한 것은 본문에 이름을 씁니다.** 이름을 다 빼면 읽는 사람이 아무것도 깔 수 없기 때문입니다. 여기 모으는 것은 **요금·버전·대체품 후보**입니다."}, {"title": "📘 말 풀이", "md": "**리전(region)**\n서비스의 데이터가 실제로 놓인 **지역**. 서울 리전을 고르면 데이터가 국내에 저장되고, 그러면 「법무·세무」 절의 국외이전 문제가 가벼워집니다.\n\n**MoR (Merchant of Record)**\n\"판매자를 대신 맡아 주는 회사\". 이 회사가 형식상 판매자가 되어 세금과 결제를 처리해 줍니다. 해외 결제 서비스를 직접 못 쓸 때 쓰는 우회로입니다.\n\n**테스트 모드**\n결제 대행사가 주는 **가짜 결제 환경.** 실제 카드도 실제 돈도 쓰지 않고 결제 흐름을 끝까지 만들어 볼 수 있습니다."}, {"title": "⚠️ 자주 걸리는 함정", "md": "| 함정 | 왜 걸리나 |\n|---|---|\n| **AI에게 요금을 물어본다** | AI가 아는 값은 지금이 아닙니다. 그런데 **아주 자신 있게 말합니다** |\n| **블로그·비교 사이트의 표를 그대로 옮긴다** | 그 표에도 확인 날짜가 없습니다. 낡음이 그대로 옮겨 옵니다 |\n| **날짜 없이 값만 적는다** | 반년 뒤에 이 표를 믿을지 말지 판단할 근거가 사라집니다 |\n| **`[확인 필요]`가 부끄러워 대충 채운다** | **빈칸은 정직하고, 틀린 값은 사고입니다** |\n| **한 번 채우고 안 본다** | 분기 갱신 날짜를 달력에 넣어 두세요 |\n| **없는 버전 번호를 적는다** | 릴리스 페이지에서 **눈으로 본 것만** 적습니다 |\n| **환율을 안 적는다** | 해외 서비스는 달러 표시입니다. **원화로 옮겨 적었다면 환율과 날짜를 같이** 적으세요 |"}, {"title": "⚡ 이렇게 하세요", "md": "### 분기 갱신 — 30분짜리 절차\n\n**1월·4월·7월·10월 첫 주에 이 절만 엽니다.**\n\n1. 표를 위에서부터 훑으며 **확인한 날짜가 3개월보다 오래된 줄에 표시**합니다.\n2. 표시한 줄의 **「어디서 확인」에 적힌 공식 페이지를 하나씩 엽니다.** 검색하지 말고 적어 둔 주소로 바로 갑니다.\n3. 값이 같으면 **날짜만 오늘로** 바꿉니다.\n4. 값이 달라졌으면 **값과 날짜를 함께** 바꾸고, **본문 어느 절이 이 값을 쓰는지** 확인해 그 절도 함께 봅니다.\n5. 못 찾았으면 **`[확인 필요]`로 되돌립니다.** 옛 값을 그대로 두지 않습니다.\n\n### 새 값이 생겼을 때 — 어디에 넣나\n\n본문을 쓰다가 요금·버전·모델 이름을 쓰고 싶어지면, **본문에는 이렇게 씁니다.**\n\n```\n요금과 버전은 부록 「버전과 값」에서 확인 날짜와 함께 관리합니다.\n```\n\n그리고 **이 절의 알맞은 표에 줄을 하나 추가**합니다. 표가 없으면 새 표를 만듭니다. **본문에는 숫자를 남기지 않습니다.**\n\n### 값을 확인할 때 쓰는 프롬프트\n\n```\n아래 주소를 열어서 지금 화면에 적힌 요금제 이름과 금액만 그대로 옮겨 적어 줘.\n[공식 요금 페이지 주소]\n\n규칙:\n- 네 기억으로 채우지 마. 페이지에 없으면 \"페이지에 없음\"이라고 써.\n- 통화 단위와 과금 주기(월/연)를 같이 적어.\n- 오늘 날짜를 함께 적어.\n```\n\n**페이지를 열지 않고 대답하면 그 답은 버립니다.**"}, {"title": "✅ 됐는지 확인", "md": "- [ ] 이 절의 **모든 값에 확인한 날짜**가 붙어 있나? (`[확인 필요]`도 정상입니다)\n- [ ] 본문(Stage 0~10, 업무 자동화)에 **요금·모델 이름·버전 번호가 하나도 없나?**\n- [ ] 「어디서 확인」 칸에 **공식 페이지**가 적혀 있나? (블로그 주소가 아니라)\n- [ ] 다음 분기 갱신 날짜를 **달력에 넣었나?**\n- [ ] 3개월보다 오래된 값이 있나? 있으면 오늘 확인할 수 있나?"}, {"title": "🔎 더 깊이", "md": "**어디서 확인하나 — 원칙 두 줄**\n\n1. **도구의 값은 그 도구의 공식 요금 페이지에서.** 제조사가 직접 운영하는 주소인지 확인하세요.\n2. **법령의 값은 국가법령정보센터(`law.go.kr`)와 소관 부처 사이트에서.** 해설 기사가 아니라 원문입니다.\n\n**표를 늘릴 때**\n\n새 표를 만들 때도 **네 칸 구조를 그대로** 지킵니다 — `무엇` / `값` / `확인한 날짜` / `어디서 확인`. 칸을 줄이고 싶어지면, 대개 줄이고 싶은 칸이 **날짜**입니다. 그 칸이 이 절의 전부입니다.\n\n**이 절을 쓰는 다른 절들**\n\n「돈 없이 어디까지」(무료 한도) · 「법무·세무」(법령 시행일) · Stage 6(결제 수수료) · Stage 7(자동화 무료 실행 시간) · Stage 8(감시 도구 무료 한도) · Stage 4(디자인 도구 요금). **여기 값이 바뀌면 그 절들을 함께 봅니다.**"}]}, {"file": "4-트러블슈팅.md", "id": "s부록-4", "no": "4", "title": "트러블슈팅 — 막혔을 때 먼저 보는 자리", "through": "같은 에러가 세 번 반복되면, 고칠 대상은 코드가 아니라 방법이다.", "time": "찾을 때마다", "need": [], "head": "증상으로 찾습니다. **원인을 몰라도 됩니다.** 화면에 보이는 것으로 찾으세요.", "secs": [{"title": "왜 이걸 하나", "md": "혼자 만들다 막히면 **막힌 것 자체보다 \"이게 흔한 일인지 내가 이상한 건지 모르는 것\"이 더 사람을 지치게 합니다.**\n\n여기 있는 것들은 전부 **흔합니다.** 흔하다는 걸 아는 것만으로 절반은 풀립니다.\n\n**쓰는 법 — 세 걸음**\n\n1. 화면에 보이는 **증상**으로 찾습니다.\n2. **먼저 볼 것**을 확인합니다. 대개 여기서 끝납니다.\n3. 안 되면 **그래도 안 되면** 칸으로 갑니다.\n\n> **버전 번호·요금이 필요한 항목은 여기에 적지 않았습니다.** 「버전과 값」 절에서 확인 날짜와 함께 봅니다."}, {"title": "🚑 먼저 — 여섯 가지 큰 상황", "md": "가장 자주, 가장 크게 막히는 자리입니다. 위의 카탈로그보다 먼저 보세요.\n\n### ① 결제 연동이 막힐 때\n\n| 증상 | 먼저 볼 것 | 그래도 안 되면 |\n|---|---|---|\n| 결제 창이 아예 안 뜬다 | 브라우저 개발자 도구의 콘솔. **키가 비어 있다**는 에러가 대부분 | 테스트 키와 실서비스 키를 **바꿔 넣었는지** 확인 |\n| 결제는 되는데 **내 서버가 모른다** | 결제 대행사 대시보드의 웹훅 로그. **주소가 `localhost`로 박혀 있으면** 대행사가 못 부릅니다 | 배포된 주소로 웹훅 주소를 바꾸고, 대행사 대시보드에 **다시 등록** |\n| 같은 결제가 **두 번 처리**된다 | 웹훅은 여러 번 올 수 있습니다. **처리한 결제 번호를 저장**하고 있는지 | 결제 번호를 유일 키로 저장 → 이미 있으면 그냥 성공 응답만 |\n| 정기결제가 **다음 달에 실패** | 카드 만료·한도 초과가 대부분 | 실패 시 재시도 횟수와 **사용자 알림**을 정해 둡니다 |\n| **금액이 다르게** 결제됐다 | 결제 금액을 **화면에서 받아 그대로 믿고 있지 않은지** | 금액은 **항상 서버가 다시 계산**합니다. 화면이 보낸 값을 믿지 않습니다 |\n| 국내 간편결제로 **정기결제가 안 된다** | 계약 형태에 따라 **되는 것과 안 되는 것이 갈립니다** | 「버전과 값」 표 ④를 보고, 안 되면 통합 결제 서비스를 검토 |\n| 해외 결제 서비스 가입이 **거절**된다 | 한국 판매자를 받는지 공식 지원 국가 페이지 확인 | 판매 대행(MoR) 방식을 검토 |\n\n> ⚠️ **웹훅은 반드시 진짜인지 검증합니다.** 검증 없이 받으면 **아무나 \"결제됐다\"고 내 서버에 알릴 수 있습니다.** 대행사 문서의 서명 검증 절차를 그대로 구현하세요.\n> ⚠️ **자동 환불을 만들지 마세요.** 환불은 사람이 누릅니다. 자동 환불은 분쟁을 만들고 되돌릴 수 없습니다.\n\n### ② 로그인이 안 될 때\n\n| 증상 | 먼저 볼 것 | 그래도 안 되면 |\n|---|---|---|\n| 로그인 후 **404 페이지** | 인증 서비스 설정의 **돌아올 주소(redirect URL) 목록**에 내 주소가 등록됐는지 | 개발용 주소와 배포용 주소를 **둘 다** 등록 |\n| **배포본에서 로그인했는데 내 컴퓨터 주소로 돌아감** | 코드에 돌아올 주소가 **박혀 있지 않은지**. 화면 주소를 그대로 쓰면 이렇게 됩니다 | 돌아올 주소를 **환경변수**로 빼고, 배포 환경에 값을 넣습니다 |\n| `invalid redirect_uri` 같은 에러 | 소셜 로그인 콘솔에 등록한 주소와 **글자 하나까지** 같은지. 끝의 슬래시, 앞뒤 공백 | 개발용 앱과 배포용 앱을 **따로** 만드는 것도 방법 |\n| 로그인은 되는데 **이메일이 비어 있음** | 소셜 로그인의 **동의 항목** 설정. 이메일은 추가 심사가 필요한 경우가 있습니다 | 콘솔에서 필요한 신청 절차를 먼저 마칩니다. 며칠 걸립니다 |\n| 한참 뒤에 **자동 로그아웃** | 인증 토큰의 만료 시간과 **자동 갱신**이 붙어 있는지 | 인증 서비스가 권장하는 표준 연동 방식을 그대로 씁니다 |\n| **아무나 관리자 페이지에 들어감** | 화면에서만 숨겼고 **서버에서 안 막았을** 가능성 | 권한 확인을 **서버 쪽**에 둡니다. 화면 숨김은 보안이 아닙니다 |\n| 데이터가 **빈 배열**로 온다 (에러는 없음) | 데이터베이스의 **행 단위 접근 정책**. 기본이 \"전부 차단\"입니다 | 정책을 만들고 **다른 계정 두 개로** 서로 안 보이는지 확인 |\n\n### ③ 배포는 됐는데 남의 기기에서 안 열릴 때\n\n**내 컴퓨터에서 되는 것과 남이 여는 것은 다릅니다.** 순서대로 확인하세요.\n\n| # | 확인 | 어떻게 |\n|---|---|---|\n| 1 | **주소가 맞나** | 내 컴퓨터 주소(`localhost`)를 보내지 않았는지. 그 주소는 **그 컴퓨터에서만** 열립니다 |\n| 2 | **환경변수가 배포 환경에 들어갔나** | 내 컴퓨터의 `.env`는 **올라가지 않습니다.** 배포 서비스 대시보드에 따로 넣습니다 |\n| 3 | **화면에서 쓰는 값에 접두사가 붙었나** | 브라우저가 읽어야 하는 환경변수는 **정해진 접두사**가 있어야 합니다. 없으면 값이 비어 옵니다 |\n| 4 | **빌드가 진짜 성공했나** | 배포 서비스의 빌드 로그. 실패했는데 **이전 버전이 그대로 떠 있는** 경우가 많습니다 |\n| 5 | **주소 목록에 배포 주소를 등록했나** | 인증·결제·데이터베이스 각각의 허용 주소 목록 |\n| 6 | **HTTPS 인증서가 발급됐나** | 직접 산 도메인을 붙였다면 DNS 설정이 퍼지는 데 시간이 걸립니다 |\n| 7 | **로그인이 필요한 화면 아닌가** | 남에게는 로그인 화면만 보일 수 있습니다. **로그아웃 상태로 직접 열어 보세요** |\n| 8 | **시크릿 창으로 열어 봤나** | 내 브라우저에만 남아 있는 로그인·캐시 때문에 나만 되는 경우 |\n\n> **가장 빠른 확인법** — 휴대폰에서 **와이파이를 끄고** 그 주소를 엽니다. 이러면 내 컴퓨터·내 네트워크·내 브라우저가 전부 빠집니다.\n\n### ④ 같은 에러가 세 번 반복될 때\n\n**여기가 이 절에서 가장 중요합니다.**\n\n> **세 번 같은 에러가 나오면 멈춥니다.** 네 번째 시도는 하지 않습니다.\n\nAI는 안 되면 **다른 방법을 찾는 게 아니라 같은 방법을 조금 바꿔서 또 합니다.** 그러면 토큰만 타고 코드가 지저분해집니다.\n\n**세 번째에 하는 것 — 순서대로**\n\n| # | 무엇 | 왜 |\n|---|---|---|\n| 1 | **멈춘다** | 더 시켜도 같은 자리를 돕니다 |\n| 2 | **되돌린다** | 세 번 시도하는 동안 붙은 임시 코드를 전부 버립니다. 되돌리기가 가장 빠른 복구입니다 |\n| 3 | **에러를 요약하지 말고 그대로 붙인다** | *\"에러가 나요\"*가 아니라 **에러 전문을 통째로.** 줄 번호와 파일 이름이 답인 경우가 많습니다 |\n| 4 | **로그를 먼저 붙인다** | 코드보다 로그입니다. 서버 로그·빌드 로그·브라우저 콘솔 |\n| 5 | **전략을 바꾼다** | 같은 대화에서 또 시키지 않습니다. **새 대화를 열고 문제를 처음부터 다시 설명**합니다 |\n| 6 | **더 작게 쪼갠다** | *\"로그인이 안 돼\"* → *\"인증 서비스가 토큰을 주는 데까지는 되는지\"* |\n\n**세 번째에 쓰는 프롬프트**\n\n```\n같은 에러가 세 번 반복됐어. 지금까지의 방법은 버리자.\n\n에러 전문:\n[여기에 그대로 붙여넣기]\n\n관련 로그:\n[여기에 그대로 붙여넣기]\n\n이렇게 해 줘.\n1) 지금까지 시도한 방향이 왜 안 됐는지 먼저 말해.\n2) 완전히 다른 접근을 두 가지 제안해.\n3) 코드는 아직 고치지 마. 어느 쪽으로 갈지 내가 고를게.\n```\n\n**그리고 자동으로 멈추게 만들어 둘 수 있습니다.** Stage 3의 훅으로 *\"같은 에러가 3회 반복되면 중단\"*을 걸어 두는 것이 정석입니다.\n\n### ⑤ 옵시디언 금고를 잘못 만들었을 때\n\n**「새 금고 만들기」를 눌러 빈 폴더가 생기는 것이 가장 흔한 사고입니다.**\n\n원인은 하나입니다 — **금고(vault)는 새로 만드는 게 아니라, 이미 있는 폴더를 여는 것**입니다.\n\n| 증상 | 왜 | 어떻게 |\n|---|---|---|\n| 금고를 만들었는데 **안이 비어 있다** | 새 폴더를 만든 것입니다. 내 파일은 원래 폴더에 그대로 있습니다 | 빈 폴더를 **휴지통으로** 옮기고, **「폴더를 금고로 열기」**로 원래 폴더를 엽니다 |\n| 빈 금고가 **두세 개** 생겼다 | 안 열려서 여러 번 눌렀습니다 | 안이 빈 것만 골라 휴지통으로. **파일이 있는 것은 건드리지 않습니다** |\n| 파일이 사라진 것 같다 | 대개 **다른 금고를 보고 있는 것**입니다 | 왼쪽 아래에서 **금고 전환**으로 원래 금고를 고릅니다 |\n| 열었는데 파일이 안 보인다 | 폴더 안에 폴더가 한 겹 더 있는 경우 | 파일 탐색기에서 실제 폴더 구조를 확인합니다 |\n| 설정이 이상해졌다 | 금고마다 설정이 **따로**입니다 | 금고를 바꾸면 설정도 바뀝니다. 이상한 게 아닙니다 |\n\n> **기억할 한 줄** — **금고는 그냥 폴더입니다.** 특별한 형식이 아닙니다. 그래서 이미 쓰던 폴더를 그대로 열면 됩니다. 그리고 **지울 때는 반드시 휴지통으로.** 완전 삭제하지 않습니다.\n\n### ⑥ 깃허브 인증이 막힐 때\n\n| 증상 | 왜 | 어떻게 |\n|---|---|---|\n| `Permission denied (publickey)` | 열쇠(SSH 키)를 안 만들었거나, 만든 열쇠를 계정에 안 등록했습니다 | ① 열쇠 만들기 ② **공개키**를 계정 설정에 등록 ③ 연결 시험 |\n| 비밀번호를 넣으라는데 **계속 거부** | 비밀번호로는 안 됩니다. **토큰**이나 열쇠를 씁니다 | 계정 설정에서 접근 토큰을 만들어 비밀번호 자리에 넣습니다 |\n| 예전에 되던 게 **갑자기 안 됨** | 토큰이 **만료**됐습니다 | 새로 만들고, 컴퓨터에 저장된 옛 토큰을 지웁니다 |\n| **비공개** 저장소만 안 된다 | 토큰의 권한 범위에 비공개 저장소가 빠졌습니다 | 토큰을 다시 만들며 필요한 권한을 켭니다 |\n| 회사 계정과 개인 계정이 **섞인다** | 컴퓨터에 저장된 인증 정보가 하나뿐이라 그렇습니다 | 저장된 인증 정보를 지우고 **쓸 계정으로 다시** 로그인 |\n| **push가 거부**되고 파일이 크다는 말 | 100MB 넘는 파일은 못 올립니다 | 그 파일을 커밋에서 빼고 `.gitignore`에 넣습니다. **이미 커밋했으면 이력에서도 지워야** 합니다 |\n\n> ⚠️ **여기서 가장 조심할 것** — 인증이 안 풀린다고 `--force`로 밀지 마세요. **남의 작업이 아니라 내 과거 작업이 사라집니다.** 되돌릴 방법은 Stage 4.5에 있습니다."}, {"title": "📚 카탈로그 — 증상으로 찾기", "md": "### AI 코딩 도구\n\n| 증상 | 대개 이것 | 어떻게 |\n|---|---|---|\n| 명령이 **거부**된다 (permission denied) | 허용 목록에 그 명령이 없음 | 도구 설정의 허용 목록에 추가 → 도구 재시작 |\n| 대화가 길어지자 **점점 이상해진다** | 앞의 결정을 잊고 이미 고친 걸 되돌립니다 | 다른 일이면 대화를 **새로** 시작. 같은 일이면 **압축.** **한 작업 = 한 대화**가 원칙 |\n| **\"끝났습니다\"인데 안 끝남** | 자동 검증 훅이 통과 못 하는데 계속 재시도 | 멈추고 **사람이 로그를 직접** 봅니다. 훅에 **시도 횟수 제한**을 겁니다 |\n| **지침 파일을 무시**한다 | 지침이 너무 길거나, 절대 규칙이 눈에 안 띔 | 지침을 짧게. 절대 규칙은 **\"절대\"라는 말로 명확히.** 진짜 절대 규칙은 **훅으로 강제** |\n| 비용이 **갑자기 크게** 늘었다 | 큰 파일을 통째로 첨부 / 무거운 모델 / 생각을 너무 많이 시킴 | 가벼운 모델로 바꾸고, 파일은 **필요한 부분만** 붙입니다. 사용량 확인을 습관으로 |\n| 외부 도구(MCP) **연결 실패** | 패키지를 못 찾거나 토큰 만료 | 터미널에서 그 명령을 **직접 실행**해 진짜 에러를 봅니다 |\n| 자동 생성된 지침 파일이 **일반론뿐** | 자동 생성은 내 프로젝트를 모릅니다 | 지우고 **직접 씁니다.** 진짜 겪은 실수만 적습니다 |\n\n### 데이터베이스\n\n| 증상 | 대개 이것 | 어떻게 |\n|---|---|---|\n| 응답은 성공인데 **데이터가 빈 배열** | 행 단위 접근 정책이 전부 막고 있음 (기본이 차단) | 정책을 만듭니다. 표를 만들 때 **정책도 같이** 만드는 습관 |\n| **다른 사람 데이터가 보인다** | 정책의 비교 대상 칸이 잘못됨 | 즉시 막고 다시 작성. **계정 두 개로 반드시 검증** |\n| 파일 업로드가 **401** | 저장소 버킷에도 정책이 필요합니다 | 읽기·쓰기·수정·삭제 정책을 **네 개 다** 만듭니다 |\n| 브라우저 콘솔에 **CORS 차단** | 브라우저에서 직접 부르고 있음 | **서버 쪽에서** 부르도록 바꿉니다 |\n| **서비스 키를 저장소에 올렸다** | `.gitignore` 누락 | ① **키를 즉시 재발급** ② 파일 제외 ③ **이력에서도 제거.** 순서대로. 재발급이 먼저입니다 |\n\n### 배포\n\n| 증상 | 대개 이것 | 어떻게 |\n|---|---|---|\n| **\"값이 필요합니다\"** 류의 에러 (가장 흔함) | 배포 환경에 환경변수를 안 넣음 | 배포 서비스 대시보드에 넣고 **다시 배포** |\n| 브라우저에서 환경변수가 **비어 있다** | 접두사 규칙을 안 지킴 | 화면에서 쓸 값에만 정해진 접두사를 붙입니다. **비밀값에는 절대 붙이지 않습니다** |\n| 빌드 실패 — 타입 에러 | 내 컴퓨터에서는 검사 없이 돌았습니다 | 로그의 **첫 번째** 에러부터 고칩니다. 뒤엣것은 대개 파생입니다 |\n| 서버 함수가 **시간 초과** | 오래 걸리는 작업을 요청 안에서 다 함 | 작업을 쪼개거나 **예약 실행**으로 옮깁니다 |\n| 도메인 붙였는데 **인증서가 안 나옴** | DNS 설정이 아직 퍼지지 않음 | DNS 값을 다시 확인하고 기다립니다. 그래도 안 되면 도메인 등록처 설정 |\n| 함수가 **404** | 파일 위치나 이름 규칙이 안 맞음 | 프레임워크의 폴더 규칙을 확인합니다 |\n\n### 자동화 워크플로\n\n| 증상 | 대개 이것 | 어떻게 |\n|---|---|---|\n| **도커에 연결할 수 없다** | 도커가 안 켜져 있음 | 도커를 실행합니다. **소켓을 컨테이너에 열어 주지는 마세요**(「보안」 절) |\n| 워크플로가 **무한 반복**해 API를 폭주시킴 | 자기 자신을 다시 부르는 고리 | **실행 횟수 상한**을 먼저 걸고 고칩니다. 비용이 먼저 터집니다 |\n| **429** — 너무 많이 불렀다는 응답 | 초당 호출 한도 초과 | 사이에 대기를 넣고, 한 번에 여러 건을 묶어 보냅니다 |\n| 예약이 **엉뚱한 시간**에 돈다 | 시간대 설정이 다름 | 워크플로의 시간대를 **명시적으로** 지정합니다 |\n| 워크플로 파일에 **비밀값이 그대로** | 값을 직접 적었습니다 | 자격증명 저장 기능으로 옮깁니다. **워크플로 파일은 내보내면 그대로 보입니다** |\n\n### AI API\n\n| 증상 | 대개 이것 | 어떻게 |\n|---|---|---|\n| **401** 인증 실패 | 키가 틀렸거나, 환경변수가 안 읽힘 | 키 앞뒤 공백·줄바꿈 확인. 배포 환경에도 넣었는지 |\n| 청구액이 **예상의 몇 배** | 긴 프롬프트 반복 / 무거운 모델 / 재시도 고리 | **먼저 상한을 겁니다.** 그다음 원인을 찾습니다 |\n| 응답이 **중간에 잘림** | 출력 길이 상한 | 상한을 올리거나 **나눠서** 요청합니다 |\n| 자료 기반 답변이 **엉뚱하다** | 찾아온 문서가 질문과 무관 | 먼저 **무엇을 찾아왔는지** 확인합니다. 답이 아니라 검색이 문제인 경우가 많습니다 |\n| 사용자가 **숨긴 지시문을 뽑아낸다** | 프롬프트 인젝션 | 시스템 지시에 비밀을 담지 않습니다. **비밀은 서버에 두고 모델에 넣지 않습니다** |\n\n### 깃과 일반\n\n| 증상 | 대개 이것 | 어떻게 |\n|---|---|---|\n| **`.env`가 올라갔다** | `.gitignore` 누락 | ① **모든 키 재발급** ② 파일 제외 ③ 이력 제거. **재발급이 항상 먼저** |\n| **충돌**이 났다 | 같은 줄을 둘이 고침 | 표시된 부분에서 남길 쪽을 고릅니다. AI에게 **양쪽 의도를 설명**하면 잘 도와줍니다 |\n| 잘못된 커밋을 만들었다 | — | **아직 안 밀었으면** 로컬에서 되돌리고, **이미 밀었으면** 되돌리는 커밋을 새로 만듭니다 (Stage 4.5) |\n| 날린 것 같다 | — | **먼저 `reflog`를 봅니다.** 대개 아직 살아 있습니다 |"}, {"title": "📘 말 풀이", "md": "**웹훅(webhook)**\n바깥 서비스가 **일이 생기면 내 서버 주소로 알려 주는 전화.** 결제가 끝났을 때 결제 회사가 내 서버에 거는 전화라고 생각하면 됩니다. 내 서버 주소가 바깥에서 닿을 수 있어야 걸립니다.\n\n**환경변수**\n코드 바깥에 따로 적어 두는 값. 키·비밀번호·주소처럼 **환경마다 달라지고 남에게 보이면 안 되는 것**을 여기 둡니다. 내 컴퓨터의 값은 배포 환경으로 **자동으로 따라가지 않습니다.**\n\n**금고(vault)**\n옵시디언이 여는 **폴더 하나.** 특별한 파일 형식이 아니라 그냥 마크다운 파일이 들어 있는 보통 폴더입니다."}, {"title": "⚠️ 자주 걸리는 함정", "md": "| 함정 | 왜 |\n|---|---|\n| **에러를 요약해서 전달** | 답이 대개 요약에서 잘려 나간 부분에 있습니다. **그대로 붙이세요** |\n| **네 번째 시도** | 세 번 같으면 방법이 틀린 것입니다. 멈추고 되돌립니다 |\n| **키가 새어 나갔는데 파일부터 지움** | **재발급이 먼저**입니다. 파일을 지워도 이미 나간 키는 살아 있습니다 |\n| **금고를 지우면서 완전 삭제** | 휴지통으로 옮깁니다. 잘못 고른 폴더일 수 있습니다 |\n| **`--force`로 밀기** | 내 과거 작업이 사라집니다 |\n| **실서비스에서 바로 시험** | 테스트 모드와 개발용 키가 있는 이유입니다 |\n| **비용 문제인데 원인부터 찾기** | **상한을 먼저 겁니다.** 원인은 그다음입니다 |"}, {"title": "⚡ 이렇게 하세요", "md": "### 막혔을 때 붙여 쓰는 프롬프트\n\n```\n막혔어. 아래를 그대로 줄게. 추측하지 말고 로그에서 근거를 찾아 줘.\n\n무엇을 하려던 것:\n[한 줄]\n\n무엇이 보이는가 (에러 전문 그대로):\n[붙여넣기]\n\n로그 (서버 / 빌드 / 브라우저 콘솔):\n[붙여넣기]\n\n방금 무엇을 바꿨나:\n[한 줄. 없으면 \"없음\"]\n\n이렇게 답해 줘.\n1) 가장 가능성 높은 원인 하나\n2) 그 원인이 맞는지 5분 안에 확인하는 방법\n3) 확인된 뒤에 할 수정\n아직 코드는 고치지 마.\n```\n\n### 배포 직후 3분 점검\n\n배포할 때마다 이 다섯 개를 봅니다. 여기서 막히는 것 대부분이 걸립니다.\n\n1. **휴대폰에서 와이파이를 끄고** 주소를 연다.\n2. **로그아웃 상태**로 첫 화면이 뜨는지 본다.\n3. **가입 → 로그인**을 새 계정으로 해 본다.\n4. **결제(테스트 모드)**를 한 번 통과시킨다.\n5. **해지**까지 눌러 본다.\n\n### 에러를 붙일 때 지울 것\n\n로그에는 **키·토큰·접속 정보·남의 이메일**이 섞여 있는 경우가 많습니다. 붙이기 전에 훑어보고 그런 값은 `[삭제]`로 바꿉니다. **AI에게 주는 것도 바깥으로 내보내는 것입니다.**"}, {"title": "✅ 됐는지 확인", "md": "- [ ] 지금 막힌 증상을 이 절에서 **찾을 수 있었나?**\n- [ ] 에러를 **요약하지 않고 전문 그대로** 붙였나?\n- [ ] 같은 에러가 **세 번 넘게** 반복되고 있지 않나?\n- [ ] 배포본을 **휴대폰에서 와이파이 끄고** 열어 봤나?\n- [ ] 키가 새어 나갔다면 **재발급을 먼저** 했나?\n- [ ] 로그를 붙이기 전에 **비밀값을 지웠나?**"}, {"title": "🔎 더 깊이", "md": "**여기 없는 증상을 만났을 때 — 검색하는 순서**\n\n1. **에러 메시지의 고유한 부분만** 따옴표로 묶어 검색합니다. 내 파일 이름·경로는 뺍니다.\n2. 그 도구의 **공식 문서 안에서** 같은 말을 검색합니다.\n3. 그래도 없으면 **저장소의 이슈 목록**에서 검색합니다. 같은 걸 겪은 사람이 대개 있습니다.\n4. **날짜를 봅니다.** 2년 전 답은 지금 안 맞을 수 있습니다.\n\n**이 절과 이어지는 곳**\n\n- 되돌리기 3단 → **Stage 4.5**\n- 같은 에러 반복을 자동으로 멈추는 훅 → **Stage 3**\n- 에러 추적 도구 붙이기 → **Stage 6·8**\n- 키가 새어 나갔을 때의 처리 → 부록 **「보안」**\n- 무료 한도에서 걸렸을 때 → 부록 **「돈 없이 어디까지」**\n\n**새 항목을 여기에 추가하는 법**\n\n내가 실제로 막혔던 것만 넣습니다. 형식은 **증상 → 먼저 볼 것 → 그래도 안 되면** 셋입니다. **원인 설명은 짧게.** 막힌 사람은 설명이 아니라 다음 행동을 찾고 있습니다."}]}, {"file": "5-돈없이어디까지.md", "id": "s부록-5", "no": "5", "title": "돈 없이 어디까지 — 배우는 단계의 비용 지도", "through": "배우는 단계에서 결제는 테스트 모드까지만 간다. 실제 계약은 팔 사람이 생겼을 때 한다.", "time": "20분", "need": [], "head": "무엇이 무료이고, **돈이 드는 지점이 정확히 어디인지.** 금액은 「버전과 값」에 있습니다.", "secs": [{"title": "왜 이걸 하나", "md": "혼자 배우다가 중간에 멈추는 가장 흔한 이유는 어려워서가 아닙니다. **\"어? 여기서 돈이 드네\"** 하고 멈추는 것입니다.\n\n그런데 대부분의 지점은 **돈을 안 내도 끝까지 갈 수 있습니다.** 어디가 진짜 돈이 드는 자리인지 미리 알면 멈추지 않습니다.\n\n이 절을 안 보면 이렇게 됩니다 — Stage 6에서 결제를 배우려고 결제 대행사에 가입하러 갑니다. **가입비 수십만 원 이야기가 나옵니다.** 팔 사람이 아직 한 명도 없는데 말입니다. 그리고 거기서 멈춥니다.\n\n> **그 돈은 배우는 단계에서 낼 돈이 아닙니다.**"}, {"title": "큰 그림 — 지도 한 장", "md": "| 무엇 | 배우는 단계 | 돈이 드는 지점 |\n|---|---|---|\n| AI 코딩 도구 | **하나는 무료 진입로가 있습니다** | 매일 쓰기 시작하면 한도가 찹니다 → **첫 유료 지출** |\n| 코드 저장소 | ✅ 무료 | 비공개 저장소에서 자동 검사를 많이 돌릴 때 |\n| 배포 | ✅ 무료 | 방문자가 많아질 때 · 팀으로 쓸 때 |\n| 데이터베이스 | ✅ 무료 | 용량이 차거나, **쉬면 멈추는 것이 불편해질 때** |\n| 도메인(내 주소) | ❌ **처음부터 돈이 듭니다** | 연 단위 결제. 액수는 작습니다 |\n| 이메일 발송 | ✅ 무료 구간 있음 | 구독자가 늘 때. **단 발신 도메인이 먼저 필요** |\n| 에러 추적 | ✅ 무료 | **여기가 대개 가장 먼저 찹니다** |\n| 디자인 도구 | ✅ 무료로 상당히 됩니다 | 브랜드 자동 적용 · 협업 기능 |\n| **결제 대행 계약** | ⛔ **배우는 단계에서는 안 합니다** | **팔 사람이 생겼을 때** |\n| 세무 대행 | ⛔ 아직 | 매출이 생긴 뒤 |\n| 법률 검토 | ⛔ 아직 | **돈을 받기 직전에 한 번** |\n\n**정리하면 배우는 단계에서 실제로 나가는 돈은 셋입니다.**\n\n1. **도메인** — 작습니다. 그리고 이게 없으면 뉴스레터 발송 인증이 아예 안 됩니다.\n2. **AI 도구 사용료** — 매일 쓰면 무료 한도가 찹니다. **여기가 첫 번째 진짜 지출입니다.**\n3. **(선택) 법률 검토 한 번** — 돈을 실제로 받기 직전에.\n\n**나머지는 전부 미룰 수 있습니다.**"}, {"title": "결제 — 테스트 모드까지만", "md": "가장 크게 오해하는 자리입니다.\n\n> **결제를 \"배우는 것\"과 결제를 \"받는 것\"은 완전히 다른 일입니다.**\n\n| | 테스트 모드 | 실제 계약 |\n|---|---|---|\n| 필요한 것 | **가입만.** 대개 사업자 등록도 필요 없습니다 | 사업자등록증 · 심사 · 계약 |\n| 돈 | **0원** | 가입비 · 연회비 · 수수료 |\n| 되는 것 | 결제 창 띄우기 · 성공/실패 흐름 · 웹훅 받기 · 정기결제 흐름 · 해지 흐름 | 진짜 돈이 들어옵니다 |\n| 언제 하나 | **Stage 6 학습 내내** | **첫 손님이 생겼을 때** |\n\n**테스트 모드로 어디까지 만들 수 있나** — 배우는 데 필요한 것은 사실상 전부입니다.\n\n- 결제 창을 띄우고 성공·실패를 다르게 처리하기\n- 결제 완료 웹훅을 받아 내 데이터베이스에 기록하기\n- 웹훅이 두 번 왔을 때 중복을 막기\n- 정기결제(빌링) 등록과 다음 달 자동 청구 흐름\n- **해지 화면 만들기** — 다크패턴 규제 때문에 이게 실제로 중요합니다\n- 실패했을 때 재시도와 알림\n\n> **[확인 필요]** — 테스트 모드에서 정확히 어디까지 되는지는 **대행사마다 다릅니다.** 특히 정기결제와 일부 간편결제는 테스트 지원 범위가 갈립니다. 가입 전에 각 사의 개발자 문서를 확인하고, 결과를 「버전과 값」 표 ④에 적어 두세요.\n\n### 그럼 실제 계약은 언제 하나\n\n**이 셋이 다 되면 그때입니다.**\n\n1. 서비스가 **남의 기기에서 실제로 열린다**.\n2. **돈을 내겠다고 말한 사람이 한 명 이상** 있다.\n3. **법무 부록의 준비물이 끝났다** — 사업자 등록 · 처리방침 · 해지 동선 · 푸터 표기.\n\n셋 중 하나라도 안 됐으면 계약하지 않습니다. **계약을 먼저 하면 준비되기 전에 돈이 나갑니다.**"}, {"title": "무료 한계는 대개 어디서 먼저 걸리나", "md": "**순서가 있습니다.** 이 순서를 알면 놀라지 않습니다.\n\n| 순서 | 어디 | 왜 여기가 먼저인가 | 걸리면 어떻게 되나 |\n|---|---|---|---|\n| **1** | **AI 도구 사용 한도** | 매일 쓰면 가장 빨리 찹니다 | 작업이 멈춥니다. **그래서 백업 도구가 하나 필요합니다** |\n| **2** | **에러 추적 건수** | 에러 하나가 여러 건으로 쌓입니다. **버그 하나가 한 달 한도를 다 먹기도** 합니다 | 그 뒤의 에러가 안 보입니다. **가장 위험한 종류의 한도 초과** |\n| **3** | 비공개 저장소의 자동 검사 시간 | 커밋마다 검사가 돌면 빨리 찹니다 | 검사가 안 돌아 PR이 멈춥니다 |\n| **4** | 이메일 발송 건수 | 구독자 수 × 발송 횟수 | 발송이 막힙니다 |\n| **5** | 데이터베이스 — 쉬면 멈춤 | 며칠 안 쓰면 잠들 수 있습니다 | 첫 접속이 느리거나 실패합니다. **남에게 보여줄 때 하필 이럽니다** |\n| **6** | 배포 대역폭 | 방문자가 늘어야 걸립니다 | 대개 한참 뒤입니다 |\n\n> **2번이 왜 위험한가** — 에러 추적 한도를 넘으면 **그 뒤의 에러가 기록되지 않습니다.** 그런데 화면에는 아무 표시가 없습니다. *\"에러가 없네\"*가 아니라 *\"안 보이는 것\"*입니다. 무료 한도 알림을 반드시 켜 두세요.\n\n**숫자는 「버전과 값」 표 ③에 있습니다.** 확인 날짜와 함께요."}, {"title": "순서 — 무엇에 먼저 돈을 내나", "md": "돈이 생겼을 때 순서입니다.\n\n| 순위 | 무엇 | 왜 이 순서인가 |\n|---|---|---|\n| 1 | **도메인** | 뉴스레터 발신 인증의 전제입니다. 없으면 메일이 아예 거부됩니다. 액수도 가장 작습니다 |\n| 2 | **AI 도구 하나** | 매일 쓰는 도구입니다. 여기서 멈추면 다 멈춥니다 |\n| 3 | **에러 추적 한 단계 위** | 안 보이는 에러가 가장 비쌉니다 |\n| 4 | **법률 검토 한 번** | 돈을 받기 직전에. 물어볼 것을 정리해 가면 짧게 끝납니다 |\n| 5 | **결제 대행 계약** | 팔 사람이 생겼을 때 |\n| 6 | 세무 대행 | 매출이 생기고 신고가 부담스러워질 때 |\n| 7 | 디자인 도구 유료 · 두 번째 AI 도구 | **가장 나중.** 없어도 됩니다 |\n\n> **두 번째 AI 도구가 왜 마지막인가** — 교차 리뷰가 **얼마나 이득인지는 측정된 적이 없습니다.** 그리고 이미 다른 AI 구독이 있다면 추가 비용이 0이라 계산이 달라집니다. **없으면 하나를 제대로 익히는 것이 먼저입니다.**"}, {"title": "배우는 단계에서 안 사도 되는 것", "md": "| 무엇 | 왜 아직인가 |\n|---|---|\n| 결제 대행 계약 | 테스트 모드로 다 배웁니다 |\n| 유료 감시·모니터링 서비스 | 무료로 충분합니다. ⚠️ **단 개인·비상업 한정 무료 서비스를 파는 서비스에 쓰면 약관 위반**입니다 |\n| 유료 이메일 플랜 | 구독자가 생긴 뒤 |\n| 디자인 도구 유료 플랜 | 무료로도 **템플릿을 고정하고 글자만 바꾸는 방식**이면 일관성이 잡힙니다 |\n| 유료 이미지·영상 생성 서비스 | 편집 중심으로 우회할 수 있습니다 (Stage 4) |\n| 유료 강의 | 이 커리큘럼과 공식 문서로 갑니다 |\n| 서버를 직접 빌리기 | 배포 서비스 무료 구간이 훨씬 쉽고 안전합니다 |"}, {"title": "📘 말 풀이", "md": "**테스트 모드**\n결제 대행사가 주는 **가짜 결제 환경.** 진짜 카드도 진짜 돈도 오가지 않지만 결제 흐름은 똑같이 돕니다. 여기서 만든 코드는 나중에 **키만 바꾸면** 실제로 동작합니다.\n\n**무료 한도(free tier)**\n\"여기까지는 공짜\"의 경계선. 대개 **월 단위로 초기화**되고, 넘으면 **막히거나 요금이 붙습니다.** 어느 쪽인지는 서비스마다 다르니 미리 확인하세요.\n\n**발신 도메인**\n내 메일이 **진짜 나에게서 왔다는 것을 증명하는 주소.** 남의 무료 메일 주소로는 이 증명을 할 수 없어서, 뉴스레터를 보내려면 내 도메인이 반드시 필요합니다."}, {"title": "⚠️ 자주 걸리는 함정", "md": "| 함정 | 무슨 일이 생기나 |\n|---|---|\n| **배우려고 결제 대행 계약부터 함** | 팔 사람이 없는데 가입비가 나갑니다. **테스트 모드면 됩니다** |\n| **무료 한도 알림을 안 켬** | 특히 에러 추적이 조용히 막힙니다. **에러가 없는 게 아니라 안 보이는 것** |\n| **AI API에 사용량 상한을 안 검** | 워크플로가 고리에 빠지면 **하룻밤에 크게 나갑니다.** 상한을 먼저 겁니다 |\n| **개인 카드로 서비스 요금 결제** | 나중에 사업 비용으로 정리하기 어려워집니다 |\n| **개인·비상업 한정 무료 서비스를 파는 서비스에** | 약관 위반입니다. 무료라고 다 쓸 수 있는 게 아닙니다 |\n| **무료라서 다 켜 둠** | 안 쓰는 서비스가 늘면 **처리방침에 적을 국외이전 항목만** 늘어납니다 |\n| **도메인을 마지막에 삼** | 뉴스레터를 만들어 놓고 보낼 수가 없습니다. **가장 먼저 사세요** |"}, {"title": "⚡ 이렇게 하세요", "md": "### 첫날 — 0원으로 세팅하는 순서 (60분)\n\n1. 코드 저장소 계정을 만든다. **무료.**\n2. 배포 서비스에 저장소를 연결한다. **무료.**\n3. 데이터베이스 프로젝트를 하나 만든다. **무료.** 가능하면 **서울 리전**을 고릅니다(「법무·세무」의 국외이전이 가벼워집니다).\n4. 에러 추적을 붙이고 **무료 한도 알림을 켠다.** 이 단계를 건너뛰지 마세요.\n5. AI 코딩 도구 하나를 무료 진입로로 시작한다.\n6. **여기까지 0원입니다.**\n\n### 돈 쓰기 전에 스스로에게 묻는 셋\n\n```\n1) 지금 이걸 안 사면 오늘 무엇이 막히나?\n   → \"막히는 게 없다\"면 아직입니다.\n\n2) 무료 한도의 어느 줄에서 걸렸나?\n   → 모르면 아직 안 걸린 것입니다.\n\n3) 돈을 내겠다고 말한 사람이 있나?\n   → 결제 대행 계약은 이 답이 \"예\"일 때만 합니다.\n```\n\n### 상한 걸기 — 오늘 30분\n\n돈이 새는 자리는 셋입니다. **셋 다 상한이나 알림을 걸 수 있습니다.**\n\n| 어디 | 무엇을 거나 |\n|---|---|\n| AI API | **월 사용량 상한.** 넘으면 아예 멈추게 |\n| 자동화 워크플로 | **실행 횟수 상한.** 고리에 빠져도 폭주하지 않게 |\n| 무료 한도 있는 서비스 전부 | **한도 도달 알림.** 특히 에러 추적 |\n\n### 유료로 넘어갈 때 — 카드부터 바꾼다\n\n첫 유료 결제를 하기 전에 **사업용 카드**를 먼저 만듭니다. 개인 카드로 시작하면 나중에 전부 옮겨야 하고, 그 사이의 비용은 정리하기 어려워집니다. (「법무·세무」 ⑧)"}, {"title": "✅ 됐는지 확인", "md": "- [ ] 지금까지 쓴 돈이 **도메인 말고 있나?** 있다면 그게 꼭 필요했나?\n- [ ] 결제를 **테스트 모드**로 만들고 있나? (실제 계약을 이미 했다면 왜 했는지 답할 수 있나)\n- [ ] **에러 추적의 무료 한도 알림**이 켜져 있나?\n- [ ] AI API에 **사용량 상한**을 걸었나?\n- [ ] 무료로 쓰는 서비스 중에 **개인·비상업 한정인 것**을 파는 서비스에 쓰고 있지 않나?\n- [ ] 「버전과 값」 표 ③의 무료 한도 칸이 **채워져 있나?**\n- [ ] 사업용 카드가 필요한 시점이 **언제인지** 말할 수 있나?"}, {"title": "🔎 더 깊이", "md": "**어디서 확인하나**\n\n무료 한도의 실제 숫자는 **각 서비스의 공식 요금 페이지**에서만 확인합니다. 그리고 그 값은 **「버전과 값」 표 ③**에 확인 날짜와 함께 적어 둡니다. 이 절은 *\"어디서 먼저 걸리는가\"*만 다루고 숫자를 갖지 않습니다.\n\n**무엇을 검색하면 되나**\n\n`free tier limits` · `usage limits` · `spend limit` · 각 서비스의 `pricing` 페이지 안의 **\"무료 플랜에 포함되지 않는 것\"** 목록. 대개 이 목록이 진짜 정보입니다.\n\n**이어지는 곳**\n\n- 결제 테스트 모드 실습 → **Stage 6**\n- 무료 자동화 실행 시간 → **Stage 7**\n- 무료 감시·알림 구성 → **Stage 8**\n- 사업자 등록과 세금 순서 → 부록 **「법무·세무」**\n- 실제 금액과 확인 날짜 → 부록 **「버전과 값」**"}]}]}]}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
<script>
(function(){
  var D = JSON.parse(document.getElementById('data').textContent);
  var KEY = 'vm2-read-v1';
  var read = {};
  try { read = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch(e) { read = {}; }
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(read)); } catch(e) {} }
  if (window.marked && marked.setOptions) marked.setOptions({gfm:true, breaks:false});
  function md(s){ return window.marked ? marked.parse(s||'') : '<pre>' + esc(s||'') + '</pre>'; }
  function esc(s){ return (s||'').replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  // 칸 제목 → 상자 종류
  function kind(t){
    if (t.indexOf('말 풀이') >= 0) return 'k-say';
    if (t.indexOf('함정') >= 0) return 'k-trap';
    if (t.indexOf('더 깊이') >= 0) return 'k-deep';
    if (t.indexOf('이렇게 하세요') >= 0) return 'k-zap';
    if (t.indexOf('됐는지') >= 0 || t.indexOf('자가 체크') >= 0) return 'k-ok';
    return '';
  }

  var cur = location.hash.replace('#', '') || 'home';
  var nav = document.getElementById('nav'), main = document.getElementById('main');

  function counts(st){
    var n = st.sections.length, r = 0;
    st.sections.forEach(function(s){ if (read[s.id]) r++; });
    return [r, n];
  }

  function drawNav(){
    nav.innerHTML = '';
    var home = document.createElement('button');
    home.className = 'navitem'; home.type = 'button';
    home.innerHTML = '<span class="k">☰</span><span>전체 목차</span>';
    home.setAttribute('aria-current', cur === 'home' ? 'true' : 'false');
    home.onclick = function(){ go('home'); };
    nav.appendChild(home);
    D.stages.forEach(function(st){
      var b = document.createElement('button');
      b.className = 'navitem'; b.type = 'button';
      b.style.setProperty('--sc', st.color);
      var c = counts(st);
      b.innerHTML = '<span class="k">' + esc(st.key) + '</span><span>' + esc(st.name) + '</span>' +
                    '<span class="done">' + (c[1] ? c[0] + '/' + c[1] : '—') + '</span>';
      b.setAttribute('aria-current', cur === st.key ? 'true' : 'false');
      b.onclick = function(){ go(st.key); };
      nav.appendChild(b);
    });
  }

  function homeView(){
    var rows = D.stages.map(function(st){
      var c = counts(st);
      return '<tr><td style="color:' + st.color + '">' + esc(st.key) + ' ' + esc(st.name) + '</td>' +
             '<td>' + esc(st.goal || '—') + '</td>' +
             '<td>' + esc(st.makes || '—') + '</td>' +
             '<td class="hitstage">' + (c[1] ? c[0] + ' / ' + c[1] + ' 절' : '준비 중') + '</td></tr>';
    }).join('');
    var done = 0, all = 0;
    D.stages.forEach(function(st){ var c = counts(st); done += c[0]; all += c[1]; });
    main.innerHTML =
      '<span class="chip" style="--sc:#1F7A5C">전체 목차</span>' +
      '<h2 class="st">한 사람이 웹서비스 하나를 만들어 내놓기까지</h2>' +
      '<div class="sub">앞 장에서 나온 것이 뒤 장의 재료가 됩니다. 순서대로 가는 것이 가장 빠릅니다.</div>' +
      '<div class="progress" style="--sc:#1F7A5C"><i style="width:' + (all ? Math.round(done / all * 100) : 0) + '%"></i></div>' +
      '<div class="ptext">' + done + ' / ' + all + ' 절 읽음</div>' +
      '<table class="toctbl"><thead><tr><th>장</th><th>학습 목적</th><th>만드는 것</th><th>진도</th></tr></thead><tbody>' +
      rows + '</tbody></table>' +
      '<div class="kbox k-ok"><b>✅ 자가 체크가 붙어 있습니다</b>각 장 끝에 예·아니오로 답하는 체크가 있습니다. ' +
      '하나라도 «아니오»면 다음 장으로 가지 말고 그 절로 돌아갑니다.</div>';
  }

  function stageView(st){
    var h = '<span class="chip" style="--sc:' + st.color + '">Stage ' + esc(st.key) + '</span>' +
            '<h2 class="st">' + esc(st.name) + (st.sub ? ' — ' + esc(st.sub) : '') + '</h2>';
    if (st.goal) h += '<div class="goal" style="--sc:' + st.color + '"><b>학습 목적</b>' + esc(st.goal) + '</div>';
    var m = [];
    if (st.makes) m.push('만드는 것 · ' + st.makes);
    if (st.time) m.push('걸리는 시간 · ' + st.time);
    (st.need || []).forEach(function(n){ if (n) m.push('준비물 · ' + n); });
    if (m.length) h += '<div class="meta">' + m.map(function(x){ return '<span>' + esc(x) + '</span>'; }).join('') + '</div>';
    if (st.head) h += '<div class="body">' + md(st.head) + '</div>';

    if (!st.sections.length) {
      h += '<div class="empty">이 장은 아직 쓰는 중입니다.</div>';
    }
    st.sections.forEach(function(s){
      h += '<article class="sec" id="' + s.id + '" style="--sc:' + st.color + '">' +
           '<h3>' + (s.no ? esc(s.no) + '. ' : '') + esc(s.title) + '</h3>';
      if (s.through) h += '<div class="through" style="--sc:' + st.color + '">' + esc(s.through) + '</div>';
      var sm = [];
      if (s.time) sm.push('소요 · ' + s.time);
      (s.need || []).forEach(function(n){ if (n) sm.push('준비물 · ' + n); });
      if (sm.length) h += '<div class="meta">' + sm.map(function(x){ return '<span>' + esc(x) + '</span>'; }).join('') + '</div>';
      if (s.head) h += '<div class="body">' + md(s.head) + '</div>';
      s.secs.forEach(function(k){
        var cls = kind(k.title);
        h += cls ? '<div class="kbox ' + cls + '"><b>' + esc(k.title) + '</b><div class="body">' + md(k.md) + '</div></div>'
                 : '<h4>' + esc(k.title) + '</h4><div class="body">' + md(k.md) + '</div>';
      });
      h += '<button class="readbtn" type="button" data-id="' + s.id + '" data-on="' + (read[s.id] ? '1' : '0') + '">' +
           (read[s.id] ? '✓ 읽음' : '읽음으로 표시') + '</button></article>';
    });

    // 스테이지 자가 체크·다음으로 (_스테이지.md 의 ## 칸)
    (st.metasecs || []).forEach(function(k){
      var cls = kind(k.title);
      h += '<div class="kbox ' + (cls || '') + '"><b>' + esc(k.title) + '</b><div class="body">' + md(k.md) + '</div></div>';
    });
    main.innerHTML = h;

    main.querySelectorAll('.readbtn').forEach(function(b){
      b.onclick = function(){
        var id = b.dataset.id;
        if (read[id]) { delete read[id]; } else { read[id] = 1; }
        save();
        b.dataset.on = read[id] ? '1' : '0';
        b.textContent = read[id] ? '✓ 읽음' : '읽음으로 표시';
        drawNav();
      };
    });
    main.querySelectorAll('.xref').forEach(function(a){
      a.onclick = function(e){
        e.preventDefault();
        go(a.getAttribute('href').replace('#', ''));
        var el = document.getElementById(a.dataset.jump);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      };
    });
    main.querySelectorAll('pre').forEach(function(p){
      var btn = document.createElement('button');
      btn.className = 'copy'; btn.type = 'button'; btn.textContent = '복사';
      btn.onclick = function(){
        navigator.clipboard.writeText(p.innerText).then(function(){
          btn.textContent = '복사됨'; setTimeout(function(){ btn.textContent = '복사'; }, 1400);
        }, function(){ btn.textContent = '실패'; });
      };
      p.appendChild(btn);
    });
  }

  function go(k){
    cur = k;
    if (location.hash.replace('#', '') !== k) location.hash = k;
    drawNav();
    if (k === 'home') { homeView(); }
    else {
      var st = D.stages.filter(function(s){ return s.key === k; })[0];
      st ? stageView(st) : homeView();
    }
    window.scrollTo(0, 0);
    document.getElementById('q').value = '';
  }

  // ── 검색: 페이지 안에서. 외부 빌드에 맡기지 않는다 (v1이 그래서 죽었다) ──
  var idx = [];
  D.stages.forEach(function(st){
    st.sections.forEach(function(s){
      var text = [s.title, s.through, s.head].concat(s.secs.map(function(k){ return k.title + ' ' + k.md; })).join(' ');
      idx.push({ stage: st, sec: s, low: text.toLowerCase() });
    });
  });
  function search(q){
    var lq = q.toLowerCase().trim();
    if (!lq) { go(cur); return; }
    var hits = idx.filter(function(r){ return r.low.indexOf(lq) >= 0; }).slice(0, 40);
    var h = '<span class="chip" style="--sc:#6B675F">검색</span><h2 class="st">「' + esc(q) + '」 ' + hits.length + '건</h2>';
    if (!hits.length) h += '<div class="empty">찾은 것이 없습니다. 다른 말로 찾아보세요.</div>';
    hits.forEach(function(r){
      var p = r.low.indexOf(lq), raw = [r.sec.title, r.sec.through, r.sec.head]
        .concat(r.sec.secs.map(function(k){ return k.title + ' ' + k.md; })).join(' ');
      var snip = esc(raw.substr(Math.max(0, p - 60), 190)).replace(new RegExp(esc(q).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'ig'), function(m){ return '<mark>' + m + '</mark>'; });
      h += '<article class="sec" style="--sc:' + r.stage.color + '">' +
           '<div class="hitstage">Stage ' + esc(r.stage.key) + ' · ' + esc(r.stage.name) + '</div>' +
           '<h3>' + esc(r.sec.title) + '</h3><div class="body"><p>…' + snip + '…</p></div>' +
           '<button class="readbtn" type="button" data-go="' + r.stage.key + '" data-at="' + r.sec.id + '">이 절로 가기</button></article>';
    });
    main.innerHTML = h;
    main.querySelectorAll('[data-go]').forEach(function(b){
      b.onclick = function(){
        go(b.dataset.go);
        var el = document.getElementById(b.dataset.at);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      };
    });
  }
  var t;
  document.getElementById('q').addEventListener('input', function(e){
    clearTimeout(t); var v = e.target.value;
    t = setTimeout(function(){ search(v); }, 160);
  });
  window.addEventListener('hashchange', function(){
    var k = location.hash.replace('#', '') || 'home';
    if (k !== cur) go(k);
  });
  go(cur);
})();
</script>
