 옮깁니다. 여기까지는 AI가 대신 옮겨 줍니다."}, {"title": "③ 안 만들 것 다섯을 고른다", "md": "만들 것을 적는 건 쉽고 다들 씁니다. 안 만들 것을 적는 사람이 드뭅니다. 「하루 5분 뉴스 요약을 이메일로 보내는 구독 서비스」로 예를 들면 이렇습니다.\n\n만들 것 — 셋만\n\n1. 이메일로 가입하고 관심 분야를 하나 고른다\n2. 매일 아침 정해진 시간에 기사 다섯 개를 요약해 이메일로 보낸다\n3. 매달 자동 결제되고, 마이페이지에서 해지할 수 있다\n\n안 만들 것 — 다섯 이상\n\n| 안 만드는 것 | 왜 |\n|---|---|\n| 휴대폰 앱 | 웹으로 먼저 확인한다. 앱은 만드는 일이 통째로 하나 더 늘어난다 |\n| 메신저로 보내기 | 이메일 하나가 되는지부터 본다 |\n| 댓글·게시판 | 사람이 늘기 전에는 빈 화면만 늘어난다 |\n| 어두운 화면 모드 | 화면 손볼 곳이 두 배가 된다 |\n| 취향 추천 | 쌓인 기록이 없으면 추천할 것도 없다 |\n| 다른 나라 말 | 한국어로 팔릴지부터 본다 |\n\n«영원히 안 만든다»가 아니라 «이번에는 안 만든다»입니다. 나중에 만들 것은 지우지 말고 이 칸에 남겨 두면 그 목록이 다음에 할 일의 후보가 됩니다. 만들 것을 다섯, 여섯으로 늘리면 각각이 반쯤 된 채로 멈추는데, **반쯤 된 기능 여섯 개는 팔 수 없습니다.**"}, {"title": "④ 고칠 때의 규칙을 정한다", "md": "끝나는 문서가 아닙니다. 만들면서 계속 고칩니다.\n\n- 새 기능을 넣고 싶어질 때 → 먼저 「안 만들 것」을 봅니다. 거기 적혀 있으면 이번엔 안 합니다.\n- 정말 넣어야겠다면 → 「안 만들 것」에서 지우고 「무엇을」로 옮깁니다. **그리고 대신 뺄 것을 하나 고릅니다.**\n- 안 만들기로 새로 정한 게 생기면 → 그 자리에서 「안 만들 것」에 한 줄 추가합니다."}, {"title": "⚡ 따라 하기", "md": "1. `docs/PRD.md` 파일을 만드세요. 빈 파일이어도 됩니다 — AI가 채울 자리를 먼저 잡는 것입니다. `docs` 폴더 안에 파일 이름이 보이면 됩니다.\n2. Stage 1의 사업 한 장을 첨부하고 아래를 붙여넣으세요. 앞의 세 칸을 AI가 옮겨 쓰게 하는 것입니다. 네 칸 제목이 있고 「안 만들 것」만 비어 있는 문서가 돌아와야 합니다.\n\n```\n첨부한 사업 한 장과 고객 정리를 읽고 PRD.md 초안을 써라.\n코드는 짜지 마라. 마크다운으로 파일 하나만 만들어라.\n\n구조는 네 칸으로 고정한다.\n1. 무엇을 — 이 서비스가 하는 일 한 문단\n2. 누구를 위해 — 고객 둘, 각각 하루 일과와 지금 겪는 불편 3줄\n3. 성공 기준 — 셀 수 있는 숫자 하나 + 보조 지표 둘\n4. 안 만들 것 — 비워 둬라. 이건 내가 직접 채운다.\n\n3의 숫자는 \"화면이나 표에서 실제로 셀 수 있는 것\"만 써라.\n셀 수 없는 말(만족도, 편리함)은 쓰지 마라.\n```\n\n3. 「안 만들 것」은 **손으로 채우세요.** 다섯 개가 안 떠오르면 아래를 붙여넣어 후보를 받으세요. 기능 15개에 예/아니오가 붙은 목록이 돌아옵니다.\n\n```\n첨부한 PRD.md를 읽어라.\n\n이 서비스를 만들 때 \"있으면 좋겠다\"고 사람들이 흔히 붙이는 기능을 15개 나열해라.\n각각 옆에 \"이번에 안 만들면 서비스가 성립하지 않는가\"를 예/아니오로 표시해라.\n\n칭찬하거나 권하지 마라. 목록만 내라.\n```\n\n4. 「아니오」인 것 중 다섯 개 이상을 골라 이유를 한 줄씩 붙이세요. 이유가 없으면 다음 주에 내가 다시 흔들립니다. 「안 만들 것」 칸이 이유 붙은 다섯 줄 이상이면 됩니다.\n5. 문서 맨 위에 아래 한 줄을 적으세요. 만들 것이 늘어나는 것을 막는 잠금장치입니다.\n\n```\n규칙: 만들 것에 하나를 더하려면, 반드시 하나를 뺀다.\n```"}, {"title": "✅ 확인", "md": "- [ ] `docs/PRD.md` 파일이 폴더에 보이나\n- [ ] 「안 만들 것」이 이유와 함께 다섯 줄 이상 적혀 있나\n- [ ] 「만들 것」이 셋 이하인가\n- [ ] 성공 기준을 숫자로 소리 내어 말할 수 있나\n\n둘째가 «아니오»면 다음 절로 넘어가지 않습니다."}, {"title": "📘 말 풀이", "md": "**PRD(Product Requirements Document, 제품 요구사항 문서)** — «무엇을, 누구를 위해, 왜 만드는가»를 적어 둔 문서. 이름이 어려울 뿐 내용은 위의 네 칸이 전부입니다.\n\n**MVP(Minimum Viable Product, 최소로 팔 수 있는 것)** — 이것저것 다 붙인 완성품이 아니라 돈을 받을 수 있는 최소한. 위의 「만들 것 셋」이 곧 이것입니다."}, {"title": "⚠️ 함정", "md": "**「안 만들 것」을 비워 둡니다.** 가장 흔합니다. 이 칸이 비어 있으면 이 문서는 아무 일도 하지 않고, 다섯 줄이 안 나오면 아직 안 정해진 것입니다.\n\n**「안 만들 것」까지 AI에게 맡깁니다.** AI는 앞의 세 칸은 잘 쓰지만 이 칸은 눈치를 봐서 «필요하면 넣으세요» 식으로 씁니다. 이 칸은 사람이 정합니다.\n\n**성공 기준에 셀 수 없는 말을 씁니다.** «만족도가 높다»는 셀 수 없습니다. «다음 달에도 남아 있는 사람 수»는 셀 수 있습니다.\n\n**만들 것을 계속 늘립니다.** 하나 넣으면 하나 뺍니다. 이 규칙을 문서 맨 위에 적어 둡니다."}, {"title": "🔎 더 깊이", "md": "- 「안 만들 것」을 정하는 판단 근거(시장·고객)는 <a class=\"xref\" href=\"#1\">Stage 1<\/a>에서 다뤘습니다. 근거가 흔들리면 여기가 아니라 거기로 돌아갑니다.\n- 이 파일은 <a class=\"xref\" href=\"#3\">Stage 3<\/a>에서 하네스의 1층 첫 번째 문서가 됩니다. 매 대화마다 AI가 읽게 만드는 법은 <a class=\"xref\" href=\"#2\" data-jump=\"s2-6\">6절<\/a>에서.\n- 검색해 볼 말 — `PRD template`, `MoSCoW must should could wont`, `scope creep`"}]}, {"file": "3-구조문서.md", "id": "s2-3", "no": "3", "title": "구조를 한 장으로 적는다", "goals": ["구조 문서의 네모 세 종류를 댈 수 있다", "그림 없이 글과 표로 ARCHITECTURE.md를 만들 수 있다", "「못 쓰게 되면」 칸이 왜 필요한지 말할 수 있다"], "steps": ["네모와 화살표만 남긴다", "네모 세 종류를 가른다", "한 장짜리 예를 읽는다", "못 쓰게 되면 칸을 채운다"], "through": "네모와 화살표면 된다.", "time": "30분", "need": ["2절의 요구사항 문서"], "head": "요구사항 문서는 «무엇을» 만들지를 적은 것입니다. 구조 문서는 그게 어디에 놓이고 어떻게 이어지는지를 적은 것입니다.", "secs": [{"title": "① 네모와 화살표만 남긴다", "md": "이게 없으면 AI가 같은 일을 하는 코드를 여러 군데에 만듭니다. 회원 정보를 저장하는 곳이 두 군데, 이메일을 보내는 코드가 세 군데 생깁니다. 그러면 하나를 고쳐도 다른 하나는 남아서 «고쳤는데 안 고쳐졌다»가 됩니다.\n\n기술 문서라고 하면 겁이 나지만, 실제로 필요한 건 **네모와 화살표**뿐입니다.\n\n- 네모 = 무언가가 놓여 있는 자리 (화면 하나, 저장소 하나, 바깥 서비스 하나)\n- 화살표 = 무엇이 어디로 가는가 (사람이 누른다, 정보가 저장된다, 메일이 나간다)\n\n그림 도구는 필요 없습니다. AI는 그림을 못 읽지만 글은 정확히 읽으니, 글로 쓰는 편이 오히려 낫습니다."}, {"title": "② 네모 세 종류를 가른다", "md": "| 종류 | 무엇 | 예 |\n|---|---|---|\n| 보이는 것 | 사람이 눈으로 보고 누르는 화면 | 가입 화면 · 마이페이지 · 결제 화면 |\n| 쌓이는 것 | 사라지면 안 되는 정보가 남는 곳 | 회원 명단 · 구독 상태 · 보낸 기록 |\n| 빌려 쓰는 것 | 내가 안 만들고 남의 것을 쓰는 자리 | 이메일 보내는 서비스 · 결제 · 글 요약 |\n\n**세 번째가 중요합니다.** 내가 안 만드는 것을 적어 두지 않으면 AI가 그걸 직접 만들려고 듭니다. 결제를 직접 만들면 안 되고 빌려 씁니다."}, {"title": "③ 한 장짜리 예를 읽는다", "md": "「하루 5분 뉴스 요약을 이메일로 보내는 구독 서비스」의 구조 문서 본문입니다.\n\n화면 — 사람이 보는 것 넷\n\n| 화면 | 여기서 하는 일 |\n|---|---|\n| 첫 화면 | 뭘 해 주는 서비스인지 보고, 가입 버튼을 누른다 |\n| 가입 화면 | 이메일을 넣고 관심 분야를 하나 고른다 |\n| 마이페이지 | 분야를 바꾸거나, 결제를 해지한다 |\n| 결제 화면 | 카드 정보를 넣는다 — 우리가 만들지 않는다. 빌려 온 화면을 띄운다 |\n\n쌓이는 것 — 표 셋\n\n| 표 | 무엇이 한 줄씩 쌓이나 |\n|---|---|\n| 회원 | 이메일 · 고른 분야 · 가입한 날 |\n| 구독 | 누가 · 언제부터 · 지금 살아 있나 죽었나 |\n| 발송 기록 | 언제 · 누구에게 · 성공했나 실패했나 |\n\n빌려 쓰는 것 — 넷\n\n| 무엇 | 어디에 쓰나 | 못 쓰게 되면 |\n|---|---|---|\n| 회원 저장소 | 위의 표 셋을 담는 곳 | 서비스 전체가 멈춘다 |\n| 이메일 발송 | 아침에 메일을 실제로 쏘는 곳 | 메일이 안 나간다 |\n| 결제 | 매달 돈을 받는 곳 | 새 가입만 막히고 기존은 돈다 |\n| 글 요약 | 기사를 다섯 줄로 줄이는 곳 | 요약이 빈 채로 나간다 |\n\n하루의 흐름 — 화살표 한 줄\n\n```\n사람이 가입 → 회원 표에 한 줄 추가 → 결제가 되면 구독 표에 살아 있음 표시\n매일 아침 정해진 시간 → 살아 있는 구독자를 훑는다 → 기사를 모은다\n→ 글 요약에 맡긴다 → 이메일 발송에 넘긴다 → 발송 기록에 한 줄 남긴다\n```\n\n이게 전부입니다. **A4 한 장을 넘기지 않습니다.** 넘어간다면 안 만들 것을 너무 많이 넣은 것이니 <a class=\"xref\" href=\"#2\" data-jump=\"s2-2\">2절<\/a>의 「안 만들 것」으로 돌아갑니다."}, {"title": "④ 못 쓰게 되면 칸을 채운다", "md": "빌려 쓰는 것은 언젠가 멈춥니다. 값이 오르거나, 문을 닫거나, 우리 나라에서 못 쓰게 됩니다. 그때 **무엇이 같이 멈추는지**를 지금 한 줄로 적어 두면, 갈아탈 때 무엇을 손대야 할지 바로 압니다.\n\n이 칸이 뒤 Stage에서 그대로 쓰입니다 — 서버·결제를 붙일 때, 그리고 문제가 났을 때 원인을 좁힐 때."}, {"title": "⚡ 따라 하기", "md": "1. `docs/ARCHITECTURE.md` 파일을 만드세요. 요구사항 문서 옆에 나란히 두려는 것입니다. `docs` 폴더에 파일 둘이 보이면 됩니다.\n2. `PRD.md`를 첨부하고 아래를 붙여넣으세요. 그림 대신 글로 쓰게 하는 것입니다. 네 칸짜리 문서가 표와 화살표 한 줄로 돌아와야 합니다.\n\n```\n첨부한 PRD.md를 읽어라. 코드는 짜지 마라. 문서 하나만 만들어라.\n\n이 서비스의 구조를 ARCHITECTURE.md로 정리해라.\n그림·다이어그램을 쓰지 말고 전부 글과 표로 써라.\n비개발자가 읽을 것이니 전문 용어를 쓰면 괄호 안에 쉬운 말로 풀어라.\n\n구조는 네 칸으로 고정한다.\n1. 화면 — 사람이 보는 화면 목록과 각 화면에서 하는 일\n2. 쌓이는 것 — 사라지면 안 되는 정보를 표로. 각 표에 무엇이 한 줄씩 쌓이는지\n3. 빌려 쓰는 것 — 우리가 직접 만들지 않고 남의 서비스를 쓰는 자리.\n   각각 \"못 쓰게 되면 무엇이 같이 멈추는가\"를 한 줄로\n4. 하루의 흐름 — 사람이 가입해서 메일을 받기까지를 화살표 한 줄로\n\n전체를 A4 한 장 안에 넣어라. 넘치면 무엇을 뺄지 나에게 물어라.\n아직 정해지지 않은 것은 지어내지 말고 [아직 안 정함]이라고 써라.\n```\n\n3. 돌아온 글을 **소리 내어 읽으세요.** 못 읽는 단어가 나오면 그 자리에서 되물으세요 — 내가 못 읽는 지도는 나중에 내가 못 씁니다. 두 줄 설명과 비유 하나가 돌아옵니다.\n\n```\n방금 문서에서 내가 모르는 말이 있다. \"○○\"가 무엇인지\n12살에게 설명하듯 두 줄로 알려줘. 비유를 하나 붙여줘.\n```\n\n4. `[아직 안 정함]`이 몇 개인지 세세요. 그게 지금 내가 안 정한 것의 개수입니다. 그중 하나를 오늘 정해서 문서의 그 자리에 적으세요."}, {"title": "✅ 확인", "md": "- [ ] `docs/ARCHITECTURE.md` 파일이 폴더에 보이나\n- [ ] 문서가 A4 한 장 안에 들어가나\n- [ ] 「빌려 쓰는 것」마다 「못 쓰게 되면」 칸이 채워져 있나\n- [ ] 결제와 로그인이 「빌려 쓰는 것」에 들어가 있나\n\n넷째가 «아니오»면 직접 만드는 것에서 빼서 옮깁니다."}, {"title": "📘 말 풀이", "md": "**아키텍처(architecture, 구조)** — 건물로 치면 «어느 방이 어디에 있고 복도가 어떻게 이어지나». 코드로 치면 화면·저장소·바깥 서비스가 어떻게 연결돼 있나입니다.\n\n**데이터베이스(database, 저장소)** — 사라지면 안 되는 정보를 줄 단위로 쌓아 두는 곳. 엑셀 표를 아주 많이, 아주 빠르게 다루는 것이라고 보면 크게 틀리지 않습니다."}, {"title": "⚠️ 함정", "md": "**그림 도구부터 찾습니다.** 예쁘게 그리는 데 두 시간을 씁니다. AI는 그림을 못 읽으니 글로 씁니다.\n\n**어려운 말로 쓰려고 합니다.** «인증 레이어» «비동기 큐»를 흉내 내면 나중에 내가 못 읽습니다. 내가 아는 말로 쓰고, 어려운 이름은 AI가 코드에서 알아서 붙입니다.\n\n**빌려 쓰는 것을 안 적습니다.** 안 적으면 AI가 직접 만들려 듭니다. 특히 결제와 로그인은 절대 직접 만들지 않습니다.\n\n**문서와 실제가 어긋난 채로 둡니다.** 만들다가 구조가 바뀌면 그 자리에서 이 문서를 고칩니다. 어긋난 지도는 없는 지도보다 나쁩니다."}, {"title": "🔎 더 깊이", "md": "- 「빌려 쓰는 것」을 실제로 고르고 붙이는 일은 <a class=\"xref\" href=\"#6\">Stage 6<\/a>에서 합니다. 여기서는 자리만 비워 둡니다.\n- 이 파일도 <a class=\"xref\" href=\"#3\">Stage 3<\/a>에서 하네스의 1층에 들어갑니다. AI가 새 코드를 짤 때 이걸 먼저 읽고 같은 자리에 붙입니다.\n- 검색해 볼 말 — `architecture decision`, `C4 model context diagram`, `system design for beginners`"}]}, {"file": "4-결정6줄.md", "id": "s2-4", "no": "4", "title": "결정을 6줄로 남긴다", "goals": ["결정 기록 6줄의 각 줄에 무엇이 들어가는지 댈 수 있다", "어떤 결정을 남기고 어떤 것을 안 남길지 가를 수 있다", "결정을 뒤집을 때 옛 파일을 지우지 않고 잇는 법을 안다"], "steps": ["6줄 형식을 본다", "실제 예를 읽는다", "파일 하나에 결정 하나로 둔다", "남길 결정을 고른다"], "through": "3개월 뒤의 나는 남이고, AI는 기억이 아예 없다.", "time": "25분", "need": ["3절의 구조 문서"], "head": "3개월 뒤의 나는 남입니다 — 왜 그렇게 정했는지 기억나지 않아 같은 고민을 두 번 합니다. AI는 그보다 심해서, 지난주에 정한 것을 새 대화에서는 모르고 «메신저 연동도 넣어 드릴까요?» 하고 자연스럽게 뒤집습니다.", "secs": [{"title": "① 6줄 형식을 본다", "md": "실리콘밸리가 오래 써 온 방법을 하나 훔쳐 옵니다. 회의록이 아니라 **결정만** 6줄로 남기는 것입니다.\n\n| 줄 | 무엇을 적나 |\n|---|---|\n| 1 정한 것 | 한 문장. \"○○를 쓴다\" / \"○○는 안 한다\" |\n| 2 날짜 | 그날의 사정이 오늘과 다를 수 있으니까 |\n| 3 왜 | 그때 이게 최선이라고 본 이유 두어 줄 |\n| 4 버린 것 | 같이 놓고 재던 다른 선택지와, 그걸 버린 이유 |\n| 5 되돌리려면 | 무엇이 바뀌면 이 결정을 다시 볼 것인가 |\n| 6 관련 문서 | 이 결정이 걸려 있는 파일 이름 |\n\n4와 5가 이 형식의 값어치 전부입니다. 4가 없으면 3개월 뒤에 버린 선택지를 «왜 이건 안 했지?» 하고 다시 검토합니다. 5가 없으면 언제까지 지켜야 하는지 몰라서 영원히 못 바꾸거나 아무 때나 뒤집습니다."}, {"title": "② 실제 예를 읽는다", "md": "`docs/adr/0001-이메일만-보낸다.md`\n\n```\n1 정한 것 — 알림은 이메일로만 보낸다. 메신저는 이번에 안 붙인다.\n2 날짜 — 2026-09-09\n3 왜 — 메신저는 사업자 등록과 채널 심사를 먼저 통과해야 한다.\n        그 절차가 얼마나 걸릴지 아직 모른다.\n        이메일은 오늘 바로 붙일 수 있고, 열어 봤는지도 셀 수 있다.\n4 버린 것 — 메신저 알림. \"받는 사람이 더 잘 본다\"는 장점은 인정하지만,\n        시작을 몇 주 미루는 값을 치를 만큼은 아니다.\n        같이 재던 것: 문자 발송 — 건당 값이 붙어서 구독료 안에 안 들어간다.\n5 되돌리려면 — 사업자 등록이 끝나고, 이메일 열람률이 20%를 밑돌면 다시 본다.\n6 관련 문서 — docs/PRD.md의 「안 만들 것」, docs/ARCHITECTURE.md의 「빌려 쓰는 것」\n```\n\n이게 전부입니다. **10분이면 씁니다.** 그리고 3개월 뒤에 나를 구합니다."}, {"title": "③ 파일 하나에 결정 하나로 둔다", "md": "큰 파일 하나에 덧붙이지 않고 결정마다 파일을 따로 만듭니다. AI가 필요한 것만 골라 읽을 수 있기 때문입니다 — 한 파일에 30개가 있으면 다 읽다가 정작 중요한 걸 흘립니다.\n\n```\ndocs/adr/\n  0001-이메일만-보낸다.md\n  0002-결제는-직접-만들지-않는다.md\n  0003-회원-저장소를-무엇으로-쓰나.md\n```\n\n결정을 뒤집을 때도 **옛 파일을 지우지 않습니다.** 맨 위에 「이 결정은 0014로 대체됨 (2026-12-02)」 한 줄만 붙입니다. 그리고 새 파일에 **「무엇이 바뀌어서 뒤집는가」**를 적습니다."}, {"title": "④ 남길 결정을 고른다", "md": "전부 남기면 지칩니다. **셋 중 하나라도 해당하면** 남깁니다.\n\n- 되돌리는 데 하루 넘게 걸리는 것 — 저장소를 무엇으로 쓰나, 결제를 어디로 받나\n- 나중에 «왜 그랬지»가 나올 것 — 안 하기로 한 것, 남들과 다르게 한 것\n- AI가 자꾸 뒤집는 것 — 세 번 넘게 같은 걸 다시 설명했다면 그게 신호입니다\n\n반대로 색을 파랑으로 할지 초록으로 할지는 남기지 않습니다. 되돌리는 데 1분이니까요."}, {"title": "⚡ 따라 하기", "md": "1. `docs/adr` 폴더를 만드세요. 결정 파일이 여기 번호순으로 쌓입니다. `docs` 안에 빈 `adr` 폴더가 보이면 됩니다.\n2. <a class=\"xref\" href=\"#2\" data-jump=\"s2-2\">2절<\/a>의 「안 만들 것」에서 하나를 골라 아래를 붙여넣으세요. 이미 정한 것이라 재료가 손에 있습니다. `0001-…md` 파일이 여섯 줄로 생겨야 합니다.\n\n```\n방금 우리가 정한 것을 결정 기록으로 남겨라.\ndocs/adr/ 폴더에 파일 하나를 새로 만들어라.\n파일 이름은 \"네자리번호-정한것-짧게.md\" 형식으로, 번호는 폴더에서 가장 큰 번호 +1.\n\n내용은 정확히 여섯 줄 항목으로만 쓴다. 그 외에는 아무것도 쓰지 마라.\n1 정한 것 — 한 문장\n2 날짜 — 오늘 날짜\n3 왜 — 두세 줄\n4 버린 것 — 같이 검토했다가 안 고른 선택지와, 버린 이유\n5 되돌리려면 — 무엇이 바뀌면 이 결정을 다시 봐야 하는가\n6 관련 문서 — 이 결정이 걸려 있는 파일 이름들\n\n내가 말하지 않은 이유를 지어내지 마라.\n3이나 4에 채울 근거가 없으면 나에게 되물어라.\n```\n\n3. 4 「버린 것」이 비어 있으면 아래로 다시 시키세요. **대부분 여기가 빕니다.** 선택지 둘과 각각의 이유 한 줄이 돌아옵니다.\n\n```\n4 버린 것이 비어 있다. 이 결정을 내릴 때 현실적으로 같이 놓고 잴 수 있었던\n다른 선택지를 두 개 제시하고, 각각 왜 안 고르는 게 맞는지 한 줄로 써라.\n```\n\n4. 앞으로 결정이 날 때마다 그 자리에서 2번을 다시 하세요. 다음 주에 몰아 쓰면 이유를 이미 잊은 뒤입니다. 폴더의 번호가 하나씩 늘면 됩니다.\n5. 결정을 뒤집을 때는 아래로 시키세요. 옛 파일은 남고 새 파일이 하나 생겨야 합니다.\n\n```\ndocs/adr/0001 결정을 뒤집는다. 옛 파일을 지우지 마라.\n옛 파일 맨 위에 \"이 결정은 (새 번호)로 대체됨 (오늘 날짜)\" 한 줄만 추가하고,\n새 파일을 여섯 줄 형식으로 만들어라.\n새 파일의 3에는 \"무엇이 바뀌어서 뒤집는가\"를 반드시 적어라.\n```"}, {"title": "✅ 확인", "md": "- [ ] `docs/adr` 폴더 안에 파일이 하나라도 보이나\n- [ ] 그 파일에 4 「버린 것」이 채워져 있나\n- [ ] 5 「되돌리려면」에 «상황이 바뀌면» 같은 말이 아니라 셀 수 있는 조건이 적혀 있나\n- [ ] 새 대화를 열어 그 파일만 주고 «왜 이렇게 정했어?»를 물었을 때 제대로 답하나\n\n하나라도 «아니오»면 ⚡의 2·3번으로 돌아갑니다."}, {"title": "📘 말 풀이", "md": "**ADR(Architecture Decision Record, 결정 기록)** — «왜 이렇게 정했는가»를 남기는 짧은 글. 원래 새로 들어온 동료에게 과거의 이유를 전하려고 쓰던 것인데, AI는 매번 새로 들어온 사람이라 지금은 AI에게 전하는 용도가 더 큽니다."}, {"title": "⚠️ 함정", "md": "**4 「버린 것」을 안 씁니다.** 정한 것만 쓰고 버린 것을 빼면, 3개월 뒤에 버린 것을 다시 검토하게 됩니다. 버린 것을 적는 것이 정한 것을 적는 것보다 중요합니다.\n\n**5 「되돌리려면」을 안 씁니다.** 되돌릴 조건이 없으면 이 결정은 그냥 규칙이 되고, 규칙은 흔들리면 통째로 무시됩니다. 조건이 붙은 결정은 흔들려도 살아남습니다.\n\n**결정한 다음 주에 몰아 씁니다.** 그때는 이미 이유를 잊었습니다. 정한 그 자리에서 AI에게 시키면 2분입니다.\n\n**뒤집을 때 옛 파일을 지웁니다.** 지우면 왜 안 했는지가 같이 사라집니다. 줄 하나만 덧붙이고 남겨 둡니다."}, {"title": "🔎 더 깊이", "md": "- 결정 기록은 이 장에서 끝나지 않습니다. 저장소를 고를 때, 결제를 붙일 때, 배포 방식을 정할 때 — 그때마다 여섯 줄입니다.\n- 이 폴더는 <a class=\"xref\" href=\"#3\">Stage 3<\/a>에서 하네스의 1층에 들어갑니다. AI가 옛 결정을 뒤집지 않게 만드는 장치가 거기서 완성됩니다.\n- 검색해 볼 말 — `architecture decision record`, `ADR template`, `MADR`"}]}, {"file": "5-비판시키기.md", "id": "s2-5", "no": "5", "title": "AI에게 문서를 비판시킨다", "goals": ["AI가 왜 내 편을 드는지와 질문을 어떻게 바꿔야 하는지 말할 수 있다", "문서 셋을 주고 약한 데·후회할 것·안 정한 것을 따로 받을 수 있다", "받은 지적을 넷으로 갈라 문서에 반영할 수 있다"], "steps": ["AI가 내 편을 드는 이유를 본다", "세 가지를 하나씩 시킨다", "받은 답을 넷으로 가른다", "한 군데를 실제로 고친다"], "through": "AI는 기본적으로 동의하는 쪽으로 답한다. 「문제만 찾아라」라고 못 박아야 한다.", "time": "35분", "need": ["2절의 요구사항 문서", "3절의 구조 문서", "4절의 결정 기록"], "head": "구글에서 설계문서를 쓰는 진짜 이유는 글을 남기려는 게 아니라 동료에게 찔리려는 것입니다. 혼자 만드는 사람에게는 그 동료가 없으니, 이 절에서 AI를 그 자리에 앉힙니다 — 앞 절들이 재료였다면 여기가 이 장의 핵심입니다.", "secs": [{"title": "① AI가 내 편을 드는 이유를 본다", "md": "«제 계획 어때요?»라고 물으면 AI는 대체로 좋다고 합니다. 정말 걱정되는 대목은 «다만 ○○도 고려해 보시면» 정도로 부드럽게 흘리고, 나는 «역시 괜찮구나» 하고 넘어갑니다. 가장 위험한 결과입니다.\n\nAI는 사람이 만족하는 답을 내도록 다듬어져 있어서 동의하는 쪽으로 기웁니다. 거짓말이 아니라 기울어 있는 것이니, **질문에서 못 박아야** 합니다.\n\n| 이렇게 물으면 | 이렇게 물으면 |\n|---|---|\n| \"제 계획 어때요?\" | \"이 계획의 가장 약한 데 셋을 찾아라\" |\n| \"괜찮은가요?\" | \"칭찬하지 마라. 문제만 써라.\" |\n| \"빠진 게 있나요?\" | \"내가 안 정한 것을 목록으로 내라\" |\n\n왼쪽은 답이 안 바뀝니다. 오른쪽은 답이 바뀝니다. 질문의 형태가 답의 형태를 정합니다."}, {"title": "② 세 가지를 하나씩 시킨다", "md": "| 무엇을 시키나 | 무엇이 나오나 |\n|---|---|\n| 첫째 — 가장 약한 데 셋 | 지금 이 계획에서 제일 먼저 무너질 자리 |\n| 둘째 — 3개월 뒤에 무엇이 후회될까 | 지금은 안 보이지만 나중에 값을 치를 자리 |\n| 셋째 — 내가 안 정한 것 목록 | 내가 안 정했다는 사실조차 모르고 있던 빈칸 |\n\n셋을 한 번에 시키면 답이 얕아집니다. **하나씩, 답을 읽고 다음 것을 시킵니다.**\n\n둘째를 꼭 하는 이유 — 첫째는 지금 눈에 보이는 문제를 잡고, 둘째는 시간이 지나야 드러나는 문제를 잡아서 둘이 겹치지 않습니다. «발송 기록을 안 남긴다»는 지금은 아무 문제가 아니지만, 석 달 뒤 «메일이 안 왔다»는 항의를 받고 나서야 확인할 방법이 없다는 걸 알게 됩니다."}, {"title": "③ 받은 답을 넷으로 가른다", "md": "답이 열 개쯤 옵니다. 다 고치려고 하면 아무것도 못 고칩니다.\n\n| 돌아온 지적 | 어떻게 하나 |\n|---|---|\n| 맞는 말이고 오늘 고칠 수 있다 | 지금 문서를 고친다 |\n| 맞는 말인데 아직 정할 수 없다 | 문서에 `[아직 안 정함]`으로 적어 둔다 |\n| 맞는 말인데 이번엔 안 한다 | 요구사항 문서의 「안 만들 것」에 한 줄 추가한다 |\n| 안 맞는 말이다 | 왜 안 맞는지 한 줄로 적어 두고 넘어간다 |\n\n네 번째가 중요합니다. 그냥 넘기면 다음 달에 같은 지적을 다시 받고 또 고민합니다. **«이건 이래서 안 맞는다»를 적어 두면** 그게 곧 <a class=\"xref\" href=\"#2\" data-jump=\"s2-4\">4절<\/a>의 결정 기록감입니다."}, {"title": "④ 한 군데를 실제로 고친다", "md": "**읽기만 하고 안 고치면 이 절은 안 한 것과 같습니다.** 오늘 고칠 수 있는 것 하나를 고르고, 무엇을 왜 고쳤는지 한 줄을 결정 기록으로 남깁니다. 아래 ⚡의 마지막 단계입니다."}, {"title": "⚡ 따라 하기", "md": "1. 새 대화를 여세요. 앞에서 내 계획을 자랑하듯 설명한 대화에 이어 물으면 그 분위기에 끌려갑니다. 빈 대화창이 보이면 됩니다.\n2. 문서 셋(요구사항·구조·결정 기록)만 첨부하세요. 설명은 덧붙이지 않습니다 — **문서만으로 통해야 진짜입니다.**\n3. 첫째, 가장 약한 데 셋을 시키세요. 칭찬 없이 약한 곳 셋이 약한 순서대로 돌아와야 합니다.\n\n```\n너는 지금 내 계획을 통과시키는 사람이 아니라 무너뜨리는 사람이다.\n첨부한 문서들을 읽어라.\n\n이 계획에서 가장 약한 곳 세 군데를 찾아라. 약한 순서대로.\n각각에 대해 이렇게 써라.\n- 어디가 약한가\n- 이대로 두면 구체적으로 무슨 일이 벌어지는가\n- 오늘 문서만 고쳐서 막을 수 있는가, 아니면 만들면서 겪어야 하는가\n\n칭찬하지 마라. 잘된 점은 한 줄도 쓰지 마라. 문제만 써라.\n\"고려해 보시면 좋겠습니다\" 같은 부드러운 표현을 쓰지 마라. 단정해서 말해라.\n```\n\n4. 답을 다 읽은 뒤 둘째, 3개월 뒤 후회할 것을 시키세요. 시간이 지나야 드러나는 문제를 따로 잡으려는 것입니다. 후회할 것 다섯 개가 «3개월 뒤의 장면» 한 줄과 함께 돌아옵니다.\n\n```\n같은 문서를 다시 읽어라.\n\n이 계획대로 만들어서 서비스를 내놓고 3개월이 지났다고 하자.\n그때 내가 \"이걸 처음에 해 둘 걸\" 하고 후회할 만한 것을 다섯 개 대라.\n지금은 문제로 안 보이지만 시간이 지나야 드러나는 것만 골라라.\n\n각각에 대해 \"3개월 뒤에 어떤 장면으로 나타나는가\"를 한 줄로 써라.\n지금 당장 눈에 보이는 문제는 여기 쓰지 마라. 그건 이미 물었다.\n```\n\n5. 셋째, 내가 안 정한 것 목록을 시키세요. AI가 마음대로 정할 빈칸을 미리 보려는 것입니다. 중요한 순서대로 목록이 돌아와야 하고, 짧으면 다시 읽게 합니다.\n\n```\n같은 문서를 다시 읽어라.\n\n이 문서만 보고 코드를 짜기 시작한다고 할 때,\n네가 나에게 묻지 않고 마음대로 정해야 하는 것을 전부 목록으로 내라.\n중요한 순서대로. 각각 한 줄.\n\n답을 대신 지어내지 마라. 무엇이 안 정해졌는지만 내라.\n\"문서에 잘 정리되어 있습니다\" 같은 말은 쓰지 마라.\n목록이 짧다면 네가 덜 읽은 것이니 다시 읽어라.\n```\n\n6. 세 답 중 오늘 고칠 수 있는 것 하나를 골라 문서를 고치세요. 그리고 무엇을 왜 고쳤는지 한 줄을 결정 기록으로 남기세요. `docs/adr`에 파일이 하나 늘어나 있으면 됩니다."}, {"title": "✅ 확인", "md": "- [ ] 새 대화를 열어 문서만 주고 시켰나\n- [ ] 돌아온 답에 칭찬이 섞여 있지 않았나 (섞여 있으면 프롬프트를 다시 넣습니다)\n- [ ] 한 군데라도 실제로 고쳤나\n- [ ] 안 받아들이기로 한 지적에 왜 안 받는지 한 줄을 적어 두었나\n\n셋째가 «아니오»면 이 절은 아직 안 한 것입니다."}, {"title": "📘 말 풀이", "md": "**레드팀(red team, 일부러 공격해 보는 역할)** — 내 계획을 일부러 무너뜨려 보려고 애쓰는 역할. 원래 군대와 보안에서 쓰던 말인데, 지금은 AI에게 «내 편 들지 말고 공격해 봐»로 시킬 수 있습니다.\n\n**동조 편향(sycophancy, 맞장구치는 성향)** — AI가 사용자의 의견에 동의하는 쪽으로 기우는 성질. 능력이 모자라서가 아니라 사람이 만족하는 답을 내도록 다듬어진 결과라, 질문을 바꾸면 줄어듭니다."}, {"title": "⚠️ 함정", "md": "**\"어때요?\"라고 묻습니다.** 가장 흔하고 가장 아깝습니다. 좋다는 답이 오니 «문제만»이라고 못 박습니다.\n\n**셋을 한 번에 시킵니다.** 답이 얕아집니다. 하나 시키고, 읽고, 고치고, 다음 것을 시킵니다.\n\n**AI 말을 다 따릅니다.** 반대 함정입니다. AI는 «더 만들자» 쪽으로 기울어서 지적을 그대로 다 받으면 「안 만들 것」이 없어집니다 — 받을 것과 버릴 것은 내가 고릅니다.\n\n**같은 대화창에서 시킵니다.** 앞에서 계획을 설명한 분위기에 끌려갑니다. 새 대화를 열고 문서 파일만 줍니다."}, {"title": "🔎 더 깊이", "md": "- 둘째의 방식은 원래 «사전 부검(pre-mortem)»이라고 부릅니다. 일이 망했다고 가정하고 원인을 거꾸로 찾는 방법이고, 사람 팀에서도 씁니다.\n- 같은 「비판시키기」를 코드에도 씁니다. 만든 코드를 다른 AI에게 검사시키는 방법은 <a class=\"xref\" href=\"#7\">Stage 7<\/a>에서.\n- 이 절에서 고친 문서가 <a class=\"xref\" href=\"#3\">Stage 3<\/a>에서 하네스의 1층에 그대로 올라갑니다. 고치기 전 문서를 올리면 틀린 지도를 매번 읽히는 셈이 됩니다.\n- 검색해 볼 말 — `red team your own plan`, `LLM sycophancy`, `pre-mortem`"}]}, {"file": "6-살아있게.md", "id": "s2-6", "no": "6", "title": "문서를 AI가 매번 읽게 한다", "goals": ["문서가 죽는 두 가지 방식을 말할 수 있다", "입구 파일에서 문서 셋을 가리키고 「뒤집지 마라」를 적을 수 있다", "새 대화 시험으로 문서가 살아 있는지 잴 수 있다"], "steps": ["문서가 죽는 두 방식을 본다", "입구 하나에서 가리킨다", "바뀌는 그 자리에서 고친다", "새 대화 시험으로 잰다", "다음 장의 1층을 본다"], "through": "문서를 폴더에 두는 것과 AI가 매번 읽는 것은 다르다. 읽히게 두는 자리가 있다.", "time": "25분", "need": ["2·3·4절에서 만든 문서 셋"], "head": "문서 셋을 다 썼습니다. 그런데 여기서 대부분 실패합니다 — 폴더에 있는 것과 AI가 읽는 것은 다르기 때문입니다.", "secs": [{"title": "① 문서가 죽는 두 방식을 본다", "md": "문서를 아무리 잘 써 두어도 AI는 그 폴더에 무슨 파일이 있는지 스스로 뒤지지 않습니다. 그래서 새 대화를 열면 지난주에 정한 것을 또 뒤집습니다. 그리고 안 고친 문서는 틀린 문서가 되는데, 틀린 지도를 확신을 갖고 따라가니 **아무것도 안 읽히는 것보다 나쁩니다.**\n\n| 어떻게 죽나 | 증상 |\n|---|---|\n| 안 읽힌다 | 새 대화마다 같은 설명을 처음부터 다시 한다 |\n| 안 고친다 | 문서에는 이메일만 보낸다고 적혀 있는데 실제로는 메신저도 붙어 있다 |\n\n둘 다 고칠 수 있습니다. 하나는 자리의 문제고, 하나는 습관의 문제입니다."}, {"title": "② 입구 하나에서 가리킨다", "md": "문서를 여기저기 흩어 두지 않고 입구를 하나 만들어 거기서 가리킵니다. 프로젝트 폴더 맨 위에 AI가 자동으로 읽는 파일 하나를 두고, 그 안에서 다른 문서들의 경로를 적습니다.\n\n```\n내프로젝트/\n  (AI가 자동으로 읽는 지침 파일)   ← 입구. 여기서 아래를 가리킨다\n  docs/\n    PRD.md              ← 무엇을 만드나\n    ARCHITECTURE.md     ← 무엇이 어디에 있나\n    adr/                ← 왜 그렇게 정했나\n```\n\n입구 파일에는 이런 식으로 적습니다.\n\n```\n이 프로젝트에서 일하기 전에 반드시 읽는다.\n- docs/PRD.md — 무엇을 만들고 무엇을 안 만드는가\n- docs/ARCHITECTURE.md — 화면·저장소·빌려 쓰는 것의 구조\n- docs/adr/ — 이미 내린 결정. 여기 있는 것을 뒤집지 않는다.\n  뒤집어야 한다면 먼저 나에게 묻는다.\n```\n\n**마지막 두 줄이 중요합니다.** «읽어라»만 적으면 읽고 나서 뒤집습니다. «뒤집지 마라, 뒤집으려면 먼저 물어라»까지 적어야 합니다.\n\n입구 파일을 제대로 만드는 일은 <a class=\"xref\" href=\"#3\">Stage 3<\/a>의 내용입니다. 지금은 가리키는 줄만 적어 둬도 절반은 됩니다."}, {"title": "③ 바뀌는 그 자리에서 고친다", "md": "답은 하나입니다. **결정이 바뀌는 그 자리에서.** 나중에 몰아서 고치겠다고 미루면 일주일 뒤에는 무엇이 바뀌었는지 기억이 안 나서 못 고칩니다.\n\n| 이런 일이 생기면 | 그 자리에서 |\n|---|---|\n| 안 만들기로 한 걸 만들기로 했다 | 요구사항 문서의 「안 만들 것」에서 지우고 「무엇을」로 옮긴다. 대신 뺄 것을 하나 고른다 |\n| 빌려 쓰는 서비스를 바꿨다 | 구조 문서의 표를 고치고, 결정 기록을 하나 남긴다 |\n| 화면이 하나 늘었다 | 구조 문서의 화면 표에 한 줄 추가한다 |\n| 예전 결정을 뒤집었다 | 옛 결정 기록에 「대체됨」 한 줄, 새 결정 기록 하나 |\n\n고치는 일도 AI에게 시킵니다. 손으로 안 고쳐도 되고, 시키는 데 30초입니다."}, {"title": "④ 새 대화 시험으로 잰다", "md": "문서가 살아 있는지 재는 방법은 딱 하나입니다. **새 대화를 열고, 문서만 주고, «무엇을 만드는 거야?»라고 묻습니다.**\n\n| 이렇게 답하면 | 뜻 |\n|---|---|\n| 무엇을 · 누구를 위해 · 무엇을 안 만드는지까지 말한다 | 통과 |\n| 무엇을 만드는지는 아는데 안 만들 것은 모른다 | 요구사항 문서의 「안 만들 것」이 부실하다 |\n| 화면 이름이나 저장할 정보를 못 댄다 | 구조 문서가 부실하다 |\n| 이미 정한 걸 \"이렇게 하면 어떨까요\"로 다시 제안한다 | 결정 기록이 안 읽히고 있다 |\n\n이 시험을 만드는 내내 반복합니다. 한 달 뒤에 답이 흐려졌다면 문서가 실제를 못 따라간 것이고, 그때가 고칠 때입니다."}, {"title": "⑤ 다음 장의 1층을 본다", "md": "「하네스」는 AI에게 무엇을 읽히고 무엇을 못 하게 할지를 짜 놓은 판이고, 층이 넷입니다.\n\n| 층 | 무엇 | 어디서 만드나 |\n|---|---|---|\n| 1층 | 문서 — 요구사항 · 구조 · 결정 기록 | 이 장 |\n| 2층 | 입구 지침 파일 — 절대 어기면 안 되는 것 | Stage 3 |\n| 3층 | 일을 시키고 받는 순서 | Stage 3 |\n| 4층 | 규칙을 강제하는 장치 | Stage 3 |\n\n**1층이 부실하면 위의 셋을 아무리 잘 쌓아도 무너집니다.** 지침 파일에 «PRD를 읽어라»라고 적어 뒀는데 PRD가 비어 있으면 읽을 게 없습니다."}, {"title": "⚡ 따라 하기", "md": "1. 문서 셋이 `docs` 폴더 안에 있는지 확인하세요. 흩어져 있으면 모으세요. `PRD.md`·`ARCHITECTURE.md`·`adr/`이 한 폴더에 나란히 보이면 됩니다.\n2. 아래를 붙여넣어 입구 파일에 가리키는 줄을 적게 하세요. AI가 새 대화마다 자동으로 문서 셋을 찾아가게 하는 것입니다. 지침 파일 맨 앞에 「먼저 읽을 것」 목록과 «뒤집지 않는다» 두 줄이 생겨야 합니다.\n\n```\n이 프로젝트 폴더 맨 위에 있는 지침 파일을 열어라. 없으면 새로 만들어라.\n코드는 건드리지 마라.\n\n파일 맨 앞에 \"먼저 읽을 것\" 항목을 추가해라. 내용은 이렇게.\n- docs/PRD.md — 무엇을 만들고 무엇을 안 만드는가\n- docs/ARCHITECTURE.md — 화면·저장소·빌려 쓰는 것의 구조\n- docs/adr/ — 이미 내린 결정\n\n그 아래에 이 두 줄을 반드시 넣어라.\n\"docs/adr/ 에 있는 결정을 뒤집지 않는다.\"\n\"뒤집어야 한다고 판단되면 코드를 고치기 전에 먼저 나에게 묻는다.\"\n\n이 파일에 다른 내용을 추가하지 마라. 지금은 이것만.\n```\n\n3. **새 대화를 열고** 문서 셋만 첨부한 뒤 아래를 물으세요. 문서만으로 AI가 답할 수 있는지 재는 시험입니다. 답 다섯 개가 번호대로 돌아옵니다.\n\n```\n첨부한 문서들만 읽고 답해라. 추측하거나 지어내지 마라.\n\n1. 나는 무엇을 만들고 있는가 — 세 줄로\n2. 누구를 위해 만드는가 — 두 줄로\n3. 이번에 안 만들기로 한 것은 무엇인가 — 목록으로\n4. 이미 정해져서 네가 바꾸면 안 되는 것은 무엇인가 — 목록으로\n5. 문서만으로는 알 수 없어서 내가 채워야 하는 것 — 목록으로\n\n문서에 없는 것은 \"문서에 없음\"이라고 써라.\n```\n\n4. 3번과 4번 답을 보세요. 비어 있으면 다음 장으로 넘어가지 않습니다 — 3번이 비면 <a class=\"xref\" href=\"#2\" data-jump=\"s2-2\">2절<\/a>로, 4번이 비면 <a class=\"xref\" href=\"#2\" data-jump=\"s2-4\">4절<\/a>로 돌아갑니다.\n5. 앞으로 결정이 바뀔 때마다 그 자리에서 아래를 시키세요. 바뀐 부분만 고쳐지고 `docs/adr`에 파일이 하나 늘어야 합니다.\n\n```\n방금 정한 것이 기존 문서와 어긋난다. 어긋난 곳을 찾아서 고쳐라.\ndocs/PRD.md · docs/ARCHITECTURE.md 를 확인하고,\n바뀐 부분만 고쳐라. 안 바뀐 부분은 손대지 마라.\n그리고 이 변경을 docs/adr/ 에 여섯 줄 형식으로 남겨라.\n```"}, {"title": "✅ 확인", "md": "- [ ] 문서 셋이 `docs` 폴더 한 곳에 모여 있나\n- [ ] 입구 지침 파일에 「먼저 읽을 것」 목록과 «결정을 뒤집지 않는다» 줄이 있나\n- [ ] 새 대화에 문서만 주고 물었을 때 답에 「안 만들 것」이 들어 있나\n- [ ] 그 답에 「바꾸면 안 되는 결정」이 들어 있나\n\n하나라도 «아니오»면 해당 절로 돌아갑니다. 여기가 다음 장의 1층이라 무너진 채로 올리지 않습니다."}, {"title": "📘 말 풀이", "md": "**하네스(harness, 작업 판)** — AI가 일할 때 무엇을 읽고 무엇을 못 하게 할지를 미리 짜 놓은 틀. 말에게 씌우는 마구에서 온 말로, 힘을 못 쓰게 묶는 게 아니라 원하는 방향으로 끌게 하는 장치입니다.\n\n**컨텍스트(context, 지금 읽고 있는 것)** — AI가 이번 대화에서 실제로 보고 있는 글 전부. 여기 안 들어간 것은 AI에게 존재하지 않는 것입니다."}, {"title": "⚠️ 함정", "md": "**\"문서 다 썼으니 끝.\"** 쓴 것과 읽히는 것은 다릅니다. 새 대화 시험을 한 번은 해 봐야 압니다.\n\n**매번 손으로 문서를 붙여넣습니다.** 처음 며칠은 하지만 곧 안 합니다. 그래서 자리를 정해 자동으로 읽히게 만드는 것입니다.\n\n**문서를 늘립니다.** 문서가 열 개가 되면 AI가 다 못 읽고 흘립니다. 셋을 유지하고, 늘려야 한다면 결정 기록 폴더 안에서 늘립니다.\n\n**문서와 실제가 다른 채로 둡니다.** 없는 것보다 나쁩니다. 어긋난 걸 발견하면 만들던 걸 멈추고 먼저 고칩니다."}, {"title": "🔎 더 깊이", "md": "- 입구 지침 파일을 제대로 만드는 법, 어떤 도구가 어떤 이름의 파일을 읽는지, 규칙을 말이 아니라 장치로 강제하는 법 — 전부 <a class=\"xref\" href=\"#3\">Stage 3<\/a>에서 이어집니다.\n- 문서가 열 개, 스무 개로 늘었을 때 AI가 필요한 것만 찾아 읽게 만드는 법은 <a class=\"xref\" href=\"#9\">Stage 9<\/a>에서.\n- 검색해 볼 말 — `context engineering`, `agent context files`, `documentation drift`"}]}]}, {"folder": "03-컨텍스트하네스", "key": "3", "name": "컨텍스트·하네스", "color": "#a78bfa", "sub": "AI에게 무엇을 읽히나", "goal": "매번 설명하지 않게 만들고, 지켜야 할 것을 강제한다", "makes": "지침 완성 · 스킬 3개 · 훅 설정", "time": "4시간", "need": ["Stage 2의 문서들"], "head": "프롬프트를 잘 쓰는 것은 시작이고, **환경을 잘 세우는 것**이 그다음입니다.\n지시문에만 적어 둔 규칙은 지켜지지 않습니다. 실행 경로에 장치를 걸어야 지켜집니다.", "metasecs": [{"title": "✅ 자가 체크", "md": "- [ ] 새 대화에서 **설명 없이** 바로 일이 되나\n- [ ] 훅이 실제로 도는 것을 **눈으로** 봤나\n- [ ] 대화가 길어졌을 때 무엇을 해야 하는지 아나\n- [ ] 스킬 하나를 만들어서 **불러다 써** 봤나"}, {"title": "다음으로", "md": "여기서 완성한 지침이 Stage 4의 **디자인 규칙**을 담는 그릇이 되고,\nStage 5의 모든 작업이 이 위에서 돕니다."}], "sections": [{"file": "1-두층.md", "id": "s3-1", "no": "1", "title": "지침을 두 층에 나눠 적기", "goals": ["「일하는 방식」과 「이 프로젝트의 사실」을 다른 파일에 나눠 적을 수 있다", "새 대화를 열어 설명 없이 프로젝트 질문에 답을 받을 수 있다", "긴 내용은 지침에 넣지 않고 문서 경로로 가리킬 수 있다"], "steps": ["두 층을 표로 가른다", "짧게 쓰고 문서를 가리킨다", "문서 참조", "「실제로 망가진 것」 칸을 둔다", "두 파일을 만들고 새 대화로 시험한다"], "through": "한 번 적어 두면 새 대화를 열어도 설명이 필요 없어진다.", "time": "30분", "need": ["Stage 2의 문서들"], "head": "새 대화를 열 때마다 *\"한국어로 답해줘\", \"이 폴더는 건드리지 마\"*를 반복하고 있다면, 어디에도 적어 두지 않은 것입니다. AI는 대화가 끝나면 기억이 남지 않으니, **파일에 적어 둔 것만** 다음 대화로 넘어갑니다.", "secs": [{"title": "① 두 층을 표로 가른다", "md": "「어떻게 일하나」와 「여기가 어떤 곳인가」는 다른 층입니다. 섞어 두면 프로젝트를 옮길 때마다 다시 쓰고, 나눠 두면 한 번만 씁니다.\n\n| | 글로벌 (위층) | 프로젝트 (아래층) |\n|---|---|---|\n| 어디에 | 홈 폴더 안 설정 폴더 — `~/.claude/CLAUDE.md` | 프로젝트 폴더 맨 위 — `CLAUDE.md` |\n| 언제 읽히나 | 모든 프로젝트에서 항상 | 그 폴더에서 일할 때만 |\n| 무엇을 적나 | 나와 일하는 방식 | 이 프로젝트의 사실 |\n| 예 | 한국어로 답한다 · 결론을 먼저 · 비밀값을 코드에 넣지 않는다 · 지우기 전에 물어본다 | 무엇을 만드나 · 쓰는 도구 · 건드리면 안 되는 폴더 · 자주 쓰는 명령 · 문서가 어디 있나 |\n\n판단은 한 줄입니다 — **다른 프로젝트에서도 참이면 위층, 여기서만 참이면 아래층.** 둘은 자동으로 합쳐져 읽힙니다."}, {"title": "② 짧게 쓰고 문서를 가리킨다", "md": "지침 파일은 대화를 열 때마다 통째로 읽힙니다. 길면 정작 오늘 할 일을 밀어내므로 **100줄 안**을 목표로 하세요.\n\n길어지는 내용은 문서로 빼고, 지침에는 경로 한 줄만 남깁니다.\n\n```\n## ③ 문서 참조\n- 요구사항: docs/요구사항.md\n- 구조: docs/구조.md\n- 결정 기록: docs/결정기록.md\n```\n\n이 세 줄이 <a class=\"xref\" href=\"#2\">Stage 2<\/a>에서 만든 문서를 하네스의 1층으로 끌어올리는 자리입니다. AI는 필요할 때 그 파일을 열어 읽습니다."}, {"title": "④ 「실제로 망가진 것」 칸을 둔다", "md": "처음 지침을 쓰는 사람은 모범 답안을 적습니다. 모범 답안은 AI의 행동을 바꾸지 않습니다.\n\n| ❌ 의미 없음 | ⭕ 값이 있음 |\n|---|---|\n| 코드는 깨끗하게 짜자 | 발송 함수를 잘못 짜서 메일이 두 번 갔다 → 보내기 전에 항상 구독 상태를 확인한다 |\n| 보안에 신경 쓰자 | 비밀값은 `.env`에만 둔다. 저장 전에 섞였는지 확인한다 |\n\n이 칸은 **사고가 날 때마다 한 줄씩** 늘어납니다. 반 년 뒤에는 같은 실수를 두 번 하지 않게 만드는 가장 비싼 자산이 됩니다. 지금은 제목만 두고 비워 둡니다."}, {"title": "⑤ 두 파일을 만들고 새 대화로 시험한다", "md": "만드는 것은 아래 ⚡에서 합니다. 중요한 것은 시험 방식입니다 — **대화를 완전히 새로 열고 아무 설명 없이 묻습니다.** 설명한 뒤에 묻는 것은 시험이 아닙니다."}, {"title": "⚡ 따라 하기", "md": "1. 도구를 열고 아래를 붙여넣어 **글로벌 층**을 만듭니다. 모든 프로젝트에 적용될 「일하는 방식」이므로 홈 폴더에 둡니다. 끝나면 파일 전체 내용이 화면에 보여야 합니다.\n\n```\n내 홈 폴더의 ~/.claude/CLAUDE.md 를 열어서(없으면 새로 만들어서) 아래 규칙을 정리해 넣어줘.\n- 항상 한국어로 답한다\n- 결론을 먼저 말하고, 근거는 그다음에\n- 비밀값(키·비밀번호)은 코드나 대화에 절대 넣지 않는다\n- 파일을 지우거나 되돌리기 전에 반드시 나에게 먼저 물어본다\n- 확인하지 못한 것은 \"추측\"이라고 표시한다\n50줄을 넘기지 말고, 다 쓴 다음 전체 내용을 보여줘.\n```\n\n2. Stage 2 문서가 있는 폴더로 옮겨 가서 프로젝트 층을 만듭니다. 이 폴더에서만 참인 사실을 담는 자리이므로 이 폴더에서 실행해야 합니다. 끝나면 `docs/` 경로가 적힌 100줄 안쪽 파일이 보여야 합니다.\n\n```\n이 폴더에 맞는 CLAUDE.md를 100줄 이내로 만들어줘. 아래 순서로.\n1) 이 프로젝트가 뭔지 3줄\n2) 쓰는 도구 목록\n3) 반드시 지킬 것 — NEVER / ALWAYS 5개 이내 (진짜 어기면 안 되는 것만)\n4) 자주 쓰는 명령\n5) 문서 참조 — docs/ 안의 파일들을 경로로 가리키기만 할 것 (내용 복사 금지)\n6) 실제로 망가진 것 — 지금은 빈 칸으로 두고 제목만\n일반론은 넣지 말고, 이 폴더를 실제로 살펴본 사실만 적어줘.\n```\n\n3. `/clear`로 대화를 완전히 새로 엽니다. 방금 대화의 기억이 남아 있으면 지침이 읽힌 건지 알 수 없기 때문입니다. 그리고 아무 설명 없이 아래만 묻습니다.\n\n```\n지금 이 프로젝트에서 내가 절대 하면 안 되는 게 뭐야? 그리고 요구사항 문서는 어디 있어?\n```\n\n4. 답을 봅니다. 2번에서 적은 NEVER 항목과 `docs/` 경로가 그대로 나오면 두 층이 읽힌 것입니다."}, {"title": "✅ 확인", "md": "- [ ] 파일이 두 개 생겼나 — 홈 폴더 안 하나, 프로젝트 폴더 안 하나\n- [ ] 새 대화에서 설명 없이 3번 질문에 NEVER 항목과 문서 경로가 답으로 왔나\n- [ ] 두 파일 모두 100줄 아래이고, 비밀값이 한 글자도 없나\n\n하나라도 «아니오»면 이 절을 다시 봅니다. 여기가 이 장 전체의 바닥입니다."}, {"title": "📘 말 풀이", "md": "**지침 파일** — AI가 일을 시작할 때 자동으로 먼저 읽는 메모장. 파일 이름이 정해져 있어서(`CLAUDE.md`) 그 이름으로 두면 알아서 읽습니다.\n\n**홈 폴더 (`~`)** — 내 컴퓨터에서 나만의 짐이 놓이는 자리. 앞에 점이 붙은 폴더(`.claude`)는 설정이 놓이는 자리라 평소에 숨겨져 있습니다."}, {"title": "⚠️ 함정", "md": "**두 층을 섞습니다.** 프로젝트 지침에 \"한국어로 답해줘\"를 적으면, 프로젝트를 하나 더 만들 때 또 적게 됩니다.\n\n**지침에 비밀값을 적습니다.** 키·비밀번호는 지침 파일에 넣지 않습니다. 지침은 남에게 보여 줄 수 있는 것만 담습니다.\n\n**한 번 쓰고 다시 안 봅니다.** 지침은 살아 있는 문서라, 고치지 않으면 반년 뒤엔 틀린 말이 됩니다. 500줄짜리 지침은 안 읽히는 게 아니라 다른 것을 밀어내면서 읽힙니다."}, {"title": "🔎 더 깊이", "md": "- 설정을 처음 까는 법은 <a class=\"xref\" href=\"#0\" data-jump=\"s0-2\">Stage 0 「깔기」<\/a>에서 이미 했습니다. 여기서는 그 자리에 내용을 채운 것입니다.\n- 여기서 만든 지침이 <a class=\"xref\" href=\"#4\">Stage 4<\/a>의 디자인 규칙을 담는 그릇이 되고, <a class=\"xref\" href=\"#5\">Stage 5<\/a>의 모든 작업이 이 위에서 돕니다.\n- 검색해 볼 말 — `CLAUDE.md`, `memory files`, `project instructions`"}]}, {"file": "2-하네스4층.md", "id": "s3-2", "no": "2", "title": "하네스 4층을 아래부터 쌓기", "goals": ["하네스의 네 층을 이름과 함께 말할 수 있다", "지침에 실행 엔진 규칙 세 줄을 넣을 수 있다", "작은 일 하나를 단계로 쪼개 승인하며 돌릴 수 있다"], "steps": ["네 층을 표로 본다", "3층 「실행 엔진」을 이해한다", "1층을 점검하고 2층에 규칙을 넣는다", "3층을 한 번 돌려 본다"], "through": "AI에게 무엇을 읽히느냐가 결과를 가른다. 읽힐 것을 네 층으로 쌓는다.", "time": "40분", "need": ["Stage 2의 문서들", "1절의 지침 파일"], "head": "프롬프트를 아무리 잘 써도 매번 다시 씁니다. 같은 일을 다음에도 같은 품질로 내려면 말이 아니라 **틀**이 필요하고, 그 틀을 하네스라 부릅니다.", "secs": [{"title": "① 네 층을 표로 본다", "md": "마구(馬具)는 말의 힘을 줄이지 않고 방향만 잡아 줍니다. 하네스도 AI를 느리게 만드는 게 아니라 엉뚱한 데로 안 가게 잡아 주는 것이고, 네 층으로 쌓입니다.\n\n| 층 | 무엇 | 무엇이 들어가나 | 어디서 만드나 |\n|---|---|---|---|\n| 1층 · 문서 | AI가 읽을 것 | 요구사항 · 구조 · 결정 기록 · 화면 규칙 | <a class=\"xref\" href=\"#2\">Stage 2<\/a> |\n| 2층 · 지침 | AI가 지킬 것 | 반드시 지킬 것 · 문서가 어디 있나 | 이 장 1절 |\n| 3층 · 실행 엔진 | AI를 어떻게 부를 것인가 | 단계마다 부르고 · 끝나면 저장 · 오류면 중단 · 막히면 사람 호출 | 이 절 |\n| 4층 · 훅 | 사람이 없어도 걸리는 것 | 위험한 명령 차단 · 시작할 때 상황 표시 | 이 장 3절 |\n\n**아래층이 없으면 위층이 소용없습니다.** 문서 없이 지침만 있으면 AI는 지킬 규칙은 아는데 뭘 만들지를 모릅니다."}, {"title": "② 3층 「실행 엔진」을 이해한다", "md": "1층·2층·4층은 파일이고, 3층만 순서입니다. 큰 일을 한 번에 시키면 AI는 길을 잃으므로, 단계로 쪼개고 단계마다 세 갈래로 돕니다.\n\n| 결과 | 다음에 일어나는 일 |\n|---|---|\n| 끝났다 | 그 단계 결과를 저장하고 다음 단계로 |\n| 오류가 났다 | 거기서 멈춘다. 오류를 안고 다음으로 가지 않는다 |\n| 막혔다 | 사람을 부른다. 혼자 추측해서 진행하지 않는다 |\n\n핵심은 세 번째입니다. **AI가 모르면 멈추고 물어보게** 만들지 않으면, 모를 때 그럴듯한 것을 지어내고 그 위에 계속 쌓습니다. 이 순서를 지침에 적어 두면 그것이 실행 엔진입니다 — 프로그램이 아니라 약속입니다."}, {"title": "③ 1층을 점검하고 2층에 규칙을 넣는다", "md": "1층은 이미 <a class=\"xref\" href=\"#2\">Stage 2<\/a>에서 만들었으니 빠진 것이 없는지만 봅니다. 그다음 1절의 지침에 ②의 세 갈래를 **세 줄로** 추가합니다. 둘 다 아래 ⚡에서 합니다."}, {"title": "④ 3층을 한 번 돌려 본다", "md": "작은 일 하나로 연습합니다. 진행 중에 **일부러 애매한 지점**을 하나 두고, AI가 정말 멈추고 물어보는지 봅니다. 4층(훅)은 아직 비어 있고 다음 절에서 채웁니다."}, {"title": "⚡ 따라 하기", "md": "1. 프로젝트 폴더에서 아래를 붙여넣어 1층을 점검합니다. 문서가 없으면 위층이 빈 문을 지키기 때문입니다. 문서 목록과 빠진 문서 이름이 보여야 합니다.\n\n```\n이 폴더의 docs/ 안에 무슨 문서가 있는지 목록을 보여주고,\n요구사항 · 구조 · 결정 기록 · 화면 규칙 중에 빠진 게 있으면 알려줘.\n빠진 건 지금 만들지 말고 목록만.\n```\n\n2. 지침에 실행 엔진 규칙을 추가합니다. 대화창에 말하면 사라지고, 지침에 적어야 다음 대화에도 남기 때문입니다. 끝나면 「반드시 지킬 것」 아래에 세 줄이 늘어난 것이 보여야 합니다.\n\n```\nCLAUDE.md의 \"반드시 지킬 것\"에 아래 세 줄을 추가해줘.\n- ALWAYS 큰 작업은 단계로 나누고, 각 단계가 끝나면 결과를 저장한 뒤 다음으로 간다\n- NEVER 오류가 난 상태로 다음 단계를 진행하지 않는다. 멈추고 보고한다\n- NEVER 모르는 것을 추측해서 채우지 않는다. 막히면 나에게 물어본다\n```\n\n3. 30분 안에 끝날 작은 일 하나를 골라 아래를 붙여넣습니다. 큰 일로 하면 어디서 어긋났는지 안 보입니다. 첫 답으로 **단계 목록만** 나오고 멈춰야 합니다.\n\n```\n[작은 일 하나]를 해줘. 단, 아래 순서로.\n1) 먼저 이 일을 3~5단계로 쪼갠 목록을 보여줘. 내 승인을 기다려줘\n2) 승인하면 한 단계씩 진행하고, 각 단계가 끝날 때마다 무엇을 했는지 한 줄로 보고해줘\n3) 오류가 나면 즉시 멈추고 오류 내용을 보여줘\n4) 판단이 필요한 지점이 나오면 진행하지 말고 나에게 물어봐\n```\n\n4. 승인하고 한 단계씩 진행시킵니다. 애매하게 남겨 둔 지점에 이르렀을 때 AI가 멈추고 질문을 던지면 3층이 도는 것입니다."}, {"title": "✅ 확인", "md": "- [ ] `docs/` 안에 읽을 문서가 실제로 있나\n- [ ] 지침에 「모르면 물어본다」가 글자로 적혀 있나\n- [ ] 3번에서 단계 목록이 먼저 나오고 멈췄나 — 바로 만들기 시작하지 않았나\n- [ ] 애매한 지점에서 AI가 물어봤나\n\n하나라도 «아니오»면 그 층으로 돌아갑니다."}, {"title": "📘 말 풀이", "md": "**하네스(harness)** — 말에게 씌우는 마구. AI가 아무 데로나 가지 않게 잡아 주는 틀 전체를 가리키며, 하나의 도구 이름이 아닙니다.\n\n**실행 엔진** — 큰 일을 단계로 쪼개서 순서대로 돌리는 약속. 끝나면 저장, 오류면 중단, 막히면 사람 호출을 미리 정해 둔 것입니다.\n\n**문서 폴더 (`docs/`)** — 프로젝트 폴더 안에서 읽을 것만 모아 두는 방. 코드가 아니라 「무엇을 왜 만드나」가 들어갑니다."}, {"title": "⚠️ 함정", "md": "**4층부터 만들려 합니다.** 훅이 제일 재미있어 보이지만, 문서가 없으면 훅은 빈 문을 지킵니다. 아래에서부터 쌓습니다.\n\n**문서를 지침 안에 복사합니다.** 지침이 길어져서 다른 것을 밀어냅니다. 지침에는 경로 한 줄만 둡니다.\n\n**오류가 났는데 계속 갑니다.** \"일단 다음 거 해봐\"가 가장 비싼 말입니다. 오류 위에 쌓은 것은 전부 다시 해야 합니다.\n\n**단계를 안 쪼갭니다.** \"서비스 만들어줘\" 한 줄이면 실행 엔진이 있어도 소용없습니다. 단계는 사람이 나눕니다."}, {"title": "🔎 더 깊이", "md": "- 이 4층 위에서 실제 기능을 하나 짜는 것이 <a class=\"xref\" href=\"#5\">Stage 5<\/a>입니다.\n- 단계를 어떤 순서로 돌 것인가를 더 정교하게 만드는 이야기는 <a class=\"xref\" href=\"#8\">Stage 8<\/a>에서 다룹니다. 하네스(무엇을 읽히나)와는 다른 층입니다.\n- 검색해 볼 말 — `agent harness`, `plan mode`, `checkpoint`"}]}, {"file": "3-훅다섯.md", "id": "s3-3", "no": "3", "title": "훅으로 잠금장치 걸기", "goals": ["훅이 걸리는 다섯 자리를 표로 구분할 수 있다", "손대면 안 되는 폴더를 훅으로 막고 막히는 것을 눈으로 확인할 수 있다", "「막아야 하는 것은 지침이 아니라 훅으로」를 한 문장으로 말할 수 있다"], "steps": ["다섯 자리를 표로 본다", "이미 도는 훅을 확인한다", "잠금장치 하나를 건다", "막히는 것을 눈으로 본다"], "through": "지시문은 부탁이고, 훅은 잠금장치다.", "time": "50분", "need": ["2절의 하네스 1~3층"], "head": "지침에 *\"이 폴더는 절대 건드리지 마\"*라고 적어 두면 대개 지켜집니다 — 대개는. 2025년 어느 회사의 AI 에이전트가 실서비스 데이터베이스를 지웠는데, 원인은 기술 결함이 아니라 그 말이 **지시문에만** 있고 실행 경로에는 강제 장치가 없었던 것입니다.", "secs": [{"title": "① 다섯 자리를 표로 본다", "md": "훅은 특정 순간에 자동으로 걸리는 장치이고, 걸 수 있는 자리가 정해져 있습니다. 부탁은 대부분 지켜지지만 잠금장치는 항상 지켜집니다.\n\n| 언제 | 무엇을 시킬 수 있나 | 비개발자에게 쓸모 |\n|---|---|---|\n| 도구를 쓰기 직전 | 승인 · 차단 · 고쳐서 실행 | 위험한 명령, 손대면 안 되는 폴더를 막는다 |\n| 도구를 쓴 직후 | 정리 · 검사 · 기록 | 파일을 고칠 때마다 자동 정리, 무엇을 고쳤는지 기록 |\n| 알림이 뜰 때 | 다른 곳으로 전달 | 승인 요청을 휴대폰으로 받기 |\n| 작업이 끝날 때 | 검사하고, 통과 못 하면 되돌리기 | 테스트를 통과 못 하면 「완료」로 안 쳐 준다 |\n| 세션이 시작될 때 | 상황을 먼저 보여 주기 | 어느 가지에 있고 무엇이 바뀌었는지 첫 화면에 표시 |\n\n가장 값이 큰 둘은 **첫 번째와 네 번째**입니다. 첫 번째는 사고를 막고, 네 번째는 *\"다 됐습니다\"*라는 말을 검증된 말로 바꿉니다."}, {"title": "② 이미 도는 훅을 확인한다", "md": "<a class=\"xref\" href=\"#0\" data-jump=\"s0-2\">Stage 0<\/a>에서 깐 설정 팩에는 훅이 이미 들어 있습니다. 무엇이 도는지 보면 훅이 무엇인지 바로 잡힙니다.\n\n| 언제 | 실제로 하는 일 |\n|---|---|\n| 세션 시작 | 작업 중인 가지, 바뀐 파일, 하다 만 일을 첫 화면에 자동 표시 |\n| 프롬프트를 넣을 때 | 내가 쓴 말에서 키워드를 잡아 맞는 스킬을 자동 추천 |\n| 파일 편집 후 | 무엇을 고쳤는지 기록에 남김 |\n| 대화를 압축하기 직전 | 대화 내용을 통째로 자동 백업 |\n\n마지막 것이 비개발자에게 바로 값이 됩니다. 대화가 길어져 접을 때(6절) **접히기 직전에** 원본이 파일로 남으므로, *\"아까 그 얘기 어디 갔지\"*가 사라집니다."}, {"title": "③ 잠금장치 하나를 건다", "md": "설정 파일에 이렇게 적으면, 파일을 쓰거나 고치려 할 때마다 지정한 검사가 먼저 돕니다.\n\n```json\n{\n  \"hooks\": {\n    \"PreToolUse\": [\n      {\n        \"matcher\": \"Write|Edit\",\n        \"hooks\": [\n          { \"type\": \"command\", \"command\": \"python3 ~/.claude/scripts/보호폴더-차단.py\", \"timeout\": 5 }\n        ]\n      }\n    ],\n    \"SessionStart\": [\n      {\n        \"matcher\": \"*\",\n        \"hooks\": [\n          { \"type\": \"command\", \"command\": \"bash ~/.claude/scripts/지금상황.sh\", \"timeout\": 10 }\n        ]\n      }\n    ]\n  }\n}\n```\n\n`matcher`는 어떤 도구를 쓸 때 걸지, `command`는 무엇을 돌릴지, `timeout`은 몇 초까지 기다릴지입니다. 검사가 «막아라»라는 신호를 돌려주면 그 작업은 **일어나지 않습니다.** 설득으로 넘어갈 수 없습니다."}, {"title": "④ 막히는 것을 눈으로 본다", "md": "**훅은 도는 것을 봐야 믿을 수 있습니다.** 설정 파일에 적었다고 끝이 아니라, 일부러 막아 둔 일을 시켜서 막히는 메시지를 봐야 이 절이 끝납니다."}, {"title": "⚡ 따라 하기", "md": "1. 아래를 붙여넣어 지금 걸린 훅부터 봅니다. 새로 걸기 전에 이미 있는 것과 겹치지 않아야 하기 때문입니다. 「언제 / 무엇을 / 시간 제한」 세 칸짜리 표가 보여야 합니다.\n\n```\n내 ~/.claude/settings.json 에 지금 어떤 훅이 걸려 있는지 표로 보여줘.\n각 줄에 \"언제 도는가 / 무엇을 하는가 / 시간 제한이 걸려 있는가\"를 적어줘.\n시간 제한이 없는 훅이 있으면 표시해줘.\n```\n\n2. 손대면 안 되는 폴더 이름을 넣어 잠금장치를 겁니다. 지침에 적은 부탁을 실행 경로의 장치로 바꾸는 것입니다. 끝나면 설정 파일 형식 검사가 «통과»로 보여야 합니다.\n\n```\n[폴더 이름] 폴더 안의 파일을 쓰거나 고치려 할 때 자동으로 막는 훅을 만들어줘.\n- 도구를 쓰기 직전(PreToolUse)에 걸고, Write와 Edit에만 적용\n- 막을 때는 왜 막혔는지 한국어로 한 줄 보여줄 것\n- timeout은 5초로\n- 스크립트는 ~/.claude/scripts/ 에 두고, settings.json에 등록해줘\n만든 다음 설정 파일이 형식에 맞는지 검사해서 결과를 보여줘.\n```\n\n3. 새 대화를 열고 막아 둔 폴더의 파일을 일부러 고쳐 달라고 시킵니다. 설정은 새 대화부터 읽히기 때문입니다. **막혔다는 메시지**가 떠야 성공이고, 파일이 고쳐졌으면 훅이 안 걸린 것입니다.\n\n```\n[막아 둔 폴더]/아무파일.md 에 \"테스트\"라고 한 줄 추가해줘.\n```\n\n4. 대화를 다시 새로 열어 첫 화면을 봅니다. 가지 이름과 바뀐 파일 목록이 저절로 떠 있으면 세션 시작 훅이 도는 것입니다."}, {"title": "✅ 확인", "md": "- [ ] 막혔다는 메시지가 화면에 떴고, 파일은 그대로인가\n- [ ] 내가 건 훅 전부에 시간 제한 숫자가 붙어 있나\n- [ ] 새 대화 첫 화면에 지금 상황이 저절로 떠 있나\n- [ ] *\"막아야 하는 것은 지침이 아니라 훅으로\"*를 한 문장으로 말할 수 있나\n\n첫째가 «아니오»면 다음 절로 가지 않습니다."}, {"title": "📘 말 풀이", "md": "**훅(hook)** — 특정 순간에 자동으로 걸리는 장치. 문에 달린 도어록처럼 그 순간이 오면 알아서 걸립니다.\n\n**도구 호출** — AI가 파일을 읽고 · 쓰고 · 명령을 실행하는 행동 하나하나. 훅은 대부분 이 순간의 앞뒤에 걸립니다.\n\n**시간 제한(timeout)** — 훅이 몇 초 안에 끝나야 하는지 정해 두는 숫자. 지나면 훅을 포기하고 넘어갑니다."}, {"title": "⚠️ 함정", "md": "**시간 제한을 안 겁니다.** 훅이 어딘가에서 멈추면 전체가 같이 멈춰서 도구가 고장 난 것처럼 보입니다. 모든 훅에 `timeout`을 답니다.\n\n**훅을 너무 많이 겁니다.** 매 편집마다 무거운 검사가 돌면 느려져서 결국 다 끕니다. 차단 하나 + 종료 검사 하나로 시작합니다.\n\n**설정 파일에 주석이나 쉼표 실수가 들어갑니다.** JSON에는 주석을 넣을 수 없고, 쉼표가 어긋나면 조용히 안 돕니다. 저장한 뒤 반드시 실제로 도는지 눈으로 확인합니다.\n\n**훅 스크립트에 비밀값을 적습니다.** 훅도 결국 파일입니다. 키는 넣지 않습니다."}, {"title": "🔎 더 깊이", "md": "- 작업이 끝날 때 테스트를 통과해야만 「완료」로 인정하는 훅은 <a class=\"xref\" href=\"#7\">Stage 7<\/a>에서 테스트를 만든 뒤에 겁니다. 검사할 게 있어야 검사가 됩니다.\n- 훅으로 알림을 휴대폰으로 보내는 이야기는 <a class=\"xref\" href=\"#8\">Stage 8<\/a>에 있습니다.\n- 설정 파일에 쓸 수 있는 권한은 명령을 실행할 수 있는 권한과 같습니다. 남이 준 설정 파일을 그대로 넣기 전에 무엇이 도는지 읽습니다 → <a class=\"xref\" href=\"#부록\">부록 「보안」<\/a>\n- 검색해 볼 말 — `Claude Code hooks`, `PreToolUse`, `hook timeout`"}]}, {"file": "4-지침파일둘.md", "id": "s3-4", "no": "4", "title": "지침 파일 둘을 한 줄로 잇기", "goals": ["두 도구가 서로의 지침 파일을 읽지 않는다는 것을 한 문장으로 말할 수 있다", "지침 한 벌을 `@` 한 줄로 양쪽 도구에 이을 수 있다", "「짜기는 하나·리뷰는 다른 하나」의 효과가 측정된 적 없음을 안다"], "steps": ["서로 안 읽는 것을 표로 본다", "@ 한 줄로 잇는다", "「리뷰는 다른 도구로」를 정직하게 본다", "한 벌로 합치고 새 대화로 시험한다"], "through": "두 도구를 쓰면 지침도 두 번 쓰게 된다. 한 줄로 이어 두면 한 번이면 된다.", "time": "30분", "need": ["1절의 지침 파일"], "head": "도구는 둘을 씁니다 — 메인 하나, 백업 하나(<a class=\"xref\" href=\"#0\" data-jump=\"s0-1\">Stage 0<\/a>). 그런데 둘은 **서로의 지침 파일을 읽지 않아서**, 메인에만 규칙을 적어 두고 백업을 부르면 그 도구는 아무것도 모르는 채로 내 프로젝트를 만집니다.", "secs": [{"title": "① 서로 안 읽는 것을 표로 본다", "md": "| | Claude Code | 코덱스 |\n|---|---|---|\n| 읽는 지침 파일 | `CLAUDE.md` 만 | `AGENTS.md` 만 |\n| 상대 것을 읽나 | 안 읽습니다 (공식 문서에 명시) | 안 읽습니다 |\n| 스킬을 두는 폴더 | `.claude/skills/` | `.agents/skills/` |\n| 스킬 파일 형식 | `SKILL.md` | `SKILL.md` — 형식은 같고 폴더만 다릅니다 |\n| 상대 설정 흡수 | 상대 것을 가져오는 명령이 있습니다 | 반대 방향은 없습니다 |\n| 승인 방식 | 어디까지 알아서 하게 둘지를 한 축으로 | 「어디까지 만지나」와 「무엇을 물어보나」를 따로 |\n\n충돌이 나는 게 아니라 그냥 서로 못 봅니다. 결과는 하나 — **두 번 쓰게 됩니다.**"}, {"title": "② `@` 한 줄로 잇는다", "md": "내용은 `AGENTS.md`에 한 벌만 두고, `CLAUDE.md`에서 그것을 가리킵니다.\n\n```markdown\n# 이 프로젝트의 지침\n\n@AGENTS.md\n```\n\n`@`로 시작하는 줄은 그 파일을 여기 끼워 넣으라는 뜻입니다. `AGENTS.md` 한 벌을 고치면 양쪽이 같이 바뀝니다 — **한 정보의 집은 하나**입니다.\n\n파일 두 개가 싫으면 심볼릭 링크로 `CLAUDE.md`를 `AGENTS.md`의 바로가기로 만들 수도 있습니다. 다만 바로가기는 눈에 잘 안 보여서 나중에 헷갈리므로, 처음에는 `@` 한 줄을 권합니다."}, {"title": "③ 「리뷰는 다른 도구로」를 정직하게 본다", "md": "*\"Claude로 짜고 코덱스로 리뷰한다\"*는 많이 하는 방식이지만, 효과가 측정된 적은 없습니다.\n\n| | |\n|---|---|\n| 흔한가 | 흔합니다. `AGENTS.md`에 Claude를 함께 적어 둔 저장소가 GitHub에 수십만 건 있습니다 (2026-09 조사) |\n| 효과가 실측됐나 | 없습니다. 이 방식을 다룬 글은 전부 논증이지 측정이 아닙니다 |\n| 찬성 | *\"계획을 다른 도구에 리뷰시키면 항상 뭔가 찾아낸다\"* |\n| 반대 | *\"큰 문제를 잡는 걸 본 적 없다. 어차피 만들다 보면 해결될 것만 지적한다\"* |\n| 오히려 반대 방향 근거 | AI가 유능해질수록 서로 비슷한 실수를 한다는 연구가 있습니다 *(현행 적용 여부 [확인 필요])* |\n\n그래서 이렇게 말합니다 — «많은 개발자가 이렇게 한다. 다만 얼마나 이득인지 측정된 적은 없다». 지금은 **도구 하나를 제대로 익히는 게 먼저**이고, 두 번째 도구는 남의 돈·남의 개인정보가 걸린 결과물을 내보내기 직전에 한 번만 부릅니다."}, {"title": "④ 한 벌로 합치고 새 대화로 시험한다", "md": "합치는 것은 아래 ⚡에서 합니다. 시험은 1절과 같이 **새 대화에서 설명 없이** 묻는 것입니다."}, {"title": "⚡ 따라 하기", "md": "1. 프로젝트 폴더에서 지금 상태를 확인합니다. 두 파일이 이미 따로 있으면 어느 쪽이 맞는지부터 알아야 하기 때문입니다. 있는지 여부와 차이 표가 보여야 합니다.\n\n```\n이 폴더에 CLAUDE.md와 AGENTS.md가 각각 있는지 확인해줘.\n있으면 두 파일의 내용이 어디가 다른지 표로 비교해줘.\n```\n\n2. 한 벌로 합칩니다. 두 곳에 두면 한 달 뒤 내용이 서로 달라지기 때문입니다. 끝나면 `AGENTS.md` 전체와 두 줄만 남은 `CLAUDE.md`가 보여야 합니다.\n\n```\n지침 내용을 AGENTS.md 한 파일로 합쳐줘.\n그리고 CLAUDE.md는 아래 두 줄만 남겨줘.\n\n# 이 프로젝트의 지침\n@AGENTS.md\n\n합친 뒤 AGENTS.md 전체를 보여줘. 100줄을 넘으면 넘긴 부분은 docs/ 로 빼고 경로로 가리켜줘.\n```\n\n3. 새 대화를 열고 설명 없이 묻습니다. `@` 줄이 정말 읽히는지는 이렇게만 알 수 있습니다. `AGENTS.md`에 적힌 NEVER 항목이 답으로 나와야 합니다.\n\n```\n이 프로젝트에서 절대 하면 안 되는 게 뭐야?\n```\n\n4. 백업 도구를 쓸 계획이면 스킬 폴더도 이어 둡니다. 형식은 같고 폴더만 다르기 때문입니다. 복사와 바로가기의 차이 설명이 먼저 나오고, 그다음 실행 결과가 보여야 합니다.\n\n```\n.claude/skills/ 에 있는 스킬들이 .agents/skills/ 에서도 보이게 해줘.\n복사하는 방법과 바로가기를 거는 방법의 차이를 먼저 한 줄씩 설명하고,\n어느 쪽을 권하는지 이유와 함께 말해줘. 그다음에 실행해줘.\n```\n\n### 이렇게 해 봤습니다 — 2026-09-10 · 정말 안 읽습니다\n\n한쪽 도구를 몇 달 쓴 컴퓨터에 다른 도구를 새로 깔고, 각자의 설정 폴더를 열어 봤습니다. 이미 쓰던 도구는 지침 파일이 여러 층으로 채워져 있고 스킬 폴더에 9개가 있었는데, 새로 깐 도구는 **지침 0줄(빈 파일) · 스킬 0개**였습니다.\n\n같은 컴퓨터, 같은 사람, 같은 프로젝트인데 새 도구는 아무것도 모르는 상태로 시작했습니다. 그래서 도구를 둘 쓰기로 했다면 두 번 쓸 각오를 하거나, 위의 우회(`@` 한 줄)를 걸어 두어야 합니다. 저는 이래서 「메인 하나 + 백업 하나」를 권합니다.\n\n새로 깐 도구의 기본 권한도 확인했습니다 — 작업 폴더 안에서는 읽고 고치고 실행하지만, 폴더 밖으로 나가거나 인터넷에 닿으려면 물어보고, 인터넷은 기본으로 꺼져 있습니다. 설정을 안 건드려도 이 정도는 막혀 있다는 뜻입니다. 그래도 다 풀어 주는 설정은 쓰지 마세요."}, {"title": "✅ 확인", "md": "- [ ] 지침 내용이 한 벌만 있나 — 같은 내용이 두 파일에 복사돼 있지 않나\n- [ ] `CLAUDE.md`를 열었을 때 `@AGENTS.md` 한 줄이 보이나\n- [ ] 새 대화에서 설명 없이 3번 질문에 NEVER 항목이 답으로 왔나\n- [ ] 「짜기는 하나, 리뷰는 다른 하나」의 효과가 측정된 적 없다는 것을 아나"}, {"title": "📘 말 풀이", "md": "**심볼릭 링크(symbolic link)** — 파일의 바로가기. 실물은 한 곳에 있고, 다른 이름으로도 열리게 만드는 표지판입니다.\n\n**샌드박스(sandbox)** — 도구가 놀 수 있는 모래밭의 울타리. 이 폴더 밖은 못 만진다, 인터넷은 못 쓴다 같은 경계를 물어보기 전에 미리 그어 두는 층입니다."}, {"title": "⚠️ 함정", "md": "**양쪽에 복사해 둡니다.** 처음엔 편한데, 한 달 뒤 두 파일의 내용이 서로 달라집니다. 어느 쪽이 맞는지 아무도 모릅니다.\n\n**스킬을 만들고 다른 도구에서 안 보인다고 당황합니다.** 형식은 같고 폴더만 다릅니다. 복사하거나 바로가기를 걸면 됩니다.\n\n**둘을 같은 폴더에서 동시에 켭니다.** 서로가 고친 것을 덮어씁니다.\n\n**효과를 과장해서 스스로를 속입니다.** 두 번째 도구를 켠 날 결과가 좋았다면, 도구 때문인지 그날 내가 잘 시킨 건지 구분할 방법이 없습니다."}, {"title": "🔎 더 깊이", "md": "- 두 번째 도구를 언제 부르는가 — 커밋·배포 직전 한 번. 그 자리는 <a class=\"xref\" href=\"#7\">Stage 7<\/a>입니다.\n- 도구 이름·요금·설치는 <a class=\"xref\" href=\"#0\" data-jump=\"s0-1\">Stage 0 「도구 지도」<\/a>와 <a class=\"xref\" href=\"#부록\">부록 「버전과 값」<\/a>에 있습니다. 여기서는 지침 파일 관계만 다뤘습니다.\n- 검색해 볼 말 — `AGENTS.md`, `CLAUDE.md import`, `agent instructions file`"}]}, {"file": "5-스킬.md", "id": "s3-5", "no": "5", "title": "스킬 — 자주 하는 일을 레시피로", "goals": ["자주 하는 일을 스킬 하나로 만들어 불러 쓸 수 있다", "설명문에 «언제 쓰는가»를 적어야 하는 이유를 말할 수 있다"], "steps": ["스킬은 레시피북이다", "그래서 설명문이 전부입니다", "스킬 하나의 생김새", "순서", "내지 않을 것"], "through": "설명문에 「언제 이걸 쓰는가」를 적는 것이 전부다.", "time": "50분", "need": ["1절의 지침 파일"], "head": "지침 파일은 **항상** 읽힙니다. 그래서 짧아야 합니다(1절).\n그런데 *\"보도자료는 이 순서로 정리해\"*처럼 **가끔만 필요한 긴 절차**는 어디에 둘까요.\n\n지침에 넣으면 매번 자리를 차지하고, 안 넣으면 매번 다시 설명합니다.\n**그 사이를 메우는 것이 스킬입니다.**\n\n이 절을 건너뛰면 <a class=\"xref\" href=\"#5\">Stage 5<\/a> 이후로 같은 절차를 매번 말로 풀게 됩니다.", "secs": [{"title": "① 스킬은 레시피북이다", "md": "요리책을 통째로 외우고 다니는 사람은 없습니다.\n**목차만 알고 있다가, 필요한 요리가 정해지면 그 쪽을 폅니다.**\n\n스킬이 정확히 그렇습니다.\n\n| | 평소 | 맞는 상황이 오면 |\n|---|---|---|\n| **AI가 읽는 것** | 스킬의 **설명문 한 줄만** | **본문 전체**를 펼쳐서 읽음 |\n| **차지하는 자리** | 거의 없음 | 그때만 |\n\n그래서 스킬은 **아무리 많아도 부담이 되지 않습니다.** 안 쓰는 것은 잠들어 있습니다."}, {"title": "② ⭐ 그래서 설명문이 전부입니다", "md": "AI가 평소 보는 것은 **설명문 한 줄**뿐입니다.\n그 한 줄에 **«언제 이걸 쓰는가»**가 없으면, 스킬은 만들어 놓고 **영영 안 펴집니다.**\n\n| ❌ 안 펴지는 설명문 | ⭕ 펴지는 설명문 |\n|---|---|\n| `문서를 정리한다` | `회의록·메모·자료 뭉치를 하나의 문서로 정리할 때 쓴다. \"정리해줘\", \"회의록 만들어줘\", \"이거 요약해서 문서로\" 같은 말이 나오면 사용.` |\n| `조사 도우미` | `어떤 주제를 조사해서 한 장으로 요약할 때 쓴다. \"알아봐줘\", \"조사해줘\", \"시장 어때\" 같은 말이 나오면 사용. 출처와 날짜를 반드시 붙인다.` |\n\n**규칙 하나** — 설명문에는 «무엇을 하나»가 아니라 **«어떤 말이 나오면 쓰나»**를 적습니다.\n내가 실제로 쓰는 말투 그대로 넣으면 됩니다."}, {"title": "③ 스킬 하나의 생김새", "md": "폴더 하나 + 파일 하나입니다.\n\n```\n프로젝트폴더/\n└── .claude/\n    └── skills/\n        └── 문서정리/\n            └── SKILL.md\n```\n\n`SKILL.md` 안은 이렇게 생겼습니다.\n\n```markdown\n---\nname: 문서정리\ndescription: 회의록·메모·자료 뭉치를 하나의 읽을 수 있는 문서로 정리할 때 쓴다. \"정리해줘\", \"회의록 만들어줘\", \"이거 문서로\" 같은 말이 나오면 사용.\n---\n\n# 문서 정리\n\n## ④ 순서\n1. 재료를 전부 읽고 중복을 표시한다\n2. 결론 · 결정된 것 · 남은 질문 셋으로 나눈다\n3. 결론을 맨 위에 놓는다\n4. 날짜와 출처를 각 줄에 붙인다\n5. 확인 못 한 것은 [확인 필요]로 남긴다\n\n## ⑤ 내지 않을 것\n- 추측을 사실처럼 쓰지 않는다\n- 원문을 그대로 붙이지 않는다. 다시 쓴다\n```\n\n맨 위 세 줄(`---` 사이)이 **설명문 자리**이고, 그 아래가 **본문**입니다.\n본문이 길어지면 딴 파일로 쪼개고 여기서는 **경로로 가리킵니다** — 지침 파일과 같은 원리입니다."}, {"title": "📘 말 풀이", "md": "**스킬(Skill)**\n**레시피북 한 권.** 자주 하는 일의 순서를 적어 둔 파일입니다. AI가 평소에는 목차만 보고 있다가, 맞는 상황이 오면 펼쳐 읽습니다.\n\n**설명문(description)**\n스킬 맨 위에 적는 **«언제 이걸 쓰는가» 한 줄.** AI가 평소에 유일하게 읽는 부분이라, 여기가 부실하면 스킬이 있어도 안 불려 나옵니다.\n\n**맨 위 칸(frontmatter)**\n파일 맨 위에 `---` 두 줄 사이에 적는 **이름표 구역.** 이름과 설명문이 여기 들어갑니다. 본문이 아니라 **꼬리표**라고 보면 됩니다."}, {"title": "⚠️ 함정", "md": "- **⚠️ 비밀값을 넣습니다.** 스킬 파일에 키·비밀번호·계정 정보를 **절대** 넣지 않습니다. 스킬은 남에게 그대로 건네줄 수 있는 것만 담습니다. 필요하면 *\"키는 `.env`에서 읽는다\"*라고 **적기만** 합니다.\n- **설명문에 「무엇을 하나」만 적습니다.** 그러면 안 펴집니다. **어떤 말이 나오면 쓰는지**를 적습니다.\n- **한 스킬에 다섯 가지 일을 넣습니다.** 언제 써야 할지 AI도 나도 모릅니다. **하나에 하나**입니다.\n- **본문이 수백 줄이 됩니다.** 펼쳐지는 순간 자리를 다 잡아먹습니다. 길면 쪼개고 경로로 가리킵니다.\n- **만들어 놓고 안 씁니다.** 스킬은 **내가 이미 세 번 이상 시킨 일**만 만듭니다. 안 해 본 일을 미리 스킬로 만들면 틀린 순서가 굳습니다.\n- **폴더를 헷갈립니다.** 백업 도구는 스킬 폴더 이름이 다릅니다(4절)."}, {"title": "⚡ 따라 하기", "md": "비개발자가 **바로 값을 보는 스킬 셋**을 만듭니다.\n\n```\n내 프로젝트에 쓸 스킬 3개를 만들어줘. 각각 .claude/skills/<이름>/SKILL.md 파일 하나로.\n\n1) 문서정리 — 회의록·메모·자료 뭉치를 하나의 읽을 수 있는 문서로 정리\n2) 조사요약 — 주제 하나를 조사해서 한 장으로 요약. 출처와 날짜를 반드시 붙이고, 확인 못 한 건 [확인 필요]로\n3) 발행전점검 — 밖으로 내보내기 직전 점검. 비밀값이 섞였는지 · 깨진 링크 · 오타 · 날짜가 옛날 것인지\n\n각 파일의 규칙:\n- 맨 위 --- 사이에 name과 description\n- description에는 \"어떤 말이 나오면 쓰는가\"를 내 말투로 넣을 것 (예: \"정리해줘\", \"조사해줘\", \"올려도 돼?\")\n- 본문은 순서 6단계 이내 + \"하지 않을 것\" 목록\n- 키·비밀번호는 절대 넣지 말고, 필요하면 .env에서 읽는다고 적기만 할 것\n- 각 파일 40줄 이내\n\n만든 뒤 세 파일의 description만 모아서 보여줘.\n```\n\n그다음 **정말 불려 나오는지** 시험합니다. 스킬 이름을 대지 **않고** 평소 말투로 시킵니다.\n\n```\n어제 회의 메모 세 개 있는데, 이거 하나로 정리해줘.\n```\n\n→ 답이 시작될 때 **어떤 스킬을 쓰는지 표시**되면 성공입니다.\n안 불려 나오면 **설명문에 내가 방금 쓴 말을 추가**하고 다시 시험합니다."}, {"title": "✅ 확인", "md": "- [ ] `.claude/skills/` 안에 **폴더 세 개**가 생겼나\n- [ ] 각 `SKILL.md` 맨 위에 **`name`과 `description`**이 있나\n- [ ] **스킬 이름을 대지 않고** 평소 말투로 시켰을 때 스킬이 **불려 나왔나**\n- [ ] 세 파일 어디에도 **비밀값이 없나**\n- [ ] 안 불려 나온 스킬의 **설명문을 고쳐서 다시 시험**해 봤나\n\n세 번째가 «아니오»면 설명문 문제입니다. 본문이 아니라 **설명문**을 고칩니다."}, {"title": "🔎 더 깊이", "md": "- 저장소를 대량으로 조사해 보면 **대부분 지침 파일만 쓰고 스킬은 거의 안 씁니다.** 여기까지 하면 앞서갑니다 — 자세한 이야기는 이 스테이지 7절에.\n- 스킬을 **여러 개 조합해 한 줄로 실행**하는 것이 슬래시 명령입니다. 이미 깔린 것들의 목록은 <a class=\"xref\" href=\"#부록\">부록<\/a>에.\n- 검색해 볼 말 — `SKILL.md`, `agent skills`, `skill description trigger`"}]}, {"file": "6-컨텍스트관리.md", "id": "s3-6", "no": "6", "title": "대화가 길어지면 — 컨텍스트 관리", "goals": ["대화가 길어졌을 때 접기와 비우기 중 무엇을 할지 고를 수 있다", "다음 세션에서 하던 일을 이어서 시작할 수 있다"], "steps": ["컨텍스트는 책상이다", "70%", "접기와 비우기", "진짜 답", "큰 읽기는 딴 데 맡긴다"], "through": "대화가 길어지면 정리해야 한다. 남길 것은 대화 내용이 아니라 문서다.", "time": "30분", "need": ["1절의 지침 파일", "3절의 훅"], "head": "*\"아까는 잘하더니 왜 갑자기 이상해지지?\"*\n\n능력이 떨어진 게 아닙니다. **책상이 꽉 찬 것**입니다.\n대화가 길어지면 AI는 이미 정한 것과 어긋나는 답을 내고, 아까 고친 문제를 다시 만들고, 말투가 흐트러집니다.\n\n이건 **예방할 수 있는 일**이고, 방법은 간단합니다. 몰라서 당하는 것뿐입니다.", "secs": [{"title": "① 컨텍스트는 책상이다", "md": "AI가 한 번에 들고 있을 수 있는 기억에는 **정해진 크기**가 있습니다. 책상 넓이와 같습니다.\n\n- 지침 파일이 자리를 차지합니다 (그래서 짧아야 합니다)\n- 읽은 파일이 자리를 차지합니다\n- 주고받은 대화가 **계속 쌓입니다**\n\n책상이 차면 새 서류를 놓을 자리가 없어서, **밑에 깔린 것을 못 보게 됩니다.**\n사람처럼 \"중요한 걸 기억하고 나머지를 잊는\" 게 아니라 **다 흐려집니다.**"}, {"title": "② 70% — 정리할 때의 신호", "md": "화면에 남은 자리가 표시됩니다. 이 숫자만 보면 됩니다.\n\n| 얼마나 찼나 | 무엇을 하나 |\n|---|---|\n| **0~50%** | 그냥 합니다. 가장 정확한 구간입니다 |\n| **50~70%** | 새 작업으로 넘어갈 참이면 **정리를 생각합니다** |\n| **70% 넘음** | **지금 정리합니다.** 여기서부터는 결과가 눈에 띄게 나빠집니다 |"}, {"title": "③ 접기와 비우기 — 둘은 다릅니다", "md": "| | 접기 `/compact` | 비우기 `/clear` |\n|---|---|---|\n| **무엇을 하나** | 지금까지를 **요약해서** 유지 | **통째로 지우고** 처음부터 |\n| **언제** | **같은 일**을 계속할 때 | **다른 일**로 넘어갈 때 |\n| **남는 것** | 요약 + 지침 파일 | 지침 파일 |\n\n**헷갈리면 비우기가 안전합니다.** 잃을 게 없으면 비우는 쪽이 맞습니다.\n3절에서 본 대로, **접히기 직전 원본이 자동 백업되는 훅**이 있으면 접는 것도 무섭지 않습니다."}, {"title": "④ 진짜 답 — 남길 것은 대화가 아니라 문서다", "md": "접기와 비우기는 응급처치입니다. 근본 방법은 이것입니다.\n\n1. **큰 일은 대화가 아니라 문서에 적는다** — 지금 뭘 하는 중이고, 어디까지 했고, 다음이 뭔지\n2. **자리가 줄면 그 문서를 갱신한다** — 대화에 있는 것을 문서로 옮긴다\n3. **비우고, 다음 세션에서 이렇게 말한다**\n\n```\n진행 중인 것 이어서 해줘.\n```\n\n문서에 상태가 적혀 있으면 이 한 줄로 이어집니다.\n**대화를 아끼려 하지 말고, 대화를 버려도 되게 만듭니다.**"}, {"title": "⑤ 큰 읽기는 딴 데 맡긴다", "md": "자료 스무 개를 읽어야 할 때, 메인 대화에서 읽으면 **책상이 그 자료로 덮입니다.**\n읽은 내용은 대부분 쓸모없고 **결론만** 필요한데도요.\n\n이럴 때 **서브에이전트**에게 맡깁니다. 그쪽이 딴 방에서 다 읽고 **결론만 가져옵니다.**\n메인 대화에는 결론 몇 줄만 남습니다. 책상이 깨끗하게 유지됩니다.\n\n```\n자료 폴더 전체를 읽어야 하는데, 서브에이전트에게 맡겨서 결론만 가져와줘.\n원문은 여기 붙이지 말고, 요약 10줄과 출처 목록만 보여줘.\n```\n\n**한 작업 = 한 대화**를 지키면 이 문제 대부분이 애초에 안 생깁니다.\n*\"문서도 봐주고, 코드도 짜고, 디자인도 보고, 결제도 붙여줘\"*를 한 대화에 넣으면 전부 어중간하게 끝납니다."}, {"title": "📘 말 풀이", "md": "**컨텍스트(context)**\nAI가 **한 번에 들고 있을 수 있는 기억의 크기.** 책상 넓이입니다. 지침·읽은 파일·주고받은 대화가 전부 여기 올라갑니다. 대화가 끝나면 **비워집니다.**\n\n**토큰(token)**\n그 기억을 **세는 단위.** 글자보다 조금 큰 덩어리라고 보면 됩니다. 한국어는 대략 한두 글자가 한 덩어리입니다. *\"토큰을 아낀다\"*는 말은 **책상 자리를 아낀다**는 뜻입니다.\n\n**서브에이전트(subagent)**\n**따로 떨어져 나가 일하는 분신.** 큰 조사를 대신 하고 **결론만** 가져옵니다. 읽은 원문은 그쪽 방에 두고 오기 때문에 메인 대화가 깨끗하게 유지됩니다."}, {"title": "⚠️ 함정", "md": "- **끝까지 버팁니다.** 90%에서 나온 결과를 믿고 코드를 짜면, 나중에 그 부분부터 무너집니다. 70%에서 정리합니다.\n- **대화 자체를 기록으로 여깁니다.** 대화는 사라집니다. **문서에 옮긴 것만 남습니다.**\n- **접기와 비우기를 반대로 씁니다.** 같은 일을 계속하는데 비우면 문맥을 다시 설명하고, 다른 일로 넘어가는데 접으면 앞의 일이 계속 끼어듭니다.\n- **한 대화에 여러 일을 다 넣습니다.** 가장 흔하고 가장 비쌉니다.\n- **큰 자료를 메인 대화에 통째로 붙입니다.** 붙이는 순간 자리의 절반이 날아갑니다.\n- **비우기 전에 저장을 안 합니다.** 비우기 전에 **결과물을 먼저 저장**합니다."}, {"title": "⚡ 따라 하기", "md": "1. **지금 얼마나 찼는지** 화면에서 확인하는 자리를 찾아 둡니다. 남은 자리 표시가 어디 뜨는지 눈에 익힙니다.\n\n2. **끝내는 의식**을 정합니다. 한 작업이 끝날 때마다 매번 같은 순서로.\n\n```\n① 결과물 저장하기\n② 배운 게 있으면 지침 파일 「실제로 망가진 것」에 한 줄 추가\n③ 진행 상태를 문서에 적기\n④ /clear\n```\n\n3. 상태 문서를 만듭니다.\n\n```\ndocs/진행중.md 를 만들어줘. 아래 세 칸만.\n- 지금 하는 일 (한 줄)\n- 어디까지 했나 (목록)\n- 다음에 할 것 (목록)\n지금 이 대화에서 한 것을 기준으로 채워줘.\n```\n\n4. **비우고 이어 봅니다.** `/clear` 후 새 대화에서:\n\n```\ndocs/진행중.md 읽고 진행 중인 것 이어서 해줘.\n```"}, {"title": "✅ 확인", "md": "- [ ] 남은 자리(%)가 **화면 어디에 뜨는지** 아나\n- [ ] **70%**라는 숫자를 말할 수 있나\n- [ ] 접기와 비우기를 **언제 각각 쓰는지** 한 줄로 말할 수 있나\n- [ ] `docs/진행중.md`가 **실제로 생겼나**\n- [ ] 비운 뒤 **\"이어서 해줘\" 한 줄로 이어졌나**\n- [ ] 큰 읽기를 **서브에이전트에게 맡겨** 봤나\n\n다섯 번째가 «아니오»면 상태 문서가 부실한 것입니다. 대화가 아니라 **문서**를 고칩니다."}, {"title": "🔎 더 깊이", "md": "- 접히기 직전 **대화를 자동 백업하는 훅**은 이 스테이지 3절에 있습니다.\n- 큰 일을 **어떤 순서로 쪼갤 것인가**는 <a class=\"xref\" href=\"#5\">Stage 5<\/a>에서 실제 기능으로 해 봅니다.\n- 검색해 볼 말 — `context window`, `compact conversation`, `subagent`"}]}, {"file": "7-한바퀴.md", "id": "s3-7", "no": "7", "title": "실제로 이렇게 됩니다 — 하네스 한 바퀴", "goals": ["지침·문서·스킬·훅을 한 작업에서 맞물려 돌릴 수 있다", "결과가 어긋났을 때 어느 절로 돌아갈지 찾을 수 있다"], "steps": ["작은 일 하나로 돌려 봅니다", "어긋났을 때 어디로 가나", "THE CHAIN"], "through": "앞의 여섯 절에서 만든 것을 한 작업에서 실제로 맞물려 돌려 본다.", "time": "50분", "need": ["1~6절의 결과물 전부"], "head": "여기까지 문서·지침·훅·스킬을 따로따로 만들었습니다.\n**따로 있으면 아무 일도 안 일어납니다.** 한 번 돌려 봐야 내 것이 됩니다.\n\n이 절은 새로 배우는 절이 아니라 **이어서 돌려 보는 절**입니다.\n한 바퀴를 돌고 나면 <a class=\"xref\" href=\"#5\">Stage 5<\/a>의 모든 작업이 이 위에서 돕니다.", "secs": [{"title": "① 작은 일 하나로 돌려 봅니다", "md": "예로 삼는 일 — **「소개 문구를 화면에 넣기」** 정도의 작은 것.\n큰 일로 연습하면 어디서 뭐가 걸렸는지 안 보입니다.\n\n| 순서 | 일어나는 일 | 어느 층이 일하나 |\n|---|---|---|\n| **1** | 대화를 열자 **가지 이름과 바뀐 파일**이 저절로 뜬다 | **훅** (세션 시작) |\n| **2** | 설명 없이 시켰는데 **이 프로젝트가 뭔지 이미 안다** | **지침** (1절) |\n| **3** | 화면 규칙이 필요하자 **문서를 알아서 열어 읽는다** | **문서** (Stage 2) |\n| **4** | 일을 **단계로 쪼갠 목록**을 먼저 보여주고 멈춘다 | **실행 엔진** (2절) |\n| **5** | 내가 승인하면 한 단계씩 진행하고 **끝날 때마다 저장**한다 | **실행 엔진** |\n| **6** | 손대면 안 되는 폴더를 만지려다 **막힌다** | **훅** (도구 쓰기 직전) |\n| **7** | 판단이 필요한 지점에서 **추측하지 않고 물어본다** | **지침 + 실행 엔진** |\n| **8** | *\"올려도 돼?\"라고 했더니 **발행 전 점검이 저절로 펴진다*** | **스킬** (5절) |\n| **9** | 자리가 70%를 넘자 **상태를 문서에 적고 비운다** | **컨텍스트 관리** (6절) |\n| **10** | 새 대화에서 **\"이어서 해줘\"** 한 줄로 이어진다 | **문서 + 지침** |\n\n**한 번에 다 되지 않습니다.** 처음 돌리면 대개 4번이나 6번에서 어긋납니다.\n어긋난 자리가 곧 **아직 안 채운 층**입니다. 그 절로 돌아가면 됩니다."}, {"title": "② 어긋났을 때 어디로 가나", "md": "| 이런 증상 | 원인 | 돌아갈 절 |\n|---|---|---|\n| 새 대화에서 프로젝트를 모른다 | 지침이 없거나 엉뚱한 자리에 있다 | **1절** |\n| 지침은 있는데 문서를 안 읽는다 | 지침에 **문서 경로**가 없다 | **1절** |\n| 계획 없이 바로 만들기 시작한다 | 실행 엔진 규칙을 안 적었다 | **2절** |\n| 막아야 할 것을 그냥 한다 | 지시문에만 적고 훅을 안 걸었다 | **3절** |\n| 백업 도구가 아무것도 모른다 | 지침 파일이 이어져 있지 않다 | **4절** |\n| 스킬이 안 불려 나온다 | **설명문**에 «언제 쓰나»가 없다 | **5절** |\n| 길어지니 앞에서 정한 걸 뒤집는다 | 70%를 넘겼다 | **6절** |"}, {"title": "⚠️ 여기까지 하면 앞서갑니다 — 실측 근거", "md": "저장소를 대량으로 조사한 결과가 있습니다.\n**대부분은 지침 파일 하나만 쓰고, 스킬과 서브에이전트는 거의 쓰지 않습니다.**\n\n즉 세상 대부분이 **하네스 2층에서 멈춰 있습니다.**\n이 장을 끝까지 한 사람은 1층부터 4층까지 다 채운 것입니다.\n\n이건 재능 차이가 아닙니다. **틀을 짠 사람과 말만 한 사람의 차이**입니다.\n그리고 틀은 한 번 짜면 **다음 프로젝트에 그대로 가져갑니다.**"}, {"title": "③ THE CHAIN — 이 장이 앞뒤로 이어지는 자리", "md": "| 어디서 왔나 | 여기서 무엇이 되나 | 어디로 가나 |\n|---|---|---|\n| <a class=\"xref\" href=\"#2\">Stage 2<\/a>의 요구사항·구조·결정 기록 | **하네스 1층** — AI가 매번 읽는 재료 | — |\n| — | **지침 파일** (1·4절) | <a class=\"xref\" href=\"#4\">Stage 4<\/a>의 **디자인 규칙을 담는 그릇**이 됩니다 |\n| — | **훅·스킬·컨텍스트 규칙** | <a class=\"xref\" href=\"#5\">Stage 5<\/a>의 **모든 작업이 이 위에서** 돕니다 |\n| — | **작업이 끝날 때 거는 검사** (3절, 아직 빈 자리) | <a class=\"xref\" href=\"#7\">Stage 7<\/a>에서 테스트를 만든 뒤 채웁니다 |\n\n**여기가 끊기면 뒤가 전부 헐거워집니다.** 그래서 이 장이 여정의 허리입니다."}, {"title": "📘 말 풀이", "md": "**저장 지점**\n작업 한 덩어리가 끝났을 때 **지금 상태를 통째로 찍어 두는 것.** 잘못되면 여기로 돌아옵니다. 만드는 법은 <a class=\"xref\" href=\"#4.5\">Stage 4.5<\/a>에서 제대로 다룹니다. 여기서는 *\"단계가 끝나면 찍는다\"*만 기억하면 됩니다.\n\n**회고**\n한 바퀴가 끝난 뒤 **무엇이 잘됐고 무엇이 걸렸는지 한 줄로 남기는 것.** 이 한 줄이 지침 파일의 「실제로 망가진 것」 칸을 채웁니다."}, {"title": "⚠️ 함정", "md": "- **큰 일로 첫 바퀴를 돕니다.** 어디서 어긋났는지 안 보입니다. **30분짜리 일**로 돕니다.\n- **어긋난 걸 그때그때 말로 때웁니다.** 그러면 다음 바퀴에서 **또** 어긋납니다. 말로 고치지 말고 **층을 고칩니다.**\n- **한 바퀴 돌고 끝냅니다.** 두 번째 바퀴가 진짜입니다. 첫 바퀴에서 고친 것이 실제로 먹혔는지는 두 번째에 드러납니다.\n- **회고를 안 남깁니다.** 남기지 않으면 반년 뒤 같은 자리에서 같은 실수를 합니다.\n- **완벽하게 만들고 시작하려 합니다.** 4층이 다 안 차 있어도 돕니다. **돌리면서 채웁니다.**"}, {"title": "⚡ 따라 하기", "md": "1. **30분짜리 일 하나**를 고릅니다. 그리고 새 대화를 열어 아래를 붙여넣습니다.\n\n```\n[작은 일 하나]를 해줘. 아래 순서를 지켜줘.\n\n1) 시작 전에 — 이 프로젝트가 뭔지, 내가 정한 규칙이 뭔지, 관련 문서가 어디 있는지\n   네가 아는 대로 먼저 세 줄로 말해줘 (내가 설명하지 않을 거야)\n2) 그다음 이 일을 3~5단계로 쪼갠 목록을 보여주고 멈춰. 내 승인을 기다려줘\n3) 승인하면 한 단계씩 진행하고, 끝날 때마다 한 줄로 보고하고 저장해줘\n4) 오류가 나면 멈추고 보여줘. 판단이 필요하면 추측하지 말고 물어봐\n5) 다 끝나면 \"올려도 돼?\"라고 물을 테니 점검을 돌려줘\n```\n\n2. 1번 답이 **틀리면 거기서 멈춥니다.** 지침이 안 읽힌 것입니다 → 1절로.\n\n3. 다 끝나면 **회고 한 줄**을 지침에 넣습니다.\n\n```\n방금 작업에서 걸렸던 것 한 가지를 CLAUDE.md의 \"실제로 망가진 것\"에 한 줄로 추가해줘.\n일반론 말고, 방금 실제로 일어난 일로.\n```\n\n4. **두 번째 바퀴**를 돕니다. 다른 작은 일 하나로 1~3을 반복합니다."}, {"title": "✅ 확인", "md": "- [ ] 1번에서 **내가 설명하지 않았는데** 프로젝트를 제대로 말했나\n- [ ] **계획 목록이 먼저 나오고 멈췄나**\n- [ ] 단계마다 **보고와 저장이 있었나**\n- [ ] **훅이 도는 것을 이 바퀴 안에서 봤나** (막힘 또는 시작 화면)\n- [ ] **스킬이 저절로 불려 나왔나**\n- [ ] 지침 파일에 **회고 한 줄이 늘었나**\n- [ ] **두 번째 바퀴**를 돌아 봤나\n\n전부 «예»면 Stage 3은 끝났습니다.\n하나라도 «아니오»면 위 표에서 해당 절로 돌아갑니다. **한 절만 다시 보면 됩니다.**"}, {"title": "🔎 더 깊이", "md": "- 이 하네스 위에서 **실제 기능 하나**를 끝까지 만드는 것이 <a class=\"xref\" href=\"#5\">Stage 5<\/a>입니다.\n- 단계를 **어떤 순서로 돌 것인가**를 더 정교하게 만드는 이야기(사람이 안 봐도 도는 구조)는 <a class=\"xref\" href=\"#8\">Stage 8<\/a>입니다. 하네스와는 **층이 다릅니다.**\n- 검색해 볼 말 — `agentic workflow`, `spec driven development`, `plan then execute`"}]}]}, {"folder": "04-디자인", "key": "4", "name": "디자인", "color": "#f472b6", "sub": "감각이 아니라 규칙", "goal": "감각이 아니라 규칙으로 만들고 AI 티를 지운다", "makes": "규칙표 · 랜딩 시안과 코드 · 카드뉴스 템플릿 · 캐릭터 참조", "time": "5~6시간", "need": ["피그마 계정", "캔바 계정", "어도비 계정"], "head": "**재능이 없는 게 아니라 규칙을 모르는 것입니다.**\n간격·대비·위계는 전부 숫자로 정해져 있습니다. 숫자를 알면 비개발자도 안 촌스러운 화면을 만듭니다.", "metasecs": [{"title": "✅ 자가 체크", "md": "- [ ] 색 3개 · 간격 규칙 · 글꼴 1개를 **파일에** 적었나 (머릿속 말고)\n- [ ] 내 화면에서 **「AI 티 나는 다섯」**을 찾아낼 수 있나\n- [ ] 본문 대비를 **재** 봤나 (눈짐작 말고 측정)\n- [ ] 카드뉴스 템플릿 하나로 **다섯 장**을 뽑아 봤나 — 다섯 장이 같은 집 식구처럼 보이나"}, {"title": "다음으로", "md": "여기서 만든 **규칙표**를 Stage 3의 지침 파일에 넣으면, 이후 AI가 만드는 화면이 매번 같은 값을 씁니다."}], "sections": [{"file": "01-숫자.md", "id": "s4-1", "no": "1", "title": "감각 대신 숫자 다섯 잡기", "goals": ["간격·글자·구분점·대비·터치 다섯 숫자를 값으로 말할 수 있다", "내 화면에서 4의 배수가 아닌 간격을 찾아낼 수 있다", "이 다섯을 AI에게 검사 규칙으로 줄 수 있다"], "steps": ["간격을 4의 배수로 맞춘다", "글자 크기를 다섯 단계로 자른다", "구분점을 셋으로 줄인다", "대비와 누를 크기를 잰다"], "through": "간격·대비·글자 크기에는 정해진 숫자가 있다. 외워서 쓰면 된다.", "time": "40분", "need": ["피그마 계정"], "head": "\"디자인 감각이 없다\"는 말은 대부분 **숫자를 모른다**는 뜻입니다. 잘 만든 화면과 어설픈 화면의 차이는 간격·글자 크기·밝기 차이 세 가지고, 전부 외울 수 있는 숫자입니다.", "secs": [{"title": "① 간격을 4의 배수로 맞춘다", "md": "간격을 눈대중으로 정하면 13px, 17px, 22px가 섞입니다. 사람 눈은 몇 px 어긋났는지는 못 읽어도 \"어수선하다\"는 읽습니다. 그래서 **4의 배수만** 씁니다.\n\n| 얼마 | 어디에 |\n|---|---|\n| 4px | 요소 안. 아이콘과 옆 글자 사이, 버튼 안쪽 여백 |\n| 8px | 요소 사이. 버튼과 버튼, 줄과 줄 |\n| 16px | 문단과 문단, 카드 안쪽 여백 |\n| 24px | 작은 묶음과 묶음 사이 |\n| 32px | 화면의 큰 구역과 구역 사이 |\n\n외울 것은 둘입니다 — 안은 4, 사이는 8. 5px·10px·15px는 하나만 섞여도 줄이 어긋나 보입니다."}, {"title": "② 글자 크기를 다섯 단계로 자른다", "md": "글자 크기를 자유롭게 쓰면 12·13·14·15·16·18·20…으로 늘어나고, 어느 것이 중요한지 눈이 판단을 못 합니다. 단계는 **3~5개**면 충분합니다.\n\n- 큰 제목 — 화면당 하나\n- 중간 제목 — 구역 이름\n- 본문 — 대부분의 글\n- 작은 글 — 설명, 날짜\n- 아주 작은 글 — 꼬리표, 각주\n\n여섯 번째가 필요해지면 크기를 늘리지 말고 굵기나 색으로 구분하세요. 같은 크기라도 굵게 하면 앞으로 나오고, 회색으로 하면 뒤로 물러납니다."}, {"title": "③ 구분점을 셋으로 줄인다", "md": "휴대폰과 노트북에서 배치를 바꾸는 기준 픽셀을 구분점이라고 합니다. 흔히 쓰는 값은 640 · 768 · 1024 · 1280 · 1536 다섯입니다.\n\n다섯을 다 쓰면 확인할 화면이 다섯 벌이 되어 혼자서는 감당이 안 됩니다. **셋에서 넷만** 고르세요 — 휴대폰 · 태블릿 · 노트북이면 대부분 끝납니다."}, {"title": "④ 대비와 누를 크기를 잰다", "md": "글자색과 배경색의 밝기 차이를 비율로 잰 것이 대비입니다. 취향이 아니라 **측정되는 값**이고, 연한 회색 글씨는 내 화면에서는 멀쩡해도 남의 화면에서는 안 보입니다.\n\n| 무엇 | 최소 |\n|---|---|\n| 본문 글자 | 4.5 : 1 |\n| 큰 글자 | 3 : 1 |\n| 버튼 테두리·아이콘 | 3 : 1 |\n\n누를 수 있는 것(버튼·링크·체크박스)은 24 × 24px 이상을 차지해야 합니다. 보이는 크기가 아니라 눌리는 범위라서, 아이콘이 작아도 주위 빈 곳까지 눌리게 만들면 됩니다. 재는 법은 7절에서 다룹니다."}, {"title": "⚡ 따라 하기", "md": "1. 메모장에 **내 숫자 다섯 줄**을 적으세요. 3절 규칙표의 재료가 되기 때문입니다. 아래 다섯 줄이 그대로 있으면 됩니다.\n\n```\n간격: 4 · 8 · 16 · 24 · 32 (4의 배수만)\n글자 단계: 5개 (큰제목 / 중제목 / 본문 / 작은글 / 꼬리표)\n구분점: 3개 (휴대폰 / 태블릿 / 노트북)\n본문 대비: 4.5 : 1 이상\n누를 것: 24 × 24 이상\n```\n\n2. 지금 만들고 있는 화면(없으면 자주 쓰는 웹사이트)을 열고 간격이 4의 배수가 아닌 곳을 세 군데 찾으세요. 숫자가 눈에 보이기 시작하는지 확인하는 연습입니다. 세 군데를 적으면 됩니다.\n3. AI에게 아래를 붙여넣어 내 숫자로 화면을 검사시키세요. 눈으로 못 재는 대비까지 표로 받기 위해서입니다. \"어디가 / 지금 값 / 있어야 할 값\" 표가 오면 됩니다.\n\n```\n아래 규칙으로 화면을 점검해줘. 어긴 곳을 표로 만들어주고, 각 줄에 \"어디가 / 지금 값 / 있어야 할 값\"을 적어줘.\n- 간격은 4의 배수만 쓴다 (4, 8, 16, 24, 32)\n- 글자 크기 단계는 5개를 넘지 않는다\n- 본문 글자와 배경의 대비는 4.5:1 이상이다\n- 누를 수 있는 것은 24×24px 이상이다\n고칠 수 있는 곳은 고친 값도 같이 제안해줘. 추측이면 추측이라고 표시해줘.\n```"}, {"title": "✅ 확인", "md": "- [ ] 간격 값을 다섯 개 이하로 적어 두었나\n- [ ] 글자 크기 단계가 다섯 개 이하인가\n- [ ] \"본문 대비는 4.5 대 1\"과 \"누를 것은 24×24\"를 숫자로 말할 수 있나\n- [ ] AI에게서 어긴 곳 표가 돌아왔나\n\n하나라도 «아니오»면 이 절을 다시 봅니다. 여기 숫자가 3절 규칙표의 재료입니다."}, {"title": "📘 말 풀이", "md": "**px(픽셀)** — 화면을 이루는 아주 작은 점 하나의 크기. 16px 글자가 흔히 보는 본문 크기입니다.\n\n**대비(contrast ratio)** — 글자색과 배경색의 밝기 차이를 비율로 잰 숫자. 클수록 잘 읽힙니다.\n\n**구분점(breakpoint)** — \"화면 너비가 여기부터는 배치를 바꾼다\"고 정해 두는 기준 픽셀 값."}, {"title": "⚠️ 함정", "md": "**간격을 \"보기 좋을 때까지\" 밀어 봅니다.** 그러면 매번 값이 달라집니다. 값을 먼저 정하고 그중에서만 고릅니다.\n\n**글자 크기를 1px씩 조절합니다.** 15px와 16px의 차이는 아무도 못 알아봅니다. 단계를 못 만들고 종류만 늘립니다.\n\n**연한 회색이 세련돼 보인다고 믿습니다.** 내 화면이 밝고 내 눈이 좋을 뿐입니다. 대비는 재는 값입니다.\n\n**아이콘 버튼을 아이콘 크기 그대로 만듭니다.** 휴대폰에서 안 눌립니다."}, {"title": "🔎 더 깊이", "md": "- 대비·터치 크기 숫자의 출처는 국제 웹 접근성 지침(WCAG)입니다. 7절에서 재는 법과 함께 다룹니다.\n- 검색해 볼 말 — `WCAG contrast minimum`, `spacing scale 4px`, `type scale`\n- 이 숫자들을 파일로 굳히는 법은 이 스테이지 3절 「규칙표」에서."}]}, {"file": "02-티나는다섯.md", "id": "s4-2", "no": "2", "title": "티 나는 다섯을 찾아내기", "goals": ["비개발자 화면이 걸리는 다섯 자리를 이름으로 말할 수 있다", "내 화면에서 그중 하나를 찾아 고칠 수 있다", "눈을 가늘게 떠서 위계가 있는지 판정할 수 있다"], "steps": ["간격을 맞춘다", "정렬선을 정한다", "글꼴을 하나로 줄인다", "색을 셋으로 줄인다", "위계를 확인한다"], "through": "못 만든 화면은 다섯 군데에서 똑같이 걸린다.", "time": "30분", "need": [], "head": "내가 만든 화면이 \"뭔가 어설픈데 뭐가 문제인지 모르겠다\"고 느껴질 때, 그 \"뭔가\"는 거의 항상 같은 다섯 군데입니다. 이름을 붙여 두면 눈에 보이고, 눈에 보이면 AI에게 **\"이 다섯을 고쳐\"**라고 시킬 수 있습니다.", "secs": [{"title": "① 간격을 맞춘다", "md": "가장 흔하고 가장 눈에 띕니다. 제목 아래는 12px, 문단 아래는 19px, 카드 안은 15px면 읽는 사람은 어디까지가 한 덩어리인지 판단을 못 합니다.\n\n간격은 **거리로 의미를 만드는 장치**입니다. 가까이 있으면 한 식구, 멀리 있으면 남남입니다. 1절의 4의 배수 다섯 값 안에서만 고르세요."}, {"title": "② 정렬선을 정한다", "md": "글은 왼쪽 정렬인데 버튼만 살짝 안쪽에 있고, 카드 세 개의 제목 시작점이 1~2픽셀씩 어긋난 경우입니다. 사람 눈은 선을 아주 잘 찾아내서, 어긋난 선은 계속 거슬립니다.\n\n화면 안에 **세로선을 몇 개 쓸지** 정하세요. 보통 왼쪽 시작선 하나, 오른쪽 끝선 하나면 되고, 모든 글·버튼·이미지가 그 선에서 시작하고 끝나게 합니다. 가운데 정렬은 짧은 제목 한두 줄에만 씁니다."}, {"title": "③ 글꼴을 하나로 줄인다", "md": "\"제목은 이 글꼴, 버튼은 저 글꼴\" 하다 보면 한 화면에 글꼴이 셋 들어갑니다. 많으면 화려한 게 아니라 아마추어처럼 보입니다.\n\n**글꼴은 하나**, 정말 필요하면 둘까지입니다. 같은 글꼴 안에서 굵기 두세 개와 1절의 크기 단계로 차이를 만드세요."}, {"title": "④ 색을 셋으로 줄인다", "md": "\"강조하고 싶은 게 많아서\" 빨강·파랑·초록·주황이 한 화면에 들어가면 강조가 하나도 안 됩니다. 화면의 90%는 무채색이고, 색은 **아껴 쓸 때만** 힘이 생깁니다.\n\n| 무엇 | 몇 개 | 어디에 |\n|---|---|---|\n| 주색 | 1개 | 브랜드를 대표하는 색. 가장 중요한 버튼, 링크 |\n| 강조색 | 1개 | 주의·경고·성공처럼 \"여기 봐야 한다\"에만 |\n| 무채색 | 밝기별 3~5개 | 글자·배경·테두리·선 |\n\n색을 다 적어 보고 주색 하나, 강조 하나만 남기세요. 나머지는 회색 계열로 바꿉니다."}, {"title": "⑤ 위계를 확인한다", "md": "전부 같은 크기, 같은 굵기, 같은 색이면 읽는 사람은 어디부터 봐야 할지 몰라 그냥 나갑니다. 화면 하나에는 **가장 중요한 것 하나**가 있어야 하고, 나머지는 그보다 작거나 연해야 합니다.\n\n눈을 가늘게 뜨고 화면을 보세요. 흐릿한 상태에서도 가장 먼저 보이는 것이 의도한 것이면 위계가 잡힌 것이고, 아무것도 튀어나오지 않으면 위계가 없는 것입니다."}, {"title": "⚡ 따라 하기", "md": "1. 지금 화면(또는 참고하려는 사이트)을 열고 **다섯 개를 순서대로 하나씩** 보세요. 한 번에 다 보면 아무것도 안 보이기 때문입니다. 항목마다 \"괜찮음 / 문제\"를 적으면 됩니다.\n2. 눈을 가늘게 뜨고 가장 먼저 튀어나오는 것을 적으세요. 위계가 있는지 보는 가장 빠른 방법입니다. 의도한 것과 같은지 대조하면 됩니다.\n3. AI에게 아래를 붙여넣으세요. 내가 놓친 자리를 위치와 값으로 받기 위해서입니다. 마지막에 \"가장 먼저 고칠 것 하나\"가 오면 됩니다.\n\n```\n내 화면을 아래 다섯 항목으로 점검해줘. 항목마다 \"괜찮음 / 문제 있음\"으로 판정하고,\n문제면 어디가 문제인지 구체적인 위치와 값을 적어줘.\n\n1. 간격이 제각각인가 (4의 배수만 쓰고 있나)\n2. 정렬이 어긋난 곳이 있나 (왼쪽 시작선이 하나로 맞는가)\n3. 글꼴 종류와 글자 크기 종류가 몇 개인가 (글꼴 1개, 크기 5단계 이하가 목표)\n4. 색이 몇 개인가 (주색 1 + 강조 1 + 무채색이 목표)\n5. 이 화면에서 가장 먼저 눈에 들어와야 하는 것 하나는 무엇인가. 지금 그게 가장 두드러지나\n\n마지막에 \"가장 먼저 고칠 것 하나\"를 골라줘.\n```\n\n4. AI가 고른 **하나만** 고치세요. 다섯을 한꺼번에 고치면 어디가 나아졌는지 모르기 때문입니다. 고친 뒤 다시 1번부터 봅니다."}, {"title": "✅ 확인", "md": "- [ ] 다섯 개의 이름을 보지 않고 말할 수 있나\n- [ ] 내 화면에서 간격이 어긋난 곳을 한 군데라도 찾아냈나\n- [ ] 내 화면의 색을 세어 봤고, 주색 1 + 강조 1로 줄일 수 있나\n- [ ] 눈을 가늘게 떴을 때 가장 먼저 보이는 것이 내가 의도한 것인가"}, {"title": "📘 말 풀이", "md": "**위계(hierarchy)** — \"무엇을 먼저 보게 할 것인가\"의 순서. 크기·굵기·색·위치로 만듭니다.\n\n**무채색(neutral)** — 검정·흰색·회색처럼 색기가 없는 색. 화면 대부분을 여기서 채웁니다."}, {"title": "⚠️ 함정", "md": "**다섯 개를 한꺼번에 고치려 합니다.** 순서가 있습니다 — 간격 → 정렬 → 글꼴 → 색 → 위계. 앞의 둘만 고쳐도 절반이 해결됩니다.\n\n**\"색을 줄이면 심심해 보인다\"고 되돌립니다.** 심심한 게 아니라 정돈된 것입니다. 심심함은 위계로 푸는 것이지 색으로 푸는 게 아닙니다.\n\n**가운데 정렬로 전부 맞춥니다.** 가운데 정렬은 왼쪽 시작선을 없애 버립니다. 긴 글에는 쓰지 않습니다.\n\n**AI가 만든 첫 화면을 그대로 씁니다.** AI는 이 다섯을 알아서 지키지 않습니다. 시켜야 지킵니다."}, {"title": "🔎 더 깊이", "md": "- 여기서 고친 것을 값으로 굳히는 곳이 다음 절 「규칙표」입니다.\n- 이 다섯을 다 지켰는데도 어딘가 \"AI가 만든 것 같다\"면 4절 「안티슬롭」으로 갑니다.\n- 검색해 볼 말 — `visual hierarchy`, `alignment grid`, `60 30 10 color rule`"}]}, {"file": "03-규칙표.md", "id": "s4-3", "no": "3", "title": "규칙표를 파일에 적기", "goals": ["색·간격·글자를 역할 이름으로 파일 한 곳에 적을 수 있다", "규칙표를 지침 파일과 피그마 변수에 같은 이름으로 둘 수 있다", "AI가 규칙표를 실제로 읽는지 확인할 수 있다"], "steps": ["색을 이름으로 저장한다", "세 종류만 정한다", "두 곳에 같은 값을 둔다", "본보기를 채운다"], "through": "AI는 내 브랜드 색을 모른다. 파일에 적어야 매번 같은 값을 쓴다.", "time": "50분", "need": ["피그마 계정", "Stage 3의 지침 파일"], "head": "AI에게 화면을 만들어 달라고 하면 매번 색과 간격이 다릅니다 — AI는 내 브랜드 값을 모르고, 새 대화를 열면 어제 말한 것은 사라지기 때문입니다. 그래서 파일에 적고, 그 파일을 <a class=\"xref\" href=\"#3\">Stage 3<\/a>의 지침 파일 안에 넣습니다 — 여기가 이 커리큘럼의 **연결 지점**입니다.", "secs": [{"title": "① 색을 이름으로 저장한다", "md": "가장 흔한 실수는 `버튼 색: #0057FF`처럼 값을 바로 적는 것입니다. 파랑을 바꾸고 싶을 때 `#0057FF`가 박힌 곳을 전부 찾아야 하고, AI에게 \"파랑 말고\"라고 해도 어디까지가 그 파랑인지 모릅니다.\n\n이름을 붙이면 달라집니다.\n\n```\n주색 = #0057FF\n주색-누를때 = #0043CC\n글자-기본 = #1C1B19\n글자-흐림 = #6B675F\n배경 = #FBFAF8\n선 = #E3DFD7\n```\n\n화면에서는 `#0057FF` 대신 `주색`이라고 쓰세요. 나중에 주색 한 줄만 바꾸면 화면 전체가 같이 바뀝니다. 실무에서는 이것을 디자인 토큰이라고 부르지만, 중요한 건 **값이 한곳에만 있다**는 것입니다."}, {"title": "② 세 종류만 정한다", "md": "세 종류면 충분하고, 더 넣으면 관리가 안 됩니다.\n\n| 종류 | 몇 개 | 예 |\n|---|---|---|\n| 색 | 주색 1 · 강조 1 · 무채색 4~5 | `주색` `강조` `글자-기본` `글자-흐림` `배경` `선` |\n| 간격 | 5개 | `간격-1`=4 · `간격-2`=8 · `간격-3`=16 · `간격-4`=24 · `간격-5`=32 |\n| 글자 | 글꼴 1 · 크기 3~5단계 | `글꼴`=Pretendard · `큰제목` `중제목` `본문` `작은글` |\n\n필요하면 **모서리 둥글기** 둘(`둥글기-작게` `둥글기-크게`)만 더 붙입니다."}, {"title": "③ 두 곳에 같은 값을 둔다", "md": "| 어디 | 무엇을 위해 |\n|---|---|\n| 피그마 | 사람이 눈으로 보고 고르기 위해. 변수로 등록하면 화면을 그릴 때 목록에서 고릅니다 |\n| 지침 파일(Stage 3) | AI가 읽기 위해. 코드를 만들 때 AI가 매번 이 값을 씁니다 |\n\n둘 중 하나만 고르라면 **지침 파일이 먼저**입니다. 피그마에만 있는 값은 AI가 못 읽습니다. 고칠 때는 지침 파일을 먼저 고치고 피그마를 따라 맞춥니다 — 값의 집은 한 곳입니다."}, {"title": "④ 본보기를 채운다", "md": "아래를 그대로 복사해 값만 내 것으로 바꾸면 됩니다.\n\n```markdown\n[디자인 규칙] 이 파일이 정본이다. 여기 없는 값은 쓰지 않는다.\n\n[색]\n| 이름 | 값 | 어디에 |\n|---|---|---|\n| 주색 | #0057FF | 가장 중요한 버튼, 링크 |\n| 주색-누를때 | #0043CC | 위 버튼을 누르는 순간 |\n| 강조 | #D9480F | 경고·주의. 화면당 한 번을 넘기지 않는다 |\n| 글자-기본 | #1C1B19 | 본문 |\n| 글자-흐림 | #6B675F | 설명, 날짜 |\n| 배경 | #FBFAF8 | 화면 바탕 |\n| 선 | #E3DFD7 | 테두리, 구분선 |\n\n[간격] 4의 배수만\n4 / 8 / 16 / 24 / 32 — 이 다섯 외의 값은 쓰지 않는다.\n요소 안은 4, 요소 사이는 8부터.\n\n[글자]\n글꼴: Pretendard 하나만. 굵기는 보통과 굵게 둘.\n크기 단계: 큰제목 / 중제목 / 본문 / 작은글 — 네 개까지.\n\n[지켜야 할 최소선]\n- 본문 글자 대비 4.5:1 이상, 큰 글자 3:1 이상\n- 누를 수 있는 것은 24×24px 이상\n- 화면 크기 구분점은 3개만 쓴다\n\n[하지 말 것]\n- 위 목록에 없는 색을 새로 만들지 않는다\n- 그라디언트를 쓰지 않는다\n- 글꼴을 추가하지 않는다\n```\n\n「하지 말 것」이 있어야 AI가 흔한 것을 멋대로 넣지 않습니다. 4절에서 다섯 줄이 더 붙습니다."}, {"title": "⚡ 따라 하기", "md": "1. 위 본보기를 복사해 **<a class=\"xref\" href=\"#3\">Stage 3<\/a> 지침 파일 맨 아래**에 붙이세요. 파일에 있어야 AI가 매번 읽기 때문입니다. 지침 파일 끝에 「디자인 규칙」 덩어리가 보이면 됩니다.\n2. 색 값 일곱 개를 내 것으로 바꾸세요. 아직 브랜드 색이 없으면 아무 파랑 하나로 시작해도 됩니다 — 나중에 한 줄만 고치면 되기 때문입니다.\n3. 피그마를 열고 같은 값을 변수로 등록하세요. 이름은 지침 파일과 똑같이 씁니다 — 이름이 다르면 두 곳이 어긋납니다. 색을 고를 때 색상판 대신 이름 목록이 뜨면 됩니다.\n4. AI에게 아래를 붙여넣어 규칙이 실제로 읽히는지 확인하세요. 답에 내가 적은 값이 그대로 나와야 합니다.\n\n```\n지침 파일의 「디자인 규칙」 절만 읽고, 아래를 답해줘.\n1. 내가 정한 주색과 강조색을 값으로 알려줘\n2. 내가 쓸 수 있는 간격 값을 전부 나열해줘\n3. 내가 금지한 것을 나열해줘\n그다음, 이 규칙만 써서 버튼 하나와 카드 하나를 만들어줘.\n규칙에 없는 값을 쓰게 되면 만들지 말고 \"규칙에 없다\"고 말해줘.\n```\n\n5. 마지막 줄을 보세요. AI가 \"규칙에 없다\"고 말하면 규칙표가 실제로 작동하는 것입니다.\n\n### 이렇게 해 봤습니다 — 2026-09-09\n\n피그마에 빈 파일을 만들고 규칙표를 변수 7개로 넣어 봤습니다 — 색 3개(주색·강조·글자)와 간격 4개(안 4 · 사이 8 · 구역 24 · 큰 32). 그 변수에 묶은 히어로 화면 하나를 만들고 코드로 다시 받았더니, **변수 이름이 한글 그대로** 코드에 나왔습니다.\n\n```\nbackground: var(--색/주색, #1f7a5c)\ngap:        var(--간격/구역, 24px)\n```\n\n하나가 걸렸습니다. 글자 색은 변수로 안 묶었더니 코드에 `white`로 박혀 나왔습니다. 묶은 것만 변수로 나오고 안 묶은 것은 그냥 값으로 나오니, 규칙표는 만드는 것으로 끝이 아니라 화면의 모든 색·간격을 거기에 묶어야 값을 합니다."}, {"title": "✅ 확인", "md": "- [ ] 색 · 간격 · 글꼴이 머릿속이 아니라 Stage 3의 지침 파일 안에 있나\n- [ ] 색 이름이 역할 이름인가 (`주색`이지 `파랑`이 아닌가)\n- [ ] 「하지 말 것」 줄이 적어도 세 개 있나\n- [ ] AI에게 물었을 때 내가 적은 값 그대로 답이 돌아왔나\n\n하나라도 «아니오»면 이 절을 다시 봅니다. 이 표가 없으면 뒤의 모든 절이 매번 흔들립니다."}, {"title": "📘 말 풀이", "md": "**디자인 토큰(design token)** — 색·간격·글자 크기 같은 값에 이름을 붙여 한곳에 모아 둔 목록. \"값의 사전\"입니다.\n\n**변수(variable)** — 피그마에서 값에 이름을 붙여 등록해 두는 기능. 색을 고를 때 색상판이 아니라 이름 목록에서 고르게 됩니다."}, {"title": "⚠️ 함정", "md": "**머릿속에만 두고 매번 말로 알려줍니다.** 새 대화를 열면 사라집니다. 파일에 없으면 없는 것입니다.\n\n**색을 열두 개 만듭니다.** 많을수록 안 지켜집니다. 일곱 개 안쪽으로 시작하고, 모자라면 그때 늘립니다.\n\n**이름을 색깔로 짓습니다.** `파랑`이라고 지으면 나중에 초록으로 바꿀 때 `파랑 = 초록`이라는 이상한 줄이 남습니다. 역할로 짓습니다 — `주색` `강조` `글자-흐림`.\n\n**피그마에만 등록합니다.** AI는 못 읽습니다. 지침 파일이 먼저입니다."}, {"title": "🔎 더 깊이", "md": "- 이 규칙표는 <a class=\"xref\" href=\"#5\">Stage 5<\/a>에서 코드를 만들 때 그대로 쓰입니다. 여기가 THE CHAIN의 연결 고리입니다.\n- 검색해 볼 말 — `design tokens`, `Figma variables`, `semantic color naming`\n- 규칙을 어겼을 때 자동으로 막는 방법(훅)은 <a class=\"xref\" href=\"#3\">Stage 3<\/a>에."}]}, {"file": "04-안티슬롭.md", "id": "s4-4", "no": "4", "title": "AI 지문 다섯 지우기", "goals": ["AI가 남기는 지문 다섯을 이름으로 지목할 수 있다", "말로 되는 것과 그림으로 보여줘야 하는 것을 가를 수 있다", "화면에서 튀어야 할 자리 하나를 정할 수 있다"], "steps": ["지문 다섯을 알아본다", "말로 되는 것과 안 되는 것을 가른다", "한 군데만 튀게 정한다"], "through": "AI가 만든 화면에는 반복되는 다섯 가지 특징이 있다. 알면 지울 수 있다.", "time": "40분", "need": ["3절의 규칙표"], "head": "AI에게 화면을 맡기면 못생기지는 않았는데 어디서 본 것 같고, 기억에 남지 않습니다. 이것을 슬롭(slop)이라고 부르는데, 핵심은 **못생긴 게 아니라 선택이 아닌 것**이라는 점입니다 — 2절이 내 손의 티를 지웠다면 이 절은 AI의 지문을 지웁니다.", "secs": [{"title": "① 지문 다섯을 알아본다", "md": "AI가 화면을 만들 때 거의 항상 나오는 다섯입니다. 하나만 있어도 눈치챕니다.\n\n| 지문 | 고치는 법 |\n|---|---|\n| 파랑→보라 그라디언트 | 그라디언트를 아예 금지합니다. 색은 한 가지로 단단하게 |\n| 같은 영문 기본 글꼴 도배 | 글꼴을 내가 고른 것으로 지정합니다. 한글이면 Pretendard가 무난한 출발점 |\n| 아이콘 + 제목 + 두 줄 설명 카드 세 개 | 개수를 바꾸거나(둘·다섯) 세로 목록으로. 아이콘 대신 숫자나 실제 화면 |\n| 유리 질감(반투명·흐림) | 반투명·흐림 효과를 금지합니다. 배경은 단색, 경계는 선 하나 |\n| 가운데 정렬 히어로 | 왼쪽 정렬로 바꿉니다. 그것만으로 인상이 달라지고 읽기도 쉽습니다 |\n\n글꼴은 여전히 하나지만, **\"AI가 고른 하나\"와 \"내가 고른 하나\"는 다릅니다.**"}, {"title": "② 말로 되는 것과 안 되는 것을 가른다", "md": "여기가 이 절에서 가장 중요한 부분입니다. 말로 다 되는 게 아닙니다.\n\n| 프롬프트로 되는 것 | 프롬프트로 안 되는 것 |\n|---|---|\n| 정확한 색상값 — `#0057FF`처럼 숫자로 | \"세련되게\" \"고급스럽게\" — 평균값으로 돌아갑니다 |\n| 글꼴 이름 | \"우리 브랜드 느낌으로\" — 브랜드가 뭔지 AI가 모릅니다 |\n| 금지 목록 — \"그라디언트 금지\" | \"흔하지 않게\" — 흔한 게 뭔지 판단 기준이 없습니다 |\n| 숫자 규칙 — 간격·대비·단계 수 | 색감·질감·여백의 밀도 — 형용사로 안 잡힙니다 |\n| 개수 지정 — \"카드는 다섯 개\" | 전체 인상 — 5절 「그림으로 보여주기」로 갑니다 |\n\n**측정되는 것은 말로, 측정 안 되는 것은 그림으로.** 말로 세 번 고쳐도 안 잡히면 프롬프트 문제가 아니니 5절로 갑니다."}, {"title": "③ 한 군데만 튀게 정한다", "md": "전부 특별하게 만들면 오히려 어수선해집니다. **한 군데만** 정하세요.\n\n- 아주 큰 숫자 하나\n- 아주 긴 제목 하나 (남들이 짧게 쓰는 자리에)\n- 색을 딱 한 곳에만 (나머지는 전부 무채색)\n- 사진이 아니라 손으로 그린 선 하나\n\n나머지 아홉은 규칙대로, 하나만 의도적으로. 혼자 만드는 사람이 쓸 수 있는 가장 값싼 차별화입니다."}, {"title": "⚡ 따라 하기", "md": "1. 3절 규칙표의 「하지 말 것」에 아래 다섯 줄을 넣으세요. 대화창에 쓰면 새 대화에서 사라지기 때문입니다. 지침 파일에 금지 줄이 여덟 개가 되면 됩니다.\n\n```\n[하지 말 것 — AI 티 나는 다섯]\n- 그라디언트를 쓰지 않는다. 특히 파랑→보라\n- 글꼴은 규칙표에 적힌 것 하나만 쓴다\n- 아이콘 + 제목 + 두 줄 설명 카드를 가로로 셋 놓지 않는다\n- 반투명·흐림(유리 질감) 효과를 쓰지 않는다\n- 첫 화면을 가운데 정렬로 만들지 않는다. 왼쪽 정렬을 기본으로 한다\n```\n\n2. AI가 만든 화면을 하나 열고 다섯 개가 있는지 **하나씩 세어** 보세요. 이름을 알면 눈에 보이는지 확인하는 연습입니다. \"있음/없음\" 다섯 줄이 나오면 됩니다.\n3. 아래를 붙여넣어 검사시키세요. 있는 것만 고치고, 튀어야 할 자리 하나까지 받기 위해서입니다. 마지막 줄에 제안 하나가 오면 됩니다.\n\n```\n이 화면에서 아래 다섯 가지가 있는지 하나씩 확인해줘. 있으면 \"있음 + 어디에\", 없으면 \"없음\"으로만 답해줘.\n1. 그라디언트 (특히 파랑에서 보라)\n2. 규칙표에 없는 글꼴\n3. 아이콘 + 제목 + 두 줄 설명 카드가 가로로 세 개\n4. 반투명·흐림 효과\n5. 가운데 정렬 히어로\n\n그다음, 있는 것만 아래 규칙으로 고쳐줘.\n- 색은 규칙표의 값만 쓴다\n- 첫 화면은 왼쪽 정렬로 바꾼다\n- 카드는 세 개 배치를 쓰지 않는다\n마지막에 \"이 화면에서 유일하게 튀어야 할 것 하나\"를 골라 제안해줘.\n```"}, {"title": "✅ 확인", "md": "- [ ] AI 지문 다섯을 이름으로 말할 수 있나\n- [ ] 금지 목록이 대화창이 아니라 규칙표 파일에 들어갔나\n- [ ] 내 화면에 그라디언트가 하나도 없고, 첫 화면이 왼쪽 정렬인가 (가운데를 일부러 골랐다면 그것도 «예»)\n- [ ] \"여기 하나만 튄다\"고 지목할 수 있는 자리가 있나"}, {"title": "📘 말 풀이", "md": "**슬롭(slop)** — AI가 대량으로 뽑아낸, 평균적이고 특징 없는 결과물. \"아무 선택도 하지 않은\" 상태입니다.\n\n**그라디언트(gradient)** — 한 색에서 다른 색으로 서서히 흐르게 칠하는 것. 파랑→보라가 AI 결과물의 대표 표식입니다.\n\n**히어로(hero)** — 웹페이지 맨 위, 열자마자 보이는 가장 큰 영역. 제목과 버튼이 들어가는 자리입니다."}, {"title": "⚠️ 함정", "md": "**\"AI 티를 없애 줘\"라고만 말합니다.** AI는 자기 지문을 모릅니다. 다섯 개를 이름으로 지목해야 지웁니다.\n\n**전부 특이하게 만들려 합니다.** 그러면 2절의 다섯 가지 문제가 다시 돌아옵니다. 규칙이 먼저, 일탈은 한 곳만.\n\n**\"무난해도 깔끔하니까 됐다\"고 넘어갑니다.** 깔끔함은 통과 기준이지 목표가 아닙니다.\n\n**AI에게 \"창의적으로\"라고 요구합니다.** 이 말은 평균값을 부르는 말입니다. 구체적인 제약이 창의를 만듭니다."}, {"title": "🔎 더 깊이", "md": "- 말로 안 잡히는 색감·질감은 다음 절 「말 대신 그림으로」에서.\n- 검색해 볼 말 — `AI slop design`, `generic AI landing page`, `design constraints creativity`\n- 카피(글)에서도 같은 일이 벌어집니다. 판매 문구의 AI 티는 <a class=\"xref\" href=\"#10\">Stage 10<\/a>에서."}]}, {"file": "05-무드보드.md", "id": "s4-5", "no": "5", "title": "말 대신 그림으로 시키기", "goals": ["세 번 고쳐도 안 되면 브리프로 올라간다는 규칙을 쓸 수 있다", "다섯 칸 무드보드를 어도비 보드에 만들 수 있다", "참조 그림마다 «무엇을 보라» 한 줄을 붙여 AI에게 줄 수 있다"], "steps": ["세 번 규칙을 정한다", "다섯 칸에 참조를 모은다", "그림마다 한 줄을 붙여 준다"], "through": "색감과 질감은 말로 옮기면 손실이 크다. 세 번 고쳐도 안 되면 그림으로 보여 준다.", "time": "40분", "need": ["어도비 계정"], "head": "\"조금 더 따뜻하게\", \"여백을 좀 넉넉하게\"로 다섯 번을 고쳐도 원하는 게 안 나온 적이 있을 겁니다. 색감·질감·여백의 밀도 셋은 형용사로 안 잡히지만 AI는 그림으로는 정확히 읽으니, 설명하는 대신 **보여줍니다.**", "secs": [{"title": "① 세 번 규칙을 정한다", "md": "같은 것을 세 번 고쳤는데도 안 되면 프롬프트를 더 고치지 않습니다. **브리프를 다시 씁니다.** 세 번 실패했다는 건 내가 원하는 것을 나도 말로 정의하지 못했다는 신호이기 때문입니다.\n\n브리프를 다시 쓴다는 건 이런 뜻입니다.\n\n1. 원하는 것과 비슷한 그림 3~5장을 찾는다\n2. 각 장에서 정확히 무엇이 마음에 드는지 한 줄씩 적는다\n3. 원하지 않는 그림도 한두 장 찾아서 \"이건 아니다\"를 적는다\n4. 그 묶음을 AI에게 준다\n\n3번을 빼먹는 사람이 많은데, \"아닌 것\"이 \"인 것\"보다 더 잘 통합니다."}, {"title": "② 다섯 칸에 참조를 모은다", "md": "무드보드는 만들고 싶은 분위기의 그림을 한 판에 모아 둔 것입니다. 어도비의 보드 기능을 쓰면 소재를 한 캔버스에 모으고 거기서 바로 이어 작업할 수 있습니다.\n\n| 칸 | 몇 장 | 무엇을 |\n|---|---|---|\n| 색감 | 3~5 | 색이 마음에 드는 것. 무엇을 찍었는지는 상관없음 |\n| 질감·마감 | 2~3 | 종이 결, 필름 알갱이, 매끈한 면 같은 표면 느낌 |\n| 여백·밀도 | 2~3 | 빽빽한지 성긴지. 화면 배치가 보이는 것 |\n| 글자 인상 | 2~3 | 글꼴 자체보다 \"글자가 놓인 모양\" |\n| 이건 아니다 | 1~2 | 피하고 싶은 것. 이유 한 줄 필수 |\n\n무드보드는 예쁜 그림 모음이 아니라 **판단 도구**입니다. \"따뜻한 걸 원한다\"고 생각했는데 모아 놓고 보니 전부 차가운 회색일 때가 있고, 그게 수확입니다. 칸마다 다섯 장 안쪽 — 많으면 판단이 흐려집니다."}, {"title": "③ 그림마다 한 줄을 붙여 준다", "md": "그림만 던지면 AI가 엉뚱한 것을 봅니다 — 사진 속 인물을 따라 그리거나 배경을 그대로 베낍니다. 그림마다 **\"이것의 무엇을 보라\"**를 한 줄씩 붙이세요.\n\n```\n참조 A — 이 그림에서는 색만 봐줘. 회색 배경에 주황 하나만 쓴 비율\n참조 B — 이 그림에서는 여백만 봐줘. 글자 주변이 얼마나 비어 있는지\n참조 C — 이 그림에서는 질감만 봐줘. 살짝 거친 종이 느낌\n참조 D — 이건 피하고 싶은 것. 색이 너무 많고 그라디언트가 있음\n\n인물·구도·배경은 참조하지 마. 위에 적은 것만 가져와.\n```\n\n이 한 줄씩이 결과를 완전히 바꿉니다."}, {"title": "⚡ 따라 하기", "md": "1. 어도비에서 **보드를 하나** 만들고 이름을 프로젝트 이름으로 지으세요. 참조가 여러 폴더에 흩어지면 매번 다른 참조를 쓰게 되기 때문입니다. 빈 캔버스 하나가 보이면 됩니다.\n2. 위 다섯 칸에 맞춰 그림을 모으세요. 한 칸에 다섯 장을 넘기지 않습니다 — 많으면 판단이 흐려집니다.\n3. 각 그림 옆에 \"이것의 무엇을 보는가\"를 한 줄씩 적으세요. 「이건 아니다」 칸은 반드시 채웁니다 — 아닌 것이 더 잘 통하기 때문입니다.\n4. AI에게 브리프를 아래처럼 주세요. 프롬프트 위에 있는 문서라서, 이게 있으면 프롬프트를 여러 번 고칠 일이 줄어듭니다.\n\n```\n[브리프]\n만들 것: (예 — 서비스 소개 첫 화면의 배경 이미지)\n쓰일 곳: 랜딩 첫 화면 / 가로로 긴 비율\n\n색: 참조 A와 같은 비율로. 회색이 대부분, 주황은 한 군데만\n질감: 참조 C처럼 살짝 거친 종이 느낌. 매끈하지 않게\n여백: 참조 B처럼 가운데를 비워둘 것. 글자가 올라갈 자리\n피할 것: 참조 D. 색이 많고 그라디언트가 있는 것\n\n참조에서 인물·구도·배경은 가져오지 마. 위에 적은 것만 가져와.\n```\n\n5. 세 번 고쳐도 안 되면 프롬프트를 또 고치지 말고 2번으로 돌아가세요. 네 번째 프롬프트는 거의 항상 실패합니다."}, {"title": "✅ 확인", "md": "- [ ] 참조 그림이 한곳에 모여 있고, 그림마다 \"무엇을 보는가\" 한 줄이 붙어 있나\n- [ ] 「이건 아니다」 그림이 최소 한 장 있나\n- [ ] \"세 번 고쳐도 안 되면 브리프로 간다\"를 규칙으로 정했나\n- [ ] 모아 놓고 보니 내가 처음 말한 방향과 다른 게 보였나 (보였다면 그게 수확입니다)"}, {"title": "📘 말 풀이", "md": "**무드보드(mood board)** — 만들고 싶은 분위기의 그림들을 한 판에 모아 놓은 것. 색감·질감·밀도를 눈으로 합의하는 도구입니다.\n\n**브리프(brief)** — \"무엇을 왜 어떤 느낌으로 만들 것인가\"를 정리한 짧은 요청서. 프롬프트보다 위에 있는 문서입니다.\n\n**참조 이미지(reference)** — 결과를 이런 쪽으로 끌고 가 달라고 함께 주는 그림. 형용사 대신 건네는 증거입니다."}, {"title": "⚠️ 함정", "md": "**네 번째 프롬프트를 씁니다.** 세 번에서 멈추고 브리프로 올라갑니다. 시간을 가장 많이 아끼는 규칙입니다.\n\n**참조를 그림만 던집니다.** AI가 인물·배경까지 베낍니다. \"무엇을 보라\"를 한 줄씩 붙입니다.\n\n**남의 작업물을 그대로 따라 만듭니다.** 무드보드는 방향을 잡는 도구지 복제 지시가 아닙니다. 특정 작가의 그림을 그대로 재현해 달라고 하지 않습니다.\n\n**무드보드를 만들고 안 씁니다.** 매번 여는 자리에 둡니다. 안 열면 없는 것과 같습니다."}, {"title": "🔎 더 깊이", "md": "- 여기서 만든 보드는 9절 「캐릭터 일관성」에서 참조 컷을 모아 두는 자리로 그대로 씁니다.\n- 검색해 볼 말 — `mood board`, `creative brief template`, `image reference prompting`\n- 어도비 폰트 검색은 한글 서체를 찾지 못합니다(2026-09-09 실측). 한글 글꼴은 여기서 고르지 않습니다 — 10절 참고."}]}, {"file": "06-랜딩7단.md", "id": "s4-6", "no": "6", "title": "랜딩을 일곱 칸으로 짜기", "goals": ["랜딩 일곱 칸을 순서대로 말할 수 있다", "빼야 할 여섯을 내 화면에서 걸러낼 수 있다", "헤드라인 주어를 나에서 상대로 바꿔 쓸 수 있다"], "steps": ["일곱 칸을 순서대로 놓는다", "여섯을 뺀다", "헤드라인 주어를 바꾼다"], "through": "넣을 일곱보다 뺄 여섯이 더 중요하다.", "time": "50분", "need": ["3절의 규칙표", "Stage 1의 고객 정의"], "head": "서비스를 만들면 결국 \"이게 뭔지 설명하는 한 페이지\", 랜딩 페이지가 필요합니다. 만든 사람은 다 말하고 싶고 읽는 사람은 \"이게 나한테 무슨 소용인가\" 하나만 알고 싶으니, 이 절의 순서와 금지 목록으로 그 간격을 좁힙니다 — 여기서 정한 구조가 <a class=\"xref\" href=\"#5\">Stage 5<\/a>에서 실제 코드가 됩니다.", "secs": [{"title": "① 일곱 칸을 순서대로 놓는다", "md": "읽는 사람이 스크롤을 내리는 순서가 곧 설득의 순서입니다. **순서를 바꾸지 않습니다.**\n\n| 순서 | 무엇 | 지킬 것 |\n|---|---|---|\n| 1 | 헤드라인 | 누구의 무엇을 해결하는지 한 줄. 회사 이름이 아니라 상대의 문제 |\n| 2 | 가치 제안 | 30단어 안쪽. 헤드라인을 풀어 주는 두세 줄 |\n| 3 | 버튼 하나 | 하나입니다. 둘 이상이면 선택을 미룹니다 |\n| 4 | 사회적 증거 | 쓰는 사람 수, 후기, 실제 화면. 없으면 비워 두고 생기면 채웁니다 |\n| 5 | 근거 3~5개 | 왜 되는지. 기능이 아니라 결과로 |\n| 6 | 입력칸 3개 이하 | 이름·이메일 정도. 칸이 늘수록 사람은 나갑니다 |\n| 7 | 자주 묻는 질문 | 사기 전에 걸리는 걱정 넷에서 여섯. \"환불되나요\" 같은 불편한 것부터 |\n\n버튼은 아래쪽에 한 번 더 놓아도 되지만 같은 문구, 같은 곳으로 가는 것이어야 합니다. 문구가 다르면 다른 선택지로 읽힙니다."}, {"title": "② 여섯을 뺀다", "md": "이게 이 절의 진짜 내용입니다. **넣는 것보다 빼는 게 어렵습니다.**\n\n| 빼는 것 | 왜 |\n|---|---|\n| 회사 연혁 | 처음 온 사람은 회사가 아니라 자기 문제에 관심이 있습니다 |\n| 팀 소개 | 처음 온 사람에게는 모르는 사람 얼굴입니다. 별도 페이지로 |\n| 로고 슬라이더 | 눈을 끌어당기고 아무 정보도 주지 않습니다 |\n| 버튼 여러 개 | \"가입 / 더 알아보기 / 문의\"가 나란히 있으면 아무것도 안 누릅니다 |\n| 자동으로 넘어가는 배너 | 읽는 중에 넘어갑니다. 읽는 사람이 속도를 못 정합니다 |\n| 자동재생 영상 | 소리가 나면 창을 닫습니다. 데이터도 씁니다 |\n\n뒤의 셋은 접근성에서도 문제입니다. 스스로 움직이는 것은 멈출 수단이 있어야 하고, 7절에서 다시 나옵니다."}, {"title": "③ 헤드라인 주어를 바꾼다", "md": "가장 잘 듣는 방법 하나만 말하면 이것입니다. **주어를 나에서 상대로** 바꿉니다.\n\n| 이렇게 말고 | 이렇게 |\n|---|---|\n| \"AI 기반 뉴스레터 자동화 솔루션\" | \"매주 뉴스레터 쓰는 데 세 시간 쓰고 있다면\" |\n| \"저희는 10년 경력의…\" | \"발송 전에 오타를 잡아 드립니다\" |\n| \"혁신적인 워크플로 플랫폼\" | \"같은 자료를 두 번 정리하지 않게\" |\n\n왼쪽은 내가 무엇인지를 말하고, 오른쪽은 상대가 무엇을 겪는지를 말합니다. 사람은 자기 이야기가 나오면 멈춥니다."}, {"title": "⚡ 따라 하기", "md": "1. 종이에 **일곱 칸을 세로로** 그리고 각 칸에 들어갈 문장을 손으로 쓰세요. 화면부터 만들면 구조가 아니라 꾸밈에 시간을 쓰게 되기 때문입니다. 일곱 줄이 채워지면 됩니다.\n2. 2번 칸(가치 제안)의 단어를 세세요. 30단어를 넘으면 자릅니다 — 길어지면 아무도 안 읽습니다.\n3. 「빼야 할 여섯」을 소리 내어 읽고 이미 넣을 생각을 했던 것에 표시하세요. 표시가 하나라도 있으면 그게 뺄 것입니다.\n4. AI에게 아래를 붙여넣으세요. 구조와 금지를 같이 주면 AI가 흔한 배치로 돌아가지 않습니다. 일곱 칸 순서대로 된 한 장이 나오면 됩니다.\n\n```\n아래 정보로 랜딩 페이지 한 장을 만들어줘. 지침 파일의 「디자인 규칙」을 그대로 지켜줘.\n\n- 무엇: (서비스 한 줄)\n- 누구를 위해: (Stage 1에서 정한 고객)\n- 그 사람이 지금 겪는 문제: (한 줄)\n- 여기서 하길 바라는 행동 하나: (예 — 이메일 남기기)\n\n구조는 위에서부터 이 순서를 지켜줘.\n헤드라인 → 30단어 이하 가치 제안 → 버튼 하나 → 사회적 증거 자리 → 근거 3~5개 → 입력칸 3개 이하 → 자주 묻는 질문\n\n그리고 아래는 절대 넣지 마.\n회사 연혁 / 팀 소개 / 로고 슬라이더 / 버튼 두 개 이상 / 자동으로 넘어가는 배너 / 자동재생 영상\n\n헤드라인은 우리 회사가 무엇인지가 아니라 상대가 무엇을 겪는지로 시작해줘.\n사회적 증거는 지어내지 말고 \"여기에 후기가 들어갑니다\"라고 자리만 비워둬.\n```\n\n5. 나온 결과에서 버튼 개수와 입력칸 개수를 직접 세세요. AI는 자주 늘립니다 — 버튼 하나, 입력칸 셋 이하여야 합니다."}, {"title": "✅ 확인", "md": "- [ ] 화면에 버튼이 하나인가 (아래쪽 반복은 같은 문구·같은 목적지인가)\n- [ ] 가치 제안이 30단어 이하이고 입력칸이 세 개 이하인가 (세어 봤나)\n- [ ] 「빼야 할 여섯」이 하나도 안 들어갔나\n- [ ] 헤드라인이 상대의 문제로 시작하고, 자주 묻는 질문에 불편한 질문(가격·환불·해지)이 들어 있나"}, {"title": "📘 말 풀이", "md": "**랜딩 페이지(landing page)** — 광고나 링크를 타고 처음 도착하는 한 페이지. 여기서 설명이 끝나고 행동이 정해집니다.\n\n**가치 제안(value proposition)** — \"당신에게 이런 이득이 있다\"를 짧게 말한 문장. 기능이 아니라 상대가 얻는 결과를 씁니다.\n\n**사회적 증거(social proof)** — \"다른 사람도 쓰고 있다\"를 보여 주는 것. 사용자 수, 후기, 실제 화면 등."}, {"title": "⚠️ 함정", "md": "**입력칸을 늘립니다.** \"이왕 받는 김에 회사명도, 직급도\"라고 생각하는 순간 사람이 나갑니다. 셋 이하.\n\n**사회적 증거를 지어냅니다.** 없는 후기를 만들거나 안 쓰는 회사 로고를 넣지 않습니다. 비워 두는 편이 낫습니다.\n\n**자주 묻는 질문에 편한 질문만 씁니다.** 진짜 걱정(가격·환불·해지·내 자료가 어디로 가나)을 안 다루면 아무 소용이 없습니다.\n\n**전환율 숫자를 근거로 씁니다.** 마케팅 글에 도는 \"○○% 상승\"은 대부분 원본이 확인되지 않은 재인용입니다. 쓸 거면 \"업계에서 흔히 말하는\"을 붙이고, 판단은 내 화면에서 직접 확인한 것으로 합니다."}, {"title": "🔎 더 깊이", "md": "- 여기서 만든 구조가 <a class=\"xref\" href=\"#5\">Stage 5<\/a>에서 실제 코드가 됩니다.\n- 고객 정의가 흐릿하면 헤드라인이 안 써집니다 → <a class=\"xref\" href=\"#1\">Stage 1<\/a>로 돌아갑니다.\n- 검색해 볼 말 — `landing page structure`, `value proposition canvas`, `single call to action`"}]}, {"file": "07-접근성.md", "id": "s4-7", "no": "7", "title": "접근성 3종 — 그리고 한국 법의 자리", "goals": ["내 화면의 대비를 재서 기준을 넘는지 확인할 수 있다", "마우스 없이 키보드만으로 내 화면을 끝까지 조작할 수 있다", "법인이 접근성 적용 대상인 이유를 말할 수 있다"], "steps": ["하나", "둘", "셋"], "through": "대비·키보드·대체 텍스트 셋은 챙겨야 한다. 법인이면 적용 대상이기도 하다.", "time": "45분", "need": ["만들어 둔 화면 하나"], "head": "접근성은 \"여유 있으면 나중에\" 항목으로 밀리기 쉽습니다.\n그런데 두 가지 이유로 **지금 해야 합니다.**\n\n첫째, **나중에 하면 다시 만들어야 합니다.**\n연한 회색 글자를 백 군데 깔아 놓고 나중에 고치는 것보다, 규칙표에 대비 값을 넣어 두는 게 훨씬 쌉니다.\n\n둘째, **법의 자리가 있습니다.**\n한국에서 **법인**이 운영하는 웹사이트는 원칙적으로 적용 대상입니다. 아래에서 정확히 짚습니다.\n\n여기서 다루는 건 셋뿐입니다. 전문가 수준의 완전한 접근성이 아니라,\n**혼자 만드는 사람이 지금 당장 지킬 수 있는 최소선**입니다.", "secs": [{"title": "① 하나 — 대비: 재야 하는 값이다", "md": "1절에서 나온 숫자를 다시 씁니다.\n\n| 무엇 | 최소 |\n|---|---|\n| 본문 글자 | **4.5 : 1** |\n| 큰 글자 | **3 : 1** |\n| 버튼 테두리·아이콘 같은 부품 | **3 : 1** |\n\n**눈짐작은 통하지 않습니다.** 만든 사람은 자기 화면 밝기와 자기 눈으로 봅니다.\n햇빛 아래 휴대폰, 오래된 모니터, 나이 든 눈에서는 전혀 다르게 보입니다.\n\n**재는 법** — 대비 계산기에 글자색과 배경색 값 두 개를 넣으면 숫자가 나옵니다.\n브라우저의 개발자 도구에서도 색을 고르면 대비 값이 같이 표시됩니다.\nAI에게 두 색 값을 주고 계산시켜도 됩니다. 어떤 방법이든 **숫자를 봐야 합니다.**\n\n가장 자주 걸리는 자리 셋 — **회색 설명 글자 · 비활성 버튼 글자 · 이미지 위에 올린 흰 글자.**"}, {"title": "② 둘 — 키보드만으로 조작되나", "md": "마우스를 못 쓰는 사람이 있습니다. 손이 불편한 경우도 있고, 화면을 못 보는 경우도 있습니다.\n그 사람들은 **탭 키로 이동하고 엔터로 누릅니다.**\n\n확인은 30초면 됩니다.\n\n1. 마우스에서 손을 뗍니다\n2. **탭 키를 계속 누릅니다**\n3. 지금 어디에 있는지 **테두리로 보이나요?**\n4. 순서가 **위에서 아래, 왼쪽에서 오른쪽**으로 자연스럽나요?\n5. 모든 버튼과 링크에 **닿을 수 있나요?**\n6. 창(팝업)이 열렸을 때 **탭이 그 안에 머무나요?** 그리고 **Esc로 닫히나요?**\n\n가장 흔한 실패는 **테두리를 없앤 것**입니다.\n\"파란 테두리가 못생겨서\" 지우는 경우가 많은데, 그러면 키보드 쓰는 사람은 **자기가 어디 있는지 못 봅니다.**\n지우지 말고 **내 규칙표 색으로 바꿉니다.**"}, {"title": "③ 셋 — 이미지 대체 텍스트", "md": "화면을 못 보는 사람은 화면 읽어 주는 프로그램으로 웹을 씁니다.\n그 프로그램은 이미지를 **대체 텍스트**로 읽습니다. 없으면 \"이미지\"라고만 말하고 지나갑니다.\n\n쓰는 법은 세 줄입니다.\n\n- **내용이 있는 이미지** — 무엇이 보이는지 짧게. \"노트북 앞에서 메모하는 사람\"\n- **글자가 들어 있는 이미지** — **그 글자를 그대로** 적습니다. 카드뉴스가 여기 해당합니다\n- **장식일 뿐인 이미지** — **비워 둡니다.** 의미 없는 것을 읽어 주면 방해가 됩니다\n\n\"이미지\", \"사진\", \"그림\"이라고 적는 건 안 적은 것과 같습니다."}, {"title": "⚠️ 한국 법의 자리 — 법인이면 적용 대상입니다", "md": "여기는 정확하게 씁니다.\n\n**장애인차별금지 및 권리구제 등에 관한 법률(장차법)** 시행령 별표3은\n웹 접근성 의무를 적용받는 기관·사업자를 단계적으로 확대해 왔고,\n마지막 단계에서 **\"그 밖의 모든 법인\"**이 포함되었습니다. 시행 시점은 **2013년 4월 11일**입니다.\n\n즉 **법인 형태로 사업을 한다면, 규모가 작더라도 원칙적으로 적용 대상**입니다.\n\n혼동하기 쉬운 것 하나를 짚습니다.\n**웹 접근성 인증(마크)을 받는 심사는 임의입니다.** 안 받아도 됩니다.\n그러나 **인증을 안 받는 것과 접근성 의무가 없는 것은 다른 이야기**입니다.\n인증은 선택이고, 차별하지 않을 의무는 법에 있습니다.\n\n> ***\"1인 기업이라 안 해도 된다\"는 말은 쓰지 않습니다.*** 근거가 없습니다.\n\n**[확인 필요]**로 남기는 것 둘 — 실제 **집행·제재의 강도**가 소규모 법인에 어떻게 적용되는지,\n그리고 **법인이 아닌 개인사업자가 단독으로 운영하는 사이트**의 적용 범위.\n이 둘은 이 커리큘럼에서 1차 자료로 확인하지 못했습니다. 필요하면 변호사나 관련 기관에 확인합니다.\n\n이 절에서 확실한 것은 하나입니다.\n**대비 · 키보드 · 대체 텍스트 셋은 어느 경우에도 기본이고, 셋 다 오늘 안에 할 수 있습니다.**"}, {"title": "📘 말 풀이", "md": "**대체 텍스트(alt text)**\n이미지에 붙이는 글 설명. 화면을 못 보는 사람이 쓰는 읽어 주는 프로그램이 이 글을 대신 읽습니다.\n\n**포커스 표시(focus indicator)**\n키보드로 이동할 때 \"지금 여기 있다\"를 보여 주는 테두리. 없애면 키보드 사용자가 길을 잃습니다.\n\n**웹 접근성 인증**\n접근성 기준을 지켰는지 심사받고 표시를 받는 제도. **심사를 받는 것은 임의**이며, 안 받는다고 접근성 의무가 없어지는 것은 아닙니다."}, {"title": "⚠️ 함정", "md": "- **연한 회색이 세련돼 보여서 그대로 둡니다.** 가장 흔한 위반입니다. 재 보면 대부분 4.5:1에 못 미칩니다.\n- **파란 테두리를 지웁니다.** 못생겼다고 지우면 키보드 사용자가 길을 잃습니다. **지우지 말고 색만 바꿉니다.**\n- **대체 텍스트에 \"이미지\"라고 씁니다.** 없는 것과 같습니다.\n- **카드뉴스에 글자를 그림으로 넣고 설명을 안 답니다.** 그 글자는 아무도 못 읽습니다. **글자를 그대로 옮겨 적습니다.**\n- **자동으로 넘어가는 배너를 둡니다.** 스스로 움직이는 것은 멈출 수단이 있어야 합니다. 6절에서 뺀 이유가 여기에도 있습니다.\n- **자동 검사 도구 결과만 믿습니다.** 도구는 대비나 대체 텍스트 유무는 잘 잡지만, **순서가 이상한 것·설명이 엉뚱한 것은 못 잡습니다.** 탭 키로 직접 눌러 봐야 합니다."}, {"title": "⚡ 따라 하기", "md": "1. 규칙표(3절)에 **대비 최소값 줄**을 넣습니다. 이미 넣었으면 넘어갑니다.\n2. 내 화면에서 **가장 연한 글자**를 하나 골라 색 값과 배경 값을 확인하고 **대비를 잽니다.** 숫자를 적어 둡니다.\n3. **마우스에서 손을 떼고 탭 키로** 화면을 끝까지 지나가 봅니다. 걸리는 곳을 적습니다.\n4. 이미지마다 대체 텍스트를 답니다. 장식은 비워 둡니다.\n5. AI에게 아래를 붙여넣습니다.\n\n```\n이 화면을 접근성 세 항목으로 점검해줘. 항목마다 \"통과 / 실패 + 위치 + 고칠 값\"으로 표를 만들어줘.\n\n1. 대비 — 글자색과 배경색 조합을 전부 찾아서 대비 값을 계산해줘.\n   본문은 4.5:1, 큰 글자는 3:1이 최소야. 못 미치는 것만 표에 넣고, 규칙표 안의 색으로 대안을 제안해줘.\n2. 키보드 — 탭으로 닿을 수 없는 요소, 포커스 표시가 없는 요소, 탭 순서가 화면 순서와 다른 곳을 찾아줘.\n   포커스 표시를 없앤 코드가 있으면 지적해줘.\n3. 대체 텍스트 — 대체 텍스트가 없는 이미지, \"이미지\"처럼 의미 없는 것,\n   글자가 들어 있는데 그 글자를 안 옮긴 것을 찾아줘.\n\n계산이 아니라 추측인 항목은 \"추측\"이라고 표시해줘.\n```\n\n6. AI가 못 잡는 것 하나가 있습니다 — **탭 순서가 자연스러운가.** 이건 직접 눌러 봐야 압니다."}, {"title": "✅ 확인", "md": "- [ ] 본문 대비를 **재 봤나** (눈짐작 말고 숫자를 봤나)\n- [ ] 가장 연한 글자의 대비 값이 **4.5 이상인가**\n- [ ] **마우스 없이 탭 키만으로** 모든 버튼에 닿았나\n- [ ] 탭으로 이동할 때 **지금 위치가 테두리로 보이나**\n- [ ] 이미지마다 대체 텍스트가 있고, **장식 이미지는 비어 있나**\n- [ ] 글자가 들어간 이미지의 **글자를 그대로 옮겨 적었나**\n\n하나라도 «아니오»면 이 절을 다시 봅니다. 셋 다 오늘 안에 끝낼 수 있는 분량입니다."}, {"title": "🔎 더 깊이", "md": "- 기준의 원본은 국제 웹 접근성 지침(WCAG)과 그것을 받은 한국 표준(KWCAG)입니다.\n- 검색해 볼 말 — `WCAG 2.2 contrast`, `keyboard focus visible`, `alt text 작성법`, `장애인차별금지법 시행령 별표3`\n- 집행 강도와 개인사업자 적용 범위는 **[확인 필요]** — 필요하면 전문가에게 확인합니다.\n- 카드뉴스의 대체 텍스트는 다음 절에서 실제로 씁니다."}]}, {"file": "08-카드뉴스.md", "id": "s4-8", "no": "8", "title": "카드뉴스 — 4:5 · 7~10장 · 템플릿 고정", "goals": ["1080×1350 템플릿을 만들어 여러 장을 같은 꼴로 뽑을 수 있다", "무료 플랜에서 일관성을 잡는 방법을 말할 수 있다"], "steps": ["숫자 셋만 지키면 됩니다", "첫 장과 마지막 장은 역할이 다릅니다", "한 장 = 한 생각", "캔바 무료에서 일관성 잡는 법", "지표가 옮겨갔습니다"], "through": "한 장 = 한 생각. 일관성은 템플릿을 고정하고 텍스트만 갈아 끼워서 만든다.", "time": "60분", "need": ["캔바 계정", "3절의 규칙표"], "head": "만든 것을 알리려면 결국 **SNS에 올릴 그림**이 필요합니다.\n그런데 다섯 장을 만들어 놓고 보면 **한 사람이 만든 것 같지 않을 때**가 많습니다.\n글자 크기가 조금씩 다르고, 여백이 다르고, 색이 미묘하게 다릅니다.\n\n이건 감각 문제가 아니라 **만드는 방식의 문제**입니다.\n매 장을 새로 만들면 매 장이 달라집니다. 당연한 결과입니다.\n\n이 절은 그 방식을 바꿉니다. 그리고 **캔바 무료 플랜에서 되는 방식**으로만 씁니다.", "secs": [{"title": "① 숫자 셋만 지키면 됩니다", "md": "| 무엇 | 값 | 왜 |\n|---|---|---|\n| **비율** | **4:5 (1080 × 1350)** | 세로가 긴 쪽이 휴대폰 화면을 더 많이 차지합니다. 스크롤 중에 눈에 걸립니다 |\n| **장수** | **7~10장** | 다섯 장은 얕고, 열다섯 장은 안 넘깁니다 |\n| **한 장에 든 생각** | **1개** | 두 개를 넣으면 둘 다 안 남습니다 |\n\n**모든 장이 같은 비율**이어야 합니다. 한 장만 정사각형이면 그 장에서 넘김이 끊깁니다."}, {"title": "② 첫 장과 마지막 장은 역할이 다릅니다", "md": "가운데 장들은 내용이지만, 처음과 끝은 **일**을 합니다.\n\n- **첫 장 = 훅.** 여기서 넘길지 말지가 결정됩니다. 제목이 아니라 **멈출 이유**를 씁니다.\n  - 이렇게 말고 — \"AI 도구 정리\"\n  - 이렇게 — \"이 셋만 알면 매주 세 시간이 남습니다\"\n- **마지막 장 = 다음 행동.** 여기까지 본 사람에게 무엇을 하라고 할지 **하나만** 씁니다.\n  - \"저장해 두세요\" / \"프로필 링크에서 받아 가세요\" / \"댓글로 물어보세요\" — 하나만."}, {"title": "③ 한 장 = 한 생각", "md": "가장 자주 어기는 규칙입니다. 넣을 게 많으니 한 장에 두세 개를 넣게 됩니다.\n\n**한 장을 보고 넘긴 사람의 머리에 남는 건 딱 하나**입니다.\n두 개를 넣으면 둘 다 흐려집니다. 세 개면 아무것도 안 남습니다.\n\n내용이 열두 개면 카드가 열두 장인 게 아니라, **묶어서 일곱 개로 줄입니다.**\n줄이지 못하겠다면 그건 카드뉴스가 아니라 글로 써야 할 내용입니다."}, {"title": "④ ⭐ 캔바 무료에서 일관성 잡는 법 — 템플릿 고정, 텍스트만 교체", "md": "여기가 이 절의 핵심입니다.\n\n캔바에는 색·글꼴·로고를 등록해 두고 모든 디자인에 한 번에 적용하는 **브랜드
