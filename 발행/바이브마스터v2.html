킷** 기능이 있습니다.\n그런데 **무료 플랜에서는 브랜드 킷을 만들 수 없습니다.**\n\n그래서 다른 길로 갑니다. 무료에서 되는 유일한 길입니다.\n\n> **템플릿 한 장을 제대로 만들고, 그것을 복제해서 텍스트만 갈아 끼웁니다.**\n\n### 왜 이게 통하나\n\n브랜드 킷이 하는 일은 \"매번 같은 값을 자동으로 넣는 것\"입니다.\n복제는 **처음부터 같은 값이 들어 있는 상태에서 시작하는 것**입니다. 결과는 같습니다.\n자동이 아니라 손으로 하는 것뿐입니다.\n\n### 이렇게 합니다\n\n1. **틀 한 장을 만듭니다.** 1080 × 1350. 여기에 넣을 것 —\n   - 배경색 (규칙표의 배경색)\n   - 제목 자리 (규칙표의 큰제목 크기, 위치 고정)\n   - 본문 자리 (규칙표의 본문 크기, 위치 고정)\n   - 아래쪽 고정 요소 (내 이름·계정·쪽번호) — **위치가 절대 안 움직여야 합니다**\n2. **이 한 장을 공들여 만듭니다.** 여백, 글자 크기, 색을 여기서 다 정합니다. 여기가 원본입니다.\n3. **복제합니다.** 7~10장이 될 때까지.\n4. **텍스트만 바꿉니다.** 글자 크기·위치·색은 **건드리지 않습니다.**\n5. 글이 길어서 안 들어가면 **글자를 줄이지 말고 글을 줄입니다.** 크기를 줄이는 순간 일관성이 깨집니다.\n\n### 절대 하지 말 것\n\n- **장마다 다른 템플릿을 고릅니다** — 이게 다섯 장이 남남으로 보이는 첫 번째 이유입니다\n- **장마다 글자 크기를 손봅니다** — 두 번째 이유입니다\n- **장마다 다른 사진을 넣습니다** — 사진 색감이 다르면 색을 아무리 맞춰도 안 맞아 보입니다"}, {"title": "⑤ 지표가 옮겨갔습니다 — 좋아요에서 저장·공유로", "md": "한 가지만 짚습니다. 예전에는 좋아요 수를 봤지만,\n지금 SNS에서 더 중요하게 취급되는 신호는 **저장 · 공유 · 친구에게 전송**입니다.\n\n좋아요는 \"봤다\"이고, 저장은 **\"나중에 또 볼 만큼 쓸모 있다\"**이기 때문입니다.\n그래서 카드뉴스를 만들 때 목표를 바꿉니다.\n\n**\"멋있어 보이는 것\"이 아니라 \"저장해 두고 싶은 것\".**\n\n저장되는 것은 대개 **정리된 목록 · 순서 · 체크리스트 · 숫자**입니다.\n느낌 좋은 사진 한 장보다 **\"이 다섯 개만 확인하세요\" 같은 정리**가 저장됩니다.\n\n*(구체적인 참여율·저장률 수치는 마케팅 글에 재인용된 것이 많아 원본 확인이 어렵습니다.\n쓰신다면 **\"업계에서 흔히 말하는\"**을 붙이고, 판단은 내 계정의 실제 숫자로 하십시오.)*"}, {"title": "📘 말 풀이", "md": "**브랜드 킷(brand kit)**\n색·글꼴·로고를 미리 등록해 두고 모든 디자인에 한 번에 적용하는 기능. **캔바 무료 플랜에서는 만들 수 없습니다.** 그래서 템플릿 고정 방식을 씁니다.\n\n**훅(hook)**\n넘길지 말지를 결정하는 첫 장. 제목이 아니라 \"여기서 멈출 이유\"입니다.\n\n**템플릿 고정**\n잘 만든 한 장을 원본으로 두고 복제해서 텍스트만 바꾸는 방식. 브랜드 킷 없이 일관성을 만드는 길입니다."}, {"title": "⚠️ 함정", "md": "- **매 장을 새로 만듭니다.** 다섯 장이 남남처럼 보이는 가장 큰 원인입니다. 복제만 합니다.\n- **글이 길어서 글자 크기를 줄입니다.** 크기를 줄이는 대신 **글을 줄입니다.** 예외 하나 없이.\n- **비율을 섞습니다.** 한 장만 정사각형이면 거기서 흐름이 끊깁니다.\n- **마지막 장에 여러 가지를 시킵니다.** \"팔로우하고 저장하고 댓글 달고 링크도 눌러 주세요\" → 아무것도 안 합니다. **하나만.**\n- **글자를 그림에 넣고 대체 텍스트를 안 씁니다.** 그 글자는 읽어 주는 프로그램에서 사라집니다. 7절 참고 — **글자를 그대로 옮겨 적습니다.**\n- **캔바에서 색을 눈으로 고릅니다.** 규칙표의 색 값을 직접 입력합니다. 비슷한 색은 다른 색입니다."}, {"title": "⚡ 따라 하기", "md": "1. 캔바에서 **1080 × 1350** 새 디자인을 만듭니다.\n2. **첫 한 장을 원본으로 공들여** 만듭니다. 색은 규칙표의 값을 **직접 입력**합니다(눈으로 고르지 않습니다).\n3. 그 한 장을 **복제해서 8장**을 만듭니다.\n4. 내용을 먼저 글로 씁니다. 이때 AI에게 아래를 시킵니다.\n\n```\n아래 내용을 카드뉴스 8장으로 나눠줘. 규칙은 이래.\n\n- 한 장에 생각은 하나만. 두 개가 들어가면 장을 나눠줘\n- 1장은 훅. 제목이 아니라 \"여기서 멈출 이유\"로 써줘\n- 8장은 다음 행동 하나만. 여러 개 시키지 마\n- 각 장의 글자 수는 제목 20자 이내, 본문 60자 이내로 맞춰줘 (템플릿을 고정해서 쓸 거야)\n- 저장하고 싶어지는 형태로 만들어줘 — 목록·순서·체크리스트·숫자\n\n내용: (여기에 내용)\n\n출력은 장마다 이렇게 해줘.\n[N장] 제목: / 본문: / 이 장의 한 가지 생각:\n그리고 각 장의 대체 텍스트(그림에 든 글자를 그대로 옮긴 것)도 같이 만들어줘.\n```\n\n5. 나온 글을 복제된 카드에 **텍스트만 갈아 끼웁니다.** 크기·위치는 손대지 않습니다.\n6. 다 만든 뒤 **여덟 장을 한 화면에 늘어놓고 봅니다.** 튀는 장이 있으면 그 장이 규칙을 어긴 장입니다.\n\n### 이렇게 해 봤습니다 — 2026-09-09\n\n캔바 **무료 플랜**에서 카드뉴스 첫 장을 실제로 만들어 봤습니다. 세 가지가 확인됐습니다.\n\n**하나 — 크기는 맞습니다.** 인스타그램 게시물로 만들면 **1080×1350**이 그대로 나옵니다. 4:5입니다.\n\n**둘 — AI에게 한글 문장을 맡기면 안 됩니다.** *\"디자인은 감각이 아니라 숫자다\"*를 넣어 달라고 했는데,\n실제로 들어간 글자는 **「매일 보는날」, 「콘텐츠서」** 였습니다. 뜻이 없는 조각입니다.\n영어로는 잘 나오는데 한글은 아직 이렇습니다. **그래서 「AI가 만들어 주는 대로」가 아니라 「내가 글자를 넣는」 방식이 맞습니다.**\n\n**셋 — 글자만 갈아 끼우는 것은 되는데, 조건이 하나 붙습니다.**\n복제한 장의 글자를 한글로 바꾸니 **내용은 정확히 들어갔습니다.** 그런데 **글상자 폭이 고정이라** 글자가 늘자\n「디자인은」이 「디자 / 인은」으로 쪼개지고 아래 글자와 겹쳤습니다.\n\n> **그래서 실무 규칙 하나 — 원본 템플릿의 글자 수를 세어 두고, 그 안에서 씁니다.**\n> 한글은 같은 글자 수라도 영어보다 넓습니다. **템플릿을 만들 때 한글로 만들어 두면** 이 문제가 사라집니다.\n\n배경도 하나 알아 둘 것이 있습니다. AI가 만든 장은 배경이 **단색이 아니라 이미지**로 들어옵니다.\n색만 바꾸고 싶어도 배경을 통째로 갈아야 합니다. **직접 만든 템플릿은 단색으로 두세요.**"}, {"title": "✅ 확인", "md": "- [ ] 모든 장이 **같은 비율(4:5)인가**\n- [ ] 장수가 **7~10장 사이인가**\n- [ ] 각 장에 생각이 **하나씩만** 들어 있나\n- [ ] 첫 장이 **멈출 이유**를 주나 (단순 제목이 아닌가)\n- [ ] 마지막 장이 **행동 하나만** 시키나\n- [ ] 다섯 장을 나란히 놓았을 때 **같은 집 식구처럼 보이나**\n- [ ] 글자 크기를 **한 장도 손대지 않았나**\n- [ ] 각 장의 **대체 텍스트**를 적어 두었나\n\n「같은 집 식구처럼 보이나」가 «아니오»면 대개 원인은 셋 중 하나입니다 — 글자 크기를 손댔거나, 사진 색감이 다르거나, 템플릿을 다시 골랐거나."}, {"title": "🔎 더 깊이", "md": "- 여기서 만든 템플릿은 <a class=\"xref\" href=\"#10\">Stage 10<\/a>에서 계속 씁니다. 매번 새로 만들지 않습니다.\n- 그림 안 글자의 대체 텍스트는 이 스테이지 7절 「접근성 3종」과 이어집니다.\n- 검색해 볼 말 — `carousel post design`, `1080x1350`, `save rate social`\n- 캔바 유료 기능(브랜드 킷)이 필요해지는 시점의 판단은 <a class=\"xref\" href=\"#부록\">부록<\/a>에."}]}, {"file": "09-캐릭터.md", "id": "s4-9", "no": "9", "title": "캐릭터 일관성 — 생성이 아니라 편집으로", "goals": ["같은 얼굴을 유지하는 방법이 «생성»이 아니라 «편집»인 이유를 말할 수 있다", "캐릭터 기준 컷 한 장과 참조 3~5장을 만들 수 있다"], "steps": ["왜 안 되는지부터", "방향을 뒤집습니다", "참조 3~5장은 여전히 유효합니다", "캐릭터 바이블", "새로 생성해야 할 때"], "through": "매번 새로 만들면 얼굴이 바뀐다. 한 장을 잘 만들고 그것을 편집한다.", "time": "70분", "need": ["어도비 계정", "5절의 무드보드"], "head": "브랜드 캐릭터를 하나 만들어서 여러 장면에 쓰고 싶은 상황을 생각해 봅시다.\n카드뉴스 여덟 장, 소개 페이지, 프로필 그림.\n\nAI에게 \"같은 캐릭터를 책상 앞에, 걸어가는 모습으로, 웃는 얼굴로\" 시켜 보면\n**전부 다른 사람이 나옵니다.** 머리 모양이 바뀌고 나이가 바뀌고 옷이 바뀝니다.\n프롬프트를 아무리 자세하게 써도 마찬가지입니다.\n\n여기서 대부분 포기하거나, 전용 도구를 찾아 헤매게 됩니다.\n**그럴 필요가 없습니다. 방향을 뒤집으면 됩니다.**\n\n이 절은 이 스테이지에서 가장 중요한 절입니다.\n여기서 익히는 사고방식 — **\"생성으로 안 되면 편집으로\"** — 은 캐릭터 말고도 계속 쓰입니다.", "secs": [{"title": "① 왜 안 되는지부터", "md": "AI 그림 도구는 **매번 처음부터 새로 그립니다.**\n\"검은 단발머리 30대 여성\"이라고 말하면 그 조건에 맞는 사람을 **새로 상상해서** 그립니다.\n조건에 맞는 얼굴은 수천만 개가 있고, 매번 다른 하나가 나옵니다.\n\n즉 **글자만으로 같은 얼굴을 매번 새로 만드는 것은 실패합니다.**\n이건 프롬프트를 못 써서가 아니라 **방식 자체가 그렇게 되어 있어서**입니다.\n\n포기해야 할 기대는 이것 하나입니다.\n**\"프롬프트를 더 정교하게 쓰면 얼굴이 고정될 것이다.\"** — 안 됩니다."}, {"title": "② ★ 방향을 뒤집습니다 — 한 장을 잘 만들고 그것을 편집한다", "md": "| 안 되는 길 | 되는 길 |\n|---|---|\n| 장면마다 프롬프트로 **새로 생성** → 얼굴이 매번 바뀐다 | **한 장을 잘 만들고 그 장을 편집** → 얼굴이 안 바뀐다 |\n\n편집은 **이미 있는 그림의 픽셀을 건드리는 일**입니다.\n얼굴을 안 건드리면 얼굴은 그대로입니다. 당연한 이야기인데, 이게 답입니다.\n\n### 다섯 단계\n\n**① 기준 컷 한 장을 공들여 만듭니다**\n\n이 한 장에 시간을 다 씁니다. 스무 번을 다시 만들어도 됩니다.\n정면 또는 살짝 비스듬한 각도, 표정은 무난하게, 배경은 단순하게.\n**이 한 장이 앞으로 모든 그림의 원본이 됩니다.**\n\n**② 생성형 확장으로 배경을 넓힙니다**\n\n기준 컷이 가로로 짧으면 카드뉴스나 배너에 못 씁니다.\n그림의 가장자리를 바깥으로 늘려 주는 기능을 씁니다. **캐릭터는 그대로 두고 주변만 생겨납니다.**\n세로 그림 하나로 가로 배너를 만들 수 있습니다.\n\n**③ 영역 채우기로 배경과 소품만 바꿉니다**\n\n\"이 부분을 이렇게 바꿔라\"고 지정해서 그 부분만 다시 그리게 하는 기능입니다.\n배경을 사무실에서 카페로, 손에 든 물건을 컵에서 노트로.\n**얼굴 영역만 안 건드리면 얼굴은 절대 안 바뀝니다.**\n\n여기에 **프롬프트로 영역을 지정하는 기능**을 쓰면 더 쉽습니다.\n\"배경\"이라고 말하면 배경만 골라 줍니다. 손으로 칠할 필요가 없습니다.\n\n**④ 배경을 제거해서 다른 장면에 얹습니다**\n\n캐릭터만 오려 냅니다. 그러면 어떤 배경에도 얹을 수 있습니다.\n카드뉴스 여덟 장에 같은 캐릭터를 놓는 가장 확실한 방법입니다. **오려 낸 것은 절대 안 변합니다.**\n\n**⑤ 벡터화해서 크기를 자유롭게 만듭니다**\n\n그림을 선과 면의 정보로 바꾸는 것입니다.\n그러면 **아무리 키워도 안 깨집니다.** 명함 크기부터 현수막까지 같은 그림을 씁니다.\n단순한 그림체일수록 잘 됩니다.\n\n### 순서를 그림으로\n\n```\n기준 컷 1장 (공들여)\n   ↓\n배경 넓히기 → 비율이 필요한 만큼\n   ↓\n영역 채우기 → 배경·소품·옷 바꾸기 (얼굴은 손대지 않음)\n   ↓\n배경 제거 → 캐릭터만 오려내기\n   ↓\n벡터화 → 크기 자유\n   ↓\n장면마다 얹어서 쓰기\n```"}, {"title": "③ 참조 3~5장은 여전히 유효합니다", "md": "편집으로 간다고 참조가 필요 없어지는 건 아닙니다.\n새 그림을 만들 때 **얼굴 참조를 함께 주는 것**은 그대로 효과가 있습니다.\n\n- **정면** 1장\n- **3/4 각도**(살짝 옆으로) 1~2장\n- **측면** 1장\n\n이 셋에서 다섯 장을 만들어 두고, **5절에서 만든 보드에 모아 둡니다.**\n매번 찾아 헤매지 않게, 한 자리에 있어야 합니다.\n안정성이 더 필요하면 각도를 여덟 개까지 늘립니다. 다만 **참조가 많다고 무조건 좋아지진 않습니다.**"}, {"title": "④ 캐릭터 바이블 — 다섯 칸", "md": "캐릭터를 계속 쓸 거라면 **문서로 적어 둡니다.** 머릿속에 있으면 다음 달에 달라집니다.\n\n| 칸 | 무엇 |\n|---|---|\n| **턴어라운드** | 같은 캐릭터의 정면·3/4·측면·뒷모습 그림 |\n| **색 팔레트** | 피부·머리·옷의 색 값. **규칙표처럼 숫자로** 적습니다 |\n| **표정 세트** | 기본 · 웃음 · 곤란함 정도 셋이면 시작으로 충분 |\n| **포즈** | 자주 쓸 자세 두세 개 (서 있기, 앉아서 작업, 가리키기) |\n| **금지 사항** | 하지 말아야 할 것. **이게 가장 중요합니다** |\n\n금지 사항 예 — \"안경을 씌우지 않는다\" \"머리 길이를 바꾸지 않는다\" \"옷 색은 팔레트 밖으로 나가지 않는다\".\n**금지 목록이 있으면 AI가 덜 헤맵니다.** 4절 「하지 말 것」과 같은 원리입니다."}, {"title": "⑤ 새로 생성해야 할 때 — 프롬프트 4단", "md": "편집으로 안 되고 꼭 새로 만들어야 할 때가 있습니다. 그때는 순서를 지킵니다.\n\n```\n[1. 정체성 앵커]\n검은 단발머리, 둥근 안경, 겨자색 니트를 입은 30대 여성.\n얼굴형은 둥글고 눈은 크지 않음. 참조 이미지의 인물과 동일 인물.\n\n[2. 대상과 행동]\n책상 앞에 앉아 노트북 화면을 보며 메모하고 있다.\n\n[3. 구도]\n상반신, 살짝 비스듬한 각도(3/4), 왼쪽에 인물 오른쪽에 여백.\n\n[4. 금지]\n얼굴을 바꾸지 마. 머리 길이·안경 모양·니트 색을 바꾸지 마.\n나이를 바꾸지 마. 참조 이미지의 얼굴을 그대로 유지해.\n```\n\n**4단이 가장 중요합니다.** 금지를 안 쓰면 AI가 \"더 예쁘게\" 바꿔 놓습니다.\n그리고 **참조 이미지를 반드시 함께 올립니다.** 글만으로는 안 됩니다.\n\n이렇게 해도 얼굴이 바뀌면 — **세 번에서 멈춥니다**(5절 「세 번 규칙」).\n네 번째 프롬프트 대신 **편집으로 돌아갑니다.**"}, {"title": "📘 말 풀이", "md": "**생성형 확장(generative expand)**\n그림의 바깥쪽을 AI가 이어 그려서 화면을 넓히는 것. 세로 그림을 가로로 만들 때 씁니다. 원래 있던 부분은 안 건드립니다.\n\n**영역 채우기(generative fill)**\n그림의 일부만 골라서 그 부분만 다시 그리게 하는 것. 배경이나 소품을 바꿀 때 씁니다. 고르지 않은 부분은 그대로 남습니다.\n\n**벡터화(vectorize)**\n점으로 된 그림을 선과 면의 정보로 바꾸는 것. 크기를 키워도 안 깨집니다."}, {"title": "⚠️ 함정", "md": "- **기준 컷을 대충 만듭니다.** 여기가 원본입니다. **여기에 시간을 다 씁니다.** 나중에 백 장이 이 한 장에서 나옵니다.\n- **프롬프트를 계속 정교하게 씁니다.** 방식의 한계라 안 됩니다. 세 번에서 멈추고 편집으로 갑니다.\n- **영역 채우기로 얼굴을 건드립니다.** 얼굴이 포함되는 순간 다른 사람이 됩니다. **얼굴 밖만** 고칩니다.\n- **참조를 매번 새로 찾습니다.** 보드에 모아 두지 않으면 매번 다른 참조를 쓰게 되고, 그럼 결과도 매번 달라집니다.\n- **금지 사항을 안 적습니다.** AI는 \"개선\"을 하려 합니다. 막지 않으면 안경을 씌우고 머리를 기르게 합니다.\n- **사람 얼굴로 실존 인물을 닮게 만듭니다.** 실제 인물을 닮은 얼굴을 만들거나 쓰지 않습니다. 캐릭터는 실존 인물과 구분되게 만듭니다."}, {"title": "⚡ 따라 하기", "md": "1. 5절의 보드에 **캐릭터 칸**을 만듭니다.\n2. 기준 컷 한 장을 만듭니다. **마음에 들 때까지 다시 만듭니다.** 이 단계에서 시간을 아끼지 않습니다.\n3. 그 한 장에서 **정면 · 3/4 · 측면**을 만들어 참조 3~5장을 갖춥니다. 보드에 넣습니다.\n4. 캐릭터 바이블 다섯 칸을 문서로 적습니다. **금지 사항 세 줄은 반드시.**\n5. 이제 장면을 만듭니다. **편집으로만** 갑니다.\n\n```\n아래 순서로 이 캐릭터를 다른 장면에 넣어줘. 얼굴은 어떤 단계에서도 건드리지 마.\n\n1) 배경을 넓혀서 가로로 긴 비율로 만들어줘. 인물 위치는 왼쪽에 두고 오른쪽에 여백을 만들어줘\n2) 배경만 골라서 카페 실내로 바꿔줘. 인물과 옷은 그대로 둬\n3) 인물만 남기고 배경을 제거해줘\n4) 결과를 크기 조절해도 안 깨지는 형태로 바꿔줘\n\n각 단계마다 결과를 보여주고, 얼굴이 바뀌었는지 내가 확인할 수 있게 원본과 나란히 보여줘.\n```\n\n6. 각 단계마다 **원본 얼굴과 나란히 놓고 봅니다.** 바뀌었으면 그 단계를 다시 합니다."}, {"title": "✅ 확인", "md": "- [ ] **기준 컷 한 장**이 있고, 그 파일이 어디 있는지 아나\n- [ ] 참조 3~5장(정면·3/4·측면)이 **한 자리에 모여** 있나\n- [ ] 캐릭터 바이블 다섯 칸을 **문서로** 적었나\n- [ ] **금지 사항이 세 줄 이상** 있나\n- [ ] 편집으로 만든 그림 셋을 나란히 놓았을 때 **같은 인물로 보이나**\n- [ ] 배경만 바꾼 그림에서 **얼굴이 원본과 똑같은가** (눈·코 위치를 나란히 비교해 봤나)\n\n「같은 인물로 보이나」가 «아니오»면 대개 **어딘가에서 새로 생성했기 때문**입니다. 편집만 썼는지 되짚어 봅니다."}, {"title": "🔎 더 깊이", "md": "- 여기서 만든 캐릭터는 8절 카드뉴스와 <a class=\"xref\" href=\"#10\">Stage 10<\/a>에서 계속 씁니다.\n- 도구별로 어느 단계를 어디서 하는지는 다음 절 「도구 셋의 자리」에 표로 있습니다.\n- 검색해 볼 말 — `character sheet turnaround`, `generative fill`, `character consistency reference images`\n- AI로 만든 사람 그림을 상업적으로 쓸 때의 표시와 권리 문제는 <a class=\"xref\" href=\"#10\">Stage 10<\/a>에서 다룹니다."}]}, {"file": "10-도구순서.md", "id": "s4-10", "no": "10", "title": "도구 셋의 자리와 이동 순서", "goals": ["피그마·캔바·어도비를 각자 자리에 맞게 나눠 쓸 수 있다", "참조 수집부터 접근성 점검까지 순서대로 지나갈 수 있다"], "steps": ["도구 셋의 자리", "실제 이동 순서", "한글 글꼴 실무", "도구를 늘리지 않습니다"], "through": "도구를 늘리지 않는다. 각자 자리를 정하고 순서대로 지나간다.", "time": "45분", "need": ["피그마 계정", "캔바 계정", "어도비 계정"], "head": "여기까지 오면 도구가 셋입니다. 피그마, 캔바, 어도비.\n셋이 하는 일이 겹쳐 보이기 때문에 **매번 \"이건 어디서 하지?\"에서 멈춥니다.**\n그 망설임이 쌓이면 작업이 안 굴러갑니다.\n\n이 절에서 **각 도구의 자리를 못 박고, 지나가는 순서를 정합니다.**\n정하고 나면 다시 고민하지 않습니다. 그게 목적입니다.", "secs": [{"title": "① 도구 셋의 자리", "md": "| 도구 | **무엇에 쓰나** | **안 쓰는 곳** |\n|---|---|---|\n| **피그마** | **규칙 저장소.** 색·간격·글꼴을 변수로 등록하고, 화면 뼈대를 그립니다 | **발행물을 대량으로 찍어내는 일.** 카드뉴스 여덟 장을 여기서 만들지 않습니다 |\n| **캔바** | **발행물.** 카드뉴스·배너·문서. 템플릿 하나를 고정해서 텍스트만 갈아 끼웁니다 | **웹 화면 설계와 코드.** 여기서 만든 것은 코드가 되지 않습니다 |\n| **어도비** | **편집과 마무리.** 배경 제거 · 색과 노출 보정 · 블러와 그레인 · 영역 지정과 채우기 · 배경 넓히기 · 벡터화 · 참조를 모으는 보드 · 영상 편집 | **처음부터 새로 생성하는 일.** 여기는 이미 있는 것을 손보는 자리입니다 |\n\n한 줄로 외웁니다.\n**피그마는 규칙, 캔바는 발행, 어도비는 마무리.**\n\n### 짚어 둘 것 둘\n\n**캔바는 무료 플랜입니다.** 브랜드 킷을 만들 수 없습니다.\n그래서 일관성은 **템플릿 고정 → 텍스트만 교체**로 잡습니다(8절). 이게 무료에서 되는 유일한 길입니다.\n\n**어도비는 편집 도구로 씁니다.** 생성 쪽이 아니라 **손보는 쪽이 강한 자리**입니다.\n9절에서 캐릭터를 \"생성이 아니라 편집으로\" 푼 것이 이 성질을 그대로 쓴 것입니다."}, {"title": "② 실제 이동 순서 — 여덟 걸음", "md": "앞 절들이 이 순서대로 놓여 있습니다. 위에서부터 그대로 지나갑니다.\n\n| 걸음 | 무엇을 | 어디서 | 어느 절 |\n|---|---|---|---|\n| **1** | 참조를 모은다 (색감·질감·여백·이건 아니다) | **어도비 보드** | 5절 |\n| **2** | 규칙 3종을 확정한다 (색·간격·글자) | **피그마 변수** | 1·2·3절 |\n| **3** | 그 규칙을 **지침 파일에 적는다** | 지침 파일 (Stage 3) | 3절 |\n| **4** | 랜딩 화면을 **코드로 만든다** | 코드 생성 | 6절 |\n| **5** | 그림·소재를 만든다 (기준 컷 포함) | 그림 생성 도구 | 9절 |\n| **6** | 만든 소재를 **편집하고 마무리한다** | **어도비** | 9절 |\n| **7** | 발행물을 찍는다 (카드뉴스·배너) | **캔바, 템플릿 고정** | 8절 |\n| **8** | **접근성 3종을 점검한다** | 화면에서 직접 | 7절 |\n\n세 걸음이 특히 자주 어긋납니다.\n\n- **3번을 건너뜁니다.** 피그마에만 규칙이 있으면 AI는 못 읽습니다. **파일에 적힌 것만 지켜집니다.**\n- **4번과 5번을 바꿉니다.** 그림을 먼저 잔뜩 만들고 화면을 짜면 그림이 안 맞아 다시 만들게 됩니다. **틀이 먼저, 소재가 나중.**\n- **8번을 나중으로 미룹니다.** 점검을 마지막으로 미루면 고칠 곳이 백 군데가 됩니다. 걸음마다 조금씩 봐 두는 게 낫습니다."}, {"title": "③ 한글 글꼴 실무 — 무거운 게 문제입니다", "md": "한글 화면에서 반드시 걸리는 문제 하나를 짚습니다.\n\n**Pretendard가 사실상 표준**입니다. 무료로 쓸 수 있고 화면에서 잘 읽히고, 굵기가 여러 단계 있습니다.\n고민할 일이 있으면 여기서 시작하면 됩니다.\n\n문제는 **무게**입니다.\n\n영문 글꼴은 글자가 수십 개라 파일이 가볍습니다.\n한글은 **글자 수가 만 개가 넘습니다.** 그래서 **한글 웹폰트 파일은 수백 KB에서 수 MB**까지 갑니다.\n아무 처리 없이 그대로 불러오면 **첫 화면이 눈에 띄게 느려집니다.**\n글자가 늦게 나타나거나, 처음엔 다른 글꼴로 보이다가 갑자기 바뀝니다.\n\n처리 방법은 두 가지고, 둘 다 AI에게 시킬 수 있습니다.\n\n- **필요한 글자만 잘라 쓰기(서브셋)** — 실제로 쓰는 글자만 남겨 파일을 줄입니다\n- **글꼴이 늦게 와도 글을 먼저 보여 주기** — 글꼴을 기다리느라 화면이 비어 있지 않게 합니다\n\n**⚠️ 실측(2026-09-09)** — **어도비의 글꼴 검색은 한글 서체를 하나도 찾지 못합니다.**\n그래서 한글 글꼴은 **어도비에서 고르지 않습니다.** 이름을 정해서 웹에서 직접 가져다 씁니다."}, {"title": "④ 도구를 늘리지 않습니다", "md": "새 도구가 눈에 띄면 늘리고 싶어집니다. **늘리지 않습니다.**\n<a class=\"xref\" href=\"#0\">Stage 0<\/a>에서 정한 원칙과 같습니다 — 도구를 늘릴수록 빨라지는 게 아니라 **흐름이 끊깁니다.**\n\n셋으로 못 하는 게 생기면 먼저 물어봅니다.\n**\"이건 정말 도구가 없어서 안 되는 건가, 아니면 순서를 안 지켜서 안 되는 건가?\"**\n대부분 뒤쪽입니다. 9절이 그 예입니다 — 전용 도구가 없어도 **편집으로 풀렸습니다.**"}, {"title": "📘 말 풀이", "md": "**웹폰트(web font)**\n사이트에 접속한 사람의 컴퓨터에 그 글꼴이 없어도 보이도록, 글꼴 파일을 같이 내려보내는 방식. 한글은 파일이 커서 처리가 필요합니다.\n\n**서브셋(subset)**\n글꼴 파일에서 실제로 쓰는 글자만 잘라 내 가볍게 만드는 것. 한글에서는 거의 필수입니다."}, {"title": "⚠️ 함정", "md": "- **도구마다 색을 눈으로 다시 고릅니다.** 세 도구에서 각각 고르면 세 가지 색이 됩니다. **규칙표의 값을 직접 입력합니다.**\n- **캔바에서 웹 화면을 설계합니다.** 예쁘게 나와도 코드로 못 넘어갑니다. 화면은 피그마와 코드에서 합니다.\n- **피그마에서 카드뉴스 여덟 장을 만듭니다.** 됩니다. 다만 느립니다. 발행물은 캔바입니다.\n- **어도비에서 처음부터 그림을 만들려 합니다.** 여기는 손보는 자리입니다. 만드는 것과 손보는 것을 섞지 않습니다.\n- **한글 글꼴을 그대로 불러옵니다.** 첫 화면이 느려집니다. 잘라 쓰기와 늦게 와도 글부터 보여 주기, 둘 다 겁니다.\n- **어도비에서 한글 글꼴을 찾습니다.** 안 나옵니다. 시간 낭비입니다."}, {"title": "⚡ 따라 하기", "md": "1. 위 「도구 셋의 자리」 표를 **지침 파일에 그대로 붙입니다.** 다음에 헷갈리면 여기를 봅니다.\n2. **여덟 걸음을 종이에 적고** 지금 내가 몇 번째에 있는지 표시합니다.\n3. 세 도구를 각각 열어 **규칙표의 색 값을 직접 입력**해 봅니다. 눈으로 고르지 않습니다.\n4. 한글 글꼴을 코드에 넣을 때 AI에게 아래를 시킵니다.\n\n```\n이 화면에 한글 웹폰트 Pretendard를 넣어줘. 조건은 이래.\n\n- 한글 웹폰트는 파일이 커서 첫 화면이 느려질 수 있어. 그걸 막는 처리를 같이 해줘\n  · 실제로 쓰는 글자만 남기는 방법이 있으면 적용해줘\n  · 글꼴이 늦게 와도 글자가 먼저 보이게 해줘\n- 굵기는 보통과 굵게 두 가지만 불러와줘. 나머지는 불러오지 마\n- 글꼴이 아직 안 왔을 때 대신 보여줄 글꼴을 지정해줘\n\n적용한 뒤에 파일 크기가 대략 얼마나 되는지, 첫 화면에 어떤 영향이 있는지 알려줘.\n추측이면 추측이라고 표시해줘.\n```\n\n5. 마지막으로 **8번 걸음(접근성 3종)**을 돕니다. 7절의 점검 프롬프트를 그대로 씁니다.\n\n### 이렇게 해 봤습니다 — 2026-09-09 · Code Connect는 안 됩니다\n\n앞에서 「피그마 시안과 코드를 잇는 장치(Code Connect)」를 언급했는데, **실제로 불러 보니 막혔습니다.**\n\n> *\"Code Connect를 쓰려면 **Organization 또는 Enterprise 플랜**의 Dev 또는 Full 시트가 필요합니다.\"*\n\n계정은 **Pro 팀 · Full 시트**였습니다. **시트는 되는데 플랜 등급이 모자랍니다.**\n즉 1인이나 소규모 팀이 흔히 쓰는 요금제에서는 이 기능을 못 씁니다.\n\n**그래서 이 커리큘럼은 Code Connect 없이 갑니다.** 대신 앞 3절의 **규칙표(변수)** 가 그 자리를 대신합니다.\n변수는 Pro에서 됩니다 — 시안에서 묶어 두면 코드로 받을 때 이름이 그대로 따라옵니다. 그거면 1인에게는 충분합니다."}, {"title": "✅ 확인", "md": "- [ ] **\"피그마는 규칙, 캔바는 발행, 어도비는 마무리\"**를 보지 않고 말할 수 있나\n- [ ] 여덟 걸음 중 **지금 내가 몇 번째인지** 말할 수 있나\n- [ ] 규칙표의 색 값이 **세 도구에 똑같이** 들어가 있나 (눈으로 고른 색이 섞이지 않았나)\n- [ ] 한글 글꼴을 넣은 뒤 **첫 화면에서 글자가 늦게 뜨거나 갑자기 바뀌지 않나**\n- [ ] 도구를 **셋에서 늘리지 않았나**"}, {"title": "🔎 더 깊이", "md": "- 피그마·캔바를 실제로 돌려 본 기록은 <span class=\"egfile\">실측 아홉<\/span>에 있습니다.\n\n- 이 여덟 걸음의 결과물(규칙표·랜딩 코드·카드뉴스 템플릿·캐릭터 참조)이 <a class=\"xref\" href=\"#5\">Stage 5<\/a>와 <a class=\"xref\" href=\"#10\">Stage 10<\/a>의 재료입니다.\n- 만든 것을 되돌릴 수 있게 저장하는 법은 <a class=\"xref\" href=\"#4.5\">Stage 4.5<\/a>에서.\n- 검색해 볼 말 — `Pretendard`, `한글 웹폰트 서브셋`, `font-display swap`\n- 도구별 요금·플랜 차이는 본문에 두지 않습니다 → <a class=\"xref\" href=\"#부록\">부록<\/a>의 「버전과 값」"}]}]}, {"folder": "045-버전관리", "key": "4.5", "name": "버전 관리", "color": "#fb7185", "sub": "되돌릴 수 있게 만든다", "goal": "되돌릴 수 있게 만든다. 그래야 과감히 시킨다", "makes": "저장소 · 커밋 규칙 · 되돌리기 연습", "time": "2시간", "need": ["GitHub 계정"], "head": "혼자인데 왜 버전 관리를 하냐면 — **AI에게 크게 시키기 위해서**입니다.\n되돌릴 수 있으면 과감해지고, 없으면 매번 조심스러워집니다.", "metasecs": [{"title": "✅ 자가 체크", "md": "- [ ] **일부러 망치고 되돌려** 봤나 (읽기만 하고 넘어가면 안 됩니다)\n- [ ] 커밋하기 전에 **비밀값이 섞였는지 확인**하는 습관이 생겼나\n- [ ] 「아직 커밋 안 함 / 커밋했는데 안 밀었음 / 이미 밀었음」 셋의 처리가 다르다는 걸 아나\n- [ ] 날린 것 같을 때 **먼저 볼 곳**을 아나"}, {"title": "다음으로", "md": "여기서 만든 저장소가 Stage 7의 PR과 검사가 걸리는 자리가 됩니다."}], "sections": [{"file": "1-왜혼자서.md", "id": "s4_5-1", "no": "1", "title": "혼자서도 안전망 만들기", "goals": ["버전 관리를 하는 이유를 «AI에게 크게 시키기 위해서»라고 말할 수 있다", "저장소가 사진첩이 아니라 되감기 되는 영상인 이유를 설명할 수 있다", "Git과 GitHub이 다른 것임을 구분할 수 있다"], "steps": ["안전망이 있을 때와 없을 때를 비교한다", "폴더 복사의 구멍 셋을 본다", "사진첩이 아니라 영상으로 본다", "이 장에서 손에 남는 것을 확인한다"], "through": "되돌릴 수 있어야 과감하게 시킬 수 있다.", "time": "15분", "need": ["GitHub 계정"], "head": "버전 관리는 여러 명이 같이 일할 때 쓰는 것이라고 알려져 있어서, 혼자 만드는 사람은 대개 건너뜁니다. 혼자인데도 해야 하는 이유는 하나 — **AI에게 크게 시키기 위해서**입니다.", "secs": [{"title": "① 안전망이 있을 때와 없을 때를 비교한다", "md": "AI에게 \"이 폴더 전체를 정리해줘\"라고 시켜 본 적이 있다면 압니다. 시키는 순간 불안해집니다. 잘못되면 되돌릴 방법이 없기 때문입니다.\n\n| 안전망이 없을 때 | 안전망이 있을 때 |\n|---|---|\n| \"이 파일 한 줄만 고쳐줘\" | \"이 기능 전체를 다시 짜줘\" |\n| 결과를 손으로 검사 | 마음에 안 들면 한 줄로 되감기 |\n| 미리 파일을 복사해 둠 | 복사해 둘 필요가 없음 |\n| 큰 실험을 안 하게 됨 | 실험이 공짜가 됨 |\n\n조심스러우면 손으로 하는 것보다 조금 빠른 정도로 끝납니다. **되돌릴 수 있으면 시키는 크기가 달라집니다.** 그게 이 장의 전부입니다."}, {"title": "② 폴더 복사의 구멍 셋을 본다", "md": "많은 분이 이미 나름의 버전 관리를 하고 있습니다.\n\n```\n기획서.docx\n기획서_최종.docx\n기획서_최종_진짜최종.docx\n기획서_최종_진짜최종_수정본.docx\n```\n\n이 방식에는 구멍이 셋입니다. 무엇이 바뀌었는지 모르고, 왜 바꿨는지 모르고, 일부만 되돌릴 수 없습니다. 3개월 뒤의 나는 남이고 **AI는 기억이 아예 없습니다.**\n\n버전 관리는 이 셋을 한꺼번에 해결합니다. 무엇이·왜·언제 바뀌었는지가 파일과 함께 보관되고, 원하는 지점 하나만 골라 되돌릴 수 있습니다."}, {"title": "③ 사진첩이 아니라 영상으로 본다", "md": "저장소를 \"백업 폴더\"로 이해하면 절반만 맞습니다.\n\n- **사진첩** — 특정 순간의 사진 여러 장. 사진 사이에 무슨 일이 있었는지는 없습니다.\n- **되감기 되는 영상** — 처음부터 지금까지가 끊기지 않고 들어 있습니다. 아무 지점으로나 되감을 수 있습니다.\n\n저장소는 뒤쪽입니다. 파일의 현재 모습만이 아니라 그 파일이 지나온 모든 순간을 같이 들고 있습니다."}, {"title": "④ 이 장에서 손에 남는 것을 확인한다", "md": "| 만드는 것 | 어디에 쓰이나 |\n|---|---|\n| 내 저장소 하나 | 앞으로 만드는 코드가 전부 여기에 쌓입니다 |\n| `.gitignore` 파일 | 비밀값이 실수로 새어 나가는 걸 막습니다 |\n| 커밋 규칙 한 줄 | AI가 대신 지켜 줍니다 |\n| 되돌리기 연습 1회 | 진짜로 망했을 때 손이 먼저 움직입니다 |\n\n> **THE CHAIN** — 여기서 만드는 저장소가 <a class=\"xref\" href=\"#7\">Stage 7<\/a>에서 PR과 자동 검사가 걸리는 자리가 됩니다. 저장소가 없으면 Stage 7이 통째로 막힙니다."}, {"title": "⚡ 따라 하기", "md": "1. 지금 쓰는 AI 도구 대화창에 아래를 그대로 붙여넣으세요. 저장소를 만들기 전에 도구가 깔려 있는지부터 봐야 합니다. 버전 숫자 한 줄이 돌아오면 준비된 것입니다.\n\n```\n내 맥에 git이 깔려 있는지 확인해줘.\n`git --version`을 실행하고, 안 깔려 있으면 어떻게 까는지 알려줘.\n깔려 있으면 버전만 한 줄로 보고해줘.\n```\n\n2. 이어서 아래를 붙여넣으세요. 내가 모르는 새 이미 저장소가 된 폴더가 있는지 알아 두기 위해서입니다. 표가 나오거나 «없다»는 답이 옵니다 — **아무것도 없어도 정상입니다.** 다음 절에서 처음부터 하나 만듭니다.\n\n```\n내 홈 폴더 아래에서 이미 git 저장소인 폴더가 있는지 찾아줘.\n있으면 폴더 이름과 마지막으로 저장된 날짜를 표로 보여줘. 내용은 건드리지 마.\n```"}, {"title": "✅ 확인", "md": "- [ ] `git --version`을 실행했을 때 에러가 아니라 글자와 숫자가 한 줄 나왔나\n- [ ] 「저장소는 지금 모습만이 아니라 지나온 과정을 같이 갖고 있다」를 한 문장으로 말할 수 있나\n- [ ] 「Git은 내 컴퓨터, GitHub은 인터넷 창고」 둘이 다른 것이라는 걸 아나"}, {"title": "📘 말 풀이", "md": "**저장소(repository, 줄여서 repo)** — 파일과 그 파일이 지나온 모든 순간을 함께 보관하는 폴더. 겉보기엔 그냥 폴더인데 숨은 기록 창고가 하나 더 들어 있습니다.\n\n**Git과 GitHub** — Git은 내 컴퓨터에서 도는 프로그램으로, 순간을 기록하고 되감습니다. GitHub은 그 기록을 인터넷에 올려 두는 남의 창고입니다. Git만 있어도 되돌리기는 전부 됩니다.\n\n**커밋(commit)** — 지금 상태를 이름 붙여 저장하는 것. 영상으로 치면 되감기 표시를 하나 꽂는 일입니다. 4절에서 다룹니다."}, {"title": "⚠️ 함정", "md": "**\"코드가 없으면 필요 없다\"고 생각합니다.** 기획서·설계문서·설정 파일도 전부 대상입니다. 오히려 글이 더 자주 뒤집힙니다.\n\n**\"나중에 붙이면 되지\"라고 미룹니다.** 버전 관리는 망하기 전에 있어야 의미가 있습니다. 망한 뒤에 시작하면 되돌릴 과거가 없습니다.\n\n**완벽하게 이해한 뒤에 시작하려 합니다.** Git에는 명령이 백 개 넘게 있지만 혼자 쓰는 데 필요한 건 열 개 안쪽입니다.\n\n**AI가 알아서 해 줄 거라 믿습니다.** AI는 시키면 커밋해 줍니다. 하지만 무엇을 되돌릴지 정하는 건 사람입니다."}, {"title": "🔎 더 깊이", "md": "- 실제로 저장소를 만드는 건 다음 절입니다 → 2절 「계정과 저장소 만들기」\n- 이 저장소가 검사와 PR의 자리가 되는 건 <a class=\"xref\" href=\"#7\">Stage 7<\/a>입니다.\n- 검색해 볼 말 — `git 공식 문서 한국어`, `GitHub Docs 시작하기`, `what is version control`"}]}, {"file": "2-계정과저장소.md", "id": "s4_5-2", "no": "2", "title": "계정과 저장소 만들기", "goals": ["GitHub 계정과 비공개 저장소를 만들 수 있다", "터미널에서 GitHub CLI로 로그인할 수 있다", "내 폴더를 인터넷 저장소에 연결할 수 있다"], "steps": ["세 걸음을 표로 본다", "계정을 만든다", "저장소를 만든다", "로그인 도구를 깔고 로그인한다", "내 폴더를 연결한다"], "through": "여기서 가장 많이 멈춘다. 막히는 자리는 거의 항상 로그인이다.", "time": "30분", "need": ["GitHub 계정"], "head": "초보자가 이 장에서 가장 많이 멈추는 자리가 여기입니다. 저장소까지는 잘 만들어 놓고, 내 컴퓨터의 파일을 인터넷 창고로 올리는 순간 이런 게 뜹니다.\n\n```\nremote: Support for password authentication was removed.\nfatal: Authentication failed\n```", "secs": [{"title": "① 세 걸음을 표로 본다", "md": "위 메시지를 옮기면 \"비밀번호로는 안 받습니다\"입니다. GitHub은 웹사이트 로그인 비밀번호로 파일을 올리는 걸 막았기 때문에, **아이디와 비밀번호를 아무리 정확히 쳐도 실패합니다.** 별도의 로그인 절차가 따로 필요합니다.\n\n| 걸음 | 어디서 | 무엇을 |\n|---|---|---|\n| 계정 만들기 | 웹브라우저 | GitHub에 가입 |\n| 저장소 만들기 | 웹브라우저 | 인터넷 쪽 창고를 하나 판다 |\n| 내 컴퓨터와 연결 | 터미널 | 로그인 → 내 폴더를 창고에 연결 |\n\n앞 둘은 웹사이트에서 버튼만 누르면 됩니다. 셋째가 함정입니다."}, {"title": "② 계정을 만든다", "md": "브라우저에서 github.com 에 들어가 **Sign up**을 누르세요. 이메일·비밀번호·사용자 이름(username)을 넣고, 이메일로 온 숫자를 넣어 인증합니다.\n\n사용자 이름은 나중에 `github.com/사용자이름/저장소이름` 형태의 주소가 됩니다. 회사 이름이나 앞으로 쓸 활동명으로 정하는 편이 낫습니다. 나중에 바꾸면 예전 주소가 전부 깨집니다.\n\n가입 직후 2단계 인증(2FA)을 켜라고 나옵니다. 켜세요. 코드를 올리는 곳이라 계정을 뺏기면 피해가 큽니다."}, {"title": "③ 저장소를 만든다", "md": "오른쪽 위 **+** → **New repository**를 누르세요. 채울 칸은 넷입니다.\n\n| 칸 | 무엇을 넣나 |\n|---|---|\n| Repository name | 영어 소문자와 하이픈으로 (`my-service`). 띄어쓰기·한글은 피합니다 |\n| Description | 한 줄 설명. 비워도 됩니다 |\n| Public / Private | 아래 표를 보고 고릅니다 |\n| Add a README file | 체크합니다. 빈 저장소는 연결이 한 단계 더 번거롭습니다 |\n\n| | 공개(Public) | 비공개(Private) |\n|---|---|---|\n| 누가 보나 | 주소만 알면 누구나 | 나와 내가 초대한 사람만 |\n| 좋은 점 | 자동 검사·보안 스캔 도구가 제약 없이 붙습니다 | 아무도 못 봅니다 |\n| 나쁜 점 | 실수로 올린 비밀값을 전 세계가 봅니다 | 일부 무료 검사 도구가 제한됩니다 |\n\n추천 — 처음 만드는 것은 비공개로 시작합니다. 아직 3절의 비밀값 다루기가 손에 안 붙었기 때문입니다. 비공개→공개는 설정에서 한 번에 되지만, 한 번 공개된 것은 이미 복사됐다고 봐야 합니다.\n\n대안 — 비밀값이 하나도 안 들어가는 글·문서만 담을 폴더라면 공개로 시작해도 됩니다."}, {"title": "④ 로그인 도구를 깔고 로그인한다", "md": "터미널에서 GitHub에 로그인하려면 **GitHub CLI**라는 공식 명령줄 도구를 씁니다. 이걸 쓰면 비밀번호 문제가 통째로 사라집니다.\n\n```bash\nbrew install gh\n```\n> 맥에서 GitHub CLI를 깝니다. `brew`가 없다고 나오면 AI에게 「Homebrew 깔아줘」라고 시킵니다.\n\n```bash\ngh auth login\n```\n> GitHub에 로그인합니다. 화면에서 몇 가지를 물어봅니다.\n\n| 질문 | 고를 것 |\n|---|---|\n| Where do you use GitHub? | GitHub.com |\n| Preferred protocol? | HTTPS |\n| Authenticate Git with your GitHub credentials? | Yes |\n| How would you like to authenticate? | Login with a web browser |\n\n마지막을 고르면 여덟 글자 코드(예: `A1B2-C3D4`)가 뜨고 `Enter`를 누르면 브라우저가 열립니다. 그 코드를 붙여넣고 Authorize를 누르면 끝입니다. 비밀번호를 치는 곳이 아예 없다는 점을 눈여겨보세요."}, {"title": "⑤ 내 폴더를 연결한다", "md": "```bash\ncd ~/projects/my-service\n```\n> 내가 작업할 폴더로 이동합니다. 경로는 본인 폴더에 맞게 바꿉니다.\n\n```bash\ngit init\n```\n> 이 폴더를 저장소로 만듭니다. 숨은 기록 창고가 이때 생깁니다.\n\n```bash\ngit remote add origin https://github.com/사용자이름/저장소이름.git\n```\n> ③에서 만든 저장소를 「이 폴더가 올라갈 곳」으로 지정합니다. `사용자이름`과 `저장소이름`은 본인 것으로 바꿉니다.\n\n```bash\ngit remote -v\n```\n> 이 폴더가 어디로 올라가는지 보여 줍니다. **주소 두 줄이 나오면 성공입니다.**"}, {"title": "⚡ 따라 하기", "md": "한 줄씩 실행하고 결과를 본 뒤 다음으로 가세요.\n\n1. 브라우저에서 github.com 에 가입하고 2단계 인증을 켜세요. 계정을 뺏기면 코드까지 뺏기기 때문입니다. 프로필 화면이 열리면 된 것입니다.\n2. **+ → New repository**에서 이름을 짓고 Private을 고르고 Add a README를 체크한 뒤 Create repository를 누르세요. 저장소 페이지가 열리고 README 한 장이 보여야 합니다.\n3. 터미널을 열고 아래를 차례로 치세요. 비밀번호 대신 쓸 열쇠를 컴퓨터에 심는 단계입니다.\n\n```bash\nbrew install gh\ngh auth login\n```\n> GitHub CLI를 깔고 로그인합니다. ④의 표대로 답하면 브라우저가 열립니다.\n\n```bash\ngh auth status\n```\n> 지금 누구로 로그인돼 있는지 보여 줍니다. 내 사용자 이름이 나오면 성공입니다.\n\n4. 작업 폴더에서 아래를 치세요. 이 폴더가 어느 창고로 올라갈지 정하는 단계입니다. 마지막 줄에서 주소 두 줄이 보여야 합니다.\n\n```bash\ncd ~/projects/내폴더이름\ngit init\ngit remote add origin https://github.com/내사용자이름/내저장소이름.git\ngit remote -v\n```\n> 폴더로 이동 → 저장소로 만들기 → 올라갈 곳 지정 → 확인.\n\n5. 막히면 화면에 뜬 글자를 요약하지 말고 그대로 AI에게 붙여넣으세요. 요약하면 단서가 빠집니다. 한 줄 명령이 돌아오면 그것만 칩니다.\n\n```\n아래는 터미널에 뜬 내용 그대로야. 무슨 뜻인지 알려주고,\n지금 내가 쳐야 할 명령 한 줄만 알려줘. 여러 개 말고 한 줄만.\n\n(여기에 화면 내용을 그대로 붙여넣기)\n```"}, {"title": "✅ 확인", "md": "- [ ] github.com에서 내 저장소 페이지가 열리고 이름 옆에 Private 표시가 보이나\n- [ ] `gh auth status`를 쳤을 때 내 사용자 이름이 나오나\n- [ ] `git remote -v`를 쳤을 때 주소 두 줄이 나오나\n- [ ] 「비밀번호로는 안 되고 별도 로그인이 필요하다」는 걸 아나\n\n하나라도 «아니오»면 다음 절로 넘어가지 않습니다. 여기서 막힌 채로 가면 뒤가 전부 막힙니다."}, {"title": "📘 말 풀이", "md": "**원격 저장소(remote)와 로컬 저장소(local)** — 로컬은 내 컴퓨터 안의 저장소, 원격은 GitHub에 있는 같은 저장소. 둘은 자동으로 같아지지 않습니다. `origin`은 「내가 주로 쓰는 원격 저장소」의 관행적 별명입니다.\n\n**푸시(push)와 클론(clone)** — 푸시는 내 컴퓨터의 기록을 GitHub으로 올리는 것, 클론은 GitHub의 저장소를 통째로 내 컴퓨터에 내려받는 것입니다.\n\n**인증(authentication)** — \"이 사람이 진짜 그 사람인가\"를 확인하는 절차. GitHub CLI로 로그인하면 컴퓨터 안에 안전한 열쇠가 저장되고, 이후로는 묻지 않습니다."}, {"title": "⚠️ 함정", "md": "**`Authentication failed`가 계속 뜹니다.** 비밀번호를 아무리 정확히 쳐도 안 됩니다. `gh auth login`을 먼저 해야 합니다.\n\n**예전에 실패한 로그인 정보가 남아 방해합니다.** 맥의 키체인 접근(Keychain Access) 앱에서 `github.com`을 검색해 낡은 항목을 지운 뒤 다시 `gh auth login` 하면 풀립니다.\n\n**폴더를 잘못 잡고 `git init`을 합니다.** 홈 폴더(`~`)에서 실행하면 컴퓨터 전체가 저장소가 됩니다. 반드시 작업할 폴더 안에서 실행합니다.\n\n**회사 계정과 개인 계정을 한 컴퓨터에서 섞어 씁니다.** `gh auth status`로 지금 누구로 로그인돼 있는지 확인하는 습관을 들입니다."}, {"title": "🔎 더 깊이", "md": "- 올리면 안 되는 것을 거르는 건 바로 다음 절입니다 → 3절 「올리면 안 되는 것 막기」\n- 이 저장소에 자동 검사와 PR을 거는 건 <a class=\"xref\" href=\"#7\">Stage 7<\/a>입니다.\n- 검색해 볼 말 — `GitHub CLI gh auth login`, `GitHub Docs 저장소 만들기`, `git remote add origin`"}]}, {"file": "3-올리면안되는것.md", "id": "s4_5-3", "no": "3", "title": "올리면 안 되는 것 막기", "goals": ["실수로 올린 비밀값은 지우는 게 아니라 새로 발급받는다는 것을 안다", "무엇이 비밀값인지 판단할 수 있다", ".gitignore와 확인 명령 한 줄로 비밀값이 안 올라가게 막을 수 있다"], "steps": ["지워도 남는 이유를 본다", "무엇이 비밀값인지 가른다", ".gitignore를 만든다", "커밋 전 확인 한 줄을 익힌다", "새어 나갔을 때 순서를 본다"], "through": "실수로 올린 비밀값은 지우는 게 아니라 새로 발급받는 것이다.", "time": "25분", "need": ["GitHub 계정"], "head": "이 장에서 가장 위험한 자리입니다. 앞 절들에서 잘못하면 «안 되는» 정도지만, 여기서 잘못하면 남의 카드로 결제가 되거나 내 계정으로 돈이 나갑니다.", "secs": [{"title": "① 지워도 남는 이유를 본다", "md": "보통의 파일은 «올렸다가 잘못됐네 → 지운다 → 없어진다»입니다. 저장소에서는 다릅니다. 지우면 지웠다는 사실이 새로 기록될 뿐, 올렸던 순간은 그대로 남습니다.\n\n되감기 되는 영상이라 그렇습니다. 중간의 한 장면을 도려내도 누구든 그 지점으로 되감으면 비밀값이 그대로 보입니다. 그래서 답이 정해져 있습니다.\n\n> 실수로 올렸으면 **지우는 게 아니라 새로 발급받습니다.**\n\n발급처(결제 서비스, AI 서비스, 데이터베이스)에 들어가 그 열쇠를 폐기하고 새 열쇠를 만드세요. 그 순간 올라간 옛 열쇠는 쓸모없는 글자 줄이 됩니다. 비공개 저장소여도 마찬가지이고, 공개 저장소는 새어 나온 열쇠를 자동으로 주워 가는 프로그램이 실제로 돌아다녀서 더 급합니다."}, {"title": "② 무엇이 비밀값인지 가른다", "md": "이름이 달라도 성질이 같으면 전부 비밀값입니다.\n\n| 부르는 이름 | 무엇 |\n|---|---|\n| API 키(API key) | 바깥 서비스를 쓸 때 \"나 맞습니다\"를 증명하는 긴 글자 줄 |\n| 토큰(token) | 같은 역할. 기한이 있는 경우가 많습니다 |\n| 비밀번호(password) | 데이터베이스·서버 접속용 |\n| 접속 문자열(connection string) | 주소와 비밀번호가 한 줄에 붙어 있는 것 |\n| 인증서 파일(`.pem`, `.key`) | 서버 접속용 열쇠 파일 |\n| 서비스 계정 파일(`.json`) | 구글 등에서 내려받는 자격증명 파일 |\n\n판단 기준 한 줄 — **\"이걸 남이 보면 내 이름으로 뭔가 할 수 있나?\"** 그렇다면 비밀값입니다."}, {"title": "③ .gitignore를 만든다", "md": "`.gitignore`는 저장소 맨 위에 두는 평범한 텍스트 파일입니다. 여기 적힌 이름의 파일은 Git이 아예 못 본 척하니 실수할 기회 자체가 사라집니다.\n\n```\n# 비밀값 — 절대 올리지 않는다\n.env\n.env.*\n!.env.example\n*.key\n*.pem\nsecrets.json\ncredentials.json\n\n# 프로그램이 자동으로 만드는 것 — 올릴 이유가 없다\nnode_modules/\n.next/\ndist/\nbuild/\n__pycache__/\n*.log\n\n# 맥이 몰래 만드는 것\n.DS_Store\n```\n\n| 적는 법 | 뜻 |\n|---|---|\n| `.env` | 정확히 이 이름의 파일 |\n| `.env.*` | `.env.`로 시작하는 모든 파일 |\n| `!.env.example` | 예외. 값이 비어 있는 견본이라 올려야 합니다 |\n| `*.key` | 확장자가 `.key`인 모든 파일 |\n| `node_modules/` | 이 이름의 폴더 통째로 |\n| `#`로 시작하는 줄 | 사람이 읽는 메모 |\n\n`.env`는 비밀값을 코드 밖으로 빼서 모아 두는 파일입니다. 코드에는 \"이 이름의 값을 가져다 써\"라고만 적고 실제 값은 `.env`에 둡니다. **코드는 올리고 `.env`는 안 올리는** 구조가 여기서 나옵니다."}, {"title": "④ 커밋 전 확인 한 줄을 익힌다", "md": "저장하기 직전에 딱 한 줄 칩니다.\n\n```bash\ngit diff --cached --name-only | grep -iE \"\\.env$|token|secret|credential|\\.key$|\\.pem$\"\n```\n> 지금 저장하려고 올려 둔 파일 이름 중에 `env`·`token`·`secret`·`credential`·`key`·`pem`이 들어간 게 있는지 거릅니다.\n\n읽는 법이 거꾸로라 헷갈립니다.\n\n| 결과 | 뜻 |\n|---|---|\n| 아무것도 안 나옴 | 안전. 그대로 커밋합니다 |\n| 파일 이름이 나옴 | **멈춥니다.** 그 파일을 빼고 `.gitignore`에 넣습니다 |\n\n```bash\ngit restore --staged .env\n```\n> 그 파일을 「저장할 목록」에서 뺍니다. 파일 자체는 그대로 있습니다."}, {"title": "⑤ 새어 나갔을 때 순서를 본다", "md": "1. 발급처에 들어가 그 열쇠를 폐기하고 새로 만듭니다. 가장 먼저입니다.\n2. 새 값을 `.env`에 넣습니다.\n3. `.gitignore`에 넣고 아래 명령으로 추적을 끊습니다.\n4. 그 열쇠로 그동안 무슨 일이 있었는지 발급처의 사용 기록을 확인합니다.\n\n```bash\ngit rm --cached .env\n```\n> `.env`를 저장소 추적 대상에서만 뺍니다. 내 컴퓨터의 파일은 지워지지 않습니다.\n\n**기록에서 지우려고 하지 마세요.** 과거를 뜯어고치는 명령이 있긴 하지만 초보자가 쓰면 저장소를 통째로 망가뜨리기 쉽고, 이미 남이 복사해 갔으면 소용도 없습니다."}, {"title": "⚡ 따라 하기", "md": "1. 작업 폴더로 가서 AI에게 `.gitignore`를 만들게 하세요. 첫 커밋보다 먼저여야 실수할 기회가 생기지 않습니다. 파일 내용이 그대로 화면에 보이면 된 것입니다.\n\n```bash\ncd ~/projects/내폴더이름\n```\n> 작업 폴더로 이동합니다.\n\n```\n이 폴더 맨 위에 .gitignore 파일을 만들어줘.\n.env, .env.*, *.key, *.pem, secrets.json, credentials.json,\nnode_modules/, dist/, build/, __pycache__/, *.log, .DS_Store 를 넣고,\n.env.example 은 예외로 올라가게 해줘.\n만들고 나서 파일 내용을 그대로 보여줘.\n```\n\n2. `git status`를 쳐서 목록에 `.env`가 안 보이는지 확인하세요. 보이면 아직 안 막힌 것입니다.\n\n3. ④의 확인 명령을 지금 한 번 쳐 보세요. 습관은 처음 한 번을 손으로 쳐야 생깁니다. 아무것도 안 나와야 정상입니다.\n\n4. 이 확인을 AI에게 맡기세요. 매번 손으로 치면 언젠가 빠뜨립니다. 규칙 파일에 한 줄이 추가되면 <a class=\"xref\" href=\"#3\">Stage 3<\/a>에서 만든 규칙 파일이 **문지기 역할**을 하게 됩니다.\n\n```\n앞으로 이 프로젝트에서 커밋하기 전에 항상 아래를 먼저 실행하고,\n결과가 한 줄이라도 나오면 커밋을 멈추고 나에게 물어봐.\n\ngit diff --cached --name-only | grep -iE \"\\.env$|token|secret|credential|\\.key$|\\.pem$\"\n\n이 규칙을 이 프로젝트의 CLAUDE.md 에 적어줘.\n```"}, {"title": "✅ 확인", "md": "- [ ] 저장소 맨 위에 `.gitignore` 파일이 있고 그 안에 `.env`가 들어 있나\n- [ ] `git status`를 쳤을 때 목록에 `.env`가 안 보이나\n- [ ] 확인 명령을 실제로 한 번 이상 쳐 봤고, 아무것도 안 나와야 안전이라는 걸 아나\n- [ ] 실수로 올렸을 때 지우는 게 아니라 새로 발급받는다는 걸 아나"}, {"title": "📘 말 풀이", "md": "**비밀값(secret)** — 남이 알면 내 이름으로 무언가 할 수 있게 되는 값. API 키·토큰·비밀번호·인증서 파일이 전부 여기 들어갑니다.\n\n**`.gitignore`** — 저장소 맨 위에 두는 텍스트 파일. 여기 적힌 이름의 파일을 Git이 못 본 척합니다. 이미 저장된 적 있는 파일에는 듣지 않습니다.\n\n**추적(tracked) / 추적 안 함(untracked)** — Git이 지켜보고 있는 파일이 추적 중, 폴더 안에 있어도 신경 쓰지 않는 파일이 추적 안 함입니다."}, {"title": "⚠️ 함정", "md": "**`.gitignore`에 적었는데도 계속 올라갑니다.** `.gitignore`는 아직 한 번도 저장한 적 없는 파일에만 듣습니다. 이미 커밋된 파일은 `git rm --cached`로 추적을 끊어야 합니다.\n\n**AI 대화창에 열쇠를 그대로 붙여넣습니다.** 파일에 안 올려도 대화 기록에 남습니다. AI에게는 \"`.env`의 `STRIPE_KEY` 값을 읽어서 써\"라고 시킵니다.\n\n**스크린샷에 열쇠가 찍힙니다.** 터미널 화면이나 설정 화면을 캡처해 올릴 때 자주 샙니다.\n\n**AI가 알아서 걸러 줄 거라 믿습니다.** AI는 `.env`를 커밋 목록에 넣어도 대개 그냥 넣습니다. 확인은 사람 몫입니다."}, {"title": "🔎 더 깊이", "md": "- 실제로 결제·인증 열쇠를 다루는 건 <a class=\"xref\" href=\"#6\">Stage 6<\/a>입니다. 여기서 만든 습관이 거기서 쓰입니다.\n- 자동 시크릿 스캔을 문 앞에 세우는 건 <a class=\"xref\" href=\"#7\">Stage 7<\/a>입니다. 사람이 놓쳐도 기계가 잡습니다.\n- 검색해 볼 말 — `gitignore 템플릿`, `GitHub secret scanning`, `git rm --cached`, `revoke API key`"}]}, {"file": "4-커밋.md", "id": "s4_5-4", "no": "4", "title": "커밋을 한 가지씩 나누기", "goals": ["한 커밋 = 한 가지 기준으로 커밋을 나눌 수 있다", "status·add·commit·push 네 걸음을 순서대로 칠 수 있다", "«무엇을 왜»가 보이는 메시지를 AI에게 쓰게 할 수 있다"], "steps": ["나누는 기준을 잡는다", "네 걸음으로 저장한다", "메시지에 이유를 적는다", "메시지를 AI에게 맡긴다"], "through": "한 커밋 = 한 가지. 세 가지를 한꺼번에 저장하면 그중 하나만 되돌릴 수 없다.", "time": "25분", "need": ["GitHub 계정"], "head": "되돌리기는 되돌아갈 지점이 있을 때만 됩니다. 그 지점을 만드는 게 커밋이고, 문제는 어떻게 나누느냐입니다.", "secs": [{"title": "① 나누는 기준을 잡는다", "md": "오늘 로그인 화면을 고치고, 색을 바꾸고, 오타를 잡은 뒤 한 번에 저장했다고 해 봅시다. 다음 날 색만 되돌리고 싶어도 방법이 없습니다. 로그인 수정과 오타 수정까지 같이 날아갑니다.\n\n규칙은 한 줄 — **하나의 커밋은 하나의 이유로 묶입니다.**\n\n| 나쁜 예 | 좋은 예 |\n|---|---|\n| 「오늘 작업」 (다섯 가지가 섞임) | 「로그인 화면 여백 정리」 |\n| 「수정」 | 「가입 이메일 중복 검사 추가」 |\n| 「이것저것」 | 「README 오타 수정」 |\n\n나누는 질문은 하나 — *\"이걸 나중에 통째로 무를 일이 생길까?\"* 답이 갈리는 지점이 커밋의 경계입니다. 얼마나 자주 하느냐는 시간이 아니라 일의 단위이고, 특히 AI에게 크게 시키기 전에 커밋을 하나 찍어 두면 결과가 마음에 안 들 때 그 지점으로 통째로 되감으면 됩니다."}, {"title": "② 네 걸음으로 저장한다", "md": "Git의 저장은 두 단계입니다. 번거롭게 느껴지지만 이 구조 덕분에 「바꾼 것 중 일부만 저장」이 됩니다.\n\n```bash\ngit status\n```\n> 지금 무엇이 바뀌었는지 보여 줍니다. 항상 여기서 시작합니다.\n\n```bash\ngit add 파일이름\n```\n> 그 파일을 「이번에 저장할 목록」에 올립니다. 전부 올리려면 `git add .` 을 씁니다.\n\n```bash\ngit commit -m \"가입 이메일 중복 검사 추가\"\n```\n> 목록에 올린 것을 이름 붙여 저장합니다. `-m` 뒤의 따옴표 안이 메시지입니다.\n\n```bash\ngit push\n```\n> 저장한 것을 GitHub으로 올립니다.\n\n**`commit`과 `push`는 다른 일입니다.** 커밋은 내 컴퓨터 안의 일이고 푸시를 해야 인터넷 창고로 갑니다. 이 차이가 5절 되돌리기에서 단계를 가르는 기준이 됩니다."}, {"title": "③ 메시지에 이유를 적는다", "md": "메시지를 나중의 나와 AI가 읽습니다. 그래서 한 일의 목록이 아니라 **이유**를 적습니다.\n\n| ❌ 무엇을 했는지 나열 | ✅ 무엇을 왜 바꿨는지 |\n|---|---|\n| 「login.js, auth.js, db.js 수정」 | 「같은 이메일로 두 번 가입되던 문제 막음」 |\n| 「함수 3개 추가」 | 「결제 실패했을 때 사용자에게 이유를 보여 주도록」 |\n| 「스타일 변경」 | 「휴대폰에서 버튼이 잘려 크기를 키움」 |\n\n왼쪽은 파일을 열어 보면 어차피 아는 것이고, 오른쪽은 파일을 열어도 알 수 없는 것입니다. 기록해야 할 건 후자입니다."}, {"title": "④ 메시지를 AI에게 맡긴다", "md": "메시지 쓰기가 귀찮아서 「수정」만 반복하게 됩니다. AI에게 맡기되, 요령은 하나 — **바뀐 것을 실제로 보여 주고 요약시킵니다.** 안 보여 주면 지어냅니다.\n\n```bash\ngit diff --cached\n```\n> 지금 저장하려는 것이 정확히 무엇이 바뀌었는지 줄 단위로 보여 줍니다.\n\n```\n지금 저장할 변경사항을 `git diff --cached` 로 직접 읽어보고,\n커밋 메시지를 한 줄로 지어줘. 조건 셋:\n\n1. 파일 이름이나 함수 이름을 나열하지 말고, 「무엇을 왜 바꿨는지」를 써줘\n2. 한글로, 50자 안쪽으로\n3. 이 변경이 사실은 두 가지 이상 섞여 있으면,\n   메시지를 짓지 말고 「커밋을 몇 개로 나눠야 하는지」를 먼저 알려줘\n\n메시지만 보여주고, 커밋은 내가 확인한 다음에 해.\n```\n\n조건 3이 진짜입니다. 사람은 자기가 섞은 걸 못 알아보고, AI는 알아봅니다."}, {"title": "⚡ 따라 하기", "md": "파일 하나를 아무렇게나 고친 뒤 아래를 순서대로 치세요. 각 줄의 결과를 보고 다음으로 갑니다.\n\n```bash\ngit status\n```\n> 무엇이 바뀌었는지 봅니다. 고친 파일 이름이 빨간 글씨로 보여야 합니다.\n\n```bash\ngit add 파일이름\n```\n> 저장할 것을 장바구니에 담습니다. 한 가지씩만 담습니다.\n\n```bash\ngit diff --cached --name-only | grep -iE \"\\.env$|token|secret|credential|\\.key$|\\.pem$\"\n```\n> 3절의 확인. 아무것도 안 나와야 다음으로 갑니다.\n\n```bash\ngit diff --cached\n```\n> 무엇이 바뀌는지 눈으로 봅니다. `+`와 `-`가 붙은 줄이 보입니다.\n\n```bash\ngit commit -m \"무엇을 왜 바꿨는지 한 줄\"\n```\n> 이름 붙여 저장합니다. 파일 수와 바뀐 줄 수가 한 줄로 나옵니다.\n\n```bash\ngit push\n```\n> GitHub으로 올립니다. GitHub 저장소 페이지를 새로고침하면 방금 메시지가 보여야 합니다.\n\n그다음 커밋 규칙을 프로젝트에 박아 두세요. 이후로는 AI에게 「커밋해줘」라고만 해도 이 셋을 지킵니다.\n\n```\n이 프로젝트의 CLAUDE.md 에 커밋 규칙을 적어줘. 내용은 이 셋:\n\n1. 한 커밋 = 한 가지. 성격이 다른 변경은 절대 한 커밋에 섞지 않는다\n2. 커밋 메시지는 한글로, 「무엇을 왜 바꿨는지」를 쓴다. 파일·함수 나열 금지\n3. 커밋 전에 반드시 아래를 실행하고, 한 줄이라도 나오면 멈추고 물어본다\n   git diff --cached --name-only | grep -iE \"\\.env$|token|secret|credential|\\.key$|\\.pem$\"\n```"}, {"title": "✅ 확인", "md": "- [ ] 커밋 뒤 `git log --oneline`을 쳤을 때 내가 쓴 메시지가 보이나\n- [ ] 그 메시지가 「수정」이 아니라 「무엇을 왜」로 읽히나\n- [ ] GitHub 저장소 웹페이지를 새로고침했을 때 방금 올린 것이 보이나\n- [ ] AI에게 `git diff --cached`를 읽히고 메시지를 받아 본 적이 있나"}, {"title": "📘 말 풀이", "md": "**커밋(commit)** — 지금 상태를 이름 붙여 저장하는 것. 커밋마다 긴 글자·숫자 줄(예: `a3f9c21…`)이 붙는데, 이게 그 지점의 주소입니다. 5절에서 이 주소를 씁니다.\n\n**스테이지(staging area)** — `git add`가 담는 「이번에 저장할 것」 장바구니. 바꾼 파일 다섯 개 중 셋만 담아 저장할 수 있어서 「한 커밋 = 한 가지」가 가능합니다.\n\n**diff** — 두 시점 사이에 정확히 어느 줄이 바뀌었는지 보여 주는 것. 더해진 줄 앞에 `+`, 지워진 줄 앞에 `-`가 붙습니다."}, {"title": "⚠️ 함정", "md": "**`git add .` 을 습관적으로 씁니다.** 폴더 안의 모든 걸 담아서 `.env`가 딸려 들어가는 사고가 여기서 납니다. 담은 뒤 3절의 확인 명령을 반드시 칩니다.\n\n**커밋만 하고 푸시를 안 합니다.** 내 컴퓨터에만 있어서 컴퓨터가 고장 나면 그대로 사라집니다.\n\n**하루 끝에 몰아서 한 번 커밋합니다.** 되돌릴 수 있는 단위가 「하루 통째로」가 됩니다.\n\n**AI에게 diff를 안 보여 주고 메시지를 시킵니다.** 그럴듯한데 사실이 아닌 메시지가 나옵니다.\n\n**커밋을 「완성했을 때만」 하는 것으로 오해합니다.** 커밋은 발표가 아니라 되돌아올 지점 만들기입니다. 어중간해도 돌아가면 찍어 둡니다."}, {"title": "🔎 더 깊이", "md": "- 이제 되돌립니다 → 5절 「되돌리기 3단」. 여기서 나눈 커밋이 그대로 되돌리기 단위가 됩니다.\n- 커밋 메시지 규칙을 팀 표준처럼 쓰고 싶다면 검색해 볼 말 — `Conventional Commits`\n- 검색해 볼 말 — `git add 스테이징 영역`, `git commit 메시지 잘 쓰는 법`, `git log --oneline`"}]}, {"file": "5-되돌리기3단.md", "id": "s4_5-5", "no": "5", "title": "되돌리기 3단 익히기 ⭐", "goals": ["«아직 커밋 안 함 / 커밋했는데 안 올림 / 이미 올림» 셋을 가르고 각각 다른 명령을 고를 수 있다", "날린 것 같을 때 reflog로 먼저 찾을 수 있다", "이미 올린 것에 reset이 아니라 revert를 쓰는 이유를 말할 수 있다"], "steps": ["어느 단계인지 가른다", "커밋 안 한 것을 버린다", "안 올린 커밋을 되감는다", "올린 것을 되돌린다", "날린 것을 reflog로 찾는다"], "through": "어디까지 갔느냐에 따라 되돌리는 법이 다르다. 그리고 날린 것 같을 때 먼저 볼 곳이 있다.", "time": "40분", "need": ["GitHub 계정"], "head": "이 장 전체가 이 절을 위해 있습니다. 앞의 네 절은 전부 망했을 때 되돌리기 위한 준비였습니다.", "secs": [{"title": "① 어느 단계인지 가른다", "md": "되돌리는 법은 하나가 아닙니다. 인터넷에서 아무 명령이나 찾아 치다가 멀쩡한 것까지 날리는 자리가 여기입니다. 기준은 딱 하나 — **얼마나 멀리 갔느냐**입니다.\n\n| # | 상황 | 무엇을 하나 | 명령 |\n|---|---|---|---|\n| ② | 아직 저장(커밋) 안 함 | 바뀐 것을 버린다 | `git restore` |\n| ③ | 저장은 했는데 안 올렸음 | 내 컴퓨터에서만 되감는다 | `git reset` |\n| ④ | 이미 올렸음 | 역사를 지우지 말고 되돌린다 | `git revert` |\n| ⑤ | 날린 것 같을 때 | 먼저 여기부터 본다 | `git reflog` |\n\n어느 단계인지 모르겠으면 `git status`를 치세요. 지금 어디쯤인지 알려 줍니다."}, {"title": "② 커밋 안 한 것을 버린다", "md": "AI에게 시켰는데 결과가 엉망이고 아직 커밋은 안 한 상태. 가장 흔하고 가장 안전한 경우입니다.\n\n```bash\ngit restore 파일이름\n```\n> 그 파일을 마지막 커밋 상태로 되돌립니다. 바꾼 내용은 사라집니다. 전부 되돌리려면 `git restore .` 을 씁니다.\n\n```bash\ngit restore --staged 파일이름\n```\n> `git add`로 장바구니에 이미 담았다면 먼저 이걸로 빼고, 그다음 위 명령으로 내용을 되돌립니다.\n\n> **⚠️ 이건 진짜로 사라집니다.** 커밋 안 한 변경은 Git이 기록한 적이 없어서 ⑤의 `reflog`로도 못 찾습니다. 버리기 전에 한 번 더 봅니다.\n\n버리기 아까우면 `restore` 대신 서랍에 넣어 두세요. 초보자에게는 이쪽이 더 안전합니다.\n\n```bash\ngit stash\n```\n> 지금 바꾼 것을 서랍에 넣어 두고 깨끗한 상태로 되돌립니다. 다시 꺼내려면 `git stash pop`."}, {"title": "③ 안 올린 커밋을 되감는다", "md": "커밋까지 했는데 아직 `git push`는 안 한 상태. 내 컴퓨터 밖으로 안 나갔으니 마음대로 되감아도 됩니다.\n\n```bash\ngit log --oneline\n```\n> 최근 커밋 목록을 한 줄씩 보여 줍니다. 되감기 전에 항상 여기서 확인합니다.\n\n```bash\ngit reset --soft HEAD~1\n```\n> **가장 안전한 되감기.** 마지막 커밋 하나를 취소하되 바꾼 내용은 그대로 둡니다. `HEAD~1`은 「지금에서 한 칸 뒤」입니다.\n\n```bash\ngit reset --hard HEAD~1\n```\n> 바꾼 내용까지 통째로 버립니다. 진짜로 그 시점으로 되돌아갑니다.\n\n> **⚠️ `--hard`는 조심합니다.** 되돌린 뒤에 「그건 살릴걸」 해도 파일에 안 남습니다. 커밋된 것은 ⑤의 `reflog`로 대개 찾지만, 커밋 안 한 변경은 진짜로 사라집니다. 먼저 `--soft`를 쓰고, 그걸로 안 되면 그때 `--hard`를 생각하세요."}, {"title": "④ 올린 것을 되돌린다", "md": "`git push`까지 해서 GitHub에 올라가 있는 상태. 여기서 규칙이 바뀝니다.\n\n> 이미 올린 것은 **지우지 않습니다. 덮어씁니다.**\n\n남들이 이미 받아 갔을 수 있기 때문입니다. 자동 검사 도구도, 배포 서버도 그 기록을 이미 봤습니다. 그래서 「없던 일로」가 아니라 「그 반대를 하는 새 커밋을 하나 더 얹습니다」.\n\n```bash\ngit revert a3f9c21\n```\n> 그 커밋이 한 일을 정확히 반대로 하는 새 커밋을 만듭니다. 주소는 `git log --oneline`에서 앞 일곱 글자를 찾습니다. 만든 뒤 `git push`로 올립니다.\n\n결과는 이렇게 남습니다. 지저분해 보이지만 이게 맞습니다.\n\n```\na3f9c21  결제 화면 새로 만듦        ← 남아 있음\nb7d1e88  결제 화면 새로 만든 것 되돌림  ← 새로 얹힘\n```\n\n> ### ⚠️ 절대 하지 말 것 — 강제로 밀어내기\n>\n> 인터넷에서 `git push --force`를 봅니다. **초보자는 쓰지 마세요.** 「내 컴퓨터 상태로 인터넷 창고를 통째로 덮어써라」는 뜻이라 남이 올려 둔 작업이 소리 없이 사라지고, 되돌릴 방법이 없는 경우도 있습니다. 이미 올린 것을 되돌릴 때는 `revert` 하나면 됩니다. 과거 커밋을 합치거나 지우는 「역사를 다시 쓰는」 명령도 안 올린 ③단계에서만 씁니다."}, {"title": "⑤ 날린 것을 reflog로 찾는다", "md": "포기하기 전에 여기부터 봅니다. 대부분 여기서 찾습니다. Git은 내가 지운 것도 한동안 몰래 들고 있고, 「지금까지 내 저장소가 지나온 자리」 목록이 `reflog`입니다. 보관 기간은 대략 30일입니다.\n\n```bash\ngit reflog\n```\n> 내 저장소가 지나온 모든 자리를 최근 순으로 보여 줍니다.\n\n```\na3f9c21 HEAD@{0}: reset: moving to HEAD~1\nb7d1e88 HEAD@{1}: commit: 결제 화면 새로 만듦     ← 날린 줄 알았던 그것\nc2e4f77 HEAD@{2}: commit: 로그인 여백 정리\n```\n\n맨 왼쪽이 그 시점의 주소, 오른쪽이 그때 무슨 일을 했는지입니다. 날리기 직전 줄을 찾았으면 **바로 되돌리지 말고 옆에 가지를 하나 내서 확인합니다.** 잘못 짚었을 때 또 되돌려야 하기 때문이고, 가지를 내는 건 아무것도 망가뜨리지 않습니다.\n\n```bash\ngit switch -c 복구 b7d1e88\n```\n> 그 시점의 상태로 새 가지를 만들어 그리로 옮겨 갑니다. 지금 상태는 그대로 남습니다.\n\nAI에게 맡길 때는 마지막 줄이 중요합니다. 「건드리지 마」를 빼면 AI가 알아서 되돌려 버릴 수 있습니다.\n\n```\n방금 git reset을 잘못 써서 커밋 하나를 날린 것 같아.\ngit reflog 를 읽어서 날리기 직전 상태가 어느 줄인지 찾아줘.\n찾으면 그 시점으로 새 브랜치를 만드는 명령만 알려줘.\n지금 상태는 절대 건드리지 마.\n```"}, {"title": "⚡ 따라 하기", "md": "읽기만 하면 정작 필요할 때 손이 안 움직입니다. 연습용 폴더를 새로 만들어 세 번 망가뜨리세요. 진짜 프로젝트에서 하지 마세요.\n\n1. 연습장을 만드세요. 커밋 하나가 있어야 되돌아갈 지점이 생깁니다. 마지막 줄에서 「1 file changed」가 보이면 준비된 것입니다.\n\n```bash\nmkdir ~/git-연습 && cd ~/git-연습\ngit init\necho \"첫 줄입니다\" > 연습.txt\ngit add 연습.txt\ngit commit -m \"첫 커밋\"\n```\n> 폴더를 만들고 → 저장소로 만들고 → 파일 하나 만들고 → 담아서 → 저장합니다.\n\n2. 파일을 망가뜨린 뒤 `restore`로 되돌리세요. 커밋 안 한 것을 버리는 감각을 익히는 단계입니다. 두 번째 `cat`에서 「첫 줄입니다」만 남아 있어야 합니다.\n\n```bash\necho \"엉망으로 고침\" >> 연습.txt\ncat 연습.txt\ngit restore 연습.txt\ncat 연습.txt\n```\n> 망가뜨리고 → 눈으로 보고 → 되돌리고 → 원래대로인지 확인합니다.\n\n3. 이번엔 커밋까지 한 뒤 `reset`으로 되감으세요. 안 올린 커밋은 없던 일로 만들 수 있다는 걸 손으로 확인하는 단계입니다. 두 번째 `git log`에서 목록이 한 줄로 줄어야 합니다.\n\n```bash\necho \"잘못된 두 번째 줄\" >> 연습.txt\ngit add . && git commit -m \"잘못된 커밋\"\ngit log --oneline\ngit reset --hard HEAD~1\ngit log --oneline\n```\n> 망가뜨려서 커밋하고 → 두 줄 확인 → 한 칸 되감고 → 한 줄로 줄었는지 확인합니다.\n\n4. 방금 날린 커밋을 `reflog`로 다시 살리세요. **이 단계가 가장 중요합니다** — 진짜로 날렸을 때 손이 여기로 갑니다. `cat`에서 「잘못된 두 번째 줄」이 돌아와 있어야 합니다.\n\n```bash\ngit reflog\ngit switch -c 복구연습 여기에복사한주소\ncat 연습.txt\ngit switch -\n```\n> 지나온 자리에서 「잘못된 커밋」 줄의 주소를 복사하고 → 그 시점으로 새 가지를 내고 → 파일을 확인하고 → 원래 가지로 돌아옵니다.\n\n5. (선택) 2절에서 만든 진짜 저장소에서 사소한 변경 하나를 커밋하고 `push`한 뒤 `revert`해 보세요. 올린 것은 지우지 않고 덮어쓴다는 걸 눈으로 보는 단계입니다. GitHub 웹페이지에서 커밋이 원래 것과 되돌린 것 두 개 다 보여야 합니다.\n\n```bash\ngit log --oneline\ngit revert 방금커밋주소\ngit push\n```\n> 커밋 주소를 찾고 → 반대로 하는 커밋을 만들고 → 올립니다.\n\n6. 연습장을 치우세요. **`rm -rf`는 되돌릴 수 없는 명령입니다.** 경로가 `~/git-연습`이 맞는지 눈으로 한 번 더 확인하고 치세요.\n\n```bash\nrm -rf ~/git-연습\n```\n> 연습 폴더를 지웁니다.\n\n### 이렇게 해 봤습니다 — 2026-09-09 · 네 가지를 실제로 돌려 봤습니다\n\n연습용 저장소를 하나 만들어 일부러 망가뜨리고 네 가지 방법으로 되살려 봤습니다.\n\n| 상황 | 한 일 | 결과 |\n|---|---|---|\n| 아직 저장 안 함 | 파일을 엉뚱한 내용으로 덮어씀 → `restore` | 원래 내용으로 돌아옴 |\n| 저장했는데 안 올림 | 잘못된 커밋을 만듦(3개) → `reset` | 커밋 2개로 줄고 파일도 돌아옴 |\n| 이미 올림 | `revert` | 커밋이 3개 → 4개로 «늘었습니다». 지운 게 아니라 «되돌리는 커밋»이 하나 더 쌓입니다 |\n| 날린 것 같을 때 | 두 개를 날린 뒤 `reflog` | 날린 커밋이 목록에 그대로 남아 있었고, 그 번호로 되살렸습니다 |\n\n세 번째 줄이 가장 헷갈리는 자리입니다. 되돌렸는데 커밋 수가 늘어나서 \"안 된 건가?\" 싶지만, 그게 맞게 된 것입니다. 남들이 받아 간 역사를 지우는 대신 「이걸 취소합니다」라는 기록을 새로 남기는 것입니다.\n\n네 번째가 이 절에서 제일 중요합니다. 날렸다고 생각한 것이 실제로는 남아 있었습니다. **당황해서 다시 만들기 전에 `reflog`부터 봅니다.**"}, {"title": "✅ 확인", "md": "- [ ] 연습 2·3·4를 읽기만 한 게 아니라 실제로 손으로 쳐 봤나\n- [ ] 연습 4에서 날린 커밋을 `reflog`로 다시 찾아냈나\n- [ ] 「아직 커밋 안 함 / 커밋했는데 안 올림 / 이미 올림」 셋의 처리가 다르다는 걸 아나\n- [ ] `git push --force`가 왜 위험한지 한 문장으로 말할 수 있나\n\n하나라도 «아니오»면 연습으로 돌아갑니다. 이 절만은 읽고 넘어가면 안 됩니다."}, {"title": "📘 말 풀이", "md": "**`reset` — 되감기** — 「없던 일로」 만듭니다. 커밋 자체가 사라집니다. 아직 안 올린 것에만 씁니다. `--soft`(커밋만 취소, 내용 유지)와 `--hard`(내용까지 버림)를 구분해서 기억하세요.\n\n**`revert` — 반대로 하기** — 「반대되는 일을 새로 합니다.」 원래 커밋은 남고 그것을 무르는 커밋이 하나 더 얹힙니다. 이미 올린 것에는 이것만 씁니다.\n\n**`reflog` — 지나온 자리 기록** — 내 저장소가 거쳐 간 모든 지점의 목록. 커밋 목록(`log`)과 달리 되감아서 사라진 것까지 남아 있습니다. 약 30일 보관."}, {"title": "⚠️ 함정", "md": "**인터넷에서 찾은 명령을 상황 확인 없이 칩니다.** 대부분의 사고가 여기서 납니다. `git status`와 `git log --oneline`을 먼저 치고 지금이 ②③④ 중 어디인지 정한 다음 명령을 고릅니다.\n\n**이미 올린 것에 `reset`을 씁니다.** 내 컴퓨터와 GitHub이 어긋나 `push`가 거부되고, 당황해서 `--force`를 치면 진짜 사고가 됩니다. 올린 것은 `revert`입니다.\n\n**날렸다고 판단하고 처음부터 다시 만듭니다.** `reflog`를 안 봐서 그렇습니다. 30일 안이면 대개 살아 있습니다.\n\n**커밋 안 한 변경도 `reflog`로 찾을 수 있다고 믿습니다.** 못 찾습니다. Git이 기록한 적이 없기 때문입니다. 커밋을 자주 하는 이유가 이것입니다.\n\n**되돌린 다음 `push`를 안 합니다.** 내 컴퓨터만 되돌아가고 GitHub은 그대로입니다."}, {"title": "🔎 더 깊이", "md": "- 밖으로 나간 것(배포된 서비스)을 되돌리는 건 다른 문제입니다 → <a class=\"xref\" href=\"#7\">Stage 7<\/a>. 이 절은 내 컴퓨터 안의 되돌리기입니다.\n- 되돌릴 일 자체를 줄이는 방법이 다음 절입니다 → 6절 「작업마다 가지 하나 내기」. 본줄기를 안 건드리고 옆에서 해 보면 되돌릴 일이 줄어듭니다.\n- 검색해 볼 말 — `git reset soft mixed hard 차이`, `git revert vs reset`, `git reflog 복구`"}]}, {"file": "6-가지.md", "id": "s4_5-6", "no": "6", "title": "작업마다 가지 하나 내기", "goals": ["main을 건드리지 않고 가지에서 시도하고 버릴 수 있다", "만들고·일하고·합치고·지우는 한 바퀴를 돌 수 있다", "충돌 표시가 에러가 아님을 알고 AI와 함께 풀 수 있다"], "steps": ["가지가 무엇인지 그림으로 본다", "1인 방식을 정한다", "한 바퀴를 돈다", "충돌을 푼다"], "through": "main 하나 + 작업마다 짧은 가지 하나. 그 이상은 여러 명이 있을 때 쓰는 것이다.", "time": "25분", "need": ["GitHub 계정"], "head": "5절에서 배운 건 망한 뒤에 되돌리는 법이고, 이 절은 애초에 본줄기가 안 망하게 하는 법입니다. 여기서 만든 가지가 <a class=\"xref\" href=\"#7\">Stage 7<\/a>에서 그대로 PR이 됩니다 — THE CHAIN이 여기를 지납니다.", "secs": [{"title": "① 가지가 무엇인지 그림으로 본다", "md": "`main`이라는 본줄기가 하나 있고, 지금까지 커밋한 게 전부 여기 쌓였습니다. 가지를 만든다는 건 그 지점에서 옆으로 길을 하나 내는 것입니다.\n\n```\nmain:   ●───●───●───────────●   ← 본줄기는 그대로\n                 \\         /\n가지:              ●───●─┘      ← 옆에서 따로 해 보고, 됐으면 합침\n```\n\n옆 길에서 무슨 짓을 해도 본줄기는 멀쩡합니다. 잘되면 합치고(merge), 안 되면 가지를 버립니다. **버리는 게 공짜라는 게 핵심입니다.** 「이 기능 전체를 다시 짜줘」를 가지에서 시키면, 결과가 엉망이어도 가지를 지우면 아무 일도 없던 게 됩니다."}, {"title": "② 1인 방식을 정한다", "md": "인터넷의 브랜치 전략은 전부 여러 명을 전제로 만든 것입니다. 릴리스 담당·리뷰어·배포 승인자 사이의 경계를 그으려는 규칙인데, 혼자면 그 경계가 전부 나 하나입니다.\n\n> **`main` 하나 + 작업마다 짧은 가지 하나**\n\n| 항목 | 규칙 |\n|---|---|\n| 본줄기 | `main` 하나. 항상 돌아가는 상태를 유지합니다 |\n| 가지 이름 | 무슨 일인지 알아볼 수 있게. `login-fix`, `payment-ui` |\n| 가지 수명 | 짧게. 하루이틀, 길어도 며칠 |\n| 합친 뒤 | 지웁니다. 안 지우면 목록이 쓰레기통이 됩니다 |\n\n가지를 오래 두면 그동안 `main`도 앞으로 갑니다. 둘이 벌어질수록 합칠 때 충돌이 늘어나니, 작게 나눠서 자주 합치는 게 덜 아픕니다."}, {"title": "③ 한 바퀴를 돈다", "md": "만들고, 일하고, 합치고, 지웁니다.\n\n```bash\ngit switch -c login-fix\n```\n> `login-fix`라는 가지를 만들고 그리로 이동합니다. `-c`가 「만들면서」라는 뜻입니다.\n\n```bash\ngit branch\n```\n> 가지 목록을 보여 줍니다. 지금 있는 가지 앞에 `*`가 붙습니다.\n\n여기서 평소대로 파일을 고치고 `git add`·`git commit`합니다. 이 커밋들은 `main`에 안 보이고 옆 길에만 쌓입니다.\n\n```bash\ngit push -u origin login-fix\n```\n> 이 가지를 GitHub에도 올립니다. 처음 한 번만 `-u origin 가지이름`을 붙이고, 다음부터는 `git push`만 하면 됩니다.\n\n```bash\ngit switch main\n```\n> 본줄기로 돌아옵니다. 파일 내용이 통째로 바뀌어 가지에서 만든 게 안 보이는 게 정상입니다.\n\n```bash\ngit merge login-fix\n```\n> 가지에서 한 일을 본줄기에 합칩니다. 그 뒤 `git push`로 올립니다.\n\n```bash\ngit branch -d login-fix\ngit push origin --delete login-fix\n```\n> 내 컴퓨터와 GitHub 양쪽에서 가지를 지웁니다. `-d`는 합쳐진 것만 지워서 안전합니다.\n\n합치지 않고 버릴 때는 `git switch main` 뒤에 `git branch -D login-fix`를 칩니다. **대문자 `-D`는 안 합쳐졌어도 지웁니다.** 본줄기는 아무 영향 없습니다."}, {"title": "④ 충돌을 푼다", "md": "합칠 때 같은 줄을 양쪽에서 다르게 고쳤으면 Git이 판단을 미룹니다. 이런 게 파일에 들어옵니다.\n\n```\n<<<<<<< HEAD\n본줄기 쪽 내용\n=======\n가지 쪽 내용\n>>>>>>> login-fix\n```\n\n**에러가 아닙니다.** 「둘 중 뭘 남길지 네가 정해라」는 뜻이라, 표시 줄까지 다 지우고 남길 내용만 남기면 됩니다. 혼자 작업하면 드물고, 나더라도 AI에게 맡기되 결정은 내가 합니다.\n\n```\nmerge 하다가 충돌이 났어. 충돌 난 파일을 열어서 양쪽이 각각 무슨 의도였는지 설명해주고,\n어느 쪽을 남기는 게 맞는지 추천해줘. 내가 고르면 그때 정리해줘.\n```"}, {"title": "⚡ 따라 하기", "md": "진짜 저장소에서 한 바퀴를 끝까지 도세요. 사소한 변경 하나로 충분합니다.\n\n1. 가지를 만들고 어디 있는지 확인하세요. 본줄기를 안 건드리는 첫걸음입니다. `* 연습가지`에 별표가 붙어 있어야 합니다.\n\n```bash\ngit switch -c 연습가지\ngit branch\n```\n> 가지를 만들고 → 목록을 봅니다.\n\n2. 한 줄 고치고 커밋해서 GitHub에 올리세요. 가지도 인터넷 창고에 올라간다는 걸 보기 위해서입니다. GitHub 웹페이지 가지 목록에 「연습가지」가 보여야 합니다.\n\n```bash\necho \"가지에서 쓴 줄\" >> README.md\ngit add README.md && git commit -m \"README에 한 줄 추가\"\ngit push -u origin 연습가지\n```\n> 고치고 → 커밋하고 → 올립니다.\n\n3. 화면에 **Compare & pull request** 버튼이 떠 있어도 지금은 누르지 마세요. <a class=\"xref\" href=\"#7\">Stage 7<\/a>에서 그 버튼을 씁니다.\n\n4. 본줄기로 돌아와 합치고 올리세요. `main`에 그 한 줄이 들어와야 합니다.\n\n```bash\ngit switch main\ngit merge 연습가지\ngit push\n```\n> 본줄기로 돌아와 → 합치고 → 올립니다.\n\n5. 다 쓴 가지를 양쪽에서 지우세요. GitHub 가지 목록에서 「연습가지」가 사라져야 합니다.\n\n```bash\ngit branch -d 연습가지\ngit push origin --delete 연습가지\n```\n> 내 컴퓨터와 GitHub에서 가지를 지웁니다.\n\n6. 가지 쓰는 습관을 AI에게 박아 두세요. 큰 변경 전에 `main`에 있으면 AI가 먼저 말해 주게 됩니다.\n\n```\n이 프로젝트의 CLAUDE.md 에 브랜치 규칙을 적어줘. 내용은 이 셋:\n\n1. main에서 직접 작업하지 않는다. 작업마다 짧은 브랜치를 하나 만든다\n2. 브랜치 이름은 무슨 일인지 알아볼 수 있게 영어 소문자와 하이픈으로 짓는다\n3. 큰 변경을 시작하기 전에는 반드시 지금 어느 브랜치인지 확인하고,\n   main이면 브랜치를 먼저 만들자고 나에게 말한다\n```"}, {"title": "✅ 확인", "md": "- [ ] `git branch`를 쳤을 때 지금 어느 가지에 있는지 별표로 보이나\n- [ ] 가지에서 커밋하고 `main`으로 돌아갔을 때 그 변경이 안 보였나 (안 보여야 정상)\n- [ ] 합친 뒤 `main`에서 그 변경이 보이나\n- [ ] GitHub 웹페이지의 가지 목록에서 연습 가지가 지워졌나"}, {"title": "📘 말 풀이", "md": "**브랜치(branch, 가지)** — 본줄기를 건드리지 않고 옆에서 따로 해 보는 길. 만드는 것도 지우는 것도 순식간이고 지워도 본줄기에 흔적이 없습니다. `main`은 관례적으로 붙는 본줄기의 이름입니다.\n\n**병합(merge, 합치기)** — 가지에서 한 일을 본줄기로 가져오는 것. 합치고 나면 가지의 커밋들이 본줄기 기록에도 들어옵니다.\n\n**충돌(conflict)** — 같은 파일의 같은 줄을 양쪽에서 다르게 고쳐서 Git이 못 정하는 상태. 고장이 아니라 사람에게 넘긴 질문입니다."}, {"title": "⚠️ 함정", "md": "**가지에서 일하는 걸 잊고 `main`에서 그냥 작업합니다.** 가장 흔합니다. 작업 시작 전에 `git branch`로 지금 어디인지 확인하는 걸 습관으로 만드세요.\n\n**가지를 만들기 전에 커밋을 안 합니다.** 안 커밋한 변경은 가지를 옮겨도 따라와서 헷갈립니다. 옮기기 전에 커밋하거나 `git stash`로 치워 둡니다.\n\n**`git switch main`을 했는데 파일이 사라졌다고 놀랍니다.** 사라진 게 아니라 가지에 그대로 있습니다. 다시 `git switch 가지이름`을 치면 돌아옵니다.\n\n**복잡한 브랜치 전략을 따라 하려 합니다.** 개발 가지·릴리스 가지·핫픽스 가지를 혼자 운영하면 일보다 규칙 지키기에 시간이 더 듭니다. 협업자가 생기면 그때 늘립니다."}, {"title": "🔎 더 깊이", "md": "- 이 가지가 PR이 되고, 그 PR에 자동 검사가 걸립니다 → <a class=\"xref\" href=\"#7\">Stage 7<\/a>. `main`에 직접 못 밀게 문을 잠그는 설정도 거기서 합니다.\n- 다음은 「여기까지가 한 판」을 표시하는 법입니다 → 7절 「되돌아올 지점에 깃발 꽂기」\n- 검색해 볼 말 — `GitHub Flow`, `git switch 브랜치`, `git merge 충돌 해결`"}]}, {"file": "7-태그와릴리스.md", "id": "s4_5-7", "no": "7", "title": "되돌아올 지점에 깃발 꽂기", "goals": ["버전 번호 세 자리가 각각 언제 올라가는지 말할 수 있다", "태그를 붙이고 GitHub에 따로 올릴 수 있다", "릴리스 노트를 버튼 하나로 자동 생성할 수 있다"], "steps": ["버전 번호 읽는 법을 본다", "언제 붙일지 정한다", "태그를 붙이고 올린다", "릴리스 노트를 만든다", "worktree를 지금 안 넣는 이유를"], "through": "되돌아갈 지점 중 특별한 것에 이름을 붙인다. 릴리스 노트는 버튼 하나로 나온다.", "time": "20분", "need": ["GitHub 계정"], "head": "커밋이 백 개쯤 쌓이면 「손님한테 처음 보여 준 그 상태」가 어디인지 못 찾습니다. 태그는 그 지점에 깃발을 꽂는 일이고, 릴리스는 그 깃발에 「이번에 뭐가 달라졌는지」 설명을 붙이는 일입니다.", "secs": [{"title": "① 버전 번호 읽는 법을 본다", "md": "`1.4.2` 처럼 점으로 나뉜 세 자리를 씁니다. 자리마다 뜻이 다릅니다.\n\n| 자리 | 언제 올리나 | 쉽게 말하면 |\n|---|---|---|\n| 첫 자리 (`1`.4.2) | 쓰던 방식이 깨질 때 | \"예전처럼 쓰면 안 됩니다\" |\n| 가운데 (1.`4`.2) | 기능이 늘었을 때 (기존 건 그대로) | \"새로 생긴 게 있습니다\" |\n| 마지막 (1.4.`2`) | 버그를 고쳤을 때 | \"고장 난 걸 고쳤습니다\" |\n\n받는 사람 입장에서는 첫 자리가 바뀔 때만 확인할 일이 생깁니다. 앞자리가 `0`이면 「아직 정식 전」이라 마음대로 바꿔도 되는 시기이고, **`1.0.0`을 붙이는 순간이 「이제 이 약속을 지키겠다」는 선언**입니다."}, {"title": "② 언제 붙일지 정한다", "md": "혼자 만들 때는 이렇게 단순화합니다.\n\n| 상황 | 어떻게 |\n|---|---|\n| 만드는 중, 아직 남에게 안 보여 줌 | 태그 안 붙여도 됩니다. 커밋만 쌓습니다 |\n| 남에게 처음 보여 주는 상태 | `v0.1.0` |\n| 손님이 실제로 쓰기 시작함 | `v1.0.0` |\n| 그 뒤 기능 하나 추가 | 가운데 올림 (`v1.1.0`) |\n| 그 뒤 버그 하나 고침 | 마지막 올림 (`v1.1.1`) |\n\n붙이는 기준 한 줄 — *\"이 상태로 되돌아올 일이 생길까?\"* 문제가 터졌을 때 **\"일단 지난 태그로 되돌리자\"**가 가장 빠른 복구입니다. 이름 앞의 `v`는 관례라 안 붙여도 되지만, 붙이면 목록에서 한눈에 구분됩니다."}, {"title": "③ 태그를 붙이고 올린다", "md": "```bash\ngit tag -a v1.0.0 -m \"처음 정식으로 내놓음\"\n```\n> 지금 지점에 `v1.0.0`이라는 깃발을 꽂습니다. 따옴표 안이 그 깃발의 설명입니다.\n\n```bash\ngit push origin v1.0.0\n```\n> 그 깃발을 GitHub에도 올립니다. **태그는 `git push`만으로는 안 올라갑니다.** 따로 올려야 합니다.\n\n```bash\ngit tag\n```\n> 지금까지 붙인 태그 목록을 봅니다.\n\n```bash\ngit switch -c 확인용 v1.0.0\n```\n> 지난 상태로 돌아가 확인하고 싶을 때. 그 태그 시점의 상태로 새 가지를 내서 들어갑니다. 지금 상태는 그대로 남습니다."}, {"title": "④ 릴리스 노트를 만든다", "md": "GitHub에는 합쳐진 작업 목록을 읽어서 릴리스 노트를 자동으로 만들어 주는 버튼이 있습니다.\n\n1. 저장소 페이지 오른쪽의 **Releases** → **Draft a new release**\n2. **Choose a tag**에서 방금 올린 태그를 고릅니다\n3. **Generate release notes** 버튼을 누릅니다\n4. 지난 태그 이후로 합쳐진 작업들이 목록으로 자동으로 채워집니다\n5. 맨 위에 사람이 읽을 한두 줄을 얹고 **Publish release**\n\n여기서 4절과 6절이 값을 합니다. 자동 생성되는 목록은 합쳐진 가지의 이름과 커밋 메시지로 만들어지니, 「수정」「업데이트」로만 써 왔다면 릴리스 노트도 그렇게 됩니다. **「무엇을 왜 바꿨는지」를 써 온 사람은 여기서 공짜로 문서를 얻습니다.**\n\n```\n아래는 GitHub이 자동 생성한 릴리스 노트야.\n이걸 개발자가 아닌 사용자가 읽을 수 있게 다시 써줘.\n\n- 맨 위에 「이번에 달라진 것」 3줄 요약\n- 기술 용어는 풀어서\n- 자동 생성된 원래 목록은 아래에 그대로 남겨 둬\n\n(여기에 붙여넣기)\n```"}, {"title": "⑤ worktree를 지금 안 넣는 이유를 본다", "md": "여러 작업 폴더를 동시에 띄워 놓고 에이전트를 둘 이상 나란히 돌리는 격리 방식이 있습니다. `worktree`라고 부릅니다.\n\n지금은 넣지 않습니다. 한 번에 하나씩 하면 가지만으로 충분하고, 지금 배우면 「지금 어느 가지에 있나」가 「지금 어느 폴더의 어느 가지에 있나」로 복잡해질 뿐입니다.\n\n필요해지는 조건은 분명합니다 — **AI를 둘 이상 동시에 돌려서 서로 파일을 밟기 시작할 때**입니다. 그때 배우면 30분이면 됩니다."}, {"title": "⚡ 따라 하기", "md": "지금 저장소에 첫 깃발을 꽂으세요.\n\n1. 본줄기로 가서 최신 상태를 받으세요. 태그는 최신 상태에 붙여야 합니다. `Already up to date.` 또는 받아 온 파일 목록이 보이면 됩니다.\n\n```bash\ngit switch main\ngit pull\n```\n> 본줄기로 가서 → 최신 상태를 받아 옵니다.\n\n2. 깃발을 꽂고 GitHub에 올리세요. 푸시 한 번으로는 안 올라가니 따로 올리는 감각을 익히는 단계입니다. `git tag` 목록에 `v0.1.0`이 보여야 합니다.\n\n```bash\ngit tag -a v0.1.0 -m \"처음 만든 상태\"\ngit push origin v0.1.0\ngit tag\n```\n> 깃발을 꽂고 → GitHub에 올리고 → 목록을 확인합니다.\n\n3. GitHub 웹페이지에서 릴리스를 만드세요. 지금까지의 커밋 메시지가 문서로 바뀌는 걸 보기 위해서입니다. 저장소 페이지 오른쪽 Releases 옆에 숫자 1이 보여야 합니다.\n   - **Releases** → **Draft a new release** → **Choose a tag** → `v0.1.0`\n   - **Generate release notes** 클릭 → 맨 위에 한 줄 얹고 **Publish release**\n\n4. 태그를 붙이는 기준을 프로젝트에 적어 두세요. 이후로는 AI가 태그 뒤에 따로 올려야 한다는 걸 알려 줍니다.\n\n```\n이 프로젝트의 CLAUDE.md 에 버전 규칙을 적어줘. 내용은 이 셋:\n\n1. 되돌아올 만한 지점에만 태그를 붙인다. 커밋마다 붙이지 않는다\n2. 첫 자리는 쓰던 방식이 깨질 때, 가운데는 기능이 늘 때, 마지막은 고쳤을 때 올린다\n3. 태그를 만들면 git push origin <태그이름> 으로 따로 올려야 한다는 걸 잊지 말고 알려준다\n```"}, {"title": "✅ 확인", "md": "- [ ] `git tag`를 쳤을 때 내가 붙인 태그 이름이 나오나\n- [ ] GitHub 저장소 페이지 오른쪽 Releases 항목에 숫자 1이 보이나\n- [ ] 릴리스 페이지에 자동 생성된 변경 목록이 채워져 있나\n- [ ] 「첫 자리 / 가운데 / 마지막」이 각각 언제 올라가는지 말할 수 있나"}, {"title": "📘 말 풀이", "md": "**태그(tag)** — 특정 커밋에 붙이는 이름표. 커밋 주소(`a3f9c21…`)는 사람이 못 외우니까 `v1.0.0` 같은 이름을 대신 붙입니다. 붙인 뒤에는 움직이지 않습니다.\n\n**릴리스(release)** — GitHub이 태그 위에 얹어 주는 발표 페이지. 태그는 Git의 기능이고 릴리스는 GitHub의 기능입니다.\n\n**버전 번호 체계(Semantic Versioning, 줄여서 SemVer)** — 「첫 자리는 깨질 때, 가운데는 기능이 늘 때, 마지막은 고칠 때」라는 널리 쓰이는 약속. 강제는 아니지만 따르면 남이 숫자만 보고 판단할 수 있습니다."}, {"title": "⚠️ 함정", "md": "**태그를 만들고 `git push`만 합니다.** 안 올라갑니다. `git push origin 태그이름`을 따로 쳐야 합니다.\n\n**처음부터 `v1.0.0`을 붙입니다.** 아직 바뀔 게 많은 시기에 `1`을 붙이면 곧 `2.0.0`, `3.0.0`이 됩니다. `v0.x`로 시작하는 게 편합니다.\n\n**커밋 하나마다 태그를 붙입니다.** 깃발이 백 개면 깃발이 아닙니다. 되돌아올 만한 지점에만 붙입니다.\n\n**태그 이름을 재활용합니다.** 이미 붙인 태그를 다른 커밋으로 옮기면 그걸 받아 간 곳과 어긋납니다. 새 번호를 붙입니다.\n\n**worktree부터 배우려 합니다.** 순서가 거꾸로입니다. 되돌리기와 가지가 먼저입니다."}, {"title": "🔎 더 깊이", "md": "- THE CHAIN — 여기서 만든 저장소·가지·태그가 <a class=\"xref\" href=\"#7\">Stage 7<\/a>에서 그대로 쓰입니다. 가지는 PR이 되고, PR에는 자동 검사가 걸리고, 태그는 배포한 판을 가리키는 이름이 됩니다.\n- 이 장에서 만든 커밋 규칙은 <a class=\"xref\" href=\"#5\">Stage 5<\/a>에서 AI에게 크게 시킬 때 안전망으로 쓰입니다.\n- 검색해 볼 말 — `Semantic Versioning 한국어`, `GitHub automatically generated release notes`, `git tag push`"}]}]}, {"folder": "05-구현", "key": "5", "name": "구현", "color": "#fb923c", "sub": "바이브 코딩과 오류 해결", "goal": "시키고, 검증하고, 막히면 푼다", "makes": "기능 하나 + 커밋 · 테스트", "time": "6시간", "need": ["Stage 3의 지침", "Stage 4.5의 저장소"], "head": "여기서 처음으로 **돌아가는 것**이 나옵니다.\n그리고 처음으로 **막힙니다.** 막히는 게 정상이고, 푸는 순서가 있습니다.", "metasecs": [{"title": "✅ 자가 체크", "md": "- [ ] **계획을 먼저 읽고** 나서 실행시켰나 (바로 시키지 않았나)\n- [ ] 테스트가 하나라도 도나\n- [ ] 에러를 **요약하지 말고 그대로** 붙여 봤나\n- [ ] 같은 에러가 세 번 반복됐을 때 **무엇을 바꿔야 하는지** 아나"}, {"title": "다음으로", "md": "여기서 만든 기능이 Stage 6에서 **진짜 데이터베이스**에 붙습니다."}], "sections": [{"file": "1-계획먼저.md", "id": "s5-1", "no": "1", "title": "시키기 전에 계획을 읽는다", "goals": ["「만들어 줘」 대신 계획을 먼저 받아 읽을 수 있다", "계획에서 봐야 할 네 곳을 짚어 고칠 수 있다", "계획 모드를 켤 때와 그냥 시켜도 될 때를 가릴 수 있다"], "steps": ["네 걸음을 표로 본다", "계획에서 볼 곳 넷을 익힌다", "계획 모드를 켤 때를 가린다", "부실한 계획엔 인터뷰를 시킨다"], "through": "바로 \"만들어 줘\"라고 하지 않는다. 계획을 먼저 읽고 고친 다음 시킨다.", "time": "50분", "need": ["Stage 3의 지침", "Stage 4.5의 저장소"], "head": "여기서 처음으로 돌아가는 것이 나옵니다. 그리고 대부분이 여기서 처음 크게 망합니다 — **\"만들어 줘\"라고 바로 시켜서.**", "secs": [{"title": "① 네 걸음을 표로 본다", "md": "AI에게 \"만들어 줘\"라고 하면 5분 만에 파일 열두 개가 바뀝니다. 그중에 내가 시키지 않은 것이 섞여 있습니다 — AI는 모르는 것이 있어도 묻지 않고 혼자 정하기 때문입니다.\n\n| 걸음 | 무엇을 시키나 | 내가 하는 일 |\n|---|---|---|\n| 살펴보기 | \"고치지 말고, 지금 어떻게 되어 있는지만 알려 줘\" | 읽는다 |\n| 계획 | \"무엇을 만들고 고칠지 계획만 써 줘\" | ⭐ 읽고 고친다 |\n| 만들기 | \"이 계획대로 해 줘\" | 지켜본다 |\n| 확인 | \"됐는지 내가 눈으로 볼 방법을 알려 줘\" | ⭐ 직접 눈으로 본다 |\n\n**계획과 확인이 사람의 자리입니다.** 코드는 못 읽어도 한국어로 쓰인 계획은 읽을 수 있고, AI가 혼자 정한 것이 글로 드러나는 자리는 계획뿐입니다."}, {"title": "② 계획에서 볼 곳 넷을 익힌다", "md": "계획을 받으면 스크롤만 내리지 말고 이 넷을 찾으세요. 코드를 몰라도 전부 볼 수 있습니다.\n\n1. **손대는 파일 수** — 셋을 넘으면 \"더 작게 쪼개 줘\"라고 말합니다. 파일 열 개짜리 계획은 성공해도 검증을 못 합니다.\n2. 내가 말한 적 없는 것 — 처음 보는 이름·규칙·화면은 AI가 지어낸 것입니다. \"왜 이렇게 정했나요?\"라고 묻습니다.\n3. 되돌릴 수 있나 — 데이터 삭제, 실제 메일 발송, 밖으로 나가는 일은 따로 떼어 나중에 합니다.\n4. 무엇으로 확인하나 — 확인 방법이 없는 계획은 미완성입니다. 넣어 달라고 하세요."}, {"title": "③ 계획 모드를 켤 때를 가린다", "md": "계획 모드에서는 AI가 파일을 읽기만 하고 고치지 못합니다. 그래서 겁 없이 물어봐도 망칠 수가 없습니다.\n\n| 상황 | 계획 먼저? |\n|---|---|\n| 처음 만드는 기능 · 파일 셋 이상이 바뀔 때 | ⭕ 반드시 |\n| 남이 만든 코드 · 돈·개인정보가 걸린 곳 | ⭕ 반드시 |\n| 글자 하나 고치기, 색 바꾸기 | ❌ 그냥 시켜도 됨 |\n\n처음 며칠은 **계획 모드로만** 놀아 보세요."}, {"title": "④ 부실한 계획엔 인터뷰를 시킨다", "md": "계획이 두루뭉술하면 AI에게 정보가 부족한 것입니다. 계획을 다시 시키지 말고 **질문을 먼저 받으세요.**\n\n> \"계획 세우기 전에, 나한테 질문 다섯 개 먼저 해 줘.\"\n\n이 한 줄이 빠뜨리는 것의 대부분을 막습니다."}, {"title": "⚡ 따라 하기", "md": "1. 프로젝트 폴더에서 AI를 열고 계획 모드로 시작하세요 — 첫 대화에서는 아무것도 고치지 않기 위해서입니다. 폴더 구조와 관련 파일 목록이 한국어로 돌아와야 합니다.\n\n```\n계획 모드로 시작해 줘. 아무것도 고치지 마.\n\n이 프로젝트를 처음 보는 사람이라고 생각하고 알려 줘.\n1. 이 프로젝트가 무엇을 하는 것인지 한 줄로\n2. 폴더가 어떻게 나뉘어 있고, 각 폴더가 무슨 일을 하는지\n3. 내가 만들려는 기능과 관련 있어 보이는 파일 목록\n4. 이미 돌아가는 것과, 아직 안 되는 것\n\n나는 코드를 못 읽으니 전부 한국어로, 짧은 문장으로.\n```\n\n2. 만들 기능을 한 줄로 정해서 계획만 받으세요 — 혼자 정한 것을 코드가 되기 전에 보기 위해서입니다. 답에 「혼자 정한 것」 항목과 파일 목록이 보여야 합니다.\n\n```\n만들 기능: (한 줄로. 예 — 방문자가 이메일을 넣으면 구독자로 저장되는 가입 화면)\n\n바로 만들지 말고, 계획만 글로 써 줘.\n1. 다 되면 사용자가 화면에서 무엇을 할 수 있나 (한 줄)\n2. 새로 만들 파일 목록\n3. 고칠 파일 목록 — 각각 무엇을 왜 고치는지 한 줄씩\n4. 내가 알려주지 않아서 네가 혼자 정한 것 — 전부 솔직하게\n5. 되돌리기 어려운 일이 있나 (데이터 삭제, 실제 발송, 외부로 나가는 것)\n6. 다 됐는지 내가 눈으로 확인할 방법\n\n고치는 파일이 3개를 넘으면 더 작게 쪼개서 다시 제안해 줘.\n코드는 한 줄도 쓰지 마.\n```\n\n3. 계획이 두루뭉술하면 인터뷰를 시키세요 — 부족한 정보를 채워야 계획이 구체해집니다. 질문 다섯 개가 오면 답하고, 답을 반영한 계획이 다시 옵니다.\n\n```\n계획을 세우기 전에, 나한테 질문 5개를 먼저 해 줘.\n네가 지금 몰라서 혼자 정하게 될 것들만 물어봐.\n내가 답하면 그 답을 반영해서 계획을 다시 써 줘.\n```\n\n4. ②의 네 곳을 보고 최소 한 곳을 고쳐서 돌려보내세요 — 계획에서 고치는 값은 1, 코드가 된 뒤는 10입니다. 고친 계획이 다시 오고, 내가 \"진행\"이라고 말한 뒤에야 파일이 바뀝니다.\n\n```\n계획 중에서 이 부분을 고쳐 줘.\n- (고칠 것 1)\n- (고칠 것 2)\n\n고친 계획을 다시 보여 주고, 내가 \"진행\"이라고 하면 그때부터 만들어 줘.\n계획에 없는 파일은 건드리지 마. 계획에 없는 걸 하고 싶으면 먼저 물어봐.\n```"}, {"title": "✅ 확인", "md": "- [ ] 계획에 「새로 만들 파일」「고칠 파일」「혼자 정한 것」 항목이 보이나\n- [ ] 고칠 파일이 셋 이하인가\n- [ ] 계획 중 한 곳 이상을 내가 고쳐서 다시 받았나\n- [ ] 계획에 「내가 눈으로 확인하는 방법」이 적혀 있나"}, {"title": "📘 말 풀이", "md": "**계획 모드(plan mode)** — AI가 읽기만 하고 고치지 못하는 상태. 둘러보기와 계획 세우기 전용이라 망칠 수 없습니다.\n\n**세션(session)** — AI와의 대화 한 판. 한 세션에 여러 작업을 섞으면 전부 어중간해집니다. 한 작업 = 한 세션.\n\n**컨텍스트(context)** — AI가 지금 머리에 담고 있는 내용. 작업대 위 그릇이라 차면 답이 갑자기 멍청해지고, 그때는 대화를 새로 엽니다."}, {"title": "⚠️ 함정", "md": "**\"계획 세워 줘\" 하고 읽지 않습니다.** 가장 흔합니다. 계획을 안 읽으면 계획을 안 세운 것과 같습니다.\n\n**한 세션에 여러 일을 던집니다.** 그릇이 넘쳐서 전부 어중간해집니다. 한 작업 = 한 폴더 = 한 세션.\n\n**AI가 \"완료했습니다\"라고 하면 믿습니다.** 그건 증거가 아니라 주장입니다. 확인은 <a class=\"xref\" href=\"#5\" data-jump=\"s5-4\">4절<\/a>과 <a class=\"xref\" href=\"#5\" data-jump=\"s5-6\">6절<\/a>에서 다룹니다."}, {"title": "🔎 더 깊이", "md": "- 이 네 걸음은 공식 문서에서 **Explore → Plan → Code → Verify**로 부르는 흐름과 같습니다. 앱 안에서 `/help`를 치면 계획 모드를 켜는 법이 나옵니다.\n- 여기서 세운 계획은 <a class=\"xref\" href=\"#5\" data-jump=\"s5-3\">3절<\/a>에서 파일로 남기고, <a class=\"xref\" href=\"#5\" data-jump=\"s5-7\">7절<\/a> 2일차에서 그대로 씁니다.\n- 이 기능은 <a class=\"xref\" href=\"#6\">Stage 6<\/a>에서 진짜 데이터베이스에 붙습니다. 계획에 \"구독자를 어디에 저장하나\"를 적어 두면 그때 그 줄만 바꾸면 됩니다."}]}, {"file": "2-터미널없이.md", "id": "s5-2", "no": "2", "title": "검은 화면 없이 앱에서 일한다", "goals": ["검은 화면을 열지 않고 앱 안에서 파일과 명령 결과를 붙여 물을 수 있다", "엉뚱하게 달리는 AI를 Esc로 멈추고 바뀐 것을 확인할 수 있다", "자동 수락을 켤 일과 끌 일을 「되돌릴 수 있나」로 가를 수 있다"], "steps": ["앱 하나로 하루를 돌린다", "@와 !로 대화에 붙인다", "Esc로 멈춘다", "자동 수락을 가른다"], "through": "하루의 90%는 데스크톱 앱에서 끝난다. 검은 화면은 배우지 않아도 된다.", "time": "40분", "need": ["Stage 3의 지침", "Stage 4.5의 저장소"], "head": "비개발자가 AI 코딩을 포기하는 첫 번째 이유는 실력이 아니라 **검은 화면**입니다. 지금은 데스크톱 앱이 있어서 창을 열고 한국어로 말하면 됩니다.", "secs": [{"title": "① 앱 하나로 하루를 돌린다", "md": "파일을 붙이는 것도, 중단하는 것도, 권한을 조절하는 것도 앱 안에서 됩니다.\n\n| 무엇을 | 어디서 | 얼마나 |\n|---|---|---|\n| 계획·만들기·고치기 | 데스크톱 앱 | 하루의 90% |\n| 커밋·되돌리기 | 앱 안에서 말로 (<a class=\"xref\" href=\"#4.5\">Stage 4.5<\/a>) | 나머지 |\n| 두 번째 눈으로 리뷰 | 다른 도구 하나 (<a class=\"xref\" href=\"#7\">Stage 7<\/a>) | 밀기 직전 한 번 |\n\n**도구는 둘이면 됩니다 — 메인 하나, 백업 하나.** 백업은 메인이 멈췄을 때만 켭니다. 셋 이상 깔면 배우는 시간만 늘고 안전은 나빠집니다."}, {"title": "② @와 !로 대화에 붙인다", "md": "입력창에 `@`를 치면 폴더 안 파일 목록이 뜹니다. 골라서 넣으면 그 파일이 대화로 들어갑니다 — 복사하면 줄이 잘리거나 일부만 들어가서, `@`가 더 정확합니다.\n\n```\n@src/subscribe.tsx 이 화면에서 이메일 형식이 틀렸을 때 어떻게 되는지 알려 줘\n```\n\n`!`로 시작하면 그 뒤의 명령을 실행해서 결과만 대화에 넣습니다. 에러가 났을 때 특히 중요합니다 — **에러는 요약하지 말고 그대로 넣습니다** (<a class=\"xref\" href=\"#5\" data-jump=\"s5-5\">5절<\/a>).\n\n```\n!npm test\n```"}, {"title": "③ Esc로 멈춘다", "md": "AI가 엉뚱한 방향으로 달리면 `Esc` 한 번으로 즉시 멈춥니다. 잘 안 멈추면 `Ctrl` + `C`가 비상 정지입니다.\n\n멈추는 게 미안한 일이 아닙니다. **끝까지 가게 두는 게 더 비쌉니다.**"}, {"title": "④ 자동 수락을 가른다", "md": "자동 수락은 \"하나하나 물어보지 말고 알아서 해\"라는 스위치입니다. 켜면 빠르고, 켜 둔 채 잘못된 일을 시키면 아주 빠르게 망합니다.\n\n> **되돌릴 수 있으면 켠다. 밖으로 나가면 끈다.**\n\n| 하는 일 | 되돌릴 수 있나 | 자동 수락 |\n|---|---|---|\n| 내 컴퓨터 안 파일 고치기(커밋해 뒀다면) · 문구 다듬기 · 테스트 돌리기 | ⭕ | 켠다 |\n| 새 도구·부품 설치 | 🔺 지저분해짐 | 꺼 둔다 |\n| 데이터 지우기 · 실제 메일·문자 발송 · 결제·환불 | ❌ | 끈다 |\n| 배포 · 저장소에 밀기 · 남의 서비스에 닿는 일 | ❌ 남 눈에 보임 | 끈다 |\n\n켜기 전 조건이 하나 더 있습니다 — 지금 상태가 커밋되어 있어야 합니다. 커밋이 없으면 안전망 없는 외줄타기입니다."}, {"title": "⚡ 따라 하기", "md": "1. 프로젝트 폴더에서 앱을 열고 아래를 붙이세요 — 지침 파일과 커밋 상태를 알아야 안전하게 시작합니다. 지침 요약 세 줄과 \"커밋 안 된 변경이 있다/없다\"가 돌아와야 합니다.\n\n```\n지금 이 폴더에서 시작할게.\n1. 이 폴더에 CLAUDE.md 같은 지침 파일이 있나? 있으면 무슨 내용인지 세 줄로\n2. 지금 커밋 안 된 변경이 있나?\n3. 아직 아무것도 고치지 마. 위 두 가지만 알려 줘.\n```\n\n2. `@`를 쳐서 파일 하나를 고르고 아래를 붙이세요 — 복사·붙여넣기 없이 파일을 넘기는 감각을 익히기 위해서입니다. 다섯 줄 설명이 돌아오면 붙은 것입니다.\n\n```\n@(파일 경로를 @로 골라서 넣습니다)\n\n이 파일이 무슨 일을 하는지 비개발자가 알아듣게 다섯 줄로 설명해 줘.\n이 파일에서 잘못되면 사용자가 바로 알아채는 부분이 어디인지도 알려 줘.\n```\n\n3. 커밋을 한 뒤 아래를 붙이고 자동 수락을 켜세요 — 밖으로 나가는 일만 물어보게 선을 긋기 위해서입니다. 이후 파일 고치기는 묻지 않고 진행되고, 목록에 든 일은 멈춰서 물어봐야 합니다.\n\n```\n지금부터 하려는 일 중에 아래에 해당하는 게 있으면 먼저 나에게 물어봐.\n- 데이터를 지우거나 덮어쓴다\n- 메일·문자·알림을 실제로 밖으로 보낸다\n- 결제나 돈에 관련된 것을 건드린다\n- 인터넷에 올리거나 저장소에 밀어 올린다\n- .env 같은 비밀 값이 든 파일을 읽거나 고친다\n\n나머지(내 컴퓨터 안 파일 고치기, 테스트 돌리기)는 물어보지 말고 진행해도 돼.\n```\n\n4. AI가 엉뚱하게 달리면 `Esc`를 누르고 아래를 붙이세요 — 더 망가지기 전에 무엇이 바뀌었는지 알아야 합니다. 바뀐 파일 목록만 돌아오고, 되돌리기는 내가 시킬 때까지 하지 않아야 합니다.\n\n```\n멈춰. 지금까지 바꾼 파일 목록만 보여 줘. 더 고치지 마.\n되돌려야 할 것이 있으면 알려 줘. 되돌리기는 내가 시킬 때만 해.\n```"}, {"title": "✅ 확인", "md": "- [ ] 검은 화면을 열지 않고 앱 안에서만 한 바퀴를 돌았나\n- [ ] `@`로 파일을, `!`로 명령 결과를 붙여 봤나\n- [ ] `Esc`로 AI를 한 번 멈춰 봤나\n- [ ] 자동 수락을 켜기 전에 커밋을 했나"}, {"title": "📘 말 풀이", "md": "**터미널(terminal)** — 글자만 입력해서 컴퓨터에 명령하는 검은 화면. 지금은 앱 안에서 `!`로 대신할 수 있습니다.\n\n**자동 수락** — AI가 하려는 일을 하나하나 묻지 않고 진행하게 하는 스위치. 되돌릴 수 있는 일에만 켭니다.\n\n**배포** — 내 컴퓨터 안에서만 돌던 것을 인터넷에 올려 남이 보게 하는 일. 밖으로 나가는 일이라 자동 수락을 끕니다."}, {"title": "⚠️ 함정", "md": "**\"전부 자동\" 같은 가장 센 설정을 첫날 켭니다.** 첫 며칠은 하나하나 물어보는 상태로 씁니다. 무엇을 승인하는지 배우는 시간입니다.\n\n**`.env` 파일을 `@`로 붙입니다.** 비밀번호·열쇠가 든 파일입니다. 값이 필요하면 \"열쇠 이름만 넣어 둬\"라고 말합니다.\n\n**밖으로 나가는 일을 켜 둔 채 자리를 뜹니다.** 실제 사고입니다 — \"운영 데이터 건드리지 마\"를 지침 파일에만 적고 막는 장치가 없던 경우, 에이전트가 운영 데이터베이스를 지웠습니다. 말로 적은 규칙은 100%가 아니므로, 절대 안 되는 것은 자동 수락을 끄는 것으로 막습니다."}, {"title": "🔎 더 깊이", "md": "- 앱 안에서 `/help`를 치면 명령과 단축키 전체가 나옵니다. 외우지 말고 필요할 때 찾으세요.\n- 권한을 어디까지 열지는 설정 파일로 정해 둘 수 있습니다. <a class=\"xref\" href=\"#3\">Stage 3<\/a>의 지침·설정이 여기서 작동합니다.\n- 자동 수락으로도 못 막는 것을 기계적으로 강제하는 방법은 <a class=\"xref\" href=\"#8\">Stage 8<\/a>에서 다룹니다."}]}, {"file": "3-실전흐름3종.md", "id": "s5-3", "no": "3", "title": "세 가지 길만 외워 반복한다", "goals": ["새 기능·버그·마무리 세 길의 순서를 말할 수 있다", "버그를 \"고쳐 줘\" 대신 증상→원인→재현 테스트 순으로 시킬 수 있다", "하루 끝에 문서·스킬·커밋으로 닫을 수 있다"], "steps": ["새 기능 길 여섯 걸음을 본다", "버그 길 다섯 걸음을 본다", "마무리 길 네 걸음을 본다", "리뷰는 새 대화에 맡긴다"], "through": "매번 새로 생각하지 않는다. 세 가지 길만 외워서 반복한다.", "time": "60분", "need": ["Stage 3의 지침", "Stage 4.5의 저장소"], "head": "일하다 보면 결국 세 가지밖에 없습니다 — **새로 만들거나, 망가진 걸 고치거나, 오늘 한 일을 정리하거나.** 길을 셋만 정해 두면 \"이번엔 뭐라고 시키지?\"에 머리를 안 쓰고, 그 힘이 검증에 남습니다.", "secs": [{"title": "① 새 기능 길 여섯 걸음을 본다", "md": "| 순서 | 하는 일 | 왜 |\n|---|---|---|\n| 1 계획 | 무엇을 만들지 글로 (<a class=\"xref\" href=\"#5\" data-jump=\"s5-1\">1절<\/a>) | 혼자 정한 것을 드러내려고 |\n| 2 문서 | 계획을 파일로 남긴다 | 다음 세션이 이어받게 |\n| 3 테스트 먼저 | \"이게 되면 성공\"을 먼저 정한다 | ⭐ 합격선을 AI가 못 정하게 |\n| 4 구현 | 그제야 만든다 | 앞의 셋이 있으면 안 헤맨다 |\n| 5 리뷰 | 새 대화에게 트집을 잡게 한다 | 짠 세션은 자기를 옹호한다 |\n| 6 검증 | 내가 눈으로 본다 | \"통과\"는 \"됐다\"가 아니다 |\n\n**3번이 자리를 옮기면 안 됩니다.** 만든 뒤에 테스트를 만들면 AI는 이미 만든 것에 맞춰 시험지를 씁니다 — 답을 보고 문제를 내는 것과 같습니다 (<a class=\"xref\" href=\"#5\" data-jump=\"s5-4\">4절<\/a>)."}, {"title": "② 버그 길 다섯 걸음을 본다", "md": "\"이거 왜 안 되지? 고쳐 줘.\"라고 하면 AI는 눈에 보이는 증상만 가립니다. 사흘 뒤 같은 문제가 다른 얼굴로 돌아옵니다.\n\n| 순서 | 하는 일 | 요령 |\n|---|---|---|\n| 1 증상 | 무엇을 했더니 무엇이 나왔나 | 원인을 추측해 말하지 않는다 |\n| 2 분석 | AI가 관련 파일을 훑는다 | 아직 고치지 못하게 한다 |\n| 3 근본 원인 | \"왜 그렇게 됐나\"를 한 문장으로 | ⭐ 말 못 하면 아직 모르는 것 |\n| 4 재현 테스트 | 그 버그를 잡는 시험을 먼저 만든다 | 지금은 실패해야 정상 |\n| 5 고치고 검증 | 그 시험이 통과하나 본다 | 통과하면 다시 안 생긴다 |\n\n**\"고쳐 줘\"보다 \"왜 그런지부터 알려 줘\"가 빠릅니다.** 4번까지 하면 그 버그는 다시는 조용히 돌아오지 못합니다."}, {"title": "③ 마무리 길 네 걸음을 본다", "md": "그냥 창을 닫으면 오늘 배운 것이 오늘로 끝납니다. 내일의 나는 남이고, AI는 기억이 아예 없습니다.\n\n| 순서 | 하는 일 |\n|---|---|\n| 1 문서 갱신 | 오늘 정한 것을 지침 파일과 문서에 반영 |\n| 2 패턴 추출 | 세 번 이상 반복한 지시만 스킬로 |\n| 3 커밋 | 코드와 문서를 같이 (<a class=\"xref\" href=\"#4.5\">Stage 4.5<\/a>) |\n| 4 메모 | \"내일은 여기서부터\" 한 줄 |\n\n**기준은 세 번입니다.** 세 번 반복했으면 규칙이지 우연이 아닙니다. 규칙이 100개가 되면 아무도 관리하지 않으니 적고 날카롭게 둡니다."}, {"title": "④ 리뷰는 새 대화에 맡긴다", "md": "같은 대화에서 \"검토해 줘\"라고 하면 대체로 \"잘 됐습니다\"가 나옵니다. 사람도 자기 글의 오타를 못 봅니다.\n\n새 대화를 열고 **\"처음 보는 코드\"라고 못 박은 뒤** 시킵니다. 칭찬은 금지하고 문제만 짚게 합니다."}, {"title": "⚡ 따라 하기", "md": "1. 새 기능을 만들 때 아래를 붙이세요 — 걸음마다 멈춰야 내가 읽고 고칠 자리가 생깁니다. 계획이 오면 OK를 주고, 실패하는 테스트 화면이 보여야 다음으로 넘어갑니다.\n\n```\n새 기능을 만들 거야. 아래 여섯 걸음을 순서대로 하되, 각 걸음이 끝날 때마다 멈추고 내 확인을 받아.\n\n만들 기능: (한 줄로)\n\n1. 계획 — 새로 만들 파일, 고칠 파일, 네가 혼자 정한 것을 글로만. 코드 금지.\n2. 문서 — 내가 OK 하면 그 계획을 docs/ 아래 파일로 저장해 줘.\n3. 테스트 먼저 — \"됐다\"고 말할 수 있는 조건 3개를 테스트로 먼저 만들어 줘.\n   지금은 실패해야 정상이야. 실패하는 걸 보여 줘.\n4. 구현 — 그 테스트가 통과하도록 만들어 줘. 계획에 없는 파일은 건드리지 마.\n5. 리뷰 — 바뀐 파일마다 무엇이 바뀌었는지 한국어로 요약해 줘.\n6. 검증 — 내가 화면에서 눈으로 확인할 목록 3개. ○/× 로 답할 수 있게.\n```\n\n2. 버그가 나면 증상만 적어 원인부터 캐게 하세요 — 내가 원인을 추측해 말하면 AI가 그쪽만 팝니다. 근본 원인 한 문장과 확인 방법이 돌아오고, 아직 코드는 바뀌지 않아야 합니다.\n\n```\n문제가 생겼어. 아직 고치지 마. 원인부터 찾아 줘.\n\n내가 한 일: (예 — 가입 화면에서 이메일을 넣고 '구독' 버튼을 눌렀다)\n기대한 것: (예 — \"구독 완료\" 문구가 뜬다)\n실제로 일어난 것: (예 — 화면이 하얗게 변했다)\n화면에 나온 글자 그대로:\n(에러 메시지를 요약하지 말고 통째로. 없으면 \"없음\")\n\n1. 관련 있어 보이는 파일과 흐름을 훑어 줘\n2. 근본 원인을 한 문장으로 — 확실하지 않으면 \"확실하지 않다\"고 말해\n3. 그 원인이 맞는지 확인할 방법을 알려 줘\n```\n\n3. 원인을 확인했으면 재현 테스트부터 시키세요 — 시험지가 지키고 있어야 그 버그가 조용히 돌아오지 못합니다. 빨간불 → 고침 → 초록불 순으로 보이고, 마지막에 지침 파일에 넣을 한 줄이 옵니다.\n\n```\n원인이 맞는 걸 확인했어. 이 순서로 해 줘.\n\n1. 이 버그를 잡아내는 테스트를 먼저 만들어 줘. 지금은 실패해야 정상이야. 실패하는 걸 보여 줘.\n2. 그 다음에 고쳐 줘. 범위는 최소한으로.\n3. 테스트가 통과하는 걸 보여 줘.\n4. 이번 일로 알게 된 것을 지침 파일에 넣을 한 줄로 정리해 줘.\n```\n\n4. 하루를 닫을 때 아래를 붙이세요 — 오늘 배운 것을 내일의 나와 AI에게 남기기 위해서입니다. 문서 수정, 스킬 제안(세 번 반복된 것만), 커밋 메시지, \"내일은 여기서부터\" 한 줄이 돌아와야 합니다.\n\n```\n오늘 작업을 마무리할게.\n\n1. 오늘 바뀐 것 중 문서나 지침 파일에 반영할 내용을 찾아 고쳐 줘\n2. 오늘 내가 세 번 이상 반복한 지시가 있나? 있으면 그것만 스킬로 만들자고 제안해 줘. 두 번 이하는 제안하지 마.\n3. 커밋 메시지를 한국어 한 줄로 — 무엇을 왜 바꿨는지\n4. \"내일은 여기서부터\" 한 줄을 메모로 남겨 줘\n```\n\n5. 리뷰는 새 대화를 열고 아래를 붙이세요 — 방금 짠 세션은 자기 선택을 옹호하기 때문입니다. \"OK\" 한 마디이거나, 파일·위치·고칠 방법 목록과 가장 위험한 하나가 돌아와야 합니다.\n\n```\n너는 이 코드를 처음 보는 사람이야. 누가 짰는지 모르고, 칭찬할 이유도 없어.\n최근에 바뀐 부분만 보고 아래 관점에서 문제만 짚어 줘.\n\n1. 실패했을 때 사용자에게 무엇이 보이나\n2. 빈 값·아주 긴 값·두 번 연속 누르기를 빠뜨리지 않았나\n3. 비밀번호나 열쇠 같은 값이 밖으로 새는 곳이 있나\n4. 여섯 달 뒤에 봐도 무슨 뜻인지 알 수 있나\n\n\"잘 짰다\"는 평가는 쓰지 마. 문제 없으면 \"OK\" 한 마디만.\n문제가 있으면 어느 파일 어느 부분인지와 고칠 방법을 한 줄씩. 마지막에 가장 위험한 하나를 골라 줘.\n```"}, {"title": "✅ 확인", "md": "- [ ] 계획이 대화가 아니라 파일로 남아 있나\n- [ ] 버그를 고치기 전에 근본 원인을 한 문장으로 들었나\n- [ ] 그 버그를 잡는 재현 테스트가 저장소에 남아 있나\n- [ ] 리뷰를 새 대화에서 시켰나"}, {"title": "📘 말 풀이", "md": "**리뷰(review)** — 만든 것을 다른 눈으로 다시 훑어 문제를 찾는 일. 여기서는 새 대화에게 시킵니다.\n\n**근본 원인(root cause)** — 증상 말고 진짜로 그렇게 만든 이유. \"화면이 하얗게 뜬다\"는 증상, \"구독자 목록이 비었을 때를 생각 안 했다\"가 근본 원인입니다.\n\n**스킬(skill)** — 자주 쓰는 지시를 파일 하나로 두고 이름으로 부르는 것. 만드는 법은 <a class=\"xref\" href=\"#3\" data-jump=\"s3-5\">Stage 3<\/a>에 있습니다."}, {"title": "⚠️ 함정", "md": "**원인을 내가 추측해서 알려 줍니다.** \"아마 데이터베이스 문제 같아\"라고 하면 AI는 그쪽만 팝니다. 증상만 말하세요.\n\n**잘 되면 마무리를 건너뜁니다.** 잘 될 때 남긴 기록이 가장 값이 큽니다. 망했을 때는 기록할 정신이 없습니다.\n\n**스킬을 욕심내서 열 개씩 만듭니다.** 세 번 반복된 것만. 나머지는 그때그때."}, {"title": "🔎 더 깊이", "md": "- 영어 자료에서는 이 흐름을 **plan → docs → TDD → implement → review → verify**로 부릅니다. 앱에서 `/`를 치면 걸음마다 준비된 명령이 나오고, 없으면 위 프롬프트를 스킬로 만들면 됩니다.\n- 리뷰를 다른 회사의 도구에게 한 번 더 시키는 방식이 흔하지만, 그 이득이 측정된 적은 없습니다. <a class=\"xref\" href=\"#7\" data-jump=\"s7-4\">Stage 7<\/a>에서 정직하게 다룹니다.\n- 이 세 흐름을 그대로 들고 <a class=\"xref\" href=\"#6\">Stage 6<\/a>으로 갑니다. 그때는 되돌릴 수 없는 일이 많아지므로 <a class=\"xref\" href=\"#5\" data-jump=\"s5-2\">2절<\/a>의 자동 수락 기준이 더 중요해집니다."}]}, {"file": "4-테스트.md", "id": "s5-4", "no": "4", "title": "테스트 — 왜 비개발자에게도 필요한가", "goals": ["내 서비스의 핵심 흐름 3~5개를 골라낼 수 있다", "실패하는 테스트를 먼저 쓰는 방식이 AI에게 잘 맞는 이유를 말할 수 있다"], "steps": ["AI가 속도를 올리면 불안정성도 같이 오", "전부 덮으려 하지 마세요", "실패하는 테스트를 먼저 쓰는 게 왜 AI"], "through": "AI에게 크게 시킬수록 잘못된 것도 빨리 퍼진다. 테스트가 그걸 잡는다.", "time": "50분", "need": ["Stage 3의 지침", "Stage 4.5의 저장소"], "head": "\"테스트는 개발자가 하는 거 아닌가요?\"\n아닙니다. **코드를 못 읽는 사람일수록 더 필요합니다.**\n\n우리는 코드를 못 읽습니다. 그래서 AI가 \"다 됐습니다\"라고 하면 확인할 방법이 없습니다.\n매번 브라우저를 열어서 하나하나 눌러 볼 수도 있습니다. 처음 며칠은 그렇게 합니다.\n그런데 기능이 다섯 개, 열 개가 되면 **매번 열 군데를 눌러 볼 수 없습니다.**\n\n테스트는 그 확인을 **기계가 대신하게 만드는 것**입니다.\n\n이 절을 건너뛰면 이런 일이 생깁니다.\n새 기능을 넣었더니 **어제까지 잘 되던 가입 화면이 조용히 죽습니다.**\nAI는 그걸 모릅니다. 나도 모릅니다. 손님이 압니다.", "secs": [{"title": "① AI가 속도를 올리면 불안정성도 같이 오른다", "md": "이게 이 절의 핵심 문장입니다.\n\nAI는 **증폭기**입니다. 잘 정리된 곳에서는 좋은 것을 크게 만들고,\n어수선한 곳에서는 **어수선함을 크게 만듭니다.**\n\n예전에는 하루에 파일 두 개를 고쳤습니다. 뭐가 깨졌는지 감으로 알았습니다.\n지금은 한 시간에 파일 열 개가 바뀝니다. **감으로는 못 따라갑니다.**\n\n그래서 속도가 올라간 만큼 **자동으로 확인해 주는 장치**가 있어야 합니다.\n없으면 증폭되는 것은 생산성이 아니라 혼돈입니다.\n\n> 참고로, AI 도구의 이득은 처음부터 곧장 오르지 않습니다.\n> **처음에는 오히려 떨어졌다가 나중에 오릅니다.** 배우는 값과 어수선함을 치우는 값이 먼저 나가기 때문입니다.\n> 첫 주에 \"이거 더 느린데?\"라고 느끼는 건 정상입니다. 그 구간을 테스트로 건너갑니다."}, {"title": "📘 말 풀이", "md": "- **테스트** — 이게 여전히 잘 도는지 **기계가 대신 확인해 주는 것**. 사람이 매번 손으로 눌러 보는 대신, 명령 한 줄로 전부 확인합니다. 통과하면 초록, 깨지면 빨강.\n- **핵심 흐름** — 손님이 돈을 내거나 서비스를 쓰기 위해 반드시 지나가는 길. 예를 들어 \"가입 → 메일 받기 → 수신 거부\"가 하나의 핵심 흐름입니다.\n- **실패하는 테스트 먼저** — 만들기 전에 시험지를 먼저 쓰는 방식. 시험지는 처음엔 당연히 빨간불입니다. 그 빨간불이 초록이 되면 다 된 것입니다."}, {"title": "② 전부 덮으려 하지 마세요 — 핵심 흐름 3~5개면 충분합니다", "md": "여기서 대부분이 두 번째로 망합니다. **\"제대로 하려면 다 덮어야지\"**라고 생각하다가 시작도 못 합니다.\n\n1인이 지킬 수 있는 선은 이 정도입니다.\n\n| 개수 | 무엇을 거나 | 예시 (뉴스레터 서비스) |\n|---|---|---|\n| 1 | 손님이 **들어오는** 길 | 이메일을 넣고 구독 버튼을 누르면 구독자로 저장된다 |\n| 2 | 손님이 **값을 받는** 길 | 발송을 누르면 구독자에게 메일이 나간다 |\n| 3 | 손님이 **나가는** 길 | 수신 거부를 누르면 다음부터 안 온다 |\n| 4 (있으면) | **돈이 오가는** 길 | 결제하면 유료 구독자가 된다 |\n| 5 (있으면) | **잘못 눌렀을 때** | 이메일 형식이 틀리면 친절한 안내가 뜬다 |\n\n이 다섯이 초록이면 서비스는 살아 있는 것입니다. 나머지가 깨져도 손님은 대체로 모릅니다.\n**커버리지 90% 같은 목표는 1인에게 과합니다.** 회사에서도 그건 팀이 있어야 지킵니다."}, {"title": "③ 실패하는 테스트를 먼저 쓰는 게 왜 AI에게 특히 잘 맞나", "md": "이유는 세 가지입니다.\n\n**① 합격선을 AI가 정하지 못하게 됩니다.**\n만든 뒤에 테스트를 만들라고 하면 AI는 **이미 만든 것에 맞춰서** 시험지를 씁니다.\n답을 보고 문제를 내는 것과 같습니다. 100점은 나오지만 아무 의미가 없습니다.\n\n**② AI에게 \"끝\"을 알려 줄 수 있습니다.**\nAI는 \"이 정도면 됐다\"를 스스로 판단하면 대체로 너무 일찍 멈추거나 너무 멀리 갑니다.\n빨간불이 초록으로 바뀌는 순간이 **다툴 여지 없는 끝**입니다.\n\n**③ 코드를 못 읽어도 대화할 수 있습니다.**\n\"3번 테스트가 아직 빨간불이야\"라고만 말하면 AI가 알아서 그 부분을 팝니다.\n코드 이야기를 한 마디도 안 하고 방향을 잡을 수 있습니다. 비개발자에게 이게 가장 큽니다.\n\n**한 가지 주의** — 테스트가 초록이라고 \"됐다\"는 뜻은 아닙니다.\n초록불은 **\"안 터졌다\"**만 말합니다. **\"손님에게 메일이 갔다\"**는 말해 주지 않습니다.\n그래서 절 6에서 **내 눈으로 보는 확인**을 한 겹 더 얹습니다."}, {"title": "⚠️ 함정", "md": "- **전부 덮으려다 하나도 못 만든다** — 3개로 시작합니다. 사고가 날 때마다 하나씩 늘립니다. 그러면 시험지가 **내가 실제로 겪은 실패의 역사**가 됩니다.\n- **만든 다음에 테스트를 만든다** — 순서가 뒤집히면 시험지가 아니라 도장이 됩니다.\n- **실패하는 걸 안 보고 넘어간다** — 처음에 빨간불을 **눈으로 확인**해야 합니다. 안 그러면 아무것도 확인하지 않는 가짜 테스트가 통과하고 있는 걸 모릅니다.\n- **\"잘 되는지\" 같은 애매한 기준을 쓴다** — ○/×로 답할 수 있어야 테스트입니다.\n- **깨진 테스트를 지워서 초록으로 만든다** — 가장 위험한 습관입니다. 깨진 테스트는 **고쳐야 할 것을 알려 주는 알람**입니다. 알람을 끄지 마세요.\n- **실제 메일이 진짜로 나가는 테스트를 만든다** — 테스트는 하루에 수십 번 돕니다. 실제 발송·실제 결제는 **가짜로 바꿔서** 테스트합니다. AI에게 \"실제로 보내지 말고 흉내만 내게 해 줘\"라고 말하면 됩니다."}, {"title": "⚡ 따라 하기", "md": "**① 핵심 흐름 3개 고르기 — 코드 이야기 없이**\n\n```\n나는 코드를 못 읽어. 지금 만들고 있는 서비스에서\n\"이게 깨지면 손님이 바로 알아채는\" 핵심 흐름 3개를 골라 줘.\n\n조건:\n- 손님 입장에서 쓴다. \"가입 → 메일 받기 → 수신 거부\" 같은 식으로.\n- 각 흐름마다 \"무엇을 하면 무엇이 나와야 하는가\"를 한 줄씩.\n- 기준은 ○/× 로 답할 수 있게. \"잘 된다\" 같은 표현 금지.\n- 3개를 넘기지 마. 지금은 적게 시작하는 게 맞아.\n```\n\n**② 실패하는 테스트를 먼저 만들게 하기**\n\n```\n방금 고른 핵심 흐름 3개를 테스트로 만들어 줘. 아직 기능은 만들지 마.\n\n조건:\n- 지금은 3개 다 실패해야 정상이야. 실패하는 걸 나에게 직접 보여 줘.\n- 실제로 메일을 보내거나 결제를 하지 마. 흉내만 내게 만들어 줘.\n- 테스트 이름은 한국어로, 무엇을 재는지 읽으면 알 수 있게.\n- 마지막에 \"테스트 돌리는 명령 한 줄\"을 알려 줘. 그걸 내가 외울 거야.\n```\n\n**③ 초록으로 만들기**\n\n```\n이제 이 테스트 3개가 통과하도록 만들어 줘.\n\n- 테스트를 고쳐서 통과시키지 마. 기능을 만들어서 통과시켜.\n- 하나씩 해. 1번이 초록이 되면 멈추고 나에게 보여 줘. 그 다음에 2번.\n- 다 끝나면 테스트 결과 화면을 그대로 보여 줘.\n```\n\n**④ 사고가 날 때마다 한 개씩 늘리기**\n\n```\n방금 이런 문제를 겪었어: (무슨 일이 있었는지 한 줄)\n\n이 문제가 다시 생기면 바로 빨간불이 뜨도록 테스트를 하나만 추가해 줘.\n- 기존 테스트는 건드리지 마\n- 이 테스트가 원래 문제 상황에서 실패하는지 먼저 확인시켜 줘\n```\n\n**⑤ 매번 돌리는 습관 만들기 — 하루 두 번**\n\n```\n아침에 작업 시작할 때, 그리고 커밋하기 직전에 테스트를 돌려 줘.\n빨간불이 하나라도 있으면 새 작업을 시작하지 말고 나에게 먼저 알려 줘.\n```"}, {"title": "✅ 확인", "md": "- [ ] **테스트가 하나라도 도나** (명령 한 줄로 실행되나)\n- [ ] 그 테스트를 **만들기 전에** 만들었나 (순서를 지켰나)\n- [ ] 처음에 **빨간불을 눈으로** 봤나\n- [ ] 지금 화면에 **초록불**이 보이나\n- [ ] 테스트가 **핵심 흐름 3~5개**에 걸려 있나 (전부 덮으려 하지 않았나)\n- [ ] 테스트가 **실제로 메일을 보내거나 결제를 하지는** 않나\n- [ ] 테스트 돌리는 명령을 **내가 외우고 있나**"}, {"title": "🔎 더 깊이", "md": "- 실패하는 테스트를 먼저 쓰는 방식은 영어로 **TDD (test-driven development)**라고 부릅니다. 이 단어로 찾으면 자료가 아주 많습니다.\n- 손님이 실제로 화면을 누르는 것까지 흉내 내는 테스트는 **E2E (end-to-end) 테스트**라고 합니다. 핵심 흐름 3~5개는 여기에 거는 것이 가장 값이 큽니다.\n- \"AI가 속도를 올리면 불안정성도 같이 오른다\"는 것은 매년 나오는 개발 현장 조사에서 반복해서 관찰되는 내용입니다. 검색할 말 — **DORA** 보고서.\n- 커밋할 때마다 테스트를 자동으로 돌리게 만들 수 있습니다. 그건 Stage 7(배포)에서 다룹니다. 지금은 **손으로 돌리는 것으로 충분합니다.**\n\n> **다음으로 이어지는 것** — 지금 만든 테스트는 지금은 가짜 데이터로 돕니다.\n> **Stage 6에서 진짜 데이터베이스를 붙이면**, 이 테스트가 그대로 \"데이터베이스 연결이 살아 있나\"를 지키는 파수꾼이 됩니다. 그때 새로 만들지 않아도 되게, 지금 이름을 잘 지어 두세요."}]}, {"file": "5-막혔을때.md", "id": "s5-5", "no": "5", "title": "막혔을 때 — 오류를 푸는 순서", "goals": ["에러가 났을 때 무엇을 먼저 붙일지 순서대로 할 수 있다", "같은 에러가 세 번 반복될 때 방식을 바꿀 수 있다"], "steps": ["순서", "에러를 요약하지 말고 그대로 붙입니다", "로그를 먼저 붙입니다", "원인부터 묻습니다", "④ 같은 에러가 세 번 반복되면", "되돌리기가 가장 빠른 복구일 때가 많습니", "사람에게 물어야 하는 순간"], "through": "같은 에러가 세 번 반복되면 네 번째도 실패한다. 방식을 바꾼다.", "time": "50분", "need": ["Stage 3의 지침", "Stage 4.5의 저장소"], "head": "막히는 것은 실력 문제가 아닙니다. **정상입니다.**\n다만 푸는 데는 순서가 있습니다. 순서를 모르면 두 시간이 이틀이 됩니다.\n\n막혔을 때 사람들이 하는 일은 대체로 똑같습니다.\n같은 말을 조금씩 바꿔 가며 **다섯 번, 열 번 다시 시킵니다.**\n그리고 두 시간 뒤에 처음보다 더 망가진 상태가 됩니다.\n\n이유는 하나입니다. **막혔을 때 무엇을 바꿔야 하는지 모르기 때문입니다.**\n프롬프트를 바꿔야 할 때가 있고, 대화를 바꿔야 할 때가 있고, 아예 되돌려야 할 때가 있고,\n사람에게 물어야 할 때가 있습니다. 이 절은 그 갈림길을 알려 줍니다.", "secs": [{"title": "① 순서 — 위에서부터 차례로", "md": "| 순서 | 하는 일 | 걸리는 시간 |\n|---|---|---|\n| 1 | **에러를 그대로 붙인다** (요약 금지) | 1분 |\n| 2 | **로그를 먼저 붙인다** | 3분 |\n| 3 | 원인부터 묻는다 — 고치지 못하게 한다 | 5분 |\n| 4 | ⭐ **같은 에러 세 번이면 방식을 바꾼다** | — |\n| 5 | **되돌린다** — 종종 가장 빠른 복구 | 2분 |\n| 6 | **사람에게 묻는다** | — |"}, {"title": "② 에러를 요약하지 말고 그대로 붙입니다", "md": "가장 흔한 실수입니다. 그리고 가장 값이 비쌉니다.\n\n**\"뭔가 파일 못 찾겠다는 에러가 떠\"** ← 이렇게 말하면 AI는 **다른 걸 고칩니다.**\n빨간 글자 안에는 파일 이름, 줄 번호, 어디서 시작해서 어디로 흘렀는지가 전부 들어 있습니다.\n그게 **범인의 주소**입니다. 요약하면 주소가 지워집니다.\n\n무섭게 생겼다고 줄이지 마세요. 길수록 좋습니다. **통째로 붙입니다.**\n앱 안에서 `!`로 명령을 돌리면 결과가 그대로 들어갑니다(절 2). 그게 가장 정확합니다.\n\n> 붙일 때 딱 하나만 봅니다 — **비밀번호나 열쇠 같은 값이 섞여 있지 않은지.**\n> 그런 값만 `***`로 바꾸고 나머지는 그대로 둡니다."}, {"title": "③ 로그를 먼저 붙입니다", "md": "에러 메시지가 아예 안 뜨는 경우도 많습니다. 화면이 하얗거나, 눌러도 아무 반응이 없거나.\n이럴 때는 **로그**를 봅니다.\n\n- 브라우저 화면이 이상하면 → **브라우저 콘솔**\n- 서버 쪽이 이상하면 → **터미널이나 앱에 찍히는 글**\n\n\"에러가 안 뜨는데요\"라고 말하기 전에 **로그부터 붙입니다.**\nAI가 추측으로 시작하느냐, 증거로 시작하느냐가 여기서 갈립니다."}, {"title": "④ 원인부터 묻습니다 — 아직 고치지 못하게", "md": "\"고쳐 줘\"라고 하면 AI는 **증상만** 가립니다. 화면은 정상으로 보이고 원인은 그대로 남습니다.\n사흘 뒤 다른 얼굴로 돌아옵니다.\n\n**\"왜 그런지부터 알려 줘. 아직 고치지 마.\"**\n이 한 줄이 오히려 더 빠릅니다.\n\n그리고 AI가 원인을 한 문장으로 말하지 못하면 **아직 모르는 것입니다.**\n모르는 채로 고치게 두면 여기저기 쑤시다가 멀쩡한 곳까지 망칩니다."}, {"title": "⑤ ⭐ ④ 같은 에러가 세 번 반복되면 — 방식을 바꿉니다", "md": "이 절에서 가장 중요한 문장입니다.\n\n> **같은 방식으로 네 번째를 시키면, 네 번째도 실패합니다.**\n\n세 번 실패했다는 것은 **AI가 잘못 알고 있는 것이 있다는 뜻**입니다.\n그리고 그 잘못된 생각은 지금 대화 안에 계속 남아 있습니다. 그래서 계속 같은 데로 돌아옵니다.\n\n세 번째 실패를 세면, 시키던 것을 멈추고 아래 셋 중 하나로 **바꿉니다.**\n\n| 바꾸는 법 | 언제 | 무엇을 하나 |\n|---|---|---|\n| **새 대화를 연다** | 대화가 길어졌을 때 (가장 흔함) | 대화를 닫고 새로 엽니다. **에러와 파일만** 새로 붙입니다. 앞의 실패한 시도는 가져가지 않습니다 |\n| **더 작게 쪼갠다** | 한 번에 여러 개를 시키고 있었을 때 | \"이 중에서 첫 번째 한 개만 해 줘\"로 줄입니다 |\n| **아예 다른 접근을 시킨다** | 방향 자체가 틀린 것 같을 때 | \"지금 방식은 세 번 실패했어. **완전히 다른 방법 두 가지**를 제안해 줘\"라고 시킵니다 |\n\n**새 대화가 가장 자주 정답입니다.** 대화가 길어지면 AI의 그릇이 차서 판단이 흐려지고,\n게다가 앞에서 실패한 시도들이 그대로 남아 계속 그쪽으로 끌어당깁니다.\n**대화를 버리는 것은 지는 게 아닙니다.** 가장 싼 복구입니다."}, {"title": "⑥ 되돌리기가 가장 빠른 복구일 때가 많습니다", "md": "30분 동안 고치다가 더 망가졌다면, **고치려 하지 말고 되돌립니다.**\n\nStage 4.5에서 만든 저장소가 여기서 값을 합니다.\n커밋해 둔 지점으로 돌아가면 **30분 전의 멀쩡한 상태**가 그대로 돌아옵니다.\n그리고 이번엔 더 작게 쪼개서 다시 시킵니다.\n\n30분 넘게 같은 데서 헤매고 있다면 이걸 먼저 떠올리세요.\n**\"되돌리면 얼마나 잃지?\"** — 대부분 답은 \"30분\"입니다. 그런데 계속 고치면 세 시간을 잃습니다.\n\n되돌리는 세 가지 방법(아직 커밋 안 함 / 커밋했는데 안 밀었음 / 이미 밀었음)은 Stage 4.5에 있습니다.\n**날린 것 같을 때도 대개 살릴 수 있습니다.** 지레 포기하지 마세요."}, {"title": "⑦ 사람에게 물어야 하는 순간", "md": "AI에게 계속 물어봐야 소용없는 자리가 있습니다. 이 셋입니다.\n\n| 이런 신호가 오면 | 왜 AI로 안 되나 | 어디로 |\n|---|---|---|\n| **내 계정·내 결제·내 승인**이 막혔다 (가입 거절, 심사 반려, 카드 등록 실패) | AI는 내 계정 안을 못 봅니다. 그 회사만 압니다 | 그 서비스의 고객센터 |\n| **돈·계약·법**이 걸렸다 (환불 규정, 개인정보 처리, 세금) | AI 답은 참고용입니다. 틀리면 **내가 책임집니다** | 해당 전문가 |\n| **똑같은 증상이 남에게도 있나**가 궁금하다 | 최근에 생긴 문제는 AI가 모를 수 있습니다 | 에러 메시지를 그대로 검색 · 그 도구의 공식 문서·이슈 목록 |\n\n**세 번 반복 + 새 대화 + 쪼개기까지 다 해 봤는데도 안 되면**, 그때는 사람 쪽입니다.\n그 상태로 다섯 번을 더 시켜도 결과는 같습니다."}, {"title": "📘 말 풀이", "md": "- **에러 메시지** — 무언가 잘못됐을 때 화면에 뜨는 빨간 글자. 안에 **파일 이름과 줄 번호**가 들어 있어서, 이게 곧 범인의 주소입니다. **요약하면 주소가 사라집니다.**\n- **로그** — 프로그램이 도는 동안 자기가 무엇을 했는지 계속 적어 두는 일기. 에러가 안 떠도 로그에는 남아 있는 경우가 많습니다.\n- **되돌리기** — 저장해 둔 지점으로 코드를 통째로 돌리는 것. Stage 4.5에서 만든 저장소가 있어야 됩니다. **가장 빠른 복구입니다.**"}, {"title": "⚠️ 함정", "md": "- **에러를 내 말로 바꿔서 전한다** — AI가 다른 걸 고칩니다. 그대로 붙이세요.\n- **네 번째, 다섯 번째를 같은 대화에서 계속 시킨다** — 세 번에서 끊습니다.\n- **원인을 내가 추측해서 알려 준다** — \"아마 데이터베이스 문제 같아\"라고 하면 AI는 그쪽만 팝니다. **증상과 에러만** 주세요.\n- **되돌리기를 실패라고 생각한다** — 되돌리기는 안전벨트입니다. 안전벨트를 맸다고 운전을 못하는 게 아닙니다.\n- **막힌 채로 자동 수락을 켠다** — 가장 위험합니다. 막혔을 때 AI는 이것저것 쑤셔 봅니다. 그걸 자동으로 승인하면 멀쩡한 곳까지 망가집니다. **막혔을 때는 오히려 끕니다.**\n- **에러 메시지에 든 비밀 값을 그대로 어딘가에 붙여 넣는다** — 열쇠·비밀번호가 섞였는지 한 번만 훑고 `***`로 가립니다."}, {"title": "⚡ 따라 하기", "md": "**① 에러가 떴을 때 — 이 틀 그대로**\n\n```\n에러가 났어. 아직 고치지 마.\n\n내가 한 일: (예 — 구독 버튼을 눌렀다)\n기대한 것: (예 — \"구독 완료\"가 떠야 한다)\n실제로 일어난 것: (예 — 화면이 하얗게 됐다)\n\n에러 메시지 (요약 안 하고 그대로 붙임):\n--- 여기서부터 ---\n(빨간 글자를 통째로 붙여 넣습니다. 줄이지 말고 전부.)\n--- 여기까지 ---\n\n먼저 이것만 해 줘:\n1. 이 에러가 무슨 뜻인지 비개발자 말로 두 줄\n2. 범인일 가능성이 가장 높은 파일과 그 이유\n3. 그게 맞는지 확인할 방법 한 가지\n아직 코드는 고치지 마.\n```\n\n**② 에러가 안 뜰 때 — 로그부터**\n\n```\n에러 메시지는 안 뜨는데 동작이 이상해.\n\n증상: (무엇을 눌렀더니 무엇이 안 되는지)\n\n먼저 어디를 봐야 로그가 나오는지 알려 줘.\n- 브라우저에서 볼 것\n- 앱이나 터미널에서 볼 것\n각각 어떻게 여는지 클릭 순서로 알려 줘. 나는 개발자가 아니야.\n로그를 가져오면 그때 원인을 찾자.\n```\n\n**③ 세 번 실패했을 때 — 새 대화에 이걸 붙입니다**\n\n```\n지금부터 새로 시작할게. 앞의 대화는 없다고 생각해.\n\n문제: (한 줄)\n지금까지 세 번 시도했고 다 실패했어. 시도한 방법은 이랬어:\n1. (첫 번째 시도)\n2. (두 번째 시도)\n3. (세 번째 시도)\n\n에러 메시지 (그대로):\n--- 여기서부터 ---\n(붙여 넣기)\n--- 여기까지 ---\n\n부탁:\n- 위 세 가지와는 **다른 방향**의 원인 후보 2개를 먼저 말해 줘\n- 그중 확인이 더 쉬운 것부터 확인 방법을 알려 줘\n- 아직 고치지 마. 방향부터 정하자.\n```\n\n**④ 더 작게 쪼개기**\n\n```\n지금 시킨 게 너무 컸던 것 같아.\n이 작업을 3개 이하로 쪼개 줘. 각각 따로 확인할 수 있는 단위로.\n그리고 첫 번째 것만 해 줘. 나머지는 손대지 마.\n```\n\n**⑤ 되돌리기 — 30분 넘게 헤맬 때**\n\n```\n30분 넘게 같은 데서 막혔어. 되돌리는 걸 검토하자.\n\n1. 마지막으로 잘 돌아가던 커밋이 언제인지 알려 줘\n2. 그때로 돌아가면 내가 잃는 게 정확히 무엇인지 목록으로\n3. 되돌리는 명령을 알려 줘. 실행은 내가 확인한 다음에 해.\n```"}, {"title": "✅ 확인", "md": "- [ ] 에러를 **요약하지 말고 그대로** 붙여 봤나\n- [ ] 에러가 안 뜰 때 **로그를 먼저** 붙였나\n- [ ] \"고쳐 줘\"보다 **\"왜 그런지부터 알려 줘\"**를 먼저 써 봤나\n- [ ] 같은 에러가 **세 번** 반복됐을 때 **무엇을 바꿔야 하는지** 아나 (새 대화 / 쪼개기 / 다른 접근)\n- [ ] **새 대화를 열어** 다시 시작해 봤나\n- [ ] 30분 넘게 막혔을 때 **되돌리기를 떠올렸나**\n- [ ] 막혀 있는 동안 **자동 수락이 꺼져** 있나"}, {"title": "🔎 더 깊이", "md": "- 같은 실패를 계속 반복하지 않고 방식을 바꾸는 장치를 영어로 **circuit breaker**라고 부릅니다. 사람에게도 그대로 적용됩니다.\n- 문제를 감으로 찍지 않고 순서대로 좁혀 가는 방법은 **systematic debugging**으로 찾으면 자료가 많습니다.\n- 되돌리기 세 가지 방법과, 날린 줄 알았던 것을 되찾는 방법은 **Stage 4.5**에 있습니다. 막히기 전에 한 번 읽어 두면 막혔을 때 손이 먼저 움직입니다.\n- 자주 겪는 에러는 원인이 정해져 있는 경우가 많습니다. 세 번 이상 만난 에러는 **지침 파일에 한 줄로 적어 두세요.** 다음부터 AI가 알아서 피합니다."}]}, {"file": "6-검증.md", "id": "s5-6", "no": "6", "title": "AI가 쓴 것을 검증한다", "goals": ["AI가 쓴 코드를 그대로 받지 않고 확인하는 네 가지를 걸 수 있다", "«수락한 사람이 책임진다»가 무슨 뜻인지 말할 수 있다"], "steps": ["통과했습니다는 됐습니다가 아닙니다", "검증 4종", "AI는 증폭기입니다"], "through": "AI가 초안을 쓰고, 사람이 수락한다. 수락한 사람이 책임진다.", "time": "50분", "need": ["Stage 3의 지침", "Stage 4.5의 저장소"], "head": "세계의 회사들이 AI 코딩을 몇 년 굴려 본 뒤, 서로 다른 말로 같은 곳에 닿았습니다.\n결국 한 문장으로 모입니다.\n\n> ### **\"AI가 초안을 쓰고, 사람이 수락한다. 수락한 사람이 책임진다.\"**\n\nAI에게 시키는 순간, 우리는 **글쓴이에서 편집자로** 자리를 옮깁니다.\n편집자는 글을 직접 쓰지 않지만, 신문에 나간 글이 틀리면 **편집자가 책임집니다.**\n\n이건 겁주려는 말이 아니라 **자리를 정확히 알려주는 말**입니다.\n\"AI가 그렇게 했는데요\"는 손님 앞에서도, 법 앞에서도 통하지 않습니다.\n\n이 절을 건너뛰면 두 가지가 생깁니다.\n하나는 안 되는 걸 됐다고 믿는 것. 다른 하나는 **비밀번호가 밖으로 새는 것.**\n둘 다 손님이 먼저 압니다.", "secs": [{"title": "① \"통과했습니다\"는 \"됐습니다\"가 아닙니다 — 증거는 두 겹", "md": "| 겹 | 무엇이 확인되나 | 누가 확인하나 | 신호 세기 |\n|---|---|---|---|\n| **1겹** | **안 터졌다** | 테스트·검사 도구 (절 4) | 약함 — AI가 짠 것을 AI가 채점 |\n| **2겹** | **맞게 됐다** | ⭐ **내 눈** | 강함 — 밖에서 온 증거 |\n\n초록불은 \"코드가 안 터졌다\"만 말합니다. **\"구독자에게 메일이 갔다\"는 말해 주지 않습니다.**\n둘은 완전히 다른 말인데, 화면에는 똑같이 초록으로 뜹니다.\n\n우리는 코드를 못 읽습니다. 그래서 **밖에서 온 증거가 유일한 신뢰 근거**입니다.\n내 받은편지함을 직접 엽니다. 메일이 왔나, 제목이 안 깨졌나, 링크를 눌러 보니 진짜 열리나, 수신 거부가 되나.\n\n**AI의 \"완료했습니다\"는 증거가 아니라 주장입니다.**"}, {"title": "② 검증 4종 — 이 넷만 하면 됩니다", "md": "### ① 실패하는 테스트를 먼저 (절 4)\n\n합격선을 AI가 정하지 못하게 하는 장치입니다. 만들기 전에 시험지를 씁니다.\n빨간불이 초록으로 바뀌는 순간이 **다툴 여지 없는 끝**입니다.\n\n### ② 코드 검사 · 의존성 경보 · 시크릿 스캔 — 기계가 훑게 한다\n\n우리가 못 읽는 것을 기계가 대신 훑습니다. 세 가지를 켜 둡니다.\n\n| 무엇 | 무엇을 잡나 | 어디서 |\n|---|---|---|\n| **코드 검사** | 위험한 코드 모양 (남이 내 데이터를 훔칠 수 있는 구멍 등) | 저장소에 켜는 스위치 하나 |\n| **의존성 경보** | 내가 가져다 쓰는 남의 부품에서 나중에 발견된 구멍 | 저장소가 알아서 알림을 보내 줌 |\n| **시크릿 스캔** | 비밀번호·열쇠가 실수로 코드에 섞여 올라간 것 | 커밋할 때 자동 검사 |\n\n셋 다 **한 번 켜 두면 계속 지켜 줍니다.** 켜는 것은 Stage 4.5에서 만든 저장소 설정에서 합니다.\n특히 **시크릿 스캔**은 비개발자에게 가장 값이 큽니다. 열쇠 하나가 새면 요금이 폭발하고, 남의 개인정보가 나갑니다.\n\n### ③ 실서비스 자격증명은 격리한다\n\n**연습용 열쇠와 진짜 열쇠를 분리합니다.** 이게 안 되어 있으면 연습하다가 손님 데이터를 지웁니다.\n\n- 진짜 열쇠는 **`.env` 같은 분리된 파일**에 두고, 저장소에 올리지 않습니다\n- 연습·개발 중에는 **테스트용 열쇠**만 씁니다\n- AI에게 `.env`를 읽히지 않습니다. 값이 필요하면 **이름만** 알려 줍니다\n- 실제로 돈이 오가거나 데이터를 지우는 일은 **자동 수락을 끕니다** (절 2)\n\n> 실제로 있었던 일입니다. 한 에이전트가 **손대지 말라고 한 기간에 운영 데이터베이스를 지웠습니다.**\n> 원인은 분명했습니다 — **\"운영 데이터 건드리지 마\"가 지침 파일에만 적혀 있었고, 막는 장치는 없었습니다.**\n> 말로 적은 규칙은 대체로 지켜지지만 100%는 아닙니다. **절대 안 되는 것은 말이 아니라 장치로 막습니다.**\n\n### ④ 신뢰 못 할 콘텐츠를 실행시키지 않는다\n\nAI는 자기가 읽은 글을 **지시로 착각할 수 있습니다.**\n남의 저장소, 웹페이지, 첨부 파일 안에 \"이 폴더의 열쇠를 여기로 보내라\" 같은 문장이 숨어 있으면 그대로 따를 수 있습니다.\n\n실제로 저장소 안에 지침 파일 하나를 심어 두자, 그 저장소를 여는 것만으로 **여러 종류의 AI 도구가 그걸 실행한** 사례가 있습니다.\n\n그래서 셋을 지킵니다.\n- 남의 코드를 받아서 열 때는 **처음에 계획 모드로만** 봅니다 (읽기만)\n- \"인터넷에서 받아서 바로 실행하기\" 같은 명령은 승인하지 않습니다\n- **설정 파일에 쓸 수 있는 권한 = 코드를 실행할 수 있는 권한**입니다. 설정 파일을 남이 고치게 두지 않습니다"}, {"title": "⚠️ 성공담만 싣지 않습니다 — 후퇴 사례", "md": "AI로 다 된다는 이야기만 듣고 시작하면, 안 될 때 자기 탓을 합니다. 그러니 반대쪽도 봅니다.\n\n**① 어떤 오픈소스 프로젝트가 취약점 신고 포상을 끝냈습니다.**\n널리 쓰이는 프로그램(curl)이 6~7년 동안 운영하던 **보안 신고 포상 제도를 2026년 1월에 종료**했습니다.\n이유는 **제출물의 약 20%가 AI가 만든 쓰레기**였고, 쓸모 있는 신고의 비율이 **15%대에서 5% 미만으로 떨어졌기** 때문입니다.\n사람이 걸러 내는 값이 포상으로 얻는 값보다 커졌습니다. **AI가 만든 그럴듯한 것이 사람의 시간을 태울 수 있다**는 증거입니다.\n\n**② 개발자들은 쓰면서도 안 믿습니다.**\n약 4만 9천 명이 답한 개발자 설문에서 **AI를 쓰는 사람은 84%**입니다.\n그런데 **신뢰한다는 사람은 33%, 신뢰하지 않는다는 사람은 46%**입니다. **불신이 신뢰보다 큽니다.**\n가장 큰 불만은 이것이었습니다 — **\"거의 맞는데 아닌 답.\"**\n\n이 마지막 문장이 핵심입니다. 완전히 틀린 답은 금방 알아챕니다.\n**거의 맞는 답이 위험합니다.** 그래서 검증이 필요한 것입니다."}, {"title": "③ AI는 증폭기입니다 — 이득은 나중에 옵니다", "md": "숫자로 \"AI를 쓰면 몇 % 빨라진다/느려진다\"고 말하는 자료는 서로 어긋납니다. 그런 수치는 쓰지 않겠습니다.\n지금 정직하게 말할 수 있는 것은 이 둘입니다.\n\n> **AI는 증폭기입니다.** 정리된 곳에서는 좋은 것을 키우고, 어수선한 곳에서는 어수선함을 키웁니다.\n> **이득은 처음에 오히려 떨어졌다가 나중에 오릅니다.** 배우는 값과 정리하는 값이 먼저 나갑니다.\n\n첫 주에 \"이거 더 느린데?\"라고 느끼는 것은 실패가 아니라 **정상 구간**입니다.\n그 구간을 빨리 지나가게 해 주는 것이 이 절의 4종입니다."}, {"title": "📘 말 풀이", "md": "- **의존성** — 내가 만든 것이 기대고 있는 **남이 만든 부품**. 직접 짜지 않고 가져다 씁니다. 그 부품에서 나중에 구멍이 발견되면 내 서비스도 뚫립니다. 그래서 경보를 켜 둡니다.\n- **시크릿** — 비밀번호, 열쇠(API key)처럼 밖에 나가면 안 되는 값. **코드에 절대 적지 않고** 분리된 파일에 둡니다.\n- **자격증명** — 어떤 서비스에 \"나는 나다\"라고 증명하는 열쇠 묶음. **연습용과 진짜용을 반드시 나눠 씁니다.**"}, {"title": "⚠️ 함정", "md": "- **초록불을 보고 끝냈다고 생각한다** — 1겹만 본 것입니다. 내 눈으로 보는 2겹이 남았습니다.\n- **짠 대화에게 검토를 시킨다** — 자기 선택을 옹호합니다. **새 대화**에서 \"처음 보는 코드\"라고 못 박고 시킵니다.\n- **`.env`를 AI
